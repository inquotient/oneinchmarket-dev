apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-rest
spec:
# whenDeleted를 Delete로 설정하면 pod가 지워지면 pvc도 같이 지워지도록 할 수 있다. 
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
  serviceName: kafka-rest-headless
  replicas: 1
  selector:
    matchLabels:
      app: kafka-rest
  template:
    metadata:
      labels:
        app: kafka-rest
    spec:
      setHostnameAsFQDN: true
      containers:
        - name: kafka-rest
          image: confluentinc/cp-kafka-rest:latest
          ports:
            - containerPort: 8082
              protocol: TCP
          env:
            - name: KAFKA_REST_BOOTSTRAP_SERVERS
              value: kafka-br-headless.dev.svc.cluster.local:9092
  volumeClaimTemplates:
    - metadata:
        name: pvc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 20Gi