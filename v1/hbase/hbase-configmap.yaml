apiVersion: v1
kind: ConfigMap
metadata:
  name: hbase-configmap
data:
  core-site.xml: |
    <configuration>
      <property>
        <name>fs.defaultFS</name>
        <value>hdfs://hadoop-rbf-router-headless.dev.svc.cluster.local:8888</value>
      </property>
      <property>
        <name>hadoop.security.authentication</name>
        <value>simple</value>
      </property>
      <property>
        <name>hadoop.security.authorization</name>
        <value>false</value>
      </property>
    </configuration>

  hbase-site.xml: |
    <configuration>
      <!-- HBase가 저장할 HDFS 경로 (자기 리전) -->
      <property>
        <name>hbase.rootdir</name>
        <value>hdfs://hadoop-rbf-router-headless.dev.svc.cluster.local:8888/hbase</value>
      </property>

      <!-- 분산 모드 -->
      <property>
        <name>hbase.cluster.distributed</name>
        <value>true</value>
      </property>

      <!-- ZooKeeper (별도 운영 중) -->
      <property>
        <name>hbase.zookeeper.quorum</name>
        <value>zookeeper-headless.dev.svc.cluster.local:2181</value>
      </property>
      <property>
        <name>hbase.zookeeper.property.clientPort</name>
        <value>2181</value>
      </property>

      <!-- 메타/시스템 테이블 기본값들 (필요 시 조정) -->
      <property>
        <name>hbase.wal.provider</name>
        <value>filesystem</value>
      </property>
      <property>
        <name>hbase.regionserver.handler.count</name>
        <value>60</value>
      </property>

      <!-- (선택) UI 바인딩 -->
      <property>
        <name>hbase.master.info.port</name>
        <value>16010</value>
      </property>
      <property>
        <name>hbase.security.authentication</name>
        <value>simple</value>
      </property>
      <property>
        <name>hbase.zookeeper.quorum</name>
        <value>zookeeper-headless.dev.svc.cluster.local</value>
      </property>
      <property>
        <name>hbase.zookeeper.property.clientPort</name>
        <value>2181</value>
      </property>

      <property>
        <name>hbase.master.hbck.chore.interval</name>
        <value>3600000</value>
      </property>

      <property>
        <name>hbase.unsafe.regionserver.hostname.disable.master.reversedns</name>
        <value>true</value>
      </property>
    </configuration>
