apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hive-metastore
spec:
# whenDeleted를 Delete로 설정하면 pod가 지워지면 pvc도 같이 지워지도록 할 수 있다. 
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
  serviceName: hive-metastore-headless
  replicas: 3
  selector:
    matchLabels:
      app: hive-metastore
  template:
    metadata:
      labels:
        app: hive-metastore
    spec:
      setHostnameAsFQDN: true
      containers:
      - name: hive-metastore
        image: apache/hive:4.2.0
        command:
          - bash
          - -lc
          - |
            cd /opt/hive/lib
            curl -L -O https://repo1.maven.org/maven2/org/postgresql/postgresql/42.7.8/postgresql-42.7.8.jar
            /entrypoint.sh
        ports:
        - containerPort: 9083
          protocol: TCP
        - containerPort: 10000
          protocol: TCP
        - containerPort: 10002
          protocol: TCP
        env:
        - name: SERVICE_NAME
          value: "metastore"
        - name: DB_DRIVER
          value: "postgres"
        - name: METASTORE_DB_USER
          value: "hive_metastore"
        - name: METASTORE_DB_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: hive-metastore-configmap
              key: hive-metastore-db-password
        - name: HADOOP_CONF_DIR
          value: /opt/hadoop/etc/hadoop
        volumeMounts:
        - name: hive-metastore-config
          mountPath: /opt/hive/conf/hive-site.xml
          subPath: hive-site.xml
        - name: hadoop-config
          mountPath: /opt/hadoop/etc/hadoop/core-site.xml
          subPath: core-site.xml
        - name: hadoop-config
          mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml
          subPath: hdfs-site.xml
      volumes:
        - name: hive-metastore-config
          configMap:
            name: hive-metastore-configmap
            items:
              - key: hive-metastore-config
                path: hive-site.xml
        - name: hadoop-config
          configMap:
            name: hadoop-configmap
            items:
              - key: core-site.xml
                path: core-site.xml
              - key: hdfs-site.xml
                path: hdfs-site.xml
      securityContext:
        runAsUser: 0
        runAsGroup: 0
  volumeClaimTemplates:
    - metadata:
        name: pvc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 20Gi