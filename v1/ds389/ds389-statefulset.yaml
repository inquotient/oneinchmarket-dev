apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ds389
spec:
  # whenDeleted를 Delete로 설정하면 pod가 지워지면 pvc도 같이 지워지도록 할 수 있다. 
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
  serviceName: ds389-headless
  replicas: 1
  selector:
    matchLabels:
      app: ds389
  template:
    metadata:
      labels:
        app: ds389
    spec:
      setHostnameAsFQDN: true
      containers:
        - name: ds389
          image: 389ds/dirsrv:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          ports:
            - containerPort: 3389
              protocol: TCP
            - containerPort: 3636
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ds389-configmap
          volumeMounts:
            - name: pvc
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: pvc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 20Gi
