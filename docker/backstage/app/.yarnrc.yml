nodeLinker: node-modules

# ★ create-app 이 넣어 준 공급망 방어다 — 지우지 말 것.
#   갓 올라온 패키지(3일 미만)를 거부한다. 탈취된 배포판은 대개 몇 시간 안에
#   드러나므로, 나이 게이트 하나가 그 창을 닫는다.
npmMinimalAgeGate: 3d
npmPreapprovedPackages:
  - '@backstage/*'

yarnPath: .yarn/releases/yarn-4.13.0.cjs

# ★ 이 호스트의 회선은 큰·긴 전송에서 끊긴다 — Trivy 가 이미지를 받다
#   `connection reset by peer` 로 죽던 것과 같은 부류다(Gotcha 132).
#   yarn 도 fetch 단계에서 같은 것을 맞았다:
#     YN0001: RequestError: ... ssl3_read_bytes:tls alert bad record mac
#   기본값(재시도 3 · 동시 50)으로는 완주하지 못한다. 재시도를 늘리고
#   동시 연결을 줄여 **끊길 확률 자체를 낮춘다**.
httpRetry: 10
httpTimeout: 600000
networkConcurrency: 8
