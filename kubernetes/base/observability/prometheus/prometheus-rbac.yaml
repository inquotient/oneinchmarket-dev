# INFRA-601 해소 — 메트릭 관측이 전무했다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus
  labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, nodes/proxy, services, endpoints, pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus
  labels: {app.kubernetes.io/name: prometheus, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: prometheus}
subjects:
  # namespace 는 "default" 로 둔다 — kustomize 네임스페이스 변환기가
  # ClusterRoleBinding subject 의 "default" 만 오버레이 네임스페이스로
  # 바꾼다. 실제 값을 박아두면 다른 오버레이에서 바인딩이 빗나간다.
  - {kind: ServiceAccount, name: prometheus, namespace: default}
