# Data Prepper 2.16.0 — OpenSearch 의 수집·처리 계층.
#
# ★ 무엇을 대체하고 무엇을 대체하지 **못하는가** (실측으로 확인했다):
#   대체한다 — Filebeat -> Elasticsearch 직접 쓰기 전부.
#              노드 수집은 **이미 있던 otel-agent 의 filelog** 가 맡고
#              (그 데몬셋은 `/var/log/pods/*/*/*.log` 를 전부 읽고 있다),
#              otel-gateway 가 OTLP 로 여기에 넘긴다. 새 에이전트는 없다.
#   대체 못 한다 — ① **TCP·syslog source 가 없다**(Zeek 5141 · Suricata 5140)
#                  ② **아웃바운드 HTTP 요청 + 실패 분기 프로세서가 없다**
#                     (Logstash `http` 필터의 tag_on_request_failure 등가물).
#                     그 경로가 하필 **과금 DLQ** 라 손대면 매출이 샌다(Gotcha 31).
#   그래서 Logstash 를 완전히 없애지 않고 **축소**한다 — 과금 다리와 TCP 수신만
#   남기고, 그 결과물은 OpenSearch 로 직접 쓰지 않고 **여기 http source 로 넘긴다**.
#   그러면 Logstash 에 opensearch 출력 플러그인을 설치할 필요가 없다
#   (우리 Logstash 는 Elastic 배포판 9.5.3 이라 그 플러그인의 동작이 미확인이다).
apiVersion: v1
kind: ConfigMap
metadata:
  name: data-prepper-config
  labels: {app.kubernetes.io/name: data-prepper, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
data:
  data-prepper-config.yaml: |
    ssl: false
    # 서버 API(4900) — 상태·메트릭. 메시 안이고 NetworkPolicy 가 좁힌다.
    serverPort: 4900
    metricRegistries: [Prometheus]

  pipelines.yaml: |
    # ── ① 컨테이너 로그 ────────────────────────────────────────
    #   otel-agent(filelog) -> otel-gateway -> 여기.
    #   Filebeat 이 하던 일을 그대로 받는다.
    otel-logs-pipeline:
      workers: 2
      delay: 3000
      source:
        otel_logs_source:
          port: 21892
          ssl: false
      processor:
        # 인덱스 이름에 쓸 네임스페이스를 리소스 속성에서 꺼낸다.
        # ★ 없으면 "unknown" 으로 둔다 — 빈 문자열이면 인덱스 이름이 깨진다.
        - add_entries:
            entries:
              - key: /oim_ns
                value_expression: '/resource/attributes/k8s@namespace@name'
                overwrite_if_key_exists: true
      sink:
        - opensearch:
            hosts: ["https://opensearch-headless:9200"]
            username: ingest
            # ★ 평문 비밀번호를 ConfigMap 에 두지 않는다. Data Prepper 의
            #   pipelines.yaml 은 환경변수 치환을 하지 않으므로(AWS Secrets
            #   확장 외에는 없다) initContainer 가 자리표시자를 바꾼다 —
            #   ranger-usersync·OpenMeter 와 같은 방식이다(Gotcha 26).
            password: __OPENSEARCH_INGEST_PASSWORD__
            index: "logs-%{yyyy.MM.dd}"
            # ★ 단일 노드라 복제본 0 이 아니면 클러스터가 yellow 로 묶인다
            #   (Gotcha 14·34). 인덱스 템플릿은 ism-setup Job 이 넣는다.
            insecure: false
            cert: /certs/ca.crt

    # ── ② SIEM 이벤트 ──────────────────────────────────────────
    #   Kafka 의 keycloak-events · falco-alerts. Logstash 에서 옮겨 온다.
    #   ★ group_id 를 Logstash 것과 다르게 준다 — 같으면 전환 중에
    #     양쪽이 오프셋을 나눠 가져 한쪽이 이벤트를 잃는다.
    siem-pipeline:
      workers: 1
      delay: 3000
      source:
        kafka:
          bootstrap_servers: ["kafka-headless:9092"]
          topics:
            - name: keycloak-events
              group_id: data-prepper-siem
              serde_format: json
            - name: falco-alerts
              group_id: data-prepper-siem
              serde_format: json
      sink:
        - opensearch:
            hosts: ["https://opensearch-headless:9200"]
            username: ingest
            # ★ 평문 비밀번호를 ConfigMap 에 두지 않는다. Data Prepper 의
            #   pipelines.yaml 은 환경변수 치환을 하지 않으므로(AWS Secrets
            #   확장 외에는 없다) initContainer 가 자리표시자를 바꾼다 —
            #   ranger-usersync·OpenMeter 와 같은 방식이다(Gotcha 26).
            password: __OPENSEARCH_INGEST_PASSWORD__
            index: "siem-%{yyyy.MM.dd}"
            insecure: false
            cert: /certs/ca.crt

    # ── ③ 축소된 Logstash 가 넘겨 주는 것 ──────────────────────
    #   alerts · zeek · suricata · api-usage-dlq · api-usage-quarantine.
    #   Logstash 의 http 출력이 `format => json_batch` 로 배열을 보낸다 —
    #   Data Prepper 의 http source 는 **JSON 배열만** 받는다(객체 하나를
    #   보내면 400 이다). Alertmanager 가 직접 이 포트로 오지 못하는 이유가
    #   그것이다(webhook 페이로드가 객체다).
    legacy-ingest-pipeline:
      workers: 1
      delay: 3000
      source:
        http:
          port: 2021
          path: /log/ingest
          ssl: false
      processor:
        - add_entries:
            entries:
              - key: /oim_target
                value_expression: '/target_index'
                overwrite_if_key_exists: false
      sink:
        - opensearch:
            hosts: ["https://opensearch-headless:9200"]
            username: ingest
            # ★ 평문 비밀번호를 ConfigMap 에 두지 않는다. Data Prepper 의
            #   pipelines.yaml 은 환경변수 치환을 하지 않으므로(AWS Secrets
            #   확장 외에는 없다) initContainer 가 자리표시자를 바꾼다 —
            #   ranger-usersync·OpenMeter 와 같은 방식이다(Gotcha 26).
            password: __OPENSEARCH_INGEST_PASSWORD__
            # Logstash 가 붙여 보내는 target_index 를 그대로 쓴다.
            index: "${/oim_target}-%{yyyy.MM.dd}"
            insecure: false
            cert: /certs/ca.crt
