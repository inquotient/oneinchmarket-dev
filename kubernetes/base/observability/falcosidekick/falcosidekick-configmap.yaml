apiVersion: v1
kind: ConfigMap
metadata:
  name: falcosidekick-config
  labels:
    app.kubernetes.io/name: falcosidekick
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
data:
  config.yaml: |
    # Falcosidekick Configuration
    # Falco 이벤트를 Elasticsearch + Slack으로 라우팅

    debug: false
    customfields:
      cluster: oneinchmarket
      environment: dev

    # ★ elasticsearch 출력을 걷어냈다 — Elasticsearch 를 철거했다(§9-1).
    #   알림은 아래 kafka 출력 하나로 간다: falco-alerts 토픽 ->
    #   Data Prepper(kafka source) -> OpenSearch siem-*.
    #   ★★ 그냥 지우면 **커버리지가 줄어든다** — 옛 elasticsearch 출력은
    #     minimumpriority 가 `warning` 인데 kafka 는 `error` 였다.
    #     그래서 kafka 쪽을 warning 으로 낮춰 맞췄다(아래).

    slack:
      webhookurl: ""
      minimumpriority: "error"
      messageformat: |
        *Priority*: {{ .Priority }}
        *Rule*: {{ .Rule }}
        *Output*: {{ .Output }}
        *Namespace*: {{ index .OutputFields "k8s.ns.name" }}
        *Pod*: {{ index .OutputFields "k8s.pod.name" }}
        *Container*: {{ index .OutputFields "container.name" }}

    # ★ Logstash 의 SIEM 파이프라인이 이 토픽을 구독한다.
    #
    #   이 절은 처음부터 있었지만 **동작한 적이 없다.** Deployment 가
    #   `-c /etc/falcosidekick/config.yaml` 을 주지 않아 이 파일 자체가
    #   읽히지 않았기 때문이다(§8-35). 그래서 falco-alerts 토픽의 오프셋이
    #   0 이었고 Logstash 는 구독만 한 채 아무것도 받지 못했다.
    #
    #   ★ 임계값이 ES 출력과 다르다 — 여기는 error 이상, ES 는 warning 이상.
    #     의도된 것인지 확인되지 않았다. 상관분석 대상을 넓히려면 warning 으로
    #     맞춰야 하고, Kafka 를 고심각도 전용 경로로 둘 것이면 그대로 둔다.
    kafka:
      hostport: "kafka-headless:9092"
      topic: "falco-alerts"
      # ★ error -> warning. 걷어낸 elasticsearch 출력이 warning 이었으므로
      #   여기를 낮추지 않으면 warning 등급 알림이 조용히 사라진다.
      minimumpriority: "warning"

    webui:
      url: ""
