apiVersion: apps/v1
kind: Deployment
metadata:
  name: falcosidekick
  labels:
    app.kubernetes.io/name: falcosidekick
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falcosidekick
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: falcosidekick
      securityContext:
        runAsNonRoot: true
        runAsUser: 1234
        runAsGroup: 1234
        fsGroup: 1234
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: falcosidekick
          image: docker.io/falcosecurity/falcosidekick:2.35.0
          # ★ 설정 경로를 명시해야 한다.
          #
          #   이미지 엔트리포인트는 /app 에서 `./falcosidekick` 이고, 인자가
          #   없으면 **작업 디렉터리의 ./config.yaml** 을 찾는다. 아래
          #   volumeMounts 는 /etc/falcosidekick/config.yaml 에 붙이므로
          #   그대로 두면 설정이 **한 번도 읽히지 않는다.**
          #
          #   증상이 거의 없다. 파드는 Running·Ready 이고 /ping 도 응답한다.
          #   유일한 단서는 기동 로그 한 줄이다:
          #       [INFO] : Enabled Outputs: []
          #   즉 Falco 가 보낸 런타임 알림을 받아서 **전부 버리고 있었다.**
          #   (실측 2026-09-04: falco-alerts 인덱스 0건)
          args:
            - "-c"
            - "/etc/falcosidekick/config.yaml"
          ports:
            - containerPort: 2801
              name: http
              protocol: TCP
          env:
            - name: ELASTICSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  # ★ ECK 가 `elastic` 사용자의 권위 있는 소유자다.
                  #   수기 `elasticsearch-secret` 은 낡아 401 을 준다 —
                  #   Falco 가 도는 순간 경보가 전부 거기서 버려졌다(§8-64).
                  name: elasticsearch-es-elastic-user
                  key: elastic
            - name: SLACK_WEBHOOKURL
              valueFrom:
                secretKeyRef:
                  name: falcosidekick-secret
                  key: slack-webhook-url
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          # startupProbe 가 없으면 livenessProbe 가 즉시 시작한다.
          startupProbe:
            httpGet:
              path: /ping
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/falcosidekick/config.yaml
              subPath: config.yaml
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: falcosidekick-config
