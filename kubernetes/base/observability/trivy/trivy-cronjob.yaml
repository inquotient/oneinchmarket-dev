# Trivy 정기 이미지 스캔 - 매주 월요일 06:00
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trivy-image-scan
  labels:
    app.kubernetes.io/name: trivy-image-scan
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  schedule: "0 6 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: trivy-image-scan
            app.kubernetes.io/component: observability
            app.kubernetes.io/part-of: oneinchmarket
        spec:
          serviceAccountName: trivy-scanner
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trivy
              image: mirror.gcr.io/aquasec/trivy:0.74.0
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  echo "=== OneinchMarket Weekly Image Scan ==="
                  echo "Scan date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

                  REPORT_FILE="/tmp/scan-report.json"
                  echo '{"scan_date":"'$(date -u +%Y-%m-%dT%H:%M:%SZ)'","results":[' > ${REPORT_FILE}

                  FIRST=true
                  kubectl get pods -o jsonpath='{range .items[*]}{range .spec.containers[*]}{.image}{"\n"}{end}{end}' \
                    | sort -u | while read img; do
                    if [ -z "$img" ]; then continue; fi
                    echo "--- Scanning: $img ---"
                    RESULT=$(trivy image --severity HIGH,CRITICAL --format json --quiet "$img" 2>/dev/null || echo '{}')
                    if [ "$FIRST" = true ]; then
                      FIRST=false
                    else
                      echo "," >> ${REPORT_FILE}
                    fi
                    echo "{\"image\":\"$img\",\"result\":${RESULT}}" >> ${REPORT_FILE}
                  done

                  echo ']}'  >> ${REPORT_FILE}

                  echo "--- Sending report to Elasticsearch ---"
                  curl -sf -X POST \
                    "https://opensearch-headless:9200/trivy-reports/_doc" \
                    -H "Content-Type: application/json" \
                    -u "admin:${ES_PASSWORD}" \
                    -d @${REPORT_FILE} \
                    --cacert /etc/elasticsearch/certs/ca.crt \
                    || echo "Warning: Failed to send report to ES"

                  echo "=== Scan completed ==="
              env:
                - name: ES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      # ★ ECK 가 권위 있는 소유자다(§8-64).
                      #   주 1회만 돌아 더 늦게 드러날 자리였다.
                      name: opensearch-secret
                      key: admin-password
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
