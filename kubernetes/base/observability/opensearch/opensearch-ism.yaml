apiVersion: v1
kind: ServiceAccount
metadata:
  name: opensearch-ism-setup
  labels: {app.kubernetes.io/name: opensearch-ism-setup, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-ism-setup
  labels: {app.kubernetes.io/name: opensearch-ism-setup, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
data:
  setup.sh: |
    #!/bin/sh
    set -eu
    OS="https://opensearch-headless:9200"
    C="curl -sk -u admin:${OPENSEARCH_ADMIN_PASSWORD} -H Content-Type:application/json"

    echo "[ism] OpenSearch 대기"
    i=0
    while [ $i -lt 60 ]; do
      # ★ -q 를 쓰지 말 것 — exit 코드를 못 보면 "응답 없음" 과 "자격 오류" 가
      #   구분되지 않는다(Gotcha 120).
      code=$($C -o /dev/null -w '%{http_code}' "$OS/_cluster/health" || echo 000)
      [ "$code" = "200" ] && break
      echo "[ism]   대기중 (HTTP $code)"
      i=$((i+1)); sleep 5
    done
    [ "$code" = "200" ] || { echo "[ism] OpenSearch 에 닿지 못했다 (마지막 HTTP $code)" >&2; exit 1; }

    # ── ① 인덱스 템플릿 — 복제본 0 ──────────────────────────────
    # ★ 단일 노드에서 복제본 1 은 배정될 곳이 없어 클러스터를 영구히 yellow 로
    #   묶는다(Gotcha 14·34). 템플릿이 없으면 OpenSearch 기본값 1 이 붙는다.
    echo "[ism] 인덱스 템플릿"
    $C -XPUT "$OS/_index_template/oim-logs" -d '{
      "index_patterns": ["logs-*","siem-*","alerts-*","zeek-*","suricata-*","falco-alerts-*","keycloak-events-*","api-usage-dlq-*","api-usage-quarantine-*","trivy-reports-*"],
      "priority": 500,
      "template": {
        "settings": {
          "number_of_shards": 1,
          "number_of_replicas": 0,
          "refresh_interval": "10s",
          "plugins.index_state_management.rollover_alias": null
        }
      }
    }' | head -c 200; echo

    # ── ② 이미 만들어진 인덱스에 한 번 더 민다 ──────────────────
    # ★ 패턴 여럿 중 **하나라도** 매칭되는 인덱스가 없으면 요청 전체가
    #   index_not_found_exception 으로 실패한다(실측: 아직 없는 alerts-* 하나
    #   때문에 나머지도 반영되지 않아 클러스터가 yellow 로 남았다).
    #   ignore_unavailable·allow_no_indices 를 함께 줄 것.
    # ★ 템플릿은 **생성 시점에만** 적용된다(Gotcha 34·107). 이 Job 이 돌기
    #   전에 만들어진 인덱스는 rep=1 그대로이므로 따로 눌러야 한다.
    echo "[ism] 기존 인덱스 복제본 정리"
    $C -XPUT "$OS/logs-*,siem-*,alerts-*,zeek-*,suricata-*/_settings?ignore_unavailable=true&allow_no_indices=true&expand_wildcards=open" \
      -d '{"index":{"number_of_replicas":0}}' | head -c 200; echo

    # ── ③ ISM 정책 — 보존 ───────────────────────────────────────
    # ★ ILM 과 다른 API 다. 그리고 ISM 의 rollover 도 **쓰기가 있어야**
    #   발동하므로, 쓰는 이가 사라진 인덱스는 영원히 지워지지 않는다
    #   (Gotcha 142 가 Elasticsearch 에서 실측한 것과 같은 성질이다).
    #   그래서 날짜 인덱스 + min_index_age 로 둔다 — rollover 에 기대지 않는다.
    echo "[ism] ISM 정책"
    # ★ 그냥 PUT 하면 두 번째부터 version_conflict_engine_exception 이다
    #   (실측). 이 Job 은 PostSync 훅이라 **동기화마다 다시 돈다**(Gotcha 58)
    #   — 멱등하지 않으면 매번 실패로 보인다. 이미 있으면 seq_no·primary_term
    #   을 붙여 갱신한다(그래야 정책을 고쳤을 때 반영도 된다).
    POL=$($C "$OS/_plugins/_ism/policies/oim-retention" 2>/dev/null || echo "")
    QS=""
    case "$POL" in
      *'"_seq_no"'*)
        # ★ sed 역참조(백슬래시1)를 쓰지 말 것 — 생성 경로를 거치면 조용히
        #   사라져 값이 빈 문자열이 된다(Gotcha 117). grep -o 로 뽑는다.
        sq=$(echo "$POL" | grep -o '"_seq_no":[0-9]*' | head -1 | cut -d: -f2)
        pt=$(echo "$POL" | grep -o '"_primary_term":[0-9]*' | head -1 | cut -d: -f2)
        QS="?if_seq_no=${sq}&if_primary_term=${pt}"
        echo "[ism]   기존 정책 갱신 (seq_no=$sq)"
        ;;
    esac
    $C -XPUT "$OS/_plugins/_ism/policies/oim-retention${QS}" -d '{
      "policy": {
        "description": "oneinchmarket 로그 보존 — 날짜 인덱스 기준, rollover 에 기대지 않는다",
        "default_state": "hot",
        "states": [
          {"name":"hot","actions":[],"transitions":[{"state_name":"delete","conditions":{"min_index_age":"14d"}}]},
          {"name":"delete","actions":[{"delete":{}}],"transitions":[]}
        ],
        "ism_template": [
          {"index_patterns":["logs-*","siem-*","alerts-*","zeek-*","suricata-*"],"priority":100}
        ]
      }
    }' | head -c 300; echo

    # ── ④ ISM 플러그인 자신의 설정 인덱스 ──────────────────────
    # ★ `.opendistro-ism-config` 는 ISM 플러그인이 스스로 만들고 **복제본 1**
    #   이 붙는다. 단일 노드에서는 배정될 곳이 없어 이것 하나로 클러스터가
    #   yellow 에 머문다(실측). 우리 템플릿은 `.` 로 시작하는 인덱스를 덮지
    #   않으므로 따로 눌러야 한다.
    echo "[ism] ISM 설정 인덱스 복제본"
    # ★ ISM 이 만드는 시스템 인덱스가 둘이다 — 설정(.opendistro-ism-config)과
    #   이력(.opendistro-ism-managed-index-history-*). 뒤엣것은 날짜마다 새로
    #   생기므로 한 번 눌러서는 끝나지 않는다 — 이 Job 이 PostSync 훅이라
    #   동기화마다 다시 도는 것이 그래서 유용하다. 템플릿으로도 덮어 둔다.
    $C -XPUT "$OS/_index_template/oim-ism-system" -d '{"index_patterns":[".opendistro-ism-managed-index-history-*"],"priority":600,"template":{"settings":{"number_of_replicas":0}}}' | head -c 150; echo
    $C -XPUT "$OS/.opendistro-ism-config,.opendistro-ism-managed-index-history-*/_settings?ignore_unavailable=true&allow_no_indices=true&expand_wildcards=open" -d '{"index":{"number_of_replicas":0}}' | head -c 150; echo
    echo "[ism] 결과"
    $C "$OS/_cat/indices?h=health,index,rep" | grep -v ' \.' || true
    # ★ 판정은 "명령이 200 을 줬다" 가 아니라 **yellow 가 사라졌는가** 다.
    st=$($C "$OS/_cluster/health" | sed 's/.*"status":"\([a-z]*\)".*/\1/')
    echo "[ism] 클러스터 상태: $st"
    [ "$st" = "green" ] || echo "[ism] 경고: green 이 아니다 — rep=1 인 인덱스가 남았는지 볼 것" >&2
---
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-ism-setup
  labels: {app.kubernetes.io/name: opensearch-ism-setup, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations:
    argocd.argoproj.io/hook: PostSync
    # Job 의 파드 템플릿은 불변이라 BeforeHookCreation 이 함께 있어야 한다(Gotcha 58).
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels: {app.kubernetes.io/name: opensearch-ism-setup, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket}
    spec:
      restartPolicy: OnFailure
      # ★ 전용 SA 를 준다 — default 로 두면 ambient 에서 신원이 없어
      #   AuthorizationPolicy 가 매칭되지 않는다(Gotcha 19).
      serviceAccountName: opensearch-ism-setup
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ism-setup
          image: docker.io/curlimages/curl:8.22.0
          command: ["/bin/sh", "/scripts/setup.sh"]
          env:
            - name: OPENSEARCH_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: opensearch-secret, key: admin-password}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits:   {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
      volumes:
        - name: scripts
          configMap: {name: opensearch-ism-setup}
