apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-config
  labels: {app.kubernetes.io/name: opensearch, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
data:
  opensearch.yml: |
    cluster.name: oneinchmarket-logs
    node.name: opensearch-0
    # 단일 노드다. 이 값이 없으면 부트스트랩 검사가 클러스터 구성을 요구한다.
    discovery.type: single-node
    network.host: 0.0.0.0
    path.data: /usr/share/opensearch/data

    # ★ 단일 노드에서 복제본은 배정될 곳이 없어 클러스터를 yellow 로 묶는다
    #   (Gotcha 14·34). ISM·인덱스 템플릿이 0 을 주지만, 템플릿이 없는
    #   즉석 인덱스가 생길 때를 대비해 클러스터 기본값도 눌러 둔다.
    #   ★ OpenSearch 에는 ECK 같은 "green 이 아니면 롤링 안 함" 이 없어
    #     ES 때만큼 치명적이지는 않지만, yellow 는 여전히 경보 소음이다.

    # ── transport 계층(노드 간) ────────────────────────────────
    plugins.security.ssl.transport.pemcert_filepath: /usr/share/opensearch/config/certs/tls.crt
    plugins.security.ssl.transport.pemkey_filepath: /usr/share/opensearch/config/certs/tls.key
    plugins.security.ssl.transport.pemtrustedcas_filepath: /usr/share/opensearch/config/certs/ca.crt
    # 단일 노드라 호스트명 검증이 얻는 것이 없고, StatefulSet 파드명·서비스명
    # 조합이 늘 때마다 SAN 을 고쳐야 한다.
    plugins.security.ssl.transport.enforce_hostname_verification: false
    plugins.security.ssl.transport.resolve_hostname: false

    # ── HTTP 계층(클라이언트) ──────────────────────────────────
    plugins.security.ssl.http.enabled: true
    plugins.security.ssl.http.pemcert_filepath: /usr/share/opensearch/config/certs/tls.crt
    plugins.security.ssl.http.pemkey_filepath: /usr/share/opensearch/config/certs/tls.key
    plugins.security.ssl.http.pemtrustedcas_filepath: /usr/share/opensearch/config/certs/ca.crt

    # ── 인가 ───────────────────────────────────────────────────
    # ★ DN 문자열이 인증서의 subject 와 정확히 일치해야 한다.
    #   opensearch-certs.yaml 의 commonName + subject.organizations 가 원천이다.
    plugins.security.authcz.admin_dn:
      - "CN=opensearch-admin,O=oneinchmarket"
    plugins.security.nodes_dn:
      - "CN=opensearch,O=oneinchmarket"

    plugins.security.allow_default_init_securityindex: true
    plugins.security.restapi.roles_enabled: ["all_access"]
    # 데모 설정으로 뜨는 것을 막는다. internal_users.yml 은 initContainer 가
    # Secret 의 비밀번호로 새로 쓴다(wazuh-indexer 와 같은 방식).
    plugins.security.allow_unsafe_democertificates: false

    # ★ 감사 로그는 지금 끈다. **켤 수 있다는 것이 요점이다** —
    #   Elastic Basic 에는 이 기능이 아예 없고 Enterprise 계약이 필요하다
    #   (§9-1). 켜는 조건은 SEC-3xx 가 검색 계층 감사를 요구할 때이고,
    #   그때 `type: internal_opensearch` 로 바꾸면 된다. 지금 켜면
    #   자기 자신에게 쓰면서 단일 노드 예산을 먹는다.
    plugins.security.audit.type: noop

    # ★ 성능 분석기를 opensearch.yml 로 끄지 말 것 — 3.x 에는
    #   `plugins.performance_analyzer.enabled` 키가 **없다**. 남겨 두면
    #   SettingsException 으로 **기동조차 하지 않는다**(실측):
    #     unknown setting [plugins.performance_analyzer.enabled]
    #   끄는 자리는 설정 파일이 아니라 환경변수
    #   DISABLE_PERFORMANCE_ANALYZER_AGENT_CLI 다 — StatefulSet 에 있다.

  # ★ 프로브를 매니페스트 인라인 셸로 쓰지 않는다. `exec.command` 안에
  #   curl + grep + 중첩 따옴표를 넣으면 YAML 과 셸의 따옴표 규칙이 겹쳐
  #   조용히 어긋난다(실제로 한 번 깨졌다). 파일로 빼면 한 겹만 남는다.
  #
  # ★ 이 프로브는 "포트가 열렸는가" 가 아니라 "클러스터가 답하는가" 를 본다
  #   (Gotcha 48·93). TCP 프로브는 보안 인덱스 초기화 전에도 통과해
  #   준비되지 않은 노드를 Ready 로 만든다.
  health.sh: |
    #!/bin/bash
    out="$(curl -sk --max-time 8 -u "admin:${OPENSEARCH_ADMIN_PASSWORD}" \
            https://localhost:9200/_cluster/health 2>/dev/null)" || exit 1
    # 단일 노드라 yellow 가 정상 범위다(Gotcha 14).
    case "$out" in
      *'"status":"green"'*|*'"status":"yellow"'*) exit 0 ;;
    esac
    # ★ 실패할 때 응답을 남긴다. 남기지 않으면 "왜 Ready 가 아닌가" 를
    #   파드 이벤트만으로 알 수 없다 — 401(자격)과 연결 실패는 처방이 다르다.
    echo "health check failed: ${out:-<응답 없음>}" >&2
    exit 1
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-render
  labels: {app.kubernetes.io/name: opensearch, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
data:
  # internal_users.yml 을 Secret 의 비밀번호로 렌더한다.
  # ★ 이미지에 딸려 오는 데모 사용자를 그대로 쓰지 않는다 — 비밀번호가
  #   공개되어 있어 인증을 켠 의미가 없어진다.
  #
  # ★ 이 스크립트를 매니페스트 인라인(`args: [...]`)으로 두지 않는다.
  #   YAML 블록 스칼라 안에서는 heredoc 종료 토큰도 함께 들여쓰기되는데
  #   bash 는 0열의 종료 토큰만 인식한다 — heredoc 이 끝나지 않아 스크립트가
  #   구문 오류로 죽고 **로그가 한 줄도 안 나온다**(wazuh 에서 겪었다).
  render.sh: |
    #!/bin/bash
    set -euo pipefail
    SRC=/usr/share/opensearch/config/opensearch-security
    DST=/security-config
    # ★ `cp -a` 를 쓰지 말 것 — emptyDir 을 fsGroup 으로 마운트하면 그 루트의
    #   타임스탬프를 바꿀 수 없어 `cp: preserving times for '/security-config/.':
    #   Operation not permitted` 로 죽는다(실측). 여기서 보존할 속성이 없다 —
    #   읽어서 쓰기만 하면 된다.
    cp -r "$SRC"/. "$DST"/
    HASH_SH=/usr/share/opensearch/plugins/opensearch-security/tools/hash.sh
    # ★ hash.sh 는 배너를 함께 찍는다 — 마지막 줄만 취한다.
    ADMIN_HASH="$(bash "$HASH_SH" -p "$OPENSEARCH_ADMIN_PASSWORD" | tail -1)"
    INGEST_HASH="$(bash "$HASH_SH" -p "$OPENSEARCH_INGEST_PASSWORD" | tail -1)"
    DASH_HASH="$(bash "$HASH_SH" -p "$OPENSEARCH_DASHBOARDS_PASSWORD" | tail -1)"
    {
      echo '---'
      echo '_meta:'
      echo '  type: "internalusers"'
      echo '  config_version: 2'
      echo ''
      echo 'admin:'
      printf '  hash: "%s"\n' "$ADMIN_HASH"
      echo '  reserved: true'
      echo '  backend_roles:'
      echo '  - "admin"'
      echo '  description: "oneinchmarket admin"'
      echo ''
      echo 'ingest:'
      printf '  hash: "%s"\n' "$INGEST_HASH"
      echo '  reserved: false'
      echo '  backend_roles:'
      echo '  - "admin"'
      echo '  description: "data-prepper 수집 계정"'
      echo ''
      echo 'kibanaserver:'
      printf '  hash: "%s"\n' "$DASH_HASH"
      echo '  reserved: true'
      echo '  description: "opensearch-dashboards 서비스 계정"'
    } > "$DST/internal_users.yml"
    echo "[render] internal_users.yml 생성 (사용자 3명)"
    grep -E '^(admin|ingest|kibanaserver):' "$DST/internal_users.yml"
    # ★ 해시가 비어 있으면 여기서 멈춘다. 빈 해시로도 파일은 만들어지고
    #   OpenSearch 는 그 사용자로 로그인을 못 하게 될 뿐이라 증상이 "자격 오류"
    #   로만 보인다 — 조용한 오설정보다 기동 거부가 낫다(Gotcha 86).
    test -n "$ADMIN_HASH"
    test -n "$INGEST_HASH"
    test -n "$DASH_HASH"
