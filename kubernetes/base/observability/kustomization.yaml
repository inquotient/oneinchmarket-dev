apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Elasticsearch (ECK Operator)
  - elasticsearch/elasticsearch.yaml
  # Kibana (ECK Operator)
  - kibana/kibana.yaml
  # Logstash
  - logstash/logstash-statefulset.yaml
  - logstash/logstash-headless.yaml
  - logstash/logstash-configmap.yaml
  # Filebeat
  - filebeat/filebeat-daemonset.yaml
  - filebeat/filebeat-configmap.yaml
  # Secrets
  - elasticsearch/elasticsearch-secret.enc.yaml

commonLabels:
  app.kubernetes.io/part-of: oneinchmarket

commonAnnotations:
  argocd.argoproj.io/sync-wave: "7"
