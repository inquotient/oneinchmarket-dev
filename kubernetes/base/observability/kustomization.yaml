apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Elasticsearch (ECK Operator)
  - elasticsearch/elasticsearch.yaml
  - elasticsearch/elasticsearch-ilm.yaml
  # Kibana (ECK Operator)
  - kibana/kibana.yaml
  # Logstash
  - logstash/logstash-statefulset.yaml
  - logstash/logstash-headless.yaml
  - logstash/logstash-configmap.yaml
  # Prometheus - 메트릭 (INFRA-601)
  - prometheus/prometheus-rbac.yaml
  - prometheus/prometheus-configmap.yaml
  - prometheus/prometheus-statefulset.yaml
  - prometheus/prometheus-headless.yaml
  # Loki - 로그 (OTLP 수집)
  - loki/loki-headless.yaml
  - loki/loki-configmap.yaml
  - loki/loki-statefulset.yaml
  # Tempo - 트레이스 (OTLP 수집)
  - tempo/tempo-headless.yaml
  - tempo/tempo-configmap.yaml
  - tempo/tempo-statefulset.yaml
  # OpenTelemetry Collector - agent(DaemonSet) + gateway(Deployment)
  - otel/otel-agent-rbac.yaml
  - otel/otel-agent-configmap.yaml
  - otel/otel-agent-daemonset.yaml
  - otel/otel-agent-service.yaml
  - otel/otel-gateway-service.yaml
  - otel/otel-gateway-configmap.yaml
  - otel/otel-gateway-deployment.yaml
  # Grafana - 대시보드
  - grafana/grafana-configmap.yaml
  - grafana/grafana-deployment.yaml
  - grafana/grafana-service.yaml
  # Filebeat
  - filebeat/filebeat-daemonset.yaml
  - filebeat/filebeat-configmap.yaml
  # Falco - Runtime Threat Detection
  - falco/falco-daemonset.yaml
  - falco/falco-configmap.yaml
  - falco/falco-rbac.yaml
  # Falcosidekick - Alert Routing
  - falcosidekick/falcosidekick-deployment.yaml
  - falcosidekick/falcosidekick-service.yaml
  - falcosidekick/falcosidekick-configmap.yaml
  # - falcosidekick/falcosidekick-secret.enc.yaml  # SOPS: re-enable after ArgoCD SOPS plugin setup
  # GlitchTip - 오류 추적 (ADR-036 ⓓ). web + worker
  - glitchtip/glitchtip-configmap.yaml
  - glitchtip/glitchtip-service.yaml
  - glitchtip/glitchtip-web-deployment.yaml
  - glitchtip/glitchtip-worker-deployment.yaml
  # Pyroscope - 지속 프로파일링. Sentry 대안(ADR-036 맥락)
  - pyroscope/pyroscope-configmap.yaml
  - pyroscope/pyroscope-headless.yaml
  - pyroscope/pyroscope-statefulset.yaml
  # Trivy - Weekly Image Scan
  - trivy/trivy-cronjob.yaml
  - trivy/trivy-rbac.yaml
  # Secrets
  # - elasticsearch/elasticsearch-secret.enc.yaml  # SOPS: re-enable after ArgoCD SOPS plugin setup

commonLabels:
  app.kubernetes.io/part-of: oneinchmarket

commonAnnotations:
  argocd.argoproj.io/sync-wave: "7"
