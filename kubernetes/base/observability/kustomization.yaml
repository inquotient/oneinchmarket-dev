apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Elasticsearch (ECK Operator)
  - elasticsearch/elasticsearch.yaml
  - elasticsearch/elasticsearch-ilm.yaml
  # Kibana (ECK Operator)
  - kibana/kibana.yaml
  # Logstash
  - logstash/logstash-statefulset.yaml
  - logstash/logstash-headless.yaml
  - logstash/logstash-configmap.yaml
  # Filebeat
  - filebeat/filebeat-daemonset.yaml
  - filebeat/filebeat-configmap.yaml
  # Falco - Runtime Threat Detection
  - falco/falco-daemonset.yaml
  - falco/falco-configmap.yaml
  - falco/falco-rbac.yaml
  # Falcosidekick - Alert Routing
  - falcosidekick/falcosidekick-deployment.yaml
  - falcosidekick/falcosidekick-service.yaml
  - falcosidekick/falcosidekick-configmap.yaml
  # - falcosidekick/falcosidekick-secret.enc.yaml  # SOPS: re-enable after ArgoCD SOPS plugin setup
  # Trivy - Weekly Image Scan
  - trivy/trivy-cronjob.yaml
  - trivy/trivy-rbac.yaml
  # Secrets
  # - elasticsearch/elasticsearch-secret.enc.yaml  # SOPS: re-enable after ArgoCD SOPS plugin setup

commonLabels:
  app.kubernetes.io/part-of: oneinchmarket

commonAnnotations:
  argocd.argoproj.io/sync-wave: "7"
