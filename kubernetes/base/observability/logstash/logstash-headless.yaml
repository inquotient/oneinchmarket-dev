apiVersion: v1
kind: Service
metadata:
  name: logstash-headless
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 5044
      targetPort: beats
      protocol: TCP
      name: beats
    # ADR-031 — L0 의 Suricata EVE JSON
    - port: 5140
      targetPort: suricata
      protocol: TCP
      name: suricata
    # ADR-031 — L0-Target 의 Zeek JSON
    - port: 5141
      targetPort: zeek
      protocol: TCP
      name: zeek
    # Alertmanager webhook
    - port: 5142
      targetPort: alerts
      protocol: TCP
      name: alerts
    - port: 9600
      targetPort: api
      protocol: TCP
      name: api
  selector:
    app.kubernetes.io/name: logstash
