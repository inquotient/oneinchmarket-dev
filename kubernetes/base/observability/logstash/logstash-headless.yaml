apiVersion: v1
kind: Service
metadata:
  name: logstash-headless
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 5044
      targetPort: beats
      protocol: TCP
      name: beats
    # ADR-031 — L0 의 Suricata EVE JSON
    - port: 5140
      targetPort: suricata
      protocol: TCP
      name: suricata
    # ADR-031 — L0-Target 의 Zeek JSON
    - port: 5141
      targetPort: zeek
      protocol: TCP
      name: zeek
    # Alertmanager webhook
    - port: 5142
      targetPort: alerts
      protocol: TCP
      name: alerts
    - port: 9600
      targetPort: api
      protocol: TCP
      name: api
  selector:
    app.kubernetes.io/name: logstash
---
# L0 랩(OPNsense)의 Suricata EVE JSON 을 받는 **유일한 도달 가능 경로**.
#
# ★ 왜 필요한가 — 2026-09-11 에 드러났다: `logstash-headless` 는 헤드리스
#   ClusterIP(`clusterIP: None`)라 **클러스터 밖에서 닿을 수 없다.** Zeek 은
#   `zeek-ship` 이 클러스터 *안*에 있어 CoreDNS 로 풀려 잘 됐지만, Suricata 는
#   발신자가 OPNsense 게스트(`l0-lan` 브리지, 10.77.0.0/24)라 파드 IP 도
#   클러스터 DNS 도 쓸 수 없다. 그래서 `suricata-*` 인덱스가 **0건**이었다.
#   과거에 데이터가 들어온 것은 `kubectl port-forward` 로 우회했기 때문이고,
#   그것은 파드를 재생성하면 조용히 끊긴다(§8-50 · Gotcha 12).
#
# ★★ `allow-logstash-access` 의 `ipBlock: 10.77.0.0/24` 규칙이 이 결함을
#   **가렸다** — 정책이 열려 있으니 경로가 있는 줄 알게 된다. 정책은 도달
#   가능성을 만들지 않는다.
#
# ★ NodePort 를 쓴다. servicelb 가 비활성이라 LoadBalancer 는 영원히
#   Pending 이다(Gotcha 7). 노드가 `l0-lan` 브리지에 10.77.0.190 으로 올라와
#   있으므로 OPNsense 는 그 주소로 보낸다.
#   ★★ OPNsense 쪽 syslog-ng 목적지 설정은 **이 레포 밖의 랩 상태**다
#     (§25 에 적었다) — 클러스터를 새로 세우면 다시 해야 한다.
apiVersion: v1
kind: Service
metadata:
  name: logstash-suricata
  labels: {app.kubernetes.io/name: logstash, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  type: NodePort
  # ★ 소스 IP 를 보존한다. 기본값 `Cluster` 는 SNAT 해서 도착 소스가 노드/파드
  #   IP 가 되고, 그러면 `allow-logstash-access` 의 `ipBlock: 10.77.0.0/24`
  #   규칙이 **매칭되지 않아** 정책이 조용히 막는다. 단일 노드라 `Local` 의
  #   단점(그 노드에 파드가 없으면 버림)이 성립하지 않는다.
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: logstash
  ports:
    - name: suricata
      port: 5140
      targetPort: 5140
      # 30000~32767 범위여야 한다. 고정해 두지 않으면 재생성마다 바뀌어
      # OPNsense 설정이 어긋난다.
      nodePort: 30514
      protocol: TCP
