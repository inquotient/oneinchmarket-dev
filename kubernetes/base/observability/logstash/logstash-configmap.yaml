apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-config
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
data:
  logstash.yml: |
    # Logstash 9.x 에서 http.host 가 제거되고 api.http.host 로 바뀌었다.
    #   Your settings are invalid. Reason: Setting "http.host" doesn't exist.
    api.http.host: "0.0.0.0"
    monitoring.enabled: false
    pipeline.workers: 2
    pipeline.batch.size: 125

  pipeline.conf: |
    input {
      # ★ beats 입력을 걷어냈다 — Filebeat 을 철거했기 때문이다.
      #   Beats >=7.13 은 OpenSearch 를 지원하지 않아 전환의 하드 블로커였는데
      #   (WSO2-OSS-MAPPING §9-1), 걷어내도 잃는 것이 없었다:
      #   otel-agent 가 **이미** /var/log/pods/*/*/*.log 를 전부 읽어
      #   otel-gateway 로 보내고 있었다(Filebeat 은 두 번째 전체 파이프라인이었다).
      #   지금 그 흐름은 otel-gateway -> Data Prepper -> OpenSearch 로 간다.

      # ★ SIEM(keycloak-events · falco-alerts) 입력도 걷어냈다 —
      #   Data Prepper 의 kafka source 가 맡는다(group_id=data-prepper-siem).
      #   ★ 걷어내기 전에 **그쪽이 실제로 소비하는지 확인했다**: Kafka 의
      #     consumer-groups 에 data-prepper-siem 이 등록되고 falco-alerts
      #     오프셋이 커밋되는 것, 그리고 OpenSearch siem-* 에 문서가 쌓이는 것.
      #     group_id 를 일부러 다르게 둔 덕에 전환 중 유실이 없었다.

      # ★ 과금 다리 — api-usage -> OpenMeter 수집 API
      #
      #   OpenMeter 는 **자기 토픽을 스스로 만들고 HTTP API 로만 수집한다.**
      #   우리 `api-usage` 토픽을 직접 읽지 않는다(§8-58). 그 사이를 잇는다.
      #   새 컴포넌트를 만들지 않고 이미 Kafka 를 소비하는 Logstash 를 쓴다.
      #
      #   ★ 위 kafka 입력에 토픽만 더하지 않고 **입력을 분리한다.**
      #     그쪽은 `codec => json` 이라 이벤트가 파싱되어 Logstash 필드
      #     (@timestamp·@version·tags)가 섞인다. OpenMeter 는 CloudEvents 를
      #     그대로 받아야 하므로 **원문을 손대지 않고 message 에 담아** 보낸다.
      #     Suricata 입력을 따로 둔 것과 같은 이유다.
      #
      #   ★ group_id 를 분리한다. SIEM 소비자와 오프셋을 공유하면 한쪽의
      #     재처리가 다른 쪽의 유실이 된다.
      kafka {
        bootstrap_servers => "kafka-headless:9092"
        topics => ["api-usage"]
        group_id => "logstash-openmeter-bridge"
        codec => plain
        consumer_threads => 1
        add_field => { "[@metadata][pipeline]" => "openmeter-bridge" }
      }

      # ★ Alertmanager webhook 수신 — 경보가 도착할 실제 장소.
      #   이 클러스터에는 Slack·SMTP 가 없다. 빈 receiver 를 두면 경보가
      #   조용히 사라지므로 Elasticsearch 에 남긴다(§8-63).
      #   Kibana 에서 `alerts-*` 로 본다.
      http {
        port => 5142
        codec => json
        add_field => { "[@metadata][pipeline]" => "alertmanager" }
      }

      # ADR-031 — L0(OPNsense) 의 Suricata EVE JSON
      #
      # ★ 왜 beats(5044) 가 아니라 별도 tcp 인가
      #   OPNsense 에 filebeat 패키지가 없다(실측: pkg 저장소에 beats·filebeat
      #   둘 다 없음). 대신 syslog-ng 가 기본으로 돌고 원격 타깃을 지원하므로
      #   그쪽으로 받는다. beats 프로토콜이 아니라 평문 스트림이다.
      #
      # ★ codec 을 json_lines 로 두지 않는다. syslog-ng 가 EVE JSON 앞에
      #   RFC5424 헤더를 붙여 줄 전체가 JSON 이 아니다. 헤더 제거는 filter 가
      #   한다 — 여기서 json 코덱을 쓰면 전부 _jsonparsefailure 가 되고
      #   그 실패는 태그로만 남아 조용히 유실된다.

      # ADR-031 — L0-Target 의 Zeek 프로토콜 로그
      #
      # ★ Suricata(5140) 와 달리 여기는 json_lines 다. 전송자가 Zeek 의 JSON
      #   한 줄을 그대로 보내기 때문에 syslog 헤더가 없다.
      #   전송자는 `zeek_log` 필드(conn·dns·http·ssl…)를 덧붙인다 — Zeek 의
      #   JSON 자체에는 어느 로그인지가 들어 있지 않다.
      #
      # ★ 왜 Zeek 가 L0-Target 에 있나 — OPNsense 저장소에 Zeek 패키지가
      #   없다(플러그인 210종 중 부재). Hyper-V 포트 미러링으로 OPNsense LAN
      #   어댑터를 복제해 L0-Target 의 두 번째 NIC(eth1)에 흘린다(§8-51).
      tcp {
        port => 5141
        codec => json_lines
        add_field => { "[@metadata][pipeline]" => "zeek" }
      }
    }

    filter {
      # ADR-031 — Suricata EVE JSON 정규화
      # ★ Suricata 파이프라인을 걷어냈다(2026-09-11). otel-gateway 의
      #   syslog 수신기로 옮겼다 — 그쪽은 RFC5424 를 네이티브로 판다
      #   (LOCAL-DEPLOYMENT §9-18). 옮긴 이유는 성능이 아니라 **이 경로가
      #   죽어 있었기** 때문이다: suricata-* 인덱스가 0건이었고, 원인은
      #   헤드리스 ClusterIP 라 클러스터 밖에서 닿을 수 없다는 것이었다(§25-2).
      #   ★ 엔진 로그를 버리지 않는 규칙(§8-33)과 EVE timestamp 를 관측
      #     시각으로 쓰는 규칙은 OTel 쪽 연산자로 그대로 옮겼다.

      # ADR-031 — Zeek 프로토콜 로그
      #
      # Suricata EVE 와 겹친다(둘 다 dns·http·tls 를 낸다). 의도된 중복이다 —
      # 같은 트래픽을 두 엔진이 어떻게 다르게 보는지 비교하는 것이 L0 랩의
      # 목적 중 하나다. 인덱스를 분리해 두면 나중에 한쪽을 걷어내기 쉽다.
      if [@metadata][pipeline] == "zeek" {
        mutate {
          add_field => { "[@metadata][target_index]" => "zeek" }
        }
        # Zeek 의 ts 는 epoch(초, 소수점) 이다. @timestamp 로 승격한다.
        if [ts] {
          date {
            match => ["ts", "UNIX"]
            target => "@timestamp"
            tag_on_failure => ["_zeek_dateparsefailure"]
          }
        }
      }

      # ★ 테넌트 없는 계량 이벤트 격리 — 계약이 요구하는 규칙이다.
      #
      #   게이트웨이는 JWT 클레임이 없으면 `subject` 에 `-` 를 넣는다.
      #   실재하지 않는 고객이므로 **청구하면 안 되고, 버려도 안 된다** —
      #   왜 테넌트가 없었는지 나중에 추적해야 하기 때문이다.
      #   OpenMeter 로 넘기지 않고 Elasticsearch 의 격리 인덱스에 남긴다.
      #
      #   실측(§8-60): 토큰 없는 요청 2건이 `subject: -` 로 OpenMeter 에
      #   그대로 저장됐다. 청구되지는 않았지만 집계에 섞였다.
      else if [@metadata][pipeline] == "openmeter-bridge" and [message] =~ /"subject":"-"/ {
        mutate {
          add_field => { "[@metadata][target_index]" => "api-usage-quarantine" }
          # ★ add_field 는 기존 필드에 **배열로 덧붙는다** — replace 여야 한다.
          replace => { "[@metadata][pipeline]" => "quarantine" }
          add_tag => [ "no_tenant" ]
        }
      }
      # ★★ 과금 다리 — 전달을 **필터**에서 한다. 출력이 아니다.
      #
      #   `http` **출력**은 실패를 파이프라인에 돌려주지 않는다. 재시도 후
      #   영구 실패하면 이벤트를 조용히 버리고 로그 한 줄만 남긴다.
      #   과금에서 그것은 **매출 누락**이고, 더 나쁜 것은 얼마나 잃었는지
      #   알 수 없다는 점이다.
      #
      #   `http` **필터**는 응답 코드를 이벤트에 실어 준다. 그러면 실패가
      #   분기 가능한 사건이 되어 dead-letter 로 보낼 수 있다.
      #
      #   ★ 원본 Kafka 토픽이 남아 있으므로 이벤트 자체는 소실되지 않는다.
      #     진짜 위험은 **오프셋이 전진해 다시 읽히지 않는 것**이다.
      #     DLQ 인덱스가 "무엇을 못 넣었는지" 의 기록이 된다.
      else if [@metadata][pipeline] == "openmeter-bridge" {
        http {
          url => "http://openmeter-api:80/api/v1/events"
          verb => "POST"
          body => "%{message}"
          body_format => "text"
          headers => { "Content-Type" => "application/cloudevents+json" }
          # 본문은 버린다. 성공 시 OpenMeter 는 204(본문 없음)다.
          target_body => "[@metadata][om_body]"
          # 일시적 오류는 여기서 재시도한다. 그래도 실패하면 DLQ 로 간다.
          # ★ `retryable_codes` 는 **출력 플러그인 전용**이다. 필터에 쓰면
          #   Unknown setting 으로 기동하지 않는다.
          automatic_retries => 3
          # ★ 이 플러그인은 **연결 실패와 비-2xx 응답 둘 다** 이 태그를 붙인다.
          #   `target_response_code` 는 이 버전에 없다(Unknown setting 으로
          #   기동 실패한다) — 분기 근거는 태그다.
          tag_on_request_failure => [ "_om_request_failure" ]
        }

        if "_om_request_failure" not in [tags] {
          # 전달 완료 — 더 흘려보내지 않는다. ES 에 또 넣으면 같은 사실이
          # 두 저장소에 남아 어느 쪽이 청구 근거인지 모호해진다.
          drop { }
        } else {
          # ★ dead-letter. 버리지 않고 남긴다 — 재처리의 근거이자
          #   "얼마를 못 넣었는가" 의 유일한 기록이다.
          mutate {
            add_field => { "[@metadata][target_index]" => "api-usage-dlq" }
            replace   => { "[@metadata][pipeline]" => "dlq" }
            add_tag   => [ "openmeter_delivery_failed" ]
            add_field => { "om_failure_body" => "%{[@metadata][om_body]}" }
          }
        }
      }


      # ★ Alertmanager 경보 → alerts 인덱스
      #   webhook 페이로드는 alerts 배열을 담는다. 하나씩 쪼개야 한 건씩
      #   조회·집계할 수 있다 — 통째로 두면 "몇 건이 울렸나" 를 셀 수 없다.
      else if [@metadata][pipeline] == "alertmanager" {
        split { field => "alerts" }
        mutate {
          add_field => { "[@metadata][target_index]" => "alerts" }
          add_field => { "[event][kind]" => "alert" }
          add_field => { "[event][module]" => "alertmanager" }
          # 조회·집계에 쓰는 세 필드를 최상위로 올린다. 중첩 그대로 두면
          # Kibana 에서 alerts.labels.alertname 처럼 길어지고, 경보 종류별
          # 집계가 사실상 불가능하다.
          add_field => { "alertname"    => "%{[alerts][labels][alertname]}" }
          add_field => { "severity"     => "%{[alerts][labels][severity]}" }
          add_field => { "alert_status" => "%{[alerts][status]}" }
        }
        # ★ @timestamp 는 수신 시각이 아니라 **경보 발생 시각**이어야 한다.
        #   Alertmanager 는 group_wait(30s)·group_interval(5m)·repeat_interval(4h)
        #   만큼 지연시켜 보내고, 같은 경보를 4시간마다 다시 보낸다. 수신 시각을
        #   쓰면 재전송분이 전부 "새 경보" 로 보여 발생 시점을 알 수 없다.
        date {
          match => [ "[alerts][startsAt]", "ISO8601" ]
          target => "@timestamp"
          tag_on_failure => ["_alertdateparsefailure"]
        }
        # 원본 페이로드는 split 이전의 alerts 배열 전체를 담고 있어 문서마다
        # 통째로 중복된다. 실측: keyword 길이 한도를 넘겨 `_ignored` 로 색인
        # 대상에서 빠졌다 — 저장만 하고 검색은 안 되는 필드다.
        mutate {
          remove_field => [ "[event][original]", "message" ]
        }
      }

      # Falco 알림 처리
      #
      # ★ 토픽 이름은 [kafka][topic] 이 아니라 **[@metadata][kafka][topic]** 이다.
      #   입력이 `decorate_events => "basic"` 이면 플러그인이 토픽·파티션·오프셋을
      #   @metadata 아래에 넣는다. 경로가 틀리면 조건이 **항상 거짓**이 되어
      #   falco·keycloak 이벤트가 아래 else 분기로 떨어진다 — `logstash` 인덱스에
      #   정규화 없이, @timestamp 도 관측 시각이 아니라 수신 시각으로 들어간다.
      #   실측(2026-09-04): 시험 메시지가 falco-alerts 가 아닌 logstash 인덱스에
      #   event.kind 없이 저장되었다. **오류는 없다 — 조용히 잘못 쌓인다.**
      else if [@metadata][pipeline] == "kafka" and [@metadata][kafka][topic] == "falco-alerts" {
        mutate {
          add_field => { "[@metadata][target_index]" => "falco-alerts" }
          add_field => { "event.kind" => "alert" }
          add_field => { "event.module" => "falco" }
        }
        date {
          match => ["time", "ISO8601"]
          target => "@timestamp"
        }
      }

      # Keycloak 이벤트 처리
      else if [@metadata][pipeline] == "kafka" and [@metadata][kafka][topic] == "keycloak-events" {
        mutate {
          add_field => { "[@metadata][target_index]" => "keycloak-events" }
          add_field => { "event.kind" => "event" }
          add_field => { "event.module" => "keycloak" }
        }
      }

      # Filebeat 로그 처리
      else {
        mutate {
          add_field => { "[@metadata][target_index]" => "logstash" }
        }

        # K8s 메타데이터 파싱
        if [kubernetes][namespace] {
          mutate {
            add_field => { "k8s.namespace" => "%{[kubernetes][namespace]}" }
            add_field => { "k8s.pod" => "%{[kubernetes][pod][name]}" }
            add_field => { "k8s.container" => "%{[kubernetes][container][name]}" }
          }
        }

        # JSON 로그 파싱 시도
        if [message] =~ /^\{/ {
          json {
            source => "message"
            target => "parsed"
            skip_on_invalid_json => true
          }
        }
      }
    }

    output {
      # ★ 전달은 **필터**가 한다(위 openmeter-bridge 분기). 여기 출력에는
      #   과금 전달용 http 가 없다 — 출력 플러그인은 실패를 파이프라인에
      #   돌려주지 못해 dead-letter 분기를 만들 수 없기 때문이다(Gotcha 31).
      #   성공한 계량 이벤트는 필터에서 drop 되고, 실패한 것만 DLQ 인덱스로,
      #   테넌트 없는 것만 격리 인덱스로 아래 출력에 도달한다.
      #
      # ★★ Elasticsearch 로 직접 쓰지 않는다 — **Data Prepper 에 넘긴다.**
      #   이유는 검색 엔진을 OpenSearch 로 바꿨는데(§9-1) 우리 Logstash 는
      #   Elastic 배포판 9.5.3 이라 `logstash-output-opensearch` 플러그인의
      #   설치·동작이 미확인이기 때문이다. 한 겹 넘기면 그 미지수가 사라진다.
      #
      # ★ `format => json_batch` 가 필수다 — Data Prepper 의 http source 는
      #   **JSON 배열만** 받는다. 객체 하나를 보내면 400 이고, 그 실패는
      #   로그 한 줄로만 남는다.
      http {
        url => "http://data-prepper:2021/log/ingest"
        http_method => "post"
        format => "json_batch"
        content_type => "application/json"
        retry_failed => true
        # 인덱스 이름은 Data Prepper 가 이 필드로 정한다(pipelines.yaml 의
        # legacy-ingest-pipeline). 여기서 붙이지 않으면 인덱스가 깨진다.
        mapping => {
          "target_index" => "%{[@metadata][target_index]}"
          "message" => "%{message}"
          "event" => "%{[event]}"
          "@timestamp" => "%{@timestamp}"
        }
      }
    }
