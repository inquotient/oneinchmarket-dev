apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: logstash-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logstash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logstash
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:9.5.2
          ports:
            - containerPort: 5044
              name: beats
              protocol: TCP
            - containerPort: 9600
              name: api
              protocol: TCP
          env:
            - name: ELASTICSEARCH_HOSTS
              value: "https://elasticsearch-es-http:9200"
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-es-elastic-user
                  key: elastic
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 1000m
              memory: 2Gi
          # Logstash 는 파이프라인 컴파일에 60~90초가 걸린다. startupProbe 가 없으면
          # livenessProbe 가 즉시 시작해 3회x10초=30초 만에 SIGTERM 한다(exitCode 143).
          startupProbe:
            httpGet:
              path: /
              port: api
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: api
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: api
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: config
              # 이미지 기본 pipeline/logstash.conf 를 덮어쓴다. 다른 이름으로 두면
              # Logstash 가 두 파일을 모두 로드해 beats input 이 중복되고
              #   could not bind to 0.0.0.0:5044; Address already in use
              # 가 난다.
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: pipeline.conf
      volumes:
        - name: config
          configMap:
            name: logstash-config
