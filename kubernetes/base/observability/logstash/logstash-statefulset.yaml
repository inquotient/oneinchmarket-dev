apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: logstash
  labels:
    app.kubernetes.io/name: logstash
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: logstash-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: logstash
  template:
    metadata:
      labels:
        app.kubernetes.io/name: logstash
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      # ★ 전용 SA. 없으면 `default` 로 도는데, ambient 에서는 그것이 곧 신원이라
      #   elasticsearch·kibana·falcosidekick 과 구분되지 않는다.
      #   AuthorizationPolicy 의 sa/logstash 가 매칭되지 않아 Kafka 접근이
      #   401 로 거부됐다(§8-42·§8-46).
      serviceAccountName: logstash
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:9.5.3
          ports:
            - containerPort: 5044
              name: beats
              protocol: TCP
            # ADR-031 — L0 의 Suricata EVE JSON (syslog-ng 경유 평문 스트림)
            - containerPort: 5140
              name: suricata
              protocol: TCP
            # ADR-031 — L0-Target 의 Zeek JSON
            - containerPort: 5142
              name: alerts
              protocol: TCP
            - containerPort: 5141
              name: zeek
              protocol: TCP
            - containerPort: 9600
              name: api
              protocol: TCP
          env:
            # Logstash 는 더 이상 검색 엔진에 직접 쓰지 않는다 — 출력이
            # Data Prepper 의 http source 로 간다. 그래서 자격이 필요 없다.
            # 남겨 두면 ES 철거와 함께 Secret 이 사라져 기동이 막힌다.
            - name: DATA_PREPPER_URL
              value: "http://data-prepper:2021/log/ingest"
            # ★ 힙을 1g -> 384m 로 줄인다. 실측(2026-09-11): 힙 사용 252 MB /
            #   최대 990 MB(25%)이고 이벤트가 **1시간여에 100건**이다
            #   (zeek 94 · alertmanager 6 · api-usage 0). 전환으로 입력이
            #   6개 -> 4개가 되고 Elasticsearch 출력이 사라지면서 일이 줄었다.
            # ★★ `-Xms1g` 가 1GB 를 **선할당**해서 RSS 가 1,284Mi 였다 —
            #   실제 필요량이 아니라 예약값이 RSS 를 만든 것이다.
            # ★ 이미지의 `config/jvm.options` 에 -Xms1g -Xmx1g 가 있다.
            #   LS_JAVA_OPTS 는 그 **뒤에** 붙고 java 는 마지막 -Xmx 를 취하므로
            #   여기서 이긴다(Gotcha 82·123 이 경계하는 반대 방향이다).
            #   판정은 설정이 아니라 `_node/stats` 의 heap_max_in_bytes 로 한다.
            - name: LS_JAVA_OPTS
              value: "-Xms384m -Xmx384m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            # ★ 힙 384m + 비힙 211MB + JVM/스레드 오버헤드 ≈ 700MB.
            #   limit 을 그보다 조금 위에 둔다 — 힙과 limit 을 같게 두면
            #   힙이 차기 전에 커널이 먼저 죽인다(Gotcha 82).
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: 500m
              memory: 896Mi
          # Logstash 는 파이프라인 컴파일에 60~90초가 걸린다. startupProbe 가 없으면
          # livenessProbe 가 즉시 시작해 3회x10초=30초 만에 SIGTERM 한다(exitCode 143).
          startupProbe:
            httpGet:
              path: /
              port: api
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: api
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: api
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /usr/share/logstash/config/logstash.yml
              subPath: logstash.yml
            - name: config
              # 이미지 기본 pipeline/logstash.conf 를 덮어쓴다. 다른 이름으로 두면
              # Logstash 가 두 파일을 모두 로드해 beats input 이 중복되고
              #   could not bind to 0.0.0.0:5044; Address already in use
              # 가 난다.
              mountPath: /usr/share/logstash/pipeline/logstash.conf
              subPath: pipeline.conf
      volumes:
        - name: config
          configMap:
            name: logstash-config
