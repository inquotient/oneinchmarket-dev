apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
data:
  # 단일 바이너리(monolithic) 모드. 로컬은 링을 inmemory 로 두고 복제 1이다.
  # 오브젝트 스토리지 대신 filesystem 을 쓴다 — MinIO 로 옮기는 것은
  # 별도 결정이다(로그 보존이 레이크하우스 버킷을 침범하지 않게 분리했다).
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9095
      log_level: info

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      replication_factor: 1
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      ring:
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    # ★ OTLP 수집에 필수 — 구조화 메타데이터가 꺼져 있으면
    #   otlphttp 로 들어온 로그가 400 으로 거부된다.
    limits_config:
      allow_structured_metadata: true
      retention_period: 72h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 8
      ingestion_burst_size_mb: 16
      max_query_series: 5000

    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem

    ruler:
      storage:
        type: local
        local:
          directory: /loki/rules

    analytics:
      reporting_enabled: false
