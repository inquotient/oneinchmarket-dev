apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  serviceName: loki-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: loki}
  template:
    metadata:
      labels: {app.kubernetes.io/name: loki, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3100"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: loki
      securityContext:
        # grafana/loki 이미지의 기본 uid 다.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: loki
          image: grafana/loki:latest
          args:
            - -config.file=/etc/loki/loki.yaml
          ports:
            - {containerPort: 3100, name: http, protocol: TCP}
            - {containerPort: 9095, name: grpc, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: 500m, memory: 1Gi}
          startupProbe:
            httpGet: {path: /ready, port: http}
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: http}
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 15
          volumeMounts:
            - {name: config, mountPath: /etc/loki}
            - {name: data, mountPath: /loki}
      volumes:
        - name: config
          configMap: {name: loki-config}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources: {requests: {storage: 20Gi}}
