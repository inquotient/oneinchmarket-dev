apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: loki-headless
  labels: {app.kubernetes.io/name: loki, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  clusterIP: None
  ports:
    - {name: http, port: 3100, targetPort: 3100, protocol: TCP}
    - {name: grpc, port: 9095, targetPort: 9095, protocol: TCP}
  selector: {app.kubernetes.io/name: loki}
