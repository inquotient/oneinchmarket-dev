# ★ 전용 ServiceAccount.
#   ambient 에서는 ServiceAccount 가 곧 워크로드 신원(SPIFFE)이다.
#   이 셋은 모두 `default` 로 돌고 있었고, 그래서 AuthorizationPolicy 에서
#   서로 구분되지 않았다 — 하나에게 접근을 주면 셋 모두에게 주는 것이
#   된다. 신원 분리를 위해 각자 만든다(§8-47).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kibana
  labels:
    app.kubernetes.io/name: kibana
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
# 토큰을 쓰지 않는다. 신원 확보가 목적이고, ambient 의 SPIFFE 인증서는
# kubelet 이 아니라 istiod 가 발급한다.
automountServiceAccountToken: false
