apiVersion: v1
kind: ServiceAccount
metadata:
  name: tempo
  labels: {app.kubernetes.io/name: tempo, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: tempo-headless
  labels: {app.kubernetes.io/name: tempo, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  clusterIP: None
  ports:
    - {name: http, port: 3200, targetPort: 3200, protocol: TCP}
    - {name: otlp-grpc, port: 4317, targetPort: 4317, protocol: TCP}
    - {name: otlp-http, port: 4318, targetPort: 4318, protocol: TCP}
  selector: {app.kubernetes.io/name: tempo}
