apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: oneinchmarket
        # ★ ztunnel 에 포획되면 안 된다 — ingress 게이트웨이와 같은 이유다
        #   (ingress-gateway.yaml 의 infrastructure.labels). Falco 는
        #   privileged 로 도는 센서이고 자기 경보를 스스로 내보낸다. 메시에
        #   넣으면 그 출력이 ztunnel 을 타게 되어 **탐지 경로가 데이터
        #   플레인에 매달린다** — 메시가 흔들리면 경보도 함께 끊긴다.
        #   아래에서 파드 네트워크로 옮긴 목적은 **신원을 얻는 것**이고
        #   mTLS 가 아니다. NetworkPolicy 는 파드 라벨만 보면 된다.
        istio.io/dataplane-mode: none
    spec:
      serviceAccountName: falco
      # ★★★ hostNetwork 를 쓰지 않는다 — 2026-10-09 에 걷었다(Gotcha 197).
      #   hostNetwork 파드는 **파드 신원이 없다**(Gotcha 110 ②). 그래서
      #   NetworkPolicy 가 고를 수 없는데, `allow-falcosidekick-access` 는
      #   2801 을 `app.kubernetes.io/name: falco` 파드 라벨로만 연다. 결과:
      #   Falco 는 **같은 노드**의 falcosidekick 에만 닿았고(Cilium 이
      #   host->로컬 파드를 허용한다) 다른 노드에서 오면
      #   `remote-node`(identity 6) 가 되어 **조용히 버려졌다.**
      #   실측: 싱크가 본 hostname 시계열이 한 노드뿐 · 반대 노드의 falco
      #   로그에 `"http" output timeout, all output channels are blocked`
      #   105줄. 즉 **노드 하나의 런타임 탐지가 통째로 유실돼 있었다**
      #   (SEC-301 이 "모든 노드" 라고 적고 있었다).
      #   ★ 그 결함은 falcosidekick 이 어느 노드에 뜨는지에 따라 **옮겨
      #     다닌다** — 파드 재기동 하나가 커버리지를 바꾼다.
      #
      #   ★★ hostNetwork 가 사주던 것이 없다 — 실측으로 확인했다:
      #     · falco 를 선택하는 Service 0개 (들어오는 트래픽이 없다)
      #     · 8765 는 자기 liveness/readiness 프로브뿐
      #     · `hostPID` 는 애초에 쓰지 않는다
      #   syscall 수집은 modern_ebpf 가 커널에서 하므로 netns 와 무관하다
      #   (실측: 파드 네트워크에서 드라이버·규칙 정상 로드 · 전송 오류 0건).
      #   libbpf 의 TOCTOU tracepoint 경고는 hostNetwork 파드에도 있던
      #   것이라 이 변경과 무관하다(대조군으로 확인).
      #
      #   ★★★ 복귀 조건: **Kubernetes audit webhook**(SEC-307)을 Wazuh 가
      #   아니라 Falco 로 받기로 하면, API 서버가 노드 IP 의 8765 로 POST
      #   해야 하므로 hostNetwork 또는 전용 Service 가 다시 필요해진다.
      dnsPolicy: ClusterFirst
      # ★★ seccomp 을 켜 둔다 — 실측으로 modern_ebpf 와 함께 성립한다.
      #   `privileged: true` 는 seccomp 도 함께 끈다(실측: 그 시절 파드가
      #   `Seccomp: 0` 이었다). 걷으면 RuntimeDefault 가 걸리는데
      #   (`Seccomp: 2`) 관문은 그 프로파일이 `bpf`·`perf_event_open` 을
      #   허용하는지 하나뿐이고, 드라이버가 열리고 자극 전부가 발화했다.
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: falco
          image: docker.io/falcosecurity/falco:0.44.1-debian
          args:
            - /usr/bin/falco
            - -o
            - engine.kind=modern_ebpf
          env:
            - name: FALCO_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # ★★ hostNetwork 를 걷으면 경보의 `hostname` 이 노드명에서
            #   **파드명**으로 바뀐다 — Falco 는 uname 의 hostname 을 쓰고,
            #   hostNetwork 일 때 그것이 노드명이었을 뿐이다. 그러면
            #   `06-falco-test.sh` 의 노드 커버리지 판정(싱크의 hostname
            #   라벨로 노드를 귀속한다)이 **조용히 무의미해진다** — 경보는
            #   그대로 오는데 어느 노드에서 왔는지 알 수 없다.
            #   실측으로 확인했다: 이 변수 없이는
            #   hostname="falco-nonet-test", 주면
            #   hostname="local-ubuntu4-nuc15crsu9".
            # ★ 덤으로 값이 **`kubectl get nodes` 와 정확히 일치**한다 —
            #   hostNetwork 시절에는 OS 호스트명(대문자 섞인
            #   `local-ubuntu3-NUC15CRSU9`)이어서 대소문자가 어긋나 있었다.
            - name: FALCO_HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FALCO_BPF_PROBE
              value: ""
          # ★★★ `privileged: true` 를 2026-10-09 에 걷었다 — 전수 41개
          #   capability 에서 **셋**으로 줄였다. 셋은 추측이 아니라 실측으로
          #   정했다(각 조합을 띄워 보고 갈랐다):
          #     [BPF, PERFMON]                  -> **기동 실패**
          #        `Error: unable to configure the libpman state`
          #        (링 버퍼의 RLIMIT_MEMLOCK 을 올리지 못한다)
          #     [BPF, PERFMON, SYS_RESOURCE]    -> 동작. **이것이 최소다**
          #     + SYS_PTRACE                    -> **차이 없음**. 한때
          #        `container.name` 이 ID 로 나와 필요해 보였으나 그것은
          #        컨테이너 메타데이터 **콜드 캐시 경합**이었다 —
          #        1분 뒤 재니 양쪽 다 이름을 정확히 해석했다(운영
          #        privileged 파드도 같은 자리에서 ID 를 냈다).
          #
          #   ★ **uid 0 을 유지해야 한다** — 비-root 컨테이너에서
          #   `capabilities.add` 는 bounding set 만 넓히고 실효 권한을 주지
          #   않는다(Gotcha 182). 실측: 여기서는 `CapEff = 0xc001080000`
          #   으로 **더해 준 것이 그대로 실효**다. 그래서 Kyverno
          #   `disallow-root` 의 falco 예외는 **그대로 필요하다.**
          #
          #   ★★ **capability 로 메워지지 않는 간격이 하나 남는다** —
          #   `[libs]: Cannot read host init process proc root: 13`
          #   (`/host/proc/1/root` 를 통한 호스트 루트 접근). 막는 것은
          #   capability 가 아니라 **AppArmor** 다: `SYS_ADMIN` 까지 줘도
          #   DENIED 이고 `appArmorProfile: Unconfined` 로만 OK 다
          #   (실측 행렬, Gotcha 199). **그 비용은 재어 보니 없었다** —
          #   컨테이너 규칙 4종 + 노드 자격 절 · 호스트 규칙(조상 사슬
          #   `proc.aname[2..4]`·`user.loginuid`·exepath 실경로까지) ·
          #   `user.name`/`container.name` 해석이 privileged 와 동일하고
          #   `<NA>` 가 0건이다. 그러니 **Unconfined 로 되돌리지 말 것** —
          #   호스트 루트를 실제로 읽어야 하는 상류 규칙을 쓰게 되면
          #   그때 `appArmorProfile: {type: Unconfined}` 하나만 더하면
          #   되고, 그래도 privileged 보다는 훨씬 좁다.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            # ★★ rootfs 를 읽기 전용으로 둔다 — 2026-10-09 에 켰다.
            #   추측으로 켜지 않았다(Gotcha 92): 20시간 가동한 양 노드
            #   파드에 `find / -xdev -newer /etc/hostname -type f` 를 물어
            #   **쓰기 0건**이었고, 열린 쓰기 fd 도 `/dev/null` 뿐이다.
            #   ★ 그 검사만으로는 보증이 아니다(기준 파일이 기동 순간에
            #     써지므로 엔트리포인트가 동시에 고친 파일은 놓친다 —
            #     dependency-track-frontend 가 그 반례다, Gotcha 48·96).
            #     그래서 **켠 파드를 따로 띄워 로그로 판정했다**:
            #     `read-only file system|EROFS|cannot create` **0건** ·
            #     설정 3종 schema validation ok · 드라이버 로드 ·
            #     자극 전부 발화 · `<NA>` 0 · 재시작 0.
            #   ★★ Falco 는 경보를 **stderr 와 HTTP** 로만 내보내므로
            #     쓸 곳이 없다. `grpc` 는 설정에서 빼 두었고(0.44 스키마에
            #     없다) 드라이버는 modern_ebpf 라 적재 단계가 없다 —
            #     커널 모듈·legacy eBPF 라면 `/root/.falco` 에 받아야 해서
            #     이것을 켤 수 없었다.
            #   ★ 되돌려야 할 때: 플러그인을 **런타임에 받게** 하거나
            #     `grpc` 유닉스 소켓을 켜면 쓸 곳이 생긴다. 그때는 끄지 말고
            #     그 경로만 emptyDir 로 뺄 것(Gotcha 96 의 grafana 처방).
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["BPF", "PERFMON", "SYS_RESOURCE"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/falco/falco.yaml
              subPath: falco.yaml
              readOnly: true
            - name: config
              mountPath: /etc/falco/rules.d/custom-rules.yaml
              subPath: custom-rules.yaml
              readOnly: true
            # ★ k3s 는 자기 containerd 를 /run/k3s/containerd 에 둔다.
            #   호스트의 /run/containerd/containerd.sock 은 **다른**
            #   데몬이고 k8s 컨테이너를 모른다(실측: 1개 vs 422개).
            #   그것을 물리면 경보가 뜨긴 하나 컨테이너·파드·네임스페이스가
            #   전부 <NA> 로 나온다 — 오류는 없다(§8-64).
            - name: containerd-sock
            #   ★ 그리고 마운트 지점은 **/host 아래**여야 한다. container
            #     플러그인은 host_root(기본 /host)를 앞에 붙여 연다 —
            #     로그가 '/host/run/k3s/...' 를 연다고 찍는다. 원래
            #     매니페스트는 /proc·/dev·/boot 만 /host 아래 두고
            #     소켓만 빠뜨려 규약이 어긋나 있었다.
              mountPath: /host/run/k3s/containerd/containerd.sock
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            # ★★ `/host/dev` 와 `/host/boot` 는 2026-10-09 에 걷었다 —
            #   hostPath 가 넷에서 둘로 줄었다. 그 둘은 **커널 모듈·legacy
            #   eBPF 드라이버를 빌드/적재하던 시절의 유산**이고
            #   modern_ebpf 는 BTF 를 컨테이너의 `/sys` 에서 읽는다(실측:
            #   열린 fd 에 `anon_inode:btf` 가 있고 `/host/dev`·
            #   `/host/boot` 하위를 여는 fd 는 **0개**. `/host/boot` 는
            #   파드가 뜬 뒤 atime 이 갱신된 적조차 없었다).
            #   ★ atime 은 약한 증거라 **떼어 보고** 확정했다 — 둘 없이
            #     드라이버가 열리고 자극 전부가 발화했다.
      volumes:
        - name: config
          configMap:
            name: falco-config
        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd/containerd.sock
        - name: proc
          hostPath:
            path: /proc
