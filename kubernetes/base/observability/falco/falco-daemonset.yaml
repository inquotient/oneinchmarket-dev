apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
  labels:
    app.kubernetes.io/name: falco
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: falco
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: falco
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: falco
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - effect: NoSchedule
          operator: Exists
      containers:
        - name: falco
          image: falcosecurity/falco:0.44.1-debian
          args:
            - /usr/bin/falco
            - -o
            - engine.kind=modern_ebpf
          env:
            - name: FALCO_K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: FALCO_BPF_PROBE
              value: ""
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8765
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/falco/falco.yaml
              subPath: falco.yaml
              readOnly: true
            - name: config
              mountPath: /etc/falco/rules.d/custom-rules.yaml
              subPath: custom-rules.yaml
              readOnly: true
            # ★ k3s 는 자기 containerd 를 /run/k3s/containerd 에 둔다.
            #   호스트의 /run/containerd/containerd.sock 은 **다른**
            #   데몬이고 k8s 컨테이너를 모른다(실측: 1개 vs 422개).
            #   그것을 물리면 경보가 뜨긴 하나 컨테이너·파드·네임스페이스가
            #   전부 <NA> 로 나온다 — 오류는 없다(§8-64).
            - name: containerd-sock
            #   ★ 그리고 마운트 지점은 **/host 아래**여야 한다. container
            #     플러그인은 host_root(기본 /host)를 앞에 붙여 연다 —
            #     로그가 '/host/run/k3s/...' 를 연다고 찍는다. 원래
            #     매니페스트는 /proc·/dev·/boot 만 /host 아래 두고
            #     소켓만 빠뜨려 규약이 어긋나 있었다.
              mountPath: /host/run/k3s/containerd/containerd.sock
              readOnly: true
            - name: proc
              mountPath: /host/proc
              readOnly: true
            - name: dev
              mountPath: /host/dev
              readOnly: true
            - name: boot
              mountPath: /host/boot
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: falco-config
        - name: containerd-sock
          hostPath:
            path: /run/k3s/containerd/containerd.sock
        - name: proc
          hostPath:
            path: /proc
        - name: dev
          hostPath:
            path: /dev
        - name: boot
          hostPath:
            path: /boot
