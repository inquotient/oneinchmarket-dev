apiVersion: v1
kind: ConfigMap
metadata:
  name: filebeat-config
  labels:
    app.kubernetes.io/name: filebeat
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
data:
  filebeat.yml: |
    filebeat.inputs:
      # Filebeat 9.x 에서 container input 이 제거되었다.
      #   Container input is deprecated. Use Filestream input with its
      #   container parser instead.
      - type: filestream
        id: kubernetes-container-logs
        paths:
          - /var/log/containers/*.log
        parsers:
          - container:
              stream: all
              format: auto
        prospector:
          scanner:
            symlinks: true
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: /var/log/containers/
    output.elasticsearch:
      hosts: ["${ELASTICSEARCH_HOST}"]
      username: "elastic"
      password: "${ES_PASSWORD}"
      ssl.verification_mode: none
