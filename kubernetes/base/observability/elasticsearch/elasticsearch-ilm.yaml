# Elasticsearch ILM (Index Lifecycle Management) 초기 설정 Job
# ILM 정책 + 인덱스 템플릿 생성
apiVersion: batch/v1
kind: Job
metadata:
  name: elasticsearch-ilm-setup
  labels:
    app.kubernetes.io/name: elasticsearch-ilm-setup
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: elasticsearch-ilm-setup
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      restartPolicy: OnFailure
      serviceAccountName: elasticsearch-ilm-setup
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ilm-setup
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              ES_URL="https://elasticsearch-es-http:9200"
              AUTH="elastic:${ES_PASSWORD}"
              OPTS="--cacert /etc/elasticsearch/certs/ca.crt -sf"

              # ES 기동 전에 실행되어 CrashLoop 하던 문제. 클러스터가 준비될
              # 때까지 기다린다. ECK 는 인증서 발급까지 수 분이 걸릴 수 있다.
              echo "[0/3] Elasticsearch 준비 대기..."
              until curl ${OPTS} -u "${AUTH}" "${ES_URL}/_cluster/health?wait_for_status=yellow&timeout=10s" >/dev/null 2>&1; do
                sleep 10
              done
              echo "[0/3] Elasticsearch 준비 완료"

              echo "[1/3] Creating ILM policy..."
              curl ${OPTS} -X PUT "${ES_URL}/_ilm/policy/oneinchmarket-ilm" \
                -u "${AUTH}" -H "Content-Type: application/json" -d '{
                "policy": {
                  "phases": {
                    "hot": {
                      "min_age": "0ms",
                      "actions": {
                        "rollover": {
                          "max_size": "10gb",
                          "max_age": "7d"
                        },
                        "set_priority": { "priority": 100 }
                      }
                    },
                    "warm": {
                      "min_age": "7d",
                      "actions": {
                        "shrink": { "number_of_shards": 1 },
                        "forcemerge": { "max_num_segments": 1 },
                        "set_priority": { "priority": 50 }
                      }
                    },
                    "delete": {
                      "min_age": "30d",
                      "actions": {
                        "delete": {}
                      }
                    }
                  }
                }
              }'

              # ★ filebeat 은 자기 데이터스트림에 **자기 기본 정책**을 쓴다.
              #   위의 oneinchmarket-ilm 이 아니라 `filebeat` 이라는 별도 정책이고,
              #   그 기본값에는 **delete 단계가 없다** — 롤오버만 하고 영원히 쌓인다.
              #
              #   실측(2026-09-04, §8-37): 백킹 인덱스 5개에 9.7억 건 / 93 GB 가
              #   쌓여 있었다. 대부분이 오류 한 종류의 반복이었지만, 그 오류가
              #   없었더라도 보존 정책이 없으므로 증가는 멈추지 않는다.
              #
              #   filebeat 은 정책이 이미 있으면 덮어쓰지 않는다(setup.ilm.overwrite
              #   기본 false). 그래서 여기서 먼저 만들어 두면 그대로 쓰인다.
              #   이미 만들어진 데이터스트림에도 적용된다 — ILM 은 인덱스가
              #   참조하는 정책 이름으로 평가되기 때문이다.
              echo "[1b/3] Creating filebeat ILM policy (retention)..."
              curl ${OPTS} -X PUT "${ES_URL}/_ilm/policy/filebeat" \
                -u "${AUTH}" -H "Content-Type: application/json" -d '{
                "policy": {
                  "phases": {
                    "hot": {
                      "min_age": "0ms",
                      "actions": {
                        "rollover": {
                          "max_age": "1d",
                          "max_primary_shard_size": "10gb"
                        },
                        "set_priority": { "priority": 100 }
                      }
                    },
                    "delete": {
                      "min_age": "7d",
                      "actions": {
                        "delete": {}
                      }
                    }
                  }
                }
              }'

              echo "[2/3] Creating index templates..."
              for IDX in logstash falco-alerts keycloak-events trivy-reports; do
                curl ${OPTS} -X PUT "${ES_URL}/_index_template/${IDX}-template" \
                  -u "${AUTH}" -H "Content-Type: application/json" -d "{
                  \"index_patterns\": [\"${IDX}-*\"],
                  \"template\": {
                    \"settings\": {
                      \"number_of_shards\": 1,
                      \"number_of_replicas\": ${ES_REPLICAS},
                      \"index.lifecycle.name\": \"oneinchmarket-ilm\",
                      \"index.lifecycle.rollover_alias\": \"${IDX}\"
                    }
                  }
                }"
                echo " -> ${IDX} template created"
              done


              # ★ L0 랩(ADR-031)의 인덱스 — suricata·suricata-engine·zeek.
              #   Logstash 가 즉석에서 만들기 때문에 템플릿이 없었고, 그러면
              #   ES 기본값인 복제본 1 이 붙는다. 단일 노드에서는 배정될 곳이
              #   없어 클러스터가 yellow 로 남고, **ECK 가 파드를 롤링하지
              #   못한다**(§8-52).
              #
              #   ★ `index_patterns: ["*"]` 로 한 번에 덮으려 했으나 ES 가
              #     거부한다 — 같은 우선순위의 기존 템플릿과 패턴이 겹치면
              #     illegal_argument_exception 이다. 실제로 쓰는 이름만
              #     명시하는 편이 정확하고 부작용도 없다.
              for IDX in suricata zeek; do
                curl ${OPTS} -X PUT "${ES_URL}/_index_template/${IDX}-l0-template" \
                  -u "${AUTH}" -H "Content-Type: application/json" -d "{
                  \"index_patterns\": [\"${IDX}*\"],
                  \"priority\": 100,
                  \"template\": {
                    \"settings\": {
                      \"number_of_shards\": 1,
                      \"number_of_replicas\": ${ES_REPLICAS}
                    }
                  }
                }"
                echo " -> ${IDX} L0 template created"
              done

              # ★ 경보·과금 우회 인덱스 — alerts·api-usage-dlq·api-usage-quarantine.
              #   위의 L0 인덱스와 완전히 같은 함정이다: Logstash 가 고정 이름으로
              #   즉석 생성하므로 템플릿이 없으면 복제본 1 이 붙고, 단일 노드에서는
              #   배정될 곳이 없어 클러스터가 yellow 로 남아 ECK 가 파드를 롤링하지
              #   못한다(§8-52). 실측: `alerts` 인덱스가 생기자마자 yellow 였다.
              #
              #   템플릿은 **생성 시점에만** 적용된다. 이미 만들어진 인덱스는
              #   그대로 남으므로 설정을 따로 한 번 더 밀어 넣는다(멱등적).
              for IDX in alerts api-usage-dlq api-usage-quarantine; do
                curl ${OPTS} -X PUT "${ES_URL}/_index_template/${IDX}-template"                   -u "${AUTH}" -H "Content-Type: application/json" -d "{
                  \"index_patterns\": [\"${IDX}*\"],
                  \"priority\": 100,
                  \"template\": {
                    \"settings\": {
                      \"number_of_shards\": 1,
                      \"number_of_replicas\": ${ES_REPLICAS}
                    }
                  }
                }"
                curl ${OPTS} -X PUT "${ES_URL}/${IDX}/_settings"                   -u "${AUTH}" -H "Content-Type: application/json"                   -d "{\"index\":{\"number_of_replicas\":${ES_REPLICAS}}}" 2>/dev/null                   || echo " -> ${IDX} not created yet (template will apply)"
                echo " -> ${IDX} template created"
              done

              echo "[3/3] Creating initial write aliases..."
              for IDX in logstash falco-alerts keycloak-events trivy-reports; do
                curl ${OPTS} -X PUT "${ES_URL}/${IDX}-000001" \
                  -u "${AUTH}" -H "Content-Type: application/json" -d "{
                  \"aliases\": {
                    \"${IDX}\": { \"is_write_index\": true }
                  }
                }" 2>/dev/null || echo " -> ${IDX} index already exists"
              done

              echo "=== ILM setup completed ==="
          env:
            # ★ 단일 노드에서는 0 이어야 한다.
            #   복제본 1 이면 배정될 노드가 없어 인덱스가 영구히 yellow 가 되고,
            #   **ECK 는 green 이 아니면 파드를 롤링하지 않는다**(§8-52).
            #   증상은 "설정을 바꿨는데 파드가 안 바뀐다" 로 나타난다.
            #   local 오버레이가 "0" 으로 덮는다. dev/prod 는 3노드라 1 이 맞다.
            - name: ES_REPLICAS
              value: "1"
            - name: ES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elasticsearch-es-elastic-user
                  key: elastic
          volumeMounts:
            - name: es-certs
              mountPath: /etc/elasticsearch/certs
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: es-certs
          secret:
            secretName: elasticsearch-es-http-certs-public
