# ★ 전용 ServiceAccount.
#   이 Job 은 `default` 로 돌았고, ambient 에서는 그것이 곧 신원이라
#   AuthorizationPolicy 에서 다른 워크로드와 구분되지 않는다.
#   `sa/default` 를 9200 에 허용하면 그 SA 를 쓰는 모든 파드에 ES 접근을
#   주게 되므로 그러지 않는다 — 전용 SA 를 만들고 그것만 허용한다(§8-52).
#
#   ★ Job 은 평소에 돌지 않아 이 결함이 드러나지 않았다. 네임스페이스를
#     ambient 에 편입한 뒤 처음 재실행할 때 비로소 막힌다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: elasticsearch-ilm-setup
  labels:
    app.kubernetes.io/name: elasticsearch-ilm-setup
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
