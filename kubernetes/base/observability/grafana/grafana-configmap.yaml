apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
data:
  # 데이터소스는 프로비저닝으로 선언한다. UI 수작업을 남기지 않는다.
  #
  # ★ $ 이스케이프 — Grafana 는 프로비저닝 파일에서 ${VAR} 를 환경변수로
  #   치환한다. 리터럴로 남겨야 하는 곳($__value.raw 등)은 $$ 로 쓴다.
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus-headless:9090
        isDefault: true

      # 지속 프로파일링. Tempo·Loki 와 같은 계열로 Grafana 에서 함께 본다.
      - name: Pyroscope
        type: grafana-pyroscope-datasource
        uid: pyroscope
        access: proxy
        url: http://pyroscope:4040

      # ★ Elasticsearch -> OpenSearch (§9-1). Grafana 의 내장
      #   `elasticsearch` 데이터소스를 그대로 쓴다 — OpenSearch 가 ES 7.10
      #   API 호환을 유지하기 때문이다. 전용 OpenSearch 플러그인을 쓰지 않는
      #   이유는 Grafana 가 플러그인을 /tmp 에 받아 설치하는데 이 배포는
      #   readOnlyRootFilesystem 이라 **설치가 조용히 전부 실패**하기 때문이다
      #   (Gotcha 96 — 파드는 Ready 이고 /api/health 도 ok 다).
      #   ★★ 로그의 주 조회 경로는 여전히 Loki 다. 이 데이터소스는 siem-*
      #     처럼 OpenSearch 에만 있는 것을 볼 때 쓴다.
      - name: OpenSearch
        type: elasticsearch
        uid: opensearch
        access: proxy
        url: https://opensearch-headless:9200
        database: "logs-*"
        basicAuth: true
        basicAuthUser: admin
        jsonData:
          timeField: "time"
          tlsSkipVerify: true
        secureJsonData:
          basicAuthPassword: ${OPENSEARCH_PASSWORD}

      # ── 2단계 ────────────────────────────────────────────────
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki-headless:3100
        jsonData:
          # 로그 라인의 trace_id 를 Tempo 링크로 만든다.
          derivedFields:
            - name: TraceID
              datasourceUid: tempo
              matcherRegex: '"trace_id":"(\w+)"'
              url: "$${__value.raw}"

      - name: Tempo
        type: tempo
        uid: tempo
        access: proxy
        url: http://tempo-headless:3200
        jsonData:
          # 스팬 -> 로그. 파드 라벨로 좁힌다.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            filterByTraceID: true
            tags:
              - {key: "k8s.pod.name", value: "k8s_pod_name"}
          # 스팬 -> 메트릭은 metrics_generator 가 필요하다. 켜지 않았다.
          nodeGraph:
            enabled: false
