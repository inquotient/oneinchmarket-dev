apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-headless
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  clusterIP: None
  ports: [{name: http, port: 3000, targetPort: 3000, protocol: TCP}]
  selector: {app.kubernetes.io/name: grafana}
