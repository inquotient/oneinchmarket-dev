apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket}
    spec:
      serviceAccountName: grafana
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.2.1
          ports:
            - {containerPort: 3000, name: http, protocol: TCP}
          env:
            - {name: GF_SECURITY_ADMIN_USER, value: admin}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: grafana-secret, key: admin-password}}
            - name: ES_PASSWORD
              valueFrom: {secretKeyRef: {name: elasticsearch-es-elastic-user, key: elastic}}
            # 익명 접근 차단. 외부 진입점이 생기면 Keycloak OIDC 로 전환한다.
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: "false"}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: "false"}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            # ★ rootfs 쓰기 0건을 측정하고 켜다(§8-101).
            #   쓰는 곳은 /var/lib/grafana (emptyDir) 이고 그것은 볼륨이다.
            #   판정은 local/check-readonly-rootfs.sh 가 했다 — 추측이 아니다.
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: 500m, memory: 768Mi}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 15
          volumeMounts:
            - {name: config, mountPath: /etc/grafana/provisioning/datasources}
            - {name: data, mountPath: /var/lib/grafana}
            # ★ readOnlyRootFilesystem 을 켜면 grafana 의 플러그인 설치가
            #   깨진다 — backgroundinstaller 가 /tmp 에 zip 을 받아 푸는데
            #   rootfs 에 못 쓴다:
            #     Failed to install plugin ... open /tmp/232714125.zip: read-only file system
            #   실측으로 mysql·elasticsearch·pyroscope 등 18건이 실패했다.
            #   ★★ 이것이 `check-readonly-rootfs.sh` 가 놓치는 부류다 —
            #   플러그인 설치는 **기동 직후**에 일어나 기준 파일과 시각이
            #   겹친다(Gotcha 92). 파드는 Ready 였고 /api/health 도 ok 였다.
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: grafana-config}
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
