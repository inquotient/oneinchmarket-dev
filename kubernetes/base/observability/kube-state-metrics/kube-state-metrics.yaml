# kube-state-metrics — 쿠버네티스 오브젝트 상태를 메트릭으로 낸다.
#
# ★ 왜 지금 넣는가 — 경보 규칙을 쓰려면 **관측할 메트릭**이 있어야 한다.
#   이 클러스터의 Prometheus 는 apiserver·cadvisor·파드 어노테이션만 긁는다.
#   그것으로는 "Job 이 실패했다"·"Deployment 가 replica 를 못 채운다" 를 알 수
#   없다. DLQ 재처리 Job 의 실패를 경보로 만들려면 이것이 필요하다(§8-63).
#
# ★ cluster-scope 읽기 권한을 갖는다. 오브젝트 **상태만** 읽고 Secret 은
#   읽지 않는다 — 아래 ClusterRole 에 secrets 가 없는 것이 그 뜻이다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
rules:
  # ★ secrets 를 넣지 않는다. 상태 메트릭에 필요하지 않고, 넣으면 이 SA 가
  #   클러스터 전체의 자격을 읽을 수 있게 된다.
  - apiGroups: [""]
    resources: [configmaps, nodes, pods, services, resourcequotas,
                replicationcontrollers, limitranges, persistentvolumeclaims,
                persistentvolumes, namespaces, endpoints]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [statefulsets, daemonsets, deployments, replicasets]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies, ingresses]
    verbs: [list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, volumeattachments]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: local
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/component: observability
        app.kubernetes.io/part-of: oneinchmarket
      annotations:
        # Prometheus 의 kubernetes-pods 잡이 이 어노테이션으로 긁는다.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.13.0
          args:
            - --port=8080
            - --telemetry-port=8081
            # ★ 이 클러스터는 단일 네임스페이스 배포다. 범위를 좁혀
            #   메모리와 카디널리티를 줄인다.
            - --namespaces=local
          ports:
            - {containerPort: 8080, name: metrics, protocol: TCP}
            - {containerPort: 8081, name: telemetry, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits:   {cpu: 200m, memory: 192Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet: {path: /, port: 8081}
            initialDelaySeconds: 5
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  clusterIP: None
  ports:
    - {name: metrics, port: 8080, targetPort: 8080, protocol: TCP}
  selector: {app.kubernetes.io/name: kube-state-metrics}
