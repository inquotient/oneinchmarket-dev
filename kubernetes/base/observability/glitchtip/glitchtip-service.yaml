apiVersion: v1
kind: ServiceAccount
metadata:
  name: glitchtip
  labels:
    app.kubernetes.io/name: glitchtip
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: glitchtip
  labels:
    app.kubernetes.io/name: glitchtip
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: glitchtip
    app.kubernetes.io/instance: web
