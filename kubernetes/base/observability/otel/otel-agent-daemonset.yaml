apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
  labels: {app.kubernetes.io/name: otel-agent, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: otel-agent}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-agent, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket}
    spec:
      serviceAccountName: otel-agent
      # ── 의도된 예외 (Filebeat 와 동일한 사유) ─────────────────────
      #   filelog 수신기가 /var/log/pods 아래 컨테이너 로그를 읽는다.
      #   containerd 가 만드는 로그 파일은 root 소유이고 디렉터리
      #   퍼미션이 배포판마다 다르다. DAC_READ_SEARCH 로 읽기만 얻는다.
      #   privileged 도 hostNetwork 도 쓰지 않는다.
      securityContext:
        runAsUser: 0
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: otel-agent
          # ★ 컬렉터 설정 스키마는 마이너마다 바뀐다(Gotcha 20).
          #   올린 뒤에는 otelcol_receiver_accepted_log_records 로 확인할 것 —
          #   수신기가 0건이어도 오류는 나지 않는다.
          image: otel/opentelemetry-collector-contrib:0.160.0
          args:
            - --config=/conf/otel-agent.yaml
          env:
            - name: KUBE_NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
            - name: K8S_POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "k8s.cluster.name=oneinchmarket"
          # 애플리케이션은 `otel-agent` Service 로 보낸다 — 그 Service 가
          # internalTrafficPolicy: Local 이라 **같은 노드의 파드**로만 간다.
          # hostPort 는 쓰지 않는다: 이 클러스터의 Cilium 구성에서는 바인드
          # 되지 않는다(노드에 리슨이 잡히지 않고 curl 이 000 을 준다).
          ports:
            - {containerPort: 4317, name: otlp-grpc, protocol: TCP}
            - {containerPort: 4318, name: otlp-http, protocol: TCP}
            - {containerPort: 8888, name: telemetry, protocol: TCP}
            - {containerPort: 13133, name: health, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["DAC_READ_SEARCH"]
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {cpu: 300m, memory: 384Mi}
          startupProbe:
            httpGet: {path: /, port: health}
            failureThreshold: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 15
          volumeMounts:
            - {name: config, mountPath: /conf}
            # k3s/containerd 는 로그 실체를 /var/log/pods 아래에 쓴다.
            # /var/log/containers 는 이쪽을 가리키는 심링크라 별도 마운트가 필요 없다.
            - {name: varlogpods, mountPath: /var/log/pods, readOnly: true}
            # file_storage 체크포인트. 재시작 후 읽던 위치를 잃지 않는다.
            - {name: checkpoint, mountPath: /var/lib/otelcol}
      volumes:
        - name: config
          configMap: {name: otel-agent-config}
        - name: varlogpods
          hostPath: {path: /var/log/pods}
        - name: checkpoint
          hostPath: {path: /var/lib/otelcol, type: DirectoryOrCreate}
      tolerations:
        - {operator: Exists}
