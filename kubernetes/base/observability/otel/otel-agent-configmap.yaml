apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent-config
  labels: {app.kubernetes.io/name: otel-agent, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
data:
  # 노드마다 하나. 하는 일은 세 가지다 —
  #   1. 같은 노드 워크로드의 OTLP 를 받는다(앱은 로컬 홉만 알면 된다)
  #   2. 컨테이너 로그를 읽는다 → Loki
  #   3. 노드 수준 hostmetrics 를 낸다(node-exporter 미배포분을 메운다)
  #
  # k8sattributes 는 게이트웨이가 아니라 여기 둔다. 게이트웨이에 두면
  # 소스 IP 가 에이전트 IP 라 파드 연결(connection)이 전부 오배정된다.
  otel-agent.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318


      # ★ 과금 계량 전용 filelog. **일반 filelog 와 별개의 수신기**다.
      #   같은 수신기에 필터를 걸어 가르지 않는 이유는, 필터가 조용히
      #   어긋나면 청구 데이터가 유실되거나 오염되기 때문이다. include 글롭이
      #   범위를 정하므로 어긋날 여지가 없다.
      #
      #   ★ 왜 Envoy 의 OTel ALS(gRPC)를 쓰지 않는가 — Istio 1.24 의
      #     envoyOtelAls 와 수집기 0.160 의 OTLP gRPC 수신기 사이에서
      #     `upstream reset: protocol error` 로 스트림이 끊긴다. 설정은
      #     정확했고(config_dump 확인) 연결도 성립했으며(cx_total 2)
      #     ztunnel 구간도 무오류인데 수신기가 한 건도 받지 못했다.
      #     HBONE 을 빼도 같았다. 그래서 **이미 검증된 stdout 경로**를 쓴다(§8-55).
      filelog/usage:
        include: [/var/log/pods/local_ingress-istio-*/istio-proxy/*.log]
        start_at: end
        storage: file_storage
        operators:
          # ① 계량 이벤트가 아닌 줄(기동 로그 등)을 먼저 버린다.
          #   ★ expr 은 자체 이스케이프 규칙이 있어 정규식에 백슬래시를 쓰면
          #     'invalid char escape' 로 **수집기가 기동하지 않는다.**
          - type: filter
            expr: 'body not matches "specversion"'
          # ② CRI 접두(<time> <stream> <F|P>)를 뗀다.
          #   ★ container 연산자는 이 로그에서 "Failed to process entry" 로
          #     실패해 접두가 그대로 Kafka 메시지에 남았다 — 계약 위반이다.
          #     형식이 고정되어 있으므로 정규식으로 직접 떼는 편이 확실하다.
          - type: regex_parser
            regex: '^\S+ \S+ \S+ (?P<event>\{.*\})\s*$'
            parse_from: body
            on_error: drop
          # ③ ★ 본문을 **맵**으로 만든다. 문자열로 두면 안 된다 —
          #   Kafka exporter 의 `raw` 인코딩은 문자열 본문을 JSON 으로 한 번 더
          #   감싸서 토픽에 `"{\"specversion\"...}"` 가 들어간다(실측: 첫 바이트가
          #   `"` 였다). 계약은 순수 JSON 객체를 요구하므로 소비자가 두 번
          #   파싱해야 하는 상태가 된다. 맵이면 raw 가 그대로 직렬화한다.
          #   `encoding: text` 는 이 버전에 없다(unrecognized logs encoding).
          - type: json_parser
            parse_from: attributes.event
            parse_to: body
            on_error: drop
          # ④ ★ 파티션 키. 계약이 "파티션 키는 subject(테넌트)" 를 규정한다 —
          #   한 고객의 이벤트가 순서를 유지해야 집계와 정정이 단순해진다.
          #   Kafka exporter 는 **리소스 속성**의 해시를 키로 쓰므로
          #   (partition_logs_by_resource_attributes) 테넌트를 거기로 올린다.
          #   이 파이프라인에는 다른 리소스 속성이 없으므로 키는 사실상
          #   테넌트 하나로 정해진다.
          - type: copy
            from: body.subject
            to: resource.tenant
            on_error: send

      filelog:
        include: [/var/log/pods/*/*/*.log]
        # 자기 자신과 게이트웨이는 제외한다. 내보내기 실패 로그가
        # 다시 수집되어 증폭되는 것을 막는다.
        exclude:
          - /var/log/pods/*_otel-agent-*/*/*.log
          - /var/log/pods/*_otel-gateway-*/*/*.log
        start_at: end
        # 오프셋을 디스크에 남긴다. 재시작 시 중복·누락 없이 이어 읽는다.
        storage: file_storage
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
            add_metadata_from_filepath: true

      hostmetrics:
        collection_interval: 60s
        scrapers:
          cpu: {}
          load: {}
          memory: {}
          network: {}

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 75
        spike_limit_percentage: 20

      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        # 이 노드의 파드만 감시한다. 단일 노드에서는 차이가 없으나
        # 멀티 노드로 갈 때 API 부하가 노드 수만큼 곱해지는 것을 막는다.
        filter:
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.node.name
            - k8s.container.name
          labels:
            - {tag_name: service, key: app.kubernetes.io/name, from: pod}
            - {tag_name: component, key: app.kubernetes.io/component, from: pod}
        pod_association:
          - sources: [{from: resource_attribute, name: k8s.pod.ip}]
          - sources: [{from: resource_attribute, name: k8s.pod.uid}]
          - sources: [{from: connection}]

      resourcedetection:
        detectors: [env, system]
        system:
          hostname_sources: [os]

      batch:
        timeout: 10s
        send_batch_size: 1024
        send_batch_max_size: 2048

    exporters:

      # ★ 과금 이벤트 -> Kafka. 게이트웨이(otel-gateway)를 거치지 않고
      #   에이전트가 직접 넣는다 — 홉이 하나 줄고, 게이트웨이 장애가
      #   청구 누락으로 이어지지 않는다.
      kafka/usage:
        brokers: ["kafka-headless:9092"]
        # ★ 파티션 키는 지금 붙지 않는다 — 메시지 key 가 null 이다.
        #   `partition_logs_by_resource_attributes` 는 최상위에서만 유효하고
        #   (logs 블록 아래에 두면 invalid keys 로 기동 실패), 최상위에 두어도
        #   raw·otlp_json 어느 인코딩에서도 키가 생기지 않았다. 리소스 속성
        #   `tenant` 는 실제로 붙어 있다(debug exporter 로 확인).
        #   **효과 없는 설정을 남기지 않는다** — 설정만 보고 "되고 있다" 고
        #   오해하는 것이 이 레포에서 반복된 실패 방식이다.
        #   계약(contracts/asyncapi/api-usage.yaml)의 파티션 규정은 아직
        #   충족되지 않았다. 다만 과금 정확성은 멱등성 키(id)와 관측 시각(time)이
        #   보장하므로 순서는 필수가 아니다 — 미결로 남긴다(§8-56).
        partition_logs_by_resource_attributes: false
        logs:
          topic: api-usage
          encoding: raw
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 60s
        sending_queue:
          enabled: true
          queue_size: 5000
      otlp:
        endpoint: otel-gateway:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
          queue_size: 1000

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otelcol
        timeout: 10s

    service:
      extensions: [health_check, file_storage]
      # 컬렉터 자신의 파이프라인 건전성(큐 적체·거부·유실)을 :8888 로 낸다.
      # 이게 없으면 데이터 유실이 조용히 일어난다.
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlp]
        metrics:
          receivers: [otlp, hostmetrics]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlp]
        # ★ 과금 파이프라인. 수신기·내보내기 모두 전용이다.
        logs/usage:
          receivers: [filelog/usage]
          processors: [memory_limiter, batch]
          exporters: [kafka/usage]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlp]
