apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-agent-config
  labels: {app.kubernetes.io/name: otel-agent, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
data:
  # 노드마다 하나. 하는 일은 세 가지다 —
  #   1. 같은 노드 워크로드의 OTLP 를 받는다(앱은 로컬 홉만 알면 된다)
  #   2. 컨테이너 로그를 읽는다 → Loki
  #   3. 노드 수준 hostmetrics 를 낸다(node-exporter 미배포분을 메운다)
  #
  # k8sattributes 는 게이트웨이가 아니라 여기 둔다. 게이트웨이에 두면
  # 소스 IP 가 에이전트 IP 라 파드 연결(connection)이 전부 오배정된다.
  otel-agent.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      filelog:
        include: [/var/log/pods/*/*/*.log]
        # 자기 자신과 게이트웨이는 제외한다. 내보내기 실패 로그가
        # 다시 수집되어 증폭되는 것을 막는다.
        exclude:
          - /var/log/pods/*_otel-agent-*/*/*.log
          - /var/log/pods/*_otel-gateway-*/*/*.log
        start_at: end
        # 오프셋을 디스크에 남긴다. 재시작 시 중복·누락 없이 이어 읽는다.
        storage: file_storage
        include_file_path: true
        include_file_name: false
        operators:
          - type: container
            id: container-parser
            add_metadata_from_filepath: true

      hostmetrics:
        collection_interval: 60s
        scrapers:
          cpu: {}
          load: {}
          memory: {}
          network: {}

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 75
        spike_limit_percentage: 20

      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        # 이 노드의 파드만 감시한다. 단일 노드에서는 차이가 없으나
        # 멀티 노드로 갈 때 API 부하가 노드 수만큼 곱해지는 것을 막는다.
        filter:
          node_from_env_var: KUBE_NODE_NAME
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.pod.start_time
            - k8s.deployment.name
            - k8s.statefulset.name
            - k8s.daemonset.name
            - k8s.node.name
            - k8s.container.name
          labels:
            - {tag_name: service, key: app.kubernetes.io/name, from: pod}
            - {tag_name: component, key: app.kubernetes.io/component, from: pod}
        pod_association:
          - sources: [{from: resource_attribute, name: k8s.pod.ip}]
          - sources: [{from: resource_attribute, name: k8s.pod.uid}]
          - sources: [{from: connection}]

      resourcedetection:
        detectors: [env, system]
        system:
          hostname_sources: [os]

      batch:
        timeout: 10s
        send_batch_size: 1024
        send_batch_max_size: 2048

    exporters:
      otlp:
        endpoint: otel-gateway:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
          queue_size: 1000

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      file_storage:
        directory: /var/lib/otelcol
        timeout: 10s

    service:
      extensions: [health_check, file_storage]
      # 컬렉터 자신의 파이프라인 건전성(큐 적체·거부·유실)을 :8888 로 낸다.
      # 이게 없으면 데이터 유실이 조용히 일어난다.
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlp]
        metrics:
          receivers: [otlp, hostmetrics]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlp]
        logs:
          receivers: [otlp, filelog]
          processors: [memory_limiter, k8sattributes, resourcedetection, batch]
          exporters: [otlp]
