# k8sattributes 프로세서가 파드·네임스페이스·워크로드를 조회한다. 읽기 전용이다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-agent
  labels: {app.kubernetes.io/name: otel-agent, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-agent
  labels: {app.kubernetes.io/name: otel-agent, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [replicasets, deployments, statefulsets, daemonsets]
    verbs: [get, list, watch]
  - apiGroups: ["extensions"]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-agent
  labels: {app.kubernetes.io/name: otel-agent, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: otel-agent}
subjects:
  - {kind: ServiceAccount, name: otel-agent, namespace: default}
