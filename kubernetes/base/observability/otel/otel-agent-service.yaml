# ★ 애플리케이션이 OTLP 를 보낼 수신 지점.
#
# 이게 없으면 애플리케이션은 에이전트를 **주소 지정할 방법이 없다.**
# NetworkPolicy(`allow-otel-agent-ingress`)는 네임스페이스 전체를 열어 두는데
# 정작 도달할 주소가 없어, 트레이싱 배선이 문서상으로만 존재하는 상태였다.
#
# `internalTrafficPolicy: Local` 이 핵심이다 —
#   · DaemonSet 앞의 보통 Service 는 **아무 노드의** 에이전트나 고른다.
#   · 앱은 자기 노드의 에이전트로 보내야 한다. 게이트웨이 쪽 k8sattributes 가
#     소스 IP 로 파드를 식별하는데, 다른 노드를 거치면 그 정보가 흐려진다.
#   · hostPort 로도 노드-로컬을 만들 수 있으나 이 클러스터의 Cilium 구성에서는
#     **hostPort 가 바인드되지 않는다**(노드에 리슨이 잡히지 않는다).
#     internalTrafficPolicy 는 CNI 에 의존하지 않는다.
apiVersion: v1
kind: Service
metadata:
  name: otel-agent
  labels:
    app.kubernetes.io/name: otel-agent
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: oneinchmarket
spec:
  type: ClusterIP
  internalTrafficPolicy: Local
  ports:
    - { port: 4317, targetPort: otlp-grpc, protocol: TCP, name: otlp-grpc }
    - { port: 4318, targetPort: otlp-http, protocol: TCP, name: otlp-http }
  selector:
    app.kubernetes.io/name: otel-agent
