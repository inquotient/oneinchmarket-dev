apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
  labels: {app.kubernetes.io/name: otel-gateway, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: otel-gateway}
  template:
    metadata:
      labels: {app.kubernetes.io/name: otel-gateway, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket}
      annotations:
        # 파이프라인이 prometheus 익스포터로 흘려 놓은 앱 메트릭을 가져간다.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8889"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: otel-gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: otel-gateway
          # ★ 컬렉터 설정 스키마는 마이너마다 바뀐다(Gotcha 20).
          #   올린 뒤에는 otelcol_receiver_accepted_log_records 로 확인할 것.
          image: docker.io/otel/opentelemetry-collector-contrib:0.160.0
          args:
            - --config=/conf/otel-gateway.yaml
          ports:
            - {containerPort: 4317, name: otlp-grpc, protocol: TCP}
            - {containerPort: 4318, name: otlp-http, protocol: TCP}
            - {containerPort: 4319, name: otlp-usage, protocol: TCP}
            - {containerPort: 8889, name: prom, protocol: TCP}
            - {containerPort: 8888, name: telemetry, protocol: TCP}
            - {containerPort: 13133, name: health, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits:   {cpu: 500m, memory: 512Mi}
          startupProbe:
            httpGet: {path: /, port: health}
            failureThreshold: 20
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /, port: health}
            periodSeconds: 15
          volumeMounts:
            - {name: config, mountPath: /conf}
      volumes:
        - name: config
          configMap: {name: otel-gateway-config}
