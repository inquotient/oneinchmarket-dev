apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-gateway-config
  labels: {app.kubernetes.io/name: otel-gateway, app.kubernetes.io/component: observability, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
data:
  # 백엔드를 아는 유일한 지점이다. 에이전트는 게이트웨이만 알고,
  # 백엔드 교체(Loki -> 다른 로그 저장소 등)는 여기 한 곳만 바뀐다.
  #
  #   traces  -> Tempo   (OTLP gRPC)
  #   logs    -> Loki    (OTLP HTTP. Loki 3.x 네이티브 /otlp 엔드포인트)
  #   metrics -> Prometheus 가 이 파드의 :8889 를 스크레이프한다(pull).
  #             remote-write 를 쓰지 않는 이유는 Prometheus 에 수신기를
  #             열지 않기 위해서다.
  otel-gateway.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

      # ★ 과금 계량 전용 수신기. 일반 로그(otlp:4317)와 **포트를 나눈다.**
      #   같은 수신기를 쓰면 애플리케이션 로그와 과금 이벤트가 한 파이프라인에
      #   섞여 Loki 로도 가고 Kafka 로도 간다. 필터로 가르는 방법도 있으나,
      #   필터가 조용히 어긋나면 **청구 데이터가 유실되거나 오염된다.**
      #   포트로 가르면 어긋날 여지가 없다.
      # ★ L0 랩(OPNsense)의 Suricata EVE JSON.
      #   2026-09-11 에 Logstash 에서 옮겨 왔다 — 그쪽은 syslog 헤더를
      #   정규식으로 손수 떼고 있었는데 여기 syslog 수신기는 RFC5424 를
      #   **네이티브로** 판다(LOCAL-DEPLOYMENT §9-18).
      #   ★★ 옮긴 진짜 이유는 성능이 아니라 **그 경로가 죽어 있었기** 때문이다
      #     — `suricata-*` 인덱스가 0건이었다(§25-2). 도는 것을 옮긴 것이 아니라
      #     고장난 것을 더 나은 자리에 다시 지은 것이다.
      syslog/suricata:
        tcp:
          listen_address: 0.0.0.0:5140
        # syslog-ng 가 RFC5424 로 보낸다.
        protocol: rfc5424
        operators:
          # ① EVE JSON 인지 엔진 자체 로그인지 가른다.
          #   ★ expr 에 정규식을 쓰지 않는다 — 백슬래시를 쓰면 수집기가
          #     기동하지 않는다(Gotcha 22). `contains` 로 충분하다.
          - type: router
            id: suricata-split
            routes:
              # ★ `body.message` 를 쓰지 말 것 — syslog 수신기는 RFC5424 필드를
              #   attributes 로 보내고 **body 에는 MSG 문자열만** 남긴다.
              #   맵인 줄 알고 `body.message` 로 쓰면 expr 이 오류를 내고
              #   그 엔트리는 통째로 버려진다(실측: "Running expression returned
              #   an error" -> "Failed to write entry"). string() 으로 감싸면
              #   body 가 무엇이든 안전하다.
              # ★ syslog 수신기는 RFC5424 를 풀어 **attributes 로** 보낸다 —
              #   MSG 는 `attributes.message`, 헤더는 appname·hostname·priority
              #   등으로 나뉘고 **body 는 원본 줄 그대로** 남는다(실측으로 확인).
              #   처음에 `body.message` 로 썼다가 expr 오류로 엔트리가 통째로
              #   버려졌고, `string(body)` 로 바꿔 살렸지만 파싱 출처가 틀려
              #   EVE 가 풀리지 않았다. 판정은 문서를 직접 열어 보는 것이었다.
              - expr: 'attributes.message != nil and attributes.message contains "{"'
                output: suricata-eve
            default: suricata-engine-mark
          # ② EVE JSON 을 파싱한다. 실패해도 버리지 않고 그대로 보낸다.
          - type: json_parser
            id: suricata-eve
            parse_from: attributes.message
            parse_to: body
            on_error: send
            output: suricata-eve-mark
          - type: add
            id: suricata-eve-mark
            # ★ 인덱스 이름을 **속성으로 실어 보내지 않는다.** Data Prepper 의
            #   `${/resource/attributes/...}` 치환에 기대 봤더니 값이 비어
            #   인덱스가 `-2026.09.11` 이 됐다(실측). 경로를 맞히려 씨름하는
            #   대신 **OTel 에서 갈라 다른 포트로 보낸다** — Data Prepper 쪽은
            #   파이프라인마다 인덱스가 **고정**이라 어긋날 여지가 없다.
            #   (§8-55 가 과금에서 전용 수신기를 쓴 것과 같은 판단이다.)
            field: resource.oim_target
            value: suricata
            output: suricata-time
          # ★★ EVE 의 timestamp 를 이벤트 시각으로 쓴다. **수신 시각을 쓰지 말 것**
          #   — 상관분석에서 순서가 어긋난다(Gotcha 33 이 Alertmanager 에서
          #   같은 이유로 startsAt 을 쓰라고 한 것과 같다).
          #   실패해도 버리지 않는다(on_error: send).
          - type: time_parser
            id: suricata-time
            parse_from: body.timestamp
            layout_type: strptime
            layout: '%Y-%m-%dT%H:%M:%S.%f%z'
            on_error: send
            output: suricata-kind
          # ★ alert 와 그 밖을 가른다. ★★ 단 **syslog 경로에는 drop 이벤트가
          #   오지 않는다** — OPNsense 의 suricata.yaml 에서 파일 출력은
          #   alert·anomaly·drop·ssh 인데 syslog 출력은 alert 하나뿐이다(실측).
          #   차단 여부는 `alert.action == "blocked"` 로 판정한다.
          - type: add
            id: suricata-kind
            field: attributes.event_kind
            value: 'EXPR(body.event_type == "alert" ? "alert" : "event")'
            output: suricata-action
          - type: add
            id: suricata-action
            field: attributes.event_action
            value: 'EXPR(body.alert != nil and body.alert.action != nil ? body.alert.action : "")'
            output: suricata-common
          # ③ 엔진 로그. **버리지 않는다** — §8-33 에서 조용히 실패한 신호가
          #   정확히 이것이었다("1 rule files specified, but no rules were
          #   loaded!"). 보안 이벤트와 섞으면 탐지 지표가 오염되므로
          #   인덱스만 분리한다.
          - type: add
            id: suricata-engine-mark
            field: resource.oim_target
            value: suricata-engine
            output: suricata-common
          - type: add
            id: suricata-common
            field: resource.event_module
            value: suricata

      otlp/usage:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4319
          # ★ 진단용 HTTP. gRPC(4319)로 아무것도 안 들어올 때 이쪽으로
          #   합성 OTLP 를 넣어 **수집기 쪽인지 보내는 쪽인지** 가른다.
          http:
            endpoint: 0.0.0.0:4320

    processors:
      memory_limiter:
        check_interval: 5s
        limit_percentage: 75
        spike_limit_percentage: 20

      batch:
        timeout: 10s
        send_batch_size: 1024
        send_batch_max_size: 2048

    exporters:
      otlp/tempo:
        endpoint: tempo-headless:4317
        tls:
          insecure: true
        retry_on_failure:
          enabled: true

      # otlphttp 는 엔드포인트에 /v1/logs 를 덧붙인다.
      # -> http://loki-headless:3100/otlp/v1/logs
      otlphttp/loki:
        endpoint: http://loki-headless:3100/otlp
        retry_on_failure:
          enabled: true


      # ★ 과금 이벤트 -> Kafka. encoding: raw 는 로그 레코드의 **본문을 그대로**
      #   메시지로 넣는다. Envoy 가 낸 CloudEvents JSON 한 줄이 그대로 토픽에
      #   들어가므로 contracts/asyncapi/api-usage.yaml 과 일치한다.
      #   otlp_json 을 쓰면 OTel 봉투가 한 겹 더 씌워져 계약이 깨진다.
      #
      #   ★ 재시도를 켠다. 과금 이벤트의 유실은 곧 매출 누락이다.
      #     큐가 가득 차면 버리는 대신 배압을 준다(sending_queue).
      kafka/usage:
        brokers: ["kafka-headless:9092"]
        # ★ 최신 contrib 수집기는 topic·encoding 을 **신호별 블록**으로 옮겼다.
        #   최상위에 두면 기동하지 않는다:
        #     'kafkaexporter.Config' has invalid keys: encoding, topic
        logs:
          topic: api-usage
          # raw 는 로그 레코드의 **본문**을 그대로 메시지로 넣는다.
          # Envoy 가 낸 CloudEvents JSON 한 줄이 그대로 토픽에 들어가
          # contracts/asyncapi/api-usage.yaml 과 일치한다.
          # otlp_json 을 쓰면 OTel 봉투가 한 겹 더 씌워져 계약이 깨진다.
          encoding: raw
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 60s
        sending_queue:
          enabled: true
          queue_size: 5000

      # ★ Data Prepper -> OpenSearch. Filebeat 이 하던 일을 대체한다.
      #   otel-agent 가 이미 /var/log/pods/*/*/*.log 를 전부 읽고 있으므로
      #   노드 수집기를 새로 만들지 않는다(WSO2-OSS-MAPPING §9-1).
      #   ★ Loki 와 **함께** 내보낸다 — 하나를 끊고 다른 하나를 붙이지 않는다.
      #     전환 중에 로그를 볼 수 있는 곳이 항상 한 군데는 있어야 한다.
      otlp/dataprepper:
        endpoint: data-prepper:21892
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 60s
        sending_queue:
          enabled: true
          queue_size: 2000

      # ★ Suricata 전용. 일반 로그(otlp/dataprepper)와 **수신기·내보내기를
      #   모두 분리**한다 — 한 파이프라인에 필터로 가르면 조용히 어긋날 때
      #   보안 이벤트가 일반 로그에 섞인다(§8-55 가 과금에서 같은 이유로
      #   전용 수신기를 쓴 것과 같은 판단이다).
      otlp/dataprepper-suricata:
        endpoint: data-prepper:21893
        tls:
          insecure: true
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
          queue_size: 1000

      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion:
          enabled: true

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      # 컬렉터 자신의 파이프라인 건전성(큐 적체·거부·유실)을 :8888 로 낸다.
      # 이게 없으면 데이터 유실이 조용히 일어난다.
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlphttp/loki, otlp/dataprepper]
        # ★ 과금 파이프라인. 수신기·내보내기 모두 전용이라 일반 로그와
        #   섞이지 않는다. batch 는 두되 memory_limiter 도 같이 둔다 —
        #   과금 이벤트가 폭주해 수집기가 죽으면 그 구간이 통째로 비는데,
        #   그것은 청구 누락으로 이어진다.
        logs/suricata:
          receivers: [syslog/suricata]
          processors: [memory_limiter, batch]
          exporters: [otlp/dataprepper-suricata]
        logs/usage:
          receivers: [otlp/usage]
          processors: [memory_limiter, batch]
          exporters: [kafka/usage]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
