apiVersion: v1
kind: ConfigMap
metadata:
  name: backstage-config
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: developer-portal
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
data:
  # ── app-config.production.yaml ────────────────────────────────────────
  #
  # ★ 이 이미지는 `node packages/backend --config app-config.yaml
  #   --config app-config.production.yaml` 로 뜬다(이미지 config 에서 직접
  #   확인했다). 뒤 파일이 앞을 덮으므로 **여기서 필요한 것만** 적는다.
  #   subPath 로 그 한 파일만 갈아끼운다 — 디렉터리째 마운트하면 이미지가
  #   들고 온 app-config.yaml 까지 가려진다.
  #
  # ★★ 비밀번호는 값이 아니라 **환경변수 참조**로 적는다. 이 ConfigMap 은
  #   git 에 있고 ArgoCD 가 렌더한다 — 값을 적으면 그대로 커밋된다.
  app-config.production.yaml: |
    app:
      # ★ port-forward 로만 접근한다(local/ACCESS.md 규약). 게이트웨이
      #   경로에 올리려면 이 값과 backend.baseUrl·cors 를 함께 바꿔야 한다.
      # ★★ 브라우저가 실제로 쓰는 포트와 **정확히** 같아야 한다 —
      #   ACCESS.md 는 17007 로 안내하는데 여기는 7007 이었다. guest 일 때는
      #   드러나지 않았지만 OIDC 는 이 값이 곧 콜백 URL 이라 어긋나면
      #   Keycloak 이 `Invalid parameter: redirect_uri` 로 거부한다.
      baseUrl: http://localhost:17007
      title: OneinchMarket Developer Portal

    organization:
      name: OneinchMarket

    backend:
      baseUrl: http://localhost:17007
      listen:
        host: 0.0.0.0
        port: 7007
      cors:
        origin: http://localhost:17007
        methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
        credentials: true
      # 세션·토큰 서명 키. 없으면 기동하지 않는다.
      auth:
        keys:
          - secret: ${BACKSTAGE_BACKEND_SECRET}
      database:
        client: pg
        # ★★★ Backstage 는 기본적으로 **플러그인마다 데이터베이스를 하나씩
        #   만든다**(backstage_plugin_app · _catalog · _auth …). 그러려면
        #   롤에 CREATEDB 권한이 필요하다 — 앱 하나에게 주기에는 넓다.
        #   실측 오류:
        #     CREATE DATABASE "backstage_plugin_app" - permission denied
        #   ★ 연결·인증은 성공한 뒤에 나는 오류라 자격 문제로
        #     읽히기 쉽다 — 문구를 끝까지 읽을 것.
        #
        #   `schema` 로 두면 **한 데이터베이스 안의 스키마**로 나누므로
        #   CREATEDB 가 필요 없다. 롤은 그 DB 의 소유자라 스키마를
        #   만들 수 있다 — 권한을 넓히는 대신 범위를 옆으로 옥긴 것이다.
        pluginDivisionMode: schema
        connection:
          host: postgresql-headless
          port: 5432
          user: backstage
          password: ${BACKSTAGE_DB_PASSWORD}
          # 이 클러스터의 PostgreSQL 은 TLS 를 쓰지 않는다.
          ssl: false

    auth:
      # ★★ OIDC 는 **세션이 필요하다** — 없으면 `/api/auth/oidc/start` 가
      #   `500 Authentication failed, authentication requires session support`
      #   로 죽는다(실측). guest 에는 없던 요구라 옮길 때 드러난다.
      #   nonce·state 를 브라우저 세션에 담아 CSRF 를 막는 장치다.
      session:
        secret: ${BACKSTAGE_SESSION_SECRET}
      # ★ 이 값이 아래 `oidc.production` 을 고른다. **프런트도 같은 값을 읽는다**
      #   (packages/app/src/modules/auth). 어긋나면 로그인 버튼이 그대로인데
      #   "provider not configured" 로 실패한다.
      environment: production
      providers:
        oidc:
          production:
            # ★★★ 브라우저와 백엔드가 **같은 URL 로** Keycloak 을 봐야 한다.
            #   브라우저는 authorization_endpoint 로 리다이렉트되고 백엔드는
            #   같은 메타데이터로 토큰을 교환한다. 서로 다른 이름을 쓰면
            #   issuer 가 갈려 로그인이 깨진다(Keycloak 은 iss 를 요청 Host 로
            #   만든다 — Gotcha 69).
            #
            #   그래서 클러스터 안 이름을 그대로 쓰고, Windows 쪽에서
            #   그 이름을 127.0.0.1 로 풀리게 한다:
            #     hosts:  127.0.0.1 keycloak-headless
            #     forward: kubectl -n local port-forward keycloak-0 8080:8080
            #   (local/ACCESS.md 에 적어 두었다)
            metadataUrl: http://keycloak-headless:8080/realms/oneinchmarket/.well-known/openid-configuration
            clientId: backstage
            clientSecret: ${BACKSTAGE_OIDC_CLIENT_SECRET}
            prompt: auto
            signIn:
              resolvers:
                # ★ 토큰의 이메일 로컬파트를 카탈로그의 User 엔티티 이름과
                #   맞춘다(portal@... -> User:portal). **그 엔티티가 없으면
                #   로그인이 "user not found" 로 실패한다** — 카탈로그
                #   ConfigMap 에 함께 넣어 두었다.
                - resolver: emailLocalPartMatchingUserEntityName

    kubernetes:
      # ★★★ 이 블록이 **없으면 기동하지 않는다.** 예제 앱은 kubernetes
      #   플러그인을 포함하고, 그 플러그인은 설정이 없으면
      #   `Error: Kubernetes configuration is missing` 으로 프로세스를 죽인다.
      #
      #   ★★ 그리고 그 죽음이 **다른 오류를 덮는다** — catalog 의
      #   마이그레이션이 도는 중에 죽으므로 knex 잠금이 남고,
      #   그 다음부터는 모든 실행이 `Migration table is already locked` 로
      #   즉사한다. 잠금만 풀면 같은 일이 반복된다 — 살아 있는 로그는
      #   증상만 보여주고 **진짜 오류는 첫 실행의 로그(--previous)에** 있다.
      #
      # ★ 클러스터를 **일부러 비워 둔다.** 연결하면 카탈로그 엔티티의
      #   `backstage.io/kubernetes-id` 가 살아나지만, 이 포털은 guest 인증이라
      #   **도달한 사람 전부가 같은 익명 사용자**다. 거기에 클러스터
      #   읽기 권한을 붙이면 인증 없는 UI 로 파드 상태가 새는 것이 된다.
      #   연결은 OIDC 로 바꾸는 시점에 함께 할 일이다(auth 블록 주석 참조).
      serviceLocatorMethod:
        type: multiTenant
      clusterLocatorMethods:
        - type: config
          clusters: []

    catalog:
      # 스캐폴더가 만드는 엔티티 종류. 예제 앱 기본값을 그대로 둔다.
      rules:
        - allow: [Component, System, API, Resource, Location, Domain, Group, User]
      locations:
        # ★ 카탈로그가 비어 있으면 이 도구는 아무 값도 하지 않는다.
        #   이 플랫폼의 실제 워크로드를 정적 엔티티로 넣어 둔다.
        #   나중에 GitLab 연동(catalog.providers.gitlab)으로 옮길 때
        #   이 파일이 그 형식의 본보기가 된다.
        - type: file
          target: /app/catalog/entities.yaml
