apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  labels:
    app.kubernetes.io/name: backstage
    app.kubernetes.io/component: developer-portal
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # 이 노드에서 maxSurge 기본값은 무중단이 아니라 교착이다(Gotcha 87).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backstage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backstage
        app.kubernetes.io/component: developer-portal
        app.kubernetes.io/part-of: oneinchmarket
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: backstage
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # 이미지의 `node` 사용자다(이미지 config 에서 확인).
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # DB 가 없으면 Backstage 는 마이그레이션에서 죽는다. 기다린다.
        - name: wait-postgres
          image: docker.io/library/postgres:18.6
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              i=0
              # ★ `-U` 를 반드시 줄 것. 이 파드는 uid 1000 으로 도는데
              #   그 uid 가 이미지의 /etc/passwd 에 없어 pg_isready 가 기본
              #   사용자명을 정하지 못하고 **연결을 시도조차 하지 않는다**
              #   (`no attempt`, exit=3). ★★ 증상이 네트워크 차단과
              #   구분되지 않아 메시·정책을 먼저 의심하게 된다 — 실제로
              #   그러다 2분을 썼다. `-q` 를 빼고 돌려 exit 코드를 읽어야
              #   갈린다(3 = 시도 안 함, 2 = 응답 없음).
              #   인증은 하지 않는다 — 이름은 연결 문자열을 만들 때만 쓰인다.
              until pg_isready -h postgresql-headless -p 5432 -U postgres -q; do
                i=$((i+1))
                [ "$i" -gt 60 ] && { echo "PostgreSQL 이 5분 안에 응답하지 않았다"; exit 1; }
                echo "  PostgreSQL 대기 ($i/60)"; sleep 5
              done
              echo "PostgreSQL 응답함"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
      # ★ 자체 빌드 이미지라 레지스트리 자격이 필요하다. 파드 자체는
      #   반입본으로 뜨지만(IfNotPresent), **Trivy 스캔 Job 이**
      #   레지스트리에서 당길 때 이 자격을 쓴다 — 없으면 조용히
      #   스캔되지 않는다(§8-79 · Gotcha 130).
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: backstage
          # ★★ 공식 예제 이미지(ghcr.io/backstage/backstage)에서 **자체 빌드로
          #   바꿨다** — Keycloak OIDC 때문이다. 그 이미지는 auth 모듈로
          #   guest 만 등록하고 프런트 번들도 guest 만 참조한다(실측).
          #   OIDC 모듈은 node_modules 에 있으나 **붙어 있지 않고**, 프런트
          #   사인인 페이지는 코드라 설정으로 바꿀 수 없다.
          #   앱 소스와 사유는 `docker/backstage/` 에 있다.
          # ★ 다이제스트를 적지 않는다 — 우리가 빌드해 반입하는 이미지라
          #   태그가 곧 우리 산출물이다(다른 로컬 빌드 9종과 같은 규약).
          image: gitlab-registry.local.svc.cluster.local:5050/oneinch/backstage:1.54.0
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKSTAGE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: backstage-secret, key: db-password } }
            - name: BACKSTAGE_BACKEND_SECRET
              valueFrom: { secretKeyRef: { name: backstage-secret, key: backend-secret } }
            # Keycloak 클라이언트 시크릿. app-config 가 ${BACKSTAGE_OIDC_CLIENT_SECRET}
            # 로 참조한다 — ConfigMap 에 값을 적지 않기 위해서다.
            - name: BACKSTAGE_OIDC_CLIENT_SECRET
              valueFrom: { secretKeyRef: { name: backstage-secret, key: oidc-client-secret } }
            # OIDC 흐름의 세션 서명 키. backend-secret 과 **다른 값**을 쓴다 —
            # 역할이 다르고, 하나가 새면 둘 다 새는 구조를 만들지 않는다(§8-44).
            - name: BACKSTAGE_SESSION_SECRET
              valueFrom: { secretKeyRef: { name: backstage-secret, key: session-secret } }
          ports:
            - name: http
              containerPort: 7007
              protocol: TCP
          # ★ 추측하지 않고 **띄운 뒤 실측해서** 좁혔다. 2026-09-10 확인:
          #     /.backstage/health/v1/readiness -> 200
          #     /.backstage/health/v1/liveness  -> 200
          #     /healthcheck                    -> 200 (구판 별칭)
          #   `/` 는 백엔드가 프런트를 서빙하기만 해도 200 이라 "떠 있는가"
          #   밖에 보지 못한다(Gotcha 48). readiness 는 플러그인 초기화와
          #   DB 마이그레이션이 끝난 뒤에야 200 이 된다.
          startupProbe:
            httpGet: { path: /.backstage/health/v1/readiness, port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /.backstage/health/v1/readiness, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /.backstage/health/v1/liveness, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 100m
              memory: 640Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            # ★★★ **재보고 끈다** — 켜서는 안 된다. 2026-09-10 실측:
            #   rootfs 쓰기가 정확히 **1건**이고 그것이
            #   `/app/packages/app/dist/static/module-backstage.*.js` 다.
            #   파드 기동 13:17:36 → 파일 mtime 13:17:41 (5초 뒤)이고
            #   내용에 `app.baseUrl`(localhost:7007)이 들어 있다 — 즉
            #   **백엔드가 기동 시 프런트 번들에 런타임 설정을 주입한다.**
            #   켜면 그 쓰기가 실패하고 전례대로 **조용히** 깨진다 —
            #   파드는 Ready 이고 프런트만 잘못된 설정을 쓴다.
            #   Dependency-Track 프런트(Gotcha 48)·Grafana(Gotcha 96)에 이은
            #   **세 번째** 사례다 — 이미지가 자기 정적 파일을 고치는 부류.
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # ★ subPath 로 **그 한 파일만** 갈아끼운다. 디렉터리째 마운트하면
            #   이미지가 들고 온 app-config.yaml 까지 가려져 기동하지 않는다.
            - name: config
              mountPath: /app/app-config.production.yaml
              subPath: app-config.production.yaml
              readOnly: true
            - name: catalog
              mountPath: /app/catalog
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: backstage-config
        - name: catalog
          configMap:
            name: backstage-catalog
        - name: tmp
          emptyDir: {}
