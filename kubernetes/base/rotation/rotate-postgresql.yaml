# PostgreSQL superuser(postgres) 비밀번호 로테이션 — **OpenBao 가 원천** (2026-11-06 재설계)
#
# ★★★ 옛 판이 한 번도 성공하지 않았고, 성공했다면 장애였다 — 세 겹이었다(Gotcha 212).
#   ① SA secret-rotator 가 메시 인가 정책에 없어 DB 연결에서 거부됐다(그 덕에 아무것도 바뀌지 않았다)
#   ② 그것을 열면 **DB 비밀번호부터 바꾸고** 다음 줄의 `kubectl` 에서 죽었다 — 이미지에 kubectl 이 없다
#   ③ 바꾼 키(`postgres-password`)와 소비자가 읽는 키(`postgresql-password`)가 달랐고, 그 Secret 은
#      ESO 가 OpenBao 에서 1시간마다 덮어쓴다 — Secret 만 고치면 한 시간 안에 옛 값으로 돌아간다
#
# ★ 새 순서(실패하면 그 자리에서 되돌린다):
#   [tools]  openbao 이미지에서 bao 바이너리를 emptyDir 로 복사
#   [rotate] postgres 이미지 —
#     1) 자기 SA 로 OpenBao 로그인(역할 rotator-postgresql · 자기 경로 하나만 읽고 쓴다)
#     2) OpenBao 의 현재 값 = 두 별칭 키 = k8s Secret 인지 확인 — 다르면 멈춘다(드리프트 위에서 돌지 않는다)
#     3) 현재 값으로 DB 접속 확인 → 새 값 생성 → ALTER USER
#     4) 새 값으로 접속 확인 — 실패하면 DB 를 옛 값으로 되돌리고 실패
#     5) OpenBao 에 두 별칭 키를 함께 patch — 실패하면 DB 를 되돌리고 실패
#     6) 새 값의 **해시만** 다음 단계에 넘긴다(값은 파드 파일시스템에도 남기지 않는다)
#   [sync]   alpine/kubectl — ExternalSecret 강제 동기화 → k8s Secret 의 해시가 같아질 때까지 기다린다
#            → Reloader 가 소비자를 재시작한다(shardingsphere · postgresql · ranger-admin 등)
#   ★ 5) 이후 [sync] 가 실패해도 DB 와 OpenBao 는 일치한다 — ESO 가 1시간 안에 따라온다(그 사이 새 연결이
#     실패할 수 있으므로 Job 실패로 드러낸다).
#
# ★ suspend: true — 검증 전까지 자동으로 돌지 않는다. 수동 실행:
#     kubectl -n local create job --from=cronjob/rotate-postgresql-password rotate-postgresql-manual-$(date +%s)
# ★ 전제(레포 밖 원천): local/openbao-rotator-setup.sh 가 정책·역할 rotator-postgresql 을 만든다.
#   메시(allow-database-access 5432) · NetworkPolicy(allow-postgresql-access · allow-openbao-access)에도
#   이 SA/라벨이 있어야 한다 — 빠지면 1)·3) 에서 연결이 막힌다(옛 판의 ① 이 그것이었다).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rotator-postgresql
  labels:
    app.kubernetes.io/name: rotator-postgresql
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rotator-postgresql
  labels:
    app.kubernetes.io/name: rotator-postgresql
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
rules:
  # 해시 대조용 읽기 · 강제 동기화용 annotate — 이름 하나로 한정한다. Secret 을 **쓰지 않는다**(원천은 OpenBao).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["postgresql-secret"]
    verbs: ["get"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    resourceNames: ["postgresql-secret"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rotator-postgresql
  labels:
    app.kubernetes.io/name: rotator-postgresql
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rotator-postgresql
subjects:
  - kind: ServiceAccount
    name: rotator-postgresql
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotate-postgresql-password
  labels:
    app.kubernetes.io/name: rotate-postgresql-password
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  schedule: "0 3 1,15 * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # ★ 재시도하지 않는다 — 반쯤 진행된 로테이션 위에서 다시 시작하면 2) 의 드리프트 검사가 막지만,
      #   실패는 사람이 보고 판단할 일이다.
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rotator-postgresql
            app.kubernetes.io/component: rotation
            app.kubernetes.io/part-of: oneinchmarket
            app.kubernetes.io/managed-by: kustomize
        spec:
          serviceAccountName: rotator-postgresql
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            # ★ 디스크 emptyDir 이다 — medium: Memory(tmpfs)에 쓴 페이지는 **쓴 컨테이너의 메모리 limit 에
            #   계산된다.** bao 바이너리가 limit 128Mi 보다 커서 tools 가 OOMKilled(137)였다(2026-11-06 실측).
            #   여기 들어가는 것은 공개 바이너리와 해시뿐이라 메모리에 둘 이유가 없다.
            - name: tools
              emptyDir: {sizeLimit: 512Mi}
          initContainers:
            - name: tools
              image: docker.io/openbao/openbao:2.4.1
              command: ["/bin/sh", "-c", "cp /bin/bao /tools/bao && /tools/bao version"]
              volumeMounts: [{name: tools, mountPath: /tools}]
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits:   {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
            - name: rotate
              image: docker.io/library/postgres:18.6
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  B=/tools/bao
                  export BAO_ADDR=http://openbao.local.svc.cluster.local:8200 HOME=/tmp
                  sha() { printf '%s' "$1" | sha256sum | cut -d' ' -f1; }
                  pg() { PGPASSWORD="$1" psql -h postgresql-headless -U postgres -v ON_ERROR_STOP=1 -tAq "${@:2}"; }
                  alter() {  # alter <접속 비밀번호> <바꿀 비밀번호> — 값은 인자가 아니라 stdin 으로
                    printf "ALTER USER postgres WITH PASSWORD '%s';\n" "$2" | pg "$1" -f -
                  }

                  echo "[1/6] OpenBao 로그인 (rotator-postgresql)"
                  BAO_TOKEN=$($B write -field=token auth/kubernetes/login role=rotator-postgresql \
                    jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)
                  export BAO_TOKEN

                  echo "[2/6] 원천 일치 확인 (OpenBao 두 키 = k8s Secret)"
                  OLD=$($B kv get -mount=oim -field=postgresql-password postgresql-secret)
                  ALIAS=$($B kv get -mount=oim -field=postgres-password postgresql-secret)
                  [ -n "$OLD" ] || { echo "OpenBao 값이 비었다" >&2; exit 1; }
                  [ "$OLD" = "$ALIAS" ] || { echo "OpenBao 의 두 별칭 키가 다르다 — 멈춘다" >&2; exit 1; }
                  [ "$OLD" = "$K8S_CURRENT" ] || { echo "OpenBao 와 k8s Secret 이 다르다 — ESO 동기화부터 볼 것" >&2; exit 1; }

                  echo "[3/6] 현재 값으로 접속 확인 → 새 값으로 변경"
                  [ "$(pg "$OLD" -c 'select 1')" = 1 ] || { echo "현재 값으로 접속할 수 없다" >&2; exit 1; }
                  # 유한 입력이라 pipefail 아래에서 SIGPIPE 가 나지 않는다(실측 — Gotcha 115 와 다른 모양).
                  NEW=$(head -c 48 /dev/urandom | base64 | tr -d '=+/\n' | cut -c1-32)
                  [ "${#NEW}" -ge 24 ] || { echo "생성한 값이 짧다" >&2; exit 1; }
                  alter "$OLD" "$NEW"

                  rollback() {
                    echo "[rollback] DB 를 옛 값으로 되돌린다" >&2
                    alter "$NEW" "$OLD" || alter "$OLD" "$OLD" || echo "[rollback] 실패 — 사람이 볼 것" >&2
                  }

                  echo "[4/6] 새 값으로 접속 확인"
                  if [ "$(pg "$NEW" -c 'select 1' 2>/dev/null || true)" != 1 ]; then rollback; exit 1; fi

                  echo "[5/6] OpenBao 에 기록 (두 별칭 키를 함께)"
                  if ! printf '{"postgresql-password":"%s","postgres-password":"%s"}' "$NEW" "$NEW" \
                       | $B kv patch -mount=oim postgresql-secret - >/dev/null; then rollback; exit 1; fi
                  [ "$($B kv get -mount=oim -field=postgresql-password postgresql-secret)" = "$NEW" ] \
                    || { echo "OpenBao 되읽기가 다르다" >&2; rollback; exit 1; }

                  echo "[6/6] 다음 단계에 해시만 넘긴다"
                  sha "$NEW" > /tools/expected.sha
                  echo "DB · OpenBao 갱신 완료"
              env:
                - name: K8S_CURRENT
                  valueFrom: {secretKeyRef: {name: postgresql-secret, key: postgresql-password}}
              volumeMounts: [{name: tools, mountPath: /tools}]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits:   {cpu: 300m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
          containers:
            - name: sync
              image: docker.io/alpine/kubectl:1.36.4
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  want=$(cat /tools/expected.sha)
                  h() { kubectl get secret postgresql-secret -o go-template="{{index .data \"$1\" | base64decode}}" | sha256sum | cut -d' ' -f1; }
                  echo "[sync] ExternalSecret 강제 동기화"
                  kubectl annotate externalsecret postgresql-secret force-sync="$(date +%s)" --overwrite >/dev/null
                  i=0
                  while [ $i -lt 60 ]; do
                    if [ "$(h postgresql-password)" = "$want" ] && [ "$(h postgres-password)" = "$want" ]; then
                      echo "[sync] k8s Secret 갱신 확인 — Reloader 가 소비자를 재시작한다"; exit 0
                    fi
                    i=$((i+1)); sleep 3
                  done
                  echo "[sync] 180초 안에 k8s Secret 이 따라오지 않았다 — DB·OpenBao 는 새 값이다. ESO 상태를 볼 것" >&2
                  exit 1
              volumeMounts: [{name: tools, mountPath: /tools, readOnly: true}]
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits:   {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
