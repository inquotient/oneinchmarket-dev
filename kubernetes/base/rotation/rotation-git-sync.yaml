apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotation-git-sync
  labels:
    app.kubernetes.io/name: rotation-git-sync
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  schedule: "30 3 1,15 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rotation-git-sync
            app.kubernetes.io/component: rotation
            app.kubernetes.io/part-of: oneinchmarket
        spec:
          serviceAccountName: secret-rotator
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: git-sync
              image: alpine/git:latest
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  echo "[1/4] Installing dependencies..."
                  apk add --no-cache sops age kubectl > /dev/null 2>&1

                  export SOPS_AGE_KEY_FILE=/age/keys.txt

                  echo "[2/4] Cloning repository..."
                  git clone --depth 1 --branch v2 \
                    "https://oauth2:${GIT_TOKEN}@gitlab.oneinchmarket.co.kr/infra/oneinchmarket-infra.git" \
                    /tmp/repo
                  cd /tmp/repo

                  git config user.name "secret-rotator"
                  git config user.email "rotator@oneinchmarket.co.kr"

                  echo "[3/4] Encrypting rotated secrets..."
                  SECRETS="postgresql-secret mariadb-secret mongodb-secret redis-secret elasticsearch-secret minio-secret keycloak-secret"

                  for secret_name in ${SECRETS}; do
                    if kubectl get secret "${secret_name}" > /dev/null 2>&1; then
                      kubectl get secret "${secret_name}" -o yaml \
                        | grep -v '^\s*resourceVersion\|^\s*uid\|^\s*creationTimestamp\|^\s*selfLink\|^\s*managedFields' \
                        | sops --encrypt --input-type yaml --output-type yaml /dev/stdin \
                        > "kubernetes/base/rotation/secrets/${secret_name}.enc.yaml" 2>/dev/null || true
                    fi
                  done

                  echo "[4/4] Committing and pushing..."
                  git add -A
                  git diff --cached --quiet || {
                    git commit -m "chore: auto-rotate secrets $(date +%Y-%m-%d)"
                    git push origin v2
                    echo "Secrets synced to Git."
                  }

                  echo "Git sync completed."
              env:
                - name: GIT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: gitlab-deploy-token
                      key: token
              volumeMounts:
                - name: age-key
                  mountPath: /age
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: age-key
              secret:
                secretName: sops-age
