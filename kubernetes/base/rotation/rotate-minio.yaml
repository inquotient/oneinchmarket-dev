apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotate-minio-password
  labels:
    app.kubernetes.io/name: rotate-minio-password
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  schedule: "15 3 1,15 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rotate-minio-password
            app.kubernetes.io/component: rotation
            app.kubernetes.io/part-of: oneinchmarket
        spec:
          serviceAccountName: secret-rotator
          # ★★★ quay.io 자격 (2026-10-05). MinIO 는 2026-09-11 에 Docker Hub
          #   에서 **저장소째 삭제**됐고(실측: `object not found`) quay.io 는
          #   2026-09-24 부터 익명 pull 을 막는다(실측: manifest HEAD 가 401,
          #   404 가 아니다 — 즉 자격이 있으면 받아진다).
          #   mirror.gcr.io·public.ecr.aws 에도 없다.
          # ★ 이 Secret 은 **이 레포가 만들지 못한다** — quay 로봇 토큰이다.
          #   `local/quay-pull-secret.sh` 가 넣는다. 레포 밖 원천 목록은
          #   LOCAL-DEPLOYMENT §25-00.
          imagePullSecrets:
            - name: quay-pull-secret
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate-minio
              image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  echo "[1/3] Generating new secret key..."
                  NEW_SECRET=$(head -c 32 /dev/urandom | base64 | tr -d '=+/' | head -c 32)

                  echo "[2/3] Updating MinIO credentials..."
                  mc alias set myminio https://minio-headless:9000 \
                    "${MINIO_ACCESS_KEY}" "${CURRENT_SECRET}" --insecure
                  mc admin user svcacct edit myminio "${MINIO_ACCESS_KEY}" \
                    --secret-key "${NEW_SECRET}" --insecure

                  echo "[3/3] Patching Kubernetes secret..."
                  ENCODED_SECRET=$(echo -n "${NEW_SECRET}" | base64)
                  kubectl patch secret minio-secret \
                    -p "{\"data\":{\"minio-secret-key\":\"${ENCODED_SECRET}\"}}"

                  echo "MinIO password rotation completed."
              env:
                - name: MINIO_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: minio-access-key
                - name: CURRENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: minio-secret
                      key: minio-secret-key
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
