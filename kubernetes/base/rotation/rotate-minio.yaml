# S3 자격 로테이션 — **OpenBao 가 원천** (2026-11-06 재설계, 2026-11-07 SeaweedFS 로 옮겼다)
#
# 이름이 minio 인 것은 Secret(minio-secret·minio-users)과 소비자 19곳이 그 이름을 쓰기 때문이다 —
# 엔진은 SeaweedFS 다(base/data-lakehouse/seaweedfs, Gotcha 176).
#
#   rotate-minio-password  소비자 사용자 7명의 비밀키(minio-users).
#   rotate-minio-root      root 비밀번호(minio-secret).
#
# ★★ 둘 다 같은 모양이다 — SeaweedFS 의 사용자는 정적 파일(-s3.config)이고 기동 때만 읽힌다.
#   그래서 살아 있는 서버의 키를 바꾸지 않고, OpenBao → ESO → k8s Secret 을 바꾸면 Reloader 가 SeaweedFS 와
#   소비자를 다시 띄운다. 그동안(실측 수십 초) **모든 S3 소비자가 끊긴다.** MinIO 때의 사용자 회전은 무중단이었다 —
#   이것이 이전의 대가다(살아 있는 서버의 IAM API 로 바꾸려면 -s3.config 대신 filer 의 identity 저장소를 써야 하고,
#   그러면 사용자 정의가 git 밖으로 나간다).
# ★ 마지막 컨테이너가 **동기화된 k8s Secret 의 값**(소비자가 받을 값)으로 다시 붙어 본다 — 엔진이 새 값을
#   받아들일 때까지 기다린다. 실패하면 되돌리는 법을 출력한다(OpenBao KV 의 이전 버전).
# ★ suspend: true — 자동 실행하지 않는다(사용자 결정, 2026-11-06). 수동 실행:
#     kubectl -n local create job --from=cronjob/rotate-minio-password rotate-minio-manual-$(date +%s)
#     kubectl -n local create job --from=cronjob/rotate-minio-root     rotate-minio-root-manual-$(date +%s)
# ★ 전제: ROTATORS="minio" local/openbao-rotator-setup.sh · 메시(allow-datalakehouse-access 9000) ·
#   NetworkPolicy(allow-minio-access · allow-openbao-access)에 이 SA/라벨.
# ★ S3 클라이언트는 aws-cli 다 — bash·coreutils 가 함께 있고 Docker Hub 에서 익명으로 받는다(quay 자격이 필요 없다).
#   키는 인자가 아니라 환경변수로 넘긴다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rotator-minio
  labels:
    app.kubernetes.io/name: rotator-minio
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rotator-minio
  labels:
    app.kubernetes.io/name: rotator-minio
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["minio-users", "minio-secret"]
    verbs: ["get"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    resourceNames: ["minio-users", "minio-secret"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rotator-minio
  labels:
    app.kubernetes.io/name: rotator-minio
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rotator-minio
subjects:
  - kind: ServiceAccount
    name: rotator-minio
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotate-minio-password
  labels:
    app.kubernetes.io/name: rotate-minio-password
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  schedule: "20 3 1,15 * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rotator-minio
            app.kubernetes.io/component: rotation
            app.kubernetes.io/part-of: oneinchmarket
            app.kubernetes.io/managed-by: kustomize
        spec:
          serviceAccountName: rotator-minio
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: tools
              emptyDir: {sizeLimit: 512Mi}
          initContainers:
            - name: tools
              image: docker.io/openbao/openbao:2.7.2
              command: ["/bin/sh", "-c", "cp /bin/bao /tools/bao && /tools/bao version"]
              volumeMounts: [{name: tools, mountPath: /tools}]
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits:   {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
            - name: rotate
              image: docker.io/amazon/aws-cli:2.27.50
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  B=/tools/bao
                  export BAO_ADDR=http://openbao.local.svc.cluster.local:8200 HOME=/tmp AWS_DEFAULT_REGION=us-east-1
                  URL=http://minio-headless:9000
                  USERS="trino hive spark spark-history openreplay openbao-snapshot airflow"
                  declare -A BK=([trino]=warehouse [hive]=warehouse [spark]=warehouse [spark-history]=spark-events
                                 [openreplay]=mobs [openbao-snapshot]=openbao-snapshots [airflow]=airflow-logs)
                  sha() { printf '%s' "$1" | sha256sum | cut -d' ' -f1; }
                  ev() { local v; v="K8S_$(printf '%s' "$1" | tr 'a-z-' 'A-Z_')"; printf '%s' "${!v:-}"; }
                  ok() { AWS_ACCESS_KEY_ID="$1" AWS_SECRET_ACCESS_KEY="$2" aws --endpoint-url "$URL" \
                           s3api list-objects-v2 --bucket "${BK[$1]}" --max-keys 1 >/dev/null 2>&1; }

                  echo "[1/5] OpenBao 로그인 (rotator-minio)"
                  BAO_TOKEN=$($B write -field=token auth/kubernetes/login role=rotator-minio \
                    jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)
                  export BAO_TOKEN

                  echo "[2/5] 원천 일치 확인 (OpenBao = k8s Secret, 사용자 ${USERS// /·})"
                  declare -A OLD NEW
                  for u in $USERS; do
                    OLD[$u]=$($B kv get -mount=oim -field="$u-secret-key" minio-users)
                    [ "$($B kv get -mount=oim -field="$u-access-key" minio-users)" = "$u" ] \
                      || { echo "$u: OpenBao 의 access-key 가 사용자 이름과 다르다 — 멈춘다" >&2; exit 1; }
                    [ -n "${OLD[$u]}" ] || { echo "$u: OpenBao 값이 비었다" >&2; exit 1; }
                    [ "${OLD[$u]}" = "$(ev "$u")" ] || { echo "$u: OpenBao 와 k8s Secret 이 다르다 — ESO 동기화부터 볼 것" >&2; exit 1; }
                  done

                  echo "[3/5] 현재 키로 자기 버킷에 붙는지 확인"
                  for u in $USERS; do ok "$u" "${OLD[$u]}" || { echo "$u: 현재 키로 ${BK[$u]} 에 붙지 못한다 — 멈춘다" >&2; exit 1; }; done

                  echo "[4/5] OpenBao 에 기록 (사용자 키 전부를 한 번에)"
                  J="{"
                  for u in $USERS; do
                    NEW[$u]=$(head -c 48 /dev/urandom | base64 | tr -d '=+/\n' | cut -c1-32)
                    [ "${#NEW[$u]}" -ge 24 ] || { echo "생성한 값이 짧다" >&2; exit 1; }
                    J="$J\"$u-secret-key\":\"${NEW[$u]}\","
                  done
                  J="${J%,}}"
                  rollback() {
                    echo "[rollback] OpenBao 를 옛 값으로 되돌린다" >&2
                    R="{"; for u in $USERS; do R="$R\"$u-secret-key\":\"${OLD[$u]}\","; done; R="${R%,}}"
                    printf '%s' "$R" | $B kv patch -mount=oim minio-users - >/dev/null || echo "[rollback] 실패 — 사람이 볼 것" >&2
                  }
                  printf '%s' "$J" | $B kv patch -mount=oim minio-users - >/dev/null || { echo "OpenBao 기록 실패" >&2; exit 1; }
                  for u in $USERS; do
                    [ "$($B kv get -mount=oim -field="$u-secret-key" minio-users)" = "${NEW[$u]}" ] \
                      || { echo "$u: OpenBao 되읽기가 다르다" >&2; rollback; exit 1; }
                  done

                  echo "[5/5] 다음 단계에 해시만 넘긴다"
                  : > /tools/expected
                  for u in $USERS; do printf '%s %s\n' "$u-secret-key" "$(sha "${NEW[$u]}")" >> /tools/expected; done
                  echo "OpenBao 갱신 완료 — SeaweedFS 는 재시작 뒤에 새 값을 쓴다"
              env:
                - {name: K8S_TRINO,            valueFrom: {secretKeyRef: {name: minio-users, key: trino-secret-key}}}
                - {name: K8S_HIVE,             valueFrom: {secretKeyRef: {name: minio-users, key: hive-secret-key}}}
                - {name: K8S_SPARK,            valueFrom: {secretKeyRef: {name: minio-users, key: spark-secret-key}}}
                - {name: K8S_SPARK_HISTORY,    valueFrom: {secretKeyRef: {name: minio-users, key: spark-history-secret-key}}}
                - {name: K8S_OPENREPLAY,       valueFrom: {secretKeyRef: {name: minio-users, key: openreplay-secret-key}}}
                - {name: K8S_OPENBAO_SNAPSHOT, valueFrom: {secretKeyRef: {name: minio-users, key: openbao-snapshot-secret-key}}}
                - {name: K8S_AIRFLOW,          valueFrom: {secretKeyRef: {name: minio-users, key: airflow-secret-key}}}
              volumeMounts: [{name: tools, mountPath: /tools}]
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits:   {cpu: 500m, memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
            - name: sync
              image: docker.io/alpine/kubectl:1.36.4
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  h() { kubectl get secret minio-users -o go-template="{{index .data \"$1\" | base64decode}}" | sha256sum | cut -d' ' -f1; }
                  echo "[sync] ExternalSecret 강제 동기화"
                  kubectl annotate externalsecret minio-users force-sync="$(date +%s)" --overwrite >/dev/null
                  i=0
                  while [ $i -lt 60 ]; do
                    bad=0
                    while read -r k want; do [ "$(h "$k")" = "$want" ] || bad=1; done < /tools/expected
                    if [ $bad -eq 0 ]; then echo "[sync] k8s Secret 갱신 확인 — Reloader 가 SeaweedFS·소비자를 재시작한다"; exit 0; fi
                    i=$((i+1)); sleep 3
                  done
                  echo "[sync] 180초 안에 k8s Secret 이 따라오지 않았다 — OpenBao 는 새 값이다. ESO 상태를 볼 것" >&2
                  exit 1
              volumeMounts: [{name: tools, mountPath: /tools, readOnly: true}]
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits:   {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
          containers:
            # ★ 이 컨테이너의 env 는 앞의 컨테이너들이 **끝난 뒤** 생성될 때 Secret 에서 읽힌다 — 소비자가 받을 값이다.
            - name: verify
              image: docker.io/amazon/aws-cli:2.27.50
              command:
                - /bin/bash
                - -c
                - |
                  set -uo pipefail
                  export HOME=/tmp AWS_DEFAULT_REGION=us-east-1
                  declare -A BK=([trino]=warehouse [hive]=warehouse [spark]=warehouse [spark-history]=spark-events
                                 [openreplay]=mobs [openbao-snapshot]=openbao-snapshots [airflow]=airflow-logs)
                  for i in $(seq 1 100); do
                    fails=0
                    for u in trino hive spark spark-history openreplay openbao-snapshot airflow; do
                      v="K8S_$(printf '%s' "$u" | tr 'a-z-' 'A-Z_')"
                      AWS_ACCESS_KEY_ID="$u" AWS_SECRET_ACCESS_KEY="${!v}" aws --endpoint-url http://minio-headless:9000 \
                        s3api list-objects-v2 --bucket "${BK[$u]}" --max-keys 1 >/dev/null 2>&1 || fails=$((fails+1))
                    done
                    [ $fails -eq 0 ] && { echo "[verify] 소비자가 받을 값으로 7명 전부 붙는다 (${i}회째)"; exit 0; }
                    sleep 3
                  done
                  echo "[verify] 300초 안에 $fails 명이 새 키로 붙지 못한다 — Reloader 가 seaweedfs 를 재시작했는지 볼 것." >&2
                  echo "[verify] 되돌리려면 OpenBao oim/minio-users 를 이전 버전으로(bao kv rollback) 하고 force-sync 할 것." >&2
                  exit 1
              env:
                - {name: K8S_TRINO,            valueFrom: {secretKeyRef: {name: minio-users, key: trino-secret-key}}}
                - {name: K8S_HIVE,             valueFrom: {secretKeyRef: {name: minio-users, key: hive-secret-key}}}
                - {name: K8S_SPARK,            valueFrom: {secretKeyRef: {name: minio-users, key: spark-secret-key}}}
                - {name: K8S_SPARK_HISTORY,    valueFrom: {secretKeyRef: {name: minio-users, key: spark-history-secret-key}}}
                - {name: K8S_OPENREPLAY,       valueFrom: {secretKeyRef: {name: minio-users, key: openreplay-secret-key}}}
                - {name: K8S_OPENBAO_SNAPSHOT, valueFrom: {secretKeyRef: {name: minio-users, key: openbao-snapshot-secret-key}}}
                - {name: K8S_AIRFLOW,          valueFrom: {secretKeyRef: {name: minio-users, key: airflow-secret-key}}}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits:   {cpu: 500m, memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotate-minio-root
  labels:
    app.kubernetes.io/name: rotate-minio-root
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  schedule: "25 3 1 */3 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rotator-minio
            app.kubernetes.io/component: rotation
            app.kubernetes.io/part-of: oneinchmarket
            app.kubernetes.io/managed-by: kustomize
        spec:
          serviceAccountName: rotator-minio
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: tools
              emptyDir: {sizeLimit: 512Mi}
          initContainers:
            - name: tools
              image: docker.io/openbao/openbao:2.7.2
              command: ["/bin/sh", "-c", "cp /bin/bao /tools/bao && /tools/bao version"]
              volumeMounts: [{name: tools, mountPath: /tools}]
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits:   {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
            - name: rotate
              image: docker.io/amazon/aws-cli:2.27.50
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  B=/tools/bao
                  export BAO_ADDR=http://openbao.local.svc.cluster.local:8200 HOME=/tmp AWS_DEFAULT_REGION=us-east-1
                  sha() { printf '%s' "$1" | sha256sum | cut -d' ' -f1; }

                  echo "[1/5] OpenBao 로그인 (rotator-minio)"
                  BAO_TOKEN=$($B write -field=token auth/kubernetes/login role=rotator-minio \
                    jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)
                  export BAO_TOKEN

                  echo "[2/5] 원천 일치 확인 (OpenBao 두 별칭 키 = k8s Secret)"
                  RUSER=$($B kv get -mount=oim -field=root-user minio-secret)
                  OLD=$($B kv get -mount=oim -field=root-password minio-secret)
                  ALIAS=$($B kv get -mount=oim -field=minio-secret-key minio-secret)
                  [ -n "$OLD" ] || { echo "OpenBao 값이 비었다" >&2; exit 1; }
                  [ "$OLD" = "$ALIAS" ] || { echo "OpenBao 의 두 별칭 키가 다르다 — 멈춘다" >&2; exit 1; }
                  [ "$OLD" = "$K8S_CURRENT" ] || { echo "OpenBao 와 k8s Secret 이 다르다 — ESO 동기화부터 볼 것" >&2; exit 1; }

                  echo "[3/5] 현재 root 로 접속 확인"
                  AWS_ACCESS_KEY_ID="$RUSER" AWS_SECRET_ACCESS_KEY="$OLD" aws --endpoint-url http://minio-headless:9000 \
                    s3api list-buckets >/dev/null 2>&1 || { echo "현재 root 로 붙지 못한다 — 멈춘다" >&2; exit 1; }

                  echo "[4/5] OpenBao 에 기록 (두 별칭 키를 함께)"
                  NEW=$(head -c 48 /dev/urandom | base64 | tr -d '=+/\n' | cut -c1-32)
                  [ "${#NEW}" -ge 24 ] || { echo "생성한 값이 짧다" >&2; exit 1; }
                  printf '{"root-password":"%s","minio-secret-key":"%s"}' "$NEW" "$NEW" \
                    | $B kv patch -mount=oim minio-secret - >/dev/null
                  if [ "$($B kv get -mount=oim -field=root-password minio-secret)" != "$NEW" ]; then
                    echo "OpenBao 되읽기가 다르다 — 옛 값으로 되돌린다" >&2
                    printf '{"root-password":"%s","minio-secret-key":"%s"}' "$OLD" "$OLD" | $B kv patch -mount=oim minio-secret - >/dev/null
                    exit 1
                  fi

                  echo "[5/5] 다음 단계에 해시만 넘긴다"
                  sha "$NEW" > /tools/expected.sha
                  echo "OpenBao 갱신 완료 — SeaweedFS 는 재시작 뒤에 새 값을 쓴다"
              env:
                - name: K8S_CURRENT
                  valueFrom: {secretKeyRef: {name: minio-secret, key: root-password}}
              volumeMounts: [{name: tools, mountPath: /tools}]
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits:   {cpu: 500m, memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
            - name: sync
              image: docker.io/alpine/kubectl:1.36.4
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  want=$(cat /tools/expected.sha)
                  h() { kubectl get secret minio-secret -o go-template="{{index .data \"$1\" | base64decode}}" | sha256sum | cut -d' ' -f1; }
                  echo "[sync] ExternalSecret 강제 동기화"
                  kubectl annotate externalsecret minio-secret force-sync="$(date +%s)" --overwrite >/dev/null
                  i=0
                  while [ $i -lt 60 ]; do
                    if [ "$(h root-password)" = "$want" ] && [ "$(h minio-secret-key)" = "$want" ]; then
                      echo "[sync] k8s Secret 갱신 확인 — Reloader 가 SeaweedFS 를 재시작한다"; exit 0
                    fi
                    i=$((i+1)); sleep 3
                  done
                  echo "[sync] 180초 안에 k8s Secret 이 따라오지 않았다 — OpenBao 는 새 값이다. ESO 상태를 볼 것" >&2
                  exit 1
              volumeMounts: [{name: tools, mountPath: /tools, readOnly: true}]
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits:   {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
          containers:
            # ★ env 는 동기화가 끝난 뒤의 Secret 값이다. SeaweedFS 가 다시 떠서 그 값을 받아들일 때까지 기다린다.
            - name: verify
              image: docker.io/amazon/aws-cli:2.27.50
              command:
                - /bin/bash
                - -c
                - |
                  set -uo pipefail
                  export HOME=/tmp AWS_DEFAULT_REGION=us-east-1
                  for i in $(seq 1 100); do
                    if AWS_ACCESS_KEY_ID="$ROOT_USER" AWS_SECRET_ACCESS_KEY="$ROOT_PW" \
                         aws --endpoint-url http://minio-headless:9000 s3api list-buckets >/dev/null 2>&1; then
                      echo "[verify] SeaweedFS 가 새 root 를 받아들인다 (${i}회째)"; exit 0
                    fi
                    sleep 3
                  done
                  echo "[verify] 300초 안에 SeaweedFS 가 새 root 를 받지 않았다 — Reloader 가 seaweedfs 를 재시작했는지 볼 것." >&2
                  echo "[verify] 되돌리려면 OpenBao oim/minio-secret 의 두 키를 옛 값으로(그 KV 의 이전 버전에 있다)." >&2
                  exit 1
              env:
                - {name: ROOT_USER, valueFrom: {secretKeyRef: {name: minio-secret, key: root-user}}}
                - {name: ROOT_PW,   valueFrom: {secretKeyRef: {name: minio-secret, key: root-password}}}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits:   {cpu: 500m, memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
