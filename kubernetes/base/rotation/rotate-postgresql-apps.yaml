# PostgreSQL **앱 롤** 비밀번호 로테이션 — OpenBao 가 원천 (2026-11-07, 본보기는 rotate-postgresql.yaml)
#
# ★ 왜: rotate-postgresql-password 는 superuser(postgres) 하나만 바꾼다. 앱 롤 16개(keycloak·gitlab·…)는
#   한 번 정해진 뒤 바꿀 수단이 없었다(Gotcha 212 의 "남은 것").
#
# ★ 대상 표(TABLE) — 롤 · 접속 확인용 DB · Secret(=OpenBao 경로) · 키. 원천은 postgres-bootstrap 의 ensure 목록이다.
#   ★★ 거기에 롤을 더하면 여기에도 더할 것 — 빠지면 그 롤은 조용히 회전 대상 밖이다(Gotcha 117).
#   ★ openfga 는 비밀번호가 `datastore-uri` 에도 박혀 있다 — 둘을 함께 바꾼다(한쪽만 바꾸면 OpenFGA 가 끊긴다).
#   ★ ranger 의 db-password 는 2026-11-07 기준 admin-password(Ranger UI)와 같은 값이었다 — DB 쪽만 바꾸므로
#     회전 뒤에는 둘이 갈린다. 그것이 맞다(DB 자격과 사람의 자격은 다른 것이다).
#
# ★ 순서(롤마다, 실패하면 그 롤을 되돌리고 거기서 멈춘다 — 이미 끝난 롤은 그대로 동기화한다):
#   [rotate] 1) OpenBao 로그인(역할 rotator-postgresql-apps — 이 16개 경로 읽기·쓰기, postgresql-secret 읽기만)
#            2) **사전 검사 — 아무것도 바꾸기 전에 전부**: OpenBao = k8s Secret · 현재 값으로 그 롤이 접속된다
#               (openfga 는 datastore-uri 에 현재 값이 정확히 한 번 들어 있는지까지). 하나라도 틀리면 바꾸지 않고 끝낸다
#            3) 새 값 → ALTER ROLE(superuser, 값은 stdin) → 새 값으로 그 롤 접속 확인 → OpenBao patch → 되읽기
#            4) 해시만 /tools 로 넘긴다
#   [sync]   바뀐 Secret 마다 ExternalSecret 강제 동기화 → 해시가 같아질 때까지 → Reloader 가 소비자를 재시작
# ★ 창(window): ALTER 부터 소비자 재시작까지 그 앱의 **새 연결**이 실패한다(이미 열린 연결은 산다).
#   롤을 고를 수 있게 한 이유다 — 한 번에 전부 돌리면 16개 앱이 함께 재시작한다.
# ★ postgres-bootstrap(Sync 훅)은 동기화 때마다 Secret 값으로 ALTER ROLE 을 다시 한다 — 회전 도중 동기화가
#   끼면 DB 를 옛 값으로 되돌린다. 그러면 [sync] 뒤 소비자가 새 값으로 붙지 못한다 — 동기화 중에는 돌리지 말 것.
#
# ★ suspend: true — 자동 실행하지 않는다(사용자 결정, 2026-11-06). 수동 실행:
#     전부:  kubectl -n local create job --from=cronjob/rotate-postgresql-apps rotate-pg-apps-manual-$(date +%s)
#     골라서: kubectl -n local create job --from=cronjob/rotate-postgresql-apps rotate-pg-apps-manual-$(date +%s) \
#               --dry-run=client -o yaml \
#             | kubectl set env --local -f - -c rotate ONLY="keycloak airflow" -o yaml | kubectl -n local apply -f -
# ★ 전제(레포 밖 원천): ROTATORS="postgresql-apps" local/openbao-rotator-setup.sh · 대상 Secret 이 전부 OpenBao 원천일 것
#   (ExternalSecret) · 메시(allow-database-access 5432) · NetworkPolicy(allow-postgresql-access · allow-openbao-access).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rotator-postgresql-apps
  labels:
    app.kubernetes.io/name: rotator-postgresql-apps
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rotator-postgresql-apps
  labels:
    app.kubernetes.io/name: rotator-postgresql-apps
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
rules:
  # 해시 대조용 읽기 · 강제 동기화용 annotate — 대상 이름으로 한정한다. Secret 을 **쓰지 않는다**(원천은 OpenBao).
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: &targets
      - keycloak-secret
      - gitlab-secret
      - apicurio-secret
      - hive-metastore-secret
      - ranger-secret
      - glitchtip-secret
      - openreplay-secret
      - dependency-track-secret
      - defectdojo-secret
      - safeline-secret
      - openfga-secret
      - midpoint-secret
      - backstage-secret
      - temporal-secret
      - airflow-secret
      - clickhouse-secret
    verbs: ["get"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    resourceNames: *targets
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rotator-postgresql-apps
  labels:
    app.kubernetes.io/name: rotator-postgresql-apps
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rotator-postgresql-apps
subjects:
  - kind: ServiceAccount
    name: rotator-postgresql-apps
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotate-postgresql-apps
  labels:
    app.kubernetes.io/name: rotate-postgresql-apps
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  schedule: "30 3 1 * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rotator-postgresql-apps
            app.kubernetes.io/component: rotation
            app.kubernetes.io/part-of: oneinchmarket
            app.kubernetes.io/managed-by: kustomize
        spec:
          serviceAccountName: rotator-postgresql-apps
          restartPolicy: Never
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            # 디스크 emptyDir — tmpfs 는 쓴 컨테이너의 메모리 limit 에 계산된다(rotate-postgresql.yaml).
            - name: tools
              emptyDir: {sizeLimit: 512Mi}
          initContainers:
            - name: tools
              image: docker.io/openbao/openbao:2.4.1
              command: ["/bin/sh", "-c", "cp /bin/bao /tools/bao && /tools/bao version"]
              volumeMounts: [{name: tools, mountPath: /tools}]
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits:   {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
            - name: rotate
              image: docker.io/library/postgres:18.6
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  B=/tools/bao
                  export BAO_ADDR=http://openbao.local.svc.cluster.local:8200 HOME=/tmp
                  # 롤 · 접속 확인 DB · Secret · 키
                  TABLE="keycloak keycloak keycloak-secret db-password
                  gitlab gitlab gitlab-secret db-password
                  apicurio apicurio apicurio-secret db-password
                  hive hive_metastore hive-metastore-secret db-password
                  ranger ranger ranger-secret db-password
                  glitchtip glitchtip glitchtip-secret db-password
                  openreplay openreplay openreplay-secret db-password
                  dependencytrack dependencytrack dependency-track-secret db-password
                  defectdojo defectdojo defectdojo-secret db-password
                  safeline safeline safeline-secret db-password
                  openfga openfga openfga-secret db-password
                  midpoint midpoint midpoint-secret db-password
                  backstage backstage backstage-secret db-password
                  temporal temporal temporal-secret db-password
                  airflow airflow airflow-secret db-password
                  openmeter openmeter clickhouse-secret openmeter-pg-password"
                  sha() { printf '%s' "$1" | sha256sum | cut -d' ' -f1; }
                  ev()  { local v; v="K8S_$(printf '%s' "$1" | tr 'a-z-' 'A-Z_')"; printf '%s' "${!v:-}"; }
                  # 접속 확인 — 값은 환경변수로만 넘긴다(인자에 남기지 않는다)
                  conn() { [ "$(PGPASSWORD="$2" psql -h postgresql-headless -U "$1" -d "$3" -tAq -c 'select 1' 2>/dev/null || true)" = 1 ]; }
                  # ALTER ROLE — superuser 로, 값은 stdin 으로
                  alter() { printf "ALTER ROLE %s WITH PASSWORD '%s';\n" "$1" "$2" \
                              | PGPASSWORD="$SU" psql -h postgresql-headless -U postgres -d postgres -v ON_ERROR_STOP=1 -tAq -f - >/dev/null; }
                  gen() { head -c 48 /dev/urandom | base64 | tr -d '=+/\n' | cut -c1-32; }
                  kv()  { $B kv get -mount=oim -field="$2" "$1"; }

                  # 고른 롤(ONLY)이 있으면 그것만 — 표에 없는 이름은 거부한다.
                  SEL=""
                  while read -r r d s k; do
                    [ -n "$r" ] || continue
                    if [ -z "${ONLY:-}" ] || [[ " $ONLY " == *" $r "* ]]; then SEL="$SEL$r $d $s $k"$'\n'; fi
                  done <<< "$TABLE"
                  for o in ${ONLY:-}; do
                    grep -q "^$o " <<< "$SEL" || { echo "ONLY 의 '$o' 는 대상 표에 없다" >&2; exit 1; }
                  done
                  [ -n "$SEL" ] || { echo "대상이 없다" >&2; exit 1; }

                  echo "[1/5] OpenBao 로그인 (rotator-postgresql-apps)"
                  BAO_TOKEN=$($B write -field=token auth/kubernetes/login role=rotator-postgresql-apps \
                    jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)
                  export BAO_TOKEN
                  SU=$(kv postgresql-secret postgresql-password)
                  [ "$(PGPASSWORD="$SU" psql -h postgresql-headless -U postgres -d postgres -tAq -c 'select 1')" = 1 ] \
                    || { echo "superuser 로 접속할 수 없다" >&2; exit 1; }

                  echo "[2/5] 사전 검사 — 아무것도 바꾸기 전에 대상 전부"
                  declare -A OLD
                  bad=0
                  while read -r r d s k; do
                    [ -n "$r" ] || continue
                    OLD[$r]=$(kv "$s" "$k" || true)
                    if [ -z "${OLD[$r]}" ]; then echo "  $r: OpenBao $s/$k 가 비었다" >&2; bad=1; continue; fi
                    [ "${OLD[$r]}" = "$(ev "$r")" ] || { echo "  $r: OpenBao 와 k8s Secret 이 다르다 — ESO 동기화부터 볼 것" >&2; bad=1; continue; }
                    conn "$r" "${OLD[$r]}" "$d" || { echo "  $r: 현재 값으로 $d 에 접속할 수 없다" >&2; bad=1; continue; }
                    if [ "$r" = openfga ]; then
                      U=$(kv openfga-secret datastore-uri)
                      rest=${U#*"${OLD[$r]}"}
                      [ "$rest" != "$U" ] && [[ "$rest" != *"${OLD[$r]}"* ]] \
                        || { echo "  openfga: datastore-uri 에 현재 값이 정확히 한 번 있지 않다" >&2; bad=1; continue; }
                    fi
                    echo "  $r ok"
                  done <<< "$SEL"
                  [ $bad -eq 0 ] || { echo "사전 검사 실패 — 아무것도 바꾸지 않았다" >&2; exit 1; }

                  echo "[3/5] 롤마다 변경"
                  : > /tools/expected; rm -f /tools/failed
                  while read -r r d s k; do
                    [ -n "$r" ] || continue
                    o=${OLD[$r]}; n=$(gen)
                    [ "${#n}" -ge 24 ] || { echo "$r" > /tools/failed; echo "  $r: 생성한 값이 짧다" >&2; break; }
                    if ! alter "$r" "$n"; then echo "$r" > /tools/failed; echo "  $r: ALTER 실패(바뀌지 않았다)" >&2; break; fi
                    if ! conn "$r" "$n" "$d"; then
                      alter "$r" "$o" || echo "  $r: [rollback] 실패 — 사람이 볼 것" >&2
                      echo "$r" > /tools/failed; echo "  $r: 새 값으로 접속 실패 — 되돌렸다" >&2; break
                    fi
                    if [ "$r" = openfga ]; then
                      U=$(kv openfga-secret datastore-uri); NU=${U/"$o"/"$n"}
                      J=$(printf '{"db-password":"%s","datastore-uri":"%s"}' "$n" "$NU")
                    else
                      J=$(printf '{"%s":"%s"}' "$k" "$n")
                    fi
                    if ! printf '%s' "$J" | $B kv patch -mount=oim "$s" - >/dev/null || [ "$(kv "$s" "$k")" != "$n" ]; then
                      alter "$r" "$o" || echo "  $r: [rollback] DB 되돌리기 실패 — 사람이 볼 것" >&2
                      printf '{"%s":"%s"}' "$k" "$o" | $B kv patch -mount=oim "$s" - >/dev/null || true
                      echo "$r" > /tools/failed; echo "  $r: OpenBao 기록 실패 — 되돌렸다" >&2; break
                    fi
                    printf '%s %s %s\n' "$s" "$k" "$(sha "$n")" >> /tools/expected
                    [ "$r" = openfga ] && printf '%s %s %s\n' "$s" datastore-uri "$(sha "$NU")" >> /tools/expected
                    echo "  $r 변경 완료"
                  done <<< "$SEL"

                  echo "[4/5] 다음 단계에 해시만 넘긴다 ($(wc -l < /tools/expected) 키)"
                  [ -f /tools/failed ] && echo "[5/5] 실패한 롤: $(cat /tools/failed) — 그 앞까지만 바뀌었다. [sync] 가 그것들을 동기화한 뒤 실패로 끝낸다" >&2
                  exit 0
              env:
                - {name: K8S_KEYCLOAK,        valueFrom: {secretKeyRef: {name: keycloak-secret,         key: db-password}}}
                - {name: K8S_GITLAB,          valueFrom: {secretKeyRef: {name: gitlab-secret,           key: db-password}}}
                - {name: K8S_APICURIO,        valueFrom: {secretKeyRef: {name: apicurio-secret,         key: db-password}}}
                - {name: K8S_HIVE,            valueFrom: {secretKeyRef: {name: hive-metastore-secret,   key: db-password}}}
                - {name: K8S_RANGER,          valueFrom: {secretKeyRef: {name: ranger-secret,           key: db-password}}}
                - {name: K8S_GLITCHTIP,       valueFrom: {secretKeyRef: {name: glitchtip-secret,        key: db-password}}}
                - {name: K8S_OPENREPLAY,      valueFrom: {secretKeyRef: {name: openreplay-secret,       key: db-password}}}
                - {name: K8S_DEPENDENCYTRACK, valueFrom: {secretKeyRef: {name: dependency-track-secret, key: db-password}}}
                - {name: K8S_DEFECTDOJO,      valueFrom: {secretKeyRef: {name: defectdojo-secret,       key: db-password}}}
                - {name: K8S_SAFELINE,        valueFrom: {secretKeyRef: {name: safeline-secret,         key: db-password}}}
                - {name: K8S_OPENFGA,         valueFrom: {secretKeyRef: {name: openfga-secret,          key: db-password}}}
                - {name: K8S_MIDPOINT,        valueFrom: {secretKeyRef: {name: midpoint-secret,         key: db-password}}}
                - {name: K8S_BACKSTAGE,       valueFrom: {secretKeyRef: {name: backstage-secret,        key: db-password}}}
                - {name: K8S_TEMPORAL,        valueFrom: {secretKeyRef: {name: temporal-secret,         key: db-password}}}
                - {name: K8S_AIRFLOW,         valueFrom: {secretKeyRef: {name: airflow-secret,          key: db-password}}}
                - {name: K8S_OPENMETER,       valueFrom: {secretKeyRef: {name: clickhouse-secret,       key: openmeter-pg-password}}}
                # 고를 롤(공백 구분). 비우면 표 전부 — 위 머리말의 `kubectl set env` 로 바꾼다.
                - {name: ONLY, value: ""}
              volumeMounts: [{name: tools, mountPath: /tools}]
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits:   {cpu: 300m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
          containers:
            - name: sync
              image: docker.io/alpine/kubectl:1.36.4
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  h() { kubectl get secret "$1" -o go-template="{{index .data \"$2\" | base64decode}}" | sha256sum | cut -d' ' -f1; }
                  if [ -s /tools/expected ]; then
                    for s in $(cut -d' ' -f1 /tools/expected | sort -u); do
                      echo "[sync] $s 강제 동기화"
                      kubectl annotate externalsecret "$s" force-sync="$(date +%s)" --overwrite >/dev/null
                    done
                    fails=0
                    while read -r s k want; do
                      i=0
                      while [ "$(h "$s" "$k")" != "$want" ]; do
                        i=$((i+1)); [ $i -lt 60 ] || break; sleep 3
                      done
                      if [ "$(h "$s" "$k")" = "$want" ]; then echo "[sync] $s/$k ok"
                      else echo "[sync] $s/$k 가 180초 안에 따라오지 않았다 — DB·OpenBao 는 새 값이다. ESO 를 볼 것" >&2; fails=$((fails+1)); fi
                    done < /tools/expected
                    [ $fails -eq 0 ] || exit 1
                    echo "[sync] k8s Secret 갱신 확인 — Reloader 가 소비자를 재시작한다"
                  fi
                  if [ -f /tools/failed ]; then echo "[sync] 롤 $(cat /tools/failed) 에서 멈췄다 — 그 롤과 뒤의 롤은 바뀌지 않았다" >&2; exit 1; fi
              volumeMounts: [{name: tools, mountPath: /tools, readOnly: true}]
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits:   {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
