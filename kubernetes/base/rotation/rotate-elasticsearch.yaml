apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotate-elasticsearch-password
  labels:
    app.kubernetes.io/name: rotate-elasticsearch-password
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  schedule: "10 3 1,15 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rotate-elasticsearch-password
            app.kubernetes.io/component: rotation
            app.kubernetes.io/part-of: oneinchmarket
        spec:
          serviceAccountName: secret-rotator
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            # ★★ 이 Job 은 현재 구조상 성립하지 않는다 — §8-64 에서 확인했다.
            #
            #   ① **ECK 가 `elastic` 사용자의 소유자다.** 이 Job 이 ES API 로
            #      비밀번호를 바꿔도 ECK 가 `elasticsearch-es-elastic-user` 기준으로
            #      되돌린다. 즉 회전이 유지되지 않는다.
            #   ② **바꾼 값을 ECK 시크릿에 반영하지 않는다.** 3단계가 수기
            #      `elasticsearch-secret` 만 패치한다. 그 시크릿을 보던 소비자
            #      (falcosidekick·trivy)와 ECK 를 보던 소비자가 갈라졌고,
            #      실제로 falcosidekick 의 경보가 401 로 전부 버려지고 있었다.
            #   ③ **이미지에 kubectl 이 없다.** `curlimages/curl` 로 3단계의
            #      `kubectl patch` 를 실행할 수 없다.
            #
            #   지금은 ①·③ 때문에 **실행돼도 실패해서** 피해가 없다. 고치려면
            #   "ECK 관리 사용자를 회전할 것인가, 전용 사용자를 따로 둘 것인가"
            #   를 먼저 정해야 한다 — ADR 급 결정이라 여기서 임의로 바꾸지 않고
            #   §9-4 에 남긴다.
            - name: rotate-elasticsearch
              image: docker.io/curlimages/curl:8.22.0
              command:
                - /bin/sh
                - -c
                - |
                  set -eu

                  echo "[1/3] Generating new password..."
                  NEW_PASSWORD=$(head -c 32 /dev/urandom | base64 | tr -d '=+/' | head -c 24)

                  echo "[2/3] Updating Elasticsearch password..."
                  curl -sf -X PUT \
                    "https://elasticsearch-es-http:9200/_security/user/elastic/_password" \
                    -H "Content-Type: application/json" \
                    -u "elastic:${CURRENT_PASSWORD}" \
                    -d "{\"password\": \"${NEW_PASSWORD}\"}" \
                    --cacert /etc/elasticsearch/certs/ca.crt

                  echo "[3/3] Patching Kubernetes secret..."
                  ENCODED_PASSWORD=$(echo -n "${NEW_PASSWORD}" | base64)
                  kubectl patch secret elasticsearch-secret \
                    -p "{\"data\":{\"elastic-password\":\"${ENCODED_PASSWORD}\"}}"

                  echo "Elasticsearch password rotation completed."
              env:
                - name: CURRENT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: elasticsearch-secret
                      key: elastic-password
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
