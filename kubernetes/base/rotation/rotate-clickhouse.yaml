# ClickHouse 비밀번호 로테이션 — OpenBao 가 원천 (2026-11-07, Gotcha 220)
#   본보기는 rotate-db-apps.yaml(앱 사용자)·rotate-seaweedfs.yaml 의 root(재시작이 필요한 관리자)다.
#
#   rotate-clickhouse-apps   앱 사용자 — ALTER USER 로 **무중단**(ClickHouse 재시작 없음)
#     openreplay   openreplay-secret/clickhouse-password   OpenReplay 앱·마이그레이션
#     openmeter    clickhouse-secret/openmeter-password    OpenMeter 8곳(★ 과금 경로 — 돌리기 전에 사람이 정할 것)
#   rotate-clickhouse-admin  관리자 oim_admin(clickhouse-admin-secret/password)
#     ★ users.xml 사용자라 ALTER 할 수 없다 — OpenBao 만 바꾸면 ESO → Reloader 가 **ClickHouse 를 재시작**한다.
#       그동안 OpenReplay·OpenMeter 의 ClickHouse 질의가 끊긴다.
#
# ★ 앱 비밀번호를 서로 다른 Secret 에 둔 이유: Reloader 는 Secret 단위로 본다. openreplay 를 clickhouse-secret 에
#   두면 openreplay 회전이 openmeter 를 재시작시키고, 관리자를 거기 두면 앱 회전이 ClickHouse 자신을 재시작시킨다.
# ★ 순서(앱): 사전 검사(전부) → 사용자마다 ALTER → 새 값 접속 확인 → OpenBao patch → 되읽기 → [sync] 강제 동기화.
#   실패하면 그 사용자를 되돌리고 멈춘다. 앞의 사용자는 동기화된다.
# ★ 창: ALTER 부터 Reloader 재시작까지 그 앱의 **새 연결**이 실패한다(이미 열린 연결은 유지된다).
# ★ clickhouse-bootstrap(Sync 훅)은 Secret 값으로 비밀번호를 다시 쓴다 — 동기화 중에는 돌리지 말 것.
# ★ 비밀번호는 프로세스 인자에 남기지 않는다 — clickhouse-client 는 CLICKHOUSE_USER·CLICKHOUSE_PASSWORD 환경변수를
#   읽고, ALTER 문은 stdin 으로 보낸다.
# ★ suspend: true — 수동 실행만(사용자 결정, 2026-11-06):
#     kubectl -n local create job --from=cronjob/rotate-clickhouse-apps  rotate-clickhouse-apps-manual-$(date +%s)
#     kubectl -n local create job --from=cronjob/rotate-clickhouse-admin rotate-clickhouse-admin-manual-$(date +%s)
#   하나만 고를 때는 rotate-postgresql-apps.yaml 머리말의 `kubectl set env --local -c rotate ONLY=...` 를 쓴다.
# ★ 전제: ROTATORS="clickhouse" local/openbao-rotator-setup.sh · 메시(allow-database-access 8123/9000) ·
#   NetworkPolicy(allow-clickhouse-access · allow-openbao-access)에 이 SA/라벨.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rotator-clickhouse
  labels:
    app.kubernetes.io/name: rotator-clickhouse
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rotator-clickhouse
  labels:
    app.kubernetes.io/name: rotator-clickhouse
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["clickhouse-admin-secret", "clickhouse-secret", "openreplay-secret"]
    verbs: ["get"]
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    resourceNames: ["clickhouse-admin-secret", "clickhouse-secret", "openreplay-secret"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rotator-clickhouse
  labels:
    app.kubernetes.io/name: rotator-clickhouse
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rotator-clickhouse
subjects:
  - kind: ServiceAccount
    name: rotator-clickhouse
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotate-clickhouse-apps
  labels:
    app.kubernetes.io/name: rotate-clickhouse-apps
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  schedule: "55 3 1 * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            # ★ rotator-clickhouse 라벨 — NetworkPolicy(ClickHouse · OpenBao)가 이 라벨로 연다.
            app.kubernetes.io/name: rotator-clickhouse
            app.kubernetes.io/component: rotation
            app.kubernetes.io/part-of: oneinchmarket
            app.kubernetes.io/managed-by: kustomize
        spec:
          serviceAccountName: rotator-clickhouse
          restartPolicy: Never
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: tools
              emptyDir: {sizeLimit: 512Mi}
          initContainers:
            - name: tools
              image: docker.io/openbao/openbao:2.7.2
              command: ["/bin/sh", "-c", "cp \"$(command -v bao)\" /tools/bao && /tools/bao version"]  # 2.7 부터 /usr/bin/bao(2.4 는 /bin/bao) — 경로를 박지 않는다
              volumeMounts: [{name: tools, mountPath: /tools}]
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits:   {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
            - name: rotate
              # 서버와 같은 태그 — 노드에 이미 있다(clickhouse-bootstrap 과 같은 이유).
              image: docker.io/clickhouse/clickhouse-server:26.10
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  B=/tools/bao
                  export BAO_ADDR=http://openbao.local.svc.cluster.local:8200 HOME=/tmp
                  # 사용자 · 확인 DB · Secret · 키
                  TABLE="openreplay experimental openreplay-secret clickhouse-password
                  openmeter openmeter clickhouse-secret openmeter-password"
                  sha() { printf '%s' "$1" | sha256sum | cut -d' ' -f1; }
                  ev()  { local v; v="K8S_$(printf '%s' "$1" | tr 'a-z-' 'A-Z_')"; printf '%s' "${!v:-}"; }
                  kv()  { $B kv get -mount=oim -field="$2" "$1"; }
                  gen() { head -c 48 /dev/urandom | base64 | tr -d '=+/\n' | cut -c1-32; }
                  # 값은 환경변수로만 — clickhouse-client 인자에 남기지 않는다.
                  conn() { [ "$(CLICKHOUSE_USER="$1" CLICKHOUSE_PASSWORD="$2" clickhouse-client -h clickhouse-headless --port 9000 \
                               -d "$3" -q 'SELECT currentUser()' 2>/dev/null || true)" = "$1" ]; }
                  alter() { printf "ALTER USER %s IDENTIFIED WITH sha256_password BY '%s';\n" "$1" "$2" \
                              | CLICKHOUSE_USER=oim_admin CLICKHOUSE_PASSWORD="$ADMIN" clickhouse-client -h clickhouse-headless --port 9000 --multiquery; }

                  SEL=""
                  while read -r u d s k; do
                    [ -n "$u" ] || continue
                    if [ -z "${ONLY:-}" ] || [[ " $ONLY " == *" $u "* ]]; then SEL="$SEL$u $d $s $k"$'\n'; fi
                  done <<< "$TABLE"
                  for o in ${ONLY:-}; do grep -q "^$o " <<< "$SEL" || { echo "ONLY 의 '$o' 는 대상 표에 없다" >&2; exit 1; }; done
                  [ -n "$SEL" ] || { echo "대상이 없다" >&2; exit 1; }

                  echo "[1/5] OpenBao 로그인 (rotator-clickhouse)"
                  BAO_TOKEN=$($B write -field=token auth/kubernetes/login role=rotator-clickhouse \
                    jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)
                  export BAO_TOKEN
                  ADMIN=$(kv clickhouse-admin-secret password)
                  conn oim_admin "$ADMIN" default || { echo "oim_admin 으로 접속할 수 없다" >&2; exit 1; }

                  echo "[2/5] 사전 검사 — 아무것도 바꾸기 전에 대상 전부"
                  declare -A OLD; bad=0
                  while read -r u d s k; do
                    [ -n "$u" ] || continue
                    OLD[$u]=$(kv "$s" "$k" || true)
                    if [ -z "${OLD[$u]}" ]; then echo "  $u: OpenBao $s/$k 가 비었다" >&2; bad=1; continue; fi
                    [ "${OLD[$u]}" = "$(ev "$u")" ] || { echo "  $u: OpenBao 와 k8s Secret 이 다르다 — ESO 동기화부터 볼 것" >&2; bad=1; continue; }
                    conn "$u" "${OLD[$u]}" "$d" || { echo "  $u: 현재 값으로 접속할 수 없다" >&2; bad=1; continue; }
                    echo "  $u ok"
                  done <<< "$SEL"
                  [ $bad -eq 0 ] || { echo "사전 검사 실패 — 아무것도 바꾸지 않았다" >&2; exit 1; }

                  echo "[3/5] 사용자마다 변경"
                  : > /tools/expected; rm -f /tools/failed
                  while read -r u d s k; do
                    [ -n "$u" ] || continue; o=${OLD[$u]}; n=$(gen)
                    [ "${#n}" -ge 24 ] || { echo "$u" > /tools/failed; break; }
                    if ! alter "$u" "$n"; then echo "$u" > /tools/failed; echo "  $u: ALTER 실패" >&2; alter "$u" "$o" || true; break; fi
                    if ! conn "$u" "$n" "$d"; then
                      alter "$u" "$o" || echo "  $u: [rollback] 실패 — 사람이 볼 것" >&2
                      echo "$u" > /tools/failed; echo "  $u: 새 값으로 접속 실패 — 되돌렸다" >&2; break
                    fi
                    if ! printf '{"%s":"%s"}' "$k" "$n" | $B kv patch -mount=oim "$s" - >/dev/null || [ "$(kv "$s" "$k")" != "$n" ]; then
                      alter "$u" "$o" || echo "  $u: [rollback] DB 되돌리기 실패 — 사람이 볼 것" >&2
                      printf '{"%s":"%s"}' "$k" "$o" | $B kv patch -mount=oim "$s" - >/dev/null || true
                      echo "$u" > /tools/failed; echo "  $u: OpenBao 기록 실패 — 되돌렸다" >&2; break
                    fi
                    printf '%s %s %s\n' "$s" "$k" "$(sha "$n")" >> /tools/expected
                    echo "  $u 변경 완료"
                  done <<< "$SEL"
                  echo "[4/5] 다음 단계에 해시만 넘긴다 ($(wc -l < /tools/expected) 키)"
                  [ -f /tools/failed ] && echo "[5/5] 실패: $(cat /tools/failed)" >&2
                  exit 0
              env:
                - {name: K8S_OPENREPLAY, valueFrom: {secretKeyRef: {name: openreplay-secret, key: clickhouse-password}}}
                - {name: K8S_OPENMETER,  valueFrom: {secretKeyRef: {name: clickhouse-secret, key: openmeter-password}}}
                - {name: ONLY, value: ""}
              volumeMounts: [{name: tools, mountPath: /tools}]
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits:   {cpu: 500m, memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
          containers:
            - name: sync
              image: docker.io/alpine/kubectl:1.36.4
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  h() { kubectl get secret "$1" -o go-template="{{index .data \"$2\" | base64decode}}" | sha256sum | cut -d' ' -f1; }
                  if [ -s /tools/expected ]; then
                    for s in $(cut -d' ' -f1 /tools/expected | sort -u); do
                      echo "[sync] $s 강제 동기화"
                      kubectl annotate externalsecret "$s" force-sync="$(date +%s)" --overwrite >/dev/null
                    done
                    fails=0
                    while read -r s k want; do
                      i=0
                      while [ "$(h "$s" "$k")" != "$want" ]; do i=$((i+1)); [ $i -lt 60 ] || break; sleep 3; done
                      if [ "$(h "$s" "$k")" = "$want" ]; then echo "[sync] $s/$k ok"
                      else echo "[sync] $s/$k 가 180초 안에 따라오지 않았다 — DB·OpenBao 는 새 값이다. ESO 를 볼 것" >&2; fails=$((fails+1)); fi
                    done < /tools/expected
                    [ $fails -eq 0 ] || exit 1
                    echo "[sync] k8s Secret 갱신 확인 — Reloader 가 소비자를 재시작한다"
                  fi
                  if [ -f /tools/failed ]; then echo "[sync] $(cat /tools/failed) 에서 멈췄다 — 그와 뒤의 대상은 바뀌지 않았다" >&2; exit 1; fi
              volumeMounts: [{name: tools, mountPath: /tools, readOnly: true}]
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits:   {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotate-clickhouse-admin
  labels:
    app.kubernetes.io/name: rotate-clickhouse-admin
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  schedule: "35 3 1 */3 *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rotator-clickhouse
            app.kubernetes.io/component: rotation
            app.kubernetes.io/part-of: oneinchmarket
            app.kubernetes.io/managed-by: kustomize
        spec:
          serviceAccountName: rotator-clickhouse
          restartPolicy: Never
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            fsGroup: 101
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: tools
              emptyDir: {sizeLimit: 512Mi}
          initContainers:
            - name: tools
              image: docker.io/openbao/openbao:2.7.2
              command: ["/bin/sh", "-c", "cp \"$(command -v bao)\" /tools/bao && /tools/bao version"]
              volumeMounts: [{name: tools, mountPath: /tools}]
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits:   {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
            - name: rotate
              image: docker.io/clickhouse/clickhouse-server:26.10
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail
                  B=/tools/bao
                  export BAO_ADDR=http://openbao.local.svc.cluster.local:8200 HOME=/tmp
                  sha() { printf '%s' "$1" | sha256sum | cut -d' ' -f1; }
                  conn() { [ "$(CLICKHOUSE_USER=oim_admin CLICKHOUSE_PASSWORD="$1" clickhouse-client -h clickhouse-headless --port 9000 \
                               -q 'SELECT currentUser()' 2>/dev/null || true)" = oim_admin ]; }

                  echo "[1/5] OpenBao 로그인 (rotator-clickhouse)"
                  BAO_TOKEN=$($B write -field=token auth/kubernetes/login role=rotator-clickhouse \
                    jwt=@/var/run/secrets/kubernetes.io/serviceaccount/token)
                  export BAO_TOKEN

                  echo "[2/5] 원천 일치 확인 (OpenBao = k8s Secret)"
                  OLD=$($B kv get -mount=oim -field=password clickhouse-admin-secret)
                  [ -n "$OLD" ] || { echo "OpenBao 값이 비었다" >&2; exit 1; }
                  [ "$OLD" = "$K8S_CURRENT" ] || { echo "OpenBao 와 k8s Secret 이 다르다 — ESO 동기화부터 볼 것" >&2; exit 1; }

                  echo "[3/5] 현재 관리자로 접속 확인"
                  conn "$OLD" || { echo "현재 oim_admin 으로 붙지 못한다 — 멈춘다" >&2; exit 1; }

                  echo "[4/5] OpenBao 에 기록"
                  NEW=$(head -c 48 /dev/urandom | base64 | tr -d '=+/\n' | cut -c1-32)
                  [ "${#NEW}" -ge 24 ] || { echo "생성한 값이 짧다" >&2; exit 1; }
                  printf '{"password":"%s"}' "$NEW" | $B kv patch -mount=oim clickhouse-admin-secret - >/dev/null
                  if [ "$($B kv get -mount=oim -field=password clickhouse-admin-secret)" != "$NEW" ]; then
                    echo "OpenBao 되읽기가 다르다 — 옛 값으로 되돌린다" >&2
                    printf '{"password":"%s"}' "$OLD" | $B kv patch -mount=oim clickhouse-admin-secret - >/dev/null
                    exit 1
                  fi

                  echo "[5/5] 다음 단계에 해시만 넘긴다"
                  sha "$NEW" > /tools/expected.sha
                  echo "OpenBao 갱신 완료 — ClickHouse 는 재시작 뒤에 새 값을 쓴다"
              env:
                - name: K8S_CURRENT
                  valueFrom: {secretKeyRef: {name: clickhouse-admin-secret, key: password}}
              volumeMounts: [{name: tools, mountPath: /tools}]
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits:   {cpu: 500m, memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
            - name: sync
              image: docker.io/alpine/kubectl:1.36.4
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  want=$(cat /tools/expected.sha)
                  h() { kubectl get secret clickhouse-admin-secret -o go-template="{{index .data \"password\" | base64decode}}" | sha256sum | cut -d' ' -f1; }
                  echo "[sync] ExternalSecret 강제 동기화"
                  kubectl annotate externalsecret clickhouse-admin-secret force-sync="$(date +%s)" --overwrite >/dev/null
                  i=0
                  while [ $i -lt 60 ]; do
                    if [ "$(h)" = "$want" ]; then
                      echo "[sync] k8s Secret 갱신 확인 — Reloader 가 ClickHouse 를 재시작한다"; exit 0
                    fi
                    i=$((i+1)); sleep 3
                  done
                  echo "[sync] 180초 안에 k8s Secret 이 따라오지 않았다 — OpenBao 는 새 값이다. ESO 상태를 볼 것" >&2
                  exit 1
              volumeMounts: [{name: tools, mountPath: /tools, readOnly: true}]
              resources:
                requests: {cpu: 20m, memory: 32Mi}
                limits:   {cpu: 200m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
          containers:
            # ★ env 는 동기화가 끝난 뒤의 Secret 값이다. ClickHouse 가 다시 떠서 그 값을 받아들일 때까지 기다린다.
            - name: verify
              image: docker.io/clickhouse/clickhouse-server:26.10
              command:
                - /bin/bash
                - -c
                - |
                  set -uo pipefail
                  export HOME=/tmp
                  for i in $(seq 1 100); do
                    if [ "$(CLICKHOUSE_USER=oim_admin CLICKHOUSE_PASSWORD="$ADMIN_PW" clickhouse-client -h clickhouse-headless --port 9000 \
                            -q 'SELECT currentUser()' 2>/dev/null)" = oim_admin ]; then
                      echo "[verify] ClickHouse 가 새 관리자 비밀번호를 받아들인다 (${i}회째)"; exit 0
                    fi
                    sleep 3
                  done
                  echo "[verify] 300초 안에 ClickHouse 가 새 값을 받지 않았다 — Reloader 가 clickhouse 를 재시작했는지 볼 것." >&2
                  echo "[verify] 되돌리려면 OpenBao oim/clickhouse-admin-secret 의 password 를 옛 값으로(그 KV 의 이전 버전에 있다)." >&2
                  exit 1
              env:
                - {name: ADMIN_PW, valueFrom: {secretKeyRef: {name: clickhouse-admin-secret, key: password}}}
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits:   {cpu: 500m, memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: {drop: ["ALL"]}
