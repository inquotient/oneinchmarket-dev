apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotate-mongodb-password
  labels:
    app.kubernetes.io/name: rotate-mongodb-password
    app.kubernetes.io/component: rotation
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  schedule: "10 3 1,15 * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app.kubernetes.io/name: rotate-mongodb-password
            app.kubernetes.io/component: rotation
            app.kubernetes.io/part-of: oneinchmarket
        spec:
          serviceAccountName: secret-rotator
          restartPolicy: OnFailure
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rotate-mongodb
              image: percona/percona-server-mongodb:latest
              command:
                - /bin/bash
                - -c
                - |
                  set -euo pipefail

                  echo "[1/3] Generating new password..."
                  NEW_PASSWORD=$(head -c 32 /dev/urandom | base64 | tr -d '=+/' | head -c 24)

                  echo "[2/3] Updating MongoDB password..."
                  mongosh "mongodb://mongodb-0.mongodb-headless:27017" \
                    -u root -p "${CURRENT_PASSWORD}" --authenticationDatabase admin \
                    --eval "db.changeUserPassword('appuser', '${NEW_PASSWORD}')"

                  echo "[3/3] Patching Kubernetes secret..."
                  ENCODED_PASSWORD=$(echo -n "${NEW_PASSWORD}" | base64)
                  kubectl patch secret mongodb-secret \
                    -p "{\"data\":{\"mongodb-password\":\"${ENCODED_PASSWORD}\"}}"

                  echo "MongoDB password rotation completed."
              env:
                - name: CURRENT_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: mongodb-secret
                      key: mongodb-root-password
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
