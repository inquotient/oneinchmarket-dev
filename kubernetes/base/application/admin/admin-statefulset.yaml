apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: admin
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: admin-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: oneinchmarket
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: admin
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: admin
          # 레지스트리에 버전 태그가 없다(G9 — Dockerfile 부재로 CI 빌드 불가).
          # 재현 가능한 유일한 핀은 다이제스트다.
          image: docker.io/inquotient/admin@sha256:8479fe9611058be1127465b2b03b98cdf919f84fb48ff5a548101f5ba2c3443a
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: admin-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          # startupProbe 가 없으면 livenessProbe 가 즉시 시작해 90초 만에 죽인다.
          startupProbe:
            httpGet:
              path: /
              port: 3000
            failureThreshold: 40
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
