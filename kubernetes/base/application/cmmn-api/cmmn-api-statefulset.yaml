apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cmmn-api
  labels:
    app.kubernetes.io/name: cmmn-api
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: cmmn-api-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cmmn-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cmmn-api
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: oneinchmarket
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: cmmn-api
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cmmn-api
          image: inquotient/cmmn-api:latest
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: DB_HOST
              value: "jdbc:mariadb://mariadb-headless:3306/cmmn"
            - name: DB_USERNAME
              value: "cmmn-api"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cmmn-api-secret
                  key: db-password
            - name: SPRING_DATA_REDIS_HOST
              value: "redis-headless"
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-password
            # ★ spring.kafka.bootstrap-servers 는 이 앱에서 무시된다.
            #   application-kafka.yml 의 kafka-dev 프로파일이
            #   spring.kafka.consumer.bootstrap-servers 와
            #   spring.kafka.producer.bootstrap-servers 를 개별 지정하며,
            #   더 구체적인 키가 우선하기 때문이다. 이미지에 구워진 값은
            #   kafka-0.kafka-headless.dev.svc.cluster.local:9092 다.
            - name: SPRING_KAFKA_CONSUMER_BOOTSTRAP_SERVERS
              value: "kafka-headless:9092"
            - name: SPRING_KAFKA_PRODUCER_BOOTSTRAP_SERVERS
              value: "kafka-headless:9092"
            # Apicurio 의 Confluent 호환 엔드포인트. schema-reg 는 v2 에 없다(ADR-031).
            - name: SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL
              value: "http://apicurio-registry-headless:8080/apis/ccompat/v7"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-headless:9092"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10
