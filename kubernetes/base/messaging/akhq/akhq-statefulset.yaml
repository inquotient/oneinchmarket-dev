apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: akhq
  labels:
    app.kubernetes.io/name: akhq
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: akhq-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: akhq
  template:
    metadata:
      labels:
        app.kubernetes.io/name: akhq
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: akhq
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: akhq
          image: tchiotludo/akhq:0.28.0
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /app/application.yml
              subPath: application.yml
      volumes:
        - name: config
          configMap:
            name: akhq-config
