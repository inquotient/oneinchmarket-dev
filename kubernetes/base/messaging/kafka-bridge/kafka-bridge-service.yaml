apiVersion: v1
kind: ServiceAccount
metadata:
  name: kafka-bridge
  labels:
    app.kubernetes.io/name: kafka-bridge
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-bridge
  labels:
    app.kubernetes.io/name: kafka-bridge
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: oneinchmarket
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 8081
      targetPort: management
      protocol: TCP
      name: management
  selector:
    app.kubernetes.io/name: kafka-bridge
