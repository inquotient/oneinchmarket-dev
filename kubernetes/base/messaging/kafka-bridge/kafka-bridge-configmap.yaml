apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-bridge-config
  labels:
    app.kubernetes.io/name: kafka-bridge
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: oneinchmarket
data:
  # ─────────────────────────────────────────────────────────────────────
  # Strimzi Kafka Bridge (ADR-032 — Confluent REST Proxy 대체).
  #
  # 이미지 계약은 실측으로 확인했다:
  #   Cmd        /opt/strimzi/bin/kafka_bridge_run.sh  (entrypoint 없음)
  #   인자       --config-file=<경로>   ← 이 파일을 여기로 넘긴다
  #   uid/gid    1001 / 0
  #   헬스       http.management.port(8081)의 /healthy·/ready.
  #              **8080 의 같은 경로는 501 을 준다** — 프로브를 8080 에 걸면
  #              영원히 실패한다.
  # ─────────────────────────────────────────────────────────────────────
  application.properties: |
    bridge.id=oneinchmarket-bridge

    # ── Kafka ──
    kafka.bootstrap.servers=kafka-headless:9092
    kafka.producer.acks=1
    kafka.consumer.auto.offset.reset=earliest

    # ── HTTP ──
    http.host=0.0.0.0
    http.port=8080
    # 관리 인터페이스 — /healthy · /ready · /metrics 가 여기 붙는다
    http.management.port=8081
    # CORS 는 끈다. 브리지에 자체 인증이 없어(SEC-206) 브라우저에서 직접
    # 부르게 열어 줄 이유가 없다. 노출은 앞단 인증을 거친 경로로만 한다.
    http.cors.enabled=false
    http.consumer.enabled=true
    http.producer.enabled=true

    # ── 메트릭 ──
    # strimziMetricsReporter 는 별도 설정 파일이 필요 없다
    # (jmxPrometheusExporter 는 exporter 설정 파일을 요구한다).
    # 실측: 활성화 시 :8081/metrics 가 200 을 준다.
    bridge.metrics=strimziMetricsReporter
