apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apicurio-registry
  labels:
    app.kubernetes.io/name: apicurio-registry
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: apicurio-registry-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apicurio-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apicurio-registry
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: apicurio
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apicurio-registry
          image: apicurio/apicurio-registry:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            # Quarkus 관리 인터페이스. health 엔드포인트가 여기에 있다.
            #   Management interface listening on http://0.0.0.0:9000
            - containerPort: 9000
              name: management
              protocol: TCP
          env:
            - name: QUARKUS_DATASOURCE_URL
              value: "jdbc:postgresql://postgresql-headless:5432/apicurio"
            - name: QUARKUS_DATASOURCE_USERNAME
              value: "apicurio"
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apicurio-secret
                  key: db-password
            - name: REGISTRY_STORAGE_KIND
              value: "sql"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          # 경로·포트 실측 결과: 관리 포트 9000 의 /health/* 가 200 이다.
          #   :9000/health/ready      -> 200
          #   :9000/q/health/ready    -> 404   (Quarkus 기본 접두사가 아니다)
          #   :8080/health/ready      -> 404
          # startupProbe 가 없으면 livenessProbe 가 delay=0s 로
          # 즉시 시작한다. Apicurio 는 기동에 ~15초가 걸려 여유가 없다(exitCode 143).
          startupProbe:
            httpGet:
              path: /health/ready
              port: management
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
