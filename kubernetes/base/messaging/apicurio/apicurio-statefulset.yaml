apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apicurio-registry
  labels:
    app.kubernetes.io/name: apicurio-registry
    app.kubernetes.io/component: messaging
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: apicurio-registry-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: apicurio-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: apicurio-registry
        app.kubernetes.io/component: messaging
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: apicurio
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apicurio-registry
          # UI 이미지(apicurio-registry-ui)와 반드시 같은 버전이어야 한다.
          image: docker.io/apicurio/apicurio-registry:3.3.2
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            # Quarkus 관리 인터페이스. health 엔드포인트가 여기에 있다.
            #   Management interface listening on http://0.0.0.0:9000
            - containerPort: 9000
              name: management
              protocol: TCP
          env:
            # ★★★ 저장소 키는 Apicurio **3.x** 의 이름이어야 한다(2026-11-03 정정).
            #   예전 값 `QUARKUS_DATASOURCE_URL`·`REGISTRY_STORAGE_KIND` 는 2.x 의 키라 3.x 에서
            #   **조용히 무시**되고, jar 기본값 `apicurio.storage.sql.kind=h2` ·
            #   `apicurio.datasource.url=jdbc:h2:mem:...` 이 쓰였다. 즉 레지스트리가 처음부터
            #   **메모리 H2** 였고 재시작마다 아티팩트·규칙이 전부 사라졌다 — 실측: 기동 로그
            #   `Using h2 SQL storage.` · PostgreSQL apicurio DB 의 테이블 **0개**. 오류는 한 줄도
            #   없다(`quarkus.datasource.url ... build time fixed to 'null'` 경고만 남는다).
            #   ★ 판정: 기동 로그에 `Using postgresql SQL storage` 가 나오는지, 그리고 재시작 뒤
            #   아티팩트가 남는지. 키 이름은 jar 의 application.properties 에서 읽었다.
            - name: APICURIO_STORAGE_KIND
              value: "sql"
            - name: APICURIO_STORAGE_SQL_KIND
              value: "postgresql"
            - name: APICURIO_DATASOURCE_URL
              value: "jdbc:postgresql://postgresql-headless:5432/apicurio"
            - name: APICURIO_DATASOURCE_USERNAME
              value: "apicurio"
            - name: APICURIO_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apicurio-secret
                  key: db-password
            # ★ Apicurio Studio 후계 기능 스위치.
            #   Studio 는 upstream 에서 완전 폐기되었고 그 기능이 Registry
            #   3.1.0 에 opt-in 으로 흡수되었다. 이 값을 켜야 UI 에 Drafts
            #   섹션과 버전 콘텐츠 편집이 나타난다.
            #   속성명: apicurio.rest.mutability.artifact-version-content.enabled
            #   (Quarkus 규칙으로 env 는 대문자·점/하이픈 -> 밑줄)
            - name: APICURIO_REST_MUTABILITY_ARTIFACT_VERSION_CONTENT_ENABLED
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          # 경로·포트 실측 결과: 관리 포트 9000 의 /health/* 가 200 이다.
          #   :9000/health/ready      -> 200
          #   :9000/q/health/ready    -> 404   (Quarkus 기본 접두사가 아니다)
          #   :8080/health/ready      -> 404
          # startupProbe 가 없으면 livenessProbe 가 delay=0s 로
          # 즉시 시작한다. Apicurio 는 기동에 ~15초가 걸려 여유가 없다(exitCode 143).
          startupProbe:
            httpGet:
              path: /health/ready
              port: management
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
            timeoutSeconds: 5
