# G18 해소 — 15개 워크로드가 존재하지 않는 ServiceAccount 를 지정하고 있었다.
# 커밋 f08512f 이후 SA 정의가 사라진 상태였다.
#
# 전부 권한 없는 기본 SA 다. 추가 Role 이 필요한 것은 해당 카테고리에서 정의한다
# (예: spark-driver → data-lakehouse/spark/spark-rbac.yaml).
# automountServiceAccountToken: false — 이 워크로드들은 API 서버를 호출하지 않는다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin
  labels:
    app.kubernetes.io/name: admin
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
