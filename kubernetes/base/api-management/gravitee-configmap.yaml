apiVersion: v1
kind: ConfigMap
metadata:
  name: gravitee-config
  labels:
    app.kubernetes.io/name: gravitee
    app.kubernetes.io/component: api-management
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
data:
  # ── gravitee.yml ──────────────────────────────────────────────────────
  #
  # ★ 왜 환경변수(GRAVITEE_*)가 아니라 파일인가:
  #   환경변수 이름은 설정 트리 경로를 그대로 따르는데, 그 경로가 판마다
  #   달랐다. 4.12 의 실제 구조는 상류 템플릿에서 확인했다 —
  #   `repositories.management.mongodb` · `repositories.analytics` 다
  #   (한때 널리 쓰인 `GRAVITEE_MANAGEMENT_MONGODB_URI` 는 그 트리와
  #   맞지 않는다). **이름을 추측하면 조용히 무시된다** — Gotcha 26·88 이
  #   같은 부류를 두 번 기록했다. 파일로 주면 추측이 없다.
  #
  # ★★ 비밀번호는 자리표시자다. initContainer 가 치환해 emptyDir 에 쓴다
  #   (ranger-usersync·OpenMeter 와 같은 방식, Gotcha 26). ConfigMap 은
  #   git 에 있고 ArgoCD 가 렌더하므로 값을 적으면 그대로 커밋된다.
  #
  # ★★★ analytics 를 **끈다**(`type: none`). 상류 템플릿이 그 값을 명시적으로
  #   지원한다. 켜지 않는 이유:
  #     · 이 클러스터의 ES 는 **자체 서명 TLS**(https://elasticsearch-es-http:9200)인데
  #       템플릿의 elasticsearch 블록에는 **신뢰 설정(ssl·trustall)이 없다.**
  #       JVM 트러스트스토어에 CA 를 넣는 별건이 된다.
  #     · 그리고 지금 Gravitee 는 **트래픽 경로 밖**이라 분석할 트래픽이 0이다
  #       (ADR-079 미결 · Gotcha 15: 계량 지점을 함부로 옮기지 말 것).
  #   켤 때 할 일을 여기 적어 둔다 — 추측으로 미리 쓰지 않는다.
  gravitee.yml: |
    # ── 저장소 ──
    repositories:
      management:
        type: mongodb
        mongodb:
          uri: mongodb://gravitee:__GRAVITEE_DB_PASSWORD__@mongodb-headless:27017/gravitee?authSource=gravitee

      # ★★ 게이트웨이는 `management` 말고 **`ratelimit` 저장소도** 요구한다.
      #   없으면 기동 중 이렇게 죽는다:
      #     IllegalStateException: No repository type defined in configuration
      #                            for ratelimit
      #   ★ 그 뒤 **정상 종료 절차를 밟아** 로그 끝이 "API Gateway stopped"
      #     가 된다 — 깨끗하게 끝난 것처럼 보이고 포트만 안 열린다.
      #     management-api 의 JWT 건과 같은 모양이다.
      #   ★★ management 와 **같은 DB** 를 쓴다 — 쿨러를 따로 두면
      #     사용자·권한을 하나 더 관리해야 하고 얻는 것이 없다.
      ratelimit:
        type: mongodb
        mongodb:
          uri: mongodb://gravitee:__GRAVITEE_DB_PASSWORD__@mongodb-headless:27017/gravitee?authSource=gravitee

      # ★ 분석 비활성 — 위 주석 참조. 켜려면 ES 의 자체 서명 CA 를 먼저 해결할 것.
      analytics:
        type: none

    # ── JWT ──
    # ★★ **필수다.** 없으면 management-api 가
    #   `java.lang.IllegalStateException: JWT secret is mandatory` 로 죽는다.
    #   ★ 그 오류는 Spring 의존성 사슬 속에 묻혀 나오고, 앱은
    #     그 뒤 **정상 종료 절차를 밟는다** — 로그 끝에는
    #     "Rest APIs stopped" 만 보여 깨끗하게 종료한 것처럼 읽힌다.
    #     파드는 Running 이고 포트만 안 열린다.
    jwt:
      secret: __GRAVITEE_JWT_SECRET__

    # ── 인증 ──
    # ★★★ 이 절이 없으면 **사용자가 0명**이 된다. 우리가 gravitee.yml 을
    #   통째로 대체하므로 이미지 기본값의 memory 공급자도 함께 사라진다.
    #   증상: 관리 API 의 모든 경로가 401 이고, 로그에는
    #   `Loading authentication providers` 한 줄만 찍힌다(몇 개 실었는지
    #   말하지 않는다). 실측으로 이 클러스터는 며칠째 **관리자가 없는**
    #   상태였고, 그래서 API 0 · 플랜 0 · 구독 0 이었다 — Gotcha 155.
    # ★ 비밀번호는 **bcrypt 해시**를 넣는다. create-secrets.sh 가 해시를
    #   만들어 Secret 에 두고 initContainer 가 치환하므로, 평문은 파드의
    #   설정 파일에도 남지 않는다(OpenSearch 의 internal_users 와 같은 방식).
    security:
      providers:
        - type: memory
          allow-email-in-search-results: true
          users:
            - user: admin
              password: __GRAVITEE_ADMIN_BCRYPT__
              roles: ORGANIZATION:ADMIN,ENVIRONMENT:ADMIN

    # ── HTTP ──
    # 포트는 이미지 기본값을 그대로 둔다(management-api 8083 · gateway 8082).
    # 이미지 config 의 ExposedPorts 에서 확인했다.
    http:
      host: 0.0.0.0
