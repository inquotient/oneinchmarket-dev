apiVersion: v1
kind: ConfigMap
metadata:
  name: gravitee-config
  labels:
    app.kubernetes.io/name: gravitee
    app.kubernetes.io/component: api-management
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
data:
  # ── gravitee.yml ──────────────────────────────────────────────────────
  #
  # ★ 왜 환경변수(GRAVITEE_*)가 아니라 파일인가:
  #   환경변수 이름은 설정 트리 경로를 그대로 따르는데, 그 경로가 판마다
  #   달랐다. 4.12 의 실제 구조는 상류 템플릿에서 확인했다 —
  #   `repositories.management.mongodb` · `repositories.analytics` 다
  #   (한때 널리 쓰인 `GRAVITEE_MANAGEMENT_MONGODB_URI` 는 그 트리와
  #   맞지 않는다). **이름을 추측하면 조용히 무시된다** — Gotcha 26·88 이
  #   같은 부류를 두 번 기록했다. 파일로 주면 추측이 없다.
  #
  # ★★ 비밀번호는 자리표시자다. initContainer 가 치환해 emptyDir 에 쓴다
  #   (ranger-usersync·OpenMeter 와 같은 방식, Gotcha 26). ConfigMap 은
  #   git 에 있고 ArgoCD 가 렌더하므로 값을 적으면 그대로 커밋된다.
  #
  # ★★★ analytics 를 **끈다**(`type: none`). 상류 템플릿이 그 값을 명시적으로
  #   지원한다. 켜지 않는 이유:
  #     · 이 클러스터의 ES 는 **자체 서명 TLS**(https://elasticsearch-es-http:9200)인데
  #       템플릿의 elasticsearch 블록에는 **신뢰 설정(ssl·trustall)이 없다.**
  #       JVM 트러스트스토어에 CA 를 넣는 별건이 된다.
  #     · 그리고 지금 Gravitee 는 **트래픽 경로 밖**이라 분석할 트래픽이 0이다
  #       (ADR-079 미결 · Gotcha 15: 계량 지점을 함부로 옮기지 말 것).
  #   켤 때 할 일을 여기 적어 둔다 — 추측으로 미리 쓰지 않는다.
  gravitee.yml: |
    # ── 저장소 ──
    repositories:
      management:
        type: mongodb
        mongodb:
          uri: mongodb://gravitee:__GRAVITEE_DB_PASSWORD__@mongodb-headless:27017/gravitee?authSource=gravitee

      # ★ 분석 비활성 — 위 주석 참조. 켜려면 ES 의 자체 서명 CA 를 먼저 해결할 것.
      analytics:
        type: none

    # ── HTTP ──
    # 포트는 이미지 기본값을 그대로 둔다(management-api 8083 · gateway 8082).
    # 이미지 config 의 ExposedPorts 에서 확인했다.
    http:
      host: 0.0.0.0
