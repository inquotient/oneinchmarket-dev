# Gravitee 게이트웨이 — ★★ **트래픽 경로에 넣지 않는다.**
#   HTTPRoute 도 Gateway 도 이것을 가리키지 않고, 외부 진입은 그대로
#   Istio Gateway 다(ADR-071). 이유는 **계량 지점**이다 — 과금은
#   소급 재해석이 불가능해서 지점을 옮기면 이미 청구한 이력까지
#   흔들린다(Gotcha 15). 어느 쪽을 쓸지는 ADR-079 가 정한다.
#   그때까지 이것은 **서 있을 뿐 아무것도 받지 않는다.**
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gravitee-gateway
  labels:
    app.kubernetes.io/name: gravitee
    app.kubernetes.io/instance: gateway
    app.kubernetes.io/component: api-management
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }   # Gotcha 87
  selector:
    matchLabels:
      app.kubernetes.io/name: gravitee
      app.kubernetes.io/instance: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gravitee
        app.kubernetes.io/instance: gateway
        app.kubernetes.io/component: api-management
        app.kubernetes.io/part-of: oneinchmarket
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: gravitee
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # ★★ 이미지의 `graviteeio` 사용자는 **uid 1001 · gid 1000** 이다.
        #   이미지 config 의 `User` 필드는 **이름**이라 숫자를 알려 주지
        #   않는다 — `/etc/passwd` 를 직접 봐야 한다.
        #   ★ 처음에 1000 으로 가정했다가 management-api 가 CrashLoop 했다:
        #     java.nio.file.AccessDeniedException:
        #       /opt/graviteeio-management-api/data/write.lock
        #   (Lucene 인덱스를 그 디렉터리에 쓴다. 그 디렉터리는 1001 소유다.)
        #   ★★ 증상이 멀다 — Spring 의 의존성 사슬이 10단계 넘게 찍히고
        #     진짜 오류는 **맨 끝의 Caused by** 에만 있다.
        #   ★ gateway 는 data 에 쓰지 않아 1000 으로도 떴었다 — 같은 가정이
        #     한 쪽에서만 드러난 것이므로 둘 다 바로잡는다.
        runAsUser: 1001
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # ★ 자리표시자 치환 — ConfigMap 은 읽기 전용이므로 emptyDir 로 복사해
        #   비밀번호를 넣는다(Gotcha 26 의 방식).
        # ★★ 치환 결과를 **되읽어 확인하고 다르면 기동을 거부**한다(Gotcha 86).
        #   sed 가 조용히 빗나가면 아무 일도 하지 않은 것과 같은데 파드는 뜬다.
        - name: render-config
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              sed "s|__GRAVITEE_DB_PASSWORD__|${GRAVITEE_DB_PASSWORD}|" \
                /etc/gravitee-src/gravitee.yml > /etc/gravitee/gravitee.yml
              if grep -q "__GRAVITEE_DB_PASSWORD__" /etc/gravitee/gravitee.yml; then
                echo "치환 실패: 자리표시자가 남아 있다" >&2; exit 1
              fi
              if ! grep -q "mongodb://gravitee:" /etc/gravitee/gravitee.yml; then
                echo "치환 결과가 기대한 모양이 아니다" >&2; exit 1
              fi
              echo "gravitee.yml 렌더 완료"
          env:
            - name: GRAVITEE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: gravitee-secret, key: db-password } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 64Mi }
          volumeMounts:
            - { name: config-src, mountPath: /etc/gravitee-src, readOnly: true }
            - { name: config, mountPath: /etc/gravitee }
        # MongoDB 가 없으면 기동에 실패한다. 기다린다.
        # ★ 대기 루프에서 -q 로 출력을 죽이지 않는다(Gotcha 120).
        - name: wait-mongodb
          image: percona/percona-server-mongodb:8.0.29-13
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              i=0
              until mongosh --quiet --host mongodb-headless --port 27017 \
                      --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; do
                i=$((i+1))
                [ "$i" -gt 60 ] && { echo "MongoDB 가 5분 안에 응답하지 않았다"; exit 1; }
                echo "  MongoDB 대기 ($i/60)"; sleep 5
              done
              echo "MongoDB 응답함"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 192Mi }
      containers:
        - name: gateway
          image: graviteeio/apim-gateway:4.12.19
          imagePullPolicy: IfNotPresent
          env:
            # ★ 힙을 명시한다 — limit 의 62.5%(Gotcha 81·82).
            #   퍼센트 기반은 JDK 가 컨테이너 한도를 못 읽는 경우 통째로 무너진다.
            - name: JAVA_OPTS
              value: "-Xms192m -Xmx640m"
          ports:
            - { name: http, containerPort: 8082, protocol: TCP }
          # ★ 프로브를 추측하지 않았다. 기동 뒤 실제 헬스 엔드포인트를 확인해
          #   좁힐 것 — 지금은 TCP 로 두되 그것이 "설정이 반영됐는가" 를
          #   보지 못한다는 것을 알고 쓴다(Gotcha 48).
          startupProbe:
            tcpSocket: { port: http }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 15
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits:   { cpu: "2", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            # ★ 켜지 않았다 — JVM 이 어디에 쓰는지 재기 전에는 모른다(Gotcha 92).
            readOnlyRootFilesystem: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # 렌더된 설정 한 파일만 갈아끼운다.
            - name: config
              mountPath: /opt/graviteeio-gateway/config/gravitee.yml
              subPath: gravitee.yml
              readOnly: true
      volumes:
        - name: config-src
          configMap: { name: gravitee-config }
        - name: config
          emptyDir: {}
