# 스트리밍 — WSO2 Streaming Integrator(Siddhi) 대체 (WSO2-OSS-MAPPING §D · Phase 3)
#
# ★ wave 3 인 이유: Kafka(messaging, wave 2) 뒤여야 한다. data-lakehouse 와
#   같은 wave 이고 서로 의존하지 않는다.
#
# ★★ 카테고리를 따로 둔 이유는 `commonAnnotations` 때문이다 — messaging 에
#   넣으면 그쪽 wave 2 로 덮인다(Gotcha 67). 디렉터리를 나누는 것이 처방이다.
#
# 앞으로 여기 들어올 것: Debezium(Kafka Connect). 단 그것은 PostgreSQL 의
#   `wal_level=logical` 이 선행되어야 한다 — 지금은 `replica` 다.
# ─────────────────────────────────────────────────────────────────────────
# ★★★ 2026-09-12: **연결했다**(사용자 결정 "일단 도입해줘").
#     그 전까지 이 디렉터리는 `base/kustomization.yaml` 에 일부러 연결하지
#     않아 렌더에도 클러스터에도 없었다. 아래가 그때의 보류 사유이고,
#     **그중 하나는 넣기 전에 이미 무너져 있었다.**
#
#     보류 사유(2026-09-10)와 2026-09-12 실측:
#       · 스트림 잡 0건          -> **여전히 0건**(레포의 Kafka Streams 참조
#         0 · 클러스터의 스트림 워크로드 0). 복귀 조건은 "손수 짠 패턴
#         매칭이 셋을 넘을 때" 였으니 **충족되지 않았다.**
#       · 배치는 Spark 가 한다   -> 그대로 참
#       · Iceberg 적재는 `iceberg-kafka-connect` 1.11.0 이 Kafka Connect 로
#         해낸다 -> ★★ **거짓이다.** Gotcha 116 이 그 근거를 정정했고
#         (Central 에는 1.9.2 뿐이며 그것은 라이브러리 jar 이라 Connect 에
#         넣을 수 없다), 실측 플러그인 4종은 Debezium·MirrorMaker 뿐이다.
#         **지금 Kafka -> Iceberg 적재를 하는 것은 0개다.**
#       · 윈도우·조인·CEP 는 Kafka Streams 로 -> 참이지만 아무도 안 썼다
#
#     ★ 그래서 이 도입은 "조건이 참이 되어" 가 아니라 **결정으로** 들어온
#       것이고, 지금은 **일감이 0건**이다 — KEDA·Crossplane·kpack 과 같은
#       상태다(CLAUDE.md 오퍼레이터 계층 항). 첫 일감의 유력 후보는 위의
#       세 번째 항, 즉 **Kafka -> Iceberg 적재**다.
#     ★★ 걷어내기: `base/kustomization.yaml` 에서 `- streaming/` 한 줄을
#       지우면 된다. 회수량은 requests 2,560Mi(JM 1,024 + TM 1,536).
#
#     ※ Debezium(Kafka Connect)은 이 결정과 무관하다 — 아래 참조.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - flink-jobmanager.yaml
  - flink-taskmanager.yaml
  - flink-netpol.yaml

commonAnnotations:
  argocd.argoproj.io/sync-wave: "3"
