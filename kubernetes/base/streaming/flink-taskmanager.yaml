# ─────────────────────────────────────────────────────────────────────────
# Flink TaskManager — 실제 연산을 하는 쪽
#
# ★ JobManager 와 **같은 FLINK_PROPERTIES 를 받아야 한다.** 특히
#   `jobmanager.rpc.address` — 없으면 기본값 localhost 로 자기 자신에게 붙으려
#   하고 등록에 실패한다. 증상은 파드가 Running 인데 JM 의 /overview 에
#   taskmanagers 가 0 인 것이라, **파드 상태로는 알 수 없다.**
#
# ★ REST 가 없으므로 프로브는 TCP 다. 그래서 "떠 있는가" 밖에 못 본다 —
#   실제 등록 여부는 JM 의 `/overview` 의 `taskmanagers` 로 판정할 것.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-taskmanager
  labels:
    app.kubernetes.io/name: flink-taskmanager
    app.kubernetes.io/component: streaming
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: flink-taskmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flink-taskmanager
        app.kubernetes.io/component: streaming
        app.kubernetes.io/part-of: oneinchmarket
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: flink
      securityContext:
        runAsNonRoot: true
        runAsUser: 9999
        runAsGroup: 9999
        fsGroup: 9999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: taskmanager
          image: docker.io/library/flink:1.20.2
          args: ["taskmanager"]
          env:
            - name: FLINK_PROPERTIES
              value: |
                jobmanager.rpc.address: flink-jobmanager
                jobmanager.memory.process.size: 1024m
                taskmanager.memory.process.size: 1536m
                taskmanager.numberOfTaskSlots: 2
                parallelism.default: 1
          ports:
            - {name: data, containerPort: 6121, protocol: TCP}
            - {name: rpc,  containerPort: 6122, protocol: TCP}
          startupProbe:
            tcpSocket: {port: rpc}
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            tcpSocket: {port: rpc}
            periodSeconds: 15
          livenessProbe:
            tcpSocket: {port: rpc}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 200m, memory: 1536Mi}
            limits: {memory: 1792Mi}
