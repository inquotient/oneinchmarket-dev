# ★★★ 이 두 HTTPRoute 는 2026-10-05 에 service-mesh/ 에서 **떼어냈다.**
#
# service-mesh/kustomization.yaml 의 commonAnnotations 가 sync-wave 를 0 으로
# 덮는데, 이 둘의 **백엔드가 훨씬 뒤 wave** 에 있다:
#   api         -> safeline                   (wave 8)
#   managed-api -> gravitee-gateway-headless  (wave 5)
# HTTPRoute 의 health 는 백엔드 Service 가 존재하는지로 정해지므로, wave 0 에
# 두면 **영원히 Degraded** 이고 ArgoCD 가 wave 0 에서 멈춘다. 실측(베어메탈
# 첫 동기화): `Synced 126/575` 에서 정지, 비정상 항목이 정확히 이 둘이었다 —
#   Parent ingress: backend(safeline.local.svc.cluster.local) not found
#   Parent ingress: backend(gravitee-gateway-headless.local.svc.cluster.local) not found
#
# ★ 이미 떠 있는 클러스터에서는 드러나지 않는다 — 백엔드가 이미 있으니
#   wave 0 이어도 아무 일도 없다(Gotcha 58·173).
# ★★ 디렉터리를 분리하는 것이 처방이다 — 하위 patch 로는 sync-wave 를
#   바꿀 수 없다(commonAnnotations 가 뒤에 적용된다, Gotcha 67·170).
#   base/gateway-ratelimit/ · base/kafka-connect/ 가 같은 이유로 떼어져 있다.
# ★ Gateway 본체와 https-redirect 는 service-mesh/ 에 그대로 둔다 —
#   그 둘은 백엔드가 없어 wave 0 에서 정상적으로 Healthy 가 된다.
# 5) 과금 대상 API. 계량은 이 경로를 지나는 요청을 센다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    # ★ 백엔드 safeline 이 wave 8 이다. 그보다 앞서면 영원히 Degraded 다.
    argocd.argoproj.io/sync-wave: "8"
  name: api
  labels:
    app.kubernetes.io/component: service-mesh
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  # ★ Gateway API 는 CRD 스키마 기본값이 많다 — 서버가 `group`·`kind`·
  #   `weight`·`matches` 를 되써 넣어 **영원히 OutOfSync 로 보인다**(§8-84).
  #   무시 규칙을 두는 대신 **명시**한다. 쓸 수 있는 값이고, 명시하면
  #   "무엇에 붙는 경로인가" 가 매니페스트만 읽어도 드러난다.
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ingress
      sectionName: https
  hostnames:
    - api.oneinchmarket.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # ★★★ 2026-09-12: 백엔드가 cmmn-api 에서 **SafeLine(WAF)** 으로 바뀌었다.
      #   경로는 `바깥 -> Istio Gateway -> SafeLine -> cmmn-api` 다.
      #   ★ 순서가 이 배치의 전부다 — Istio 가 **먼저**라야 계량 지점이
      #     움직이지 않는다(Gotcha 15). WAF 를 앞에 두면 액세스 로그가
      #     WAF 뒤에서 나오게 되어 이미 청구한 이력이 흔들린다.
      #   ★★ 그 전까지 SafeLine 은 **아무것도 막지 않고 있었다** — 이 경로에
      #     들어오기 전 실측은 tengine 액세스 로그 0줄 · proxy_pass 0건 ·
      #     이 WAF 를 가리키는 HTTPRoute 0건인데 1,504Mi 를 예약하고 있었다.
      #   ★★★ 이 라우트가 200 을 주려면 SafeLine 안에 **보호 대상(사이트)**
      #     이 있어야 한다. 그 정의는 mgt 의 DB 에만 살아 매니페스트로
      #     복구되지 않는다 — 원천은 `local/safeline-sites/*.json` 이고
      #     `local/safeline-bootstrap.sh` 가 밀어 넣는다(Gotcha 159).
      #     클러스터를 다시 세우면 반드시 다시 돌릴 것. 빠뜨리면 이 경로만
      #     죽는데 게이트웨이도 파드도 정상이라 원인이 멀다.
      #   ★ 포트 8181 은 `safeline-sites/*.json` 의 `ports` 와 짝이다.
      #     한쪽만 바꾸면 Service 는 열려 있는데 tengine 이 듣지 않아 502 다.
      backendRefs:
        - group: ""
          kind: Service
          name: safeline
          port: 8181
          weight: 1

---
# 6) Gravitee 로 보내는 경로 — **Istio 앞, Gravitee 뒤**(ADR-079, 2026-09-12 채택).
#
# ★★★ 순서가 이 배치의 전부다. 모든 트래픽이 **Istio 게이트웨이를 먼저**
#   지나므로 계량 지점이 움직이지 않는다. 실측으로 확인했다 — 같은 토큰으로
#   `/api/menu` 와 `/managed/api/menu` 를 부르면 액세스 로그에 각각
#   `route=local.api.0` · `route=local.managed-api.0` 으로 **둘 다** 남고
#   Kafka `api-usage` 토픽에 그대로 들어간다(2026-09-12 실측 6건).
#   거꾸로(Gravitee 를 앞에) 두면 Gotcha 15 에 정면으로 걸린다: "계량 지점을
#   나중에 바꾸면 이미 청구한 이력이 함께 흔들린다. 청구는 소급 재해석이
#   불가능하다."
#
# ★★ 역할을 겹치지 않게 나눈다:
#   Istio    TLS · JWT · 신원 · **계량** · **쓰로틀**(pricing-catalog.yaml 원천)
#   Gravitee 카탈로그 · 개발자 포털 · 구독/키 발급 · 요청·응답 변환
#   ★ Gravitee 의 **플랜·쿼터·분석을 켜지 말 것** — 켜는 순간 "이 고객이
#     무엇을 샀는가" 의 원천이 Gravitee 의 Mongo 와 OpenMeter 의 PostgreSQL
#     둘이 된다(Gotcha 71 이 경고한 그것). 그래서 이 API 의 플랜은 KEY_LESS 다.
#
# ★ `/managed` 는 `/`(위의 api 경로, cmmn-api 직결) 보다 **더 구체적**이라
#   먼저 매칭된다. 기존 경로를 건드리지 않는다.
#
# ★★ **이 경로는 Gravitee 안의 API 정의가 있어야 200 을 준다** — 정의는
#   Mongo 에 살고 매니페스트에 없다. 원천은 `local/gravitee-apis/*.json` 이고
#   `local/gravitee-bootstrap.sh` 가 밀어 넣는다. **클러스터를 새로 세우면
#   반드시 그 스크립트를 돌릴 것** — 빠뜨리면 이 경로만 404 다(게이트웨이도
#   파드도 정상이라 원인이 멀다). 같은 이유로 prod 에 올리기 전에 그쪽
#   Gravitee 에 카탈로그가 실려 있는지 먼저 확인할 것.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  annotations:
    # ★ 백엔드 gravitee-gateway-headless 가 wave 5 다.
    argocd.argoproj.io/sync-wave: "5"
  name: managed-api
  labels:
    app.kubernetes.io/name: managed-api
    app.kubernetes.io/component: service-mesh
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ingress
      sectionName: https
  hostnames:
    - api.oneinchmarket.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /managed
      backendRefs:
        - group: ""
          kind: Service
          name: gravitee-gateway-headless
          port: 8082
          weight: 1
