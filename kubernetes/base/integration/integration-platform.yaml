# Camel K IntegrationPlatform — WSO2-OSS-MAPPING §C · §9-3
#
# ★ 오퍼레이터는 ArgoCD 밖(오퍼레이터 계층, local/install-operators.sh)에 있고
#   **이 CR 만 ArgoCD 가 관리한다.** 오퍼레이터는 클러스터 설치물이고 이것은
#   플랫폼 설정이라 성질이 다르다 — ECK 오퍼레이터와 Elasticsearch CR 의
#   관계와 같다.
#
# ★★ 오늘 Integration 은 **0건**이다. 이 CR 은 "통합이 생기면 어디에 어떻게
#   빌드해 넣을지" 를 미리 정해 두는 것이다. 통합이 없어도 오퍼레이터가
#   이 CR 을 Ready 로 만들어야 정상이다 — 그것이 카탈로그 준비 완료 신호다.
apiVersion: camel.apache.org/v1
kind: IntegrationPlatform
metadata:
  name: camel-k
  labels:
    app.kubernetes.io/name: camel-k
    app.kubernetes.io/component: integration
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  build:
    # ★★★ Camel K 는 Integration 마다 **kit 이미지를 스스로 만들어 push** 한다.
    #   GitLab 레지스트리는 **실재하는 프로젝트 경로**만 받으므로(Gotcha 117)
    #   `oneinch/camel-k` 프로젝트를 미리 만들어 둔다
    #   (local/gitlab-registry-bootstrap.sh 의 EXTRA_PROJECTS).
    #   GitLab 은 프로젝트 아래의 중첩 경로를 허용하므로 kit 이미지가
    #   `oneinch/camel-k/camel-k-kit-...` 로 들어간다.
    #
    #   경로를 address 에 몰아넣지 않고 organization 으로 나눈다 — Camel K 가
    #   `<address>/<organization>/<image>` 로 조립한다.
    registry:
      address: gitlab-registry.local.svc.cluster.local:5050
      organization: oneinch/camel-k
      # ★ 평문 HTTP 다. 이 값을 빼면 TLS 로 붙으려다 실패한다.
      insecure: true
      # imagePullSecrets 와 같은 Secret 을 쓴다 — 배포 토큰이 회전하면
      # 양쪽이 함께 갱신된다(Gotcha 118).
      secret: gitlab-registry-secret

    # ★★ 동시 빌드를 1로 묶는다. 기본값대로 두면 빌드 파드가 여러 개
    #   동시에 뜨는데, 이 노드는 단일 노드이고 여유가 10 GiB 남짓이다.
    #   빌드는 Maven 의존성을 받아 이미지를 굽는 작업이라 순간 사용량이 크다.
    maxRunningBuilds: 1
    # ★★★ 기본 timeout 은 **5분이고 이 노드에서는 모자란다.**
    #   2026-09-11 실측(처음 만든 Integration):
    #     ContainerbuilderSucceeded True   ← Maven 빌드 성공
    #     ContainerpackageSucceeded True   ← 패키징 성공
    #     ContainerjibSucceeded    False: signal: killed
    #     failure: Builder Pod ... timeout / Build duration 정확히 5m0s
    #   즉 이미지 빌드(jib) 단계에서 끊긴 것이지 OOM 이 아니다.
    #   ★ 첫 빌드가 특히 긴 이유: 빌더 파드가 휘발성이라 **Maven 캐시가
    #     매번 비어 있다.** 지속 캐시(PVC)를 붙이기 전까지는 매 빌드가
    #     의존성을 다시 받는다 — 통합을 실제로 쓰기 시작하면 그것부터 볼 것.
    #   ★★ 증상이 모호하다 — 빌더 파드가 **재시작이 아니라 매번 새로
    #     생성**되므로(restartCount 0) "도는 중" 으로 보인다. 판정은 Build
    #     리소스의 `.status.conditions` 와 `failure.reason` 이다.
    timeout: 20m0s

    buildConfiguration:
      # ★★★ `pod` 로 명시한다. 기본값은 `routine` 이고 그것은 빌드를
      #   **오퍼레이터 프로세스 안에서** 돌린다 — 그러면 아래 request/limit 이
      #   적용되지 않고 오퍼레이터의 512Mi 안에서 Maven 빌드를 하게 되어
      #   첫 Integration 에서 OOM 이 난다.
      #   ★ 처음에 이 줄 없이 넣었더니 플랫폼이 Ready 인데 전략은 routine 이고
      #     limitMemory 는 저장만 된 채 쓰이지 않는 **스스로 모순인 상태**가
      #     됐다. Ready 를 성공으로 읽으면 놓친다(Gotcha 12 와 같은 부류).
      #   ★★ `pod` 면 빌드가 별도 파드로 격리되어 오퍼레이터가 함께 죽지 않고,
      #     축출 판단도 빌드 파드에만 걸린다.
      strategy: pod

      # 빌드 파드의 예산. 명시하지 않으면 BestEffort 가 되어
      # 노드가 압박받을 때 가장 먼저 축출된다(Gotcha 78 과 같은 이유).
      requestCPU: "200m"
      requestMemory: "512Mi"
      limitCPU: "2"
      # jib 은 레이어를 메모리에 들고 있다 — 1536Mi 로는 빠듯하다.
      limitMemory: "2Gi"
