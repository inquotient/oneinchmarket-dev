apiVersion: v1
kind: Secret
metadata:
  name: gitlab-secret
  labels:
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/component: devops
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
type: Opaque
stringData:
  # SOPS encrypted - values will be decrypted at deploy time
  db-password: ENC[AES256_GCM,data:PLACEHOLDER,type:str]
  root-password: ENC[AES256_GCM,data:PLACEHOLDER,type:str]
