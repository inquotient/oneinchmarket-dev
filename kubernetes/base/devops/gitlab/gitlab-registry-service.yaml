# GitLab 컨테이너 레지스트리 전용 Service
#
# ★ 왜 `gitlab-headless` 를 쓰지 않는가 — 그것은 headless(ClusterIP: None)라
#   **노드에서 안정적으로 가리킬 주소가 없다.** 이름은 파드 IP 로 풀리고
#   GitLab 이 재시작할 때마다 바뀐다. 이미지를 빌드해 push 하는 주체는
#   노드의 podman 이므로 고정 주소가 필요하다.
#
# ★ 왜 80 도 여는가 — 레지스트리 인증은 **두 단계**다. 클라이언트가 5050 에서
#   401 + `Www-Authenticate: Bearer realm=...` 을 받고, 그 realm 으로 토큰을
#   받으러 간다. realm 이 닿지 않으면 pull 이 실패하는데 오류는 5050 쪽에
#   나오므로 원인이 멀다. ConfigMap 의 `registry['token_realm']` 이 이
#   Service 이름을 가리키고 있어야 한다 — 짝이 어긋나면 조용히 깨진다.
#
# ★ 이 이름은 파드(CoreDNS)와 노드(/etc/hosts + ClusterIP) 양쪽에서 같은
#   곳으로 풀린다. 그래서 매니페스트의 이미지 참조를 한 벌만 쓰면 된다.
apiVersion: v1
kind: Service
metadata:
  name: gitlab-registry
  labels:
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/component: devops
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gitlab
  ports:
    # 토큰 realm(/jwt/auth). 레지스트리 인증의 2단계째다.
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: registry
      port: 5050
      targetPort: 5050
      protocol: TCP
