apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitlab
  labels:
    app.kubernetes.io/name: gitlab
    app.kubernetes.io/component: devops
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: gitlab-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gitlab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitlab
        app.kubernetes.io/component: devops
        app.kubernetes.io/part-of: oneinchmarket
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: gitlab
      securityContext:
        # GitLab EE Omnibus requires root for service initialization (chef/reconfigure)
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gitlab
          image: docker.io/gitlab/gitlab-ee:19.3.1-ee.0
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
            - name: https
              containerPort: 443
              protocol: TCP
            - name: ssh
              containerPort: 22
              protocol: TCP
            # 컨테이너 레지스트리(registry_nginx). ConfigMap 의
            # registry_external_url 과 짝이 맞아야 한다.
            - name: registry
              containerPort: 5050
              protocol: TCP
          envFrom:
            - configMapRef:
                name: gitlab-config
          env:
            - name: GITLAB_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-secret
                  key: db-password
            - name: GITLAB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gitlab-secret
                  key: root-password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-secret
                  key: redis-password
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              # ★ 4Gi -> 5Gi. 레지스트리를 켜기 전 실측이 이미 3332Mi 였다
              #   (registry + registry_nginx 가 더해진다). gitlab_kas 를 끈
              #   것으로 일부를 상쇄했으나 4Gi 로는 OOM 여지가 남는다.
              #   노드 여유 13Gi 기준의 판단이다 — §11-4 의 총량 산정에
              #   1Gi 를 더 얹는 셈이므로, 프로파일 분리(§19 ③)를 할 때
              #   GitLab 이 어느 프로파일에 가는지 함께 정할 것.
              memory: 5Gi
          securityContext:
            allowPrivilegeEscalation: true
            capabilities:
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - SETGID
                - SETUID
                - NET_BIND_SERVICE
                - SYS_CHROOT
                - KILL
          livenessProbe:
            httpGet:
              path: /-/liveness
              port: 80
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /-/readiness
              port: 80
            periodSeconds: 10
          startupProbe:
            tcpSocket:
              port: 80
            failureThreshold: 120
            periodSeconds: 10
          volumeMounts:
            - name: gitlab-data
              mountPath: /var/opt/gitlab
            # ★★ /etc/gitlab 을 반드시 함께 보존해야 한다.
            #   여기에 `gitlab-secrets.json` 이 있고 그 안의 `db_key_base` 가
            #   DB 에 저장된 암호값(배포 토큰·CI 변수·2FA)의 복호화 키다.
            #   보존하지 않으면 **파드가 뜰 때마다 새로 생성**되어
            #   그전에 발급한 토큰이 전부 조용히 무효가 된다.
            #   실측: 배포 토큰으로 레지스트리 로그인이 되던 것이 GitLab
            #   재시작 뒤 `invalid username/password` 가 됐다. DB 의 토큰은
            #   revoked=false·미만료 그대로라 **토큰 쪽을 보면 멀쩡해 보인다.**
            #   단서는 `stat /etc/gitlab/gitlab-secrets.json` 의 생성 시각이
            #   파드 기동 시각과 같다는 것뿐이다. 재시작 28회 동안 그랬다.
            - name: gitlab-etc
              mountPath: /etc/gitlab
  volumeClaimTemplates:
    # ★ volumeClaimTemplates 는 불변이다 — 항목을 추가하려면
    #   `kubectl delete sts --cascade=orphan` 후 재적용해야 한다(§8-72 ④).
    - metadata:
        name: gitlab-etc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
    - metadata:
        name: gitlab-data
      spec:
        accessModes:
          - ReadWriteOnce
        # 기본 StorageClass 에 기대지 않는다 — 로컬에 default 표시가 둘이다.
        storageClassName: standard
        resources:
          requests:
            storage: 50Gi
