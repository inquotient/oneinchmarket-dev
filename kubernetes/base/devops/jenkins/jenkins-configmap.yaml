apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-config
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: devops
    app.kubernetes.io/part-of: oneinchmarket
data:
  # ─────────────────────────────────────────────────────────────────────
  # ★ 설치 마법사를 끄되 **보안 영역을 반드시 함께 선언한다.**
  #   `runSetupWizard=false` 만 주면 인증 없는 Jenkins 가 된다 —
  #   도달 가능한 누구나 스크립트 콘솔로 임의 코드를 실행한다.
  #   아래 jenkins.yaml(JCasC)이 securityRealm 과 관리자 계정을 만든다.
  #   그래서 커스텀 이미지(oneinch/jenkins)가 필요했다 — 공식 이미지에는
  #   configuration-as-code 플러그인이 없다.
  # ─────────────────────────────────────────────────────────────────────
  JAVA_OPTS: >-
    -Djava.awt.headless=true
    -Djenkins.install.runSetupWizard=false
    -XX:MaxRAMPercentage=70
  JENKINS_SLAVE_AGENT_PORT: "50000"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: jenkins-casc
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: devops
    app.kubernetes.io/part-of: oneinchmarket
data:
  # JCasC 는 ${VAR} 를 **환경변수**에서 읽는다. 비밀번호는 Secret 에서
  # 환경변수로 주입되므로 이 ConfigMap 에 평문이 남지 않는다.
  jenkins.yaml: |
    jenkins:
      systemMessage: "OneinchMarket — 선언적으로 구성됨(JCasC). 수동 변경은 재시작 시 사라진다."
      numExecutors: 1
      # 빌드를 컨트롤러에서 돌리지 않는 것이 원칙이나, 에이전트가 아직 없다.
      # 에이전트를 붙이면 0 으로 내리고 mode 를 EXCLUSIVE 로 바꾼다.
      mode: NORMAL
      securityRealm:
        local:
          allowsSignup: false
          users:
            - id: "admin"
              name: "OneinchMarket Admin"
              password: "${JENKINS_ADMIN_PASSWORD}"
      # 로그인한 사용자만 조작할 수 있다. 익명 읽기도 막는다 —
      # Jenkins 는 익명 읽기만으로도 잡 이름·빌드 로그가 노출된다.
      authorizationStrategy:
        loggedInUsersCanDoAnything:
          allowAnonymousRead: false
      # JNLP 에이전트 프로토콜 보안. 에이전트가 생기기 전에 켜 둔다.
      remotingSecurity:
        enabled: true
      # 에이전트 포트를 고정한다(0=랜덤, -1=비활성).
      slaveAgentPort: 50000
    # ★ `security:` 블록을 넣지 않는다.
    #   `globalJobDslSecurityConfiguration` 을 넣었다가 기동이 죽었다:
    #     UnknownAttributesException: security: Invalid configuration elements
    #     for type: GlobalConfigurationCategory$Security : globalJobDslSecurityConfiguration
    #   그 항목은 job-dsl 플러그인이 제공하는데 설치하지 않았기 때문이다.
    #   **JCasC 는 모르는 속성을 만나면 무시하지 않고 기동을 중단시킨다** —
    #   조용히 틀리지 않는다는 점에서 올바른 동작이다. 플러그인을 추가할 때
    #   설정도 함께 넣을 것.
    unclassified:
      location:
        # 외부 진입점이 없다. 클러스터 내부 주소를 쓴다.
        # Ingress 를 붙이면 그 URL 로 바꿔야 이메일·webhook 링크가 맞는다.
        url: "http://jenkins-headless:8080/"
