apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jenkins
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: devops
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: jenkins-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jenkins
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jenkins
        app.kubernetes.io/component: devops
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: jenkins
      # ★ 이 이미지는 `docker/` 에서 로컬 빌드해 GitLab 레지스트리에 올린다.
      #   파드 자체는 이 시크릿 없이도 뜬다 — build-images.sh 가 containerd 에
      #   같은 이름으로 반입하고 imagePullPolicy 가 IfNotPresent 라 당기지
      #   않기 때문이다. 이 시크릿이 필요한 것은 **Trivy Operator** 다:
      #   스캔 Job 은 파드라 노드의 containerd 를 볼 수 없어 레지스트리에서
      #   직접 당기고, 그때 워크로드의 imagePullSecrets 를 자기 네임스페이스로
      #   복사해 쓴다. 없으면 스캔이 조용히 실패한다 — §8-79
      imagePullSecrets:
        - name: gitlab-registry-secret
      securityContext:
        # 이미지 실측: uid/gid 1000(jenkins), /var/jenkins_home 이 jenkins 소유.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jenkins
          # 로컬 빌드 이미지 — 공식 이미지에는 플러그인이 없어 JCasC 로
          # 관리자 계정을 선언할 수 없다(= 인증 없는 Jenkins). 상세는
          # docker/jenkins/Dockerfile 주석과 TODO-50.
          # 베이스는 `jenkins/jenkins:lts` 다 — latest 는 주간 릴리스다.
          image: gitlab-registry.local.svc.cluster.local:5050/oneinch/jenkins:2.568.3-lts
          # 레지스트리에 없다. containerd 로 직접 반입하므로 Always 면
          # ImagePullBackOff 가 난다(§8-2).
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 50000
              name: agent
              protocol: TCP
          env:
            # JCasC 의 ${JENKINS_ADMIN_PASSWORD} 가 이 값을 읽는다.
            # ConfigMap 에는 평문이 남지 않는다.
            - name: JENKINS_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: jenkins-secret, key: admin-password }
          envFrom:
            - configMapRef:
                name: jenkins-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          # 첫 기동은 플러그인 없이도 40~90초 걸린다(초기화 + 홈 디렉터리 구성).
          startupProbe:
            httpGet: { path: /login, port: http }
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
            # JENKINS_HOME 바깥에 둔다 — PVC 안에는 ConfigMap 을 겹쳐
            # 마운트할 수 없다. 이미지의 CASC_JENKINS_CONFIG 가 이 경로다.
            - name: casc
              mountPath: /var/jenkins_casc
              readOnly: true
      volumes:
        - name: casc
          configMap:
            name: jenkins-casc
  volumeClaimTemplates:
    - metadata:
        name: jenkins-home
      spec:
        accessModes:
          - ReadWriteOnce
        # 기본 StorageClass 에 기대지 않는다 — 로컬에 default 표시가 둘이다.
        storageClassName: standard
        resources:
          requests:
            storage: 10Gi
