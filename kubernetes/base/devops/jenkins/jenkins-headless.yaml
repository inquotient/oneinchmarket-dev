apiVersion: v1
kind: Service
metadata:
  name: jenkins-headless
  labels:
    app.kubernetes.io/name: jenkins
    app.kubernetes.io/component: devops
    app.kubernetes.io/part-of: oneinchmarket
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    # JNLP 인바운드 에이전트. 컨트롤러가 이 포트로 에이전트 접속을 받는다.
    - port: 50000
      targetPort: agent
      protocol: TCP
      name: agent
  selector:
    app.kubernetes.io/name: jenkins
