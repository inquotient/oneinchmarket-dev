apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: mongodb-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: mongodb
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          # ★ `latest` 가 가리키는 것은 8.3.x 가 아니라 **8.0 LTS** 다.
          #   지금 도는 것도 8.0.29-13 이므로 그대로 고정한다 —
          #   8.3 으로 올리는 것은 메이저 이동이라 별도 작업이다.
          image: docker.io/percona/percona-server-mongodb:8.0.29-13
          ports:
            - containerPort: 27017
              name: mongodb
              protocol: TCP
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: "mongoadmin"
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-secret
                  key: root-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: mongodb
            failureThreshold: 30
            periodSeconds: 10
          # ★ liveness 는 mongosh 를 쓰지 않는다.
          #   mongosh 는 Node.js CLI 라 기동만으로 수 초가 걸린다. CPU 가
          #   붐비면 timeoutSeconds: 5 를 넘겨 실패하고, liveness 실패는
          #   컨테이너를 죽인다 -> CrashLoop. 정작 mongod 는 멀쩡하다.
          #   (k3s 재시작 직후 CPU 가 몰려 실제로 9회 재시작했다.)
          #   살아있음은 포트로 판정한다. 질의 응답 여부는 readiness 가 보고,
          #   readiness 실패는 트래픽만 끊을 뿐 컨테이너를 죽이지 않는다.
          livenessProbe:
            tcpSocket:
              port: mongodb
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            periodSeconds: 30
            timeoutSeconds: 15
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 20Gi
