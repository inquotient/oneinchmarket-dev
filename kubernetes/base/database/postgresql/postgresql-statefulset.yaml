apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: postgresql-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgresql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: postgresql
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          # 공식 이미지. bitnami 는 2025-08 무료 카탈로그 축소로 버전 태그가
          # 사라져 재현 가능한 핀이 불가능해졌다.
          image: postgres:18.6
          # GitLab 은 structure.sql(6만 줄)을 단일 트랜잭션으로 적재한다.
          # 기본 max_locks_per_transaction=64 로는 out of shared memory 가 난다.
          # 공식 이미지에는 EXTRA_FLAGS 류 환경변수가 없어 args 로 넘긴다.
          #
          # 256 -> 512 (6단계) — GlitchTip 은 이벤트 테이블을 파티셔닝한다.
          # 파티션을 하나로 좁히지 못하는 질의는 **모든 파티션과 그 인덱스에
          # 락을 건다.** GlitchTip 설치 문서가 자체 호스팅에 512 를 권장하는
          # 이유이고, 이 값은 소비자 중 가장 큰 요구를 따라간다.
          args:
            - postgres
            - -c
            - max_locks_per_transaction=512
            # ★ 기본값 100 으로는 부족하다 — 실측으로 고갈됐다(§8-45).
            #
            #   소비자가 각자 커넥션 풀을 들고 유휴 연결을 붙든다:
            #     openreplay 27 · hive 24 · gitlab 24 · dependencytrack 10 · ranger 6
            #   합이 106/100 이 되어 superuser 예약 슬롯까지 잠식했고, 새로 뜨는
            #   파드가 이 오류로 CrashLoop 했다:
            #     FATAL: remaining connection slots are reserved for roles
            #            with the SUPERUSER attribute (SQLSTATE 53300)
            #
            #   106건 중 97건이 idle 이었다. 풀은 유휴 연결을 반납하지 않으므로
            #   시간이 지나도 저절로 풀리지 않는다 — 실제로 3분을 기다려도
            #   회복되지 않았고, 유휴 연결 76건을 끊고 나서야 풀렸다.
            #
            #   ★ 평상시에는 드러나지 않는다. 파드가 한꺼번에 재기동할 때만
            #     터진다 — 이번 방아쇠는 ambient 편입/철회였지만 원인은 그것이
            #     아니다. 노드 재부팅으로도 같은 일이 난다.
            #
            #   300 은 현재 소비 합(약 91)의 3배다. 연결마다 메모리를 쓰므로
            #   무한정 올리지 않는다 — 소비자가 늘면 다시 산정할 것.
            - -c
            - max_connections=300
          ports:
            - containerPort: 5432
              name: postgresql
              protocol: TCP
          env:
            # 공식 이미지 규약 — bitnami 의 POSTGRESQL_* 와 다르다.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgresql-secret
                  key: postgresql-password
            # PGDATA 는 마운트 지점 자체가 아니라 하위 디렉터리여야 한다.
            # lost+found 등이 있으면 initdb 가 거부한다.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - configMapRef:
                name: postgresql-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            tcpSocket:
              port: postgresql
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgresql
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U postgres -h 127.0.0.1 -p 5432
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: conf
              mountPath: /etc/postgresql
            - name: tmp
              mountPath: /var/run/postgresql
      volumes:
        - name: conf
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 20Gi
