apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  labels:
    app.kubernetes.io/name: mariadb
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: mariadb-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: mariadb
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mariadb
          # 공식 이미지. MARIADB_* 환경변수 규약은 bitnami 와 같으나
          # 데이터 경로(/var/lib/mysql)와 uid(999)가 다르다.
          image: docker.io/library/mariadb:12.3.3
          ports:
            - containerPort: 3306
              name: mariadb
              protocol: TCP
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: root-password
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: app-password
          envFrom:
            - configMapRef:
                name: mariadb-config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: mariadb
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mariadb
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                # ★ root 비밀번호를 쓰지 않는다(2026-11-06) — 로테이션이 root 를 바꾸면 Reloader 가 파드를
                #   다시 띄우기 전까지 이 프로브가 옛 값으로 실패해 DB 가 NotReady 로 빠졌다(ESO 가 늦으면 한 시간).
                #   이미지의 healthcheck.sh 는 초기화 때 만든 전용 사용자(datadir 의 .my-healthcheck.cnf)로 본다.
                - healthcheck.sh --connect --innodb_initialized
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            # ★ 이름이 `conf` 에서 바뀌었다 — 서버측 적용(SSA)은 볼륨
            #   리스트를 **이름을 키로** 병합한다. 같은 이름을 유지한 채 emptyDir 을
            #   configMap 으로 바꾸면 한 항목에 두 타입이 함께 들어가
            #   `may not specify more than 1 volume type` 으로 거부된다.
            #   실측으로 ArgoCD 동기화가 그 한 건에 막혔다 — 이름을 바꿔
            #   새 항목이 되게 하면 옛 항목은 그대로 사라진다.
            - name: mariadb-conf
              mountPath: /etc/mysql/conf.d
            - name: tmp
              mountPath: /var/run/mysqld
      volumes:
        # ★ emptyDir 였다 — 즉 설정 파일이 하나도 없었다.
        #   이젠 binlog 설정을 여기서 준다(Debezium 의 전제).
        - name: mariadb-conf
          configMap:
            name: mariadb-binlog-config
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 20Gi
