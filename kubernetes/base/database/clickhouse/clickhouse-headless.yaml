apiVersion: v1
kind: Service
metadata:
  name: clickhouse-headless
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oneinchmarket
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - { port: 8123, targetPort: http,   protocol: TCP, name: http }
    - { port: 9000, targetPort: native, protocol: TCP, name: native }
  selector:
    app.kubernetes.io/name: clickhouse
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
