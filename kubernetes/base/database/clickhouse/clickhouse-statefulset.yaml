apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: clickhouse-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: clickhouse
      securityContext:
        # 이미지 기본은 root 지만 entrypoint 가 uid 0 일 때만 chown 후 su-exec 한다.
        # 처음부터 101 로 띄우면 그 경로를 타지 않는다.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          # ★ 2026-11-08 에 26.8(LTS) → 26.10 으로 올렸다(사용자 결정 — 26.10 은 LTS 가 아니다.
          #   LTS 줄은 해마다 .3·.8 이다). 실제 데이터 디렉터리 사본(25 GB)을 26.8 → 26.10 으로 띄워
          #   표 44 동일 · SQL 사용자(openmeter·openreplay) 적재 · openmeter 17행 · seccomp·Exception 0 을
          #   확인했다. 26.10 의 비호환 목록(설정 제약을 SQL 사용자에 강제 · seccomp 필터 · 옛 분석기 제거)
          #   중 이 클러스터가 쓰는 것은 없었다. 백업은 노드 103 /root/backup/clickhouse-26.8-*.
          # ★ 데이터 보유 워크로드라 판 올리기는 과금 DAG 을 멈추고 백업한 뒤에 한다(Gotcha 222 ⑦).
          #   OpenReplay 가 번들하는 ClickHouse 는 별개 인스턴스이고 25.9-alpine 이다 — 같이 움직이지 않는다.
          image: docker.io/clickhouse/clickhouse-server:26.10
          ports:
            - { containerPort: 8123, name: http,   protocol: TCP }
            - { containerPort: 9000, name: native, protocol: TCP }
          env:
            - name: CLICKHOUSE_DB
              value: openreplay
            # ★★ 이 사용자는 **관리자 전용**이다(2026-11-07). 그 전에는 `openreplay` 가 관리자였고
            #   OpenReplay 앱이 그 자격으로 붙어 openmeter(과금) DB 까지 읽고 사용자를 만들 수 있었다.
            #   앱 사용자 openreplay·openmeter 는 SQL 사용자이고 clickhouse-bootstrap 이 만든다(권한을 DB 로 좁힌다).
            # ★ 이 값은 기동 때 엔트리포인트가 users.d/default-user.xml 로 굽는다 — 그래서 관리자 비밀번호를
            #   바꾸면 ClickHouse 가 재시작해야 한다(rotate-clickhouse-admin). 앱 비밀번호와 **다른 Secret** 에
            #   두는 이유다: 같은 Secret 이면 앱 비밀번호 회전에도 Reloader 가 ClickHouse 를 재시작한다.
            - name: CLICKHOUSE_USER
              value: oim_admin
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: clickhouse-admin-secret, key: password }
            # 기본 사용자를 비워 두면 인증 없이 붙을 수 있다. 명시적으로 막는다.
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet: { path: /ping, port: http }
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: config, mountPath: /etc/clickhouse-server/config.d/10-limits.xml, subPath: 10-limits.xml }
            - { name: config, mountPath: /etc/clickhouse-server/users.d/10-users.xml,  subPath: 10-users.xml }
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # 기본 StorageClass 에 기대지 않는다 — 로컬에 default 표시가 둘이다.
        storageClassName: standard
        resources:
          requests:
            storage: 20Gi
