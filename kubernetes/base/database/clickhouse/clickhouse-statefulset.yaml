apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: clickhouse-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: clickhouse
      securityContext:
        # 이미지 기본은 root 지만 entrypoint 가 uid 0 일 때만 chown 후 su-exec 한다.
        # 처음부터 101 로 띄우면 그 경로를 타지 않는다.
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          # ★ 지금 도는 버전(26.8.2.7)으로 고정한다. 데이터 보유 워크로드라
          #   최신으로 앞당기지 않는다. OpenReplay 가 번들하는 ClickHouse 는
          #   별개 인스턴스이고 25.9-alpine 이다 — 같이 움직이지 않는다.
          image: clickhouse/clickhouse-server:26.8
          ports:
            - { containerPort: 8123, name: http,   protocol: TCP }
            - { containerPort: 9000, name: native, protocol: TCP }
          env:
            - name: CLICKHOUSE_DB
              value: openreplay
            - name: CLICKHOUSE_USER
              value: openreplay
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: clickhouse-secret, key: password }
            # 기본 사용자를 비워 두면 인증 없이 붙을 수 있다. 명시적으로 막는다.
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet: { path: /ping, port: http }
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet: { path: /ping, port: http }
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/clickhouse }
            - { name: config, mountPath: /etc/clickhouse-server/config.d/10-limits.xml, subPath: 10-limits.xml }
            - { name: config, mountPath: /etc/clickhouse-server/users.d/10-users.xml,  subPath: 10-users.xml }
      volumes:
        - name: config
          configMap:
            name: clickhouse-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        # 기본 StorageClass 에 기대지 않는다 — 로컬에 default 표시가 둘이다.
        storageClassName: standard
        resources:
          requests:
            storage: 20Gi
