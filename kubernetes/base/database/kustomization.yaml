apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ClickHouse - OpenReplay 전용 (ADR-070). 범용 분석 저장소가 아니다.
  - clickhouse/clickhouse-configmap.yaml
  - clickhouse/clickhouse-headless.yaml
  - clickhouse/clickhouse-statefulset.yaml
  # PostgreSQL
  - postgresql/postgresql-statefulset.yaml
  - postgresql/postgresql-headless.yaml
  - postgresql/postgresql-configmap.yaml
  # - postgresql/postgresql-secret.enc.yaml  # SOPS: re-enable after ArgoCD SOPS plugin setup
  # MariaDB
  - mariadb/mariadb-statefulset.yaml
  - mariadb/mariadb-headless.yaml
  - mariadb/mariadb-configmap.yaml
  - mariadb/mariadb-binlog-configmap.yaml
  # - mariadb/mariadb-secret.enc.yaml  # SOPS: re-enable after ArgoCD SOPS plugin setup
  # MongoDB
  - mongodb/mongodb-statefulset.yaml
  - mongodb/mongodb-headless.yaml
  # - mongodb/mongodb-secret.enc.yaml  # SOPS: re-enable after ArgoCD SOPS plugin setup
  # Redis
  - redis/redis-statefulset.yaml
  - redis/redis-headless.yaml
  # ShardingSphere-Proxy — 관계형 DB 접근 계층 (§8-75).
  # ★ 지금은 소비자가 없다. 기존 postgresql-headless 와 나란히 선다.
  - shardingsphere/shardingsphere-configmap.yaml
  - shardingsphere/shardingsphere-deployment.yaml
  # ProxySQL — MySQL/MariaDB 와이어 (§8-76). ShardingSphere 와 상보 관계다:
  # 인스턴스당 프로토콜이 하나라 PostgreSQL 은 저쪽, MySQL 은 이쪽이 맡는다.
  - proxysql/proxysql-configmap.yaml
  - proxysql/proxysql-deployment.yaml
  # - redis/redis-secret.enc.yaml  # SOPS: re-enable after ArgoCD SOPS plugin setup

commonLabels:
  app.kubernetes.io/part-of: oneinchmarket

commonAnnotations:
  argocd.argoproj.io/sync-wave: "1"
