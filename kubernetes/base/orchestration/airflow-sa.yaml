# Airflow 의 신원.
#
# ★★ SA 를 **셋**으로 나눈 이유는 권한 경계가 셋이기 때문이다(Gotcha 10 —
#   ambient 에서 SA 가 곧 신원이다). 하나로 묶으면 api-server 에게도
#   쿠버네티스 Job 생성 권한이 가는데, 그 파드는 인터넷 쪽 UI 다.
#
#   airflow            api-server · dag-processor · triggerer
#                      → PostgreSQL 5432 만 있으면 된다
#   airflow-scheduler  scheduler (LocalExecutor 라 **태스크가 여기서 돈다**)
#                      → PostgreSQL + 아래 Role(과금 Job 생성)
#   airflow-bootstrap  db-migrate Job — Gotcha 19 의 그 자리다.
#                      `default` 로 두면 ztunnel 이 막아 무한 대기한다
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-scheduler
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: airflow-bootstrap
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
---
# ★ 범위를 좁게 잡는다 — DAG 이 하는 일은 "CronJob 의 jobTemplate 을 읽어
#   Job 을 만들고 그 결과를 본다" 뿐이다. CronJob 을 **고칠** 권한은 주지
#   않는다(suspend 는 사람이 한다 — DAG 이 자기 가드를 스스로 풀 수 있으면
#   그 가드는 가드가 아니다).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: airflow-scheduler
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "create"]
  - apiGroups: ["batch"]
    resources: ["jobs/status"]
    verbs: ["get"]
  # 실패한 Job 의 로그를 태스크 오류에 담기 위해서다 — 담지 않으면
  # "실패했다" 만 남고 무엇이 실패했는지는 다시 찾아야 한다(Gotcha 32).
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: airflow-scheduler
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: airflow-scheduler
subjects:
  - kind: ServiceAccount
    name: airflow-scheduler
