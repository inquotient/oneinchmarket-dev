# Airflow api-server — UI 와 REST API(8080).
#
# ★ Airflow 3 에서 `webserver` 는 없어졌다 — `api-server` 가 UI 까지 낸다
#   (실측: 하위 명령 목록에 webserver 가 없다).
# ★★ 게이트웨이 경로에 두지 않는다 — port-forward 전용이다. Temporal UI ·
#   Backstage 와 같은 취급이고, 다만 이쪽은 **인증이 있다**(FAB).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-apiserver
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # ★ 이 노드에서 기본 maxSurge 는 무중단이 아니라 교착이다(Gotcha 87).
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: airflow
      app.kubernetes.io/instance: apiserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow
        app.kubernetes.io/instance: apiserver
        app.kubernetes.io/component: orchestration
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: airflow
      securityContext:
        runAsNonRoot: true
        runAsUser: 50000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # ★ `-L` 로 링크를 따라가 **파일 내용**을 복사한다. 그냥 `-r` 이면
        #   `..data` 링크까지 옮겨져 같은 문제가 따라온다.
        #   그리고 하나도 못 옮겼으면 **기동을 거부한다** — 조용한 빈 폴더보다
        #   시끄러운 실패가 낫다(Gotcha 86).
        - name: copy-dags
          image: docker.io/apache/airflow:3.3.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -Eeuo pipefail
              cp -L /dags-src/*.py /opt/airflow/dags/
              n=$(ls -1 /opt/airflow/dags/*.py 2>/dev/null | wc -l)
              echo "[copy-dags] ${n} 개"
              [ "$n" -ge 1 ] || { echo '[copy-dags] DAG 이 0개다' >&2; exit 1; }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: dags-src, mountPath: /dags-src, readOnly: true }
            - { name: dagbag, mountPath: /opt/airflow/dags }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
      containers:
        - name: apiserver
          image: docker.io/apache/airflow:3.3.1
          imagePullPolicy: IfNotPresent
          args: ["api-server"]
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: airflow-env }
          env:
            - name: AIRFLOW_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: airflow-secret, key: db-password }
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD
              # ★★★ `sh -c` 로 감싸야 한다. Airflow 의 `_CMD` 변종은
              #   `shlex.split()` + `Popen`(셀 없음)으로 돌리므로, 그냥 `printf ... "$VAR"`
              #   를 주면 **`$VAR` 가 리터럴로 printf 에 넘어간다.** 즉 비밀번호
              #   자리에 `$AIRFLOW_DB_PASSWORD` 라는 글자가 들어간다 — 주소와
              #   사용자는 맞아서 오류가 `password authentication failed` 로 나오고,
              #   그러면 Secret 과 롤 비밀번호를 의심하게 된다(둘 다 멀줦하다).
              #   실측으로 이것을 한 번 밟았다 — Gotcha 151.
              value: >-
                sh -c 'printf "postgresql+psycopg2://airflow:%s@postgresql-headless:5432/airflow" "$AIRFLOW_DB_PASSWORD"'
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef: { name: airflow-secret, key: fernet-key }
            - name: AIRFLOW__API__SECRET_KEY
              valueFrom:
                secretKeyRef: { name: airflow-secret, key: api-secret-key }
            - name: AIRFLOW__API_AUTH__JWT_SECRET
              valueFrom:
                secretKeyRef: { name: airflow-secret, key: jwt-secret }
          # ★ 스키마가 서기 전에는 뜨지 않는다 — db-migrate 훅이 먼저 돈다.
          #   startupProbe 를 넉넉히 주어 그 사이를 견딘다.
          startupProbe:
            httpGet: { path: /api/v2/monitor/health, port: 8080 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /api/v2/monitor/health, port: 8080 }
            periodSeconds: 15
          # ★ `/health` 를 쓰지 말 것 — 라우트 목록에는 보이는데
          #   실제로 치면 **404** 다(실측). 그것을 liveness 로 두면
          #   api-server 가 멀줦한데도 죽고 다시 뜨기를 반복한다.
          #   `/api/v2/monitor/health` 는 **인증 없이 200** 이다(실측).
          livenessProbe:
            httpGet: { path: /api/v2/monitor/health, port: 8080 }
            periodSeconds: 30
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: dagbag, mountPath: /opt/airflow/dags, readOnly: true }
            - { name: logs, mountPath: /opt/airflow/logs }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits:   { cpu: 1000m, memory: 1Gi }
      volumes:
        # ★★★ ConfigMap 을 DAG 폴더로 **직접 마운트하지 말 것.**
        #   ConfigMap 볼륨은 `..data -> ..<타임스탬프>` 심볼릭 링크 구조를
        #   만드는데, Airflow 3 의 디렉터리 순회가 같은 실디렉터리를 두 번
        #   보고 **재귀 루프로 판정해 죽는다**(실측:
        #   `RuntimeError: Detected recursive loop when walking DAG directory`).
        #   그래서 ConfigMap 은 옆(`/dags-src`)에 두고 initContainer 가
        #   emptyDir 로 **복사**한다 — Gotcha 153.
        - name: dags-src
          configMap: { name: airflow-dags }
        # ★★ 이름이 `dags` 가 아니라 `dagbag` 인 것은 실수가 아니다 —
        #   서버측 적용(SSA)은 볼륨 리스트를 **이름으로 병합**해서, 같은
        #   이름에서 configMap -> emptyDir 로 타입을 바꾸면 한 항목에 두
        #   타입이 들어가 `may not specify more than 1 volume type` 으로
        #   거부된다. git 의 매니페스트는 멀쩡한데 적용만 실패한다.
        #   처방은 **새 이름을 쓰는 것**이다 — Gotcha 113.
        - name: dagbag
          emptyDir: {}
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: airflow-apiserver
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/instance: apiserver
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
