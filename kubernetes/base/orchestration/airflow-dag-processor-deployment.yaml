# Airflow dag-processor — DAG 파일을 파싱해 메타데이터 DB 에 올린다.
#
# ★ Airflow 3 에서는 **항상 독립 프로세스**다 — 2.x 의
#   `scheduler.standalone_dag_processor` 스위치는 3.3 에 아예 없다(실측:
#   그 키를 물으면 warning 이 난다). 즉 이 파드가 없으면 DAG 이 영원히
#   나타나지 않는데, 스케줄러는 멀쩡히 돌고 오류도 없다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-dag-processor
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: airflow
      app.kubernetes.io/instance: dag_processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow
        app.kubernetes.io/instance: dag_processor
        app.kubernetes.io/component: orchestration
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: airflow
      securityContext:
        runAsNonRoot: true
        runAsUser: 50000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # ★ `-L` 로 링크를 따라가 **파일 내용**을 복사한다. 그냥 `-r` 이면
        #   `..data` 링크까지 옮겨져 같은 문제가 따라온다.
        #   그리고 하나도 못 옮겼으면 **기동을 거부한다** — 조용한 빈 폴더보다
        #   시끄러운 실패가 낫다(Gotcha 86).
        - name: copy-dags
          image: docker.io/apache/airflow:3.3.1
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -Eeuo pipefail
              cp -L /dags-src/*.py /opt/airflow/dags/
              n=$(ls -1 /opt/airflow/dags/*.py 2>/dev/null | wc -l)
              echo "[copy-dags] ${n} 개"
              [ "$n" -ge 1 ] || { echo '[copy-dags] DAG 이 0개다' >&2; exit 1; }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: dags-src, mountPath: /dags-src, readOnly: true }
            - { name: dags, mountPath: /opt/airflow/dags }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
      containers:
        - name: dag-processor
          image: docker.io/apache/airflow:3.3.1
          imagePullPolicy: IfNotPresent
          args: ["dag-processor"]
          envFrom:
            - configMapRef: { name: airflow-env }
          env:
            - name: AIRFLOW_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: airflow-secret, key: db-password }
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD
              # ★★★ `sh -c` 로 감싸야 한다. Airflow 의 `_CMD` 변종은
              #   `shlex.split()` + `Popen`(셀 없음)으로 돌리므로, 그냥 `printf ... "$VAR"`
              #   를 주면 **`$VAR` 가 리터럴로 printf 에 넘어간다.** 즉 비밀번호
              #   자리에 `$AIRFLOW_DB_PASSWORD` 라는 글자가 들어간다 — 주소와
              #   사용자는 맞아서 오류가 `password authentication failed` 로 나오고,
              #   그러면 Secret 과 롤 비밀번호를 의심하게 된다(둘 다 멀줦하다).
              #   실측으로 이것을 한 번 밟았다 — Gotcha 151.
              value: >-
                sh -c 'printf "postgresql+psycopg2://airflow:%s@postgresql-headless:5432/airflow" "$AIRFLOW_DB_PASSWORD"'
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef: { name: airflow-secret, key: fernet-key }
            - name: AIRFLOW__API__SECRET_KEY
              valueFrom:
                secretKeyRef: { name: airflow-secret, key: api-secret-key }
            - name: AIRFLOW__API_AUTH__JWT_SECRET
              valueFrom:
                secretKeyRef: { name: airflow-secret, key: jwt-secret }
          # ★★ exec 프로브에 `timeoutSeconds` 를 주지 않으면 **기본값이 1초**다.
          #   `airflow` CLI 는 파이썬 프레임워크를 통째 임포트해
          #   실측 **3.1초**가 걸린다(`airflow version` 만 해도 2.6초).
          #   그래서 검사는 rc=0 으로 **성공하는데** kubelet 이 1초에 잘라
          #   startupProbe 가 영원히 통과하지 못하고 컨테이너가 죽는다.
          #   ★ 증상이 고약하다 — **로그는 멀줦하다**(스케줄러는 워커를 띄우고
          #     triggerer 는 서버를 띄운다). 단서는 이벤트의
          #     `Startup probe failed: command timed out ... after 1s` 뿐이다 — Gotcha 152.
          startupProbe:
            exec:
              command: ["airflow", "jobs", "check", "--job-type", "DagProcessorJob", "--local"]
            timeoutSeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["airflow", "jobs", "check", "--job-type", "DagProcessorJob", "--local"]
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: dags, mountPath: /opt/airflow/dags, readOnly: true }
            - { name: logs, mountPath: /opt/airflow/logs }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 640Mi }
      volumes:
        # ★★★ ConfigMap 을 DAG 폴더로 **직접 마운트하지 말 것.**
        #   ConfigMap 볼륨은 `..data -> ..<타임스탬프>` 심볼릭 링크 구조를
        #   만드는데, Airflow 3 의 디렉터리 순회가 같은 실디렉터리를 두 번
        #   보고 **재귀 루프로 판정해 죽는다**(실측:
        #   `RuntimeError: Detected recursive loop when walking DAG directory`).
        #   그래서 ConfigMap 은 옆(`/dags-src`)에 두고 initContainer 가
        #   emptyDir 로 **복사**한다 — Gotcha 153.
        - name: dags-src
          configMap: { name: airflow-dags }
        - name: dags
          emptyDir: {}
        - name: logs
          emptyDir: {}
