# Airflow triggerer — deferrable 오퍼레이터의 대기를 대신 맡는다.
#
# ★ 지금 DAG 은 deferrable 을 쓰지 않는다. 그래도 두는 이유는 **없을 때의
#   증상이 나쁘기 때문**이다 — deferred 로 넘어간 태스크가 아무도 깨우지
#   않아 영원히 멈추고, 로그에는 실패가 남지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: airflow-triggerer
  labels:
    app.kubernetes.io/name: airflow
    app.kubernetes.io/component: orchestration
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: airflow
      app.kubernetes.io/instance: triggerer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: airflow
        app.kubernetes.io/instance: triggerer
        app.kubernetes.io/component: orchestration
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: airflow
      securityContext:
        runAsNonRoot: true
        runAsUser: 50000
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: triggerer
          image: docker.io/apache/airflow:3.3.1
          imagePullPolicy: IfNotPresent
          args: ["triggerer"]
          envFrom:
            - configMapRef: { name: airflow-env }
          env:
            - name: AIRFLOW_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: airflow-secret, key: db-password }
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_CMD
              # ★★★ `sh -c` 로 감싸야 한다. Airflow 의 `_CMD` 변종은
              #   `shlex.split()` + `Popen`(셀 없음)으로 돌리므로, 그냥 `printf ... "$VAR"`
              #   를 주면 **`$VAR` 가 리터럴로 printf 에 넘어간다.** 즉 비밀번호
              #   자리에 `$AIRFLOW_DB_PASSWORD` 라는 글자가 들어간다 — 주소와
              #   사용자는 맞아서 오류가 `password authentication failed` 로 나오고,
              #   그러면 Secret 과 롤 비밀번호를 의심하게 된다(둘 다 멀줦하다).
              #   실측으로 이것을 한 번 밟았다 — Gotcha 151.
              value: >-
                sh -c 'printf "postgresql+psycopg2://airflow:%s@postgresql-headless:5432/airflow" "$AIRFLOW_DB_PASSWORD"'
            - name: AIRFLOW__CORE__FERNET_KEY
              valueFrom:
                secretKeyRef: { name: airflow-secret, key: fernet-key }
            - name: AIRFLOW__API__SECRET_KEY
              valueFrom:
                secretKeyRef: { name: airflow-secret, key: api-secret-key }
            - name: AIRFLOW__API_AUTH__JWT_SECRET
              valueFrom:
                secretKeyRef: { name: airflow-secret, key: jwt-secret }
          startupProbe:
            exec:
              command: ["airflow", "jobs", "check", "--job-type", "TriggererJob", "--local"]
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["airflow", "jobs", "check", "--job-type", "TriggererJob", "--local"]
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: dags, mountPath: /opt/airflow/dags, readOnly: true }
            - { name: logs, mountPath: /opt/airflow/logs }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 1000m, memory: 512Mi }
      volumes:
        - name: dags
          configMap: { name: airflow-dags }
        - name: logs
          emptyDir: {}
