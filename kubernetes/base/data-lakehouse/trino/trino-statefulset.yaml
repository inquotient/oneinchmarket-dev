apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trino
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: trino-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trino
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trino
        app.kubernetes.io/component: data-lakehouse
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trino
          image: trinodb/trino:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /v1/info
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/info
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /v1/info
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: trino-config
              mountPath: /etc/trino
      volumes:
        - name: trino-config
          configMap:
            name: trino-config
            items:
              - key: config.properties
                path: config.properties
              - key: jvm.config
                path: jvm.config
              - key: node.properties
                path: node.properties
              - key: log.properties
                path: log.properties
              - key: catalog-iceberg.properties
                path: catalog/iceberg.properties
              - key: catalog-hive.properties
                path: catalog/hive.properties
