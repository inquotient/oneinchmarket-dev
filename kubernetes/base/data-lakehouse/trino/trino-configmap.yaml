apiVersion: v1
kind: ConfigMap
metadata:
  name: trino-config
  labels:
    app.kubernetes.io/name: trino
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
data:
  # ★★★ `http-server.process-forwarded=true` 가 없으면 **게이트웨이 뒤에서
  #   Trino 를 쓸 수 없다.** Istio 게이트웨이는 `X-Forwarded-For`·
  #   `X-Forwarded-Proto` 를 붙이는데, Trino 는 기본적으로 그 헤더를 **거부**하고
  #   모든 요청에 406 을 돌려준다:
  #     {"message":"Server configuration does not allow processing of the
  #      X-Forwarded-For header","status":"406"}
  #   ★ 증상이 원인을 가리키지 않는다 — 406 Not Acceptable 은 보통
  #     Accept 헤더 문제로 읽히고, 실제로 `Accept: application/json` 을
  #     붙여 봐도 그대로 406 이다. 진짜 단서는 **본문**이다.
  #   ★★ 이것을 켜면 Trino 가 그 헤더를 신뢰해 클라이언트 주소·스킴을 그것으로
  #     읽는다. 즉 **게이트웨이만이 Trino 에 닿을 수 있어야** 의미가 있다 —
  #     이 클러스터는 `default-deny-ingress` + HBONE 이라 그 전제가 성립한다.
  #     메시 밖에서 직접 닿을 수 있는 배치에서는 켜지 말 것(주소 위조가 된다).
  config.properties: |
    coordinator=true
    node-scheduler.include-coordinator=true
    http-server.http.port=8080
    discovery.uri=http://localhost:8080
    http-server.process-forwarded=true
  # ★★ -Xmx 를 limit 과 같게 두지 말 것 — 2G == limit 2Gi 였다.
  #   Trino 는 off-heap(네이티브 S3·버퍼)을 크게 쓰므로 힙이 다 차기 전에
  #   커널이 먼저 OOMKill 한다. 실사용은 859Mi 다(§8-94).
  # ★ RAMPercentage 두 줄은 지웠다 — -Xmx 가 있으면 **무시되는 값**인데
  #   남아 있으면 "80% 로 맞춰 두었다" 로 읽혀 다음 사람이 limit 만 바꾸고
  #   힙이 따라올 거라 착각한다. 그리고 퍼센트 기반은 JDK 가 컨테이너를 못
  #   읽는 순간 통째로 무너진다 — 이 클러스터에 실제 사례가 있다(livy).
  # ★ jvm.config 는 리터럴 블록이라 그 안의 # 는 YAML 주석이 아니라
  #   JVM 인자로 넘어간다. 설명은 반드시 블록 밖에 둘 것.
  jvm.config: |
    -server
    -Xmx1400m
    -XX:+ExplicitGCInvokesConcurrent
    -XX:+UseG1GC
    -XX:G1HeapRegionSize=32M
    -XX:+HeapDumpOnOutOfMemoryError
    -XX:+ExitOnOutOfMemoryError
    -Djdk.attach.allowAttachSelf=true
  node.properties: |
    node.environment=dev
    node.data-dir=/data/trino
  log.properties: |
    io.trino=INFO
  catalog-iceberg.properties: |
    connector.name=iceberg
    iceberg.catalog.type=hive_metastore
    hive.metastore.uri=thrift://hive-metastore-headless:9083
    fs.native-s3.enabled=true
    s3.endpoint=http://minio-headless:9000
    s3.path-style-access=true
    s3.region=us-east-1
    s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
    s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
    iceberg.file-format=PARQUET
  catalog-hive.properties: |
    connector.name=hive
    hive.metastore.uri=thrift://hive-metastore-headless:9083
    fs.native-s3.enabled=true
    s3.endpoint=http://minio-headless:9000
    s3.path-style-access=true
    s3.region=us-east-1
    s3.aws-access-key=${ENV:MINIO_ACCESS_KEY}
    s3.aws-secret-key=${ENV:MINIO_SECRET_KEY}
