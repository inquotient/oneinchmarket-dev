apiVersion: v1
kind: ConfigMap
metadata:
  name: livy-config
  labels:
    app.kubernetes.io/name: livy
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
data:
  livy.conf: |
    # Livy master(1.0.0-SNAPSHOT, 소스 빌드 · docker/livy) · Spark 4.2.1 on Kubernetes (LIVY-702)
    livy.server.host                     = 0.0.0.0
    livy.server.port                     = 8998
    livy.spark.master                    = k8s://https://kubernetes.default.svc.cluster.local:443
    livy.spark.deploy-mode               = cluster

    # ── 세션 폭주 통제 (G40)
    # Livy 는 세션마다 별도 driver 파드를 띄운다. 세션 1개 = driver 1Gi + executor N×2Gi.
    # 로컬 64GB 예산에서는 상한을 반드시 건다.
    livy.server.session.max-creation     = 3
    livy.server.session.timeout          = 1h
    livy.server.session.timeout-check    = true
    livy.server.session.state-retain.sec = 600

    # ── 재시작 시 세션 복구
    #
    # ★ s3a 는 쓸 수 없다. Livy 의 FileSystemStateStore 는 Hadoop 의
    #   FileContext(AbstractFileSystem) API 를 쓰는데, s3a 의 AbstractFileSystem
    #   구현(org.apache.hadoop.fs.s3a.S3A)은 Hadoop 2.8+ 에서 추가되었고
    #   oneinch/livy 이미지의 하둡 클라이언트는 2.7.3 이다. 결과:
    #     UnsupportedFileSystemException: fs.AbstractFileSystem.s3a.impl=null
    #   Livy 가 StateStore.init 에서 죽어 8998 을 아예 열지 못한다.
    #   -> 이미지의 하둡 클라이언트를 3.x 로 올리기 전까지 로컬 경로를 쓴다
    #      (TODO-37 이미지 재빌드 시 재검토).
    #   emptyDir 이므로 컨테이너 재시작은 견디고 파드 삭제에는 잃는다.
    #   레플리카가 1이라 공유 스토어 요구는 없다.
    livy.server.recovery.mode                = recovery
    livy.server.recovery.state-store          = filesystem
    livy.server.recovery.state-store.url      = file:///opt/livy/recovery

    livy.repl.enable-hive-context        = true
    livy.file.local-dir-whitelist        = /opt/spark/jobs

    # 인증은 앞단 oauth2-proxy(Keycloak OIDC)가 담당한다.
    # Livy 자체는 SPNEGO/Kerberos 만 네이티브 지원하므로 사용하지 않는다.
    #
    # ★ `livy.server.auth.type =` 로 빈 값을 두면 안 된다. Livy 는 이 키가
    #   null 인지만 보는데 빈 문자열은 null 이 아니다. 그래서 빈 타입으로
    #   인증을 켜고 `livy.server.auth..class` 를 요구하며 죽는다:
    #     IllegalArgumentException: requirement failed:
    #       auth requires livy.server.auth..class to be provided
    #   끄려면 키를 아예 두지 않아야 한다.

    # ── Spark 로 전달되는 설정
    # ★★★ **`livy.spark.*` 가 `spark.*` 로 전달된다는 이 절의 옛 제목은 틀렸다**(2026-11-06 실측).
    #   Livy 가 알아보는 것은 livy.spark.master · livy.spark.deploy-mode 정도이고 나머지
    #   `livy.spark.<키>` 는 **조용히 무시된다** — 업로드 경로를 여기 넣었더니 spark-submit 이
    #   똑같이 `Please specify spark.kubernetes.file.upload.path` 로 죽었다. 실제로 spark-submit 이
    #   읽는 것은 /opt/spark/conf/spark-defaults.conf(spark-config)다. 아래 키들은 그 파일과
    #   같은 값이어야 혼동이 없다 — 바꿀 때는 spark-defaults 를 고칠 것.
    # ★ 이미지는 노드 containerd 에 **실제로 있는 이름**이어야 한다(2026-11-06). 예전 값
    #   `oneinch/spark-iceberg:latest` 는 docker.io 로 풀리는데 그런 이미지는 없다 — 반입본은
    #   build-images.sh 가 넣는 FQDN · 버전 태그다(Gotcha 85 · §8-72).
    livy.spark.kubernetes.container.image                             = gitlab-registry.local.svc.cluster.local:5050/oneinch/spark-iceberg:4.2.1-ice-ac42e6f
    # ★★ 업로드 경로(spark.kubernetes.file.upload.path)는 여기가 아니라 spark-defaults.conf 에 있다
    #   (spark-defaults-configmap.yaml) — 아래 ★★★ 참조.
    livy.spark.kubernetes.authenticate.driver.serviceAccountName      = spark-driver
    livy.spark.kubernetes.driver.podTemplateFile                      = /opt/spark/conf/driver-pod-template.yaml
    livy.spark.kubernetes.executor.podTemplateFile                    = /opt/spark/conf/executor-pod-template.yaml
    livy.spark.dynamicAllocation.enabled                              = true
    livy.spark.dynamicAllocation.minExecutors                         = 0
    livy.spark.dynamicAllocation.maxExecutors                         = 2

    # [검증 필요] Livy 0.9.0 의 Kubernetes 전용 튜닝 키
    # (앱 조회 타임아웃·UI 프록시 등)는 릴리스 문서와 대조 후 추가한다.

  # ★ 2026-11-09 Livy master 는 log4j2 다(LIVY-1090: log4j-slf4j2-impl). 옛 log4j.properties 는 읽히지 않는다 —
  #   파일 이름도 형식도 다르다(conf/log4j2.properties.template 를 따랐다).
  log4j2.properties: |
    rootLogger.level = info
    rootLogger.appenderRef.stdout.ref = console
    appender.console.type = Console
    appender.console.name = console
    appender.console.target = SYSTEM_OUT
    appender.console.layout.type = PatternLayout
    appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n
    logger.livy.name = org.apache.livy
    logger.livy.level = info
