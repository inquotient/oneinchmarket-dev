apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: livy
  labels:
    app.kubernetes.io/name: livy
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: livy-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: livy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: livy
        app.kubernetes.io/component: data-lakehouse
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: livy
      # ★ 이 이미지는 `docker/` 에서 로컬 빌드해 GitLab 레지스트리에 올린다.
      #   파드 자체는 이 시크릿 없이도 뜬다 — build-images.sh 가 containerd 에
      #   같은 이름으로 반입하고 imagePullPolicy 가 IfNotPresent 라 당기지
      #   않기 때문이다. 이 시크릿이 필요한 것은 **Trivy Operator** 다:
      #   스캔 Job 은 파드라 노드의 containerd 를 볼 수 없어 레지스트리에서
      #   직접 당기고, 그때 워크로드의 imagePullSecrets 를 자기 네임스페이스로
      #   복사해 쓴다. 없으면 스캔이 조용히 실패한다 — §8-79
      imagePullSecrets:
        - name: gitlab-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: livy
          image: gitlab-registry.local.svc.cluster.local:5050/oneinch/livy:0.9.0-incubating
          # 레지스트리에 없는 로컬 빌드 이미지다(local/build-images.sh).
          # 버전 태그면 기본 정책이 IfNotPresent 지만, 반입 이미지를 쓰는 것이
          # 이 워크로드의 전제이므로 명시해 둔다.
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8998
              name: http
              protocol: TCP
          env:
            # ★★ 힙을 반드시 명시할 것 — 이 이미지의 JDK 는 11 이고 cgroup v2 의
            #   `0::/` 를 읽지 못한다. UseContainerSupport 가 true 인데도
            #   MaxRAM 을 **호스트 43 GiB** 로 보고 MaxHeapSize 를 10.78 GiB
            #   (25%)로 잡았다 — limit 이 1 GiB 인 컨테이너 안에서다.
            #   즉 JVM 은 GC 를 서두를 이유가 없고, 커널이 먼저 OOMKill 한다.
            #   같은 노드의 trino(JDK 25)는 2 GiB 를 정확히 읽었다(§8-94).
            #   ★ livy-server 스크립트는 이 값에 `+=` 로 --add-opens 만 덧붙이고
            #     -Xmx 를 다시 넣지 않으므로 여기 값이 최종이다.
            - name: LIVY_SERVER_JAVA_OPTS
              value: "-Xmx640m -Xms256m"      # limit 1Gi 의 63%
            - name: LIVY_CONF_DIR
              value: /opt/livy/conf
            - name: SPARK_HOME
              value: /opt/spark
            - name: SPARK_CONF_DIR
              value: /opt/spark/conf
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 300m
              memory: 768Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /sessions
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /sessions
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /sessions
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: livy-config
              mountPath: /opt/livy/conf
            - name: spark-config
              mountPath: /opt/spark/conf
            # 세션 복구 스토어. livy-configmap 의 주석 참조.
            - name: recovery
              mountPath: /opt/livy/recovery
      volumes:
        - name: recovery
          emptyDir: {}
        - name: livy-config
          configMap:
            name: livy-config
        - name: spark-config
          configMap:
            name: spark-config
            items:
              - key: spark-defaults.conf
                path: spark-defaults.conf
              - key: driver-pod-template.yaml
                path: driver-pod-template.yaml
              - key: executor-pod-template.yaml
                path: executor-pod-template.yaml
