apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # MinIO - Object Storage
  - minio/minio-statefulset.yaml
  - minio/minio-headless.yaml
  - minio/minio-secret.enc.yaml
  # Trino - Query Engine
  - trino/trino-statefulset.yaml
  - trino/trino-headless.yaml
  - trino/trino-configmap.yaml
  # Hive Metastore - Metadata Service
  - hive-metastore/hive-metastore-statefulset.yaml
  - hive-metastore/hive-metastore-headless.yaml
  - hive-metastore/hive-metastore-configmap.yaml
  - hive-metastore/hive-metastore-secret.enc.yaml

commonLabels:
  app.kubernetes.io/part-of: oneinchmarket

commonAnnotations:
  argocd.argoproj.io/sync-wave: "3"
