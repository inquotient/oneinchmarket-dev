apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spark-connect
  labels:
    app.kubernetes.io/name: spark-connect
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: spark-connect-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-connect
        app.kubernetes.io/component: data-lakehouse
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: spark-connect
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spark-connect
          image: oneinch/spark-iceberg:latest
          # Connect Server 자체가 driver 역할을 하므로 client 모드로 뜬다.
          command: ["/opt/spark/bin/spark-submit"]
          args:
            - "--class"
            - "org.apache.spark.sql.connect.service.SparkConnectServer"
            - "--conf"
            - "spark.connect.grpc.binding.port=15002"
            - "--conf"
            - "spark.submit.deployMode=client"
            - "--conf"
            - "spark.driver.host=$(POD_IP)"
            - "--conf"
            - "spark.driver.port=7078"
            - "--conf"
            - "spark.driver.blockManager.port=7079"
            - "--conf"
            - "spark.kubernetes.namespace=$(POD_NAMESPACE)"
            - "--name"
            - "spark-connect"
            - "spark-internal"
          ports:
            - containerPort: 15002
              name: grpc
              protocol: TCP
            - containerPort: 4040
              name: ui
              protocol: TCP
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          # gRPC 엔드포인트라 HTTP 프로브가 없다. TCP 로 확인한다.
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: spark-config
              mountPath: /opt/spark/conf
      volumes:
        - name: spark-config
          configMap:
            name: spark-config
            items:
              - key: spark-defaults.conf
                path: spark-defaults.conf
              - key: driver-pod-template.yaml
                path: driver-pod-template.yaml
              - key: executor-pod-template.yaml
                path: executor-pod-template.yaml
