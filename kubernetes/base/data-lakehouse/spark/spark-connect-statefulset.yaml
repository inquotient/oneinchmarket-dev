apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spark-connect
  labels:
    app.kubernetes.io/name: spark-connect
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: spark-connect-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-connect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-connect
        app.kubernetes.io/component: data-lakehouse
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: spark-connect
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spark-connect
          image: oneinch/spark-iceberg:3.5.6
          # 레지스트리에 없는 로컬 빌드 이미지다(local/build-images.sh).
          # 반입 이미지를 쓰는 것이 전제이므로 pull 정책을 명시한다.
          imagePullPolicy: IfNotPresent
          # Connect Server 자체가 driver 역할을 하므로 client 모드로 뜬다.
          # 수동 spark-submit 은 primary resource 해석에서 실패한다
          #   IllegalArgumentException: path must be absolute
          # 배포판이 제공하는 공식 기동 스크립트를 쓴다.
          command: ["/opt/spark/sbin/start-connect-server.sh"]
          args:
            - "--conf"
            - "spark.connect.grpc.binding.port=15002"
            - "--conf"
            - "spark.submit.deployMode=client"
            - "--conf"
            - "spark.driver.host=$(POD_IP)"
            - "--conf"
            - "spark.driver.port=7078"
            - "--conf"
            - "spark.driver.blockManager.port=7079"
            - "--conf"
            - "spark.kubernetes.namespace=$(POD_NAMESPACE)"
          ports:
            - containerPort: 15002
              name: grpc
              protocol: TCP
            - containerPort: 4040
              name: ui
              protocol: TCP
          env:
            # start-connect-server.sh 는 spark-daemon.sh 를 통해 데몬화한다.
            # 컨테이너에서는 포그라운드로 돌아야 한다.
            - name: SPARK_NO_DAEMONIZE
              value: "true"
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          # gRPC 엔드포인트라 HTTP 프로브가 없다. TCP 로 확인한다.
          startupProbe:
            tcpSocket:
              port: grpc
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            tcpSocket:
              port: grpc
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: spark-config
              mountPath: /opt/spark/conf
      volumes:
        - name: spark-config
          configMap:
            name: spark-config
            items:
              - key: spark-defaults.conf
                path: spark-defaults.conf
              - key: driver-pod-template.yaml
                path: driver-pod-template.yaml
              - key: executor-pod-template.yaml
                path: executor-pod-template.yaml
