apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spark-history
  labels:
    app.kubernetes.io/name: spark-history
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: spark-history-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-history
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spark-history
        app.kubernetes.io/component: data-lakehouse
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: spark-history
      # ★ 이 이미지는 `docker/` 에서 로컬 빌드해 GitLab 레지스트리에 올린다.
      #   파드 자체는 이 시크릿 없이도 뜬다 — build-images.sh 가 containerd 에
      #   같은 이름으로 반입하고 imagePullPolicy 가 IfNotPresent 라 당기지
      #   않기 때문이다. 이 시크릿이 필요한 것은 **Trivy Operator** 다:
      #   스캔 Job 은 파드라 노드의 containerd 를 볼 수 없어 레지스트리에서
      #   직접 당기고, 그때 워크로드의 imagePullSecrets 를 자기 네임스페이스로
      #   복사해 쓴다. 없으면 스캔이 조용히 실패한다 — §8-79
      imagePullSecrets:
        - name: gitlab-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spark-history
          image: gitlab-registry.local.svc.cluster.local:5050/oneinch/spark-iceberg:3.5.6
          # 레지스트리에 없는 로컬 빌드 이미지다(local/build-images.sh).
          # 반입 이미지를 쓰는 것이 전제이므로 pull 정책을 명시한다.
          imagePullPolicy: IfNotPresent
          command: ["/opt/spark/bin/spark-class"]
          args: ["org.apache.spark.deploy.history.HistoryServer"]
          ports:
            - containerPort: 18080
              name: http
              protocol: TCP
          env:
            # ★ spark-class 는 daemon 클래스에 SPARK_DAEMON_MEMORY(기본 1g)를
            #   -Xmx 로 준다. limit 이 1Gi 라 **힙이 limit 과 같았다** —
            #   메타스페이스·코드캐시·스레드 스택·direct buffer 가 들어갈 자리가
            #   0 이라는 뜻이고, 힙이 다 차기 전에 커널이 먼저 죽인다(§8-94).
            - name: SPARK_DAEMON_MEMORY
              value: "640m"                   # limit 1Gi 의 63%. 실사용 550Mi
            - name: SPARK_HISTORY_OPTS
              value: >-
                -Dspark.history.fs.logDirectory=s3a://spark-events/events
                -Dspark.history.fs.cleaner.enabled=true
                -Dspark.history.fs.cleaner.maxAge=7d
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/v1/applications
              port: http
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/applications
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /api/v1/applications
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - name: spark-config
              mountPath: /opt/spark/conf
      volumes:
        - name: spark-config
          configMap:
            name: spark-config
            items:
              - key: spark-defaults.conf
                path: spark-defaults.conf
