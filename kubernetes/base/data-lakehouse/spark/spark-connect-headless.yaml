apiVersion: v1
kind: Service
metadata:
  name: spark-connect-headless
  labels:
    app.kubernetes.io/name: spark-connect
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  clusterIP: None
  # executor 가 driver(=Connect Server) 를 Ready 이전에도 찾을 수 있어야 한다
  publishNotReadyAddresses: true
  ports:
    - name: grpc
      port: 15002
      targetPort: 15002
      protocol: TCP
    - name: ui
      port: 4040
      targetPort: 4040
      protocol: TCP
    - name: driver-rpc
      port: 7078
      targetPort: 7078
      protocol: TCP
    - name: blockmanager
      port: 7079
      targetPort: 7079
      protocol: TCP
  selector:
    app.kubernetes.io/name: spark-connect
