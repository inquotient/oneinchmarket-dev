apiVersion: v1
kind: ConfigMap
metadata:
  name: spark-config
  labels:
    app.kubernetes.io/name: spark
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
data:
  # 네 실행 경로(ETL Job · History · Connect · Livy)가 공유하는 단일 설정.
  # 카탈로그 좌표는 trino-configmap.yaml:31-41 및 hive-metastore-configmap.yaml 과 일치해야 한다.
  spark-defaults.conf: |
    spark.master                                    k8s://https://kubernetes.default.svc.cluster.local:443
    spark.submit.deployMode                         cluster
    spark.kubernetes.container.image                gitlab-registry.local.svc.cluster.local:5050/oneinch/spark-iceberg:4.1.2
    # ★★ cluster 모드에서 spark-submit 이 **로컬 파일**(Livy 의 repl jar · pyspark 등)을 드라이버가
    #   받을 수 있는 곳에 올린다(2026-11-06). 이 키가 없어 Livy 세션이 전부
    #   `Please specify spark.kubernetes.file.upload.path property.` 로 죽었다 — 드라이버 파드조차
    #   생기지 않아 **처음부터 한 번도 시작되지 않았다.** livy.conf 에 넣으면 무시된다(그 파일 참조).
    #   버킷 livy-recovery 는 seaweedfs-bootstrap 이 만들고 비어 있다(Livy 복구는 file:// 를 쓴다).
    #   로컬 의존이 없는 제출(ETL Job 의 s3a:// · local:// 리소스)은 이 경로를 쓰지 않는다.
    spark.kubernetes.file.upload.path               s3a://livy-recovery/uploads
    # ★ spark-iceberg 이미지에는 `python3` 만 있고 `python` 이 없다(2026-11-06 실측). Livy 의 PySpark
    #   인터프리터는 spark.pyspark.python → PYSPARK_PYTHON → "python" 순으로 고르므로, 이것이 없으면
    #   세션은 idle 인데 문장마다 `Fail to start interpreter`(드라이버 로그: Cannot run program "python").
    spark.pyspark.python                            python3
    spark.pyspark.driver.python                     python3
    spark.kubernetes.authenticate.driver.serviceAccountName  spark-driver
    # 익스큐터 전용 SA(spark-rbac.yaml) — 없으면 `default` 로 떠서 S3 인가에 넣을 수 없다.
    spark.kubernetes.authenticate.executor.serviceAccountName  spark-executor
    spark.kubernetes.driver.podTemplateFile         /opt/spark/conf/driver-pod-template.yaml
    spark.kubernetes.executor.podTemplateFile       /opt/spark/conf/executor-pod-template.yaml

    # ── Iceberg 카탈로그 (Trino와 동일한 Hive Metastore·warehouse를 가리킨다)
    spark.sql.extensions                            org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
    spark.sql.catalog.iceberg                       org.apache.iceberg.spark.SparkCatalog
    # ★★ type=rest — HMS 내장 Iceberg REST 카탈로그(2026-11-06). type=hive 는 Spark 3.5 의 Hive 2.3 클라이언트가
    #   옛 Thrift 메서드(get_table)를 불러 Hive 4 HMS 에서 테이블 단계마다 `Invalid method name: 'get_table'` 였다
    #   (네임스페이스 생성·조회는 통과해서 반쯤 되는 것처럼 보였다). REST 의 백엔드가 같은 HMS 라 Trino 와 테이블을
    #   공유한다. 서블릿 설정은 hive-metastore-configmap.yaml 에 있다.
    spark.sql.catalog.iceberg.type                  rest
    spark.sql.catalog.iceberg.uri                   http://hive-metastore-headless:9001/iceberg
    spark.sql.catalog.iceberg.warehouse             s3a://warehouse/tables
    spark.sql.catalog.iceberg.io-impl               org.apache.iceberg.aws.s3.S3FileIO
    spark.sql.catalog.iceberg.s3.endpoint           http://seaweedfs-headless:9000
    spark.sql.catalog.iceberg.s3.path-style-access  true
    spark.sql.catalog.iceberg.client.region         us-east-1
    spark.sql.defaultCatalog                        iceberg

    # ── S3A (직접 파일 접근 경로)
    spark.hadoop.fs.s3a.impl                        org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.endpoint                    http://seaweedfs-headless:9000
    spark.hadoop.fs.s3a.path.style.access           true
    spark.hadoop.fs.s3a.connection.ssl.enabled      false
    # SimpleAWSCredentialsProvider 는 fs.s3a.access.key 만 읽고 환경변수는 보지 않는다.
    # ConfigMap 은 Secret 값을 보간할 수 없으므로 환경변수 기반 provider 를 쓴다.
    #   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 는 각 워크로드가 seaweedfs-users 의 `spark` 사용자로 주입한다(Spark History 는 `spark-history`).
    #   root 가 아니다(2026-11-06) — 버킷 warehouse·spark-events·livy-recovery 만 읽고 쓴다.
    # ★ 2026-11-09 Spark 4.1(Hadoop 3.4) 부터 S3A 는 AWS SDK **v2** 다 — 제공자 이름이 software.amazon.awssdk 다.
    #   옛 v1 이름(com.amazonaws...)은 이미지에 v1 SDK 가 없어 클래스를 못 찾는다(docker/spark-iceberg).
    spark.hadoop.fs.s3a.aws.credentials.provider    software.amazon.awssdk.auth.credentials.EnvironmentVariableCredentialsProvider
    # SDK v2 는 region 을 반드시 정한다 — 자체 엔드포인트에서는 조회할 곳이 없어 명시한다(Iceberg 쪽 client.region 과 같다).
    spark.hadoop.fs.s3a.endpoint.region             us-east-1

    # ── 이벤트 로그 (History Server가 읽는다)
    spark.eventLog.enabled                          true
    # seaweedfs-bootstrap 은 spark-events 를 별도 버킷으로 만든다.
    # s3a://warehouse/spark-events 는 존재하지 않는 프리픽스다:
    #   FileNotFoundException: Log directory specified does not exist
    # 버킷 루트(s3a://spark-events/)는 stripSuffix("/") 후 경로 성분이 사라져
    # SparkContext.scala:631 에서 IllegalArgumentException: path must be absolute 가 난다.
    # 프리픽스를 포함한 경로를 준다. seaweedfs-bootstrap 이 프리픽스를 만든다.
    spark.eventLog.dir                              s3a://spark-events/events

    # ── 유휴 시 executor 를 0으로 반납한다. 로컬 메모리 예산에서 중요하다.
    spark.dynamicAllocation.enabled                 true
    spark.dynamicAllocation.shuffleTracking.enabled true
    spark.dynamicAllocation.minExecutors            0
    spark.dynamicAllocation.maxExecutors            4
    spark.dynamicAllocation.executorIdleTimeout     120s

  # 동적 생성되는 driver/executor 파드도 Kyverno 6정책을 만족해야 한다.
  # (disallow-root · disallow-privilege-escalation · require-resources)
  driver-pod-template.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        app.kubernetes.io/name: spark-driver
        app.kubernetes.io/component: data-lakehouse
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      priorityClassName: batch-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spark-kubernetes-driver
          # ★ 드라이버·익스큐터는 Spark 가 만드는 파드라 워크로드의 env 를 물려받지 않는다(2026-11-06).
          #   자격이 없으면 s3a(업로드 받기 · 이벤트 로그)가 EnvironmentVariableCredentialsProvider 에서
          #   실패한다. Livy·Connect 와 같은 키를 쓴다.
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: seaweedfs-users, key: spark-access-key}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: seaweedfs-users, key: spark-secret-key}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi

  executor-pod-template.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        app.kubernetes.io/name: spark-executor
        app.kubernetes.io/component: data-lakehouse
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      priorityClassName: batch-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: spark-kubernetes-executor
          # ★ 드라이버·익스큐터는 Spark 가 만드는 파드라 워크로드의 env 를 물려받지 않는다(2026-11-06).
          #   자격이 없으면 s3a(업로드 받기 · 이벤트 로그)가 EnvironmentVariableCredentialsProvider 에서
          #   실패한다. Livy·Connect 와 같은 키를 쓴다.
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: seaweedfs-users, key: spark-access-key}}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: seaweedfs-users, key: spark-secret-key}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
