apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hive-server
  labels:
    app.kubernetes.io/name: hive-server
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: hive-server-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hive-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive-server
        app.kubernetes.io/component: data-lakehouse
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: hive-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: hive-server
          image: apache/hive:4.0.1
          ports:
            - containerPort: 10000
              name: thrift
              protocol: TCP
            - containerPort: 10002
              name: web
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: hiveserver2
            # ★ entrypoint 는 IS_RESUME 이 없으면 무조건
            #   `schematool -dbType derby -initOrUpgradeSchema` 를 실행하고
            #   실패 시 exit 1 한다. 스키마 소유자는 hive-metastore 이므로
            #   HiveServer2 에서는 반드시 건너뛴다.
            - name: IS_RESUME
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
            # HDFS 접근 주체. NameNode 는 simple 인증이라 이 값이 곧 사용자다.
            # hdfs-bootstrap 이 /warehouse 를 hive 소유로 만들어 두었다.
            - name: HADOOP_USER_NAME
              value: hive
            # ★ S3A 클래스패스.
            #   hadoop-aws 와 AWS SDK 는 share/hadoop/tools/lib 에 있고 이 경로는
            #   Hadoop 기본 클래스패스에 없다. 넣지 않으면 s3a:// 경로를 해석하는
            #   순간 ClassNotFoundException: S3AFileSystem 으로 DDL 이 실패한다.
            #   (hive-site.xml 에 fs.s3a.impl 을 적어둬도 클래스가 없으면 무의미하다)
            #   entrypoint 가 앞에 $TEZ_HOME/* 를 붙이므로 이 값은 뒤에 이어진다.
            #   와일드카드 대신 두 jar 만 지정한다 — tools/lib 전체는 azure·gcs 등
            #   쓰지 않는 커넥터와 중복 SDK 를 함께 끌어온다.
            - name: HADOOP_CLASSPATH
              value: /opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar:/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.12.367.jar
            # Tez 로컬 모드는 DAG 를 이 JVM 안에서 돌린다. entrypoint 가
            # HADOOP_CLIENT_OPTS 에 -Xmx1G 를 먼저 붙이므로 여기서 늘린다.
            - name: SERVICE_OPTS
              value: "-Xmx1536m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2560Mi
          # 메타스토어 접속 + Tez 초기화까지 2~3분 걸린다.
          startupProbe:
            tcpSocket:
              port: thrift
            failureThreshold: 40
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: thrift
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: thrift
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: hive-config
          configMap:
            name: hive-server-config
            items:
              - key: hive-site.xml
                path: hive-site.xml
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
