apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hive-metastore
  labels:
    app.kubernetes.io/name: hive-metastore
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: hive-metastore-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hive-metastore
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive-metastore
        app.kubernetes.io/component: data-lakehouse
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: hive-metastore
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: download-postgres-driver
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              wget -O /driver/postgresql-42.7.3.jar \
                https://jdbc.postgresql.org/download/postgresql-42.7.3.jar
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: postgres-driver
              mountPath: /driver
      containers:
        - name: hive-metastore
          image: apache/hive:4.0.1
          ports:
            - containerPort: 9083
              name: thrift
              protocol: TCP
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hive-metastore-secret
                  key: db-password
            - name: SERVICE_NAME
              value: metastore
            - name: DB_DRIVER
              value: postgres
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
            # ★ S3A 클래스패스.
            #   hadoop-aws 와 AWS SDK 는 share/hadoop/tools/lib 에 있고 이 경로는
            #   Hadoop 기본 클래스패스에 없다. 넣지 않으면 s3a:// 경로를 해석하는
            #   순간 ClassNotFoundException: S3AFileSystem 으로 DDL 이 실패한다.
            #   (hive-site.xml 에 fs.s3a.impl 을 적어둬도 클래스가 없으면 무의미하다)
            #   entrypoint 가 앞에 $TEZ_HOME/* 를 붙이므로 이 값은 뒤에 이어진다.
            #   와일드카드 대신 두 jar 만 지정한다 — tools/lib 전체는 azure·gcs 등
            #   쓰지 않는 커넥터와 중복 SDK 를 함께 끌어온다.
            - name: HADOOP_CLASSPATH
              value: /opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar:/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.12.367.jar
            # ★ 힙만 따로 뺀 이유 — SERVICE_OPTS 는 JDBC 접속 문자열까지 담고 있어
            #   오버레이가 힙만 바꾸려면 전체를 복제해야 한다(드리프트). 힙을 별도
            #   키로 두고 $(HIVE_HEAP) 로 참조하면 오버레이는 이 한 줄만 덮는다.
            #   entrypoint 가 HADOOP_CLIENT_OPTS="$HADOOP_CLIENT_OPTS -Xmx1G $SERVICE_OPTS"
            #   로 조립하므로 뒤에 온 -Xmx 가 최종값이다.
            #   base limit 은 2Gi — 힙 + 메타스페이스 + 스레드 스택이 들어간다.
            #   로컬은 1280Mi 라 overlays/local/patches/limits-local.yaml 에서 낮춘다.
            - name: HIVE_HEAP
              value: "-Xmx1536m"
            - name: SERVICE_OPTS
              value: >-
                -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
                -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgresql-headless:5432/hive_metastore
                -Djavax.jdo.option.ConnectionUserName=hive
                -Djavax.jdo.option.ConnectionPassword=$(DB_PASSWORD)
                $(HIVE_HEAP)
          # envFrom 을 쓰지 않는다 — 이 ConfigMap 의 유일한 키가 "hive-site.xml"
          # 이라 hive-site.xml 이라는 이름의 환경변수에 XML 전문이 들어갔다.
          # 설정은 아래 volumeMounts 의 파일 마운트로만 전달한다.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: thrift
            failureThreshold: 30
            periodSeconds: 10
          # ★ liveness 를 느슨하게 잡는다.
          #   메타스토어는 JVM 이 무겁고 CPU 가 붐비면 TCP accept 자체가
          #   늦어진다. period 10s · timeout 5s · failureThreshold 3(기본)
          #   이면 30초만 밀려도 컨테이너가 죽는다 — 실제로 10회 재시작했다.
          #   재시작은 스키마 점검부터 다시 돌아 더 붐비게 만든다(악순환).
          livenessProbe:
            tcpSocket:
              port: thrift
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: thrift
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
            - name: postgres-driver
              mountPath: /opt/hive/lib/postgresql-42.7.3.jar
              subPath: postgresql-42.7.3.jar
      volumes:
        - name: hive-config
          configMap:
            name: hive-metastore-config
            items:
              - key: hive-site.xml
                path: hive-site.xml
        - name: postgres-driver
          emptyDir: {}
