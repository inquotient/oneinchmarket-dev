apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-metastore-config
  labels:
    app.kubernetes.io/name: hive-metastore
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
data:
  hive-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
      <!-- Metastore warehouse location -->
      <property>
        <name>hive.metastore.warehouse.dir</name>
        <value>s3a://warehouse/tables</value>
      </property>

      <!-- S3A filesystem configuration -->
      <property>
        <name>fs.s3a.endpoint</name>
        <value>http://minio-headless:9000</value>
      </property>
      <!-- ★ 자격증명은 값이 아니라 공급자로 넘긴다.
           fs.s3a.access.key 에 ${env:MINIO_ACCESS_KEY} 를 쓰던 방식은
           HiveServer2 에서는 HiveConf.get() 이 치환해 주지만 독립
           메타스토어에서는 치환되지 않아 리터럴이 그대로 키가 되고
           MinIO 가 403 Forbidden 을 돌려준다. 조용히 틀리는 설정이다.
           EnvironmentVariableCredentialsProvider 는 AWS SDK 가 직접
           AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY 를 읽으므로
           Hadoop 의 변수 치환 규칙에 의존하지 않는다. -->
      <property>
        <name>fs.s3a.aws.credentials.provider</name>
        <value>com.amazonaws.auth.EnvironmentVariableCredentialsProvider</value>
      </property>
      <property>
        <name>fs.s3a.path.style.access</name>
        <value>true</value>
      </property>
      <property>
        <name>fs.s3a.impl</name>
        <value>org.apache.hadoop.fs.s3a.S3AFileSystem</value>
      </property>
      <property>
        <name>fs.s3a.connection.ssl.enabled</name>
        <value>false</value>
      </property>

      <!-- Metastore configuration -->
      <property>
        <name>hive.metastore.uris</name>
        <value>thrift://hive-metastore-headless:9083</value>
      </property>
      <!-- 알림 이벤트 API 인가.
           기본값 true 는 호출자가 proxyuser 로 등록된 슈퍼유저일 것을 요구한다.
           HiveServer2 는 기동 시 get_current_notificationEventId 를 호출하고
           (hive.notification.event.poll.interval, 기본 60s) 여기서 막히면
           "Error initializing notification event poll" 로 기동을 무한 재시도한다.
           커버로스가 없는 로컬에서는 위임할 근거가 없어 끈다.
           ★ 이름공간 주의 — 독립 메타스토어 서버는 metastore.* 를 읽는다.
             HiveServer2 쪽 hive-site.xml 에 넣어도 서버 판정은 바뀌지 않는다. -->
      <property>
        <name>metastore.event.db.notification.api.auth</name>
        <value>false</value>
      </property>
      <property>
        <name>hive.metastore.event.db.notification.api.auth</name>
        <value>false</value>
      </property>
      <property>
        <name>metastore.task.threads.always</name>
        <value>org.apache.hadoop.hive.metastore.events.EventCleanerTask</value>
      </property>
      <property>
        <name>metastore.expression.proxy</name>
        <value>org.apache.hadoop.hive.metastore.DefaultPartitionExpressionProxy</value>
      </property>
    </configuration>
