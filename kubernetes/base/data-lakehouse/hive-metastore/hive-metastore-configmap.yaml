apiVersion: v1
kind: ConfigMap
metadata:
  name: hive-metastore-config
  labels:
    app.kubernetes.io/name: hive-metastore
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
data:
  hive-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <?xml-stylesheet type="text/xsl" href="configuration.xsl"?>
    <configuration>
      <!-- Metastore warehouse location -->
      <property>
        <name>hive.metastore.warehouse.dir</name>
        <value>s3a://warehouse/tables</value>
      </property>

      <!-- S3A filesystem configuration -->
      <property>
        <name>fs.s3a.endpoint</name>
        <value>http://minio-headless:9000</value>
      </property>
      <property>
        <name>fs.s3a.access.key</name>
        <value>${env:MINIO_ACCESS_KEY}</value>
      </property>
      <property>
        <name>fs.s3a.secret.key</name>
        <value>${env:MINIO_SECRET_KEY}</value>
      </property>
      <property>
        <name>fs.s3a.path.style.access</name>
        <value>true</value>
      </property>
      <property>
        <name>fs.s3a.impl</name>
        <value>org.apache.hadoop.fs.s3a.S3AFileSystem</value>
      </property>
      <property>
        <name>fs.s3a.connection.ssl.enabled</name>
        <value>false</value>
      </property>

      <!-- Metastore configuration -->
      <property>
        <name>hive.metastore.uris</name>
        <value>thrift://hive-metastore-headless:9083</value>
      </property>
      <property>
        <name>metastore.task.threads.always</name>
        <value>org.apache.hadoop.hive.metastore.events.EventCleanerTask</value>
      </property>
      <property>
        <name>metastore.expression.proxy</name>
        <value>org.apache.hadoop.hive.metastore.DefaultPartitionExpressionProxy</value>
      </property>
    </configuration>
