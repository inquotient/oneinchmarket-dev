apiVersion: v1
kind: Service
metadata:
  name: hive-metastore-headless
  labels:
    app.kubernetes.io/name: hive-metastore
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 9083
      targetPort: thrift
      protocol: TCP
      name: thrift
    # Iceberg REST 카탈로그(HMS 내장) — Spark 의 iceberg 카탈로그가 type=rest 로 쓴다(configmap 참조).
    - port: 9001
      targetPort: iceberg-rest
      protocol: TCP
      name: http-iceberg-rest
  selector:
    app.kubernetes.io/name: hive-metastore
