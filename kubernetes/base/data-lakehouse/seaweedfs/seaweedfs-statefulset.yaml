# SeaweedFS 4.52 — MinIO 의 대체 S3 엔진(2026-11-07).
#
# ★ 왜 바꾸나: MinIO 는 Docker Hub 저장소가 지워졌고(2026-09-11) quay 는 인증이 필요하며
#   상류 레포가 archived 라 마지막 커뮤니티 릴리스의 CVE-2026-40344(CVSS 8.8 인증 우회)가
#   고쳐지지 않는다(Gotcha 176). SeaweedFS 는 Apache-2.0 이고 Docker Hub 에서 익명으로 받는다.
#
# ★ 한 파드에 master·volume·filer·S3 넷을 띄운다(`weed server`). 데이터가 192 MiB 이고
#   복제는 원래 없었다(MinIO 도 단일 파드·단일 디스크). 내부 포트(9333·8080·8888 과 gRPC)는
#   인증이 없으므로 `-ip=127.0.0.1` 로 루프백에만 둔다 — 파드 밖으로 여는 것은 S3(9000)와
#   그 gRPC(19000) 뿐이다(실측 리스너). 정책이 여는 것은 9000 하나다.
#   Iceberg REST(8181)·Lance(9101)는 기본으로 켜져 0.0.0.0 에 붙으므로 끈다 —
#   Iceberg 카탈로그는 HMS 가 맡는다(Gotcha 211).
#
# ★★ 사용자·권한은 `-s3.config` 정적 파일이다. initContainer 가 Secret(minio-secret 의
#   root · minio-users 의 사용자 7명)에서 렌더하고, 버킷 단위 권한은 MinIO 정책과 같다
#   (`Read:<버킷>` 형식 — 실측으로 다른 버킷 쓰기·목록·새 버킷 생성이 거부됐다).
#   파일은 기동 때만 읽히므로 키를 바꾸면 **파드가 다시 떠야 한다** — Reloader 가 그 일을
#   한다(아래 어노테이션). MinIO 와 달리 사용자 키 회전에도 S3 가 몇 초 끊긴다.
#   Secret 이름이 minio-* 인 것은 그대로 둔다 — 소비자 19곳이 그 이름을 읽는다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
    # Secret 을 initContainer 의 env 로만 읽으므로 이름도 명시한다.
    secret.reloader.stakater.com/reload: "minio-secret,minio-users,seaweedfs-secret"
spec:
  serviceName: seaweedfs-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seaweedfs
        app.kubernetes.io/component: data-lakehouse
        app.kubernetes.io/part-of: oneinchmarket
        # S3 엔진 공통 라벨 — 접근 정책(NetworkPolicy·AuthorizationPolicy)이 이것을 고른다.
        oneinchmarket.io/object-store: s3
    spec:
      serviceAccountName: seaweedfs
      terminationGracePeriodSeconds: 30   # 실측: SIGTERM 뒤 10초 안에 끝나지 않았다
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000                   # 이미지의 seaweed 사용자(1000:1000)와 같다
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: render-s3-config
          image: docker.io/chrislusf/seaweedfs:4.52
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              # 키에 따옴표·백슬래시가 있으면 JSON 이 깨진다 — 조용히 틀린 파일을 쓰지 말고 멈춘다.
              for v in ROOT_USER ROOT_PW TRINO_A TRINO_S HIVE_A HIVE_S SPARK_A SPARK_S SH_A SH_S \
                       OR_A OR_S OB_A OB_S AF_A AF_S; do
                eval "x=\${$v:-}"
                [ -n "$x" ] || { echo "[render] $v 가 비었다" >&2; exit 1; }
                case "$x" in *'"'*|*'\'*) echo "[render] $v 에 JSON 에 쓸 수 없는 문자가 있다" >&2; exit 1;; esac
              done
              acts() { a=""; for b in "$@"; do for k in Read Write List Tagging; do a="$a${a:+,}\"$k:$b\""; done; done; printf '%s' "$a"; }
              ident() { printf '{"name":"%s","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":[%s]}' "$1" "$2" "$3" "$4"; }
              {
                printf '{"identities":['
                ident root "$ROOT_USER" "$ROOT_PW" '"Admin","Read","List","Tagging","Write"'; printf ','
                ident trino "$TRINO_A" "$TRINO_S" "$(acts warehouse)"; printf ','
                ident hive "$HIVE_A" "$HIVE_S" "$(acts warehouse)"; printf ','
                ident spark "$SPARK_A" "$SPARK_S" "$(acts warehouse spark-events livy-recovery)"; printf ','
                ident spark-history "$SH_A" "$SH_S" "$(acts spark-events)"; printf ','
                ident openreplay "$OR_A" "$OR_S" "$(acts mobs sessions-assets records sourcemaps uxtesting-records spots)"; printf ','
                ident openbao-snapshot "$OB_A" "$OB_S" "$(acts openbao-snapshots)"; printf ','
                ident airflow "$AF_A" "$AF_S" "$(acts airflow-logs)"
                printf ']}\n'
              } > /cfg/s3.json
              n=$(grep -o '"name":' /cfg/s3.json | wc -l)
              [ "$n" -eq 8 ] || { echo "[render] identity 가 8 개가 아니다($n)" >&2; exit 1; }
              echo "[render] identity $n 개"
              # 관리 콘솔(weed admin) 비밀번호 — 인자가 아니라 -options 파일로 준다(프로세스 목록에 남지 않는다).
              [ -n "${ADMIN_PW:-}" ] || { echo "[render] ADMIN_PW 가 비었다" >&2; exit 1; }
              printf 'adminPassword=%s\n' "$ADMIN_PW" > /cfg/admin.options
          env:
            - { name: ROOT_USER, valueFrom: { secretKeyRef: { name: minio-secret, key: root-user } } }
            - { name: ROOT_PW,   valueFrom: { secretKeyRef: { name: minio-secret, key: root-password } } }
            - { name: TRINO_A, valueFrom: { secretKeyRef: { name: minio-users, key: trino-access-key } } }
            - { name: TRINO_S, valueFrom: { secretKeyRef: { name: minio-users, key: trino-secret-key } } }
            - { name: HIVE_A,  valueFrom: { secretKeyRef: { name: minio-users, key: hive-access-key } } }
            - { name: HIVE_S,  valueFrom: { secretKeyRef: { name: minio-users, key: hive-secret-key } } }
            - { name: SPARK_A, valueFrom: { secretKeyRef: { name: minio-users, key: spark-access-key } } }
            - { name: SPARK_S, valueFrom: { secretKeyRef: { name: minio-users, key: spark-secret-key } } }
            - { name: SH_A,    valueFrom: { secretKeyRef: { name: minio-users, key: spark-history-access-key } } }
            - { name: SH_S,    valueFrom: { secretKeyRef: { name: minio-users, key: spark-history-secret-key } } }
            - { name: OR_A,    valueFrom: { secretKeyRef: { name: minio-users, key: openreplay-access-key } } }
            - { name: OR_S,    valueFrom: { secretKeyRef: { name: minio-users, key: openreplay-secret-key } } }
            - { name: OB_A,    valueFrom: { secretKeyRef: { name: minio-users, key: openbao-snapshot-access-key } } }
            - { name: OB_S,    valueFrom: { secretKeyRef: { name: minio-users, key: openbao-snapshot-secret-key } } }
            - { name: AF_A,    valueFrom: { secretKeyRef: { name: minio-users, key: airflow-access-key } } }
            - { name: AF_S,    valueFrom: { secretKeyRef: { name: minio-users, key: airflow-secret-key } } }
            - { name: ADMIN_PW, valueFrom: { secretKeyRef: { name: seaweedfs-secret, key: admin-password } } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits:   { cpu: 100m, memory: 32Mi }
          volumeMounts:
            - { name: s3-config, mountPath: /cfg }
      containers:
        - name: seaweedfs
          image: docker.io/chrislusf/seaweedfs:4.52
          args:
            - server
            - -dir=/data
            - -ip=127.0.0.1
            - -s3
            - -s3.port=9000
            - -s3.ip.bind=0.0.0.0
            - -s3.config=/cfg/s3.json
            - -s3.port.iceberg=0
            - -s3.port.lance=0
            # 버킷 하나가 컬렉션 하나이고 컬렉션마다 볼륨을 여럿 만든다 — 자동값(디스크/1GiB ≈ 50)으로는
            #   버킷 12개를 담지 못한다. 볼륨 파일은 미리 잡지 않으므로 수가 많아도 디스크를 쓰지 않는다.
            - -volume.max=200
            - -master.volumeSizeLimitMB=1024
            # ★ 지표(-metricsPort)는 -ip 를 따라 루프백에 붙어 Prometheus 가 긁을 수 없다(실측) — 두지 않는다.
            # ★ 기동 로그의 `Failed to load IAM configuration: no signing key found for STS` 는 STS(임시 자격)
            #   쪽 경고이고 정적 identity 는 그대로 동작한다(실측: 허용·거부 11/11).
          env:
            # 컨테이너 한도 안에서 GC 가 먼저 돌게 한다(Go 는 cgroup 한도를 스스로 보지 않는다).
            - name: GOMEMLIMIT
              value: "400MiB"
          ports:
            - { containerPort: 9000, name: s3, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: false
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits:   { cpu: "1", memory: 512Mi }
          startupProbe:
            tcpSocket: { port: s3 }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /healthz, port: s3 }
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /cfg, readOnly: true }
        # ★ 관리 콘솔 — `weed admin`(2026-11-07). 같은 파드라 루프백의 master(9333)·filer 에 닿는다.
        #   비밀번호가 있으면 0.0.0.0 에 붙고(없으면 루프백), 로그인 없이는 / -> /login(307) · API 401 이다(실측).
        #   사람은 게이트웨이 -> oauth2-proxy(Keycloak, 그룹 platform) -> 여기 로 온다 — 로그인이 두 겹이다.
        #   ★★ 워커용 gRPC(12535+10000=22535)는 **인증 없이** 워커 등록을 받는다(이미지 자신의 경고).
        #   막는 것은 메시다: 이 파드를 고르는 ALLOW 정책이 9000(소비자)·12535(oauth2-proxy)만 연다.
        #   ★ -port.legacy(23646)·Iceberg·Lance 표시는 끈다. 상태(-dataDir)는 데이터 PVC 의 admin/ 에 둔다.
        - name: admin
          image: docker.io/chrislusf/seaweedfs:4.52
          command: ["weed"]
          args:
            - admin
            - -options=/cfg/admin.options
            - -master=127.0.0.1:9333
            - -port=12535
            - -ip=0.0.0.0
            - -port.legacy=0
            - -iceberg.port=0
            - -lance.port=0
            - -dataDir=/data/admin
          ports:
            - { containerPort: 12535, name: admin, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 100m, memory: 128Mi }
          startupProbe:
            tcpSocket: { port: admin }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: admin }
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /login, port: admin }
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: s3-config, mountPath: /cfg, readOnly: true }
        # ★ 내부 UI 셋(master·volume·filer)을 루프백에서 파드 밖으로 중계한다(2026-11-07) — 설정과 사유는
        #   seaweedfs-ui-proxy-configmap.yaml. 9433 -> 9333(master) · 8180 -> 8080(volume) · 8988 -> 8888(filer).
        #   ★ 상류 엔트리포인트를 쓰지 않는다 — /docker-entrypoint.d 가 설정을 고쳐 쓰려다 읽기 전용 rootfs 와 부딪힌다.
        #   실측: uid 1000·읽기 전용에서 세 UI 가 중계되고 6.7 MB.
        - name: ui-proxy
          image: docker.io/library/nginx:1.31.5
          command: ["nginx", "-c", "/etc/nginx/nginx.conf", "-g", "daemon off;"]
          ports:
            - { containerPort: 9433, name: ui-master, protocol: TCP }
            - { containerPort: 8180, name: ui-volume, protocol: TCP }
            - { containerPort: 8988, name: ui-filer, protocol: TCP }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            readOnlyRootFilesystem: true
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits:   { cpu: 50m, memory: 32Mi }
          startupProbe:
            httpGet: { path: /healthz, port: 8190 }
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8190 }
            periodSeconds: 20
            timeoutSeconds: 5
          volumeMounts:
            - { name: ui-proxy-config, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true }
            - { name: ui-proxy-tmp, mountPath: /tmp }
      volumes:
        - name: s3-config
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        - name: ui-proxy-config
          configMap: { name: seaweedfs-ui-proxy }
        - name: ui-proxy-tmp
          emptyDir: { sizeLimit: 1Gi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 50Gi
