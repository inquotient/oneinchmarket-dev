# SeaweedFS 의 지배 Service(StatefulSet.serviceName). 소비자는 이 이름을 쓰지 않는다 —
# 소비자의 이름은 여전히 `minio-headless:9000` 이고, 그 Service 가 S3 엔진을 고른다
# (minio-headless.yaml). 엔진을 바꿔도 소비자 21곳을 손대지 않으려는 것이다(Gotcha 176).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-headless
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 9000
      targetPort: s3
      protocol: TCP
      name: api
    # 관리 콘솔 — oauth2-proxy-seaweedfs 만 닿는다(authz-external-access.yaml).
    - port: 12535
      targetPort: admin
      protocol: TCP
      name: admin
    # 내부 UI 셋(ui-proxy 사이드카가 루프백에서 중계) — 역시 oauth2-proxy 만 닿는다.
    - { port: 9433, targetPort: ui-master, protocol: TCP, name: ui-master }
    - { port: 8180, targetPort: ui-volume, protocol: TCP, name: ui-volume }
    - { port: 8988, targetPort: ui-filer, protocol: TCP, name: ui-filer }
  selector:
    app.kubernetes.io/name: seaweedfs
