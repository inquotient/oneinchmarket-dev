# SeaweedFS 의 지배 Service(StatefulSet.serviceName). 소비자는 이 이름을 쓰지 않는다 —
# 소비자의 이름은 여전히 `minio-headless:9000` 이고, 그 Service 가 S3 엔진을 고른다
# (minio-headless.yaml). 엔진을 바꿔도 소비자 21곳을 손대지 않으려는 것이다(Gotcha 176).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-headless
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 9000
      targetPort: s3
      protocol: TCP
      name: api
  selector:
    app.kubernetes.io/name: seaweedfs
