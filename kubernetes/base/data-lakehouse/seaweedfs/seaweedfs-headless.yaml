# SeaweedFS S3(9000) — 소비자 21곳이 이 이름으로 붙는다(2026-11-07 에 minio-headless 에서 바꿨다, Gotcha 218).
# 같은 Service 가 StatefulSet 의 지배 Service 이고, 관리 콘솔·내부 UI 포트도 함께 연다(oauth2-proxy 만 닿는다).
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-headless
  labels:
    app.kubernetes.io/name: seaweedfs
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 9000
      targetPort: s3
      protocol: TCP
      name: api
    # 관리 콘솔 — oauth2-proxy-seaweedfs 만 닿는다(authz-external-access.yaml).
    - port: 12535
      targetPort: admin
      protocol: TCP
      name: admin
    # 내부 UI 셋(ui-proxy 사이드카가 루프백에서 중계) — 역시 oauth2-proxy 만 닿는다.
    - { port: 9433, targetPort: ui-master, protocol: TCP, name: ui-master }
    - { port: 8180, targetPort: ui-volume, protocol: TCP, name: ui-volume }
    - { port: 8988, targetPort: ui-filer, protocol: TCP, name: ui-filer }
  selector:
    app.kubernetes.io/name: seaweedfs
