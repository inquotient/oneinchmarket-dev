apiVersion: v1
kind: ServiceAccount
metadata:
  name: hadoop
  labels: {app.kubernetes.io/name: hadoop, app.kubernetes.io/component: data-lakehouse, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
automountServiceAccountToken: false
---
# ★ 이름을 hadoop-namenode 로 둔다 — core-site.xml 의
#   fs.defaultFS=hdfs://hadoop-namenode:8020 이 이 이름을 가리킨다.
apiVersion: v1
kind: Service
metadata:
  name: hadoop-namenode
  labels: {app.kubernetes.io/name: hadoop-namenode, app.kubernetes.io/component: data-lakehouse, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  ports:
    - {name: rpc, port: 8020, targetPort: 8020, protocol: TCP}
    - {name: http, port: 9870, targetPort: 9870, protocol: TCP}
  selector: {app.kubernetes.io/name: hadoop-namenode}
---
# StatefulSet 의 안정 DNS 용. DataNode 가 자기 호스트명을 여기로 푼다.
apiVersion: v1
kind: Service
metadata:
  name: hadoop-namenode-headless
  labels: {app.kubernetes.io/name: hadoop-namenode, app.kubernetes.io/component: data-lakehouse, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  clusterIP: None
  ports:
    - {name: rpc, port: 8020, targetPort: 8020, protocol: TCP}
    - {name: http, port: 9870, targetPort: 9870, protocol: TCP}
  selector: {app.kubernetes.io/name: hadoop-namenode}
