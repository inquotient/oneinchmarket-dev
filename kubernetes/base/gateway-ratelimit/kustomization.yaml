# 게이트웨이 전역 레이트 리밋 — WSO2 Traffic Manager 칸을 채운다 (§8-89)
#
# ★★ 왜 service-mesh/ 가 아니라 별도 디렉터리인가 — sync-wave 때문이다.
#   service-mesh/kustomization.yaml 은 commonAnnotations 로
#   argocd.argoproj.io/sync-wave: "0" 을 박는데, kustomize 의
#   commonAnnotations 는 리소스에 이미 있는 같은 키를 덮어쓴다.
#   실측: 파일마다 wave "2" 를 달았는데 렌더 결과가 전부 "0" 이었다.
#
#   그러면 안 되는 이유: 이 RLS 는 Redis(wave 1) 가 있어야 Healthy 가
#   된다. wave 0 에 두면 ArgoCD 가 wave 경계에서 Healthy 를 기다리는데
#   Redis 가 아직 없어 영원히 기다린다 — §8-84 에서 같은 교착을 실제로
#   밟았다(죽은 Ingress·yellow ES 가 동기화를 세운 것과 같은 부류).
#
#   ★ 교훈: 파일에 단 주석이 렌더 결과와 같다고 가정하지 말 것.
#   kubectl kustomize 결과에서 확인해야 안다.
#
# ★ 두 파일이 모두 있어야 동작한다 — 서비스만 있으면 아무도 묻지 않고,
#   필터만 있으면 물어볼 곳이 없다. 어느 쪽도 오류를 내지 않는다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # ★ 생성 파일이다 — local/render-ratelimit.py 가 만든다. 직접 고치지 말 것.
  - ratelimit-config.yaml
  - ratelimit-service.yaml
  - ratelimit-envoyfilter.yaml

commonAnnotations:
  # Redis(1) 뒤, application(6) 앞.
  argocd.argoproj.io/sync-wave: "2"
