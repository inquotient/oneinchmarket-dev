apiVersion: apps/v1
kind: Deployment
metadata:
  name: knox
  labels: {app.kubernetes.io/name: knox, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: knox}
  template:
    metadata:
      labels: {app.kubernetes.io/name: knox, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket}
    spec:
      serviceAccountName: knox
      securityContext:
        # apache/knox 이미지의 기본 uid 다.
        runAsNonRoot: true
        runAsUser: 8000
        runAsGroup: 8000
        fsGroup: 8000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # ★ 게이트웨이 TLS 신원을 미리 넣는다 (§8-66)
        #
        #   Knox 는 기동 시 `gateway.jks` 가 없으면 **자체 서명 인증서를 만들고
        #   SAN 에 파드 이름과 localhost 만** 넣는다. 파드 이름은 재기동마다
        #   바뀌므로 `jdbc:hive2://knox-headless:8443/...` 이 영구히
        #   SSLPeerUnverifiedException 으로 끊긴다.
        #
        #   ★ `KNOX_CERT`/`KNOX_KEY` 로는 해결되지 않는다 — 그 둘은 entrypoint 가
        #     `keystore.jks` 의 별칭 `keystore`(서명용, JWT·KnoxSSO)로 넣는다.
        #     게이트웨이 TLS 는 `gateway.jks` 의 별칭 **`gateway-identity`** 다.
        #     매니페스트 주석이 KNOX_CERT 로 된다고 적어 두었던 것은 틀렸다.
        #
        #   그래서 cert-manager 인증서로 `gateway.jks` 를 직접 만들어 둔다.
        #   Knox 는 이미 있는 것을 그대로 쓴다.
        - name: gateway-identity
          # 아래 본 컨테이너와 같은 다이제스트여야 한다(keytool 버전 일치).
          image: apache/knox@sha256:5f90c6b5b36dd2b2afffbcb358689b9fe87ecf413ae7aa53f208610872cb1ac5
          command: ["/bin/bash","-c"]
          args:
            - |
              set -euo pipefail
              KS=/keystores/gateway.jks
              if [ -f "$KS" ]; then echo "[init] gateway.jks 이미 있음 — 건너뜀"; exit 0; fi
              PW="$(cat /etc/knox/pw/master-secret)"
              echo "[init] cert-manager 인증서로 gateway-identity 생성"
              openssl pkcs12 -export                 -in  /etc/knox/tls/tls.crt                 -inkey /etc/knox/tls/tls.key                 -name gateway-identity                 -passout "pass:${PW}"                 -out /tmp/gw.p12
              keytool -importkeystore -noprompt                 -srckeystore /tmp/gw.p12 -srcstoretype PKCS12 -srcstorepass "${PW}"                 -destkeystore "$KS" -deststorepass "${PW}" -destkeypass "${PW}"                 -alias gateway-identity
              rm -f /tmp/gw.p12
              echo "[init] 완료 — SAN 확인:"
              keytool -list -v -keystore "$KS" -storepass "${PW}" -alias gateway-identity                 | grep -A1 "SubjectAlternativeName" | head -4 || true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits:   {cpu: 500m, memory: 384Mi}
          volumeMounts:
            - {name: keystores, mountPath: /keystores}
            - {name: tls, mountPath: /etc/knox/tls, readOnly: true}
            - {name: keystore-pw, mountPath: /etc/knox/pw, readOnly: true}
      containers:
        - name: knox
          # ★ 버전 선택 근거 — Docker Hub `apache/knox` 에는 2.x 태그가 없다
          #   (latest·3.0·3·3.0.0-RC2·3.0.0-RC1 뿐). 반대로 정식 릴리스는
          #   2.1.0 이 최신이고 3.0.0 은 downloads.apache.org 에 없다.
          #   즉 "공식 이미지"와 "정식 릴리스"가 배타적이다.
          #   로컬 검증 환경이므로 공식 이미지(미릴리스 3.0.0)를 택했다.
          # ★ `3.0` 은 **가변 태그**다 — RC 빌드를 따라간다. 재현 가능한 핀은
          #   다이제스트뿐이므로 전 환경에서 다이제스트를 쓴다.
          #   (예전에는 prod 오버레이만 다이제스트였다 — 그래서 local·dev 는
          #    같은 매니페스트로 다른 바이너리를 돌리고 있었다.)
          image: apache/knox@sha256:5f90c6b5b36dd2b2afffbcb358689b9fe87ecf413ae7aa53f208610872cb1ac5
          env:
            # ★ 기본값이 true 다. 켜져 있으면 기동 시 Let's Encrypt 스테이징
            #   루트 CA 를 인터넷에서 내려받는다. 폐쇄망·egress 정책 아래에서는
            #   기동이 그만큼 지연되거나 실패한다. 명시적으로 끈다.
            - {name: IMPORT_LETS_ENCRYPT_STAGING_CERTS, value: "false"}
            - name: MASTER_SECRET
              valueFrom: {secretKeyRef: {name: knox-secret, key: master-secret}}
            # ★ cert-manager 가 발급한 인증서를 쓴다. 없으면 이미지가 기동마다
            #   자체 서명 인증서를 만들고 SAN 에 **파드 이름과 localhost 만**
            #   넣어, `knox-headless` 로 붙는 JDBC 클라이언트가 전부 끊긴다
            #   (SSLPeerUnverifiedException) — §8-66.
            - {name: KNOX_CERT, value: /etc/knox/tls/tls.crt}
            - {name: KNOX_KEY,  value: /etc/knox/tls/tls.key}
            # ★ KNOX_CERT/KNOX_KEY 를 주면 entrypoint 가 그것으로 PKCS12 를
            #   만드는데, 그때 `-passout file:${KEYSTORE_PASSWORD_FILE}` 을 쓴다.
            #   이 변수를 안 주면 빈 경로가 되어 `Can't open file` →
            #   `Error getting passwords` 로 **CrashLoop 한다**(실측).
            #   MASTER_SECRET 과 같은 값을 파일로 마운트해 쓴다.
            - {name: KEYSTORE_PASSWORD_FILE, value: /etc/knox/pw/master-secret}
          ports:
            - {containerPort: 8443, name: https, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits:   {cpu: 500m, memory: 1Gi}
          startupProbe:
            tcpSocket: {port: https}
            failureThreshold: 40
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: https}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            # ★ tcpSocket 이었다 — 포트만 열려 있으면 통과해서, 토폴로지가
            #   아무것도 프록시하지 않는 4일 동안 1/1 Running 이었다(§8-65).
            #   최소한 게이트웨이가 HTTP 로 응답하는지는 본다.
            #
            # ★ 왜 /gateway/oim/... 을 찌르지 않는가
            #   그 경로는 인증이 걸려 있어 자격증명 없이는 **401** 이고,
            #   kubelet 의 httpGet 은 **2xx·3xx 만 성공**으로 본다. 401 을
            #   기대하는 probe 는 영원히 Ready 가 되지 않는다. 자격증명을
            #   probe 에 넣는 것은 그 자체로 나쁘다.
            #   homepage 는 인증 없이 301 을 돌려주므로 "게이트웨이가 토폴로지를
            #   적재하고 서빙 중" 까지는 증명한다. oim 토폴로지 자체의 동작은
            #   scripts/ 의 검증이나 §8-66 의 절차로 확인한다.
            httpGet:
              path: /gateway/homepage/home
              port: https
              scheme: HTTPS
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            # ★ 토폴로지 — subPath 로 **파일 하나만** 넣는다. 디렉터리를 통째로
            #   마운트하면 이미지 기본 토폴로지(homepage·admin·manager·knoxsso)가
            #   가려져 Knox 자체 UI 와 관리 API 가 사라진다.
            - name: tls
              mountPath: /etc/knox/tls
              readOnly: true
            - name: keystore-pw
              mountPath: /etc/knox/pw
              readOnly: true
            - name: topology
              mountPath: /home/knox/knox/conf/topologies/oim.xml
              subPath: oim.xml
              readOnly: true
            # 기동 시 생성되는 키스토어·트러스트스토어. 파드 수명과 같이 간다.
            # 매 기동마다 자체 서명 인증서가 새로 생긴다 — 앞단에 실 인증서를
            # 둘 때(Gateway/Ingress 도입 시) KNOX_CERT·KNOX_KEY 로 바꾼다.
            - {name: keystores, mountPath: /home/knox/knox/data/security/keystores}
            - {name: logs, mountPath: /home/knox/knox/logs}
      volumes:
        - name: tls
          secret:
            secretName: knox-tls
        - name: keystore-pw
          secret:
            secretName: knox-secret
            items:
              - {key: master-secret, path: master-secret}
        - name: topology
          configMap:
            name: knox-topology
        - name: keystores
          emptyDir: {}
        - name: logs
          emptyDir: {}
