# Knox 토폴로지 — 이 클러스터의 서비스를 가리킨다
#
# ★ 왜 필요한가 (§8-65)
#   이 ConfigMap 이 없을 때 Knox 는 **이미지 기본 토폴로지**로 돌았다.
#   `sandbox.xml` 이 `hdfs://localhost:8020` · `http://localhost:50070/webhdfs`
#   (Hortonworks Sandbox 데모 주소)를 가리켜 **아무것도 프록시하지 않았다.**
#   게다가 기본 토폴로지의 인증은 데모 LDAP 을 보는데 그 프로세스가 돌지
#   않아 **모든 요청이 401** 이었다. 그런데 readinessProbe 가 tcpSocket 이라
#   `1/1 Running` 으로 보였다.
#
# ★ 인증은 DS389 를 직접 본다
#   `KnoxLdapRealm` + `userDnTemplate` 방식이라 **바인드 계정이 필요 없다** —
#   Shiro 가 호출자 자격으로 직접 bind 한다. 그래서 이 파일에 비밀번호가
#   들어가지 않는다.
#   DS389 실측 구조: suffix `dc=oneinchmarket,dc=co,dc=kr`,
#   사용자 `ou=people`, 그룹 `ou=groups`.
#
# ★ 담긴 서비스와 빠진 것
#   WEBHDFS  — 그대로 붙는다(namenode:9870). 실측 200 확인
#   HIVE     — Knox 는 **HTTP transport** 만 지원한다. 그래서 HiveServer2 를
#              binary(10000) → http(10001, path=cliservice)로 바꿨다.
#              10000 을 쓰는 소비자가 없어 안전했다(Trino·Spark 는 메타스토어
#              9083 을 직접 본다)
#   WEBHBASE — **HBase REST 서버(Stargate)** 를 새로 배포해 붙였다
#              (`hbase-rest:8085`). 16010 은 마스터 UI 이고 16000 은 RPC 라
#              Knox 가 쓸 수 없다. 파드 상한을 200 으로 올린 뒤에야 자리가 났다
apiVersion: v1
kind: ConfigMap
metadata:
  name: knox-topology
  labels:
    app.kubernetes.io/name: knox
    app.kubernetes.io/component: governance
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
data:
  oim.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <topology>
        <gateway>
            <!-- 인증 — DS389 LDAP 에 직접 bind 한다 -->
            <provider>
                <role>authentication</role>
                <name>ShiroProvider</name>
                <enabled>true</enabled>
                <param>
                    <name>sessionTimeout</name>
                    <value>30</value>
                </param>
                <param>
                    <name>main.ldapContextFactory</name>
                    <value>org.apache.knox.gateway.shirorealm.KnoxLdapContextFactory</value>
                </param>
                <param>
                    <name>main.ldapRealm</name>
                    <value>org.apache.knox.gateway.shirorealm.KnoxLdapRealm</value>
                </param>
                <param>
                    <name>main.ldapRealm.contextFactory</name>
                    <value>$ldapContextFactory</value>
                </param>
                <param>
                    <name>main.ldapRealm.contextFactory.url</name>
                    <value>ldap://ds389-headless:3389</value>
                </param>
                <param>
                    <name>main.ldapRealm.contextFactory.authenticationMechanism</name>
                    <value>simple</value>
                </param>
                <!-- 바인드 계정이 필요 없는 방식 — 호출자로 직접 bind 한다 -->
                <param>
                    <name>main.ldapRealm.userDnTemplate</name>
                    <value>uid={0},ou=people,dc=oneinchmarket,dc=co,dc=kr</value>
                </param>
                <param>
                    <name>urls./**</name>
                    <value>authcBasic</value>
                </param>
            </provider>

            <!-- 신원 전달 — 인증된 사용자 이름을 그대로 백엔드로 넘긴다.
                 Ranger 플러그인이 붙으면 이 이름으로 정책이 평가된다. -->
            <provider>
                <role>identity-assertion</role>
                <name>Default</name>
                <enabled>true</enabled>
            </provider>

            <!-- ★ 데이터 인가는 각 서비스의 Ranger 플러그인이 한다 — HDFS
                 NameNode·HiveServer2·HBase 셋 다에 들어 있다(§8-67~70).
                 Ranger 서비스 정의는 local/ranger-bootstrap.sh 가 넣는다.

                 ★★ WEBHBASE 만은 예외라 여기서 사람을 거른다.
                 HBase REST 는 simple 인증에서 Knox 가 넘긴 user.name 을 버리고
                 자기 계정(hbase-rest)으로만 돈다 — 사용자 식별 필터가
                 Kerberos 에서만 붙기 때문이다(hbase-rest-deployment.yaml).
                 그래서 Ranger 는 "REST 경로 전체" 의 권한(읽기·쓰기)만 정할 수
                 있고 **누가** 그 경로를 쓰는지는 여기서 정한다.
                 값의 형식은 `사용자들;그룹들;IP들`(쉼표 구분, * 는 전부)이다.
                 ★ 그룹으로 쓰지 않은 이유: KnoxLdapRealm 의 그룹 조회는 시스템
                   바인드 계정이 필요하고(DS389 는 익명 검색에 그룹을 보여주지
                   않는다 — 실측 0건), 이 토폴로지는 비밀번호를 담지 않는다.
                 ★ ranger-sync 를 넣지 말 것 — DS389 에서 **읽기 전용**으로 만든
                   동기화 계정이다. 여기 넣으면 HBase 쓰기 권한을 얻는다.
                 ★ 지금 목록의 oim-svc 는 비밀번호가 없는 스모크 픽스처라
                   **사실상 아무도 통과하지 못한다**(닫힌 것이 기본값이다).
                   쓸 사람이 생기면 DS389 계정을 만들고 여기에 더할 것.
                 다른 서비스(WEBHDFS·HIVE)는 acl 이 없어 이 필터를 그냥 통과한다. -->
            <provider>
                <role>authorization</role>
                <name>AclsAuthz</name>
                <enabled>true</enabled>
                <param>
                    <name>webhbase.acl</name>
                    <value>oim-svc;*;*</value>
                </param>
            </provider>
        </gateway>

        <service>
            <role>WEBHDFS</role>
            <url>http://hadoop-namenode:9870/webhdfs</url>
        </service>

        <!-- HiveServer2 — HTTP transport 로 바꾼 뒤에야 붙는다.
             JDBC: jdbc:hive2://<knox>:8443/;ssl=true;transportMode=http;
                   httpPath=gateway/oim/hive -->
        <service>
            <role>HIVE</role>
            <url>http://hive-server-headless:10001/cliservice</url>
        </service>

        <!-- HBase REST(Stargate). 마스터 UI(16010)·RPC(16000)로는 안 된다 -->
        <service>
            <role>WEBHBASE</role>
            <url>http://hbase-rest:8085</url>
        </service>
    </topology>
  # ★★ KnoxSSO(2026-11-03) — 홈페이지(/gateway/homepage/home/)·관리 UI 가 로그인하는 토폴로지.
  #   이미지 기본값은 **데모 LDAP**(ldap://localhost:33389 · dc=hadoop,dc=apache,dc=org)을 봐서
  #   DS389 사용자가 로그인할 수 없었다(실측: analyst 로 websso 401). 위 sandbox 와 같은 사연이다.
  #   oim.xml 과 같은 DS389 무바인드 방식(userDnTemplate)으로 바꾼다 — 비밀번호가 들어가지 않는다.
  #   ★ knoxsso.redirect.whitelist.regex 를 명시한다 — 로그인 뒤 돌아갈 originalUrl 이 허용 목록에
  #     없으면 Knox 가 400 으로 거부한다. 외부 호스트 체계(*.oneinchmarket.local)와 상대 경로만 허용한다.
  #     ★ 경로 부분은 **선택**이어야 한다 — Knox 는 originalUrl 의 경로를 떼고 기준 URL
  #     (`https://knox.oneinchmarket.local`)만 대조한다. 끝에 `/.*` 를 요구하면 맞지 않는다(실측 400 ·
  #     로그 `is not valid according to the configured whitelist`).
  #   ★ deployment 가 subPath 로 이 파일 하나만 덮는다(homepage·manager·admin 은 이미지 기본 그대로).
  knoxsso.xml: |
    <?xml version="1.0" encoding="utf-8"?>
    <topology>
        <gateway>
            <provider>
                <role>webappsec</role>
                <name>WebAppSec</name>
                <enabled>true</enabled>
                <param><name>xframe.options.enabled</name><value>true</value></param>
            </provider>
            <provider>
                <role>authentication</role>
                <name>ShiroProvider</name>
                <enabled>true</enabled>
                <param><name>sessionTimeout</name><value>30</value></param>
                <param><name>redirectToUrl</name><value>/${GATEWAY_PATH}/knoxsso/knoxauth/login.html</value></param>
                <param><name>restrictedCookies</name><value>rememberme,WWW-Authenticate</value></param>
                <param><name>main.ldapRealm</name><value>org.apache.knox.gateway.shirorealm.KnoxLdapRealm</value></param>
                <param><name>main.ldapContextFactory</name><value>org.apache.knox.gateway.shirorealm.KnoxLdapContextFactory</value></param>
                <param><name>main.ldapRealm.contextFactory</name><value>$ldapContextFactory</value></param>
                <param><name>main.ldapRealm.userDnTemplate</name><value>uid={0},ou=people,dc=oneinchmarket,dc=co,dc=kr</value></param>
                <param><name>main.ldapRealm.contextFactory.url</name><value>ldap://ds389-headless:3389</value></param>
                <param><name>main.ldapRealm.authenticationCachingEnabled</name><value>false</value></param>
                <param><name>main.ldapRealm.contextFactory.authenticationMechanism</name><value>simple</value></param>
                <param><name>urls./**</name><value>authcBasic</value></param>
            </provider>
            <provider>
                <role>identity-assertion</role>
                <name>Default</name>
                <enabled>true</enabled>
            </provider>
        </gateway>
        <application>
            <name>knoxauth</name>
        </application>
        <service>
            <role>KNOXSSO</role>
            <param><name>knoxsso.cookie.secure.only</name><value>true</value></param>
            <param><name>knoxsso.token.ttl</name><value>86400000</value></param>
            <param><name>knox.token.exp.server-managed</name><value>false</value></param>
            <param><name>knoxsso.redirect.whitelist.regex</name><value>^(https://([a-z0-9-]+\.)*oneinchmarket\.local(:443)?)?(/.*)?$</value></param>
        </service>
    </topology>
