apiVersion: apps/v1
kind: Deployment
metadata:
  name: ranger-usersync
  labels: {app.kubernetes.io/name: ranger-usersync, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ranger-usersync}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ranger-usersync, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket}
    spec:
      serviceAccountName: ranger-usersync
      securityContext:
        # ★ apache/ranger-base 의 ranger 는 uid 1000 이다.
        #   apache/ranger(admin) 는 1001 이라 헷갈리기 쉽다. 1001 로 두면
        #   /opt/ranger/usersync 가 1000 소유라 install.properties 를
        #   쓰지 못하고 "Permission denied" 로 CrashLoop 한다.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              echo "[wait] Ranger admin(ranger-admin:6080)"
              until nc -z ranger-admin 6080; do sleep 3; done
              echo "[wait] DS389(ds389-headless:3389)"
              until nc -z ds389-headless 3389; do sleep 3; done
              echo "[wait] 완료"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits:   {cpu: 100m, memory: 64Mi}
      containers:
        - name: ranger-usersync
          # 로컬 빌드다. upstream 의 Dockerfile.ranger-usersync 를 옮긴
          # docker/ranger-usersync 를 local/build-images.sh 가 만든다.
          # 공식 이미지가 없다 — apache/ranger 는 admin 만 담고 있다.
          image: oneinch/ranger-usersync:latest
          imagePullPolicy: IfNotPresent
          # ★ 엔트리포인트를 감싸는 이유 —
          #   upstream 의 ranger-usersync.sh 는 ${RANGER_HOME}/usersync/
          #   install.properties 를 읽는데, 그 파일에 LDAP bind 비밀번호와
          #   rangerusersync 비밀번호가 들어간다. ConfigMap 에 평문으로 둘 수
          #   없어 템플릿을 두고 여기서 Secret 값으로 치환한다.
          #   치환 후에는 upstream 스크립트를 그대로 exec 한다.
          command: ["/bin/bash","-c"]
          args:
            - |
              set -euo pipefail
              TMPL=/etc/ranger-usersync/install.properties.tmpl
              DEST="${RANGER_HOME}/usersync/install.properties"
              sed -e "s|__RANGER_USERSYNC_PASSWORD__|${RANGER_USERSYNC_PASSWORD}|" \
                  -e "s|__LDAP_BIND_PASSWORD__|${LDAP_BIND_PASSWORD}|" \
                  "$TMPL" > "$DEST"
              chmod 600 "$DEST"
              echo "[usersync] install.properties 생성 (비밀번호 2건 치환)"
              # ranger-usersync-services.sh 가 ${RANGER_HOME}/usersync/logs/auth.log
              # 에 쓴다. 이미지에는 그 디렉터리가 없어 기동이 실패한다.
              mkdir -p "${RANGER_HOME}/usersync/logs"
              touch    "${RANGER_HOME}/usersync/logs/auth.log"
              exec "${RANGER_SCRIPTS}/ranger-usersync.sh"
          env:
            - name: RANGER_USERSYNC_PASSWORD
              valueFrom: {secretKeyRef: {name: ranger-secret, key: db-password}}
            # ★ dm-password(root DN)가 아니라 동기화 전용 계정의 비밀번호다.
            #   ds389-bootstrap 이 uid=ranger-sync 를 만들고 ACI 로 읽기만
            #   허용한다. 키 이름이 바뀌었으므로 ds389-secret 에 sync-password
            #   가 없으면 파드가 기동하지 않는다 — 의도된 것이다.
            #   조용히 root 자격으로 되돌아가는 것보다 낫다.
            - name: LDAP_BIND_PASSWORD
              valueFrom: {secretKeyRef: {name: ds389-secret, key: sync-password}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits:   {cpu: 500m, memory: 768Mi}
          # 포트를 열지 않는다(폴링 클라이언트다). 프로세스 생존으로 판정한다.
          # startupProbe 대신 initialDelaySeconds 로 기동 여유를 준다 —
          # exec 프로브라 startupProbe 를 따로 두어도 같은 명령을 반복할 뿐이다.
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pgrep -f org.apache.ranger.authentication.UnixAuthenticationService >/dev/null
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - pgrep -f org.apache.ranger.authentication.UnixAuthenticationService >/dev/null
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          # ★ /var/log/ranger/usersync 와 /var/run/ranger 에 볼륨을 걸지 말 것.
          #   setup.py:492 가 두 디렉터리에 os.chown 을 건다. emptyDir 는
          #   root:fsGroup 소유로 붙으므로 비특권 uid 가 소유자를 바꾸려면
          #   CAP_CHOWN 이 필요해 EPERM 이 난다:
          #     PermissionError: [Errno 1] Operation not permitted:
          #       '/var/log/ranger/usersync'
          #   이미지가 이미 두 디렉터리를 ranger 소유로 만들어 둔다.
          #   자기 소유 파일에 같은 uid/gid 로 chown 하는 것은 허용된다.
          volumeMounts:
            - {name: config, mountPath: /etc/ranger-usersync}
      volumes:
        - name: config
          configMap: {name: ranger-usersync-config}
