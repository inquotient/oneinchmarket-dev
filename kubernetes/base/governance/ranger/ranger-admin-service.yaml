apiVersion: v1
kind: ServiceAccount
metadata:
  name: ranger-admin
  labels: {app.kubernetes.io/name: ranger-admin, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
automountServiceAccountToken: false
---
# ★ 이름을 이미지의 기본값에 맞춘다.
#   install.properties 에 policymgr_external_url=http://ranger-admin:6080 이
#   구워져 있다. 헤드리스가 아니라 ClusterIP 여야 그 URL 이 성립한다.
apiVersion: v1
kind: Service
metadata:
  name: ranger-admin
  labels: {app.kubernetes.io/name: ranger-admin, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  ports: [{name: http, port: 6080, targetPort: 6080, protocol: TCP}]
  selector: {app.kubernetes.io/name: ranger-admin}
---
# ★ 별칭 서비스 — install.properties 의 db_host=ranger-db 를 그대로 쓴다.
#   PostgreSQL 파드를 직접 가리킨다. 별도 DB 인스턴스가 아니다.
apiVersion: v1
kind: Service
metadata:
  name: ranger-db
  labels: {app.kubernetes.io/name: ranger-admin, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  ports: [{name: postgres, port: 5432, targetPort: 5432, protocol: TCP}]
  selector: {app.kubernetes.io/name: postgresql}
