apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ranger-admin
  labels: {app.kubernetes.io/name: ranger-admin, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  serviceName: ranger-admin
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ranger-admin}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ranger-admin, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket}
    spec:
      serviceAccountName: ranger-admin
      securityContext:
        # apache/ranger 이미지의 기본 uid 다.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      # ranger.sh 는 의존성을 기다리지 않는다. setup.sh 가 DB 에 못 붙으면
      # 그대로 실패하고 컨테이너가 죽는다. 여기서 막는다.
      initContainers:
        - name: wait-deps
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              echo "[wait] PostgreSQL(ranger-db:5432)"
              until nc -z ranger-db 5432; do sleep 3; done
              echo "[wait] Solr(ranger-solr:8983)"
              until nc -z ranger-solr 8983; do sleep 3; done
              echo "[wait] 완료"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits:   {cpu: 100m, memory: 64Mi}
      containers:
        - name: ranger-admin
          image: apache/ranger:2.9.0
          # ── 이미지에 구워진 install.properties 를 그대로 쓴다 ──────
          #   DB_FLAVOR=POSTGRES · db_host=ranger-db · db_name=ranger
          #   audit_store=solr · audit_solr_urls=http://ranger-solr:8983/...
          #   policymgr_external_url=http://ranger-admin:6080
          #   -> 별칭 서비스로 이름을 맞췄으므로 덮어쓸 것이 없다.
          #   엔트리포인트(ranger.sh)가 아래 변수들을 읽는다.
          #
          # ★ 엔트리포인트를 감싸 자격을 분리한다.
          #   ranger.sh 는 네 자격을 전부 ${RANGER_DB_PASSWORD} 로 쓴다.
          #   그 줄만 각각의 변수로 바꿔치기한 뒤 원래 엔트리포인트를 exec 한다.
          #
          # ★★ sed 가 하나라도 맞지 않으면 **기동을 멈춘다.** 그냥 넘어가면
          #    자격이 조용히 다시 합쳐진 채로 뜬다 — 그것이 이 변경으로 없애려는
          #    상태 그 자체다. 이미지 태그를 올릴 때 엔트리포인트가 바뀌면
          #    여기서 걸린다.
          #
          # ★ 이미 초기화된 인스턴스에는 효과가 없다. ranger.sh 는
          #   ${RANGER_HOME}/.setupDone 이 있으면 setup 을 건너뛴다.
          #   기존 인스턴스는 changepasswordutil.py 로 따로 회전한다(§8-44).
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              S=/home/ranger/scripts/ranger.sh
              sed -i \
                -e 's|rangerAdmin_password=${RANGER_DB_PASSWORD}|rangerAdmin_password=${RANGER_ADMIN_PASSWORD}|' \
                -e 's|rangerTagsync_password=${RANGER_DB_PASSWORD}|rangerTagsync_password=${RANGER_TAGSYNC_PASSWORD}|' \
                -e 's|rangerUsersync_password=${RANGER_DB_PASSWORD}|rangerUsersync_password=${RANGER_USERSYNC_PASSWORD}|' \
                -e 's|keyadmin_password=${RANGER_DB_PASSWORD}|keyadmin_password=${RANGER_KEYADMIN_PASSWORD}|' \
                "$S"
              for v in RANGER_ADMIN_PASSWORD RANGER_TAGSYNC_PASSWORD RANGER_USERSYNC_PASSWORD RANGER_KEYADMIN_PASSWORD; do
                grep -q "$v" "$S" || {
                  echo "[ranger-admin] 자격 분리 실패: $v 치환이 적용되지 않았다." >&2
                  echo "[ranger-admin] 엔트리포인트가 바뀌었을 수 있다. 자격이 합쳐진 채 기동하지 않는다." >&2
                  exit 1
                }
              done
              echo "[ranger-admin] 자격 분리 적용 완료 (4건)"
              exec /bin/bash "$S"
          env:
            - name: POSTGRES_PASSWORD          # db_root_password. setup.sh 가 스키마를 만든다
              valueFrom: {secretKeyRef: {name: postgresql-secret, key: postgresql-password}}
            - {name: RANGER_DB_USER, value: "ranger"}
            - name: RANGER_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: ranger-secret, key: db-password}}
            # ★ 자격 분리 — 아래 넷은 원래 전부 RANGER_DB_PASSWORD 였다.
            #   이미지 엔트리포인트가 그렇게 쓴다:
            #     echo "rangerAdmin_password=${RANGER_DB_PASSWORD}"
            #     echo "rangerTagsync_password=${RANGER_DB_PASSWORD}"
            #     echo "rangerUsersync_password=${RANGER_DB_PASSWORD}"
            #     echo "keyadmin_password=${RANGER_DB_PASSWORD}"
            #
            #   즉 **DB 자격이 곧 관리자 자격**이었다. PostgreSQL 접속 문자열이
            #   새면 정책 엔진의 관리자 권한과 KMS 키 관리자(keyadmin)까지
            #   함께 샌다. 회전도 불가능하다 — 하나를 바꾸려면 다섯을 함께
            #   바꿔야 한다.
            - name: RANGER_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: ranger-secret, key: admin-password}}
            - name: RANGER_TAGSYNC_PASSWORD
              valueFrom: {secretKeyRef: {name: ranger-secret, key: tagsync-password}}
            - name: RANGER_USERSYNC_PASSWORD
              valueFrom: {secretKeyRef: {name: ranger-secret, key: usersync-password}}
            - name: RANGER_KEYADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: ranger-secret, key: keyadmin-password}}
          ports:
            - {containerPort: 6080, name: http, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            # install.properties 의 ranger_admin_max_heap_size=1g 에 맞춘다.
            requests: {cpu: 200m, memory: 1Gi}
            limits:   {cpu: "1",  memory: 2Gi}
          # ★ 최초 기동은 스키마 생성(setup.sh) 때문에 몇 분 걸린다.
          #   startup 40회 x 15초 = 10분까지 허용한다.
          startupProbe:
            tcpSocket: {port: http}
            failureThreshold: 40
            periodSeconds: 15
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /login.jsp, port: http}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
