apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ranger-admin
  labels: {app.kubernetes.io/name: ranger-admin, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  serviceName: ranger-admin
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ranger-admin}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ranger-admin, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket, istio.io/dataplane-mode: ambient}
    spec:
      serviceAccountName: ranger-admin
      securityContext:
        # apache/ranger 이미지의 기본 uid 다.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      # ranger.sh 는 의존성을 기다리지 않는다. setup.sh 가 DB 에 못 붙으면
      # 그대로 실패하고 컨테이너가 죽는다. 여기서 막는다.
      initContainers:
        - name: wait-deps
          image: busybox:1.38.0
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              echo "[wait] PostgreSQL(ranger-db:5432)"
              until nc -z ranger-db 5432; do sleep 3; done
              echo "[wait] Solr(ranger-solr:8983)"
              until nc -z ranger-solr 8983; do sleep 3; done
              echo "[wait] 완료"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits:   {cpu: 100m, memory: 64Mi}
      containers:
        - name: ranger-admin
          image: apache/ranger:2.9.0
          # ── 이미지에 구워진 install.properties 를 그대로 쓴다 ──────
          #   DB_FLAVOR=POSTGRES · db_host=ranger-db · db_name=ranger
          #   audit_store=solr · audit_solr_urls=http://ranger-solr:8983/...
          #   policymgr_external_url=http://ranger-admin:6080
          #   -> 별칭 서비스로 이름을 맞췄으므로 덮어쓸 것이 없다.
          #   엔트리포인트(ranger.sh)가 아래 변수들을 읽는다.
          #
          # ★ 엔트리포인트를 감싸 자격을 분리한다.
          #   ranger.sh 는 네 자격을 전부 ${RANGER_DB_PASSWORD} 로 쓴다.
          #   그 줄만 각각의 변수로 바꿔치기한 뒤 원래 엔트리포인트를 exec 한다.
          #
          # ★★ sed 가 하나라도 맞지 않으면 **기동을 멈춘다.** 그냥 넘어가면
          #    자격이 조용히 다시 합쳐진 채로 뜬다 — 그것이 이 변경으로 없애려는
          #    상태 그 자체다. 이미지 태그를 올릴 때 엔트리포인트가 바뀌면
          #    여기서 걸린다.
          #
          # ★ 이미 초기화된 인스턴스에는 효과가 없다. ranger.sh 는
          #   ${RANGER_HOME}/.setupDone 이 있으면 setup 을 건너뛴다.
          #   기존 인스턴스는 changepasswordutil.py 로 따로 회전한다(§8-44).
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -e
              # ★ 이미지 템플릿을 ConfigMap 것으로 갈아끼운다.
              #   ranger.sh 는 ${RANGER_SCRIPTS}/ranger-admin-install.properties
              #   를 그대로 복사해 쓴다. 그 파일을 우리 것으로 바꾸면 Ranger 의
              #   정적 설정 전체를 매니페스트에서 통제할 수 있다 —
              #   authentication_method 가 그 안에 있다.
              #   LDAP bind 비밀번호만 치환한다(ConfigMap 에 둘 수 없다).
              T=/etc/ranger-admin/install.properties.tmpl
              D="${RANGER_SCRIPTS}/ranger-admin-install.properties"
              sed -e "s|__LDAP_BIND_PASSWORD__|${LDAP_BIND_PASSWORD}|" "$T" > "$D"
              chmod 600 "$D"
              grep -q '^authentication_method=LDAP' "$D" || {
                echo "[ranger-admin] install.properties 교체 실패." >&2
                echo "[ranger-admin] 이미지 기본값(UNIX)으로 뜨면 LDAP 사용자가" >&2
                echo "[ranger-admin] 로그인할 수 없다. 기동하지 않는다." >&2
                exit 1
              }
              echo "[ranger-admin] install.properties 교체 완료 (authentication_method=LDAP)"
              S=/home/ranger/scripts/ranger.sh
              sed -i \
                -e 's|rangerAdmin_password=${RANGER_DB_PASSWORD}|rangerAdmin_password=${RANGER_ADMIN_PASSWORD}|' \
                -e 's|rangerTagsync_password=${RANGER_DB_PASSWORD}|rangerTagsync_password=${RANGER_TAGSYNC_PASSWORD}|' \
                -e 's|rangerUsersync_password=${RANGER_DB_PASSWORD}|rangerUsersync_password=${RANGER_USERSYNC_PASSWORD}|' \
                -e 's|keyadmin_password=${RANGER_DB_PASSWORD}|keyadmin_password=${RANGER_KEYADMIN_PASSWORD}|' \
                "$S"
              for v in RANGER_ADMIN_PASSWORD RANGER_TAGSYNC_PASSWORD RANGER_USERSYNC_PASSWORD RANGER_KEYADMIN_PASSWORD; do
                grep -q "$v" "$S" || {
                  echo "[ranger-admin] 자격 분리 실패: $v 치환이 적용되지 않았다." >&2
                  echo "[ranger-admin] 엔트리포인트가 바뀌었을 수 있다. 자격이 합쳐진 채 기동하지 않는다." >&2
                  exit 1
                }
              done
              echo "[ranger-admin] 자격 분리 적용 완료 (4건)"
              # ★★ 이미지의 데모 서비스 부트스트랩을 끈다 — 이것이 admin 을
              #    잠가 왔다 (§8-67)
              #
              #   create-ranger-services.py 의 5번째 줄이 관리자 자격을
              #   **하드코딩**한다:
              #     RangerClient('http://localhost:6080', ('admin', 'rangerR0cks!'))
              #   우리는 위에서 자격을 분리해 실제 비밀번호를 쓰므로 이 스크립트의
              #   서비스 등록 9건이 **전부 401** 이고, 그 연속 실패가
              #   **admin 계정을 영구히 잠근다**(Gotcha 11 · §8-48).
              #
              #   ★ 그리고 이것은 1회성 사고가 아니다. `.setupDone` 이 PVC 에
              #     없으므로 setup 은 **파드를 새로 만들 때마다** 돈다. 즉
              #     재기동할 때마다 관리자가 다시 잠겼다. 실측(x_auth_sess):
              #     한 번의 기동에서 auth_status=2 가 연달아 쌓인 뒤 4(잠김)로
              #     바뀌었고, 잠금은 DB 에 남아 파드를 다시 띄워도 풀리지 않는다.
              #
              #   만드는 것도 dev_hdfs·dev_knox 같은 데모 서비스이고 자격이
              #   hdfs/hdfs 따위라 이 클러스터에 쓸모가 없다. 통째로 끈다.
              sed -i 's|^  python3 ${RANGER_SCRIPTS}/create-ranger-services.py|  echo "[ranger-admin] 데모 서비스 부트스트랩은 끈다 — admin 을 잠근다(§8-67)"|' "$S"
              if grep -q "create-ranger-services" "$S"; then
                echo "[ranger-admin] 데모 부트스트랩 제거 실패." >&2
                echo "[ranger-admin] 이대로 기동하면 admin 계정이 영구히 잠긴다." >&2
                echo "[ranger-admin] 엔트리포인트가 바뀌었을 수 있다. 기동하지 않는다." >&2
                exit 1
              fi
              echo "[ranger-admin] 데모 서비스 부트스트랩 제거 완료"
              # ★★ 정책 다운로드를 열어 준다 (§8-67)
              #
              #   플러그인이 정책을 못 받는 원인은 자격이 아니었다. 실측:
              #   **admin 의 올바른 자격으로도** 같은 400 이 난다.
              #     {"statusCode":400,"msgDesc":"Unauthenticated access not allowed"}
              #   반면 같은 자격으로 /service/xusers/users/... 는 200 이다.
              #
              #   security-applicationContext.xml 이 그 경로만 통째로 뺀다:
              #     <security:http pattern="/service/plugins/policies/download/*"
              #                    security="none"/>
              #   Spring Security 가 아예 돌지 않으니 UserSession 이 만들어지지
              #   않고, RangerBizUtil.failUnauthenticatedDownloadIfNotAllowed()
              #   는 **세션이 null 이면** 무조건 던진다(바이트코드로 확인했다).
              #   즉 basic auth 로는 절대 통과할 수 없는 경로다 — 원래 이 자리는
              #   Kerberos SPNEGO 가 막게 되어 있고 이 클러스터는 비-Kerberos 다.
              #   남는 유일한 스위치가 이 속성이다.
              #
              #   ★ 무엇이 열리는가 — **읽기 전용 다운로드 3종**뿐이다
              #     (/service/plugins/policies/download · /service/tags/download ·
              #      /service/roles/download). 정책 생성·수정·삭제와 관리 API 는
              #     그대로 인증을 요구한다.
              #   ★ 무엇을 막지 못하는가 — ambient 편입 때문에 실제 트래픽은
              #     15008(HBONE)로 흐르고 6080 NetworkPolicy 는 우회된다
              #     (Gotcha 13). ranger-admin 을 선택하는 AuthorizationPolicy 도
              #     없다. 그래서 지금은 **메시 안의 아무 워크로드나 정책 전문을
              #     읽을 수 있다.** 여기에 ALLOW 정책을 다는 것은 별개 작업이다 —
              #     달면 신원이 없는 kubectl port-forward 경로가 함께 끊겨
              #     Ranger UI 접근(ACCESS.md)이 죽는다. Gotcha 10 과 같은 함정이다.
              #   ★ 고쳐야 하는 것은 conf/ 가 아니라 **conf.dist/** 다.
              #     `conf/` 는 setup.sh 가 conf.dist 를 복사해야 비로소 생기고,
              #     이 훅은 setup 보다 먼저 돈다. 실측으로 conf/ 를 고치려다
              #     `No such file or directory` 가 났고 가드가 기동을 막았다 —
              #     가드가 제 일을 한 것이다. 재기동이나 PVC 도입으로 conf/ 가
              #     이미 있는 경우도 있으므로 있으면 함께 고친다.
              W=/opt/ranger/admin/ews/webapp/WEB-INF/classes
              for F in "$W/conf.dist/ranger-admin-default-site.xml" \
                       "$W/conf/ranger-admin-default-site.xml"; do
                [ -f "$F" ] || continue
                awk '/ranger[.]admin[.]allow[.]unauthenticated[.]download[.]access/{h=1} h && /<value>false<\/value>/ && !d {sub(/<value>false<\/value>/,"<value>true</value>"); d=1; h=0} {print}' \
                  "$F" > "$F.new" && mv "$F.new" "$F"
                grep -A1 'ranger[.]admin[.]allow[.]unauthenticated[.]download[.]access' "$F" \
                  | grep -q '<value>true</value>' || {
                  echo "[ranger-admin] 정책 다운로드 허용 적용 실패: $F" >&2
                  echo "[ranger-admin] 이 값이 false 면 플러그인이 정책을 한 건도 받지" >&2
                  echo "[ranger-admin] 못하고, 그 상태의 플러그인은 **모든 접근을 거부**한다." >&2
                  echo "[ranger-admin] 조용히 뜨지 않는다." >&2
                  exit 1
                }
                echo "[ranger-admin] 정책 다운로드 허용 적용: $F"
                APPLIED=1
              done
              [ "${APPLIED:-0}" = "1" ] || {
                echo "[ranger-admin] ranger-admin-default-site.xml 을 어디서도 찾지 못했다." >&2
                echo "[ranger-admin] 이미지 레이아웃이 바뀌었을 수 있다. 기동하지 않는다." >&2
                exit 1
              }
              exec /bin/bash "$S"
          env:
            - name: POSTGRES_PASSWORD          # db_root_password. setup.sh 가 스키마를 만든다
              valueFrom: {secretKeyRef: {name: postgresql-secret, key: postgresql-password}}
            - {name: RANGER_DB_USER, value: "ranger"}
            - name: RANGER_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: ranger-secret, key: db-password}}
            # ★ 자격 분리 — 아래 넷은 원래 전부 RANGER_DB_PASSWORD 였다.
            #   이미지 엔트리포인트가 그렇게 쓴다:
            #     echo "rangerAdmin_password=${RANGER_DB_PASSWORD}"
            #     echo "rangerTagsync_password=${RANGER_DB_PASSWORD}"
            #     echo "rangerUsersync_password=${RANGER_DB_PASSWORD}"
            #     echo "keyadmin_password=${RANGER_DB_PASSWORD}"
            #
            #   즉 **DB 자격이 곧 관리자 자격**이었다. PostgreSQL 접속 문자열이
            #   새면 정책 엔진의 관리자 권한과 KMS 키 관리자(keyadmin)까지
            #   함께 샌다. 회전도 불가능하다 — 하나를 바꾸려면 다섯을 함께
            #   바꿔야 한다.
            - name: RANGER_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: ranger-secret, key: admin-password}}
            - name: RANGER_TAGSYNC_PASSWORD
              valueFrom: {secretKeyRef: {name: ranger-secret, key: tagsync-password}}
            - name: RANGER_USERSYNC_PASSWORD
              valueFrom: {secretKeyRef: {name: ranger-secret, key: usersync-password}}
            # ★ LDAP 조회 전용 계정. dm-password(root DN)가 아니다.
            #   ds389-bootstrap 이 uid=ranger-sync 를 만들고 ACI 로 읽기만
            #   허용한다. usersync 와 같은 자격을 쓴다 — 둘 다 조회만 한다.
            - name: LDAP_BIND_PASSWORD
              valueFrom: {secretKeyRef: {name: ds389-secret, key: sync-password}}
            - name: RANGER_KEYADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: ranger-secret, key: keyadmin-password}}
          volumeMounts:
            - {name: config, mountPath: /etc/ranger-admin}
          ports:
            - {containerPort: 6080, name: http, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            # install.properties 의 ranger_admin_max_heap_size=1g 에 맞춘다.
            requests: {cpu: 200m, memory: 1Gi}
            limits:   {cpu: "1",  memory: 2Gi}
          # ★ 최초 기동은 스키마 생성(setup.sh) 때문에 몇 분 걸린다.
          #   startup 40회 x 15초 = 10분까지 허용한다.
          startupProbe:
            tcpSocket: {port: http}
            failureThreshold: 40
            periodSeconds: 15
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /login.jsp, port: http}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: config
          configMap: {name: ranger-admin-config}
