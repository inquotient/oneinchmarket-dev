# Solr(Ranger 감사 색인)에 닿을 수 있는 신원 (2026-11-03).
#
# ★★ 왜: Solr 자체 인증(BasicAuth)을 걷고 사람의 입구를 Knox 로 두었다(solr-statefulset.yaml
#   머리말). 그러면 Solr 를 지키는 것은 이 정책이다 — ambient 에서는 SA 가 곧 신원이고(Gotcha 10),
#   ALLOW 정책이 워크로드를 고르는 순간 목록에 없는 신원은 전부 거부된다.
#     knox            사람(DS389 로그인 + Ranger oim-knox 정책 — data-admin 만 SOLR 허용)
#     ranger-admin    Audit 탭의 감사 조회
#     trino·kafka·hadoop·hbase·hive-server   Ranger 플러그인의 감사 쓰기(hadoop=NameNode, hbase=master·RS)
#     solr-audit-purge                         30일 보존 정리
#   ★ 포트를 빠뜨리지 말 것 — ALLOW 정책이 고른 워크로드의 포트는 규칙에 없으면 닫힌다(Gotcha 9).
#   ★ principal 은 접미 매칭(`*/sa/<name>`)이다 — 중간 `*` 는 리터럴이라 아무것도 맞지 않는다(Gotcha 9).
#   ★ kubelet 의 프로브는 ztunnel 을 거치지 않아 이 정책과 무관하다.
#   ★ dev 는 ambient 가 꺼져 있어 이 정책이 효력이 없다 — 거기서는 NetworkPolicy(allow-solr-access)가
#     유일한 선이다.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: solr-authz
  labels: {app.kubernetes.io/name: solr-authz, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: solr}
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "*/sa/knox"
              - "*/sa/ranger-admin"
              - "*/sa/trino"
              - "*/sa/kafka"
              - "*/sa/hadoop"
              - "*/sa/hbase"
              - "*/sa/hive-server"
              - "*/sa/solr-audit-purge"
      to:
        - operation:
            ports: ["8983"]
