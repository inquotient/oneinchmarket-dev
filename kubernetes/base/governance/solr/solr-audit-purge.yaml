# Ranger 감사 색인 보존 기간 — 30일이 지난 감사 문서를 지운다 (2026-11-03).
#
# ★ 왜 CronJob 인가: Ranger 배포물의 configset 은 DocExpirationUpdateProcessorFactory 로
#   _ttl_ 기본값(+90DAYS)을 넣는데, 그 configset 은 Solr 8.4 용이라 쓰지 않았다(solr-statefulset.yaml
#   의 schema initContainer). 이 클러스터의 Solr 는 limit 1Gi · 디스크 10Gi 라 30일로 둔다.
#   HDFS·Kafka 감사는 양이 많으므로 쌓이는 속도를 보고 기간을 다시 정할 것.
# ★ Solr 에는 자체 인증이 없다 — 이 Job 의 SA(solr-audit-purge)가 solr-authz.yaml 의 허용
#   신원이라 닿는다. SA 를 바꾸면 그 정책도 함께 고칠 것.
# ★ 실패를 숨기지 않는다 — HTTP 200 이 아니면 Job 이 실패한다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: solr-audit-purge
  labels: {app.kubernetes.io/name: solr-audit-purge, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: solr-audit-purge
  labels: {app.kubernetes.io/name: solr-audit-purge, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  schedule: "40 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels: {app.kubernetes.io/name: solr-audit-purge, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket}
        spec:
          serviceAccountName: solr-audit-purge
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: purge
              image: docker.io/curlimages/curl:8.23.0
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  U=http://ranger-solr:8983/solr/ranger_audits
                  C="curl --connect-timeout 5 --max-time 120 -s"
                  count() { $C "$U/select?q=$1&rows=0&wt=json" | grep -o '"numFound":[0-9]*' | cut -d: -f2; }
                  before=$(count "evtTime:%5B*%20TO%20NOW-${RETENTION}%5D")
                  body="{\"delete\":{\"query\":\"evtTime:[* TO NOW-${RETENTION}]\"}}"
                  code=$($C -o /tmp/out -w '%{http_code}' -X POST "$U/update?commit=true" -H 'Content-Type: application/json' -d "$body")
                  [ "$code" = 200 ] || { echo "[purge] 실패 http=$code $(head -c 300 /tmp/out)" >&2; exit 1; }
                  left=$(count '*:*')
                  echo "[purge] 지운 문서 ${before:-?}건 (기준 NOW-${RETENTION}) · 남은 문서 ${left:-?}건"
              env:
                - {name: RETENTION, value: "30DAYS"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits:   {cpu: 100m, memory: 64Mi}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: tmp
              emptyDir: {medium: Memory, sizeLimit: 1Mi}
