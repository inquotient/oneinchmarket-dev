apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ds389
  labels: {app.kubernetes.io/name: ds389, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  serviceName: ds389-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: ds389}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ds389, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket}
    spec:
      serviceAccountName: ds389
      # ── 의도된 예외 ─────────────────────────────────────────────
      #   dscontainer 가 인스턴스를 만들 때 /data 하위를 chown 하고
      #   dirsrv 사용자로 강등한다. root 로 시작해야 한다.
      #   ★ v1 의 `privileged: true` 는 불필요하다 — 그것 없이 뜬다.
      #      capability 도 전부 버린다.
      securityContext:
        runAsUser: 0
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ds389
          image: 389ds/dirsrv:3.1
          envFrom:
            - configMapRef: {name: ds389-config}
          env:
            - name: DS_DM_PASSWORD
              valueFrom: {secretKeyRef: {name: ds389-secret, key: dm-password}}
          ports:
            - {containerPort: 3389, name: ldap, protocol: TCP}
            - {containerPort: 3636, name: ldaps, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              # ★ drop:["ALL"] 만으로는 이 이미지가 뜨지 않는다.
              #   root 로 시작해 설정을 마치고 비특권 사용자로 내려가는
              #   구조라 다음이 필요하다:
              #     CHOWN·FOWNER   — /data 소유권 조정
              #     DAC_OVERRIDE   — root 라도 이게 없으면 남의 파일에서 EACCES
              #     SETUID·SETGID  — dirsrv 사용자로 강등
              #
              #   ★★ NET_BIND_SERVICE 가 진짜 함정이다.
              #      /usr/sbin/ns-slapd 에 파일 capability 로 박혀 있다.
              #      파일의 permitted 집합이 프로세스 bounding 집합의
              #      부분집합이 아니면 커널이 execve 를 EPERM 으로 거부한다:
              #        PermissionError: [Errno 1] Operation not permitted:
              #          '/usr/sbin/ns-slapd'
              #      3389/3636 을 쓰므로 기능적으로는 필요 없는데도
              #      exec 하려면 bounding 집합에 있어야 한다.
              #
              #   증상이 두 단계로 어긋나 보인다 — 첫 시도는 위 EPERM 으로
              #   죽고, 그때 이미 /data/config/dse.ldif 를 써 둔 탓에
              #   두 번째 시도부터는 "Another instance named 'localhost'
              #   may already exist" 로 바뀐다. 두 번째 메시지만 보면
              #   볼륨/버전 문제로 오진하기 쉽다.
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID", "NET_BIND_SERVICE"]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: 500m, memory: 512Mi}
          startupProbe:
            tcpSocket: {port: ldap}
            failureThreshold: 40
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: ldap}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            tcpSocket: {port: ldap}
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources: {requests: {storage: 5Gi}}
