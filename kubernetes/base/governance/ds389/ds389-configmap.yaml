apiVersion: v1
kind: ConfigMap
metadata:
  name: ds389-config
  labels: {app.kubernetes.io/name: ds389, app.kubernetes.io/component: governance, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
data:
  # ★ 이미지의 dscontainer 가 실제로 읽는 변수만 둔다.
  #   v1 의 ds389-configmap 은 DS_DOMAIN·DS_INSTANCE_NAME 을 넣었는데
  #   dscontainer 는 두 변수를 참조하지 않는다(3.1 기준 인식 목록:
  #   DS_DM_PASSWORD · DS_SUFFIX_NAME · DS_ERRORLOG_LEVEL ·
  #   DS_MEMORY_PERCENTAGE · DS_REINDEX · DS_STARTUP_TIMEOUT · DS_STOP_TIMEOUT).
  #   조용히 무시되므로 넣어 두면 설정한 줄 알게 된다.
  DS_SUFFIX_NAME: dc=oneinchmarket,dc=co,dc=kr
  # DS_MEMORY_PERCENTAGE 는 넣지 않는다 — 3.1 의 기본 백엔드는 MDB 이고
  # 컨테이너가 "setting entry cache is not supported for MDB" 로 무시한다.
  # 무시되는 값을 두면 설정한 줄 알게 된다(v1 의 DS_DOMAIN 과 같은 실수).
