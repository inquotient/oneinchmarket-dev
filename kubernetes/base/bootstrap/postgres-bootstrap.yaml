# G22 해소 — postgresql-configmap.yaml:10-11 은 'oneinchmarket' DB 만 만든다.
# Keycloak·GitLab·Apicurio·Hive Metastore 가 존재하지 않는 DB 에 접속하고 있었다.
#
# 각 소비자의 Secret 을 읽어 같은 비밀번호로 롤을 만든다.
# 별도 비밀번호 원천을 두지 않으므로 값이 어긋날 수 없다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-bootstrap
  labels:
    app.kubernetes.io/name: postgres-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-bootstrap
  labels:
    app.kubernetes.io/name: postgres-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-bootstrap
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      # ★★ 전용 SA. 이 Job 은 `default` 로 돌아 ztunnel 이 PostgreSQL 접근을
      #   거부하고 있었다 — `allow-database-access` 는 principal 로 5432 를
      #   허용하는데 `*/sa/default` 는 거기 없다(Gotcha 10).
      #   증상은 오류가 아니라 **무한 대기**다: `until $PSQL ... SELECT 1`
      #   루프가 영원히 돌아 Job 이 `Running` 인 채로 끝나지 않고,
      #   ArgoCD 동기화가 그 훅을 기다리다 통째로 멈춘다.
      #   실측 ztunnel 로그(§8-84):
      #     src.workload="postgres-bootstrap-..." src.identity=".../sa/default"
      #     dst.hbone_addr=...:5432
      #     error="connection closed due to policy rejection:
      #            allow policies exist, but none allowed"
      #   Gotcha 19 의 여섯 번째 사례다(kafka-topics·ILM·마이그레이션·
      #   hive-schematool·mariadb-bootstrap 에 이어).
      serviceAccountName: postgres-bootstrap
      restartPolicy: OnFailure
      priorityClassName: batch-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: postgres:18.6
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              export PGPASSWORD="$POSTGRES_PASSWORD"
              PSQL="psql -h postgresql-headless -U postgres -v ON_ERROR_STOP=1"

              echo "[postgres-bootstrap] PostgreSQL 대기"
              # pg_isready 는 인증까지 확인하지 않는다. 실제 접속으로 판정한다.
              until $PSQL -d postgres -c "SELECT 1" >/dev/null 2>&1; do sleep 3; done

              # 롤·DB 를 멱등하게 만든다. 이미 있으면 비밀번호만 맞춘다.
              ensure() {
                local role="$1" db="$2" pw="$3"
                echo "[postgres-bootstrap] role=$role db=$db"
                $PSQL -d postgres -c \
                  "DO \$\$ BEGIN
                     IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='${role}') THEN
                       CREATE ROLE ${role} LOGIN PASSWORD '${pw}';
                     ELSE
                       ALTER ROLE ${role} WITH LOGIN PASSWORD '${pw}';
                     END IF;
                   END \$\$;"
                $PSQL -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='${db}'" | grep -q 1 \
                  || $PSQL -d postgres -c "CREATE DATABASE ${db} OWNER ${role}"
                $PSQL -d postgres -c "GRANT ALL PRIVILEGES ON DATABASE ${db} TO ${role}"
                $PSQL -d "${db}"   -c "GRANT ALL ON SCHEMA public TO ${role}"

                # ★ public 밖의 스키마까지 소유권을 정규화한다.
                #
                #   위 GRANT 는 public 만 다룬다. 그런데 앱이 자체 마이그레이션으로
                #   다른 스키마를 만드는 경우가 있고(OpenReplay 는 spots·events·
                #   events_common 을 만든다), 그 마이그레이션이 어떤 이유로든
                #   superuser 로 돌면 객체가 postgres 소유로 남는다. 그러면 앱은
                #   **자기 스키마를 읽지 못한다.**
                #
                #   이 실패는 조용하지 않다. 폴링 워커가 붙어 있으면 권한 오류를
                #   초당 수천 건 뱉는다 — 실측(§8-37)으로 PostgreSQL 이
                #   "permission denied for schema spots" 를 초당 1만 건 넘게 남겼고
                #   filebeat 가 그것을 받아 ES 에 **93 GB** 를 쌓았다.
                #
                #   제외 두 가지가 중요하다.
                #     - 확장(extension) 소속 객체(pg_depend deptype='e') — 소유자를
                #       바꾸면 확장이 깨진다
                #     - identity/serial 시퀀스(deptype 'a','i') — 테이블에 종속되어
                #       직접 바꾸려 하면 "cannot change owner of sequence" 가 난다
                $PSQL -d "${db}" -c "DO \$\$
                  DECLARE r record;
                  BEGIN
                    FOR r IN SELECT nspname FROM pg_namespace
                             WHERE nspname NOT LIKE 'pg\\_%'
                               AND nspname <> 'information_schema'
                               AND pg_get_userbyid(nspowner) <> '${role}'
                    LOOP
                      EXECUTE format('ALTER SCHEMA %I OWNER TO ${role}', r.nspname);
                    END LOOP;
                    FOR r IN SELECT n.nspname, c.relname, c.relkind FROM pg_class c
                             JOIN pg_namespace n ON n.oid = c.relnamespace
                             WHERE n.nspname NOT LIKE 'pg\\_%'
                               AND n.nspname <> 'information_schema'
                               AND c.relkind IN ('r','p','v','m','S')
                               AND pg_get_userbyid(c.relowner) <> '${role}'
                               AND NOT EXISTS (SELECT 1 FROM pg_depend d
                                 WHERE d.classid='pg_class'::regclass AND d.objid=c.oid
                                   AND d.deptype IN ('a','i','e'))
                    LOOP
                      EXECUTE format('ALTER %s %I.%I OWNER TO ${role}',
                        CASE r.relkind WHEN 'v' THEN 'VIEW'
                                       WHEN 'm' THEN 'MATERIALIZED VIEW'
                                       WHEN 'S' THEN 'SEQUENCE'
                                       ELSE 'TABLE' END, r.nspname, r.relname);
                    END LOOP;
                  END \$\$;" || echo "[postgres-bootstrap] ${db}: 소유권 정규화 건너뜀"
              }

              # 각 값은 소비자 매니페스트에서 확인한 실제 롤·DB 이름이다.
              #   keycloak-configmap.yaml:14-15   KC_DB_URL_DATABASE=keycloak  KC_DB_USERNAME=keycloak
              #   gitlab-configmap.yaml:21-22     db_database=gitlab           db_username=gitlab
              #   apicurio-statefulset.yaml:42,44 jdbc .../apicurio           USERNAME=apicurio
              #   hive-metastore-statefulset.yaml:79-80  .../hive_metastore   ConnectionUserName=hive
              ensure keycloak       keycloak       "$KEYCLOAK_DB_PASSWORD"
              ensure gitlab         gitlab         "$GITLAB_DB_PASSWORD"
              ensure apicurio       apicurio       "$APICURIO_DB_PASSWORD"
              ensure hive           hive_metastore "$HIVE_DB_PASSWORD"
              # 3단계 — Ranger. ranger.sh 의 setup.sh 도 root 자격으로 DB 를
              # 만들 수 있으나, 롤 비밀번호 원천을 한 곳에 모으기 위해 여기서
              # 먼저 만든다. setup.sh 는 이미 있으면 건너뛴다.
              ensure ranger         ranger         "$RANGER_DB_PASSWORD"
              # glitchtip-configmap.yaml — DATABASE_URL 의 롤·DB 이름
              ensure glitchtip      glitchtip      "$GLITCHTIP_DB_PASSWORD"
              # openreplay — 세션 리플레이(ADR-069). 차트의 postgresqlUser/Database.
              ensure openreplay     openreplay     "$OPENREPLAY_DB_PASSWORD"
              # 7단계 — Dependency-Track. ALPINE_DATABASE_URL 의 롤·DB 이름.
              ensure dependencytrack dependencytrack "$DTRACK_DB_PASSWORD"
              # 7단계 — DefectDojo. DD_DATABASE_NAME/USER 의 값이다.
              ensure defectdojo     defectdojo     "$DEFECTDOJO_DB_PASSWORD"
              # 7단계 — SafeLine WAF. 상류는 자체 postgres 를 번들하나 공용을 쓴다.
              ensure safeline       safeline       "$SAFELINE_DB_PASSWORD"

              # OpenFGA — 인가 저장소(WSO2-OSS-MAPPING Phase 2 ⑧, §8-102)
              ensure openfga        openfga        "$OPENFGA_DB_PASSWORD"

              echo "[postgres-bootstrap] 완료"
              $PSQL -d postgres -c "\l"
          env:
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgresql-secret, key: postgresql-password } }
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-secret, key: db-password } }
            - name: GITLAB_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: gitlab-secret, key: db-password } }
            - name: APICURIO_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: apicurio-secret, key: db-password } }
            - name: HIVE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: hive-metastore-secret, key: db-password } }
            - name: RANGER_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ranger-secret, key: db-password } }
            - name: GLITCHTIP_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: glitchtip-secret, key: db-password } }
            - name: OPENREPLAY_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: openreplay-secret, key: db-password } }
            - name: DTRACK_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: dependency-track-secret, key: db-password } }
            - name: DEFECTDOJO_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: defectdojo-secret, key: db-password } }
            - name: SAFELINE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: safeline-secret, key: db-password } }
            - name: OPENFGA_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: openfga-secret, key: db-password } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
