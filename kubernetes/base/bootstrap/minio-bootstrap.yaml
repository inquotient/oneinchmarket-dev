# G22 — Trino·Hive Metastore 가 s3a://warehouse 를 조회하나
# 버킷을 만드는 주체가 없었다. Spark 계층(ADR-064)이 쓰는 2개도 함께 만든다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-bootstrap
  labels:
    app.kubernetes.io/name: minio-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  labels:
    app.kubernetes.io/name: minio-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-bootstrap
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      # ★★ 전용 SA. `default` 로 돌면 `allow-datalakehouse-access` 가 minio 를
      #   선택하는데 `*/sa/default` 가 principal 에 없어 **9000 이 거부**된다
      #   (Gotcha 9·10). 증상은 `mc alias set` 이 조용히 매달리는 것이라
      #   MinIO 자격이나 주소를 의심하게 된다 — §8-84
      #   ★ 이 Job 은 오래 성공해 왔다. 정책이 minio 를 선택하게 된 뒤로
      #   깨진 것이고, **평소에 돌지 않는 Job 이라 재실행할 때 비로소**
      #   드러났다(Gotcha 19 가 적은 그대로다).
      serviceAccountName: minio-bootstrap
      restartPolicy: OnFailure
      priorityClassName: batch-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          image: docker.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[minio-bootstrap] MinIO 대기"
              # MinIO 는 HTTP 다. 로테이션 CronJob 의 https:// + --insecure 는 오류다.
              until mc alias set oim http://minio-headless:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 3; done
              for b in warehouse spark-events livy-recovery airflow-logs; do
                mc mb --ignore-existing "oim/$b"
                echo "[minio-bootstrap] bucket $b"
              done
              # Spark 는 버킷 루트를 이벤트 로그 경로로 받지 못한다 — 경로 성분이
              # 없어 SparkContext.scala:631 에서 path must be absolute 가 난다.
              # 프리픽스가 실재해야 History Server 의 getFileStatus 도 통과한다.
              echo placeholder | mc pipe oim/spark-events/events/.keep
              echo placeholder | mc pipe oim/warehouse/tables/.keep
              # ── Airflow 전용 사용자 ─────────────────────
              # ★★★ root 자격을 Airflow 에 주지 않는다. LocalExecutor 는
              #   **DAG 코드를 scheduler 파드 안에서 실행**하므로, 그 파드가 든
              #   자격은 DAG 을 쓰는 누구나 쓸 수 있다. root 면 아무 DAG 이나
              #   `warehouse` 를 지울 수 있다 — 로그를 남기려고 레이크하우스를
              #   걸 수는 없다. 그래서 `airflow-logs` 버킷만 만질 수 있는
              #   사용자를 따로 만든다(Gotcha 27 의 ClickHouse 와 같은 이유).
              # ★ heredoc 을 쓰지 않는다 — 종료자가 열 0 에 놓여야 하는데
              #   그것은 YAML 블록 스칼라를 끊는다(실측으로 한 번 깨뜨렸다).
              printf '%s' '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":["arn:aws:s3:::airflow-logs/*"]},{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::airflow-logs"]}]}' > /tmp/airflow-logs-policy.json
              mc admin policy create oim airflow-logs-rw /tmp/airflow-logs-policy.json >/dev/null 2>&1 || true
              mc admin user add oim airflow "$AIRFLOW_S3_SECRET_KEY" >/dev/null 2>&1 || true
              mc admin policy attach oim airflow-logs-rw --user airflow >/dev/null 2>&1 || true
              # ★ 판정을 exit code 로 하지 말 것 — 위 셋은 "이미 있음" 도 실패로
              #   내므로 전부 `|| true` 다. 실제로 붙었는지 되읽어 확인한다
              #   (Gotcha 12·86). 안 붙었으면 여기서 멈춘다.
              # ★★ 이 이미지에는 **grep 이 없다**(실측:
              #   `/bin/sh: grep: command not found`). 사용자와 정책은 제대로
              #   만들어졌는데 **가드가 거짓 실패**를 냈다 — Gotcha 56 과
              #   같은 자리다(측정 도구가 이미지에 없다).
              #   셔 내장인 `case` 로 본다 — 외부 명령이 필요 없고
              #   파이프도 없으니 Gotcha 109 의 SIGPIPE 함정도 없다.
              info=$(mc admin user info oim airflow 2>/dev/null || true)
              case "$info" in
                *airflow-logs-rw*) : ;;
                *)
                  echo "[minio-bootstrap] airflow 사용자에 정책이 붙지 않았다" >&2
                  echo "$info" >&2
                  exit 1
                  ;;
              esac
              echo "[minio-bootstrap] airflow 사용자 + airflow-logs-rw 정책 확인"

              mc ls oim
              echo "[minio-bootstrap] 완료"
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-secret, key: root-user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-secret, key: root-password } }
            # ★ Airflow 전용 사용자의 비밀키. 이 Job 이 MinIO 에 그 사용자를
            #   만들고, Airflow 파드는 같은 Secret 에서 같은 값을 읽는다 —
            #   원천이 하나여야 회전 때 어긋나지 않는다(Gotcha 117).
            - name: AIRFLOW_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: airflow-secret, key: s3-secret-key } }
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 128Mi }
