# G22 — Trino·Hive Metastore 가 s3a://warehouse 를 조회하나
# 버킷을 만드는 주체가 없었다. Spark 계층(ADR-064)이 쓰는 2개도 함께 만든다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio-bootstrap
  labels:
    app.kubernetes.io/name: minio-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bootstrap
  labels:
    app.kubernetes.io/name: minio-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-bootstrap
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      # ★★ 전용 SA. `default` 로 돌면 `allow-datalakehouse-access` 가 minio 를
      #   선택하는데 `*/sa/default` 가 principal 에 없어 **9000 이 거부**된다
      #   (Gotcha 9·10). 증상은 `mc alias set` 이 조용히 매달리는 것이라
      #   MinIO 자격이나 주소를 의심하게 된다 — §8-84
      #   ★ 이 Job 은 오래 성공해 왔다. 정책이 minio 를 선택하게 된 뒤로
      #   깨진 것이고, **평소에 돌지 않는 Job 이라 재실행할 때 비로소**
      #   드러났다(Gotcha 19 가 적은 그대로다).
      serviceAccountName: minio-bootstrap
      # ★★★ quay.io 자격 (2026-10-05). MinIO 는 2026-09-11 에 Docker Hub
      #   에서 **저장소째 삭제**됐고(실측: `object not found`) quay.io 는
      #   2026-09-24 부터 익명 pull 을 막는다(실측: manifest HEAD 가 401,
      #   404 가 아니다 — 즉 자격이 있으면 받아진다).
      #   mirror.gcr.io·public.ecr.aws 에도 없다.
      # ★ 이 Secret 은 **이 레포가 만들지 못한다** — quay 로봇 토큰이다.
      #   `local/quay-pull-secret.sh` 가 넣는다. 레포 밖 원천 목록은
      #   LOCAL-DEPLOYMENT §25-00.
      imagePullSecrets:
        - name: quay-pull-secret
      restartPolicy: OnFailure
      priorityClassName: batch-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[minio-bootstrap] MinIO 대기"
              # MinIO 는 HTTP 다. 로테이션 CronJob 의 https:// + --insecure 는 오류다.
              until mc alias set oim http://minio-headless:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 3; done
              # openbao-snapshots·OpenReplay 버킷도 여기서 만든다 — 소비자 사용자에게는 버킷 생성 권한이 없다(2026-11-06).
              for b in warehouse spark-events livy-recovery airflow-logs openbao-snapshots \
                       mobs sessions-assets records sourcemaps uxtesting-records spots; do
                mc mb --ignore-existing "oim/$b"
                echo "[minio-bootstrap] bucket $b"
              done
              # Spark 는 버킷 루트를 이벤트 로그 경로로 받지 못한다 — 경로 성분이
              # 없어 SparkContext.scala:631 에서 path must be absolute 가 난다.
              # 프리픽스가 실재해야 History Server 의 getFileStatus 도 통과한다.
              echo placeholder | mc pipe oim/spark-events/events/.keep
              echo placeholder | mc pipe oim/warehouse/tables/.keep
              # ── 소비자별 사용자 ─────────────────────────────
              # ★★★ root 자격을 소비자에게 주지 않는다. Airflow 가 첫 사례였다 — LocalExecutor 는 DAG 코드를
              #   scheduler 파드 안에서 실행하므로 root 면 아무 DAG 이나 warehouse 를 지울 수 있다(Gotcha 27).
              #   2026-11-06 에 나머지 소비자도 옮겼다 — root 는 MinIO 자신·이 Job·로테이터만 쓴다.
              # ★ heredoc 을 쓰지 않는다 — 종료자가 열 0 에 놓여야 하는데 그것은 YAML 블록 스칼라를 끊는다.
              # ★ 이 이미지에는 grep 이 없다 — 판정은 셸 내장 case 로 한다(Gotcha 56·109).
              MINIO_URL=http://minio-headless:9000
              # ── 버킷 정책 — 사용자마다 자기 버킷만 (2026-11-06) ─────────────
              # pol <정책 이름> <버킷>... — 객체 읽기·쓰기·지우기 + 목록. 버킷을 만들거나 지우는 권한은 없다.
              pol() {
                name=$1; shift; objs=""; bks=""
                for b in "$@"; do
                  objs="$objs${objs:+,}\"arn:aws:s3:::$b/*\""
                  bks="$bks${bks:+,}\"arn:aws:s3:::$b\""
                done
                printf '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject","s3:PutObject","s3:DeleteObject","s3:AbortMultipartUpload","s3:ListMultipartUploadParts"],"Resource":[%s]},{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation","s3:ListBucketMultipartUploads"],"Resource":[%s]}]}' "$objs" "$bks" > "/tmp/$name.json"
                mc admin policy create oim "$name" "/tmp/$name.json" >/dev/null
              }
              pol warehouse-rw         warehouse
              pol spark-rw             warehouse spark-events livy-recovery
              pol spark-events-rw      spark-events
              pol openreplay-rw        mobs sessions-assets records sourcemaps uxtesting-records spots
              pol openbao-snapshots-rw openbao-snapshots
              pol airflow-logs-rw      airflow-logs
              # ── 사용자 — <이름>:<정책>:<비밀키 환경변수> ─────────────────────
              # ★ 이미 있는 사용자의 키를 함부로 덮지 않는다 — Secret 의 키로 인증되면 그대로 두고, 안 될 때만
              #   Secret 값으로 맞춘다(Secret 이 원천이다 — OpenBao → ESO → Secret). 키를 바꾸는 것은 로테이션 Job 뿐이다.
              fails=0
              for spec in trino:warehouse-rw:TRINO_KEY hive:warehouse-rw:HIVE_KEY spark:spark-rw:SPARK_KEY \
                          spark-history:spark-events-rw:SPARK_HISTORY_KEY openreplay:openreplay-rw:OPENREPLAY_KEY \
                          openbao-snapshot:openbao-snapshots-rw:OPENBAO_SNAPSHOT_KEY airflow:airflow-logs-rw:AIRFLOW_S3_SECRET_KEY; do
                u=${spec%%:*}; rest=${spec#*:}; p=${rest%%:*}; v=${rest#*:}
                eval "k=\${$v:-}"
                [ -n "$k" ] || { echo "[minio-bootstrap] $u: 비밀키($v)가 비었다" >&2; fails=$((fails+1)); continue; }
                if mc alias set chk "$MINIO_URL" "$u" "$k" >/dev/null 2>&1; then st=유지
                else mc admin user add oim "$u" "$k" >/dev/null; st=설정; fi
                # 이미 붙어 있으면 attach 가 실패를 낸다 — 판정은 아래 되읽기로 한다(Gotcha 12·86).
                mc admin policy attach oim "$p" --user "$u" >/dev/null 2>&1 || true
                info=$(mc admin user info oim "$u" 2>/dev/null || true)
                case "$info" in *"PolicyName: $p"*) ;; *) echo "[minio-bootstrap] $u: 정책 $p 가 붙지 않았다" >&2; fails=$((fails+1)); continue;; esac
                mc alias set chk "$MINIO_URL" "$u" "$k" >/dev/null 2>&1 \
                  || { echo "[minio-bootstrap] $u: Secret 의 키로 인증되지 않는다" >&2; fails=$((fails+1)); continue; }
                echo "[minio-bootstrap] user $u ($st) + $p 확인"
              done
              mc alias remove chk >/dev/null 2>&1 || true
              [ "$fails" -eq 0 ] || { echo "[minio-bootstrap] 사용자 $fails 건 실패" >&2; exit 1; }

              mc ls oim
              echo "[minio-bootstrap] 완료"
          env:
            - name: MINIO_ROOT_USER
              valueFrom: { secretKeyRef: { name: minio-secret, key: root-user } }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: minio-secret, key: root-password } }
            # ★ Airflow 전용 사용자의 비밀키. 이 Job 이 MinIO 에 그 사용자를
            #   만들고, Airflow 파드는 같은 Secret 에서 같은 값을 읽는다 —
            #   원천이 하나여야 회전 때 어긋나지 않는다(Gotcha 117).
            - name: AIRFLOW_S3_SECRET_KEY
              valueFrom: { secretKeyRef: { name: airflow-secret, key: s3-secret-key } }
            # ★ 소비자별 사용자의 비밀키(2026-11-06) — 원천은 OpenBao oim/minio-users(ESO).
            - { name: TRINO_KEY,            valueFrom: { secretKeyRef: { name: minio-users, key: trino-secret-key } } }
            - { name: HIVE_KEY,             valueFrom: { secretKeyRef: { name: minio-users, key: hive-secret-key } } }
            - { name: SPARK_KEY,            valueFrom: { secretKeyRef: { name: minio-users, key: spark-secret-key } } }
            - { name: SPARK_HISTORY_KEY,    valueFrom: { secretKeyRef: { name: minio-users, key: spark-history-secret-key } } }
            - { name: OPENREPLAY_KEY,       valueFrom: { secretKeyRef: { name: minio-users, key: openreplay-secret-key } } }
            - { name: OPENBAO_SNAPSHOT_KEY, valueFrom: { secretKeyRef: { name: minio-users, key: openbao-snapshot-secret-key } } }
            - name: MC_CONFIG_DIR
              value: /tmp/.mc
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          # ★ 128Mi 에서 OOMKilled(137) 였다(2026-11-06) — 사용자 7명을 돌며 mc 를 30여 번 부르자 넘었다.
          #   Sync 훅이라 끝나지 않으면 동기화가 wave 3 에서 선다.
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }
