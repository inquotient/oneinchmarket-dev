# API 과금용 Keycloak realm 부트스트랩
#
# ★ 왜 필요한가 — 게이트웨이가 JWT 를 검증해 **테넌트를 스스로 판정**해야 한다.
#   지금은 클라이언트가 보내는 `X-OIM-Tenant` 헤더를 그대로 믿고 있어서
#   아무나 남의 회사에 청구를 떠넘길 수 있다(§8-53 미결). 그 헤더를
#   **토큰 클레임에서 파생된 값으로 대체**하는 것이 이 Job 의 목적이다.
#
# ★ master realm 을 쓰지 않는다. master 는 Keycloak 자체의 관리 realm 이고,
#   거기에 고객 클라이언트를 넣으면 관리 권한 경계와 과금 대상 경계가 섞인다.
#
# ★ 테넌트는 **클라이언트에 박힌 하드코딩 클레임**이다. 사용자 속성이 아니다 —
#   API 과금은 client_credentials(기계 대 기계)라 사람이 없고, 담당자가 바뀌어도
#   청구 주체는 유지되어야 하기 때문이다(계약의 subject 정의와 같은 이유).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-bootstrap
  labels:
    app.kubernetes.io/name: keycloak-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-bootstrap
  labels:
    app.kubernetes.io/name: keycloak-realm-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # ★ Job 의 `spec.template` 은 불변이다 — 이미 존재하는 Job 에 apply 를 걸면
    #   `field is immutable` 로 **동기화 전체가 멈춘다**(ArgoCD 는 실패 하나에
    #   작업을 중단한다, §8-84). 이 레포의 부트스트랩 Job 9종이 이미 쓰는
    #   방식대로 훅으로 다뤄 **만들기 전에 지우게** 한다.
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    # wave 5 — Keycloak(4) 뒤. 이 Job 은 `until curl` 로 스스로 기다리므로
    # wave 가 없으면 Keycloak 이 뜨기 전에 시작해 **끝없이 기다린다**.
    argocd.argoproj.io/sync-wave: "5"
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-realm-bootstrap
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      restartPolicy: OnFailure
      serviceAccountName: keycloak-bootstrap
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          image: docker.io/curlimages/curl:8.22.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits:   {cpu: 300m, memory: 256Mi}
          env:
            - name: KC
              value: "http://keycloak-headless:8080"
            - name: REALM
              value: "oneinchmarket"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-secret, key: admin-password}
            # 스모크 테넌트. 이 클라이언트로 토큰을 받아 게이트웨이 배선을
            # 검증한다 — "설정은 했는데 클레임이 안 나온다" 를 구분하기 위해서다.
            - name: SMOKE_TENANT
              value: "acme-corp"
            - name: SMOKE_SECRET
              valueFrom:
                secretKeyRef: {name: keycloak-secret, key: smoke-client-secret}
            # Backstage OIDC — 클라이언트 시크릿은 **소비자 쪽 Secret**에 둔다.
            # Keycloak 은 그 값을 받아 클라이언트에 심을 뿐이다. 반대로 두면
            # Backstage 가 남의 Secret 을 읽어야 한다.
            - name: BACKSTAGE_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: backstage-secret, key: oidc-client-secret}
            - name: PORTAL_USER
              value: "portal"
            - name: PORTAL_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-secret, key: portal-user-password}
            # Backstage 의 외부 URL. 콜백은 이 값 + /api/auth/oidc/handler/frame 이다.
            # app-config 의 backend.baseUrl 과 **같아야 한다**.
            - name: BACKSTAGE_BASE_URL
              value: "http://localhost:17007"
            # AKHQ OIDC — 시크릿은 Backstage 와 같이 소비자 쪽(akhq-secret)에 둔다.
            # 콜백은 AKHQ_BASE_URL + /oauth/callback/keycloak (Micronaut 규약).
            - name: AKHQ_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: akhq-secret, key: oidc-client-secret}
            - name: AKHQ_BASE_URL
              value: "http://localhost:8080"
            # Apicurio(2026-11-03) — UI 는 공개 클라이언트(PKCE)라 시크릿이 없다.
            # 쓰기 Job 둘은 서비스 계정 클라이언트다. 시크릿은 소비자 쪽(apicurio-secret).
            - name: APICURIO_UI_URL
              value: "http://localhost:8888"
            - name: APICURIO_RULES_SECRET
              valueFrom:
                secretKeyRef: {name: apicurio-secret, key: rules-client-secret}
            - name: APICURIO_CONTRACTS_SECRET
              valueFrom:
                secretKeyRef: {name: apicurio-secret, key: contracts-client-secret}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "[0/6] Keycloak 대기"
              # ★★ 상한을 둔다 — 무한 대기는 ArgoCD 동기화를 **영원히** 세운다.
              #   실측(2026-10-06): 타임아웃 없는 curl 하나가 멈춘 연결에 걸려
              #   apicurio-rules 훅이 11분 넘게 Running 이었고 동기화 전체가 그
              #   자리에 섰다. **멈추면 실패로 끝나야 한다** — 실패는 보이지만
              #   대기는 보이지 않는다(Gotcha 19·120 이 같은 것을 적어 두었다).
              n=0
              until curl --connect-timeout 5 --max-time 30 -sf -o /dev/null "${KC}/realms/master"; do
                n=$((n+1))
                if [ "$n" -ge 100 ]; then
                  echo "[keycloak-realm 대기 실패] 300초 동안 응답이 없다 — 의존 대상을 확인할 것" >&2
                  exit 1
                fi
                sleep 3
              done

              echo "[1/6] 관리 토큰"
              TOK=$(curl --connect-timeout 5 --max-time 30 -sf -X POST "${KC}/realms/master/protocol/openid-connect/token" \
                -d "client_id=admin-cli" -d "username=admin" \
                -d "password=${ADMIN_PASSWORD}" -d "grant_type=password" \
                | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
              [ -n "$TOK" ] || { echo "관리 토큰 실패 — admin-password 를 확인할 것" >&2; exit 1; }
              A="Authorization: Bearer ${TOK}"

              echo "[2/6] realm ${REALM}"
              if curl --connect-timeout 5 --max-time 30 -sf -o /dev/null -H "$A" "${KC}/admin/realms/${REALM}"; then
                echo "  이미 있음"
              else
                curl --connect-timeout 5 --max-time 30 -sf -X POST "${KC}/admin/realms" -H "$A" \
                  -H 'Content-Type: application/json' \
                  -d "{\"realm\":\"${REALM}\",\"enabled\":true,
                       \"accessTokenLifespan\":300}"
                echo "  생성"
              fi

              echo "[3/6] 스모크 클라이언트 ${SMOKE_TENANT}"
              # ★ 하드코딩 클레임 매퍼가 핵심이다. 이 클라이언트가 받은 토큰에는
              #   tenant=acme-corp 가 반드시 들어가고, 클라이언트는 그 값을
              #   바꿀 수 없다. 게이트웨이는 이것만 믿는다.
              EXIST=$(curl --connect-timeout 5 --max-time 30 -sf -H "$A" "${KC}/admin/realms/${REALM}/clients?clientId=${SMOKE_TENANT}" | head -c 3)
              if [ "$EXIST" = "[]" ]; then
                curl --connect-timeout 5 --max-time 30 -sf -X POST "${KC}/admin/realms/${REALM}/clients" -H "$A" \
                  -H 'Content-Type: application/json' \
                  -d "{\"clientId\":\"${SMOKE_TENANT}\",
                       \"enabled\":true,
                       \"publicClient\":false,
                       \"serviceAccountsEnabled\":true,
                       \"standardFlowEnabled\":false,
                       \"directAccessGrantsEnabled\":false,
                       \"secret\":\"${SMOKE_SECRET}\",
                       \"protocolMappers\":[{
                         \"name\":\"tenant\",
                         \"protocol\":\"openid-connect\",
                         \"protocolMapper\":\"oidc-hardcoded-claim-mapper\",
                         \"config\":{
                           \"claim.name\":\"tenant\",
                           \"claim.value\":\"${SMOKE_TENANT}\",
                           \"jsonType.label\":\"String\",
                           \"access.token.claim\":\"true\",
                           \"id.token.claim\":\"false\",
                           \"userinfo.token.claim\":\"false\"
                         }}]}"
                echo "  생성"
              else
                echo "  이미 있음"
              fi

              echo "[4/6] Backstage OIDC 클라이언트"
              # 기밀 클라이언트다(publicClient=false) — 코드 교환을 Backstage 백엔드가
              # 하므로 시크릿을 안전하게 들 수 있다.
              # 콜백 경로는 Backstage 가 정한다: /api/auth/<provider>/handler/frame
              BS_JSON=$(cat <<JSON
              {"clientId":"backstage","enabled":true,"publicClient":false,
               "standardFlowEnabled":true,"serviceAccountsEnabled":false,
               "directAccessGrantsEnabled":false,
               "secret":"${BACKSTAGE_CLIENT_SECRET}",
               "redirectUris":["${BACKSTAGE_BASE_URL}/api/auth/oidc/handler/frame"],
               "webOrigins":["${BACKSTAGE_BASE_URL}"]}
              JSON
              )
              BSQ="${KC}/admin/realms/${REALM}/clients?clientId=backstage"
              if [ "$(curl --connect-timeout 5 --max-time 30 -sf -H "$A" "$BSQ" | head -c 3)" = "[]" ]; then
                curl --connect-timeout 5 --max-time 30 -sf -X POST "${KC}/admin/realms/${REALM}/clients" -H "$A" -H 'Content-Type: application/json' -d "$BS_JSON"
                echo "  생성"
              else
                # 이미 있으면 갱신한다 — 콜백 URL 이나 시크릿이 바뀌었을 수 있고,
                # 낡은 값을 그대로 두면 로그인이 조용히 깨진다.
                CID=$(curl --connect-timeout 5 --max-time 30 -sf -H "$A" "$BSQ" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
                curl --connect-timeout 5 --max-time 30 -sf -X PUT "${KC}/admin/realms/${REALM}/clients/${CID}" -H "$A" -H 'Content-Type: application/json' -d "$BS_JSON"
                echo "  갱신"
              fi

              echo "[5/6] 포털 사용자 ${PORTAL_USER}"
              # 이 realm 에는 사용자가 없다 — 클라이언트만 만들면 로그인할 대상이 없다.
              U_JSON=$(cat <<JSON
              {"username":"${PORTAL_USER}","enabled":true,"emailVerified":true,
               "email":"${PORTAL_USER}@oneinchmarket.local",
               "firstName":"Portal","lastName":"User",
               "credentials":[{"type":"password","value":"${PORTAL_PASSWORD}","temporary":false}]}
              JSON
              )
              UQ="${KC}/admin/realms/${REALM}/users?username=${PORTAL_USER}&exact=true"
              if [ "$(curl --connect-timeout 5 --max-time 30 -sf -H "$A" "$UQ" | head -c 3)" = "[]" ]; then
                curl --connect-timeout 5 --max-time 30 -sf -X POST "${KC}/admin/realms/${REALM}/users" -H "$A" -H 'Content-Type: application/json' -d "$U_JSON"
                echo "  생성"
              else
                PUID=$(curl --connect-timeout 5 --max-time 30 -sf -H "$A" "$UQ" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
                PW_JSON=$(printf '{"type":"password","value":"%s","temporary":false}' "${PORTAL_PASSWORD}")
                curl --connect-timeout 5 --max-time 30 -sf -X PUT "${KC}/admin/realms/${REALM}/users/${PUID}/reset-password" -H "$A" -H 'Content-Type: application/json' -d "$PW_JSON"
                echo "  비밀번호 갱신"
              fi

              echo "[5a/6] AKHQ OIDC 클라이언트 + groups 클레임"
              # ★ AKHQ 는 토큰의 groups 클레임(JSON 배열)으로 권한 그룹을 고른다.
              #   매퍼가 없으면 로그인은 되고 **기본 그룹으로만** 떨어져, 관리자가
              #   관리자 화면을 못 보는데 오류는 없다.
              AK_JSON=$(cat <<JSON
              {"clientId":"akhq","enabled":true,"publicClient":false,
               "standardFlowEnabled":true,"serviceAccountsEnabled":false,
               "directAccessGrantsEnabled":false,
               "secret":"${AKHQ_CLIENT_SECRET}",
               "redirectUris":["${AKHQ_BASE_URL}/oauth/callback/keycloak"],
               "webOrigins":["${AKHQ_BASE_URL}"]}
              JSON
              )
              AKQ="${KC}/admin/realms/${REALM}/clients?clientId=akhq"
              if [ "$(curl --connect-timeout 5 --max-time 30 -sf -H "$A" "$AKQ" | head -c 3)" = "[]" ]; then
                curl --connect-timeout 5 --max-time 30 -sf -X POST "${KC}/admin/realms/${REALM}/clients" -H "$A" -H 'Content-Type: application/json' -d "$AK_JSON"
                echo "  생성"
              fi
              AKID=$(curl --connect-timeout 5 --max-time 30 -sf -H "$A" "$AKQ" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
              [ -n "$AKID" ] || { echo "akhq 클라이언트 id 를 못 얻었다" >&2; exit 1; }
              # 있으면 갱신 — 콜백이나 시크릿이 바뀌었을 수 있다(Backstage 와 같은 이유).
              curl --connect-timeout 5 --max-time 30 -sf -X PUT "${KC}/admin/realms/${REALM}/clients/${AKID}" -H "$A" -H 'Content-Type: application/json' -d "$AK_JSON"
              # ★ 클라이언트 PUT 은 protocolMappers 를 고치지 않는다 — 매퍼는 따로 확인해 넣는다.
              if curl --connect-timeout 5 --max-time 30 -sf -H "$A" "${KC}/admin/realms/${REALM}/clients/${AKID}/protocol-mappers/models" | grep -q '"name":"groups"'; then
                echo "  groups 매퍼 이미 있음"
              else
                curl --connect-timeout 5 --max-time 30 -sf -X POST "${KC}/admin/realms/${REALM}/clients/${AKID}/protocol-mappers/models" -H "$A" -H 'Content-Type: application/json' \
                  -d '{"name":"groups","protocol":"openid-connect","protocolMapper":"oidc-group-membership-mapper","config":{"full.path":"false","id.token.claim":"true","access.token.claim":"true","userinfo.token.claim":"true","claim.name":"groups"}}'
                echo "  groups 매퍼 생성"
              fi

              echo "[5b/6] 그룹 platform + ${PORTAL_USER} 소속"
              # AKHQ 에서 platform 그룹 = admin 이다(overlays/local/patches/akhq-local.yaml).
              # ★ 이 realm 의 사람 사용자는 portal 하나라, 그를 넣지 않으면 AKHQ 를
              #   관리할 사람이 없다. Backstage 카탈로그도 portal 을 platform 소속으로 둔다.
              GQ="${KC}/admin/realms/${REALM}/groups?search=platform&exact=true"
              if [ "$(curl --connect-timeout 5 --max-time 30 -sf -H "$A" "$GQ" | head -c 3)" = "[]" ]; then
                curl --connect-timeout 5 --max-time 30 -sf -X POST "${KC}/admin/realms/${REALM}/groups" -H "$A" -H 'Content-Type: application/json' -d '{"name":"platform"}'
                echo "  그룹 생성"
              fi
              GID=$(curl --connect-timeout 5 --max-time 30 -sf -H "$A" "$GQ" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
              PUID2=$(curl --connect-timeout 5 --max-time 30 -sf -H "$A" "${KC}/admin/realms/${REALM}/users?username=${PORTAL_USER}&exact=true" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
              { [ -n "$GID" ] && [ -n "$PUID2" ]; } || { echo "그룹 또는 사용자 id 를 못 얻었다" >&2; exit 1; }
              # 멱등이다 — 이미 소속이면 204 를 그대로 준다.
              curl --connect-timeout 5 --max-time 30 -sf -X PUT "${KC}/admin/realms/${REALM}/users/${PUID2}/groups/${GID}" -H "$A"
              echo "  ${PORTAL_USER} -> platform"

              echo "[5c/6] Apicurio — realm 역할 3종 · UI 클라이언트 · 쓰기 Job 클라이언트 2종"
              # Apicurio 는 토큰의 realm_access.roles 로 권한을 정한다(QUARKUS_OIDC_ROLES_ROLE_CLAIM_PATH).
              #   sr-admin(전역 규칙·관리) · sr-developer(아티팩트 쓰기) · sr-readonly(읽기)
              # ★ 읽기는 익명에게도 열려 있다(anonymous-read-access) — 역할이 막는 것은 쓰기다.
              R="${KC}/admin/realms/${REALM}"
              for role in sr-admin sr-developer sr-readonly; do
                if curl --connect-timeout 5 --max-time 30 -sf -o /dev/null -H "$A" "${R}/roles/${role}"; then :; else
                  curl --connect-timeout 5 --max-time 30 -sf -X POST "${R}/roles" -H "$A" -H 'Content-Type: application/json' -d "{\"name\":\"${role}\"}"
                  echo "  역할 생성 ${role}"
                fi
              done
              role_json() { echo "[$(curl --connect-timeout 5 --max-time 30 -sf -H "$A" "${R}/roles/$1")]"; }
              upsert_client() {  # upsert_client <clientId> <json> -> 내부 id 를 출력
                q="${R}/clients?clientId=$1"
                if [ "$(curl --connect-timeout 5 --max-time 30 -sf -H "$A" "$q" | head -c 3)" = "[]" ]; then
                  curl --connect-timeout 5 --max-time 30 -sf -X POST "${R}/clients" -H "$A" -H 'Content-Type: application/json' -d "$2" >/dev/null
                fi
                id=$(curl --connect-timeout 5 --max-time 30 -sf -H "$A" "$q" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
                [ -n "$id" ] || { echo "$1 클라이언트 id 를 못 얻었다" >&2; exit 1; }
                # 있으면 갱신 — 콜백이나 시크릿이 바뀌었을 수 있다.
                curl --connect-timeout 5 --max-time 30 -sf -X PUT "${R}/clients/${id}" -H "$A" -H 'Content-Type: application/json' -d "$2" >/dev/null
                echo "$id"
              }
              # UI — 브라우저 SPA 라 공개 클라이언트 + PKCE. 시크릿을 둘 곳이 없다.
              UI_JSON=$(cat <<JSON
              {"clientId":"apicurio-ui","enabled":true,"publicClient":true,
               "standardFlowEnabled":true,"serviceAccountsEnabled":false,
               "directAccessGrantsEnabled":false,
               "redirectUris":["${APICURIO_UI_URL}/*"],
               "webOrigins":["${APICURIO_UI_URL}"],
               "attributes":{"pkce.code.challenge.method":"S256","post.logout.redirect.uris":"${APICURIO_UI_URL}/*"}}
              JSON
              )
              upsert_client apicurio-ui "$UI_JSON" >/dev/null
              echo "  apicurio-ui (공개 · PKCE)"
              # 쓰기 Job — 서비스 계정만. 브라우저 흐름은 끈다.
              svc_client() {  # svc_client <clientId> <secret> <realm-role>
                j="{\"clientId\":\"$1\",\"enabled\":true,\"publicClient\":false,\"serviceAccountsEnabled\":true,\"standardFlowEnabled\":false,\"directAccessGrantsEnabled\":false,\"secret\":\"$2\"}"
                cid=$(upsert_client "$1" "$j")
                suid=$(curl --connect-timeout 5 --max-time 30 -sf -H "$A" "${R}/clients/${cid}/service-account-user" | grep -o '"id":"[^"]*"' | head -1 | cut -d'"' -f4)
                [ -n "$suid" ] || { echo "$1 서비스 계정 사용자를 못 얻었다" >&2; exit 1; }
                curl --connect-timeout 5 --max-time 30 -sf -X POST "${R}/users/${suid}/role-mappings/realm" -H "$A" -H 'Content-Type: application/json' -d "$(role_json "$3")"
                echo "  $1 -> $3"
              }
              svc_client apicurio-rules     "${APICURIO_RULES_SECRET}"     sr-admin
              svc_client apicurio-contracts "${APICURIO_CONTRACTS_SECRET}" sr-developer
              # 사람 — platform 그룹이 관리자다(AKHQ 와 같은 축).
              curl --connect-timeout 5 --max-time 30 -sf -X POST "${R}/groups/${GID}/role-mappings/realm" -H "$A" -H 'Content-Type: application/json' -d "$(role_json sr-admin)"
              echo "  그룹 platform -> sr-admin"

              echo "[6/6] 검증 — 발급된 토큰에 tenant 클레임이 있는가"
              AT=$(curl --connect-timeout 5 --max-time 30 -sf -X POST "${KC}/realms/${REALM}/protocol/openid-connect/token" \
                -d "grant_type=client_credentials" \
                -d "client_id=${SMOKE_TENANT}" -d "client_secret=${SMOKE_SECRET}" \
                | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
              [ -n "$AT" ] || { echo "토큰 발급 실패" >&2; exit 1; }
              # payload 만 떼어 base64url 디코딩
              P=$(echo "$AT" | cut -d. -f2)
              case $(( ${#P} % 4 )) in 2) P="${P}==";; 3) P="${P}=";; esac
              echo "$P" | tr '_-' '/+' | base64 -d 2>/dev/null | tr ',' '\n' | grep -E '"tenant"|"iss"' \
                || { echo "★ tenant 클레임이 없다 — 매퍼가 적용되지 않았다" >&2; exit 1; }
              echo "=== realm 부트스트랩 완료 ==="
