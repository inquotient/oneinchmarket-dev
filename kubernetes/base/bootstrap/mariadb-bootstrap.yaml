# G22 — cmmn-api 가 jdbc:mariadb://mariadb-headless:3306/cmmn 에 접속하나
# 해당 DB·사용자를 만드는 주체가 없었다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mariadb-bootstrap
  labels:
    app.kubernetes.io/name: mariadb-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mariadb-bootstrap
  labels:
    app.kubernetes.io/name: mariadb-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mariadb-bootstrap
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      # ★★ 전용 SA. 이 Job 은 `default` 로 돌아 ztunnel 이 MariaDB 접근을
      #   거부하고 있었다 — `allow-database-access` 는 principal 로 3306 을
      #   허용하는데 `*/sa/default` 는 거기 없다(Gotcha 10).
      #   증상은 오류가 아니라 **무한 대기**다: `until mariadb-admin ping ...`
      #   루프가 영원히 돌아 Job 이 `Running` 인 채로 끝나지 않는다.
      #   실측 ztunnel 로그:
      #     src.workload="mariadb-bootstrap-..." src.identity=".../sa/default"
      #     error="connection closed due to policy rejection:
      #            allow policies exist, but none allowed"
      #   Gotcha 19 의 다섯 번째 사례다(kafka-topics·ILM·마이그레이션·
      #   hive-schematool 에 이어). §8-76
      serviceAccountName: mariadb-bootstrap
      restartPolicy: OnFailure
      priorityClassName: batch-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          image: mariadb:12.3.3
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "[mariadb-bootstrap] MariaDB 대기"
              # 공식 MariaDB 11+ 는 mysqladmin/mysql 을 제거하고
              # mariadb-admin/mariadb 로 이름을 바꿨다(bitnami 에는 있었다).
              until mariadb-admin ping -h mariadb-headless -u root -p"$MARIADB_ROOT_PASSWORD" --silent 2>/dev/null; do sleep 3; done
              mariadb -h mariadb-headless -u root -p"$MARIADB_ROOT_PASSWORD" <<SQL
              CREATE DATABASE IF NOT EXISTS cmmn CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE USER IF NOT EXISTS 'cmmn'@'%' IDENTIFIED BY '${CMMN_PASSWORD}';
              ALTER USER 'cmmn'@'%' IDENTIFIED BY '${CMMN_PASSWORD}';
              GRANT ALL PRIVILEGES ON cmmn.* TO 'cmmn'@'%';
              -- ★ ProxySQL 모니터 계정 (§8-76). 앱 계정을 재사용하지 않는다 —
              --   Ranger 의 다섯 자격이 전부 같은 값이었던 것이 결함으로
              --   지적된 전례가 있다(§8-44). 자격 하나가 새면 여럿이 함께 샌다.
              --   ★ 권한은 USAGE 뿐이다. ProxySQL 의 헬스체크는 ping 과
              --     연결 성립만 보므로 데이터 접근 권한이 필요 없다.
              --     Galera 를 세우면 wsrep 상태를 읽어야 하므로 그때
              --     REPLICATION CLIENT 를 더한다.
              CREATE USER IF NOT EXISTS 'proxysql-monitor'@'%' IDENTIFIED BY '${PROXYSQL_MONITOR_PASSWORD}';
              ALTER USER 'proxysql-monitor'@'%' IDENTIFIED BY '${PROXYSQL_MONITOR_PASSWORD}';
              GRANT USAGE ON *.* TO 'proxysql-monitor'@'%';
              -- ★ Debezium(CDC) 전용 계정. cmmn 자격을 빌리지 않는다 —
              --   이 계정은 앱이 가져서는 안 되는 REPLICATION 권한을 갖고,
              --   반대로 쓰기 권한은 전혀 없어야 한다(§8-44 의 교훈).
              --   ★★ 권한 네 종류가 각각 필요하다:
              --     SELECT             — 스냅샷(초기 적재)
              --     RELOAD             — 스냅샷 중 FLUSH TABLES WITH READ LOCK
              --     REPLICATION CLIENT — SHOW MASTER STATUS (binlog 위치)
              --     REPLICATION SLAVE  — binlog 스트림 구독
              --   하나라도 빠지면 커넥터가 FAILED 로 서고 파드는 Ready 다.
              CREATE USER IF NOT EXISTS 'debezium'@'%' IDENTIFIED BY '${DEBEZIUM_PASSWORD}';
              ALTER USER 'debezium'@'%' IDENTIFIED BY '${DEBEZIUM_PASSWORD}';
              GRANT SELECT, RELOAD, SHOW DATABASES, REPLICATION SLAVE, REPLICATION CLIENT ON *.* TO 'debezium'@'%';
              FLUSH PRIVILEGES;
              SQL
              echo "[mariadb-bootstrap] 완료"
              mariadb -h mariadb-headless -u root -p"$MARIADB_ROOT_PASSWORD" -e "SHOW DATABASES;"
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: mariadb-secret, key: root-password } }
            - name: CMMN_PASSWORD
              valueFrom: { secretKeyRef: { name: cmmn-api-secret, key: db-password } }
            - name: PROXYSQL_MONITOR_PASSWORD
              valueFrom: { secretKeyRef: { name: proxysql-secret, key: monitor-password } }
            # ★ mariadb-secret 에 넣는다 — ExternalSecret 이 dataFrom.extract 로
            #   모든 키를 가져오므로 OpenBao 에 키를 더하면 자동 전파된다.
            - name: DEBEZIUM_PASSWORD
              valueFrom: { secretKeyRef: { name: mariadb-secret, key: debezium-password } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 256Mi }
