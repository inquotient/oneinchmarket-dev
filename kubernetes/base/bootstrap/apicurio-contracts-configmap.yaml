data:
  ccompat--api-usage-event.json: '{"schema":"{\n  \"$schema\": \"https://json-schema.org/draft/2020-12/schema\",\n  \"$id\": \"https://oneinchmarket.co.kr/schemas/api-usage-event/v1\",\n  \"title\": \"API Usage Event (CloudEvents 1.0)\",\n  \"description\": \"\uc678\ubd80 \uace0\uac1d\uc5d0\uac8c \uc778\ubcf4\uc774\uc2a4\ub97c \ubc1c\ud589\ud558\uae30 \uc704\ud55c API \ud638\ucd9c \uacc4\ub7c9 \uc774\ubca4\ud2b8. CloudEvents 1.0 \ubd09\ud22c\ub97c \uc4f4\ub2e4 \u2014 \uacc4\ub7c9 \ubc31\uc5d4\ub4dc(OpenMeter \ub4f1)\ub97c \ub098\uc911\uc5d0 \ubc14\uafb8\ub354\ub77c\ub3c4 \uc774 \uacc4\uc57d\uc740 \uc720\uc9c0\ub41c\ub2e4.\",\n  \"type\": \"object\",\n  \"required\": [\"specversion\", \"id\", \"source\", \"type\", \"subject\", \"time\", \"data\"],\n  \"additionalProperties\": false,\n  \"properties\": {\n    \"specversion\": { \"const\": \"1.0\" },\n    \"id\": {\n      \"type\": \"string\",\n      \"minLength\": 1,\n      \"description\": \"\u2605 \uba71\ub4f1\uc131 \ud0a4\ub2e4. \uccad\uad6c\uc758 \uc815\ud655\uc131\uc774 \uc5ec\uae30\uc5d0 \ub2ec\ub824 \uc788\ub2e4. Kafka \ub294 at-least-once \uc774\ubbc0\ub85c \uac19\uc740 \uc774\ubca4\ud2b8\uac00 \ubc18\ub4dc\uc2dc \ub450 \ubc88 \uc774\uc0c1 \uc628\ub2e4 \u2014 \uc18c\ube44\uc790\ub294 \uc774 \uac12\uc73c\ub85c \uc911\ubcf5\uc744 \uc81c\uac70\ud574\uc57c \ud55c\ub2e4. \uac12\uc758 \ucd9c\ucc98\ub294 Envoy \uc758 x-request-id \ub2e4(\uc694\uccad\ub2f9 \uc720\uc77c). \uc560\ud50c\ub9ac\ucf00\uc774\uc158\uc774 \uc9c1\uc811 \ubc1c\ud589\ud560 \ub54c\ub3c4 \uc694\uccad\ub2f9 \uc720\uc77c\ud55c \uac12\uc744 \uc368\uc57c \ud558\uba70, \ud0c0\uc784\uc2a4\ud0ec\ud504\ub098 \uc21c\ubc88\uc744 \uc4f0\uc9c0 \ub9d0 \uac83.\"\n    },\n    \"source\": {\n      \"type\": \"string\",\n      \"format\": \"uri-reference\",\n      \"description\": \"\uc774\ubca4\ud2b8\ub97c \ub0b8 \uacc4\ub7c9 \uc9c0\uc810. \uc608: //gateway.oneinchmarket.co.kr/istio. \uc5b4\ub290 \uc9c0\uc810\uc5d0\uc11c \uc14c\ub294\uc9c0\uac00 \ubd84\uc7c1 \uc2dc \uadfc\uac70\uac00 \ub41c\ub2e4.\"\n    },\n    \"type\": {\n      \"type\": \"string\",\n      \"enum\": [\"io.oneinchmarket.api.request.v1\"],\n      \"description\": \"\ubc84\uc804\uc744 \ud0c0\uc785\uc5d0 \ubc15\ub294\ub2e4. \uc2a4\ud0a4\ub9c8\uac00 \ubc14\ub00c\uba74 v2 \ub97c \uc0c8\ub85c \ub0b4\uace0 \ub458\uc744 \ubcd1\ud589\ud55c\ub2e4 \u2014 \uccad\uad6c \uc774\ub825\uc744 \uc18c\uae09 \uc7ac\ud574\uc11d\ud558\uc9c0 \uc54a\uae30 \uc704\ud574\uc11c\ub2e4.\"\n    },\n    \"subject\": {\n      \"type\": \"string\",\n      \"minLength\": 1,\n      \"description\": \"\u2605 \uccad\uad6c \ub300\uc0c1. Keycloak \uc758 \uc870\uc9c1/\ud14c\ub10c\ud2b8 \uc2dd\ubcc4\uc790\ub97c \uc4f4\ub2e4(\uc0ac\uc6a9\uc790 sub \uac00 \uc544\ub2c8\ub2e4 \u2014 \uc0ac\ub78c\uc774 \ubc14\ub00c\uc5b4\ub3c4 \uccad\uad6c \uc8fc\uccb4\ub294 \uc720\uc9c0\ub418\uc5b4\uc57c \ud55c\ub2e4). \uac1c\uc778\uc2dd\ubcc4\uc815\ubcf4\ub97c \ub123\uc9c0 \ub9d0 \uac83.\"\n    },\n    \"time\": {\n      \"type\": \"string\",\n      \"format\": \"date-time\",\n      \"description\": \"\u2605 \uad00\uce21 \uc2dc\uac01\uc774\ub2e4. \uc218\uc9d1 \uc2dc\uac01\uc774 \uc544\ub2c8\ub2e4. \uccad\uad6c \uc8fc\uae30 \uacbd\uacc4(\uc6d4\ub9d0)\uc5d0\uc11c \uc5b4\ub290 \ub2ec\uc5d0 \uc18d\ud558\ub294\uc9c0\ub97c \uc774 \uac12\uc774 \uc815\ud55c\ub2e4. \uac8c\uc774\ud2b8\uc6e8\uc774 \uc2dc\uacc4\uac00 \ud2c0\uc5b4\uc9c0\uba74 \uccad\uad6c\uac00 \ud2c0\uc5b4\uc9c0\ubbc0\ub85c NTP \ub3d9\uae30\ud654\uac00 \uc804\uc81c\ub2e4.\"\n    },\n    \"datacontenttype\": { \"const\": \"application/json\" },\n    \"data\": {\n      \"type\": \"object\",\n      \"required\": [\"route\", \"method\", \"status\", \"duration_ms\"],\n      \"additionalProperties\": false,\n      \"properties\": {\n        \"route\": {\n          \"type\": \"string\",\n          \"description\": \"\uc815\uaddc\ud654\ub41c \uacbd\ub85c \ud15c\ud50c\ub9bf(\uc608: /v1/orders/{id}). \u2605 \uc6d0\ubcf8 \uacbd\ub85c\ub97c \uadf8\ub300\ub85c \ub123\uc9c0 \ub9d0 \uac83 \u2014 \uce74\ub514\ub110\ub9ac\ud2f0\uac00 \ud3ed\ubc1c\ud558\uace0 \uacbd\ub85c\uc5d0 \uc2dd\ubcc4\uc790\uac00 \uc11e\uc5ec \ub4e4\uc5b4\uc628\ub2e4.\"\n        },\n        \"method\": { \"type\": \"string\", \"enum\": [\"GET\",\"POST\",\"PUT\",\"PATCH\",\"DELETE\",\"HEAD\",\"OPTIONS\"] },\n        \"status\": {\n          \"type\": \"integer\", \"minimum\": 100, \"maximum\": 599,\n          \"description\": \"\u2605 \uc774\ubca4\ud2b8\ub294 \uacb0\uacfc\uc640 \ubb34\uad00\ud558\uac8c \uc804\ubd80 \ub0b8\ub2e4. \ub300\uc2e0 \uc774 \uac12\uc744 \uc2e4\uc5b4 \ubbf8\ud130\uac00 \uace8\ub77c \uc4f0\uac8c \ud55c\ub2e4. 5xx(\uc6b0\ub9ac \uc798\ubabb)\ub97c \uccad\uad6c\ud558\ub294 \uac83\uc740 \ubc29\uc5b4\ud560 \uc218 \uc5c6\uace0, 4xx \ub97c \uccad\uad6c\ud560\uc9c0\ub294 \uc694\uae08\uc81c\uac00 \uc815\ud560 \ubb38\uc81c\uc774\uc9c0 \uacc4\ub7c9\uae30\uac00 \uc815\ud560 \ubb38\uc81c\uac00 \uc544\ub2c8\ub2e4.\"\n        },\n        \"duration_ms\": { \"type\": \"number\", \"minimum\": 0 },\n        \"request_bytes\": { \"type\": \"integer\", \"minimum\": 0 },\n        \"response_bytes\": { \"type\": \"integer\", \"minimum\": 0 },\n        \"api_product\": {\n          \"type\": \"string\",\n          \"description\": \"\uc694\uae08\uc81c\uac00 \ubb36\ub294 \ub2e8\uc704. \uacbd\ub85c\ubcf4\ub2e4 \uac70\uce60\uace0 \uc548\uc815\uc801\uc774\ub77c \uac00\uaca9\ud45c\uac00 \uacbd\ub85c \ubcc0\uacbd\uc5d0 \ud754\ub4e4\ub9ac\uc9c0 \uc54a\ub294\ub2e4.\"\n        }\n      }\n    }\n  }\n}\n","schemaType":"JSON"}'
  ccompat--dev.api.cmmn.multilanguage-refresh-value.json: '{"schema":"{\n  \"type\": \"record\",\n  \"name\": \"MultiLanguageChanged\",\n  \"namespace\": \"oneinchmarket.commonapi.domain.event\",\n  \"doc\": \"\ub2e4\uad6d\uc5b4 \ud56d\ubaa9\uc774 \ub4f1\ub85d\u00b7\ubcc0\uacbd\ub420 \ub54c dev.api.cmmn.multilanguage-refresh \ud1a0\ud53d\uc73c\ub85c \ub098\uac00\ub294 \uc774\ubca4\ud2b8. \uc2e4\uce21\uc5d0\uc11c \uc5bb\uc740 \uc815\uc758\ub2e4(\u00a78-99) \u2014 \uc571\uc774 \uac8c\uc2dc\uc5d0 \uc2e4\ud328\ud558\uba70 \ub0a8\uae34 \uc608\uc678\uc5d0 \uc9c1\ub82c\ud654\uae30\uac00 \ucc0d\uc740 \uc2a4\ud0a4\ub9c8 \uc804\ubb38\uc774 \ub4e4\uc5b4 \uc788\uc5c8\ub2e4. \ud30c\uc77c\uba85\uc774 \uace7 ccompat subject \uc774\ubbc0\ub85c \ubc14\uafb8\uc9c0 \ub9d0 \uac83.\",\n  \"fields\": [\n    { \"name\": \"multiLanguageNo\", \"type\": [\"null\", \"long\"], \"default\": null },\n    { \"name\": \"multiLanguageId\", \"type\": [\"null\", { \"type\": \"string\", \"avro.java.string\": \"String\" }], \"default\": null },\n    { \"name\": \"multiLanguageUsageType\", \"type\": [\"null\", { \"type\": \"string\", \"avro.java.string\": \"String\" }], \"default\": null },\n    { \"name\": \"multiLanguageType\", \"type\": [\"null\", { \"type\": \"string\", \"avro.java.string\": \"String\" }], \"default\": null },\n    { \"name\": \"multiLanguage\", \"type\": [\"null\", { \"type\": \"string\", \"avro.java.string\": \"String\" }], \"default\": null },\n    { \"name\": \"multiLanguageDescription\", \"type\": [\"null\", { \"type\": \"string\", \"avro.java.string\": \"String\" }], \"default\": null },\n    { \"name\": \"multiLanguageEventType\", \"type\": [\"null\", { \"type\": \"string\", \"avro.java.string\": \"String\" }], \"default\": null },\n    {\n      \"name\": \"commonData\",\n      \"type\": [\n        \"null\",\n        {\n          \"type\": \"record\",\n          \"name\": \"CommonData\",\n          \"doc\": \"\uac10\uc0ac \ud544\ub4dc. REST \uacc4\uc57d\uc758 components.schemas.CommonFields \uc640 \uac19\uc740 \uac1c\ub150\uc774\ub2e4.\",\n          \"fields\": [\n            { \"name\": \"enabled\", \"type\": [\"null\", \"boolean\"], \"default\": null },\n            { \"name\": \"deleted\", \"type\": [\"null\", \"boolean\"], \"default\": null },\n            { \"name\": \"creatorNo\", \"type\": [\"null\", \"long\"], \"default\": null },\n            { \"name\": \"createdAt\", \"type\": [\"null\", { \"type\": \"long\", \"logicalType\": \"local-timestamp-millis\" }], \"default\": null },\n            { \"name\": \"modifierNo\", \"type\": [\"null\", \"long\"], \"default\": null },\n            { \"name\": \"modifiedAt\", \"type\": [\"null\", { \"type\": \"long\", \"logicalType\": \"local-timestamp-millis\" }], \"default\": null }\n          ]\n        }\n      ],\n      \"default\": null\n    }\n  ]\n}\n","schemaType":"AVRO"}'
  v3--api-usage.json: '{"artifactId":"api-usage","artifactType":"ASYNCAPI","firstVersion":{"content":{"content":"asyncapi: ''2.6.0''\ninfo:\n  title: API Usage Metering\n  version: ''1.0.0''\n  description: |\n    \uc678\ubd80 \uace0\uac1d\uc5d0\uac8c **\uc778\ubcf4\uc774\uc2a4\ub97c \ubc1c\ud589\ud558\uae30 \uc704\ud55c** API \ud638\ucd9c \uacc4\ub7c9 \ucc44\ub110.\n\n    ## \uc65c \uacc4\uc57d\uc774 \uba3c\uc800\uc778\uac00\n\n    \uacc4\ub7c9 \uc9c0\uc810\uc744 \ub098\uc911\uc5d0 \ubc14\uafb8\uba74 \uc774\ubca4\ud2b8 \uc2a4\ud0a4\ub9c8\u00b7\uc9d1\uacc4 \uaddc\uce59\u00b7**\uc774\ubbf8 \uccad\uad6c\ud55c \uc774\ub825**\uc774\n    \ud568\uaed8 \ud754\ub4e4\ub9b0\ub2e4. \uccad\uad6c\ub294 \uc18c\uae09 \uc7ac\ud574\uc11d\uc774 \ubd88\uac00\ub2a5\ud55c \uc885\ub958\uc758 \ub370\uc774\ud130\ub77c, \uc774 \uacc4\uc57d\uc774\n    Gateway\u00b7\uacc4\ub7c9 \ubc31\uc5d4\ub4dc\ubcf4\ub2e4 \uba3c\uc800 \uace0\uc815\ub418\uc5b4\uc57c \ud55c\ub2e4.\n\n    ## \uacbd\ub85c\n\n    ```\n    Istio Gateway(Envoy \uc561\uc138\uc2a4 \ub85c\uadf8) \u2192 Kafka(api-usage) \u2192 \uacc4\ub7c9 \ubc31\uc5d4\ub4dc \u2192 \uc778\ubcf4\uc774\uc2a4\n    ```\n\n    \uacc4\ub7c9 \ubc31\uc5d4\ub4dc\ub294 **OpenMeter** \ub2e4 \u2014 ADR-072 \uc758 \ubc31\uc5d4\ub4dc \uacb0\uc815\uc774\uace0, ADR-073 \uc774 \uadf8\uac83\uc744\n    \uc704\ud574 ADR-070 \uc758 ClickHouse \ubc94\uc704\ub97c \uac1c\uc815\ud588\ub2e4(`Accepted`). \ub2e4\ub9ac\ub294 Logstash \uac00\n    \ub193\ub294\ub2e4(`api-usage` \ud1a0\ud53d \u2192 OpenMeter \uc218\uc9d1 API). CloudEvents 1.0 \ubd09\ud22c\ub97c \uc4f0\ub294\n    \uc774\uc720\ub294 \uadf8\ub798\ub3c4 \uc720\ud6a8\ud558\ub2e4 \u2014 \ubc31\uc5d4\ub4dc\ub97c \ubc14\uafd4\ub3c4 \uc774 \uacc4\uc57d\uacfc \ubc1c\ud589 \uce21\uc740 \uadf8\ub300\ub85c \ub454\ub2e4.\n\n    > \u2605 2026-10-10 \uae4c\uc9c0 \uc774 \uc904\uc740 \"\uacc4\ub7c9 \ubc31\uc5d4\ub4dc\ub294 \uc544\uc9c1 \ud655\uc815\ub418\uc9c0 \uc54a\uc558\ub2e4(**ADR-071**)\"\n    > \uc600\uace0 **\ubc88\ud638\uc640 \ub0b4\uc6a9\uc774 \ub458 \ub2e4 \ud2c0\ub838\ub2e4.** ADR-071 \uc740 \uc678\ubd80 \uc9c4\uc785\uc810(Istio Gateway)\n    > \uacb0\uc815\uc774\uace0 \ubc31\uc5d4\ub4dc \ubcf4\ub958\ub294 ADR-072 \uc600\ub2e4 \u2014 \uadf8\ub54c `ADR-071` \uc774 **\ub450 \uacb0\uc815\uc5d0 \uc4f0\uc774\uace0\n    > \uc788\uc5c8\ub358** \ud0d3\uc5d0 \uc0dd\uae34 \uc624\uc778\uc6a9\uc774\ub2e4. \uadf8 \ucda9\ub3cc\uc740 \uac19\uc740 \ub0a0 \ud574\uc18c\ud588\ub2e4(\uc61b\uac83\uc744 `077`\u00b7`078`\n    > \ub85c \uc62e\uacbc\ub2e4 \u2014 `docs/ADR-CANDIDATES.md` \uba38\ub9ac\ub9d0 \u00a7\uac74\uc218).\n    > **\uacc4\uc57d\uc758 \uc11c\uc220\uc740 \uc9c0\uae08 \ucc38\uc774\uc5b4\uc57c \ud558\ubbc0\ub85c** \ubc88\ud638\ub9cc \uace0\uce58\uc9c0 \uc54a\uace0 \ub0b4\uc6a9\ub3c4 \ub9de\ucdc4\ub2e4.\n    > \u2605 ADR-072 \uc758 \ubc31\uc5d4\ub4dc \uc0c1\ud0dc\ub3c4 \uac19\uc740 \ub0a0 \ub2eb\uc558\ub2e4(`Open` \u2192 `Accepted \u2014 OpenMeter`).\n    > \uad6c\ud604\uc774 \uacb0\uc815\uc744 \uc55e\uc9c8\ub7ec \uac00 \uc788\uc5c8\uace0, \uadf8 \ub0a1\uc740 `Open` \uc774 \uc774 \uc904\uc758 \"\ubbf8\uc815\" \uc11c\uc220\uc744\n    > \ub5a0\ubc1b\uce58\uace0 \uc788\uc5c8\ub2e4 \u2014 **\ub0a1\uc740 `Open` \uc740 \uc26c\ub294 \ud56d\ubaa9\uc774 \uc544\ub2c8\ub77c \ud2c0\ub9b0 \uc815\ubcf4\ub97c \ud37c\ub728\ub9b0\ub2e4.**\n\n    ## \uccad\uad6c \uc815\ud655\uc131\uc5d0 \uc9c1\uacb0\ub418\ub294 \uc138 \uac00\uc9c0\n\n    1. **\uba71\ub4f1\uc131** \u2014 Kafka \ub294 at-least-once \ub2e4. \uac19\uc740 \uc774\ubca4\ud2b8\uac00 \ubc18\ub4dc\uc2dc \ub450 \ubc88 \uc774\uc0c1\n       \uc628\ub2e4. `id`(Envoy `x-request-id`)\ub85c \uc911\ubcf5\uc744 \uc81c\uac70\ud558\uc9c0 \uc54a\uc73c\uba74 \uace0\uac1d\uc5d0\uac8c\n       \uacfc\ub2e4 \uccad\uad6c\ud55c\ub2e4.\n    2. **\uad00\uce21 \uc2dc\uac01** \u2014 `time` \uc774 \uccad\uad6c \uc8fc\uae30 \uadc0\uc18d\uc744 \uc815\ud55c\ub2e4. \uc218\uc9d1 \uc2dc\uac01\uc774 \uc544\ub2c8\ub2e4.\n       \uac8c\uc774\ud2b8\uc6e8\uc774 NTP \ub3d9\uae30\ud654\uac00 \uc804\uc81c\ub2e4.\n    3. **\uc9c0\uac01 \uc774\ubca4\ud2b8** \u2014 \uc6d4\ub9d0 \uacbd\uacc4\uc5d0\uc11c \ub2a6\uac8c \ub3c4\ucc29\ud55c \uc774\ubca4\ud2b8\ub97c \uc5b4\ub290 \ub2ec\uc5d0 \ub123\uc744\uc9c0\ub294\n       **\uacc4\ub7c9 \ubc31\uc5d4\ub4dc\uc758 \uc815\ucc45**\uc774\ub2e4. \uc774 \uacc4\uc57d\uc740 `time` \uc744 \uc815\ud655\ud788 \uc2e4\uc5b4 \uc8fc\ub294 \ub370\uae4c\uc9c0\n       \ucc45\uc784\uc9c4\ub2e4.\n\n    ## \ub2f4\uc9c0 \uc54a\ub294 \uac83\n\n    \uac1c\uc778\uc2dd\ubcc4\uc815\ubcf4\ub97c \ub123\uc9c0 \uc54a\ub294\ub2e4. `subject` \ub294 \uc0ac\uc6a9\uc790\uac00 \uc544\ub2c8\ub77c **\uc870\uc9c1/\ud14c\ub10c\ud2b8**\n    \uc2dd\ubcc4\uc790\ub2e4 \u2014 \ub2f4\ub2f9\uc790\uac00 \ubc14\ub00c\uc5b4\ub3c4 \uccad\uad6c \uc8fc\uccb4\ub294 \uc720\uc9c0\ub418\uc5b4\uc57c \ud55c\ub2e4.\n  contact:\n    name: OneinchMarket Platform\n    url: https://gitlab.oneinchmarket.co.kr/infra/oneinchmarket-infra\n  license:\n    name: Proprietary\n\nservers:\n  local:\n    url: kafka-headless.local.svc.cluster.local:9092\n    protocol: kafka\n    description: |\n      \ub85c\uceec \ub2e8\uc77c \ub178\ub4dc. \ud3c9\ubb38\ucc98\ub7fc \ubcf4\uc774\ub098 ambient \ud3b8\uc785 \uc0c1\ud0dc\ub77c ztunnel \uc774 mTLS \ub85c\n      \uac10\uc2fc\ub2e4. \ubc1c\ud589\uc790\uc5d0\uac8c\ub294 \uc804\uc6a9 ServiceAccount \uac00 \ud544\uc694\ud558\uace0 Kafka \uc758\n      AuthorizationPolicy(`allow-messaging-access`)\uc5d0 \uadf8 \uc2e0\uc6d0\uc744 \ucd94\uac00\ud574\uc57c \ud55c\ub2e4 \u2014\n      \ube60\ub728\ub9ac\uba74 \uc870\uc6a9\ud788 \ub04a\uae34\ub2e4.\n\ndefaultContentType: application/json\n\nchannels:\n  api-usage:\n    description: |\n      API \ud638\ucd9c \uacc4\ub7c9 \uc774\ubca4\ud2b8.\n\n      **\ud30c\ud2f0\uc158 \ud0a4\ub294 `subject`(\ud14c\ub10c\ud2b8)\ub85c \ub450\ub294 \uac83\uc774 \ubaa9\ud45c\ub2e4** \u2014 \ud55c \uace0\uac1d\uc758\n      \uc774\ubca4\ud2b8\uac00 \uc21c\uc11c\ub97c \uc720\uc9c0\ud574\uc57c \uc9d1\uacc4\uc640 \uc815\uc815\uc774 \ub2e8\uc21c\ud574\uc9c4\ub2e4.\n\n      \u2605 **2026-09-05 \ud604\uc7ac \ucda9\uc871\ub418\uc9c0 \uc54a\uc558\ub2e4.** \uba54\uc2dc\uc9c0 key \uac00 `null` \uc774\ub2e4.\n      OTel Kafka exporter \uc758 `partition_logs_by_resource_attributes` \ub294\n      \ucd5c\uc0c1\uc704\uc5d0\uc11c\ub9cc \uc720\ud6a8\ud558\uace0(\uc2e0\ud638 \ube14\ub85d \uc544\ub798\uc5d0 \ub450\uba74 \uae30\ub3d9 \uc2e4\ud328), \ucd5c\uc0c1\uc704\uc5d0\n      \ub450\uc5b4\ub3c4 `raw`\u00b7`otlp_json` \uc5b4\ub290 \uc778\ucf54\ub529\uc5d0\uc11c\ub3c4 \ud0a4\uac00 \uc0dd\uae30\uc9c0 \uc54a\uc558\ub2e4.\n      \ub9ac\uc18c\uc2a4 \uc18d\uc131 `tenant` \ub294 \uc2e4\uc81c\ub85c \ubd99\uc5b4 \uc788\uc74c\uc744 debug exporter \ub85c \ud655\uc778\ud588\ub2e4.\n\n      \uacfc\uae08 \uc815\ud655\uc131 \uc790\uccb4\ub294 \uc774\uac83\uc5d0 \uc758\uc874\ud558\uc9c0 \uc54a\ub294\ub2e4 \u2014 \uba71\ub4f1\uc131 \ud0a4(`id`)\uac00\n      \uc911\ubcf5\uc744 \ub9c9\uace0 \uad00\uce21 \uc2dc\uac01(`time`)\uc774 \uccad\uad6c \uc8fc\uae30\ub97c \uc815\ud55c\ub2e4. \uc21c\uc11c\uac00 \ud544\uc694\ud55c\n      \uc9d1\uacc4 \ubc29\uc2dd\uc744 \ud0dd\ud560 \ub54c \ub2e4\uc2dc \ub2e4\ub904\uc57c \ud55c\ub2e4.\n\n      \ubcf4\uc874\uc740 \uccad\uad6c \ubd84\uc7c1 \ub300\uc751 \uae30\uac04\uc744 \ub530\ub978\ub2e4. \uc9d1\uacc4 \ud6c4 \uc6d0\ubcf8\uc744 \ubc84\ub9ac\uba74 \uc7ac\uacc4\uc0b0\uacfc\n      \uac10\uc0ac\uac00 \ubd88\uac00\ub2a5\ud574\uc9c0\ubbc0\ub85c, \ubcf4\uc874 \uae30\uac04\uc740 \uc694\uae08 \uc815\ucc45\uc774 \uc815\ud560 \uc0ac\ud56d\uc774\ub2e4(\ubbf8\uacb0).\n    subscribe:\n      operationId: consumeApiUsage\n      summary: \uacc4\ub7c9 \ubc31\uc5d4\ub4dc\uac00 \uc18c\ube44\ud55c\ub2e4\n      tags:\n        - name: billing\n      message:\n        $ref: ''#/components/messages/ApiUsageEvent''\n    publish:\n      operationId: publishApiUsage\n      summary: Istio Gateway \uc758 \uc561\uc138\uc2a4 \ub85c\uadf8 \ud30c\uc774\ud504\ub77c\uc778\uc774 \ubc1c\ud589\ud55c\ub2e4\n      tags:\n        - name: billing\n      message:\n        $ref: ''#/components/messages/ApiUsageEvent''\n\ncomponents:\n  messages:\n    ApiUsageEvent:\n      name: ApiUsageEvent\n      title: API Usage Event\n      summary: \uc694\uccad \ud55c \uac74\uc5d0 \ub300\ud55c \uacc4\ub7c9 \uc0ac\uc2e4\n      contentType: application/json\n      payload:\n        $ref: ''../schemas/api-usage-event.json''\n","contentType":"application/x-yaml"}}}'
  v3--cmmn-api.json: '{"artifactId":"cmmn-api","artifactType":"OPENAPI","firstVersion":{"content":{"content":"# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\n# cmmn-api REST \uacc4\uc57d\n#\n# \u2605\u2605 \uc774 \ubb38\uc11c\ub294 **\uc2e4\uce21\uc5d0\uc11c \ub098\uc654\ub2e4**(2026-09-08, \u00a78-99). \uc9c0\uc5b4\ub0b8 \ud56d\ubaa9\uc774 \uc5c6\ub2e4.\n#   \uc571 \uc18c\uc2a4\uac00 \uc774 \ub808\ud3ec\uc5d0 \uc5c6\uc5b4 \uacc4\uc57d\uc744 \uc4f8 \uadfc\uac70\uac00 \uc5c6\uc5c8\ub294\ub370, \ub2e4\uc74c \uc21c\uc11c\ub85c \uc5bb\uc5c8\ub2e4:\n#     \u2460 `/actuator/mappings` \ub97c \uc77c\uc2dc\uc801\uc73c\ub85c \uc5f4\uc5b4 \uc2e4\uc81c \ub77c\uc6b0\ud2b8 6\uac1c\ub97c \uc5f4\uac70\n#     \u2461 \uac01 \uc5d4\ub4dc\ud3ec\uc778\ud2b8\ub97c \uc2e4\uc81c\ub85c \ud638\ucd9c\ud574 \uc751\ub2f5 \ubcf8\ubb38\uc744 \uad00\ucc30\n#     \u2462 MariaDB `cmmn` \uc2a4\ud0a4\ub9c8\uc758 \uceec\ub7fc\u00b7enum \uc73c\ub85c \ud544\ub4dc \ud0c0\uc785 \ud655\uc815\n#   \u2460\uc758 \ub178\ucd9c\uc740 \ub418\ub3cc\ub838\ub2e4.\n#\n# \u2605 \uacc4\uc57d \uc6b0\uc120(ADR-067)\uc758 \uc608\uc678\uc801 \ucd9c\ubc1c\uc810\uc774\ub2e4 \u2014 \uc6d0\ub798\ub294 \uacc4\uc57d\uc774 \uba3c\uc800\uc774\uace0 \uad6c\ud604\uc774\n#   \ub530\ub77c\uc640\uc57c \ud55c\ub2e4. \uc5ec\uae30\uc11c\ub294 \uad6c\ud604\uc774 \uba3c\uc800 \uc788\uc5c8\uace0 \uacc4\uc57d\uc774 **\uc5c6\uc5c8\uc73c\ubbc0\ub85c**, \uad00\ucc30\ub85c\n#   \ud604\uc7ac \uc0c1\ud0dc\ub97c \uace0\uc815\ud55c \ub4a4 \uc55e\uc73c\ub85c\uc758 \ubcc0\uacbd\uc744 \uc774 \ubb38\uc11c\uac00 \uc774\ub048\ub2e4.\n# \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nopenapi: 3.0.3\n\ninfo:\n  title: cmmn-api\n  version: 0.1.0\n  description: |\n    \uacf5\ud1b5 \uba54\ub274\u00b7\ub2e4\uad6d\uc5b4 \ub9ac\uc18c\uc2a4\ub97c \uc81c\uacf5\ud558\ub294 \ub0b4\ubd80 REST API.\n\n    \uac8c\uc774\ud2b8\uc6e8\uc774\ub294 `api.oneinchmarket.local` \uc744 `cmmn-api-headless:8080` \uc73c\ub85c\n    \ubcf4\ub0b8\ub2e4(HTTPRoute `api`).\n\n    **\uc4f0\uae30\uc5d0\ub294 CSRF \ud1a0\ud070\uc774 \ud544\uc694\ud558\ub2e4.** `GET /csrf` \ub85c \ud1a0\ud070\uacfc \ud5e4\ub354 \uc774\ub984\uc744 \ubc1b\uc544\n    \uac19\uc740 \ucfe0\ud0a4 \uc138\uc158\uc73c\ub85c POST \ud560 \uac83. \ud1a0\ud070 \uc5c6\uc774 POST \ud558\uba74 403 \uc774\ub2e4.\n\n    ## \uc54c\ub824\uc9c4 \uc0c1\ud0dc (2026-09-08 \uc2e4\uce21)\n\n    - `POST /api/multiLanguage` \ub294 **DB \uc5d0\ub294 \uc4f0\uace0 500 \uc744 \ub0b8\ub2e4.** \ubcc0\uacbd \uc774\ubca4\ud2b8\ub97c\n      Avro \ub85c Kafka \uc5d0 \uac8c\uc2dc\ud558\ub294\ub370 \uc2a4\ud0a4\ub9c8 \ub808\uc9c0\uc2a4\ud2b8\ub9ac\uc5d0 \ud574\ub2f9 subject\n      (`dev.api.cmmn.multilanguage-refresh-value`)\uac00 \ub4f1\ub85d\ub418\uc5b4 \uc788\uc9c0 \uc54a\ub2e4.\n      `SPRING_KAFKA_PROPERTIES_AUTO_REGISTER_SCHEMAS=false` \uc774\ubbc0\ub85c \ub204\uad70\uac00\n      \uba3c\uc800 \ub4f1\ub85d\ud574\uc57c \ud55c\ub2e4 \u2014 `contracts/schemas/multi-language-changed.avsc` \uc640\n      CI \uc758 `publish-contracts` \uc7a1\uc774 \uadf8 \uc790\ub9ac\ub2e4.\n    - `POST /api/menu` \ub294 201 \ub85c \uc131\uacf5\ud55c\ub2e4.\n  contact:\n    name: OneinchMarket Platform\n    url: https://gitlab.oneinchmarket.co.kr/infra/oneinchmarket-infra\n  license:\n    name: Proprietary\n    url: https://oneinchmarket.co.kr\n\nservers:\n  - url: https://api.oneinchmarket.local\n    description: local \u2014 Istio ingress gateway (HTTPRoute `api`)\n  - url: http://cmmn-api-headless:8080\n    description: \ud074\ub7ec\uc2a4\ud130 \ub0b4\ubd80 \uc9c1\uc811 \ud638\ucd9c\n\ntags:\n  - name: menu\n    description: \uba54\ub274 \ud2b8\ub9ac\n  - name: multi-language\n    description: \ub2e4\uad6d\uc5b4 \ub77c\ubca8\u00b7\uba54\uc2dc\uc9c0\n  - name: security\n    description: CSRF \ud1a0\ud070 \ubc1c\uae09\n\npaths:\n  /csrf:\n    get:\n      tags: [security]\n      operationId: getCsrfToken\n      summary: CSRF \ud1a0\ud070 \ubc1c\uae09\n      description: |\n        \uc4f0\uae30 \uc694\uccad\uc5d0 \ud544\uc694\ud55c \ud1a0\ud070\uc744 \ubc1c\uae09\ud55c\ub2e4. \uc751\ub2f5\uc758 `headerName` \uc774 \uc9c0\uc815\ud558\ub294\n        \ud5e4\ub354\uc5d0 `token` \uc744 \uc2e4\uc5b4 \ubcf4\ub0b4\uc57c \ud558\uba70, **\uac19\uc740 \ucfe0\ud0a4 \uc138\uc158\uc774\uc5b4\uc57c \ud55c\ub2e4**.\n      responses:\n        \"200\":\n          description: \ud1a0\ud070\n          content:\n            application/json:\n              schema:\n                $ref: \"#/components/schemas/CsrfToken\"\n\n  /api/menu:\n    get:\n      tags: [menu]\n      operationId: getMenu\n      summary: \uba54\ub274 \ubaa9\ub85d\n      description: \ub4f1\ub85d\ub41c \uba54\ub274\ub97c \ubc30\uc5f4\ub85c \ub3cc\ub824\uc900\ub2e4. \uc5c6\uc73c\uba74 \ube48 \ubc30\uc5f4\uc774\ub2e4.\n      responses:\n        \"200\":\n          description: \uba54\ub274 \ubc30\uc5f4\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: \"#/components/schemas/Menu\"\n        \"500\":\n          $ref: \"#/components/responses/ServerError\"\n    post:\n      tags: [menu]\n      operationId: postMenu\n      summary: \uba54\ub274 \uc77c\uad04 \ub4f1\ub85d\n      description: |\n        **\ubcf8\ubb38\uc740 \uac1d\uccb4\uac00 \uc544\ub2c8\ub77c \ubc30\uc5f4\uc774\ub2e4.** \ub2e8\uac74\ub3c4 \ubc30\uc5f4\ub85c \uac10\uc2f8 \ubcf4\ub0bc \uac83 \u2014\n        \uac1d\uccb4\ub97c \ubcf4\ub0b4\uba74 400 \uc774\ub2e4(\uc2e4\uce21).\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: array\n              items:\n                $ref: \"#/components/schemas/Menu\"\n      responses:\n        \"201\":\n          description: \ub4f1\ub85d\ub428\n        \"400\":\n          $ref: \"#/components/responses/BadRequest\"\n        \"403\":\n          $ref: \"#/components/responses/CsrfMissing\"\n        \"500\":\n          $ref: \"#/components/responses/ServerError\"\n\n  /api/multiLanguage:\n    get:\n      tags: [multi-language]\n      operationId: getMultiLanguage\n      summary: \ub2e4\uad6d\uc5b4 \ud56d\ubaa9 \ubaa9\ub85d\n      description: \ub4f1\ub85d\ub41c \ub2e4\uad6d\uc5b4 \ud56d\ubaa9\uc744 \ubc30\uc5f4\ub85c \ub3cc\ub824\uc900\ub2e4. \uc5c6\uc73c\uba74 \ube48 \ubc30\uc5f4\uc774\ub2e4.\n      responses:\n        \"200\":\n          description: \ub2e4\uad6d\uc5b4 \ubc30\uc5f4\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: \"#/components/schemas/MultiLanguage\"\n        \"500\":\n          $ref: \"#/components/responses/ServerError\"\n    post:\n      tags: [multi-language]\n      operationId: postMultiLanguage\n      summary: \ub2e4\uad6d\uc5b4 \ud56d\ubaa9 \uc77c\uad04 \ub4f1\ub85d\n      description: |\n        \ubcf8\ubb38\uc740 \ubc30\uc5f4\uc774\ub2e4. **\uc9c0\uae08\uc740 DB \uc5d0 \uc4f4 \ub4a4 500 \uc744 \ub0b8\ub2e4** \u2014 Avro \uc2a4\ud0a4\ub9c8\uac00\n        \ub808\uc9c0\uc2a4\ud2b8\ub9ac\uc5d0 \uc5c6\uc5b4 \ubcc0\uacbd \uc774\ubca4\ud2b8 \uac8c\uc2dc\uac00 \uc2e4\ud328\ud55c\ub2e4(info \uc758 \"\uc54c\ub824\uc9c4 \uc0c1\ud0dc\").\n      requestBody:\n        required: true\n        content:\n          application/json:\n            schema:\n              type: array\n              items:\n                $ref: \"#/components/schemas/MultiLanguage\"\n      responses:\n        \"201\":\n          description: \ub4f1\ub85d\ub428\n        \"400\":\n          $ref: \"#/components/responses/BadRequest\"\n        \"403\":\n          $ref: \"#/components/responses/CsrfMissing\"\n        \"500\":\n          $ref: \"#/components/responses/ServerError\"\n\n  /api/multiLanguageAll:\n    get:\n      tags: [multi-language]\n      operationId: getMultiLanguageAll\n      summary: \ub2e4\uad6d\uc5b4 \ud56d\ubaa9 \uc804\uccb4 \ubaa9\ub85d\n      description: |\n        `GET /api/multiLanguage` \uc640 **\uac19\uc740 \ud578\ub4e4\ub7ec**(`MultiLanguageResource.\n        getMultiLanguage`)\uc5d0 \ub9e4\ud551\ub418\uc5b4 \uc788\ub2e4. \uad6c\ud604\uc0c1 \ucc28\uc774\uac00 \uacc4\uc57d\uc73c\ub85c \ub4dc\ub7ec\ub098\uc9c0\n        \uc54a\uc73c\ubbc0\ub85c \ub458 \uc911 \ud558\ub098\ub85c \uc815\ub9ac\ud558\ub294 \uac83\uc774 \uc633\ub2e4.\n      responses:\n        \"200\":\n          description: \ub2e4\uad6d\uc5b4 \ubc30\uc5f4\n          content:\n            application/json:\n              schema:\n                type: array\n                items:\n                  $ref: \"#/components/schemas/MultiLanguage\"\n        \"500\":\n          $ref: \"#/components/responses/ServerError\"\n\ncomponents:\n  responses:\n    BadRequest:\n      description: \ubcf8\ubb38\uc744 \uc77d\uc744 \uc218 \uc5c6\ub2e4 \u2014 \uc608\ub97c \ub4e4\uc5b4 \ubc30\uc5f4\uc774 \uc544\ub2c8\ub77c \uac1d\uccb4\ub97c \ubcf4\ub0c8\ub2e4\n      content:\n        application/json:\n          schema:\n            $ref: \"#/components/schemas/SpringError\"\n    CsrfMissing:\n      description: CSRF \ud1a0\ud070\uc774 \uc5c6\uac70\ub098 \uc138\uc158\uacfc \ub9de\uc9c0 \uc54a\ub294\ub2e4\n      content:\n        application/json:\n          schema:\n            $ref: \"#/components/schemas/SpringError\"\n    ServerError:\n      description: \uc11c\ubc84 \uc624\ub958\n      content:\n        application/json:\n          schema:\n            $ref: \"#/components/schemas/SpringError\"\n\n  schemas:\n    CsrfToken:\n      type: object\n      description: Spring Security \uac00 \ubc1c\uae09\ud558\ub294 CSRF \ud1a0\ud070\n      properties:\n        parameterName:\n          type: string\n          example: _csrf\n        token:\n          type: string\n        headerName:\n          type: string\n          example: X-CSRF-TOKEN\n      required: [parameterName, token, headerName]\n\n    SpringError:\n      type: object\n      description: Spring Boot \uae30\ubcf8 \uc624\ub958 \ud45c\ud604\n      properties:\n        timestamp:\n          type: string\n          format: date-time\n        status:\n          type: integer\n          format: int32\n        error:\n          type: string\n        path:\n          type: string\n\n    CommonFields:\n      type: object\n      description: \ub450 \ub9ac\uc18c\uc2a4\uac00 \uacf5\uc720\ud558\ub294 \uac10\uc0ac \ud544\ub4dc\n      properties:\n        enabled:\n          type: boolean\n          nullable: true\n        deleted:\n          type: boolean\n          nullable: true\n        creatorNo:\n          type: integer\n          format: int64\n          nullable: true\n        createdAt:\n          type: string\n          format: date-time\n          nullable: true\n        modifierNo:\n          type: integer\n          format: int64\n          nullable: true\n        modifiedAt:\n          type: string\n          format: date-time\n          nullable: true\n\n    Menu:\n      description: \uba54\ub274 \ud56d\ubaa9\n      allOf:\n        - $ref: \"#/components/schemas/CommonFields\"\n        - type: object\n          properties:\n            menuNo:\n              type: integer\n              format: int64\n              description: \uc11c\ubc84\uac00 \ub9e4\uae34\ub2e4. \ub4f1\ub85d \uc2dc \ubcf4\ub0b4\uc9c0 \uc54a\ub294\ub2e4\n              readOnly: true\n            menuId:\n              type: string\n              maxLength: 255\n              description: \uba54\ub274 \uc2dd\ubcc4\uc790\n            menuName:\n              type: string\n              maxLength: 255\n              description: \ud45c\uc2dc \uc774\ub984\n            menuDescription:\n              type: string\n              maxLength: 255\n              nullable: true\n            menuSequenceNo:\n              type: integer\n              format: int32\n              nullable: true\n              description: \ud615\uc81c \uc0ac\uc774\uc758 \uc815\ub82c \uc21c\uc11c\n            menuType:\n              type: string\n              enum: [TITLE, VIEW]\n              nullable: true\n            menuURLPath:\n              type: string\n              maxLength: 255\n              nullable: true\n              description: |\n                \u2605 \ub300\uc18c\ubb38\uc790\uc5d0 \uc8fc\uc758 \u2014 `menuUrlPath` \uac00 \uc544\ub2c8\ub77c **`menuURLPath`** \ub2e4.\n                \ud2c0\ub9b0 \uc774\ub984\uc73c\ub85c \ubcf4\ub0b4\uba74 \uc624\ub958 \uc5c6\uc774 \ubb34\uc2dc\ub418\uace0 null \ub85c \ub0a8\ub294\ub2e4(\uc2e4\uce21).\n            multiLanguageId:\n              type: string\n              maxLength: 255\n              nullable: true\n              description: MultiLanguage.multiLanguageId \ub97c \uac00\ub9ac\ud0a8\ub2e4\n            parentMenuNo:\n              type: integer\n              format: int64\n              nullable: true\n              description: \uc0c1\uc704 \uba54\ub274\uc758 menuNo\n            attachFileGroupNo:\n              type: integer\n              format: int64\n              nullable: true\n\n    MultiLanguage:\n      description: \ub2e4\uad6d\uc5b4 \ub77c\ubca8\u00b7\uba54\uc2dc\uc9c0 \ud55c \uac74\n      allOf:\n        - $ref: \"#/components/schemas/CommonFields\"\n        - type: object\n          properties:\n            multiLanguageNo:\n              type: integer\n              format: int64\n              description: \uc11c\ubc84\uac00 \ub9e4\uae34\ub2e4. \ub4f1\ub85d \uc2dc \ubcf4\ub0b4\uc9c0 \uc54a\ub294\ub2e4\n              readOnly: true\n            multiLanguageId:\n              type: string\n              maxLength: 255\n              description: \ub2e4\uad6d\uc5b4 \uc2dd\ubcc4\uc790\n            multiLanguage:\n              type: string\n              maxLength: 255\n              description: \ud45c\uc2dc \ubb38\uc790\uc5f4\n            multiLanguageDescription:\n              type: string\n              maxLength: 255\n              nullable: true\n            multiLanguageType:\n              type: string\n              enum: [EN, KO]\n              nullable: true\n              description: \uc5b8\uc5b4\n            multiLanguageUsageType:\n              type: string\n              enum: [LABEL, MESSAGE]\n              nullable: true\n              description: \uc4f0\uc784\uc0c8\n","contentType":"application/x-yaml"}}}'
