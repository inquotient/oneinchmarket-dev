---
# ★ 전용 SA. 이 Job 은 `default` 로 돌아 ztunnel 이 PostgreSQL 접근을 거부했다
#   — `allow-database-access` 가 principal 목록으로 허용하는데 `*/sa/default`
#   는 거기 없다. 증상은 인증 실패가 아니라 **연결 실패**다:
#     ERROR MetastoreSchemaTool: Failed to get schema version.
#     Underlying cause: org.postgresql.util.PSQLException : The connection attempt failed.
#   ★★ 그런데 TCP 사전 검사(/dev/tcp)는 **통과한다** — ztunnel 이 15008 에서
#     끊기 때문에 포트 열림 검사로는 드러나지 않는다. 그래서 "DB 는 살아 있는데
#     JDBC 만 안 된다" 로 보인다.
#   편입 전에는 통했으므로 처음 만들 때는 드러나지 않고 **재실행할 때** 터진다
#   — 부트스트랩 Job 네 번째 사례다(kafka-topics·ILM·마이그레이션에 이어).
#   Gotcha 19 · §8-52 · §8-71
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hive-schematool
  labels:
    app.kubernetes.io/name: hive-schematool
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
# G22 — Hive Metastore 스키마 초기화. postgres-bootstrap 이 만든
# hive_metastore DB·롤을 전제한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: hive-schematool
  labels:
    app.kubernetes.io/name: hive-schematool
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive-schematool
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      restartPolicy: OnFailure
      serviceAccountName: hive-schematool
      priorityClassName: batch-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # apache/hive 이미지에는 PostgreSQL JDBC 드라이버가 없다.
      # StatefulSet 과 동일하게 initContainer 로 받는다 (SEC-512 는 그대로 남는다).
      initContainers:
        - name: download-postgres-driver
          image: busybox:1.38.0
          command: ["/bin/sh", "-c"]
          args:
            - wget -O /driver/postgresql-42.7.3.jar https://jdbc.postgresql.org/download/postgresql-42.7.3.jar
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - name: jdbc-driver
              mountPath: /driver
      containers:
        - name: schematool
          # ★★ 4.2.1 = sha256:b19bb5bd… — **태그가 아니라 다이제스트로 고정한다.**
          #   `apache/hive:4.2.1` 은 같은 태그로 내용이 바뀌었다(§8-72): 번들
          #   Hadoop 이 3.3.6 -> 3.4.1 로, AWS SDK 가 v1 -> v2 로 갈렸다.
          #   메타스토어·HiveServer2 와 **같은 다이제스트**여야 한다 —
          #   스키마 도구와 서버의 버전이 갈리면 스키마 검사가 어긋난다.
          image: apache/hive@sha256:b19bb5bd01f233a3f99d941ebf08acaff68c55911dd5fa42ea03928e51860b91
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "[hive-schematool] PostgreSQL hive_metastore 대기"
              until (echo > /dev/tcp/postgresql-headless/5432) >/dev/null 2>&1; do sleep 3; done
              # 이미 초기화되어 있으면 -info 가 성공한다. 그때는 건너뛴다.
              # schematool 은 hive-site.xml 만 읽는다. hive-site.xml 에 JDBC 설정이
              # 없어 Derby 로 떨어졌다(Metastore connection URL: jdbc:derby:...).
              # SERVICE_OPTS 의 -D 로는 반영되지 않으므로 CLI 플래그로 명시한다.
              JDBC=(-url "jdbc:postgresql://postgresql-headless:5432/hive_metastore"
                    -driver org.postgresql.Driver
                    -userName hive -passWord "$HIVE_DB_PASSWORD")
              # ★ 세 갈래다 — 없으면 초기화, 낡았으면 업그레이드, 맞으면 통과.
              #   `-info` 는 스키마가 **바이너리보다 낡아도 실패**하므로
              #   "실패 = 없음" 으로 볼 수 없다. 실패 출력으로 가른다:
              #   버전을 읽어냈다면(= 스키마는 있다) 업그레이드, 아니면 초기화.
              #   psql 로 가르지 않는 이유는 hive 이미지에 psql 이 없어서다.
              set +e
              INFO=$(/opt/hive/bin/schematool -dbType postgres -info "${JDBC[@]}" 2>&1)
              RC=$?
              set -e
              if [ "$RC" -eq 0 ]; then
                echo "[hive-schematool] 스키마 버전이 이 배포판과 일치한다 — 건너뜀"
              elif echo "$INFO" | grep -qiE "Metastore schema version|Database Schema Version"; then
                # ★★ 되돌릴 수 없는 단계다. 실행 전에 pg_dump 를 떠 둘 것.
                #   이 갈래가 없으면 Hive 를 올릴 때 메타스토어가
                #   "Hive Schema version does not match metastore's" 로 기동하지
                #   못한다 — 그리고 그 오류는 메타스토어 로그에만 나온다.
                echo "[hive-schematool] 스키마가 낡았다 — 업그레이드한다"
                echo "$INFO" | grep -iE "version" | head -3
                /opt/hive/bin/schematool -dbType postgres -upgradeSchema "${JDBC[@]}"
              else
                echo "[hive-schematool] 스키마가 없다 — 초기화한다"
                /opt/hive/bin/schematool -dbType postgres -initSchema "${JDBC[@]}"
              fi
              /opt/hive/bin/schematool -dbType postgres -info "${JDBC[@]}"
              echo "[hive-schematool] 완료"
          env:
            - name: HIVE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: hive-metastore-secret, key: db-password } }
            - name: DB_DRIVER
              value: postgres
            - name: SERVICE_OPTS
              value: >-
                -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
                -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgresql-headless:5432/hive_metastore
                -Djavax.jdo.option.ConnectionUserName=hive
                -Djavax.jdo.option.ConnectionPassword=$(HIVE_DB_PASSWORD)
            - name: SERVICE_NAME
              value: metastore
          volumeMounts:
            - name: jdbc-driver
              mountPath: /opt/hive/lib/postgresql-42.7.3.jar
              subPath: postgresql-42.7.3.jar
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: "1", memory: 1Gi }
      volumes:
        - name: jdbc-driver
          emptyDir: {}
        - name: hive-config
          configMap:
            name: hive-metastore-config
