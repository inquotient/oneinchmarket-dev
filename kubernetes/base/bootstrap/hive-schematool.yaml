# G22 — Hive Metastore 스키마 초기화. postgres-bootstrap 이 만든
# hive_metastore DB·롤을 전제한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: hive-schematool
  labels:
    app.kubernetes.io/name: hive-schematool
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive-schematool
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      restartPolicy: OnFailure
      priorityClassName: batch-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      # apache/hive 이미지에는 PostgreSQL JDBC 드라이버가 없다.
      # StatefulSet 과 동일하게 initContainer 로 받는다 (SEC-512 는 그대로 남는다).
      initContainers:
        - name: download-postgres-driver
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - wget -O /driver/postgresql-42.7.3.jar https://jdbc.postgresql.org/download/postgresql-42.7.3.jar
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - name: jdbc-driver
              mountPath: /driver
      containers:
        - name: schematool
          image: apache/hive:4.0.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              echo "[hive-schematool] PostgreSQL hive_metastore 대기"
              until (echo > /dev/tcp/postgresql-headless/5432) >/dev/null 2>&1; do sleep 3; done
              # 이미 초기화되어 있으면 -info 가 성공한다. 그때는 건너뛴다.
              # schematool 은 hive-site.xml 만 읽는다. hive-site.xml 에 JDBC 설정이
              # 없어 Derby 로 떨어졌다(Metastore connection URL: jdbc:derby:...).
              # SERVICE_OPTS 의 -D 로는 반영되지 않으므로 CLI 플래그로 명시한다.
              JDBC=(-url "jdbc:postgresql://postgresql-headless:5432/hive_metastore"
                    -driver org.postgresql.Driver
                    -userName hive -passWord "$HIVE_DB_PASSWORD")
              if /opt/hive/bin/schematool -dbType postgres -info "${JDBC[@]}" >/dev/null 2>&1; then
                echo "[hive-schematool] 스키마가 이미 존재한다 — 건너뜀"
              else
                /opt/hive/bin/schematool -dbType postgres -initSchema "${JDBC[@]}"
              fi
              /opt/hive/bin/schematool -dbType postgres -info "${JDBC[@]}"
              echo "[hive-schematool] 완료"
          env:
            - name: HIVE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: hive-metastore-secret, key: db-password } }
            - name: DB_DRIVER
              value: postgres
            - name: SERVICE_OPTS
              value: >-
                -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
                -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgresql-headless:5432/hive_metastore
                -Djavax.jdo.option.ConnectionUserName=hive
                -Djavax.jdo.option.ConnectionPassword=$(HIVE_DB_PASSWORD)
            - name: SERVICE_NAME
              value: metastore
          volumeMounts:
            - name: jdbc-driver
              mountPath: /opt/hive/lib/postgresql.jar
              subPath: postgresql-42.7.3.jar
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits:   { cpu: "1", memory: 1Gi }
      volumes:
        - name: jdbc-driver
          emptyDir: {}
        - name: hive-config
          configMap:
            name: hive-metastore-config
