# 389ds 컨테이너는 인스턴스만 만든다. DS_SUFFIX_NAME 을 주어도
# **백엔드를 만들지 않는다** — rootDSE 의 namingContexts 가 비어 있고
# 백엔드 목록(cn=ldbm database,cn=plugins,cn=config)도 0건이다.
# 그 상태에서는 ldapadd 가 무엇을 넣든 32(No such object)로 거부된다.
#
#   ldapsearch -b dc=oneinchmarket,dc=co,dc=kr  ->  result: 32 No such object
#
# LAM 이 트리를 못 그리고 Keycloak federation·Ranger usersync 도 붙지 못한다.
# 그래서 백엔드 생성부터 한다. dsconf 는 이미지에 들어 있다.
#
# 멱등하다 — 이미 있으면 dsconf/ldapadd 가 "already exists" 를 돌려주고
# 그것을 성공으로 친다. 마지막에 실제 조회로 검증하고, 검증이 실패하면
# 0 이 아닌 코드로 끝난다(조용한 성공을 만들지 않는다).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ds389-bootstrap
  labels:
    app.kubernetes.io/name: ds389-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: ds389-bootstrap
  labels:
    app.kubernetes.io/name: ds389-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ds389-bootstrap
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      # ★ 전용 SA. ambient 에서 ServiceAccount 는 곧 신원이고, `default` 로
      #   도는 워크로드는 서로 구분되지 않아 정책을 쓸 수 없다(Gotcha 10).
      #   이 Job 은 **지금은 성공한다** — 목적지가 제한적인 ALLOW 정책에
      #   선택되지 않을 뿐이다. 그 정책에 워크로드가 하나 추가되는 순간
      #   함께 끊기고, 증상은 오류가 아니라 **무한 대기**다(Gotcha 19).
      #   고장난 뒤가 아니라 지금 준다 — §8-86
      serviceAccountName: ds389-bootstrap
      restartPolicy: OnFailure
      priorityClassName: batch-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          # ldapadd·dsconf 가 들어 있는 이미지를 새로 끌어오지 않고 ds389 이미지를 쓴다.
          image: docker.io/389ds/dirsrv:3.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail
              LDAP="ldap://ds389-headless:3389"
              BASE="dc=oneinchmarket,dc=co,dc=kr"
              DM="cn=Directory Manager"

              echo "[ds389-bootstrap] LDAP 대기"
              until ldapsearch -x -H "$LDAP" -b "" -s base >/dev/null 2>&1; do sleep 3; done

              # ── 1. 백엔드 + 루트 엔트리
              echo "[ds389-bootstrap] 백엔드 userRoot ($BASE)"
              out=$(dsconf -D "$DM" -w "$DM_PASSWORD" "$LDAP" backend create \
                      --suffix "$BASE" --be-name userRoot --create-suffix 2>&1) || true
              printf '  %s\n' "$out"

              # ── 2. 조직 단위
              #    ★ LDIF 는 공백으로 시작하는 줄을 앞줄의 이어붙임(line folding)
              #      으로 해석한다. YAML 들여쓰기를 sed 로 벗겨낸다.
              add() {
                out=$(printf '%s\n' "$1" | sed 's/^[[:space:]]*//' \
                        | ldapadd -x -H "$LDAP" -D "$DM" -w "$DM_PASSWORD" 2>&1)
                if printf '%s' "$out" | grep -qiE "already exists"; then
                  echo "  exists"; return 0
                fi
                printf '  %s\n' "$out"
              }

              echo "[ds389-bootstrap] ou=people"
              add "dn: ou=people,${BASE}
              objectClass: top
              objectClass: organizationalUnit
              ou: people"

              echo "[ds389-bootstrap] ou=groups"
              add "dn: ou=groups,${BASE}
              objectClass: top
              objectClass: organizationalUnit
              ou: groups"

              # ── 3. 검증. 여기서 실패하면 Job 도 실패해야 한다.
              # ── 3. 스모크 픽스처
              #    usersync 가 LDAP -> Ranger 동기화를 실제로 하는지 보려면
              #    원천에 사용자·그룹이 하나씩은 있어야 한다. 없으면
              #    "0명 동기화" 와 "설정이 틀려 0명" 을 구분할 수 없다.
              echo "[ds389-bootstrap] uid=oim-svc (스모크 픽스처)"
              add "dn: uid=oim-svc,ou=people,${BASE}
              objectClass: top
              objectClass: person
              objectClass: organizationalPerson
              objectClass: inetOrgPerson
              uid: oim-svc
              cn: OneinchMarket Service Account
              sn: Service"

              echo "[ds389-bootstrap] cn=oim-admins (스모크 픽스처)"
              add "dn: cn=oim-admins,ou=groups,${BASE}
              objectClass: top
              objectClass: groupOfNames
              cn: oim-admins
              member: uid=oim-svc,ou=people,${BASE}"

              # ── 4. 동기화 전용 읽기 계정
              #
              #   ★ ranger-usersync 가 `cn=Directory Manager`(root DN)로 바인드하고
              #     있었다. 읽기만 하면 되는 폴링 클라이언트가 **디렉터리 서버의
              #     최고 권한**을 들고 있다는 뜻이다 — 그 파드가 뚫리면 디렉터리를
              #     쓰기 권한까지 통째로 잃는다.
              #
              #   ACI 로 read·search·compare 만 준다. write·delete 가 없으므로
              #   이 자격이 유출되어도 열람에 그친다.
              echo "[ds389-bootstrap] uid=ranger-sync (동기화 전용 읽기 계정)"
              add "dn: uid=ranger-sync,ou=people,${BASE}
              objectClass: top
              objectClass: person
              objectClass: organizationalPerson
              objectClass: inetOrgPerson
              uid: ranger-sync
              cn: Ranger Usersync Reader
              sn: Sync
              userPassword: ${SYNC_PASSWORD}"

              # 비밀번호는 멱등하게 맞춘다 — 엔트리가 이미 있으면 add 가
              # "already exists" 로 끝나 값이 갱신되지 않기 때문이다.
              printf '%s\n' "dn: uid=ranger-sync,ou=people,${BASE}
              changetype: modify
              replace: userPassword
              userPassword: ${SYNC_PASSWORD}" | sed 's/^[[:space:]]*//' \
                | ldapmodify -x -H "$LDAP" -D "$DM" -w "$DM_PASSWORD" 2>&1 | sed 's/^/  /'

              # ACI 도 멱등하게. 같은 것이 있으면 먼저 지우고 다시 넣는다.
              echo "[ds389-bootstrap] ACI (읽기 전용)"
              ACI='(targetattr="*")(version 3.0; acl "ranger-sync read-only"; allow (read,search,compare) userdn="ldap:///uid=ranger-sync,ou=people,'"${BASE}"'";)'
              printf '%s\n' "dn: ${BASE}
              changetype: modify
              delete: aci
              aci: ${ACI}" | sed 's/^[[:space:]]*//' \
                | ldapmodify -x -H "$LDAP" -D "$DM" -w "$DM_PASSWORD" >/dev/null 2>&1 || true
              printf '%s\n' "dn: ${BASE}
              changetype: modify
              add: aci
              aci: ${ACI}" | sed 's/^[[:space:]]*//' \
                | ldapmodify -x -H "$LDAP" -D "$DM" -w "$DM_PASSWORD" 2>&1 | sed 's/^/  /'

              # 그 계정으로 실제로 읽히는지 확인한다. 여기서 걸러내지 않으면
              # usersync 가 0명을 동기화하고 원인을 찾기 어려워진다.
              n=$(ldapsearch -x -LLL -H "$LDAP" \
                    -D "uid=ranger-sync,ou=people,${BASE}" -w "$SYNC_PASSWORD" \
                    -b "ou=people,${BASE}" -s sub "(objectClass=inetOrgPerson)" dn 2>/dev/null \
                    | grep -c '^dn:')
              echo "  ranger-sync 로 조회한 사용자 $n 건"
              if [ "$n" -lt 1 ]; then
                echo "[ds389-bootstrap] 실패 — ranger-sync 계정으로 읽지 못한다"
                exit 1
              fi

              echo "[ds389-bootstrap] 검증"
              found=$(ldapsearch -x -LLL -H "$LDAP" -D "$DM" -w "$DM_PASSWORD" \
                        -b "$BASE" -s sub "(objectClass=*)" dn 2>/dev/null | grep -c '^dn:')
              echo "  엔트리 $found 건"
              ldapsearch -x -LLL -H "$LDAP" -D "$DM" -w "$DM_PASSWORD" \
                -b "$BASE" -s sub "(objectClass=*)" dn 2>/dev/null | grep '^dn:' | sed 's/^/  /'
              if [ "$found" -lt 5 ]; then
                echo "[ds389-bootstrap] 실패 — 루트 + ou 2개 + 픽스처 2개(총 5건)를 기대했다"
                exit 1
              fi
              echo "[ds389-bootstrap] 완료"
          env:
            - name: DM_PASSWORD
              valueFrom: { secretKeyRef: { name: ds389-secret, key: dm-password } }
            # 동기화 전용 읽기 계정의 비밀번호. root DN 과 분리해서 보관한다 —
            # 같은 값을 쓰면 계정을 나눈 의미가 없다.
            - name: SYNC_PASSWORD
              valueFrom: { secretKeyRef: { name: ds389-secret, key: sync-password } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 256Mi }
