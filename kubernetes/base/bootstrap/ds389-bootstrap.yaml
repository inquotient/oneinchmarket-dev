# 389ds 컨테이너는 백엔드(suffix)만 만들고 그 루트 엔트리는 만들지 않는다.
# 그래서 갓 뜬 디렉터리에 검색을 걸면 이렇게 나온다:
#   ldapsearch -b dc=oneinchmarket,dc=co,dc=kr  ->  result: 32 No such object
# LAM 이 트리를 못 그리고 Ranger usersync·Keycloak federation 도 붙지 못한다.
#
# 루트 엔트리와 ou=people·ou=groups 를 만든다. 멱등하다 — 이미 있으면
# ldapadd 가 68(Already exists)을 돌려주고 그것을 성공으로 친다.
apiVersion: batch/v1
kind: Job
metadata:
  name: ds389-bootstrap
  labels:
    app.kubernetes.io/name: ds389-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ds389-bootstrap
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      restartPolicy: OnFailure
      priorityClassName: batch-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          # ldapadd 가 들어 있는 이미지를 새로 끌어오지 않고 ds389 이미지를 쓴다.
          image: 389ds/dirsrv:3.1
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail
              LDAP="ldap://ds389-headless:3389"
              BASE="dc=oneinchmarket,dc=co,dc=kr"

              echo "[ds389-bootstrap] LDAP 대기"
              until ldapsearch -x -H "$LDAP" -b "" -s base >/dev/null 2>&1; do sleep 3; done

              add() {  # add <ldif>
                # ★ 들여쓴 이어지는 줄을 그대로 넘기면 안 된다 — LDIF 는
                #   공백으로 시작하는 줄을 앞줄의 이어붙임(line folding)으로
                #   해석한다. YAML 들여쓰기를 먼저 벗겨낸다.
                out=$(printf '%s\n' "$1" | sed 's/^[[:space:]]*//' | ldapadd -x -H "$LDAP" \
                        -D "cn=Directory Manager" -w "$DM_PASSWORD" 2>&1)
                rc=$?
                if [ $rc -eq 0 ]; then echo "  created"; return 0; fi
                # 68 = Already exists. 재실행을 성공으로 친다.
                if printf '%s' "$out" | grep -q "Already exists"; then
                  echo "  exists"; return 0
                fi
                echo "$out"; return $rc
              }

              echo "[ds389-bootstrap] $BASE"
              add "dn: ${BASE}
              objectClass: top
              objectClass: domain
              dc: oneinchmarket"

              echo "[ds389-bootstrap] ou=people"
              add "dn: ou=people,${BASE}
              objectClass: top
              objectClass: organizationalUnit
              ou: people"

              echo "[ds389-bootstrap] ou=groups"
              add "dn: ou=groups,${BASE}
              objectClass: top
              objectClass: organizationalUnit
              ou: groups"

              echo "[ds389-bootstrap] 확인"
              ldapsearch -x -H "$LDAP" -D "cn=Directory Manager" -w "$DM_PASSWORD" \
                -b "$BASE" -s sub dn | grep '^dn:'
              echo "[ds389-bootstrap] 완료"
          env:
            - name: DM_PASSWORD
              valueFrom: { secretKeyRef: { name: ds389-secret, key: dm-password } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 300m, memory: 256Mi }
