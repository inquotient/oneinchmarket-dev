# G22 — v1 의 kafka-job.yaml 패턴 계승. keycloak-events 토픽에 프로듀서가
# 없는 것(Keycloak event-listener SPI 미설정)은 별개 문제로 남는다.
apiVersion: batch/v1
kind: Job
metadata:
  name: kafka-topics
  labels:
    app.kubernetes.io/name: kafka-topics
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kafka-topics
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      restartPolicy: OnFailure
      priorityClassName: batch-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: bootstrap
          image: apache/kafka:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              BS=kafka-headless:9092
              echo "[kafka-topics] Kafka 대기"
              until /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server "$BS" >/dev/null 2>&1; do sleep 5; done
              # 로컬은 단일 브로커라 replication-factor 1 이다.
              for t in keycloak-events falco-alerts trivy-reports; do
                /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BS" \
                  --create --if-not-exists --topic "$t" --partitions 3 --replication-factor 1
                echo "[kafka-topics] topic $t"
              done
              /opt/kafka/bin/kafka-topics.sh --bootstrap-server "$BS" --list
              echo "[kafka-topics] 완료"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
