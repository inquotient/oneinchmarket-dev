# HDFS 최상위 디렉터리 준비.
#
# 갓 포맷한 HDFS 의 `/` 는 hadoop:supergroup 0755 다. 다른 사용자로 도는
# 서비스는 여기에 아무것도 못 쓴다 — 실제로 Hive 이미지에서 이렇게 막혔다:
#   mkdir: Permission denied: user=hive, access=WRITE,
#          inode="/":hadoop:supergroup:drwxr-xr-x
#
# ★ HDFS 는 uid 가 아니라 **사용자 이름**으로 권한을 본다. 컨테이너마다
#   uid 가 달라도(hbase 1001, hive 1000) 이름만 맞으면 된다.
apiVersion: batch/v1
kind: Job
metadata:
  name: hdfs-bootstrap
  labels:
    app.kubernetes.io/name: hdfs-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hdfs-bootstrap
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      restartPolicy: OnFailure
      priorityClassName: batch-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          # NameNode 와 같은 이미지를 쓴다. 그 안의 hadoop 사용자가 HDFS 슈퍼유저다.
          image: apache/hadoop:3.4.3
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail
              export HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
              export HADOOP_CLIENT_OPTS="-Xmx256m"
              NN=hdfs://hadoop-namenode:8020

              echo "[hdfs-bootstrap] NameNode 대기"
              until hdfs dfs -ls "$NN/" >/dev/null 2>&1; do sleep 5; done

              mk() {  # mk <경로> <소유자> <모드>
                hdfs dfs -mkdir -p "$NN$1" 2>&1 | grep -v "^$" || true
                hdfs dfs -chown "$2:supergroup" "$NN$1"
                hdfs dfs -chmod "$3" "$NN$1"
                echo "  $1  ->  $2  $3"
              }

              echo "[hdfs-bootstrap] 디렉터리"
              mk /hbase     hbase  755   # HBase rootdir
              mk /warehouse hive   755   # Hive 가 HDFS 를 쓸 때의 위치(TODO-33)
              mk /tmp       hadoop 1777  # 스티키. 여러 사용자가 공유한다
              mk /user      hadoop 755

              echo "[hdfs-bootstrap] 검증"
              hdfs dfs -ls "$NN/"
              # 소유자가 어긋나면 실패로 끝낸다 — 조용한 성공을 만들지 않는다.
              for want in "/hbase:hbase" "/warehouse:hive"; do
                p="${want%%:*}"; u="${want##*:}"
                got=$(hdfs dfs -stat "%u" "$NN$p" 2>/dev/null)
                if [ "$got" != "$u" ]; then
                  echo "[hdfs-bootstrap] 실패 — $p 소유자가 $got (기대: $u)"
                  exit 1
                fi
              done
              echo "[hdfs-bootstrap] 완료"
          env:
            - { name: HADOOP_CONF_DIR, value: /opt/hadoop/etc/hadoop }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /opt/hadoop/etc/hadoop/core-site.xml, subPath: core-site.xml }
            - { name: config, mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml, subPath: hdfs-site.xml }
      volumes:
        - name: config
          configMap: { name: hadoop-config }
