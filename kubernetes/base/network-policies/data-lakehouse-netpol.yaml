# G13 부분 해소 — MinIO·Hive Metastore 는 지금까지 대상 NetworkPolicy 가 없었다.
# default-deny 는 ingress 만 차단하므로 egress 규칙은 두지 않는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-minio-access
  labels:
    app.kubernetes.io/name: allow-minio-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: minio
  policyTypes:
    - Ingress
  ingress:
    - from:
        # Trino · Hive Metastore · Spark(History/Connect/driver/executor) · Livy
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: data-lakehouse
      ports:
        - protocol: TCP
          port: 9000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hive-metastore-access
  labels:
    app.kubernetes.io/name: allow-hive-metastore-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hive-metastore
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: data-lakehouse
      ports:
        - protocol: TCP
          port: 9083
---
# Spark Connect — gRPC. 인증은 Istio AuthorizationPolicy 가 담당하고
# NetworkPolicy 는 네임스페이스 내부로 도달 범위를 좁히는 역할만 한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-spark-connect-access
  labels:
    app.kubernetes.io/name: allow-spark-connect-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spark-connect
  policyTypes:
    - Ingress
  ingress:
    # 클라이언트 gRPC
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: application
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
      ports:
        - protocol: TCP
          port: 15002
    # executor → driver RPC · BlockManager (spark-connect-statefulset 에서 고정)
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: spark-executor
      ports:
        - protocol: TCP
          port: 7078
        - protocol: TCP
          port: 7079
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-livy-access
  labels:
    app.kubernetes.io/name: allow-livy-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: livy
  policyTypes:
    - Ingress
  ingress:
    # Livy 는 자체 인증을 쓰지 않는다. oauth2-proxy 만 통과시킨다.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
      ports:
        - protocol: TCP
          port: 8998
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-spark-history-access
  labels:
    app.kubernetes.io/name: allow-spark-history-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spark-history
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
      ports:
        - protocol: TCP
          port: 18080
---
# Spark driver(Livy 세션·ETL Job)가 만든 executor 는 driver 로 되돌아온다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-spark-driver-rpc
  labels:
    app.kubernetes.io/name: allow-spark-driver-rpc
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spark-driver
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: spark-executor
---
# 5단계 — HDFS · ZooKeeper.
#
# ★ DataNode 는 NameNode 와 **양방향**으로 통신한다. 등록·하트비트는
#   DataNode -> NameNode 지만, 블록 명령은 NameNode -> DataNode 다.
#   한쪽만 열면 등록은 되는데 블록이 안 움직인다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hadoop-namenode-access
  labels:
    app.kubernetes.io/name: allow-hadoop-namenode-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hadoop-namenode
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: hadoop-datanode}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-master}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-regionserver}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hive-metastore}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hive-server}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: trino}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: spark-connect}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: spark-history}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: livy}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
      ports:
        - { protocol: TCP, port: 8020 }
        - { protocol: TCP, port: 9870 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hadoop-datanode-access
  labels:
    app.kubernetes.io/name: allow-hadoop-datanode-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hadoop-datanode
  policyTypes: [Ingress]
  ingress:
    # NameNode 가 블록 명령을 보낸다. 클라이언트는 블록을 직접 읽고 쓴다.
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: hadoop-namenode}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-master}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-regionserver}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hive-metastore}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hive-server}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: trino}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: spark-connect}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: spark-history}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: livy}}
      ports:
        - { protocol: TCP, port: 9866 }
        - { protocol: TCP, port: 9867 }
        - { protocol: TCP, port: 9864 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-zookeeper-access
  labels:
    app.kubernetes.io/name: allow-zookeeper-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-master}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-regionserver}}
      ports:
        - { protocol: TCP, port: 2181 }
---
# 5단계 2/3 — HBase.
#
# ★ 마스터와 RegionServer 는 **양방향**이다. RegionServer 가 마스터에
#   등록(16000)하고, 마스터는 region 배정 명령을 RegionServer(16020)로 보낸다.
#   한쪽만 열면 등록은 되는데 region 이 배정되지 않는다.
#   (HDFS NameNode↔DataNode 와 같은 구조다.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hbase-master-access
  labels:
    app.kubernetes.io/name: allow-hbase-master-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hbase-master
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-regionserver}}
        # 클라이언트. Trino·Spark 가 HBase 커넥터를 쓰게 되면 여기로 들어온다.
        - podSelector: {matchLabels: {app.kubernetes.io/name: trino}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: spark-connect}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: livy}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hive-server}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
      ports:
        - { protocol: TCP, port: 16000 }
        - { protocol: TCP, port: 16010 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hbase-regionserver-access
  labels:
    app.kubernetes.io/name: allow-hbase-regionserver-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hbase-regionserver
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-master}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: trino}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: spark-connect}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: livy}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hive-server}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
      ports:
        - { protocol: TCP, port: 16020 }
        - { protocol: TCP, port: 16030 }
---
# HiveServer2 — JDBC(10000) · WebUI(10002).
# 클라이언트는 레이크하우스 내부(beeline·Trino)와 애플리케이션 계층이다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hive-server-access
  labels:
    app.kubernetes.io/name: allow-hive-server-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hive-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: data-lakehouse
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: application
      ports:
        - protocol: TCP
          port: 10000
        - protocol: TCP
          port: 10002
