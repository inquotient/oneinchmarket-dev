---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-elasticsearch-access
  labels:
    app.kubernetes.io/name: allow-elasticsearch-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kibana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: logstash
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falcosidekick
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: trivy-image-scan
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: filebeat
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: elasticsearch-ilm-setup
        # ECK operator (elastic-system namespace) needs API access
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: elastic-system
      ports:
        - protocol: TCP
          port: 9200
    # ES inter-node transport for cluster formation
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: elasticsearch
      ports:
        - protocol: TCP
          port: 9300
---
# Falcosidekick 접근 허용 - Falco DaemonSet → Falcosidekick
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
