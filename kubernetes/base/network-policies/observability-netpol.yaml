---
# GlitchTip web — 오류 이벤트 수집(Sentry SDK)과 UI 가 같은 8000 포트다.
# 애플리케이션이 SDK 로 이벤트를 올리므로 component: application 을 연다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-glitchtip-access
  labels:
    app.kubernetes.io/name: allow-glitchtip-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: glitchtip
      app.kubernetes.io/instance: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: application
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: observability
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
      ports:
        - protocol: TCP
          port: 8000
