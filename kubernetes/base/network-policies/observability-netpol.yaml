apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-logstash-access
  labels:
    app.kubernetes.io/name: allow-logstash-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: logstash
  policyTypes:
    - Ingress
  ingress:
    # ★ 2026-09-11 에 두 항목이 사라졌다 —
    #   5044(beats): Filebeat 을 철거했다(otel-agent 가 같은 로그를 걷는다).
    #   5140(Suricata): otel-gateway 의 syslog 수신기로 옮겼다(§9-18).
    #   남은 것은 Zeek(5141)와 Alertmanager webhook(5142)뿐이다.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zeek-ship
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - protocol: TCP
          port: 5141
        - protocol: TCP
          port: 5142
---
# OpenSearch 접근 허용.
# ★ 이 정책은 2026-09-11 에 한 번 **사고로 사라졌다** — allow-elasticsearch-access
#   블록을 인덱스로 잘라내며 뒤따르던 이 두 정책까지 함께 지웠고, ArgoCD 가
#   prune 으로 클러스터에서도 지웠다. Gotcha 145 가 경계하는 부류다.
#   ★★ 블록 단위 삭제 뒤에는 **무엇이 남았는지 렌더로 셀 것.**
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-opensearch-access
  labels:
    app.kubernetes.io/name: allow-opensearch-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: opensearch-dashboards}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: data-prepper}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: opensearch-ism-setup}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: openmeter-dlq-replay}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: trivy-image-scan}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
      ports:
        - protocol: TCP
          port: 9200
    # 노드 간 transport. 단일 노드라 지금은 자기 자신뿐이다.
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: opensearch}}
      ports:
        - protocol: TCP
          port: 9300
---
# Data Prepper 접근 허용 — OpenSearch 로 가는 유일한 수집 경로다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-data-prepper-access
  labels:
    app.kubernetes.io/name: allow-data-prepper-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: data-prepper
  policyTypes:
    - Ingress
  ingress:
    # 컨테이너 로그(21892) · Suricata 전용(21893) — otel-gateway 가 OTLP 로 넘긴다.
    # ★ 둘을 나눈 이유는 보안 이벤트가 일반 로그에 섞이지 않게 하려는 것이다.
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: otel-gateway}}
      ports:
        - protocol: TCP
          port: 21892
        - protocol: TCP
          port: 21893
    # 축소된 Logstash 가 넘기는 것(alerts·zeek·api-usage DLQ/격리)
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: logstash}}
      ports:
        - protocol: TCP
          port: 2021
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports:
        - protocol: TCP
          port: 4900
---
# Falcosidekick 접근 허용 - Falco DaemonSet → Falcosidekick
#
# ★★★ 이 정책은 2026-10-09 까지 **반쪽만 허용하고 있었다** — 그리고 그것이
#   노드 하나의 런타임 탐지를 통째로 유실시켰다(Gotcha 197, SEC-301).
#   아래 `from` 은 출발지를 **파드 라벨**로 고르는데, Falco DaemonSet 이
#   `hostNetwork: true` 라 **파드 신원이 없었다**(Gotcha 110 ②). 그러면
#   같은 노드에서는 Cilium 이 host->로컬 파드를 허용해 통하고, 다른 노드에서
#   오면 `remote-node`(identity 6) 가 되어 **조용히 버려진다**
#   (`cilium monitor`: `xx drop (Policy denied) identity 6->... :2801 tcp SYN`).
#   ★ 그래서 결함이 **falcosidekick 이 뜬 노드의 반대편**에 생기고, 그것이
#     재배치되면 함께 옮겨 다닌다 — "그 노드가 고장" 이 아니다.
#
#   ★★ 처방은 이 정책이 아니라 **Falco 쪽**이었다: hostNetwork 를 걷어 파드
#   신원을 주면 이 규칙이 **한 글자도 고치지 않고** 성립한다(사유와 복귀
#   조건은 falco-daemonset.yaml 의 주석). ipBlock 으로 노드 대역을 여는
#   우회는 **실측으로 듣지 않는다** — CIDR 선택자는 node 신원과 매칭되지
#   않는다(`192.168.0.0/24`·`10.0.0.0/8` 을 둘 다 넣어도 여전히 000).
#
#   ★ `from` 을 비워 전면 허용하지 말 것 — 그러면 메시 안 아무 파드나 가짜
#   Falco 경보를 SIEM 에 주입할 수 있고, 진짜 경보가 그것에 묻힌다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-falcosidekick-access
  labels:
    app.kubernetes.io/name: allow-falcosidekick-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falco
      ports:
        - protocol: TCP
          port: 2801
---
# GlitchTip web — 오류 이벤트 수집(Sentry SDK)과 UI 가 같은 8000 포트다.
# 애플리케이션이 SDK 로 이벤트를 올리므로 component: application 을 연다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-glitchtip-access
  labels:
    app.kubernetes.io/name: allow-glitchtip-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: glitchtip
      app.kubernetes.io/instance: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: application
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: observability
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
      ports:
        - protocol: TCP
          port: 8000
---
# Pyroscope — HTTP/질의(4040) · gRPC(9095) · raft(9099) · memberlist(7946)
#
# ★ raft·memberlist 는 **자기 자신에게서** 오는 트래픽이다. 1 레플리카라도
#   부트스트랩이 자기 파드로 접속하므로 pyroscope 를 소스로도 열어야 한다.
#   HDFS NameNode↔DataNode·HBase master↔regionserver 와 같은 계열의 함정이다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pyroscope-access
  labels:
    app.kubernetes.io/name: allow-pyroscope-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: pyroscope
  policyTypes:
    - Ingress
  ingress:
    # 질의 UI·Grafana
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
      ports:
        - { protocol: TCP, port: 4040 }
    # 프로파일 수집(push) — 계측 주체가 정해지면 셀렉터를 좁힌다
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: observability
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: application
      ports:
        - { protocol: TCP, port: 4040 }
    # 클러스터 내부 통신 — 자기 자신 포함
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pyroscope
      ports:
        - { protocol: TCP, port: 9095 }
        - { protocol: TCP, port: 7946 }
