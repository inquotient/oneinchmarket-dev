# 부트스트랩 Job 은 DB·MinIO·Kafka 에 접속해야 하나 default-deny-ingress 하에서
# 대상 파드의 allow 규칙에 포함되어 있지 않아 Connection timed out 이 났다.
#
# 기존 allow-postgresql-access 는 keycloak·gitlab·hive-metastore 만 허용하며
# apicurio 도 빠져 있다 (G13 계열). 여기서 함께 보완한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bootstrap-to-postgresql
  labels:
    app.kubernetes.io/name: allow-bootstrap-to-postgresql
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: bootstrap
        # 기존 규칙에서 누락되어 있던 소비자
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apicurio-registry
      ports:
        - { protocol: TCP, port: 5432 }
---
