apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-access
  labels:
    app.kubernetes.io/name: allow-redis-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitlab
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: application
        # 6단계 — GlitchTip 은 VALKEY_URL 로 같은 Redis 를 쓴다(DB 인덱스 3).
        # ADR-038(전용 Redis 분리)은 GlitchTip 채택으로 불필요해졌다.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: glitchtip
      ports:
        - protocol: TCP
          port: 6379
---
# ClickHouse — OpenReplay 전용(ADR-070). HTTP(8123)·네이티브(9000).
#
# 소비자를 **이름으로** 한정한다. component 로 열면 "OpenReplay 전용"이라는
# 범위 한정이 정책 수준에서 무너진다 — 다른 워크로드가 붙기 시작하면
# ADR-070 이 문서상으로만 남는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-clickhouse-access
  labels:
    app.kubernetes.io/name: allow-clickhouse-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openreplay
      ports:
        - { protocol: TCP, port: 8123 }
        - { protocol: TCP, port: 9000 }
