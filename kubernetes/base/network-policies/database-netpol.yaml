apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-postgresql-access
  labels:
    app.kubernetes.io/name: allow-postgresql-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitlab
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: hive-metastore
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: apicurio-registry
        # 3단계 — Ranger admin 이 `ranger` DB 를 쓴다(별칭 서비스 ranger-db).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ranger-admin
        # 6단계 — GlitchTip(web·worker)과 마이그레이션 Job.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: glitchtip
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: glitchtip-migrate
      ports:
        - protocol: TCP
          port: 5432
---
