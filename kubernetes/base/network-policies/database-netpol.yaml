---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-redis-access
  labels:
    app.kubernetes.io/name: allow-redis-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: gitlab
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: application
        # 6단계 — GlitchTip 은 VALKEY_URL 로 같은 Redis 를 쓴다(DB 인덱스 3).
        # ADR-038(전용 Redis 분리)은 GlitchTip 채택으로 불필요해졌다.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: glitchtip
      ports:
        - protocol: TCP
          port: 6379
