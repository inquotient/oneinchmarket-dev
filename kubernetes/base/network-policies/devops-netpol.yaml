# devops 계층의 대상 NetworkPolicy.
#
# 이 파일이 없어서 GitLab 이 "NetworkPolicy 커버리지 공백 3건" 중 하나였다
# (SECURITY.md §4). Jenkins 를 넣으면서 함께 만든다 — default-deny-ingress
# 아래에서는 대상 정책이 없으면 아무도 도달하지 못한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-jenkins-access
  labels:
    app.kubernetes.io/name: allow-jenkins-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: jenkins
  policyTypes:
    - Ingress
  ingress:
    # 웹 UI. 외부 노출은 인증 앞단(oauth2-proxy)을 거친다 — TODO-46 과 같은 계열.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: devops
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
      ports:
        - protocol: TCP
          port: 8080
    # JNLP 인바운드 에이전트. 에이전트는 아직 없으나 포트를 열어 두면
    # 첫 에이전트를 붙일 때 "왜 안 붙는지" 를 다시 찾지 않아도 된다.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: jenkins-agent
      ports:
        - protocol: TCP
          port: 50000
---
# GitLab — 기존 공백 해소. 매니페스트가 실제로 여는 포트는 80·443·22 이고,
# 2026-09-07 부터 **컨테이너 레지스트리 5050** 이 더해진다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gitlab-access
  labels:
    app.kubernetes.io/name: allow-gitlab-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: gitlab
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: devops
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: oauth2-proxy
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 22
    # ── 컨테이너 레지스트리(5050) ──────────────────────────────────────
    # ★ 출발지가 **다른 네임스페이스**다. Trivy Operator 가 만드는 스캔
    #   Job 은 `trivy-system` 에서 돌며 이미지를 직접 당긴다 —
    #   podSelector 로는 표현할 수 없고 namespaceSelector 여야 한다.
    #   이것이 없으면 스캔이 조용히 실패하고, 증상은 "이미지를 찾을 수
    #   없다" 라 레지스트리가 아니라 이미지 이름을 의심하게 된다.
    # ★ 토큰 realm 은 GitLab 의 **80** 이다(`/jwt/auth`). 5050 만 열면
    #   401 을 받고 토큰을 받으러 가는 길이 막혀 pull 이 실패한다 —
    #   두 포트를 같이 열어야 한다.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: trivy-system
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: devops
      ports:
        - protocol: TCP
          port: 5050
        - protocol: TCP
          port: 80
