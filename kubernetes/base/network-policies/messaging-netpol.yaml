apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-access
  labels:
    app.kubernetes.io/name: allow-kafka-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: application
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: akhq
        # ADR-032 — kafka-rest(Confluent REST Proxy) 를 Strimzi Kafka Bridge 로
        # 교체했다. v1 셀렉터 이름을 개명해 기존 규칙을 되살린다.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka-bridge
        # schema-reg 는 Apicurio Registry 로 대체되어 존재하지 않는다.
        # Apicurio 는 SQL(PostgreSQL) 저장소라 Kafka 에 접속하지 않는다 —
        # 셀렉터를 옮기지 않고 삭제한다.
      ports:
        - protocol: TCP
          port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-akhq-access
  labels:
    app.kubernetes.io/name: allow-akhq-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: akhq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
      ports:
        - protocol: TCP
          port: 8080
---
# Apicurio Registry 는 지금까지 인바운드 허용 규칙이 없었다.
# default-deny-ingress 아래에서 파드→레지스트리 호출이 전부 막혀 있었다는 뜻이다
# (부트스트랩 Job 만 bootstrap-netpol 로 예외였다).
#
# ★ 웹 콘솔(apicurio-ui)은 SPA 라 **브라우저가** API 를 직접 부른다.
#   즉 이 규칙이 UI 때문에 필요한 것은 아니다. 앞단 프록시를 두거나
#   AKHQ 가 스키마를 조회하게 되면 그때 필요하다. 미리 연다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apicurio-access
  labels:
    app.kubernetes.io/name: allow-apicurio-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apicurio-registry
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: akhq}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: apicurio-ui}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy}}
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apicurio-ui-access
  labels:
    app.kubernetes.io/name: allow-apicurio-ui-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apicurio-ui
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy}}
      ports:
        - { protocol: TCP, port: 8080 }
---
# Kafka Bridge — HTTP(8080) · 관리/메트릭(8081)
#
# ★ 브리지에는 자체 인증·인가가 없다(SEC-206). 도달 가능한 누구나
#   produce/consume 한다. 따라서 이 정책이 사실상 유일한 접근 통제다.
#   외부 노출은 반드시 인증을 강제하는 앞단(oauth2-proxy·Knox)을 거쳐야 하며,
#   그 매니페스트가 생기기 전까지 진입점을 만들지 않는다(ADR-035).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-bridge-access
  labels:
    app.kubernetes.io/name: allow-kafka-bridge-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka-bridge
  policyTypes:
    - Ingress
  ingress:
    # HTTP API — 애플리케이션 계층만. 인증 앞단이 생기면 그 셀렉터로 좁힌다.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: application
      ports:
        - protocol: TCP
          port: 8080
    # 관리 포트는 Prometheus 만. 헬스·메트릭이라 애플리케이션에 열지 않는다.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8081
