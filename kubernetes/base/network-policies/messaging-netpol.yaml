apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-access
  labels:
    app.kubernetes.io/name: allow-kafka-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: application
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: akhq
        # ADR-032 — kafka-rest(Confluent REST Proxy) 를 Strimzi Kafka Bridge 로
        # 교체했다. v1 셀렉터 이름을 개명해 기존 규칙을 되살린다.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: kafka-bridge
        # ★ 과금 계량 — 게이트웨이 액세스 로그를 api-usage 토픽에 넣는다.
        #   AuthorizationPolicy(allow-messaging-access)에도 같은 신원이 있어야
        #   한다. 한쪽만 고치면 Cilium 은 통과시키고 ztunnel 이 끊는다.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-gateway
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-agent
        # ★ OpenMeter — 자기 토픽을 만들고 소비한다(ADR-072).
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openmeter
        # OpenReplay — 세션 이벤트 파이프라인이 Kafka 를 쓴다
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: openreplay
        # schema-reg 는 Apicurio Registry 로 대체되어 존재하지 않는다.
        # Apicurio 는 SQL(PostgreSQL) 저장소라 Kafka 에 접속하지 않는다 —
        # 셀렉터를 옮기지 않고 삭제한다.
        #
        # ★ Logstash — SIEM 소비자다. 파이프라인이 keycloak-events·falco-alerts
        #   토픽을 구독하도록 처음부터 설정되어 있었는데 이 셀렉터가 없어
        #   **연결 자체가 막혀 있었다.**
        #
        #   증상이 원인을 가린다. 로그에는 `Bootstrap broker kafka-headless:9092
        #   disconnected` 와 `socket connection setup timeout` 만 반복되어
        #   브로커 장애처럼 보인다. 실제로는 브로커도 DNS 도 정상이었다 —
        #   대조군으로 akhq 파드에서 같은 주소에 붙여 보면 OPEN 이 나온다.
        #   이 레포에서 NetworkPolicy 누락은 거부가 아니라 **타임아웃**으로
        #   나타나므로 네트워크·브로커 문제로 오진하기 쉽다.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: logstash
        # ★ Falcosidekick — falco-alerts 토픽의 생산자다.
        #   Logstash 가 그 토픽을 구독하도록 되어 있었는데 **생산자가 아예
        #   없었다**(오프셋 0). 출력 설정과 이 규칙이 함께 있어야 경로가 산다.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: falcosidekick
      ports:
        - protocol: TCP
          port: 9092
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-akhq-access
  labels:
    app.kubernetes.io/name: allow-akhq-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: akhq
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nginx
      ports:
        - protocol: TCP
          port: 8080
---
# Apicurio Registry 는 지금까지 인바운드 허용 규칙이 없었다.
# default-deny-ingress 아래에서 파드→레지스트리 호출이 전부 막혀 있었다는 뜻이다
# (부트스트랩 Job 만 bootstrap-netpol 로 예외였다).
#
# ★ 웹 콘솔(apicurio-ui)은 SPA 라 **브라우저가** API 를 직접 부른다.
#   즉 이 규칙이 UI 때문에 필요한 것은 아니다. 앞단 프록시를 두거나
#   AKHQ 가 스키마를 조회하게 되면 그때 필요하다. 미리 연다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apicurio-access
  labels:
    app.kubernetes.io/name: allow-apicurio-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apicurio-registry
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: akhq}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: apicurio-ui}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy}}
      ports:
        - { protocol: TCP, port: 8080 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-apicurio-ui-access
  labels:
    app.kubernetes.io/name: allow-apicurio-ui-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: apicurio-ui
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy}}
      ports:
        - { protocol: TCP, port: 8080 }
---
# Kafka Bridge — HTTP(8080) · 관리/메트릭(8081)
#
# ★ 브리지에는 자체 인증·인가가 없다(SEC-206). 도달 가능한 누구나
#   produce/consume 한다. 따라서 이 정책이 사실상 유일한 접근 통제다.
#   외부 노출은 반드시 인증을 강제하는 앞단(oauth2-proxy·Knox)을 거쳐야 하며,
#   그 매니페스트가 생기기 전까지 진입점을 만들지 않는다(ADR-035).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kafka-bridge-access
  labels:
    app.kubernetes.io/name: allow-kafka-bridge-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kafka-bridge
  policyTypes:
    - Ingress
  ingress:
    # HTTP API — 애플리케이션 계층만. 인증 앞단이 생기면 그 셀렉터로 좁힌다.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: application
      ports:
        - protocol: TCP
          port: 8080
    # 관리 포트는 Prometheus 만. 헬스·메트릭이라 애플리케이션에 열지 않는다.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8081
