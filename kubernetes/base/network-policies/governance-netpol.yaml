# 3단계(DS389·LAM·Solr·Ranger·Knox) 의 인바운드 허용.
# default-deny-ingress 하에서는 각 홉을 명시해야 한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ds389-access
  labels: {app.kubernetes.io/name: allow-ds389-access, app.kubernetes.io/component: network-policies, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ds389}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: lam}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: ranger-admin}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: ranger-usersync}}
        # Keycloak 의 LDAP User Federation. 아직 연결하지 않았으나
        # 연결 시점에 NetworkPolicy 를 찾아 헤매지 않도록 미리 연다.
        - podSelector: {matchLabels: {app.kubernetes.io/name: keycloak}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: knox}}
      ports:
        - {protocol: TCP, port: 3389}
        - {protocol: TCP, port: 3636}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-lam-access
  labels: {app.kubernetes.io/name: allow-lam-access, app.kubernetes.io/component: network-policies, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: lam}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy}}
      ports: [{protocol: TCP, port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-solr-access
  labels: {app.kubernetes.io/name: allow-solr-access, app.kubernetes.io/component: network-policies, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: solr}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: ranger-admin}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
      ports: [{protocol: TCP, port: 8983}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ranger-admin-access
  labels: {app.kubernetes.io/name: allow-ranger-admin-access, app.kubernetes.io/component: network-policies, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ranger-admin}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: knox}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy}}
        # usersync 가 동기화 결과를 REST 로 밀어 넣는다.
        - podSelector: {matchLabels: {app.kubernetes.io/name: ranger-usersync}}
        # 플러그인을 붙인 워크로드가 정책을 내려받는다(6080).
        # HDFS NameNode 가 첫 사례다 — §8-67.
        - podSelector: {matchLabels: {app.kubernetes.io/name: hadoop-namenode}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hive-server}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-master}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-regionserver}}
        # Trino·Kafka 는 아직 플러그인이 없다. 붙일 때 여기에 더한다.
        #
        # ★ 이 규칙은 지금 실질적인 통제가 아니다. local 네임스페이스가
        #   ambient 라 트래픽이 15008(HBONE)로 흐르고, `allow-istio-hbone` 이
        #   15008 을 넓게 열어 두기 때문에 6080 규칙은 우회된다(Gotcha 13).
        #   실제 인가는 ztunnel 의 AuthorizationPolicy 가 해야 하는데
        #   ranger-admin 을 선택하는 정책이 아직 없다. 그래도 여기에 적어 둔다 —
        #   ambient 를 끄면 이것이 유일한 통제가 되고, 빠져 있으면 그때
        #   NameNode 가 정책을 못 받아 **모든 HDFS 접근이 거부**된다.
      ports: [{protocol: TCP, port: 6080}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-knox-access
  labels: {app.kubernetes.io/name: allow-knox-access, app.kubernetes.io/component: network-policies, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: knox}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
      ports: [{protocol: TCP, port: 8443}]
---
# 4단계 — Vault. 아직 소비자가 없다(ADR-024 마이그레이션 전).
# UI·API 접근 경로만 열어 둔다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-access
  labels: {app.kubernetes.io/name: allow-vault-access, app.kubernetes.io/component: network-policies, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: vault}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy}}
      ports: [{protocol: TCP, port: 8200}]
---
# 4단계 — Wazuh. 인덱서는 매니저만 접근한다(security 플러그인을 껐으므로
# 네트워크 경계가 유일한 통제다). 매니저는 에이전트·API 소비자를 받는다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wazuh-indexer-access
  labels: {app.kubernetes.io/name: allow-wazuh-indexer-access, app.kubernetes.io/component: network-policies, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: wazuh-indexer}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: wazuh-manager}}
        # Grafana 데이터소스로 붙일 때를 위해 열어 둔다.
        - podSelector: {matchLabels: {app.kubernetes.io/name: grafana}}
      ports: [{protocol: TCP, port: 9200}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-wazuh-manager-access
  labels: {app.kubernetes.io/name: allow-wazuh-manager-access, app.kubernetes.io/component: network-policies, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: wazuh-manager}
  policyTypes: [Ingress]
  ingress:
    # 에이전트는 아직 배포하지 않았다(엔드포인트가 없다). 네임스페이스 안에서
    # 오는 등록·이벤트만 허용해 둔다.
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 1514}
        - {protocol: TCP, port: 1515}
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: oauth2-proxy}}
      ports: [{protocol: TCP, port: 55000}]
