apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-connect-config
  labels:
    app.kubernetes.io/name: kafka-connect
    app.kubernetes.io/component: kafka-connect
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
data:
  # ── Kafka Connect 분산 모드 설정 ───────────────────────────────────────
  #
  # ★ Connect 는 상태를 **Kafka 토픽에** 둔다(offsets·configs·status). 그래서
  #   워커 자체는 무상태이고 Deployment 로 둔다 — PVC 가 필요 없다.
  #
  # ★★ 그 세 토픽의 복제 계수는 반드시 1 이어야 한다. 이 클러스터는 브로커가
  #   하나라(replicas 1) 기본값 3 으로 두면 Connect 가 토픽을 만들지 못하고
  #   기동에 실패한다. Gotcha 14·34 와 같은 부류다 — 단일 노드에서 복제본을
  #   요구하면 배정될 곳이 없다.
  connect-distributed.properties: |
    bootstrap.servers=kafka-headless:9092

    # 워커 그룹. 컨슈머 그룹 이름과 같은 공간을 쓰므로 유일해야 한다.
    group.id=oim-connect

    # ── 변환기 ──
    # ★ Avro + Apicurio 를 쓰지 않는 이유: 그 변환기(io.apicurio.*)는 이
    #   이미지에 없다. 넣으려면 Dockerfile 에 한 벌 더 구워야 하고, 그러면
    #   CDC 토픽마다 subject 가 생겨 contracts/ 와 이름 공간이 겹친다.
    #   먼저 JSON 으로 흘려 스키마를 **관찰한 뒤** 계약을 쓸 것 —
    #   추정으로 계약을 쓰지 말라는 것이 §8-99 의 교훈이다.
    key.converter=org.apache.kafka.connect.json.JsonConverter
    value.converter=org.apache.kafka.connect.json.JsonConverter
    # 키는 스키마를 빼서 토픽 키가 사람이 읽을 수 있게 둔다.
    key.converter.schemas.enable=false
    # 값에는 남긴다 — CDC 는 before/after 구조가 있어야 의미가 있다.
    value.converter.schemas.enable=true

    # ── 내부 토픽 (브로커 1대이므로 전부 복제 1) ──
    offset.storage.topic=connect-offsets
    offset.storage.replication.factor=1
    offset.storage.partitions=25
    config.storage.topic=connect-configs
    config.storage.replication.factor=1
    status.storage.topic=connect-status
    status.storage.replication.factor=1
    status.storage.partitions=5

    # ── REST ──
    # 0.0.0.0 으로 열되 NetworkPolicy 가 ingress 를 막는다(default-deny).
    # 관리 접근은 port-forward 로 한다 — local/ACCESS.md 규약.
    listeners=HTTP://0.0.0.0:8083

    # ★ rest.advertised.host.name 은 여기 쓰지 않는다 — 파드 IP 는 배포
    #   시점에 알 수 없으므로 기동 래퍼가 이 파일을 /tmp 로 복사해 한 줄을
    #   덧붙인다(Deployment 의 command 참조).
    #
    #   ★★ 환경변수 CONNECT_REST_ADVERTISED_HOST_NAME 으로는 **안 된다.**
    #   그 CONNECT_* 규약은 Confluent 이미지의 엔트리포인트가 만드는
    #   것이고, Apache 배포판의 connect-distributed.sh 는 프로퍼티
    #   파일만 읽는다. 실측으로 그 변수를 주었더니 조용히 무시되고
    #   leaderUrl 이 http://0.0.0.0:8083/ 로 남았다 — replicas 1 에서는
    #   드러나지 않고 워커를 늘리는 날 요청 전달이 깨진다.

    plugin.path=/opt/kafka/plugins

    # ── 시크릿 주입 ──
    # ★★ 커넥터 설정은 REST 로 POST 하면 그대로 `connect-configs`
    #   토픽에 저장된다. 거기에 비밀번호를 적으면 **지울 수 없다** —
    #   토픽은 compacted 이고 과거 레코드가 남는다(과금 토픽에
    #   오염된 메시지가 영구히 남았던 Gotcha 23 과 같은 구조다).
    #   그래서 커넥터 설정에는 **참조만** 적는다:
    #       "database.password": "${secrets:/etc/connect-secrets:debezium-password}"
    #   DirectoryConfigProvider 는 디렉터리의 파일 하나를 값으로 읽는다 —
    #   Secret 마운트가 정확히 그 모양이다(키 하나 = 파일 하나).
    config.providers=secrets
    config.providers.secrets.class=org.apache.kafka.common.config.provider.DirectoryConfigProvider
    # 읽을 수 있는 경로를 제한한다 — 없으면 커넥터 설정을 올릴 수
    # 있는 사람이 파드 안 아무 파일이나 읽어낼 수 있다.
    config.providers.secrets.param.allowed.paths=/etc/connect-secrets

    # 커넥터가 죽었을 때 조용히 사라지지 않게 한다.
    # Gotcha 33·84 와 같은 부류를 만들지 않기 위한 설정이다.
    errors.log.enable=true
    errors.log.include.messages=true
