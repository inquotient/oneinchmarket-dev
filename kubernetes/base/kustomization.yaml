# OneinchMarket v2 - Kustomize Base
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - scheduling/
  - serviceaccounts/
  - bootstrap/
  - data-lakehouse/
  - messaging/
  - database/
  - security/
  - observability/
  - governance/
  - devops/
  - application/
  - service-mesh/
  # ★ service-mesh/ 와 분리한다 — 그쪽 commonAnnotations 가 wave 를 0 으로
  #   덮어쓰는데, 이 RLS 는 Redis(wave 1) 뒤에 떠야 한다(§8-89).
  - gateway-ratelimit/
  # ★ messaging/ 과 분리한다 — 그쪽 commonAnnotations 가 wave 를 2 로
  #   덮는데, Connect 는 Kafka(2)·MariaDB(1) 뒤인 3 이어야 한다(Gotcha 67).
  - kafka-connect/
  # ★ Camel K 의 IntegrationPlatform 만 여기 있다 — 오퍼레이터와 CRD 는
  #   ArgoCD 밖의 오퍼레이터 계층이다(local/install-operators.sh §9).
  - integration/
  # ★ wave 4 — PostgreSQL 부트스트랩 Job 뒤여야 한다.
  - developer-portal/
  # ★ 배포만 한다 — 트래픽 경로에 넣지 않는다(ADR-079 미결, Gotcha 15).
  - api-management/
  - network-policies/
  - rotation/
