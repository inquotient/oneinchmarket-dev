# Istio AuthorizationPolicy - 서비스 간 접근 제어
# 기본 정책: 명시적으로 허용된 통신만 가능
#
# ★★ principal 문자열 매칭 규칙 — 이 파일 전체의 전제다.
#   Istio 의 문자열 필드는 **완전 일치 · 접두(`abc*`) · 접미(`*abc`) · 존재(`*`)**
#   네 가지만 지원한다. **중간 `*` 는 와일드카드가 아니라 리터럴이다.**
#
#   이 파일은 원래 전부 `cluster.local/ns/*/sa/<name>` 형태였다. 네임스페이스
#   자리의 `*` 가 리터럴로 취급되므로 **어떤 규칙도 한 번도 매칭된 적이 없다.**
#   ALLOW 정책이 워크로드를 선택하면 매칭되지 않은 모든 것이 거부되므로,
#   ambient 편입 즉시 PostgreSQL·Kafka·Redis·Elasticsearch 접근이 전부 끊겼다:
#     "connection closed due to policy rejection: allow policies exist,
#      but none allowed"
#   ztunnel 로그가 `src.identity="spiffe://cluster.local/ns/local/sa/cmmn-api"`
#   를 찍으면서도 거부한 것이 증거다 — 정책에 그 이름이 분명히 있었다(§8-47).
#
#   그래서 접미 매칭 `*/sa/<name>` 을 쓴다. base 는 네임스페이스를 모르므로
#   (local·dev·prod 오버레이가 각자 정한다) 네임스페이스를 하드코딩할 수 없다.
#   대가는 신뢰 도메인·네임스페이스 제약이 사라지는 것이다 — 실질 통제는
#   ServiceAccount 이름이 된다. 네임스페이스 경계는 Kubernetes NetworkPolicy
#   (default-deny-ingress + allow-*)가 계속 잡는다.
#
# ★ 소비자 목록의 원천은 `network-policies/database-netpol.yaml` 등의
#   allow-* NetworkPolicy 다. 두 계층이 어긋나면 Cilium 은 통과시키고 ztunnel
#   이 끊어 **타임아웃이 아니라 connection reset** 으로 나타난다. 한쪽만
#   고치지 말 것.

# Database 접근 제어 - DB는 허용된 서비스만 접속
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-database-access
  labels:
    app.kubernetes.io/component: service-mesh
    app.kubernetes.io/part-of: oneinchmarket
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: database
  action: ALLOW
  rules:
    # → PostgreSQL. allow-postgresql-access(NetworkPolicy)와 같은 집합이다.
    #   ranger-db·keycloak-db 등 별칭 서비스도 전부 이 파드로 간다.
    - from:
        - source:
            principals:
              - "*/sa/keycloak"
              - "*/sa/gitlab"
              - "*/sa/hive-metastore"
              # ★ 스키마 소유자는 메타스토어지만, 스키마를 **만들고 올리는** 것은
              #   부트스트랩 Job 이다. 전용 SA 를 주고 여기 넣지 않으면 ztunnel 이
              #   막아 "connection attempt failed" 로 나온다 — TCP 검사는
              #   통과하므로 DB 문제로 오해하기 쉽다. Gotcha 19 · §8-71
              - "*/sa/hive-schematool"
              # ★ DB·롤을 만드는 부트스트랩 Job. 전용 SA 가 없어 `default` 로
              #   돌다가 **무한 대기**했고, ArgoCD 가 그 훅을 기다리다 동기화
              #   전체가 멈췄다 — Gotcha 19 의 여섯 번째 사례다(§8-84).
              - "*/sa/postgres-bootstrap"
              - "*/sa/apicurio"
              # ★ ShardingSphere-Proxy 는 **소비자가 아니라 프록시**다 —
              #   자기 뒤의 PostgreSQL 에 붙어야 하므로 여기 있어야 한다.
              #   전용 SA 가 없으면 이 한 줄을 쓸 수 없다(Gotcha 10). §8-75
              - "*/sa/shardingsphere"
              - "*/sa/ranger-admin"
              - "*/sa/glitchtip"
              - "*/sa/dependency-track"
              - "*/sa/defectdojo"
              - "*/sa/safeline"
              # ★ OpenMeter — 요금제·구독·인보이스 메타데이터를 PostgreSQL 에 둔다.
              #   ClickHouse 는 집계용이고 엔터티는 여기다(§8-58).
              - "*/sa/openmeter"
              # OpenReplay 는 파드마다 별도 SA 를 쓴다(alerts-openreplay ·
              # chalice-openreplay · db-openreplay …). 15개를 나열하는 대신
              # 접미 매칭으로 묶는다. `*/sa/*-openreplay` 는 `*` 가 둘이라
              # 쓸 수 없다 — 위 머리말 참조.
              - "*-openreplay"
      to:
        - operation:
            ports: ["5432"]
    # → ShardingSphere-Proxy (PostgreSQL 와이어, 3307) — §8-75
    #   ★★ 이 규칙이 **반드시 있어야 한다.** ShardingSphere 에
    #     `component: database` 라벨이 있어 이 ALLOW 정책이 그 워크로드를
    #     선택하는데, 규칙에 3307 이 없으면 **매칭되지 않은 전부가 거부**된다
    #     (Gotcha 9). 실측: `connection closed due to policy rejection:
    #     allow policies exist, but none allowed` — 파드는 1/1 Running 이고
    #     백엔드 풀도 정상이라 프록시 자체 문제로 오해하기 쉽다.
    #   ★ 원칙은 "PostgreSQL 에 직접 닿을 수 있는 것은 프록시를 통해서도
    #     닿을 수 있다" 다. 위 5432 목록과 같은 집합을 유지할 것 —
    #     한쪽만 고치면 프록시로 옮긴 소비자가 조용히 끊긴다.
    - from:
        - source:
            principals:
              - "*/sa/keycloak"
              - "*/sa/gitlab"
              - "*/sa/hive-metastore"
              - "*/sa/hive-schematool"
              - "*/sa/postgres-bootstrap"
              - "*/sa/apicurio"
              - "*/sa/shardingsphere"
              - "*/sa/ranger-admin"
              - "*/sa/glitchtip"
              - "*/sa/dependency-track"
              - "*/sa/defectdojo"
              - "*/sa/safeline"
              - "*/sa/openmeter"
              - "*-openreplay"
      to:
        - operation:
            ports: ["3307"]
    # → MariaDB
    - from:
        - source:
            principals:
              - "*/sa/admin"
              - "*/sa/cmmn-api"
              # ★ ProxySQL 은 소비자가 아니라 프록시다 — 뒤쪽 MariaDB 에
              #   붙어야 하므로 여기 있어야 한다(§8-76).
              - "*/sa/proxysql"
              # ★ DB·사용자를 만드는 부트스트랩 Job. 전용 SA 가 없어 `default`
              #   로 돌다가 **무한 대기**하고 있었다 — Gotcha 19 의 다섯 번째
              #   사례다(§8-76). 오류가 아니라 대기라 더 늦게 드러난다.
              - "*/sa/mariadb-bootstrap"
      to:
        - operation:
            ports: ["3306"]
    # → ProxySQL (MySQL 와이어, 6033) — §8-76
    #   ★ ShardingSphere 3307 과 같은 이유로 이 규칙이 필요하다. `component:
    #     database` 라벨 때문에 이 ALLOW 정책이 ProxySQL 을 선택하므로,
    #     6033 규칙이 없으면 **모든 접속이 거부**된다(Gotcha 9).
    #     3306 목록과 같은 집합을 유지할 것.
    - from:
        - source:
            principals:
              - "*/sa/admin"
              - "*/sa/cmmn-api"
              - "*/sa/proxysql"
      to:
        - operation:
            ports: ["6033"]
    # → MongoDB
    - from:
        - source:
            principals:
              - "*/sa/admin"
              - "*/sa/cmmn-api"
      to:
        - operation:
            ports: ["27017"]
    # → Redis. allow-redis-access 와 같은 집합이다.
    - from:
        - source:
            principals:
              - "*/sa/keycloak"
              - "*/sa/gitlab"
              - "*/sa/glitchtip"
              - "*/sa/defectdojo"
              - "*/sa/admin"
              - "*/sa/cmmn-api"
              - "*-openreplay"
              # ★ OpenMeter — 중복 제거(dedupe)에 Redis 를 쓴다. 과금 정확성의
              #   핵심이므로 이 줄이 없으면 이벤트가 중복 청구된다.
              - "*/sa/openmeter"
      to:
        - operation:
            ports: ["6379"]
    # → ClickHouse. OpenReplay 와 **OpenMeter 가 공유**한다(ADR-070 개정).
    #   데이터베이스로 용도를 나눈다(openreplay · openmeter).
    #   ClickHouse 에 component: database 라벨이 없으면 이 규칙은 그냥
    #   선택되지 않을 뿐 해가 없다.
    - from:
        - source:
            principals:
              - "*-openreplay"
              # ★ OpenMeter — 데이터베이스 `openmeter` 를 쓴다(ADR-070 개정).
              - "*/sa/openmeter"
      to:
        - operation:
            ports: ["8123", "9000"]
---
# Messaging 접근 제어 - Kafka
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-messaging-access
  labels:
    app.kubernetes.io/component: service-mesh
    app.kubernetes.io/part-of: oneinchmarket
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kafka
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "*/sa/akhq"
              - "*/sa/apicurio"
              - "*/sa/kafka-bridge"
              # ★ 과금 계량. 게이트웨이의 액세스 로그를 OTLP 로 받아 api-usage
              #   토픽에 넣는다. 이 줄이 없으면 이벤트가 조용히 사라진다 —
              #   수집기 쪽에는 오류가 나지 않는다(§8-55).
              - "*/sa/otel-gateway"
              # 에이전트가 게이트웨이 액세스 로그를 직접 api-usage 에 넣는다.
              - "*/sa/otel-agent"
              # ★ OpenMeter — 자기 토픽을 만들고 소비한다(ADR-072).
              - "*/sa/openmeter"
              # 토픽 부트스트랩 Job. 평소에 돌지 않아 편입 시점에 드러나지 않는다.
              - "*/sa/kafka-topics"
              # ★ logstash 는 전용 ServiceAccount 를 쓴다. 예전에는 `default`
              #   로 돌았고 ambient 에서는 그것이 곧 신원이라
              #   elasticsearch·kibana·falcosidekick 과 구분되지 않았다.
              #   `sa/default` 를 허용하면 셋 모두에게 Kafka 접근을 주게 된다 —
              #   신원 분리가 이 정책의 존재 이유이므로 그러지 않는다.
              - "*/sa/logstash"
              # ★ falcosidekick 은 falco-alerts 토픽에 쓴다. NetworkPolicy
              #   (messaging-netpol)에는 이미 있었으나 **여기에만 없었다** —
              #   두 계층이 어긋나면 타임아웃이 아니라 connection reset 이다.
              #   실측: `Kafka - read tcp ...: connection reset by peer`.
              #   Falco 가 로컬에서 돌지 않아 이 경로가 한 번도 쓰이지 않았고
              #   (§8-35 는 설정 미적재가 원인이라 여기까지 못 갔다),
              #   Falco 를 살리자마자 드러났다(§8-64).
              - "*/sa/falcosidekick"
              # OpenReplay 의 수집 계층이 Kafka 를 쓴다.
              - "*-openreplay"
              - "*/sa/admin"
              - "*/sa/cmmn-api"
              # 네임스페이스를 넘는 유일한 소비자라 경로를 남겨 둔다.
              - "*/ns/argo-events/sa/argo-events-sa"
      to:
        - operation:
            ports: ["9092", "9093"]
---
# Observability 접근 제어 - Elasticsearch
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-observability-access
  labels:
    app.kubernetes.io/component: service-mesh
    app.kubernetes.io/part-of: oneinchmarket
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: elasticsearch
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "*/sa/kibana"
              - "*/sa/logstash"
              - "*/sa/filebeat"
              - "*/sa/falcosidekick"
              - "*/sa/trivy-scanner"
              # ★ ILM/템플릿 부트스트랩 Job. 평소에 돌지 않아 §8-47 에서 놓쳤다 —
              #   편입 후 처음 재실행할 때 비로소 9200 이 막힌다(§8-52).
              - "*/sa/elasticsearch-ilm-setup"
              # ★ DLQ 재처리 CronJob. 격리·실패 인덱스를 읽고 성공분을 지운다.
              #   부트스트랩 Job 과 같은 함정 — 평소에 돌지 않아 편입 시점에
              #   드러나지 않고 첫 실행 때 막힌다(§8-52 계열).
              - "*/sa/openmeter-dlq-replay"
              # ★ ECK 오퍼레이터. elastic-system 네임스페이스에 있고 ES 의
              #   부트스트랩·헬스·라이선스를 9200 으로 관리한다. 이것이 막히면
              #   Elasticsearch CR 이 관리 불능이 된다.
              #   전제: elastic-system 도 ambient 에 편입되어 있어야 한다.
              #   편입되지 않으면 평문으로 도착해 **신원 자체가 없고**
              #   principal 규칙은 어느 것도 매칭되지 않는다(§8-47).
              - "*/ns/elastic-system/sa/elastic-operator"
              # ES 노드끼리도 9200 을 쓴다(ECK 의 내부 프로브·조정).
              - "*/sa/elasticsearch"
      to:
        - operation:
            ports: ["9200"]
---
# Data Lakehouse 접근 제어 - MinIO
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-datalakehouse-access
  labels:
    app.kubernetes.io/component: service-mesh
    app.kubernetes.io/part-of: oneinchmarket
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "*/sa/trino"
              - "*/sa/hive-metastore"
              - "*/sa/hive-server"
              - "*/sa/spark-connect"
              - "*/sa/spark-history"
              # OpenBao raft 스냅샷을 MinIO 로 올린다(§8-80).
              # ★ ALLOW 정책이 minio 를 선택하므로 여기 없으면 **거부**다
              #   (Gotcha 9). 증상은 mc 가 조용히 매달리는 것이라
              #   MinIO 자격이나 버킷 이름을 의심하게 된다.
              - "*/sa/openbao-snapshot"
              # 버킷을 만드는 부트스트랩 Job. 전용 SA 가 없어 `default` 로
              # 돌다가 9000 이 거부됐다 — §8-84
              - "*/sa/minio-bootstrap"
      to:
        - operation:
            ports: ["9000", "9001"]
