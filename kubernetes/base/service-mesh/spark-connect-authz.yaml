# Spark Connect 는 gRPC 라 HTTP 프록시(oauth2-proxy)를 앞에 두기 어렵다.
# 이 스택에는 Istio ambient 가 이미 있으므로 L4 인가를 메시에 위임한다.
#
# 전제: PeerAuthentication 이 STRICT 여야 principal 이 신뢰 가능하다.
#       현재 base 는 PERMISSIVE 다 (DEPLOYMENT §3 Phase F 에서 전환).
#       그 전까지 이 정책은 실효가 없다 — SEC-108 이 배포 게이트다.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: spark-connect-authz
  labels:
    app.kubernetes.io/name: spark-connect-authz
    app.kubernetes.io/component: service-mesh
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-connect
  action: ALLOW
  rules:
    # gRPC 클라이언트 — 오버레이에서 principal 을 더 좁힐 것
    - from:
        - source:
            namespaces: ["dev", "prod"]
            principals:
              - "cluster.local/ns/dev/sa/oauth2-proxy"
              - "cluster.local/ns/prod/sa/oauth2-proxy"
      to:
        - operation:
            ports: ["15002"]
    # executor → driver RPC · BlockManager
    # ★★ 2026-11-06 실측: 이 규칙이 ns/dev · ns/prod 만 나열해 **local 의 익스큐터가 드라이버로
    #   되돌아오지 못했다**(ztunnel `policy rejection` 114건: sa/spark-executor -> spark-connect-0:7078).
    #   익스큐터는 뜨자마자 `Broken pipe` 로 죽고, 실패가 쌓이면 SparkContext 가 멈춰 서버가
    #   재시작한다 — 파드는 다시 Ready 라 "가끔 죽는 서버" 로 보인다. 즉 Spark Connect 는 local 에서
    #   분산 질의를 한 번도 하지 못했다(그 전엔 익스큐터가 `default` SA 라 역시 거부였다).
    #   base 는 네임스페이스를 모르므로 접미 매칭을 쓴다(Gotcha 9 — 중간 `*` 는 리터럴이다).
    #   익스큐터는 전용 SA spark-executor 로 뜬다(spark-defaults · spark-rbac.yaml).
    - from:
        - source:
            principals:
              - "*/sa/spark-driver"
              - "*/sa/spark-connect"
              - "*/sa/spark-executor"
      to:
        - operation:
            ports: ["7078", "7079"]
