apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubescape-scan
  labels:
    app.kubernetes.io/name: kubescape
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  # 매일 03:20. 로테이션 CronJob 7종과 시각을 겹치지 않게 둔다.
  schedule: "20 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      # 스캔이 밀려도 다음 날 다시 돈다. 무한 재시도로 자원을 잡지 않는다.
      activeDeadlineSeconds: 2400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kubescape
            app.kubernetes.io/component: security
            app.kubernetes.io/part-of: oneinchmarket
        spec:
          restartPolicy: Never
          serviceAccountName: kubescape
          # ★ ADR-052 — 야간 배치다. 상시 워크로드보다 먼저 밀려난다.
          priorityClassName: batch-low
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            # ★ `kubescape` 가 아니라 `kubescape-cli` 다. 전자는 distroless 이고
            #   PATH 에 바이너리가 없어 exec 자체가 실패한다(실측).
            #   두 이미지 모두 셸이 없으므로 command 를 덮지 않고 args 만 준다.
            - name: kubescape
              image: quay.io/kubescape/kubescape-cli:v4.0.13
              args:
                - scan
                - framework
                # ★★ `all` 을 쓰지 않는다 — **실재하는 프레임워크 이름이 아니다.**
                #   실측(§8-84): `Error: framework 'C-0240' not found, run
                #   `kubescape list frameworks` for available frameworks` 로
                #   죽는다. 컨트롤 ID 가 프레임워크 목록에 섞여 들어온 것이다.
                #   ★ 이것은 **매니페스트를 바꾸지 않았는데 깨진** 부류다 —
                #   프레임워크 목록은 실행할 때마다 원격에서 내려받는다.
                #   41시간 전 실행은 전문 리포트를 내고 성공했다(Gotcha 45 와
                #   같은 유형: 참조 뒤의 내용물이 움직인다).
                #   ★ 증상이 실패처럼 보이지 않는다 — kubescape 가 **사용법을
                #   출력**하고 exit 1 하므로 로그 끝이 도움말이라 "인자를 덜
                #   줬나" 로 읽힌다. 진짜 오류는 도움말 **앞** 한 줄이다.
                #   그래서 이름을 명시한다. `kubescape list frameworks` 로
                #   확인한 12개 중 클라우드 전용(cis-aks/eks/gke)을 뺀 것들이다 —
                #   이 클러스터는 k3s 라 그것들은 성립하지 않는다(41시간 전
                #   리포트에도 `failed to get cloud provider` 가 찍혀 있다).
                - ArmoBest,DevOpsBest,MITRE,NSA,SOC2,cis-v1.12.0
                - --format
                - pretty-printer
                # ★ --keep-local — 결과를 Kubescape SaaS 로 보내지 않는다.
                #   빼면 --submit 설정에 따라 외부 전송이 일어날 수 있다.
                - --keep-local
                # --verbose 는 쓰지 않는다. 실패 리소스만 출력한다.
                # 파드 103개 × 전 프레임워크를 상세 출력하면 로그량이 커지는데,
                # loki 는 파드 80→103 구간에서 이미 12회 OOMKilled 된 적이 있다.
              env:
                # 캐시·설정 경로. 루트 파일시스템은 읽기 전용이다.
                - name: HOME
                  value: /tmp
                - name: KUBESCAPE_SKIP_UPDATE_CHECK
                  value: "true"
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 200m
                  memory: 384Mi
                limits:
                  cpu: "2"
                  memory: 1Gi
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
