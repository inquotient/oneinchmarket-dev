# fvm — 규칙 버전 관리.
#
# ★ tengine 과 같은 파드에 둘 수 없다. 둘 다 :80 을 잡는다
#   (실측: "listen tcp :80: bind: address already in use").
#   compose 는 서비스마다 네트워크 네임스페이스가 따로라 드러나지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safeline-fvm
  labels:
    app.kubernetes.io/name: safeline
    app.kubernetes.io/instance: fvm
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: safeline
      app.kubernetes.io/instance: fvm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safeline
        app.kubernetes.io/instance: fvm
        app.kubernetes.io/component: security
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: safeline
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fvm
          image: docker.io/chaitin/safeline-fvm-g:9.4.3
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
            - containerPort: 9004
              name: grpc
              protocol: TCP
          env:
            # detector 관리면 토큰(9.4.3) — fvm 이 detector 로 규칙(FSL)을 밀고 /stat 을 읽는다. 없으면
            #   `AppendFSL: push fsl failed: Push FSL response(401 unauthorized)` — **규칙 갱신이 detector 에 가지 않는다.**
            #   detector·luigi 와 같은 키다(safeline-deployment.yaml 주석).
            # ★★ 알고 남겨 둔 것(2026-11-07, 사용자 결정) — fvm 의 `get stat error` 가 10초마다 난다. fvm 은 /stat 폴링에
            #   이 토큰을 **싣지 않는다**(같은 fvm 의 규칙 푸시는 싣는다 — 상류 결함으로 보인다). detector(koopa) 로그에
            #   `reject detector management request without valid token ... path=/stat` 로 남는다. 차단·규칙 갱신·공격 기록은
            #   정상이고 fvm 의 통계 읽기만 실패한다. 토큰 검사를 끄는 우회(DETECTOR_MGMT_AUTH=off + 메시 DENY 로 8001 보호)는
            #   방어선을 하나 줄이므로 하지 않았다. 복귀 조건: fvm 이 /stat 에 토큰을 실는 판이 나오면 이 줄을 지운다.
            - name: DETECTOR_MGMT_TOKEN
              valueFrom: { secretKeyRef: { name: safeline-secret, key: detector-mgmt-token } }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE", "NET_BIND_SERVICE"]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits:   { cpu: 500m, memory: 256Mi }
          startupProbe:
            tcpSocket: { port: http }
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 30
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
---
# luigi — 로그 처리. compose 는 MGT_IP 에 고정 IP 를 넣지만 파드가 나뉘었으므로
# Service 이름을 쓴다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safeline-luigi
  labels:
    app.kubernetes.io/name: safeline
    app.kubernetes.io/instance: luigi
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: safeline
      app.kubernetes.io/instance: luigi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: safeline
        app.kubernetes.io/instance: luigi
        app.kubernetes.io/component: security
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: safeline
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: luigi
          image: docker.io/chaitin/safeline-luigi-g:9.4.3
          env:
            - name: SAFELINE_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: safeline-secret, key: db-password } }
            - name: MGT_IP
              value: safeline-mgt
            # detector 관리면 토큰 — safeline-deployment.yaml 의 detector 와 같은 키다(9.4.3).
            - name: DETECTOR_MGMT_TOKEN
              valueFrom: { secretKeyRef: { name: safeline-secret, key: detector-mgmt-token } }
            - name: LUIGI_PG
              value: postgres://safeline:$(SAFELINE_DB_PASSWORD)@postgresql-headless/safeline?sslmode=disable
          volumeMounts:
            # compose: resources/luigi:/app/data
            - name: data
              mountPath: /app/data
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "SETUID", "SETGID", "DAC_OVERRIDE"]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 500m, memory: 384Mi }
      volumes:
        - name: data
          emptyDir: { sizeLimit: 512Mi }
