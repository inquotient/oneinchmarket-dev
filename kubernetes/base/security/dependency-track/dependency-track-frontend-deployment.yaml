apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-frontend
  labels:
    app.kubernetes.io/name: dependency-track
    app.kubernetes.io/instance: frontend
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dependency-track
      app.kubernetes.io/instance: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dependency-track
        app.kubernetes.io/instance: frontend
        app.kubernetes.io/component: security
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: dependency-track
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          # apiserver 와 같은 버전으로 맞춘다(4.x 에 머무는 사유는 그쪽 주석).
          image: dependencytrack/frontend:4.14.3
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          env:
            # ★ 브라우저가 부르는 주소다. 클러스터 내부 DNS 가 아니라 사용자
            #   기준 주소여야 한다. Apicurio UI 에서 같은 함정을 겪었다
            #   (patches/apicurio-ui-local.yaml). 로컬은 port-forward 주소다.
            - name: API_BASE_URL
              value: "http://localhost:8081"
          volumeMounts:
            # ★ nginx 엔트리포인트가 envsubst 결과를 conf.d 에 쓴다. 이 경로를
            #   열지 않으면 "can't create /etc/nginx/conf.d/default.conf:
            #   Read-only file system" 으로 CrashLoop 한다(실측).
            - name: conf
              mountPath: /etc/nginx/conf.d
            - name: cache
              mountPath: /var/cache/nginx
            - name: run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 192Mi
          startupProbe:
            httpGet: { path: /, port: http }
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: conf
          emptyDir: { sizeLimit: 16Mi }
        - name: cache
          emptyDir: { sizeLimit: 128Mi }
        - name: run
          emptyDir: { sizeLimit: 32Mi }
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
