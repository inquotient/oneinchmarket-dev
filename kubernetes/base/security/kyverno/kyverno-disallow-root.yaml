apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-root-user
  labels:
    app.kubernetes.io/name: disallow-root-user
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    policies.kyverno.io/title: Disallow Root User
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must not run as the root user. Satisfied by runAsNonRoot=true
      at the pod level (inherited by every container) or on each container.
      Pod Security Standards "restricted" accepts either form — a container
      that leaves runAsNonRoot undefined inherits the pod-level value.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-run-as-non-root
      match:
        any:
          - resources:
              kinds:
                - Pod
      # ★ 의도된 root 예외 8종 (2026-09-04 추가)
      #
      #   이 목록이 없으면 **prod 배포가 통째로 거부된다.** prod 는 이 정책을
      #   Enforce 로 돌리는데, 아래 8종은 매니페스트에 사유가 기록된 채 root 로
      #   뜬다. local 이 Audit 이라 이벤트로만 남아 지금까지 드러나지 않았다 —
      #   §8-26 에서 SafeLine 을 8번째로 추가하며 확인했다.
      #
      #   ★ 이름으로 한정한다. 어노테이션 opt-out 이면 워크로드가 스스로 예외를
      #     선언할 수 있어 정책의 의미가 없어진다. 이 목록에 이름을 넣는 행위
      #     자체가 리뷰 지점이어야 한다.
      #
      #   사유 (매니페스트에도 동일하게 기록되어 있다)
      #     gitlab        root + capability 8종 — 옴니버스 이미지가 내부에서
      #                   여러 서비스를 기동하며 각각 uid 를 바꾼다
      #     falco         privileged + hostNetwork — 커널 이벤트 수집
      #     filebeat      root + DAC_READ_SEARCH — 다른 컨테이너의 로그 읽기
      #     otel-agent    root + DAC_READ_SEARCH — 동일
      #     ds389         root + CHOWN·DAC_OVERRIDE·FOWNER·SETGID·SETUID·
      #                   NET_BIND_SERVICE — 디렉터리 서버 초기화
      #     lam           root + 앞의 5종
      #     wazuh-manager root + 5종 + KILL·SYS_CHROOT
      #     safeline      root + CHOWN·SETUID·SETGID·DAC_OVERRIDE (tengine 은
      #                   NET_BIND_SERVICE 추가) — detector·tengine 엔트리포인트가
      #                   작업 디렉터리를 chown 한다. 상류가 도커 전용 배포만
      #                   지원해 비루트로 돌리려면 이미지를 다시 빌드해야 한다
      exclude:
        any:
          - resources:
              # ★ kinds 를 함께 준다. selector 만 두면 매칭되지 않는다(실측:
              #   라벨·정책 모두 정확한데 예외가 걸리지 않았다).
              kinds:
                - Pod
              selector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - gitlab
                      - falco
                      - filebeat
                      - otel-agent
                      - ds389
                      - lam
                      - wazuh-manager
                      - safeline
          # ★ 오퍼레이터·시스템 네임스페이스 (2026-09-04)
          #
          #   이 정책은 **우리가 작성한 워크로드**를 규율한다. 아래는 우리가
          #   매니페스트를 쓰지 않는 계층이다 — k3s 내장과 오퍼레이터들이며,
          #   CNI·런타임 보안처럼 기능상 root 가 필요한 것이 대부분이다.
          #
          #   ★ 이걸 빼두면 prod 에서 **파드 재생성이 막힌다.** ClusterPolicy 는
          #     전 네임스페이스를 대상으로 하므로, Enforce 상태에서 cilium 이나
          #     coredns 가 재시작하려는 순간 admission 이 거부한다. 클러스터가
          #     스스로 복구하지 못하는 상태가 된다.
          #     실측(2026-09-04): 이 예외 없이 11건이 위반으로 잡혔다 —
          #     cilium(3) · coredns · local-path-provisioner · istio-cni ·
          #     ztunnel · tetragon · trivy(2)
          - resources:
              kinds:
                - Pod
              namespaces:
                - kube-system
                - istio-system
                - kyverno
                - cert-manager
                - tetragon
                - trivy-system
                - policy-reporter
                - elastic-system
      validate:
        message: >-
          Set securityContext.runAsNonRoot=true on the pod or on every container.
        # ★ anyPattern 이어야 한다.
        #   단일 pattern 으로 containers[*] 만 검사하면 **파드 레벨 설정을
        #   인정하지 않는다.** 이 레포의 규약은 파드 레벨이라 prod 렌더의
        #   컨테이너 53개가 전부 위반으로 잡혔다 — 컨테이너 레벨에 명시한
        #   것은 0개였다. local 은 Audit 이라 이벤트로만 남아 드러나지 않았고
        #   prod 는 Enforce 라 **배포가 통째로 거부될 상태였다.**
        #   PSS restricted 의 실제 판정도 "파드 레벨 또는 컨테이너 레벨"이다.
        anyPattern:
          # ⓐ 파드 레벨에서 한 번 선언 — 이 레포의 규약
          - spec:
              securityContext:
                runAsNonRoot: true
          # ⓑ 컨테이너마다 선언 — 파드 레벨을 쓰지 않는 경우
          - spec:
              containers:
                - securityContext:
                    runAsNonRoot: true
