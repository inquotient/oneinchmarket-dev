# ★ 2026-11-07 에 kyverno.io/v1 ClusterPolicy 에서 policies.kyverno.io/v1 ValidatingPolicy(CEL)로 옮겼다
#   (Kyverno 1.19 가 ClusterPolicy 를 지원 중단 예정으로 경고한다). 옮기기 전에 노드의 kyverno-cli 로
#   렌더 전체에 두 판을 돌려 위반 자원 집합을 대조했다. Audit/Deny 는 spec.validationActions 다
#   (prod 는 패치가 Deny 로 바꾼다). Pod 규칙은 autogen 으로 Deployment·StatefulSet·DaemonSet·
#   ReplicaSet·Job·CronJob 에도 걸린다.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-root-user
  labels:
    app.kubernetes.io/name: disallow-root-user
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    policies.kyverno.io/title: Disallow Root User
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Containers must not run as the root user. Satisfied by runAsNonRoot=true
      at the pod level (inherited by every container) or on each container.
      Pod Security Standards "restricted" accepts either form — a container
      that leaves runAsNonRoot undefined inherits the pod-level value.
spec:
  validationActions: [Audit]
  evaluation:
    background: {enabled: true}
  matchConstraints:
    resourceRules:
      - {apiGroups: [""], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [pods]}
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, replicasets, jobs, cronjobs]
  # ★ 옛 판의 exclude 두 블록이 아래 두 matchConditions 다. 옛 판은 라벨 셀렉터 exclude 때문에
  #   autogen 이 꺼져 Pod 만 봤고, 이 판은 컨트롤러에서 먼저 잡는다(실측: 같은 대상
  #   efs-cleaner·zeek-capture 를 Pod 대신 CronJob·Deployment 로).
  #
  # ★ 시스템 네임스페이스 (2026-09-04)
  #   이 정책은 **우리가 작성한 워크로드**를 규율한다. 아래는 우리가 매니페스트를 쓰지 않는
  #   계층이다 — k3s 내장과 오퍼레이터들이며, CNI·런타임 보안처럼 기능상 root 가 필요한 것이
  #   대부분이다. 이걸 빼두면 prod 에서 **파드 재생성이 막힌다** — Deny 상태에서 cilium 이나
  #   coredns 가 재시작하려는 순간 admission 이 거부해 클러스터가 스스로 복구하지 못한다.
  #   실측(2026-09-04): 이 예외 없이 11건이 위반으로 잡혔다 — cilium(3) · coredns ·
  #   local-path-provisioner · istio-cni · ztunnel · tetragon · trivy(2)
  #
  # ★ 의도된 root 예외 8종 (2026-09-04)
  #   이 목록이 없으면 **prod 배포가 통째로 거부된다.** 이름으로 한정한다 — 어노테이션 opt-out 이면
  #   워크로드가 스스로 예외를 선언할 수 있어 정책의 의미가 없어진다. 이 목록에 이름을 넣는 행위
  #   자체가 리뷰 지점이어야 한다. 사유(매니페스트에도 동일하게 기록되어 있다):
  #     gitlab        root + capability 8종 — 옴니버스 이미지가 여러 서비스를 기동하며 uid 를 바꾼다
  #     falco         root + BPF·PERFMON·SYS_RESOURCE — 커널 이벤트 수집(Gotcha 182·199)
  #     filebeat      root + DAC_READ_SEARCH — 다른 컨테이너의 로그 읽기
  #     otel-agent    root + DAC_READ_SEARCH — 동일
  #     ds389         root + CHOWN·DAC_OVERRIDE·FOWNER·SETGID·SETUID·NET_BIND_SERVICE — 디렉터리 서버 초기화
  #     lam           root + 앞의 5종
  #     wazuh-manager root + 5종 + KILL·SYS_CHROOT
  #     safeline      root + CHOWN·SETUID·SETGID·DAC_OVERRIDE (tengine 은 NET_BIND_SERVICE 추가) —
  #                   detector·tengine 엔트리포인트가 작업 디렉터리를 chown 한다
  matchConditions:
    - name: not-system-namespace
      expression: >-
        !(object.metadata.?namespace.orValue('') in
        ['kube-system', 'istio-system', 'kyverno', 'cert-manager', 'tetragon', 'trivy-system', 'policy-reporter', 'elastic-system'])
    - name: not-intended-root-workload
      expression: >-
        !(object.metadata.?labels[?'app.kubernetes.io/name'].orValue('') in
        ['gitlab', 'falco', 'filebeat', 'otel-agent', 'ds389', 'lam', 'wazuh-manager', 'safeline'])
  # ★ 파드 레벨 또는 컨테이너 레벨 — 둘 다 인정해야 한다(옛 판의 anyPattern). containers[*] 만 보면
  #   이 레포의 규약(파드 레벨)이 전부 위반이 된다 — prod 렌더의 컨테이너 53개가 그렇게 잡혔다.
  #   PSS restricted 의 실제 판정도 "파드 레벨 또는 컨테이너 레벨"이다.
  validations:
    - expression: >-
        object.spec.?securityContext.?runAsNonRoot.orValue(false) == true ||
        object.spec.containers.all(c, c.?securityContext.?runAsNonRoot.orValue(false) == true)
      message: "Set securityContext.runAsNonRoot=true on the pod or on every container."
