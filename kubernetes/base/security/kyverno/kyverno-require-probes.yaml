apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: require-health-probes
  labels:
    app.kubernetes.io/name: require-health-probes
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    policies.kyverno.io/title: Require Health Probes
    policies.kyverno.io/category: Best Practices
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: >-
      All containers should define livenessProbe and readinessProbe to enable
      proper health monitoring and traffic management by Kubernetes.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-liveness-probe
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "All containers must define a livenessProbe."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.containers[?livenessProbe == null] | length(@) }}"
                operator: GreaterThan
                value: 0
    - name: validate-readiness-probe
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "All containers must define a readinessProbe."
        deny:
          conditions:
            any:
              - key: "{{ request.object.spec.containers[?readinessProbe == null] | length(@) }}"
                operator: GreaterThan
                value: 0
