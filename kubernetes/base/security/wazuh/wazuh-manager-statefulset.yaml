apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager
  labels: {app.kubernetes.io/name: wazuh-manager, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  serviceName: wazuh-manager
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: wazuh-manager}
  template:
    metadata:
      labels: {app.kubernetes.io/name: wazuh-manager, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket}
    spec:
      serviceAccountName: wazuh-manager
      # ── 의도된 예외 ─────────────────────────────────────────────
      #   wazuh-manager 는 ossec 데몬 여러 개를 root 로 띄운 뒤 wazuh
      #   사용자로 내려간다. 내장 filebeat 도 같은 구조다.
      #   privileged 도 hostNetwork 도 아니고 capability 는 전부 버린다.
      securityContext:
        runAsUser: 0
        seccompProfile: {type: RuntimeDefault}
      # 단일 노드 클러스터가 아니라 standalone 이다. wazuh-worker 를 두지
      # 않는다 — 로컬에서 매니저를 이중화할 이유가 없다.
      initContainers:
        - name: wait-indexer
          image: busybox:1.36
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              echo "[wait] wazuh-indexer:9200"
              until nc -z wazuh-indexer 9200; do sleep 3; done
              echo "[wait] 완료"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits:   {cpu: 100m, memory: 64Mi}
      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.14.7
          env:
            # 내장 filebeat 가 인덱서로 보내는 경로.
            # indexer 의 security 플러그인을 켰으므로 https + 기본 인증이다.
            - {name: INDEXER_URL, value: "https://wazuh-indexer:9200"}
            - {name: INDEXER_USERNAME, value: "filebeat"}
            - name: INDEXER_PASSWORD
              valueFrom: {secretKeyRef: {name: wazuh-secret, key: indexer-filebeat-password}}
            # ★ none 이 아니라 full 이다. 우리 CA 를 신뢰시키고 SAN 까지 본다.
            #   wazuh-certs.yaml 의 dnsNames 에 wazuh-indexer 가 들어 있다.
            - {name: FILEBEAT_SSL_VERIFICATION_MODE, value: "full"}
            - {name: SSL_CERTIFICATE_AUTHORITIES, value: "/etc/ssl/wazuh/ca.crt"}
            # 클러스터 비활성 — 단일 매니저다.
            - {name: WAZUH_CLUSTER_DISABLED, value: "true"}
            - name: API_USERNAME
              valueFrom: {secretKeyRef: {name: wazuh-secret, key: api-username}}
            - name: API_PASSWORD
              valueFrom: {secretKeyRef: {name: wazuh-secret, key: api-password}}
          ports:
            - {containerPort: 1514, name: agents, protocol: TCP}
            - {containerPort: 1515, name: enrollment, protocol: TCP}
            - {containerPort: 55000, name: api, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              # ★ 필요한 것을 하나씩 찾아낸 결과다. 순서대로 걸렸다:
              #
              #   1) Permission denied: '/var/ossec/etc/ossec.conf'
              #      uid 0 인데 EACCES 다 -> DAC_OVERRIDE
              #      (3단계의 DS389·LAM 과 같은 건. 또 밟았다)
              #   2) s6 가 서비스에 신호를 보낸다 -> KILL
              #   3) wazuh-analysisd: CRITICAL: (1132): Unable to chroot to
              #        directory '/var/ossec' due to [(1)-(Operation not permitted)]
              #      ossec 데몬들은 기동 시 /var/ossec 로 **chroot** 한다.
              #      -> SYS_CHROOT. 이것이 없으면 filebeat 만 뜨고 ossec
              #      데몬 12종이 전부 not running 으로 남는다. 로그에는
              #      ossec.log 에만 남아 파드 로그로는 보이지 않는다.
              #
              #   allowPrivilegeEscalation 은 false 로 되돌렸다. s6 는
              #   no_new_privs 아래에서도 정상 동작한다(filebeat 가 그 증거).
              drop: ["ALL"]
              add: ["CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID", "KILL", "SYS_CHROOT"]
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits:   {cpu: "1",  memory: 1Gi}
          # ossec 데몬 기동이 느리다. 포트로 판정한다.
          startupProbe:
            tcpSocket: {port: agents}
            failureThreshold: 40
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: agents}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            tcpSocket: {port: agents}
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          # ★ /var/ossec/data 에 통째로 걸면 안 된다. 컨테이너 초기화가
          #   /var/ossec/data_tmp 의 내용을 각 경로로 설치하는데, data 를
          #   덮으면 그 절차가 어긋나고 ossec 데몬이 하나도 뜨지 않는다
          #   (wazuh-control status 가 전부 "not running").
          #   upstream(wazuh-kubernetes)의 방식대로 필요한 경로만 subPath
          #   로 나눠 건다.
          volumeMounts:
            - {name: data, mountPath: /var/ossec/api/configuration, subPath: api}
            - {name: data, mountPath: /var/ossec/etc,               subPath: etc}
            - {name: data, mountPath: /var/ossec/logs,              subPath: logs}
            - {name: data, mountPath: /var/ossec/queue,             subPath: queue}
            - {name: data, mountPath: /var/ossec/var/multigroups,   subPath: multigroups}
            - {name: data, mountPath: /var/ossec/integrations,      subPath: integrations}
            - {name: data, mountPath: /var/ossec/active-response/bin, subPath: active-response}
            - {name: data, mountPath: /var/ossec/agentless,         subPath: agentless}
            - {name: data, mountPath: /var/ossec/wodles,            subPath: wodles}
            - {name: data, mountPath: /etc/filebeat,                subPath: filebeat-etc}
            - {name: data, mountPath: /var/lib/filebeat,            subPath: filebeat-var}
            # indexer 의 CA. filebeat 가 이것으로 서버 인증서를 검증한다.
            - {name: indexer-ca, mountPath: /etc/ssl/wazuh, readOnly: true}
      volumes:
        - name: indexer-ca
          secret:
            secretName: wazuh-indexer-tls
            items:
              - {key: ca.crt, path: ca.crt}
            defaultMode: 0444
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources: {requests: {storage: 10Gi}}
