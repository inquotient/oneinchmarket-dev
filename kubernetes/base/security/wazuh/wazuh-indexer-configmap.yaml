apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-indexer-config
  labels: {app.kubernetes.io/name: wazuh-indexer, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
data:
  # Wazuh indexer 는 OpenSearch 다. 단일 노드로 띄운다.
  #
  # ★ plugins.security.disabled: true — 로컬 한정 단순화다.
  #   OpenSearch security 플러그인을 켜면 루트 CA·노드 인증서·admin 인증서와
  #   bcrypt 해시가 든 internal_users.yml, 그리고 securityadmin.sh 부트스트랩이
  #   따라온다. 그 전체를 선언적으로 다루는 것은 이 단계의 목적(=Wazuh 파이프라인
  #   개통 확인)에 비해 크다.
  #   대신 이 네임스페이스는 default-deny-ingress 아래 있고 NetworkPolicy 로
  #   wazuh-manager 만 9200 에 접근한다.
  #   **prod 로 가져갈 때는 반드시 켜야 한다** — cert-manager 가 이미 설치되어
  #   있으므로 Issuer + Certificate 로 노드/admin 인증서를 발급하는 경로가 있다
  #   (TODO-02 의 첫 실사용처가 된다).
  opensearch.yml: |
    network.host: 0.0.0.0
    node.name: wazuh-indexer-0
    cluster.name: wazuh-cluster
    discovery.type: single-node
    path.data: /var/lib/wazuh-indexer
    path.logs: /var/log/wazuh-indexer
    plugins.security.disabled: true
    compatibility.override_main_response_version: true
