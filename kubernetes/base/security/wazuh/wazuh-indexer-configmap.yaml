apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-indexer-config
  labels: {app.kubernetes.io/name: wazuh-indexer, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
data:
  # Wazuh indexer 는 OpenSearch 다. 단일 노드로 띄운다.
  #
  # ★ security 플러그인을 켰다(2026-09-01). 처음에는 인증서·해시·
  #   securityadmin 부트스트랩이 부담이라 껐다가, cert-manager 가 이미
  #   설치되어 있어 인증서 발급이 선언적으로 해결된다는 점을 보고 되돌렸다.
  #   이제 네트워크 경계(NetworkPolicy) 외에 인증·전송암호화가 함께 선다.
  #
  # ★ allow_default_init_securityindex: true
  #   이것이 있어야 첫 기동에 config/opensearch-security/ 의 내용으로
  #   .opendistro_security 인덱스를 스스로 만든다. 없으면 별도 Job 으로
  #   securityadmin.sh 를 돌려야 한다 — 그 한 단계를 없앤다.
  opensearch.yml: |
    network.host: 0.0.0.0
    node.name: wazuh-indexer-0
    cluster.name: wazuh-cluster
    discovery.type: single-node
    path.data: /var/lib/wazuh-indexer
    path.logs: /var/log/wazuh-indexer
    compatibility.override_main_response_version: true

    # ── 전송 계층(노드 간) ─────────────────────────────────────
    plugins.security.ssl.transport.pemcert_filepath: /usr/share/wazuh-indexer/config/certs/tls.crt
    plugins.security.ssl.transport.pemkey_filepath: /usr/share/wazuh-indexer/config/certs/tls.key
    plugins.security.ssl.transport.pemtrustedcas_filepath: /usr/share/wazuh-indexer/config/certs/ca.crt
    # 단일 노드라 호스트명 검증이 얻는 것이 없고, StatefulSet 파드명·서비스명
    # 조합이 늘 때마다 SAN 을 고쳐야 한다.
    plugins.security.ssl.transport.enforce_hostname_verification: false
    plugins.security.ssl.transport.resolve_hostname: false

    # ── HTTP 계층(클라이언트) ──────────────────────────────────
    plugins.security.ssl.http.enabled: true
    plugins.security.ssl.http.pemcert_filepath: /usr/share/wazuh-indexer/config/certs/tls.crt
    plugins.security.ssl.http.pemkey_filepath: /usr/share/wazuh-indexer/config/certs/tls.key
    plugins.security.ssl.http.pemtrustedcas_filepath: /usr/share/wazuh-indexer/config/certs/ca.crt

    # ── 인가 ───────────────────────────────────────────────────
    # ★ DN 문자열이 인증서의 subject 와 정확히 일치해야 한다.
    #   wazuh-certs.yaml 의 commonName + subject.organizations 가 원천이다.
    plugins.security.authcz.admin_dn:
      - "CN=wazuh-admin,O=oneinchmarket"
    plugins.security.nodes_dn:
      - "CN=wazuh-indexer,O=oneinchmarket"

    plugins.security.allow_default_init_securityindex: true
    plugins.security.restapi.roles_enabled: ["all_access"]
    # 데모 설정으로 뜨는 것을 막는다. internal_users.yml 은 initContainer 가
    # Secret 의 비밀번호로 새로 쓴다.
    plugins.security.allow_unsafe_democertificates: false

    # 감사 로그는 끈다 — 자기 자신에게 쓰면서 단일 노드 예산을 먹는다.
    plugins.security.audit.type: noop
