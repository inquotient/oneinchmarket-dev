# Wazuh indexer 의 OpenSearch security 플러그인용 인증서.
#
# ★ cert-manager 의 첫 실사용처다(TODO-02). 지금까지 cert-manager 는
#   설치만 되어 있고 Issuer/Certificate 가 하나도 없었다.
#
# 체인: selfsigned Issuer -> CA 인증서 -> CA Issuer -> 노드·admin 인증서
#
# ★ DN 이 설정과 정확히 일치해야 한다. OpenSearch security 는
#   plugins.security.nodes_dn·authcz.admin_dn 을 RFC2253 문자열로 비교한다.
#   commonName + subject.organizations 로 "CN=...,O=oneinchmarket" 이 나온다.
#   여기를 틀리면 노드가 자기 자신을 클러스터 구성원으로 인정하지 않는다.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: wazuh-selfsigned
  labels: {app.kubernetes.io/name: wazuh, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wazuh-ca
  labels: {app.kubernetes.io/name: wazuh, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  isCA: true
  commonName: wazuh-ca
  secretName: wazuh-ca-tls
  duration: 87600h    # 10년. 로컬 CA 를 만료로 잃는 일이 없게 한다
  privateKey:
    algorithm: RSA
    size: 4096
    encoding: PKCS8
  issuerRef:
    name: wazuh-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: wazuh-ca
  labels: {app.kubernetes.io/name: wazuh, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  ca:
    secretName: wazuh-ca-tls
---
# 노드 인증서 — transport·http 양쪽에 쓴다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wazuh-indexer-tls
  labels: {app.kubernetes.io/name: wazuh-indexer, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  commonName: wazuh-indexer
  secretName: wazuh-indexer-tls
  duration: 8760h
  renewBefore: 720h
  subject:
    organizations: ["oneinchmarket"]
  dnsNames:
    - wazuh-indexer
    - wazuh-indexer.local.svc.cluster.local
    - wazuh-indexer-0.wazuh-indexer
    - wazuh-indexer-0.wazuh-indexer.local.svc.cluster.local
    - localhost
  ipAddresses:
    - 127.0.0.1
  usages: [server auth, client auth, digital signature, key encipherment]
  privateKey:
    algorithm: RSA
    size: 2048
    # ★ PKCS8 이어야 한다. OpenSearch security 는 PKCS1 개인키를 읽지 못한다.
    encoding: PKCS8
  issuerRef:
    name: wazuh-ca
    kind: Issuer
---
# admin 인증서 — securityadmin / REST admin 용. client auth 만 필요하다.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wazuh-admin-tls
  labels: {app.kubernetes.io/name: wazuh-indexer, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  commonName: wazuh-admin
  secretName: wazuh-admin-tls
  duration: 8760h
  renewBefore: 720h
  subject:
    organizations: ["oneinchmarket"]
  usages: [client auth, digital signature, key encipherment]
  privateKey:
    algorithm: RSA
    size: 2048
    encoding: PKCS8
  issuerRef:
    name: wazuh-ca
    kind: Issuer
