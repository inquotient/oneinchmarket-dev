apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
  labels: {app.kubernetes.io/name: wazuh-indexer, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  serviceName: wazuh-indexer
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: wazuh-indexer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: wazuh-indexer, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket}
    spec:
      serviceAccountName: wazuh-indexer
      securityContext:
        # wazuh-indexer 이미지의 기본 uid 다.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: wazuh-indexer
          image: wazuh/wazuh-indexer:4.14.7
          env:
            # Xms == Xmx. JVM 은 힙이 커질 때 GC 가 요동친다.
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
          ports:
            - {containerPort: 9200, name: http, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 768Mi}
            limits:   {cpu: "1",  memory: 1536Mi}
          startupProbe:
            httpGet: {path: /_cluster/health, port: http}
            failureThreshold: 40
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: http}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /_cluster/health, port: http}
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - {name: config, mountPath: /usr/share/wazuh-indexer/opensearch.yml, subPath: opensearch.yml}
            - {name: data, mountPath: /var/lib/wazuh-indexer}
      volumes:
        - name: config
          configMap: {name: wazuh-indexer-config}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources: {requests: {storage: 20Gi}}
