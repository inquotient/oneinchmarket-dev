apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-indexer
  labels: {app.kubernetes.io/name: wazuh-indexer, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  serviceName: wazuh-indexer
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: wazuh-indexer}
  template:
    metadata:
      labels: {app.kubernetes.io/name: wazuh-indexer, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket}
    spec:
      serviceAccountName: wazuh-indexer
      securityContext:
        # wazuh-indexer 이미지의 기본 uid 다.
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # ★ security 설정을 Secret 의 비밀번호로 만들어 낸다.
        #   internal_users.yml 은 **bcrypt 해시**를 요구하므로 ConfigMap 에
        #   미리 넣어 둘 수 없다(해시를 커밋해야 하고, 비밀번호를 바꾸면
        #   해시도 다시 만들어야 한다). 이미지에 들어 있는 hash.sh 로
        #   기동 시점에 만든다.
        #
        #   기본 설정 일체를 emptyDir 로 복사한 뒤 internal_users.yml 만
        #   덮어쓴다. 디렉터리째 마운트하면 roles.yml·config.yml 등
        #   나머지가 가려져 플러그인이 뜨지 않는다.
        - name: render-security-config
          image: wazuh/wazuh-indexer:4.14.7
          command: ["/bin/bash","-c"]
          args:
            - |
              set -euo pipefail
              SRC=/usr/share/wazuh-indexer/config/opensearch-security
              DST=/security-config
              # ★ cp -a 를 쓰지 말 것. -a 는 타임스탬프·소유권 보존을 시도하는데
              #   emptyDir 마운트 루트에서는 권한이 없어 실패한다:
              #     cp: preserving times for '/security-config/.': Operation not permitted
              #   내용만 복사하면 된다.
              cp -r "$SRC"/. "$DST"/
              hash_of() {
                # ★ stderr 를 버리지 말 것. 처음에 2>/dev/null 로 가렸다가
                #   진짜 원인(java: command not found)을 못 보고 헤맸다.
                #   아래 grep 이 bcrypt 해시 줄만 고르므로 경고는 어차피 걸러진다.
                bash /usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh \
                  -p "$1" 2>&1 | grep -E '^\$2[aby]\$' | tail -1
              }
              ADMIN_HASH=$(hash_of "$INDEXER_ADMIN_PASSWORD")
              FB_HASH=$(hash_of "$INDEXER_FILEBEAT_PASSWORD")
              [ -n "$ADMIN_HASH" ] && [ -n "$FB_HASH" ] || { echo "해시 생성 실패"; exit 1; }

              # ★ 데모 사용자(admin/anomalyadmin/kibanaserver/logstash/
              #   readall/snapshotrestore)를 전부 지운다. 기본 해시가 공개되어
              #   있으므로 남겨 두면 인증을 켠 의미가 없다.
              # ★ heredoc 을 쓰지 말 것. YAML 블록 스칼라 안에서는 종료
              #   토큰도 함께 들여쓰기되는데, bash 의 <<TOKEN 은 종료 토큰이
              #   0열에 있어야 인식한다. 들여쓰면 heredoc 이 끝나지 않아
              #   스크립트 전체가 구문 오류로 죽고 **로그가 한 줄도 안 나온다.**
              #   (3단계 LDIF 의 line folding 과 같은 계열의 함정이다.)
              {
                printf '%s\n' '---'
                printf '%s\n' '_meta:'
                printf '%s\n' '  type: "internalusers"'
                printf '%s\n' '  config_version: 2'
                printf '%s\n' ''
                printf '%s\n' 'admin:'
                printf '  hash: "%s"\n' "$ADMIN_HASH"
                printf '%s\n' '  reserved: true'
                printf '%s\n' '  backend_roles:'
                printf '%s\n' '  - "admin"'
                printf '%s\n' '  description: "oneinchmarket admin"'
                printf '%s\n' ''
                printf '%s\n' 'filebeat:'
                printf '  hash: "%s"\n' "$FB_HASH"
                printf '%s\n' '  reserved: false'
                printf '%s\n' '  backend_roles:'
                printf '%s\n' '  - "admin"'
                printf '%s\n' '  description: "wazuh-manager 내장 filebeat"'
              } > "$DST/internal_users.yml"
              echo "[render] internal_users.yml 생성 (사용자 2명)"
              grep -E "^(admin|filebeat):" "$DST/internal_users.yml"
          env:
            # ★ hash.sh 는 java 를 부른다. 이미지의 엔트리포인트가 설정하는
            #   OPENSEARCH_JAVA_HOME 을 initContainer 는 받지 못한다
            #   (command 로 엔트리포인트를 대체했기 때문이다). 직접 준다.
            #   없으면 hash.sh 가 rc=127(java: command not found)로 죽는다.
            - {name: OPENSEARCH_JAVA_HOME, value: /usr/share/wazuh-indexer/jdk}
            - {name: JAVA_HOME, value: /usr/share/wazuh-indexer/jdk}
            - name: INDEXER_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: wazuh-secret, key: indexer-admin-password}}
            - name: INDEXER_FILEBEAT_PASSWORD
              valueFrom: {secretKeyRef: {name: wazuh-secret, key: indexer-filebeat-password}}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits:   {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: security-config, mountPath: /security-config}
      containers:
        - name: wazuh-indexer
          image: wazuh/wazuh-indexer:4.14.7
          env:
            # Xms == Xmx. JVM 은 힙이 커질 때 GC 가 요동친다.
            - {name: OPENSEARCH_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
            - name: INDEXER_ADMIN_PASSWORD
              valueFrom: {secretKeyRef: {name: wazuh-secret, key: indexer-admin-password}}
          ports:
            - {containerPort: 9200, name: https, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 768Mi}
            limits:   {cpu: "1",  memory: 1536Mi}
          # ★ 프로브가 exec 이다. HTTPS + 기본 인증이라 httpGet 으로는
          #   자격증명을 넣을 수 없고, 인증 없이 부르면 401 이 온다.
          #   비밀번호는 env(Secret)에서 읽으므로 파드 스펙에 남지 않는다.
          startupProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - >-
                  curl -sf -k -u "admin:$INDEXER_ADMIN_PASSWORD"
                  https://localhost:9200/_cluster/health >/dev/null
            failureThreshold: 40
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: https}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - >-
                  curl -sf -k -u "admin:$INDEXER_ADMIN_PASSWORD"
                  https://localhost:9200/_cluster/health >/dev/null
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            # ★ 경로 주의 — 유효한 설정은 config/ 아래다.
            #   엔트리포인트가 OPENSEARCH_PATH_CONF=/usr/share/wazuh-indexer/config
            #   를 export 한다. /usr/share/wazuh-indexer/opensearch.yml 도
            #   존재하는데 그쪽에 마운트하면 아무 효과가 없다.
            - {name: config, mountPath: /usr/share/wazuh-indexer/config/opensearch.yml, subPath: opensearch.yml, readOnly: true}
            - {name: security-config, mountPath: /usr/share/wazuh-indexer/config/opensearch-security}
            # ★ 인증서는 반드시 config/ 아래여야 한다. OpenSearch 의
            #   SecurityManager 가 OPENSEARCH_PATH_CONF 밖의 파일 읽기를
            #   막는다. config/ 밖에 두면 이렇게 죽는다:
            #     SecurityManager.checkRead ->
            #       SslCertificatesLoader.resolvePath: access denied
            - {name: certs, mountPath: /usr/share/wazuh-indexer/config/certs, readOnly: true}
            - {name: data, mountPath: /var/lib/wazuh-indexer}
      volumes:
        - name: config
          configMap: {name: wazuh-indexer-config}
        - name: security-config
          emptyDir: {}
        - name: certs
          secret:
            secretName: wazuh-indexer-tls
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources: {requests: {storage: 20Gi}}
