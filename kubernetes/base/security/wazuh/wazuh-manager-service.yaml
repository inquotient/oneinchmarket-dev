apiVersion: v1
kind: ServiceAccount
metadata:
  name: wazuh-manager
  labels: {app.kubernetes.io/name: wazuh-manager, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
  labels: {app.kubernetes.io/name: wazuh-manager, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  ports:
    - {name: agents, port: 1514, targetPort: 1514, protocol: TCP}     # 에이전트 이벤트
    - {name: enrollment, port: 1515, targetPort: 1515, protocol: TCP} # 에이전트 등록
    - {name: api, port: 55000, targetPort: 55000, protocol: TCP}      # REST API
  selector: {app.kubernetes.io/name: wazuh-manager}
