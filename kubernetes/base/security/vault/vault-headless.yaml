apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  labels: {app.kubernetes.io/name: vault, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
# Kubernetes auth method 를 켤 때 TokenReview 권한이 필요해진다.
# 지금은 켜지 않았으므로 토큰을 마운트하지 않는다.
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: vault-headless
  labels: {app.kubernetes.io/name: vault, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  clusterIP: None
  publishNotReadyAddresses: true   # 봉인 상태에서도 unseal 하려면 붙을 수 있어야 한다
  ports:
    - {name: http, port: 8200, targetPort: 8200, protocol: TCP}
    - {name: cluster, port: 8201, targetPort: 8201, protocol: TCP}
  selector: {app.kubernetes.io/name: vault}
