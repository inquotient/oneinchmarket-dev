apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  labels: {app.kubernetes.io/name: vault, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
data:
  # 단일 노드 · file 스토리지. Raft(integrated storage)는 3노드 이상에서
  # 의미가 있고 로컬 예산에서는 얻는 것이 없다.
  #
  # ★ 이 Vault 는 "올려만 둔" 상태다. 시크릿 원천을 Vault 로 옮기는 것은
  #   ADR-024 결정이며 여기서 하지 않는다. 옮기면 로테이션 CronJob 8종·
  #   git-sync·.enc.yaml 12개가 제거된다. 그 마이그레이션 전까지
  #   local/create-secrets.sh 가 계속 원천이다.
  #
  # ★ dev 모드가 아니다. 실제 봉인(seal) 상태로 뜨며 unseal 키가 필요하다.
  #   dev 모드는 메모리 저장이라 재시작마다 데이터가 사라지고 root token 이
  #   고정값이라 습관을 잘못 들인다.
  vault.hcl: |
    ui = true
    disable_mlock = true

    storage "file" {
      path = "/vault/data"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
    }

    # 컨테이너 안에서 자기 자신을 가리키는 주소. operator init/unseal 이 쓴다.
    api_addr     = "http://127.0.0.1:8200"
    cluster_addr = "http://127.0.0.1:8201"

    # 텔레메트리는 Prometheus 가 가져간다. 인증 없이 노출하지 않는다 —
    # /v1/sys/metrics 는 토큰을 요구하므로 스크레이프 설정은 별도 작업이다.
    telemetry {
      prometheus_retention_time = "24h"
      disable_hostname          = true
    }
