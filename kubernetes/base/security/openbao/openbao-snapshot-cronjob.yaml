# OpenBao raft 스냅샷 → S3(SeaweedFS)
#
# ★ Vault Enterprise 의 **자동 스냅샷 · DR Replication** 자리를 채운다
#   (WSO2-OSS-MAPPING.md 부록 A-2). 복제가 아니라 백업·복구로 바꾸는 것이며,
#   RPO 는 이 CronJob 의 주기다.
#
# ★ raft 라서 가능하다. file 스토리지에는 스냅샷 API 가 없어 백업이 "PVC 를
#   통째로 복사" 뿐인데, RWO 볼륨은 쓰는 중에 다른 파드가 마운트할 수 없어
#   온라인 백업이 성립하지 않는다. §8-80 에서 raft 로 바꾼 이유다.
#
# ★ 왜 두 컨테이너인가 — openbao 이미지에는 S3 클라이언트가 없고 aws-cli 에는 `bao` 가
#   없다. initContainer 가 스냅샷을 뜨고 본 컨테이너가 올린다. emptyDir 로 넘긴다.
#
# ★★ 스냅샷에는 **봉인된 데이터 전체**가 들어 있다. 복호화하려면 unseal 키가
#   필요하므로 스냅샷 자체는 평문이 아니다. 다만 unseal 키가 같은 클러스터의
#   Secret 에 있으므로(§8-80 의 트레이드오프) **둘을 같은 곳에 두면 의미가
#   없다.** prod 에서는 스냅샷을 클러스터 밖으로, 키는 KMS 로 분리할 것.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot
  labels: {app.kubernetes.io/name: openbao-snapshot, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
  labels: {app.kubernetes.io/name: openbao-snapshot, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  # 6시간마다. RPO 6시간이라는 뜻이다 — 줄이려면 주기를 줄인다.
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {app.kubernetes.io/name: openbao-snapshot, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: openbao-snapshot
          # ★ quay 자격이 더는 필요 없다(2026-11-07) — S3 클라이언트를 quay.io/minio/mc 에서
          #   docker.io/amazon/aws-cli 로 바꿨다(익명 pull). quay-pull-secret 을 쓰는 곳은 이제 0 이다.
          priorityClassName: batch-low
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: snapshot
              image: docker.io/openbao/openbao:2.7.2
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # ★ ClusterIP 를 FQDN 으로 부른다. 짧은 이름은 같은
                  #   네임스페이스에서만 풀린다(Gotcha 17·52). 이 Job 은 같은
                  #   네임스페이스지만, 옮겨도 깨지지 않게 FQDN 으로 둔다.
                  bao operator raft snapshot save /snap/openbao.snap
                  ls -l /snap/openbao.snap
              env:
                - {name: BAO_ADDR, value: "http://openbao.local.svc.cluster.local:8200"}
                # ★ root 토큰을 쓴다. 최소 권한은 `sys/storage/raft/snapshot` 에
                #   read 만 주는 전용 정책이지만, 그 정책을 만들려면 다시 root 가
                #   필요하다. 로컬 단순화이며 prod 에서는 전용 정책·토큰을 쓸 것.
                - name: BAO_TOKEN
                  valueFrom: {secretKeyRef: {name: openbao-keys, key: root-token}}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits:   {cpu: 300m, memory: 256Mi}
              volumeMounts:
                - {name: snap, mountPath: /snap}
          containers:
            - name: upload
              image: docker.io/amazon/aws-cli:2.27.50
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  export HOME=/tmp AWS_DEFAULT_REGION=us-east-1 AWS_ACCESS_KEY_ID="$S3_USER" AWS_SECRET_ACCESS_KEY="$S3_KEY"
                  E=http://seaweedfs-headless:9000
                  # SeaweedFS S3(2026-11-07). HTTP 다.
                  # ★ root 가 아니라 전용 사용자다(2026-11-06) — openbao-snapshots 버킷만 읽고 쓴다. 버킷은 seaweedfs-bootstrap 이
                  #   만든다(이 사용자에게는 생성 권한이 없다).
                  until aws --endpoint-url "$E" s3api list-objects-v2 --bucket openbao-snapshots --max-keys 1 >/dev/null 2>&1; do sleep 3; done
                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  aws --endpoint-url "$E" s3 cp --only-show-errors /snap/openbao.snap "s3://openbao-snapshots/openbao-${TS}.snap"
                  # ★ 보존: 30일. 이것이 없으면 6시간마다 쌓여 디스크를 먹는다.
                  #   aws-cli 에는 mc 의 --older-than 이 없다 — LastModified(ISO 8601, 사전순 = 시간순)로 고른다.
                  #   ★ 방금 올린 것은 지우지 않는다 — 시계가 틀어져도 최신 하나는 남는다.
                  CUT="$(date -u -d '30 days ago' +%Y-%m-%dT%H:%M:%S)"
                  old=$(aws --endpoint-url "$E" s3api list-objects-v2 --bucket openbao-snapshots \
                          --query "Contents[?LastModified<'${CUT}'].Key" --output text)
                  n=0
                  for k in $old; do
                    [ "$k" = None ] && continue
                    [ "$k" = "openbao-${TS}.snap" ] && continue
                    aws --endpoint-url "$E" s3api delete-object --bucket openbao-snapshots --key "$k" >/dev/null && n=$((n+1))
                  done
                  echo "[openbao-snapshot] 업로드 완료 openbao-${TS}.snap · 30일 넘은 것 ${n}개 정리"
                  aws --endpoint-url "$E" s3 ls s3://openbao-snapshots/ | tail -3
              env:
                - name: S3_USER
                  valueFrom: {secretKeyRef: {name: seaweedfs-users, key: openbao-snapshot-access-key}}
                - name: S3_KEY
                  valueFrom: {secretKeyRef: {name: seaweedfs-users, key: openbao-snapshot-secret-key}}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits:   {cpu: 300m, memory: 256Mi}
              volumeMounts:
                - {name: snap, mountPath: /snap}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: snap
              emptyDir: {}
            - name: tmp
              emptyDir: {}
