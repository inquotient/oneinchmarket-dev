# OpenBao raft 스냅샷 → MinIO
#
# ★ Vault Enterprise 의 **자동 스냅샷 · DR Replication** 자리를 채운다
#   (WSO2-OSS-MAPPING.md 부록 A-2). 복제가 아니라 백업·복구로 바꾸는 것이며,
#   RPO 는 이 CronJob 의 주기다.
#
# ★ raft 라서 가능하다. file 스토리지에는 스냅샷 API 가 없어 백업이 "PVC 를
#   통째로 복사" 뿐인데, RWO 볼륨은 쓰는 중에 다른 파드가 마운트할 수 없어
#   온라인 백업이 성립하지 않는다. §8-80 에서 raft 로 바꾼 이유다.
#
# ★ 왜 두 컨테이너인가 — openbao 이미지에는 `mc` 가 없고 minio/mc 에는 `bao` 가
#   없다. initContainer 가 스냅샷을 뜨고 본 컨테이너가 올린다. emptyDir 로 넘긴다.
#
# ★★ 스냅샷에는 **봉인된 데이터 전체**가 들어 있다. 복호화하려면 unseal 키가
#   필요하므로 스냅샷 자체는 평문이 아니다. 다만 unseal 키가 같은 클러스터의
#   Secret 에 있으므로(§8-80 의 트레이드오프) **둘을 같은 곳에 두면 의미가
#   없다.** prod 에서는 스냅샷을 클러스터 밖으로, 키는 KMS 로 분리할 것.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-snapshot
  labels: {app.kubernetes.io/name: openbao-snapshot, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: openbao-snapshot
  labels: {app.kubernetes.io/name: openbao-snapshot, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  # 6시간마다. RPO 6시간이라는 뜻이다 — 줄이려면 주기를 줄인다.
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels: {app.kubernetes.io/name: openbao-snapshot, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket}
        spec:
          restartPolicy: OnFailure
          serviceAccountName: openbao-snapshot
          priorityClassName: batch-low
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile: {type: RuntimeDefault}
          initContainers:
            - name: snapshot
              image: openbao/openbao:2.4.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # ★ ClusterIP 를 FQDN 으로 부른다. 짧은 이름은 같은
                  #   네임스페이스에서만 풀린다(Gotcha 17·52). 이 Job 은 같은
                  #   네임스페이스지만, 옮겨도 깨지지 않게 FQDN 으로 둔다.
                  bao operator raft snapshot save /snap/openbao.snap
                  ls -l /snap/openbao.snap
              env:
                - {name: BAO_ADDR, value: "http://openbao.local.svc.cluster.local:8200"}
                # ★ root 토큰을 쓴다. 최소 권한은 `sys/storage/raft/snapshot` 에
                #   read 만 주는 전용 정책이지만, 그 정책을 만들려면 다시 root 가
                #   필요하다. 로컬 단순화이며 prod 에서는 전용 정책·토큰을 쓸 것.
                - name: BAO_TOKEN
                  valueFrom: {secretKeyRef: {name: openbao-keys, key: root-token}}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits:   {cpu: 300m, memory: 256Mi}
              volumeMounts:
                - {name: snap, mountPath: /snap}
          containers:
            - name: upload
              image: minio/mc:RELEASE.2025-08-13T08-35-41Z
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # MinIO 는 HTTP 다 — https:// 로 부르면 실패한다(§ minio-bootstrap 주석).
                  until mc alias set oim http://minio-headless:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do sleep 3; done
                  mc mb --ignore-existing oim/openbao-snapshots
                  TS="$(date -u +%Y%m%dT%H%M%SZ)"
                  mc cp /snap/openbao.snap "oim/openbao-snapshots/openbao-${TS}.snap"
                  # ★ 보존: 30일. 이것이 없으면 6시간마다 쌓여 디스크를 먹는다.
                  mc rm --recursive --force --older-than 30d oim/openbao-snapshots/ || true
                  echo "[openbao-snapshot] 업로드 완료 openbao-${TS}.snap"
                  mc ls oim/openbao-snapshots/ | tail -3
              env:
                - name: MINIO_ROOT_USER
                  valueFrom: {secretKeyRef: {name: minio-secret, key: root-user}}
                - name: MINIO_ROOT_PASSWORD
                  valueFrom: {secretKeyRef: {name: minio-secret, key: root-password}}
                - {name: MC_CONFIG_DIR, value: /tmp/mc}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits:   {cpu: 300m, memory: 256Mi}
              volumeMounts:
                - {name: snap, mountPath: /snap}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: snap
              emptyDir: {}
            - name: tmp
              emptyDir: {}
