# ESO 가 OpenBao 를 읽는 통로
#
# ★ 이것이 있어야 ExternalSecret 이 동작한다. ESO 는 provider `vault` 로
#   OpenBao 에 붙는다 — API 가 호환되므로 별도 provider 가 필요 없다.
#
# ★★ server 는 **FQDN 이어야 한다.** ESO 컨트롤러는 `external-secrets`
#   네임스페이스에서 돌기 때문에 짧은 이름 `openbao` 는 풀리지 않는다.
#   증상은 SecretSyncedError 이고 메시지가 DNS 를 가리키지 않을 수 있어
#   토큰이나 경로를 의심하게 된다(Gotcha 17·52 와 같은 부류).
#
# ★ 인증은 **전용 토큰**이다. root 토큰을 쓰지 않는다 — 정책 `eso-read` 는
#   `oim/data/*` 읽기만 갖는다. local/openbao-eso-setup.sh 가 만든다.
#   ★ 다음 단계는 Kubernetes auth method 로 바꾸는 것이다. 그러면 장기 토큰이
#     사라지고 ESO 의 ServiceAccount 가 곧 신원이 된다. OpenBao SA 에
#     TokenReview 권한이 필요해 별도 작업으로 둔다(§8-81).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
  labels: {app.kubernetes.io/name: openbao, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  provider:
    vault:
      server: "http://openbao.local.svc.cluster.local:8200"
      # KV v2 를 `oim/` 에 마운트한다. v2 는 데이터가 `oim/data/<path>` 에
      # 놓이지만 ESO 에는 마운트 경로만 준다 — version 필드가 그것을 안다.
      path: "oim"
      version: v2
      auth:
        tokenSecretRef:
          name: openbao-eso-token
          key: token
          namespace: external-secrets
