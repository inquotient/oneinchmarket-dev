apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  labels: {app.kubernetes.io/name: openbao, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
# ★ Kubernetes auth method 를 켰다(§8-82). OpenBao 가 들어온 SA 토큰을
#   검증하려면 **자기 토큰으로 TokenReview 를 호출**해야 하므로 마운트한다.
#   아래 ClusterRoleBinding 이 system:auth-delegator 를 준다.
automountServiceAccountToken: true
---
# TokenReview 권한. 이것이 없으면 auth/kubernetes/login 이
#   "permission denied" 로 실패하는데, 메시지가 **로그인하려는 쪽**을
#   가리켜서 ESO 의 역할이나 정책을 의심하게 된다. 실제로 권한이 없는 것은
#   검증하는 쪽(OpenBao)이다.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-tokenreview
  labels: {app.kubernetes.io/name: openbao, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: local
---
apiVersion: v1
kind: Service
metadata:
  name: openbao-headless
  labels: {app.kubernetes.io/name: openbao, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  clusterIP: None
  publishNotReadyAddresses: true   # 봉인 상태에서도 unseal 하려면 붙을 수 있어야 한다
  ports:
    - {name: http, port: 8200, targetPort: 8200, protocol: TCP}
    - {name: cluster, port: 8201, targetPort: 8201, protocol: TCP}
  selector: {app.kubernetes.io/name: openbao}
---
# ★ headless 가 아닌 ClusterIP 도 둔다.
#   External Secrets Operator 는 **다른 네임스페이스**(external-secrets)에서
#   붙는다. headless 이름은 파드 IP 로 풀려 OpenBao 가 재시작할 때마다 바뀌므로
#   ClusterSecretStore 의 server 주소로 삼기에 안정적이지 않다.
#   §8-79 에서 GitLab 레지스트리에 같은 이유로 전용 ClusterIP 를 만들었다.
# ★ ClusterSecretStore 는 FQDN 으로 이 이름을 가리켜야 한다 —
#   짧은 이름은 같은 네임스페이스에서만 풀린다(Gotcha 17·52).
apiVersion: v1
kind: Service
metadata:
  name: openbao
  labels: {app.kubernetes.io/name: openbao, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  type: ClusterIP
  publishNotReadyAddresses: true
  ports:
    - {name: http, port: 8200, targetPort: 8200, protocol: TCP}
  selector: {app.kubernetes.io/name: openbao}
