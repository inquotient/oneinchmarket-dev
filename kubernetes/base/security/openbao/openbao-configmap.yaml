apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  labels: {app.kubernetes.io/name: openbao, app.kubernetes.io/component: security, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
data:
  # 왜 Vault 가 아니라 OpenBao 인가 (ADR-024 · ADR-079)
  #   HashiCorp Vault 는 2023년에 BUSL 1.1 로 바뀌어 오픈소스가 아니다.
  #   이 플랫폼의 목표가 "WSO2 Enterprise 를 OSS 로 대체" 이므로 시크릿
  #   계층에 비-OSS 를 두면 목표와 어긋난다. OpenBao 는 그 포크이며
  #   MPL-2.0 · Linux Foundation 이다. API 가 호환되어 전환 비용이 낮다.
  #
  # 단일 노드 · file 스토리지. Raft(integrated storage)는 3노드 이상에서
  # 의미가 있고 로컬 예산에서는 얻는 것이 없다.
  #
  # dev 모드가 아니다. 실제 봉인(seal) 상태로 뜨며 unseal 키가 필요하다.
  #   dev 모드는 메모리 저장이라 재시작마다 데이터가 사라지고 root token 이
  #   고정값이라 습관을 잘못 들인다.
  #   ★★ 이미지의 기본 CMD 가 `server -dev -dev-no-store-token` 이다
  #     (실측: podman inspect). StatefulSet 에서 args 를 반드시 덮을 것 —
  #     빠뜨리면 조용히 dev 모드로 떠서 "잘 되는 줄" 알게 된다.
  bao.hcl: |
    ui = true
    disable_mlock = true

    # ★ file 이 아니라 raft(integrated storage)다.
    #   단일 노드에서 raft 는 합의(consensus) 이득이 없지만 **스냅샷 API 가
    #   생긴다** — `bao operator raft snapshot save`. file 스토리지에는 그것이
    #   없어서 백업이 "PVC 를 통째로 복사" 뿐이고, RWO 볼륨은 쓰는 중에 다른
    #   파드가 마운트할 수 없어 온라인 백업이 성립하지 않는다.
    #   Vault Enterprise 의 DR Replication·자동 스냅샷 자리를 이것으로 채운다
    #   (WSO2-OSS-MAPPING.md 부록 A-2).
    #   ★★ 스토리지 backend 를 바꾸면 **재초기화**다(기존 데이터·unseal 키 무효).
    #     데이터가 0건일 때만 공짜다 — 나중에 바꾸려면 export/import 를 손으로 해야 한다.
    #   경로는 이미지가 선언한 볼륨을 그대로 쓴다(/openbao/file).
    storage "raft" {
      path    = "/openbao/file"
      node_id = "openbao-0"
    }

    listener "tcp" {
      address     = "0.0.0.0:8200"
      tls_disable = true
    }

    # ★ raft 는 cluster_addr 가 **다른 노드가 도달할 수 있는 주소**여야 한다.
    #   127.0.0.1 로 두면 단일 노드에서는 뜨지만 노드를 늘리는 순간 깨지고,
    #   그때는 이미 데이터가 있어 되돌리기 어렵다. 지금 StatefulSet DNS 로 둔다.
    api_addr     = "http://openbao-0.openbao-headless:8200"
    cluster_addr = "http://openbao-0.openbao-headless:8201"

    # 텔레메트리는 Prometheus 가 가져간다. 인증 없이 노출하지 않는다 —
    # /v1/sys/metrics 는 토큰을 요구하므로 스크레이프 설정은 별도 작업이다.
    telemetry {
      prometheus_retention_time = "24h"
      disable_hostname          = true
    }

    # ── 감사(audit) 장치 ──────────────────────────────────────────
    # ★★ OpenBao 2.4 는 **API 로 감사 장치를 켤 수 없다.** 실측:
    #     cannot enable audit device via API; use declarative,
    #     config-based audit device management instead
    #   Vault 와 다른 점이라 `bao audit enable` 을 쓰는 문서·스크립트를
    #   그대로 옮기면 400 으로 막힌다. 설정에 선언해야 한다.
    #
    # ★ 문법은 파서에 직접 물어 확정했다 — `type` 과 `path` 가 **둘 다**
    #   블록 안 속성이어야 한다(블록 라벨은 이름일 뿐이다):
    #     audit "stdout" { type=... }  -> "audit path must be specified"
    #     audit "file"   { file_path } -> "audit type must be specified"
    #
    # ★ 출력을 stdout 으로 보낸다. 컨테이너 로그 파이프라인(filebeat·OTel)이
    #   이미 Loki/Elasticsearch 로 나르므로 별도 배선이 필요 없다.
    #   Vault Enterprise 의 audit log filtering 자리를 이것으로 채운다 —
    #   필터·보존은 로그 스택이 한다(WSO2-OSS-MAPPING.md 부록 A-2).
    #
    # ★★ 감사 장치가 하나뿐인데 그 싱크가 막히면 **OpenBao 는 요청을 거부한다**
    #   (감사 기록 실패를 조용히 넘기지 않는 것이 설계다). stdout 은 막힐 일이
    #   사실상 없어 그 위험이 가장 낮은 선택이기도 하다.
    audit "stdout" {
      type = "file"
      path = "stdout"
      options = {
        file_path = "stdout"
      }
    }
