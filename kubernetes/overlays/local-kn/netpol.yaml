# `local` 과 같은 기준 — 기본 거부 + 메시 전송(HBONE 15008)만 넓게 열고 인가는 ztunnel 에 맡긴다(Gotcha 13).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  labels:
    app.kubernetes.io/name: default-deny-ingress
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-istio-hbone
  labels:
    app.kubernetes.io/name: allow-istio-hbone
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {port: 15008, protocol: TCP}
---
# knative-serving(메시 밖) -> 리비전 파드의 queue-proxy.
#   activator 가 요청을 대신 보내고(8012 http · 8013 h2c), autoscaler 가 지표를 긁는다(9090 · 9091),
#   상태 확인은 8022(queue-proxy admin). 앱 컨테이너 포트로는 열지 않는다 — 모든 트래픽은 queue-proxy 를 지난다.
# ★ 셀렉터는 matchExpressions — Knative 가 만드는 파드에는 오버레이 라벨이 없다(Gotcha 185).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-knative-serving-to-revisions
  labels:
    app.kubernetes.io/name: knative
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchExpressions:
      - {key: serving.knative.dev/revision, operator: Exists}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: kubernetes.io/metadata.name, operator: In, values: [knative-serving]}
      ports:
        - {port: 8012, protocol: TCP}
        - {port: 8013, protocol: TCP}
        - {port: 8022, protocol: TCP}
        - {port: 9090, protocol: TCP}
        - {port: 9091, protocol: TCP}
