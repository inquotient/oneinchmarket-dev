# ★ PSS 는 restricted 로 둔다 — `local`(privileged)과 달리 여기서 도는 것은 Knative 리비전 파드뿐이고,
#   config-features 의 secure-pod-defaults 가 사용자 컨테이너에 runAsNonRoot · drop ALL · RuntimeDefault ·
#   allowPrivilegeEscalation false 를 채운다(install-knative.sh). queue-proxy 도 그 기준을 지킨다.
# ★ ambient 에 넣는다 — 게이트웨이(신원 있는 프록시)가 HBONE 으로 붙고, Kafka 브로커의 데이터플레인이 메시 신원으로
#   구독자에게 배달한다.
apiVersion: v1
kind: Namespace
metadata:
  name: kn
  labels:
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    istio.io/dataplane-mode: ambient
