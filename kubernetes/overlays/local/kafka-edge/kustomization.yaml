# Kafka 의 바깥 가장자리 — local 전용 (2026-11-02 도입)
#
#   kroxylicious.yaml  Kafka 프로토콜 프록시. LAN 의 Kafka 클라이언트가 NodePort
#                      30992(bootstrap)·30993(broker 0)으로 붙는다
#   zilla.yaml         HTTP·SSE <-> Kafka. 게이트웨이 HTTPRoute(zilla 호스트) 뒤에 있다
#   authz.yaml         두 신원이 Kafka 9092 에 닿게 하는 **추가** ALLOW 정책
#
# ★★★ 둘은 같은 네임스페이스를 공유한다 — 실제 토픽 `edge.*`.
#   Kroxylicious 는 `MultiTenant` 필터로 가상 클러스터 이름(`edge`)을 접두사로
#   붙였다 뗀다. 외부 클라이언트가 보는 `events` 는 실제 `edge.events` 이고,
#   Zilla 가 HTTP POST 를 넣는 토픽이 바로 그것이다. 그래서 HTTP 로 넣은 이벤트를
#   Kafka 클라이언트가 읽고, 그 반대도 된다.
#
# ★★ 왜 가두는가: 이 클러스터의 Kafka 는 **인증 없는 PLAINTEXT** 다. 그대로
#   밖에 열면 LAN 의 누구나 과금 토픽(`api-usage`)을 읽고 쓴다(Gotcha 16·23).
#   ★ 같은 날 기존 구멍 셋도 막았다 — AKHQ 는 Keycloak 로그인(patches/akhq-local.yaml),
#     kafka-bridge 는 외부 경로를 걷고 메시 안에서도 등록한 신원만 받게
#     (base 의 allow-kafka-bridge), db-gateway 의 Kafka 9092 는 뺐다(이 디렉터리가
#     대신한다). AKHQ 의 `edge-via-kroxylicious` 연결이 이 디렉터리가 외부에
#     보여 주는 것을 그대로 보여 준다.
#
# ★ 한계(알고 고른 것):
#   - `MultiTenant` 는 상류가 **프리뷰**라 적은 필터다. 그래서 문서를 믿지 않고
#     "밖에서 api-usage 가 보이는가" 를 직접 시험했다(EXTERNAL-ACCESS §3-e).
#   - Kroxylicious 는 **인증이 없다** — `edge.*` 는 LAN 이 쓸 수 있다. 신뢰
#     경계는 LAN 이다(Gotcha 200). SASL(OAUTHBEARER·ACL)은 다음 단계다 —
#     이미지에 `kroxylicious-authorization`·`oauthbearer-validation` 이 들어 있다.
#   - Zilla 는 **Aklivity Community License**(source-available)다. OSI 오픈소스가
#     아니고 "Aklivity 제품과 경쟁하는 용도" 를 금한다. 사내 랩 용도로 고른 것이다.
#
# ★ local 전용인 이유: Kafka 를 클러스터 밖에 여는 것은 개발 랩의 결정이다
#   (db-gateway·external-access 와 같은 자리). 승격 조건 — prod 에서 외부
#   Kafka 접근이 필요해지면 **TLS + SASL** 이 먼저다. 평문 NodePort 는 안 된다.
#
# ★★★ `commonAnnotations` 를 두지 않는다 — 같은 키를 덮어쓴다(Gotcha 67).
#   wave 는 각 리소스에 직접 적었다(3: Kafka 가 wave 2 다).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - kroxylicious.yaml
  - zilla.yaml
  - authz.yaml
