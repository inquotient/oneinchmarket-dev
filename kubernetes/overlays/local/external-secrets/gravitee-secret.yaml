# gravitee-secret — 원천은 OpenBao 다(§8-82).
# ★ creationPolicy: Merge · dataFrom.extract — 키를 나열하지 않는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gravitee-secret
  labels:
    app.kubernetes.io/name: gravitee-secret
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: gravitee-secret
    creationPolicy: Merge
  dataFrom:
    - extract:
        key: gravitee-secret
