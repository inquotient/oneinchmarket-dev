# clickhouse-admin-secret — ClickHouse 관리자 oim_admin(2026-11-07, Gotcha 220). 원천은 OpenBao 다.
# ★ creationPolicy: Merge — 기존 Secret 을 소유하지 않고 키만 갱신한다.
#   ESO 나 OpenBao 가 내려가도 워크로드가 계속 돈다.
# ★ dataFrom.extract 는 KV 항목의 **모든 키**를 가져온다. 키를 하나씩
#   나열하면 나중에 키가 늘 때 조용히 빠진다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: clickhouse-admin-secret
  labels:
    app.kubernetes.io/name: clickhouse-admin-secret
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: openbao
    kind: ClusterSecretStore
  target:
    name: clickhouse-admin-secret
    creationPolicy: Merge
  dataFrom:
    - extract:
        key: clickhouse-admin-secret
