# ─────────────────────────────────────────────────────────────────────────
# zeek-ship — Zeek 의 JSON 로그를 Logstash(5141)로 흘린다
#
# ★★ 왜 zeek-capture 와 **다른 파드**인가 — capture 는 브리지를 들어야 해서
#   hostNetwork 이고, hostNetwork 파드는 **메시 밖이라 신원이 없다**(Gotcha 10).
#   한 파드에 합치면 전송 쪽까지 신원을 잃어 AuthorizationPolicy·NetworkPolicy 를
#   쓸 수 없다. 이쪽은 일반 파드로 두어 전용 SA 신원을 갖는다.
#
# ★★ `5141` 은 원래 **어디에서도 열려 있지 않았다.** base 의
#   `allow-logstash-access` 는 5044(filebeat)와 5140(ipBlock 10.77.0.0/24)만 연다.
#   L0 파이프라인이 죽어 있던 원인이 `kubectl port-forward` 만이 아니었던 것이다 —
#   직접 경로는 정책에서 막혀 있었다. 그래서 zeek-netpol.yaml 을 함께 둔다.
#
# ★ 스크립트는 `local/l0-lab/zeek/zeek-ship.py` 에서 왔고 두 곳만 고쳤다:
#   DEST 와 LOGDIR 을 환경변수로 뺐다(원본은 10.77.0.190:5141 하드코딩).
#   나머지(회전 감지·zeek_log 주입·재연결)는 그대로다.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zeek-ship
  labels:
    app.kubernetes.io/name: zeek-ship
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zeek-ship-script
  labels:
    app.kubernetes.io/name: zeek-ship
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
data:
  zeek-ship.py: |
    #!/usr/bin/env python3
    """Zeek JSON 로그를 Logstash 로 흘린다.

    왜 직접 만드나 — Filebeat 를 쓰면 Elastic 저장소를 하나 더 붙여야 하고,
    Zeek 의 JSON 에는 **어느 로그인지가 들어 있지 않다**(conn/dns/http 가
    같은 모양이다). 파일명을 아는 쪽에서 `zeek_log` 를 넣어 주는 편이 확실하다.

    ★ Zeek 는 로그를 회전시킨다(기본 1시간). 파일이 새로 만들어지면 inode 가
      바뀌므로 그것을 감지해 다시 연다. 감지하지 못하면 조용히 멈춘다 —
      이 랩에서 이미 한 번 겪은 실패 방식이다(§8-50 의 port-forward).
    """
    import json, os, socket, time, threading, sys

    LOGDIR = os.environ.get("LOGDIR", "/var/log/zeek")
    DEST = (os.environ.get("DEST_HOST", "logstash-headless"),
            int(os.environ.get("DEST_PORT", "5141")))
    WATCH = os.environ.get(
        "WATCH", "conn,dns,http,ssl,ntp,weird,notice,files").split(",")

    def sender(q, lock):
        sock = None
        while True:
            try:
                if sock is None:
                    sock = socket.create_connection(DEST, timeout=10)
                    print(f"[ship] 연결됨 {DEST[0]}:{DEST[1]}", flush=True)
                with lock:
                    batch, q[:] = q[:], []
                if not batch:
                    time.sleep(1)
                    continue
                sock.sendall("".join(batch).encode())
            except Exception as e:
                print(f"[ship] 전송 실패, 재연결: {e}", file=sys.stderr, flush=True)
                try:
                    sock.close()
                except Exception:
                    pass
                sock = None
                time.sleep(5)

    def tail(name, q, lock):
        path = os.path.join(LOGDIR, f"{name}.log")
        f, ino = None, None
        while True:
            try:
                st = os.stat(path)
                if f is None or st.st_ino != ino:
                    if f:
                        f.close()
                    f = open(path, "r")
                    f.seek(0, os.SEEK_END)
                    ino = st.st_ino
                    print(f"[tail] {name} 열림 (inode {ino})", flush=True)
            except FileNotFoundError:
                time.sleep(5)
                continue
            except PermissionError as e:
                print(f"[tail] {name} 권한 없음: {e}", file=sys.stderr, flush=True)
                time.sleep(30)
                continue
            line = f.readline()
            if not line:
                time.sleep(0.5)
                continue
            line = line.strip()
            if not line or not line.startswith("{"):
                continue
            try:
                rec = json.loads(line)
            except json.JSONDecodeError:
                continue
            rec["zeek_log"] = name
            with lock:
                q.append(json.dumps(rec) + "\n")

    def main():
        print(f"[ship] LOGDIR={LOGDIR} DEST={DEST} WATCH={WATCH}", flush=True)
        q, lock = [], threading.Lock()
        threading.Thread(target=sender, args=(q, lock), daemon=True).start()
        for n in WATCH:
            threading.Thread(target=tail, args=(n, q, lock), daemon=True).start()
        while True:
            time.sleep(3600)

    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zeek-ship
  labels:
    app.kubernetes.io/name: zeek-ship
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zeek-ship
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zeek-ship
        app.kubernetes.io/component: security
        app.kubernetes.io/part-of: oneinchmarket
        app.kubernetes.io/managed-by: kustomize
    spec:
      serviceAccountName: zeek-ship
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ship
          image: python:3.12-alpine
          command: ["python3", "-u", "/opt/ship/zeek-ship.py"]
          env:
            - {name: LOGDIR,    value: "/var/log/zeek"}
            - {name: DEST_HOST, value: "logstash-headless"}
            - {name: DEST_PORT, value: "5141"}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: script, mountPath: /opt/ship}
            # ★ 읽기 전용이다 — 이 파드는 로그를 만들지 않는다.
            - {name: logs, mountPath: /var/log/zeek, readOnly: true}
          resources:
            requests: {cpu: 20m, memory: 64Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: script
          configMap: {name: zeek-ship-script, defaultMode: 0555}
        - name: logs
          hostPath:
            path: /var/log/zeek
            type: DirectoryOrCreate
