apiVersion: v1
kind: Service
metadata:
  name: hadoop-datanode-headless
  labels: {app.kubernetes.io/name: hadoop-datanode, app.kubernetes.io/component: data-lakehouse, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  clusterIP: None
  # ★ 아직 준비되지 않은 파드도 DNS 에 노출한다.
  #   DataNode 는 NameNode 에 등록되어야 Ready 가 되는데, 등록하려면
  #   자기 호스트명이 풀려야 한다(dfs.datanode.use.datanode.hostname=true).
  #   기본값이면 서로를 기다리는 교착이 된다.
  publishNotReadyAddresses: true
  ports:
    - {name: data, port: 9866, targetPort: 9866, protocol: TCP}
    - {name: ipc, port: 9867, targetPort: 9867, protocol: TCP}
    - {name: http, port: 9864, targetPort: 9864, protocol: TCP}
  selector: {app.kubernetes.io/name: hadoop-datanode}
