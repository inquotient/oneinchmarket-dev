apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hadoop-namenode
  labels: {app.kubernetes.io/name: hadoop-namenode, app.kubernetes.io/component: data-lakehouse, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  serviceName: hadoop-namenode-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: hadoop-namenode}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hadoop-namenode, app.kubernetes.io/component: data-lakehouse, app.kubernetes.io/part-of: oneinchmarket}
    spec:
      serviceAccountName: hadoop
      # ★ 이 이미지는 `docker/` 에서 로컬 빌드해 GitLab 레지스트리에 올린다.
      #   파드 자체는 이 시크릿 없이도 뜬다 — build-images.sh 가 containerd 에
      #   같은 이름으로 반입하고 imagePullPolicy 가 IfNotPresent 라 당기지
      #   않기 때문이다. 이 시크릿이 필요한 것은 **Trivy Operator** 다:
      #   스캔 Job 은 파드라 노드의 containerd 를 볼 수 없어 레지스트리에서
      #   직접 당기고, 그때 워크로드의 imagePullSecrets 를 자기 네임스페이스로
      #   복사해 쓴다. 없으면 스캔이 조용히 실패한다 — §8-79
      imagePullSecrets:
        - name: gitlab-registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # ★ Ranger HDFS 플러그인 내려받기 (§8-67)
        #
        #   이미지(apache/hadoop:3.5.0)에 플러그인이 없다. 이미지를 다시 굽는
        #   대신 여기서 받아 공유 emptyDir 에 푼다 — 파드에서 egress 가 되는
        #   것을 확인했다(archive.apache.org 200).
        #
        #   ★ 클래스로더 구조: `ranger-hdfs-plugin-shim` 과
        #     `ranger-plugin-classloader` 가 클래스패스에 있고, 실제 구현은
        #     **같은 디렉터리의 `ranger-hdfs-plugin-impl/`** 에서 로드된다.
        #     둘의 상대 위치가 깨지면 ClassNotFound 로 NameNode 가 죽는다.
        - name: fetch-ranger-plugin
          # ★ 자체 빌드 이미지다 — local/build-images.sh 가 만든다.
          #   docker/ranger-hdfs-plugin/Dockerfile 이 Ranger 2.9.0 소스를 받아
          #   REST 클라이언트를 **Jersey 2 로 포팅해** 빌드한 뒤 /plugin 에 담는다.
          #   Hadoop 3.5 가 Jersey 1 구현을 걷어냈기 때문이다 — §8-68.
          #
          #   ★ 런타임에 Jersey jar 를 보충하는 우회를 되살리지 말 것.
          #     두 번 실패했다: jsr311-api 를 넣으면 javax.ws.rs 가 두 벌이 되어
          #     LinkageError, 구현만 넣으면 기동은 하는데 provider 초기화가 깨져
          #     정책 버전이 -1 에 머문다. 후자는 add-hadoop-authorization 폴백
          #     때문에 HDFS 가 멀쩡히 돌아 **인가만 조용히 사라진다.**
          #     판정은 파드 상태가 아니라 `Switched policy engine to [N]` 으로.
          image: gitlab-registry.local.svc.cluster.local:5050/oneinch/ranger-hdfs-plugin:2.9.0-jersey2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              # 예전에는 여기서 archive.apache.org 의 tarball 을 받았다. 이제
              # 이미지에 들어 있다 — 기동이 빨라지고 외부 의존이 사라진다.
              cp -r /plugin/. /ranger/
              echo "[ranger] 플러그인 배치 완료:"
              ls /ranger/
              # fail-closed: 포팅된 jar 가 실제로 들어왔는지 본다.
              test -f /ranger/ranger-hdfs-plugin-impl/ranger-plugins-common-2.9.0.jar
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits:   {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: ranger-plugin, mountPath: /ranger}
        - name: format-namenode
          image: apache/hadoop:3.5.0
          command: ["/bin/bash","-c"]
          args:
            - |
              set -euo pipefail
              if [ -d /hadoop/dfs/name/current ]; then
                echo "[format] 이미 포맷되어 있다 - 건너뛴다"
                exit 0
              fi
              echo "[format] NameNode 포맷"
              hdfs namenode -format -nonInteractive -force -clusterId oim-local
              echo "[format] 완료"
          env:
            - {name: HADOOP_CONF_DIR, value: /opt/hadoop/etc/hadoop}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 256Mi}
            limits:   {cpu: 500m, memory: 1Gi}
          volumeMounts:
            # DataNode 와 같은 이유로 한 단계 위에 건다(대칭을 맞춘다).
            - {name: data, mountPath: /hadoop/dfs}
            - {name: config, mountPath: /opt/hadoop/etc/hadoop/core-site.xml, subPath: core-site.xml}
            - {name: config, mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml, subPath: hdfs-site.xml}
      containers:
        - name: hadoop-namenode
          image: apache/hadoop:3.5.0
          command: ["hdfs", "namenode"]
          env:
            - {name: HADOOP_CONF_DIR, value: /opt/hadoop/etc/hadoop}
            - {name: HADOOP_LOG_DIR, value: /tmp/hadoop-logs}
            - {name: HDFS_NAMENODE_OPTS, value: "-Xms512m -Xmx512m"}
            # ★ 플러그인 jar 를 NameNode 클래스패스에 넣는다. 이것이 없으면
            #   hdfs-site.xml 의 authorizer 클래스를 못 찾아 NameNode 가
            #   ClassNotFoundException 으로 기동하지 못한다.
            #
            # ★★ `/ranger/*` 만으로는 부족하다 — 실측으로 NameNode 가 70분간
            #   CrashLoop 했다:
            #     Failed to instantiate audit destination
            #       org.apache.ranger.audit.destination.Log4JAuditDestination
            #     java.lang.ClassNotFoundException
            #   `*` 는 **그 디렉터리의 jar 만** 잡고 하위 디렉터리는 안 본다.
            #   구현체 23개가 `ranger-hdfs-plugin-impl/` 안에 있으므로 그쪽도
            #   함께 넣어야 한다. shim 만 올라가면 authorizer 는 적재되는데
            #   감사(audit) 초기화에서 죽는다 — 절반만 되는 상태라 더 헷갈린다.
            - {name: HADOOP_CLASSPATH, value: "/ranger/*:/ranger/ranger-hdfs-plugin-impl/*"}
          ports:
            - {containerPort: 8020, name: rpc, protocol: TCP}
            - {containerPort: 9870, name: http, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 768Mi}
            limits:   {cpu: "1",  memory: 1536Mi}
          startupProbe:
            httpGet: {path: /, port: http}
            failureThreshold: 40
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: rpc}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            # DataNode 와 같은 이유로 한 단계 위에 건다(대칭을 맞춘다).
            - {name: data, mountPath: /hadoop/dfs}
            - {name: config, mountPath: /opt/hadoop/etc/hadoop/core-site.xml, subPath: core-site.xml}
            - {name: config, mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml, subPath: hdfs-site.xml}
            - {name: ranger-plugin, mountPath: /ranger}
            - {name: ranger-config, mountPath: /opt/hadoop/etc/hadoop/ranger-hdfs-security.xml, subPath: ranger-hdfs-security.xml}
            - {name: ranger-config, mountPath: /opt/hadoop/etc/hadoop/ranger-hdfs-audit.xml, subPath: ranger-hdfs-audit.xml}
      volumes:
        - name: config
          configMap: {name: hadoop-config}
        - name: ranger-config
          configMap: {name: ranger-hdfs-config}
        # 플러그인 jar. 파드 수명과 같이 가며 재기동 때마다 다시 받는다.
        - name: ranger-plugin
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources: {requests: {storage: 20Gi}}
