apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hadoop-datanode
  labels: {app.kubernetes.io/name: hadoop-datanode, app.kubernetes.io/component: data-lakehouse, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  serviceName: hadoop-datanode-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: hadoop-datanode}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hadoop-datanode, app.kubernetes.io/component: data-lakehouse, app.kubernetes.io/part-of: oneinchmarket}
    spec:
      serviceAccountName: hadoop
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-namenode
          image: docker.io/library/busybox:1.38.0
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              echo "[wait] NameNode RPC(hadoop-namenode:8020)"
              until nc -z hadoop-namenode 8020; do sleep 3; done
              echo "[wait] 완료"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits:   {cpu: 100m, memory: 64Mi}
      containers:
        - name: hadoop-datanode
          image: docker.io/apache/hadoop:3.5.0
          command: ["hdfs", "datanode"]
          env:
            - {name: HADOOP_CONF_DIR, value: /opt/hadoop/etc/hadoop}
            - {name: HADOOP_LOG_DIR, value: /tmp/hadoop-logs}
            - {name: HDFS_DATANODE_OPTS, value: "-Xms512m -Xmx512m"}
          ports:
            - {containerPort: 9866, name: data, protocol: TCP}
            - {containerPort: 9867, name: ipc, protocol: TCP}
            - {containerPort: 9864, name: http, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 768Mi}
            limits:   {cpu: "1",  memory: 1536Mi}
          startupProbe:
            httpGet: {path: /, port: http}
            failureThreshold: 40
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: data}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            # ★ PVC 를 /hadoop/dfs/data 에 직접 걸면 안 된다.
            #   DataNode 는 데이터 디렉터리에 chmod(dfs.datanode.data.dir.perm,
            #   기본 700)를 거는데 마운트 루트는 root 소유라 uid 1000 이
            #   바꿀 수 없다:
            #     NativeIO$POSIX.chmod -> DiskChecker
            #     Too many failed volumes - valid: 0, configured: 1, failed: 1
            #   한 단계 위에 걸어 DataNode 가 자기 소유의 data/ 를 만들게 한다.
            - {name: data, mountPath: /hadoop/dfs}
            - {name: config, mountPath: /opt/hadoop/etc/hadoop/core-site.xml, subPath: core-site.xml}
            - {name: config, mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml, subPath: hdfs-site.xml}
      volumes:
        - name: config
          configMap: {name: hadoop-config}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources: {requests: {storage: 50Gi}}
