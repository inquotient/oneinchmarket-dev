# HDFS 최상위 디렉터리 준비.
#
# 갓 포맷한 HDFS 의 `/` 는 hadoop:supergroup 0755 다. 다른 사용자로 도는
# 서비스는 여기에 아무것도 못 쓴다 — 실제로 Hive 이미지에서 이렇게 막혔다:
#   mkdir: Permission denied: user=hive, access=WRITE,
#          inode="/":hadoop:supergroup:drwxr-xr-x
#
# ★ HDFS 는 uid 가 아니라 **사용자 이름**으로 권한을 본다. 컨테이너마다
#   uid 가 달라도(hbase 1001, hive 1000) 이름만 맞으면 된다.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hdfs-bootstrap
  labels:
    app.kubernetes.io/name: hdfs-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata:
  name: hdfs-bootstrap
  labels:
    app.kubernetes.io/name: hdfs-bootstrap
    app.kubernetes.io/component: bootstrap
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hdfs-bootstrap
        app.kubernetes.io/component: bootstrap
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      # ★ 전용 SA. ambient 에서 ServiceAccount 는 곧 신원이고, `default` 로
      #   도는 워크로드는 서로 구분되지 않아 정책을 쓸 수 없다(Gotcha 10).
      #   이 Job 은 **지금은 성공한다** — 목적지가 제한적인 ALLOW 정책에
      #   선택되지 않을 뿐이다. 그 정책에 워크로드가 하나 추가되는 순간
      #   함께 끊기고, 증상은 오류가 아니라 **무한 대기**다(Gotcha 19).
      #   고장난 뒤가 아니라 지금 준다 — §8-86
      serviceAccountName: hdfs-bootstrap
      restartPolicy: OnFailure
      priorityClassName: batch-low
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bootstrap
          # NameNode 와 같은 이미지를 쓴다. 그 안의 hadoop 사용자가 HDFS 슈퍼유저다.
          image: docker.io/apache/hadoop:3.5.0
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -uo pipefail
              export HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
              export HADOOP_CLIENT_OPTS="-Xmx256m"
              NN=hdfs://hadoop-namenode:8020

              echo "[hdfs-bootstrap] NameNode 대기"
              until hdfs dfs -ls "$NN/" >/dev/null 2>&1; do sleep 5; done

              # ★ hdfs dfs 는 호출마다 JVM 을 새로 띄운다 — 2026-11-06 실측으로
              #   limit 500m 에서 한 번에 10~15초였고, 디렉터리마다 세 번씩
              #   부르던 옛 판은 5분 14초가 걸렸다. 그래서 명령마다 경로를
              #   묶어 한 번만 부른다(mkdir·chown·chmod·stat 는 경로를 여럿 받는다).
              #   디렉터리:
              #     /hbase      hbase  755   HBase rootdir
              #     /warehouse  hive   755   Hive 가 HDFS 를 쓸 때의 위치(TODO-33)
              #     /tmp        hadoop 1777  스티키. 여러 사용자가 공유한다
              #     /user       hadoop 755
              #     /user/hive  hive   755   Tez 가 세션마다 hive-exec jar 를 올린다
              #       (hive.user.install.directory(기본 /user) + 사용자명). 없으면
              #       Hive 가 /user 에 mkdir 하다 Permission denied 로 TezTask 가 죽는다
              echo "[hdfs-bootstrap] 디렉터리"
              hdfs dfs -mkdir -p "$NN/hbase" "$NN/warehouse" "$NN/tmp" "$NN/user/hive" || exit 1
              hdfs dfs -chown hbase:supergroup  "$NN/hbase" || exit 1
              hdfs dfs -chown hive:supergroup   "$NN/warehouse" "$NN/user/hive" || exit 1
              hdfs dfs -chown hadoop:supergroup "$NN/tmp" "$NN/user" || exit 1
              hdfs dfs -chmod 755  "$NN/hbase" "$NN/warehouse" "$NN/user" "$NN/user/hive" || exit 1
              hdfs dfs -chmod 1777 "$NN/tmp" || exit 1

              echo "[hdfs-bootstrap] 검증"
              # 소유자·모드가 어긋나면 실패로 끝낸다 — 조용한 성공을 만들지 않는다.
              got=$(hdfs dfs -stat "%n %u %a" "$NN/hbase" "$NN/warehouse" "$NN/tmp" "$NN/user" "$NN/user/hive" 2>/dev/null)
              echo "$got"
              want=$(printf '%s\n' "hbase hbase 755" "warehouse hive 755" "tmp hadoop 1777" "user hadoop 755" "hive hive 755")
              if [ "$got" != "$want" ]; then
                echo "[hdfs-bootstrap] 실패 — 기대와 다르다"
                exit 1
              fi
              echo "[hdfs-bootstrap] 완료"
          env:
            - { name: HADOOP_CONF_DIR, value: /opt/hadoop/etc/hadoop }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            # cpu limit 은 JVM 기동 시간이다 — 같은 hdfs CLI 가 500m 에서 10~11초,
            #   2000m 에서 2.5초였다(2026-11-06 실측). requests 는 그대로라 예약은 늘지 않는다.
            limits:   { cpu: 2000m, memory: 512Mi }
          volumeMounts:
            - { name: config, mountPath: /opt/hadoop/etc/hadoop/core-site.xml, subPath: core-site.xml }
            - { name: config, mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml, subPath: hdfs-site.xml }
      volumes:
        - name: config
          configMap: { name: hadoop-config }
