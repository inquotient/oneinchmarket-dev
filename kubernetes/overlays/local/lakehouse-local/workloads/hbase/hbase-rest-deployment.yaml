# HBase REST 서버(Stargate) — Knox 의 WEBHBASE 가 요구한다
#
# ★ 왜 필요한가 (§8-66)
#   Knox 의 `WEBHBASE` 서비스는 **HBase REST 게이트웨이**를 대상으로 한다.
#   이 클러스터에는 마스터 UI(16010)와 RPC(16000)뿐이라 Knox 가 붙을 곳이
#   없었다. REST 는 별도 프로세스이며 HBase 배포에 자동으로 딸려 오지 않는다.
#
# ★ 무상태다
#   REST 서버는 ZooKeeper 를 통해 클러스터를 찾고 요청을 RPC 로 옮길 뿐
#   자체 상태가 없다. 그래서 StatefulSet 이 아니라 Deployment 이고 PVC 도 없다.
#   HA 등급으로는 **R**(복제만 하면 됨)이다 — 지금은 1이지만 늘려도 갈라지지
#   않는다.
#
# ★ 포트를 8085 로 둔 이유
#   HBase REST 기본값이 8080 인데 이 네임스페이스에 8080 이 이미 여럿 있다
#   (akhq · apicurio · trino · kafka-bridge · dependency-track …).
#   포트포워드할 때 헷갈리므로 8085 로 명시한다.
#   ★ 그런데 8085 는 REST **info 서버**의 기본값이기도 하다 — `--infoport` 를
#     함께 옮기지 않으면 두 리스너가 같은 포트를 잡아 기동하지 못한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hbase-rest
  labels: {app.kubernetes.io/name: hbase-rest, app.kubernetes.io/component: data-lakehouse, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: hbase-rest}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hbase-rest, app.kubernetes.io/component: data-lakehouse, app.kubernetes.io/part-of: oneinchmarket}
    spec:
      serviceAccountName: hbase
      # ★ 이 이미지는 `docker/` 에서 로컬 빌드해 GitLab 레지스트리에 올린다.
      #   파드 자체는 이 시크릿 없이도 뜬다 — build-images.sh 가 containerd 에
      #   같은 이름으로 반입하고 imagePullPolicy 가 IfNotPresent 라 당기지
      #   않기 때문이다. 이 시크릿이 필요한 것은 **Trivy Operator** 다:
      #   스캔 Job 은 파드라 노드의 containerd 를 볼 수 없어 레지스트리에서
      #   직접 당기고, 그때 워크로드의 imagePullSecrets 를 자기 네임스페이스로
      #   복사해 쓴다. 없으면 스캔이 조용히 실패한다 — §8-79
      imagePullSecrets:
        - name: gitlab-registry-secret
      securityContext:
        # 마스터와 같은 이미지라 uid 도 같다 — docker/hbase 가 1001 로 만든다.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-deps
          image: docker.io/library/busybox:1.38.0
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              echo "[wait] ZooKeeper"
              until nc -z zookeeper-headless 2181; do sleep 3; done
              echo "[wait] HBase Master RPC"
              until nc -z hbase-master 16000; do sleep 3; done
              echo "[wait] 완료"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits:   {cpu: 100m, memory: 64Mi}
      containers:
        - name: hbase-rest
          image: gitlab-registry.local.svc.cluster.local:5050/oneinch/hbase:3.0.0
          imagePullPolicy: IfNotPresent
          # foreground 로 띄운다 — 마스터와 같은 이유다.
          # ★ --infoport 를 반드시 함께 준다.
          #   `hbase.rest.port` 기본값은 8080 이고 **`hbase.rest.info.port`
          #   기본값이 8085** 다. `-p 8085` 만 주면 REST 본체와 info 서버가
          #   같은 포트를 잡아 기동하지 못한다(실측):
          #     java.io.IOException: Failed to bind to /0.0.0.0:8085
          #     Caused by: java.net.BindException: Address already in use
          command: ["hbase", "rest", "start", "-p", "8085", "--infoport", "8086"]
          env:
            - {name: HBASE_CONF_DIR, value: /opt/hbase/conf}
            - {name: HBASE_HEAPSIZE, value: "384m"}
            - {name: HBASE_REST_OPTS, value: "-XX:+UseContainerSupport"}
            # ★★ REST 는 Knox 사용자 이름을 쓰지 못한다 — 자기 계정으로만 돈다.
            #   Knox 는 `?user.name=<사용자>` 를 붙여 보내지만(gateway-audit.log 실측),
            #   HBase 3.0.0 의 RESTServer 는 사용자 식별 필터(AuthFilter)와
            #   RESTServletContainer 를 **Kerberos 가 켜졌을 때만** 붙인다
            #   (loginServerPrincipal). simple 인증에서는 그 값이 버려진다.
            #   그래서 이 프로세스를 `hbase`(마스터와 같은 전권 계정) 대신 **전용
            #   계정**으로 돌리고, 그 계정의 권한을 Ranger 가 정한다 —
            #   local/ranger-services/policies/oim-hbase-rest.json(읽기·쓰기만, DDL·admin 없음).
            #   누가 이 경로를 쓰는지는 Knox 의 AclsAuthz(webhbase.acl)가 거른다.
            #   ★ simple 인증의 UGI 는 이 변수로 로그인 사용자를 정한다. 지우면 다시
            #     `hbase` 가 되어 Knox 를 통과한 누구나 HBase 전권을 갖는다(2026-10-18 실측).
            #   ★ 이 계정에 항목이 없으면 Ranger 가 전부 거부해 readinessProbe
            #     (/version/cluster)도 실패한다 — ranger-bootstrap.sh 를 먼저 돌릴 것.
            - {name: HADOOP_USER_NAME, value: hbase-rest}
          ports:
            - {containerPort: 8085, name: rest, protocol: TCP}
            - {containerPort: 8086, name: rest-info, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits:   {cpu: 500m, memory: 768Mi}
          # REST 는 `/version/cluster` 로 클러스터에 실제로 닿았는지 답한다.
          # tcpSocket 이면 ZooKeeper 를 못 찾아도 Ready 가 된다 — §8-65 의 교훈.
          startupProbe:
            httpGet: {path: /version/cluster, port: rest}
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: rest}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /version/cluster, port: rest}
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - {name: hbase-config, mountPath: /opt/hbase/conf/hbase-site.xml, subPath: hbase-site.xml}
            - {name: hadoop-config, mountPath: /opt/hbase/conf/core-site.xml, subPath: core-site.xml}
            - {name: hadoop-config, mountPath: /opt/hbase/conf/hdfs-site.xml, subPath: hdfs-site.xml}
            - {name: tmp, mountPath: /opt/hbase/tmp}
      volumes:
        - name: hbase-config
          configMap: {name: hbase-config}
        - name: hadoop-config
          configMap: {name: hadoop-config}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: hbase-rest
  labels: {app.kubernetes.io/name: hbase-rest, app.kubernetes.io/component: data-lakehouse, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
spec:
  ports:
    - {name: rest, port: 8085, targetPort: 8085, protocol: TCP}
    - {name: rest-info, port: 8086, targetPort: 8086, protocol: TCP}
  selector: {app.kubernetes.io/name: hbase-rest}
