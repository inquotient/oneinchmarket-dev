apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hbase-master
  labels: {app.kubernetes.io/name: hbase-master, app.kubernetes.io/component: data-lakehouse, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
  annotations: {reloader.stakater.com/auto: "true"}
spec:
  serviceName: hbase-master
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: hbase-master}
  template:
    metadata:
      labels: {app.kubernetes.io/name: hbase-master, app.kubernetes.io/component: data-lakehouse, app.kubernetes.io/part-of: oneinchmarket}
    spec:
      serviceAccountName: hbase
      # ★ 이 이미지는 `docker/` 에서 로컬 빌드해 GitLab 레지스트리에 올린다.
      #   파드 자체는 이 시크릿 없이도 뜬다 — build-images.sh 가 containerd 에
      #   같은 이름으로 반입하고 imagePullPolicy 가 IfNotPresent 라 당기지
      #   않기 때문이다. 이 시크릿이 필요한 것은 **Trivy Operator** 다:
      #   스캔 Job 은 파드라 노드의 containerd 를 볼 수 없어 레지스트리에서
      #   직접 당기고, 그때 워크로드의 imagePullSecrets 를 자기 네임스페이스로
      #   복사해 쓴다. 없으면 스캔이 조용히 실패한다 — §8-79
      imagePullSecrets:
        - name: gitlab-registry-secret
      securityContext:
        # ★ 1001 이다. noble 베이스에 uid 1000 의 ubuntu 사용자가 이미 있어
        #   docker/hbase 가 hbase 를 1001 로 만든다.
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-deps
          image: busybox:1.38.0
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              echo "[wait] HDFS NameNode"
              until nc -z hadoop-namenode 8020; do sleep 3; done
              echo "[wait] ZooKeeper"
              until nc -z zookeeper-headless 2181; do sleep 3; done
              echo "[wait] 완료"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits:   {cpu: 100m, memory: 64Mi}
        # ★ Ranger HBase 플러그인 내려받기 (§8-67)
        #   HDFS 판과 같은 방식이다. regionserver 에도 **똑같이** 있어야 한다 —
        #   코프로세서는 양쪽 프로세스에 로드되고, 없으면 그쪽이 기동하지 못한다.
        - name: fetch-ranger-plugin
          # ★ 자체 빌드 이미지다 — local/build-images.sh 가 만든다.
          #   docker/ranger-hbase-plugin/Dockerfile 이 Ranger 2.9.0 소스를
          #   **HBase 3 API 로 이식해** 빌드한 뒤 /plugin 에 담는다 — §8-69.
          #   업스트림 tarball 을 그대로 쓰면 마스터가 ABORT 한다:
          #     NoClassDefFoundError: .../AccessControlProtos$AccessControlService$Interface
          image: gitlab-registry.local.svc.cluster.local:5050/oneinch/ranger-hbase-plugin:2.9.0-hbase3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              cp -r /plugin/. /ranger/
              echo "[ranger] 플러그인 배치 완료:"
              ls /ranger/
              # fail-closed: 이식된 jar 가 실제로 들어왔는지 본다.
              test -f /ranger/ranger-hbase-plugin-impl/ranger-hbase-plugin-2.9.0.jar
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: "1", memory: 768Mi}
          volumeMounts:
            - {name: ranger-plugin, mountPath: /ranger}
      containers:
        - name: hbase-master
          image: gitlab-registry.local.svc.cluster.local:5050/oneinch/hbase:3.0.0
          imagePullPolicy: IfNotPresent
          # foreground 로 띄운다. `hbase master start` 는 데몬화하지 않으므로
          # 컨테이너 수명과 프로세스 수명이 일치한다.
          command: ["hbase", "master", "start"]
          env:
            - {name: HBASE_CONF_DIR, value: /opt/hbase/conf}
            # ★ 힙은 여기서 준다. 이미지에 JAVA_TOOL_OPTIONS 를 박으면
            #   hbase shell 같은 보조 명령까지 같은 힙을 잡는다.
            - {name: HBASE_HEAPSIZE, value: "768m"}
            - {name: HBASE_MASTER_OPTS, value: "-XX:+UseContainerSupport"}
            # ★ Ranger 코프로세서 클래스패스 (§8-67). Java 의 `dir/*` 는
            #   **하위 디렉터리를 포함하지 않으므로** impl 을 따로 적어야 한다 —
            #   HDFS 에서 이것을 빠뜨려 NameNode 가 죽었다.
            - {name: HBASE_CLASSPATH, value: "/ranger/*:/ranger/ranger-hbase-plugin-impl/*"}
          ports:
            - {containerPort: 16000, name: rpc, protocol: TCP}
            - {containerPort: 16010, name: info, protocol: TCP}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 100m, memory: 768Mi}
            limits:   {cpu: "1",  memory: 1280Mi}
          startupProbe:
            httpGet: {path: /master-status, port: info}
            failureThreshold: 60
            periodSeconds: 5
          livenessProbe:
            tcpSocket: {port: rpc}
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /master-status, port: info}
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - {name: hbase-config, mountPath: /opt/hbase/conf/hbase-site.xml, subPath: hbase-site.xml}
            # HDFS 접근에 필요하다. HBase 는 HBASE_CONF_DIR 에서 하둡 설정도 읽는다.
            - {name: hadoop-config, mountPath: /opt/hbase/conf/core-site.xml, subPath: core-site.xml}
            - {name: hadoop-config, mountPath: /opt/hbase/conf/hdfs-site.xml, subPath: hdfs-site.xml}
            - {name: tmp, mountPath: /opt/hbase/tmp}
            # Ranger 플러그인 jar 와 설정 (§8-67)
            - {name: ranger-plugin, mountPath: /ranger}
            - {name: ranger-config, mountPath: /opt/hbase/conf/ranger-hbase-security.xml, subPath: ranger-hbase-security.xml}
            - {name: ranger-config, mountPath: /opt/hbase/conf/ranger-hbase-audit.xml, subPath: ranger-hbase-audit.xml}
      volumes:
        - name: hbase-config
          configMap: {name: hbase-config}
        - name: hadoop-config
          configMap: {name: hadoop-config}
        - name: ranger-config
          configMap: {name: ranger-hbase-config}
        # initContainer 가 받아 채운다. 이미지 재빌드를 피하려는 것이고,
        # 파드가 죽으면 다시 받는다.
        - name: ranger-plugin
          emptyDir: {}
        - name: tmp
          emptyDir: {}
