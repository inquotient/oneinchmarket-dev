apiVersion: v1
kind: ConfigMap
metadata:
  name: hbase-config
  labels: {app.kubernetes.io/name: hbase, app.kubernetes.io/component: data-lakehouse, app.kubernetes.io/part-of: oneinchmarket, app.kubernetes.io/managed-by: kustomize}
data:
  # HBase 는 HDFS 위에 산다. ZooKeeper 는 마스터 선출·메타 위치에 쓴다.
  # 둘 다 5단계 1/3 에서 올렸다(§8-14).
  hbase-site.xml: |
    <?xml version="1.0"?>
    <configuration>
      <property>
        <name>hbase.rootdir</name>
        <value>hdfs://hadoop-namenode:8020/hbase</value>
      </property>
      <property>
        <name>hbase.cluster.distributed</name>
        <value>true</value>
      </property>

      <property>
        <name>hbase.zookeeper.quorum</name>
        <value>zookeeper-headless</value>
      </property>
      <property>
        <name>hbase.zookeeper.property.clientPort</name>
        <value>2181</value>
      </property>
      <!-- ZooKeeper 는 HBase 전용이지만 znode 를 명시해 둔다. -->
      <property>
        <name>zookeeper.znode.parent</name>
        <value>/hbase</value>
      </property>

      <!-- ★ 컨테이너 안에서는 파드 IP 로만 바인드된다. 0.0.0.0 을 명시한다. -->
      <property>
        <name>hbase.master.ipc.address</name>
        <value>0.0.0.0</value>
      </property>
      <property>
        <name>hbase.regionserver.ipc.address</name>
        <value>0.0.0.0</value>
      </property>
      <property>
        <name>hbase.master.info.bindAddress</name>
        <value>0.0.0.0</value>
      </property>
      <property>
        <name>hbase.regionserver.info.bindAddress</name>
        <value>0.0.0.0</value>
      </property>

      <property>
        <name>hbase.tmp.dir</name>
        <value>/opt/hbase/tmp</value>
      </property>

      <!-- HDFS 는 hflush/hsync 를 지원한다. 강제 검사를 켜 둔다 —
           로컬 파일시스템을 rootdir 로 잘못 쓰는 실수를 여기서 잡는다. -->
      <property>
        <name>hbase.unsafe.stream.capability.enforce</name>
        <value>true</value>
      </property>

      <!-- 단일 RegionServer. 기본 3은 시작을 기다리게만 만든다. -->
      <property>
        <name>hbase.master.wait.on.regionservers.mintostart</name>
        <value>1</value>
      </property>

      <!-- ★★ HBase 3 은 클라이언트의 접속점 탐색 기본값을 바꿨다 (§8-69)
           2.x 는 ZooKeeper 로 마스터를 찾았지만 3.0 은 RpcConnectionRegistry 가
           기본이고, 부트스트랩 주소를 주지 않으면 클라이언트가 **자기 자신**을
           마스터로 여겨 붙으려 한다. 실측 — hbase-rest 가 이랬다:
             Connection refused: hbase-rest-64cc979f9f-bbxq9/10.0.0.19:16000
           마스터·리전서버는 멀쩡한데 **클라이언트만** 못 붙어서, HBase 는
           정상인데 REST 만 Ready 가 안 되는 형태로 나타난다. -->
      <property>
        <name>hbase.masters</name>
        <value>hbase-master:16000</value>
      </property>
      <property>
        <name>hbase.client.bootstrap.servers</name>
        <value>hbase-master:16000</value>
      </property>

      <!-- ── Ranger 인가 (§8-67) ──────────────────────────────────
           HDFS 는 NameNode 의 INode attribute provider 로 걸었지만 HBase 의
           강제 지점은 **코프로세서**다. master 와 regionserver 양쪽에
           로드되며, 클래스를 못 찾으면 **그 프로세스가 기동하지 못한다** —
           즉 jar 를 한쪽에만 넣으면 HBase 가 통째로 내려간다.
           이 ConfigMap 은 hbase-rest 도 함께 마운트하므로 영향 범위는
           master·regionserver·rest 셋이다.

           ★ regionserver.classes 까지 세 자리를 모두 채운다. region 만
             채우면 RegionServer 수준 작업이 통제 밖에 남는다. -->
      <property>
        <name>hbase.security.authorization</name>
        <value>true</value>
      </property>
      <property>
        <name>hbase.coprocessor.master.classes</name>
        <value>org.apache.ranger.authorization.hbase.RangerAuthorizationCoprocessor</value>
      </property>
      <property>
        <name>hbase.coprocessor.region.classes</name>
        <value>org.apache.ranger.authorization.hbase.RangerAuthorizationCoprocessor</value>
      </property>
      <property>
        <name>hbase.coprocessor.regionserver.classes</name>
        <value>org.apache.ranger.authorization.hbase.RangerAuthorizationCoprocessor</value>
      </property>
    </configuration>
