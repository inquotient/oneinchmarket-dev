apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hive-server
  labels:
    app.kubernetes.io/name: hive-server
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: hive-server-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: hive-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hive-server
        app.kubernetes.io/component: data-lakehouse
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: hive-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # ★ Ranger Hive 플러그인 (§8-70)
        #   자체 빌드 이미지다 — local/build-images.sh 가 만든다.
        #   docker/ranger-hive-plugin/Dockerfile 이 Ranger 2.9.0 소스를 Hive 4 로
        #   백포트해 빌드한다. 업스트림 2.9 판을 그대로 쓰면 HiveServer2 가
        #   기동하지 못한다:
        #     NoSuchFieldError: PREEXECHOOKS
        #   ★ 그 실패는 알아보기 어렵다 — HiveServer2 는 예외를 stdout 에 내지
        #     않고 /tmp/hive/hive.log 에만 쓴다. `kubectl logs` 에는
        #     "Hive Session ID = ..." 만 반복되고 파드는 startupProbe 예산을
        #     넘겨 조용히 kill 된다.
        - name: fetch-ranger-plugin
          image: oneinch/ranger-hive-plugin:2.9.0-hive4
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh","-c"]
          args:
            - |
              set -eu
              cp -r /plugin/. /ranger/
              echo "[ranger] 플러그인 배치 완료:"
              ls /ranger/
              # fail-closed: 백포트된 jar 가 실제로 들어왔는지 본다.
              test -f /ranger/ranger-hive-plugin-impl/ranger-hive-plugin-2.9.0.jar
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits:   {cpu: 200m, memory: 128Mi}
          volumeMounts:
            - {name: ranger-plugin, mountPath: /ranger}
      containers:
        - name: hive-server
          image: apache/hive:4.2.1
          ports:
            - containerPort: 10000
              name: thrift
              protocol: TCP
            # ★ HTTP transport 포트(§8-66). `hive.server2.transport.mode=http`
            #   로 바꾸면 HiveServer2 는 **10000 을 더 이상 열지 않고** 이쪽만
            #   연다. probe 도 함께 옮겨야 한다 — 안 그러면 영원히 0/1 이다.
            - containerPort: 10001
              name: http-thrift
              protocol: TCP
            - containerPort: 10002
              name: web
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: hiveserver2
            # ★ entrypoint 는 IS_RESUME 이 없으면 무조건
            #   `schematool -dbType derby -initOrUpgradeSchema` 를 실행하고
            #   실패 시 exit 1 한다. 스키마 소유자는 hive-metastore 이므로
            #   HiveServer2 에서는 반드시 건너뛴다.
            - name: IS_RESUME
              value: "true"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: root-password
            # HDFS 접근 주체. NameNode 는 simple 인증이라 이 값이 곧 사용자다.
            # hdfs-bootstrap 이 /warehouse 를 hive 소유로 만들어 두었다.
            - name: HADOOP_USER_NAME
              value: hive
            # ★ S3A 클래스패스.
            #   hadoop-aws 와 AWS SDK 는 share/hadoop/tools/lib 에 있고 이 경로는
            #   Hadoop 기본 클래스패스에 없다. 넣지 않으면 s3a:// 경로를 해석하는
            #   순간 ClassNotFoundException: S3AFileSystem 으로 DDL 이 실패한다.
            #   (hive-site.xml 에 fs.s3a.impl 을 적어둬도 클래스가 없으면 무의미하다)
            #   entrypoint 가 앞에 $TEZ_HOME/* 를 붙이므로 이 값은 뒤에 이어진다.
            #   와일드카드 대신 두 jar 만 지정한다 — tools/lib 전체는 azure·gcs 등
            #   쓰지 않는 커넥터와 중복 SDK 를 함께 끌어온다.
            #
            # ★ Ranger 플러그인도 여기로 넣는다(§8-70). Java 의 `dir/*` 는
            #   **하위 디렉터리를 포함하지 않으므로** impl 디렉터리를 따로
            #   적어야 한다 — HDFS 에서 이것을 빠뜨려 NameNode 가 죽었다(§8-67).
            - name: HADOOP_CLASSPATH
              value: /opt/hadoop/share/hadoop/tools/lib/hadoop-aws-3.3.6.jar:/opt/hadoop/share/hadoop/tools/lib/aws-java-sdk-bundle-1.12.367.jar:/ranger/*:/ranger/ranger-hive-plugin-impl/*
            # Tez 로컬 모드는 DAG 를 이 JVM 안에서 돌린다. entrypoint 가
            # HADOOP_CLIENT_OPTS 에 -Xmx1G 를 먼저 붙이므로 여기서 늘린다.
            - name: SERVICE_OPTS
              value: "-Xmx1536m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 2560Mi
          # 메타스토어 접속 + Tez 초기화까지 2~3분 걸린다.
          startupProbe:
            tcpSocket:
              port: http-thrift
            failureThreshold: 40
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http-thrift
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 6
          readinessProbe:
            tcpSocket:
              port: http-thrift
            periodSeconds: 15
            timeoutSeconds: 10
          volumeMounts:
            - name: hive-config
              mountPath: /opt/hive/conf/hive-site.xml
              subPath: hive-site.xml
            - name: tmp
              mountPath: /tmp
            # Ranger 플러그인 jar 와 설정 (§8-70)
            - name: ranger-plugin
              mountPath: /ranger
            - name: ranger-config
              mountPath: /opt/hive/conf/ranger-hive-security.xml
              subPath: ranger-hive-security.xml
            - name: ranger-config
              mountPath: /opt/hive/conf/ranger-hive-audit.xml
              subPath: ranger-hive-audit.xml
      volumes:
        - name: hive-config
          configMap:
            name: hive-server-config
            items:
              - key: hive-site.xml
                path: hive-site.xml
        - name: ranger-config
          configMap:
            name: ranger-hive-config
        # initContainer 가 이미지에서 복사해 채운다.
        - name: ranger-plugin
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
