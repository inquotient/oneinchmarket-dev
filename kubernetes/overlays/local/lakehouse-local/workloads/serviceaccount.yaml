# hive-server 의 ServiceAccount.
# base/serviceaccounts/serviceaccounts.yaml 에서 옮겨 왔다 — 워크로드가
# local 오버레이에만 있으므로 SA 도 함께 있어야 짝이 맞는다.
#
# hadoop·hbase·zookeeper 의 SA 는 각자의 service 매니페스트 안에 함께
# 정의되어 있어 별도로 옮길 것이 없다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hive-server
  labels:
    app.kubernetes.io/name: hive-server
    app.kubernetes.io/component: data-lakehouse
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
