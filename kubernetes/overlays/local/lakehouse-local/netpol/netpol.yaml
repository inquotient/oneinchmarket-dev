# 5단계 레이크하우스(로컬 전용)의 대상 NetworkPolicy.
#
# base/network-policies/data-lakehouse-netpol.yaml 에서 옮겨 왔다 —
# 여기 정책들이 고르는 워크로드가 local 오버레이에만 존재하기 때문이다.
# 남은 base 정책들은 이 워크로드를 이름으로 참조하지 않는다
# (component: data-lakehouse 라벨로 고른다).
# 5단계 — HDFS · ZooKeeper.
#
# ★ DataNode 는 NameNode 와 **양방향**으로 통신한다. 등록·하트비트는
#   DataNode -> NameNode 지만, 블록 명령은 NameNode -> DataNode 다.
#   한쪽만 열면 등록은 되는데 블록이 안 움직인다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hadoop-namenode-access
  labels:
    app.kubernetes.io/name: allow-hadoop-namenode-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hadoop-namenode
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: hadoop-datanode}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-master}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-regionserver}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hive-metastore}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hive-server}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: trino}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: spark-connect}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: spark-history}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: livy}}
        # ★ Knox 가 WebHDFS 를 프록시한다(§8-66). 이 줄이 없으면
        #   default-deny-ingress 에 막혀 Knox 가 502 를 돌려준다.
        - podSelector: {matchLabels: {app.kubernetes.io/name: knox}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
      ports:
        - { protocol: TCP, port: 8020 }
        - { protocol: TCP, port: 9870 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hadoop-datanode-access
  labels:
    app.kubernetes.io/name: allow-hadoop-datanode-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hadoop-datanode
  policyTypes: [Ingress]
  ingress:
    # NameNode 가 블록 명령을 보낸다. 클라이언트는 블록을 직접 읽고 쓴다.
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: hadoop-namenode}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-master}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-regionserver}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hive-metastore}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hive-server}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: trino}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: spark-connect}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: spark-history}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: livy}}
      ports:
        - { protocol: TCP, port: 9866 }
        - { protocol: TCP, port: 9867 }
        - { protocol: TCP, port: 9864 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-zookeeper-access
  labels:
    app.kubernetes.io/name: allow-zookeeper-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zookeeper
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-master}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-regionserver}}
      ports:
        - { protocol: TCP, port: 2181 }
---
# 5단계 2/3 — HBase.
#
# ★ 마스터와 RegionServer 는 **양방향**이다. RegionServer 가 마스터에
#   등록(16000)하고, 마스터는 region 배정 명령을 RegionServer(16020)로 보낸다.
#   한쪽만 열면 등록은 되는데 region 이 배정되지 않는다.
#   (HDFS NameNode↔DataNode 와 같은 구조다.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hbase-master-access
  labels:
    app.kubernetes.io/name: allow-hbase-master-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hbase-master
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-regionserver}}
        # 클라이언트. Trino·Spark 가 HBase 커넥터를 쓰게 되면 여기로 들어온다.
        - podSelector: {matchLabels: {app.kubernetes.io/name: trino}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: spark-connect}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: livy}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hive-server}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
      ports:
        - { protocol: TCP, port: 16000 }
        - { protocol: TCP, port: 16010 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hbase-regionserver-access
  labels:
    app.kubernetes.io/name: allow-hbase-regionserver-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hbase-regionserver
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: hbase-master}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: trino}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: spark-connect}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: livy}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: hive-server}}
        - podSelector: {matchLabels: {app.kubernetes.io/name: nginx}}
      ports:
        - { protocol: TCP, port: 16020 }
        - { protocol: TCP, port: 16030 }
---
# HiveServer2 — JDBC(10000) · WebUI(10002).
# 클라이언트는 레이크하우스 내부(beeline·Trino)와 애플리케이션 계층이다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hive-server-access
  labels:
    app.kubernetes.io/name: allow-hive-server-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hive-server
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: data-lakehouse
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: application
        # ★ Knox 가 HiveServer2 를 프록시한다(§8-66). governance 컴포넌트라
        #   위의 data-lakehouse·application 셀렉터에 걸리지 않는다.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: knox
      ports:
        - protocol: TCP
          port: 10000
        # ★ HTTP transport 포트. 이 줄이 없으면 Knox 가 502 를 돌려준다.
        - protocol: TCP
          port: 10001
        - protocol: TCP
          port: 10002
---
# 5단계 — hdfs-bootstrap 이 최상위 디렉터리를 만든다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bootstrap-to-hdfs
  labels:
    app.kubernetes.io/name: allow-bootstrap-to-hdfs
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [hadoop-namenode, hadoop-datanode]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: bootstrap
      ports:
        - { protocol: TCP, port: 8020 }
        - { protocol: TCP, port: 9866 }
        - { protocol: TCP, port: 9867 }
---
# HBase REST(Stargate) — Knox 만 부른다(§8-66)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hbase-rest-access
  labels:
    app.kubernetes.io/name: allow-hbase-rest-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: hbase-rest
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: knox
      ports:
        - protocol: TCP
          port: 8085
