apiVersion: v1
kind: Namespace
metadata:
  name: local
  labels:
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
    # dev 와 동일. Falco/Tetragon·Filebeat·GitLab 이 restricted 에서 admit 되지 않는다 (TODO-13)
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    # ★ 네임스페이스 전면 ambient 편입(2026-09-04, §8-47). 이 라벨 하나로 모든
    #   파드가 ztunnel 에 포착되고 워크로드 간 통신이 mTLS 로 바뀐다.
    #   파드 재시작은 필요 없다 — istio-cni 가 기존 파드도 리다이렉트한다.
    #
    #   ★★ 전제 — 이 라벨을 붙이는 순간 service-mesh/authorization-policies.yaml
    #     의 ALLOW 정책이 **강제되기 시작한다.** 매칭되지 않는 통신은 전부
    #     거부된다. 증상은 타임아웃이 아니라 connection reset 이다.
    #     **정책을 먼저 맞추고 그 다음에 편입할 것.**
    #
    #   ★ §8-39·§8-40·§8-45 에서 세 번 실패하고 되돌렸다. 그때마다 15개 안팎의
    #     파드가 무너져 OpenReplay·프로브·NetworkPolicy 를 의심했는데 전부
    #     빗나갔다. 실제 원인은 AuthorizationPolicy 의 principal 26곳이
    #     `cluster.local/ns/*/sa/<name>` 이었던 것이다 — Istio 는 중간 `*` 를
    #     리터럴로 읽으므로 **어떤 규칙도 매칭된 적이 없었다.** 편입 전에는
    #     강제되지 않아 드러나지 않았을 뿐이다(§8-47).
    #
    #   ★ 되돌리기가 편입보다 더 넓게 흔든다. 레이블을 지웠을 때 Ready 가 43
    #     까지 떨어졌다(코어까지 readiness 상실, 3분 뒤 자력 회복). "되돌릴 수
    #     있다" 가 "되돌리는 것이 무해하다" 를 뜻하지 않는다.
    #
    #   ★ elastic-system 도 함께 편입해야 한다. ECK 오퍼레이터가 ES 9200 을
    #     관리하는데 메시 밖이면 신원이 없어 principal 규칙에 걸리지 않는다.
    #     그 네임스페이스는 이 오버레이가 만들지 않으므로 install-operators.sh
    #     또는 수동으로 라벨을 건다.
    istio.io/dataplane-mode: ambient
