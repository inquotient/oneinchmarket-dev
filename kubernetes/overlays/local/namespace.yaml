apiVersion: v1
kind: Namespace
metadata:
  name: local
  labels:
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
    # dev 와 동일. Falco/Tetragon·Filebeat·GitLab 이 restricted 에서 admit 되지 않는다 (TODO-13)
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: baseline
    pod-security.kubernetes.io/warn: baseline
    # ★ ambient 편입을 시도했다가 되돌렸다 — istio.io/dataplane-mode 를 넣지 않는다.
    #
    #   동기는 §8-38 이었다. 경로마다 TLS 를 붙이는 방식이 각각 벽에 부딪혀서
    #   (LDAP 은 DS389 인증서의 SAN 이 하나이고 네임스페이스가 박혀 있고,
    #   Kafka 는 PLAINTEXT 리스너뿐이라 모든 클라이언트를 함께 고쳐야 한다),
    #   ambient 로 한 번에 덮으려 했다. PeerAuthentication 이 PERMISSIVE 라
    #   비파괴적일 것으로 판단했다.
    #
    #   ★ 실측 결과 그렇지 않았다(2026-09-04, §8-39).
    #     편입 직후 OpenReplay 파드 9개가 `i/o timeout` 으로 무너졌다
    #     (Ready 79 → 70). Kafka 를 많이 쓰는 수집 계층이다.
    #
    #   ★★ 더 중요한 것은 **되돌리기가 편입보다 더 넓게 흔들었다**는 점이다.
    #      레이블을 지우자 Ready 가 43 까지 떨어졌다 — 코어(postgresql·minio·
    #      mariadb·keycloak·vault 등)까지 readiness 를 잃었다. 3분 뒤 자력으로
    #      79/79 로 회복했으나, **"되돌릴 수 있다" 가 "되돌리는 것이 무해하다"
    #      를 뜻하지 않는다.**
    #
    #   다시 시도한다면 네임스페이스 전체가 아니라 파드 단위
    #   (istio.io/dataplane-mode 를 파드 레이블로)로 좁혀 OpenReplay 를
    #   제외한 채 들어가야 한다.
