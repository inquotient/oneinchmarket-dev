# OneinchMarket v2 - Local Overlay (WSL2 단일 노드 k3s)
#
# B안 — 설계 전 구성요소를 zram 압축 스왑으로 수용한다.
# 산정: docs/LOCAL-DEPLOYMENT.md
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: local

resources:
  - namespace.yaml
  - ../../base
  # ★ 5단계 레이크하우스는 로컬 전용이다 — 단일 노드 전제가 매니페스트에
  #   박혀 있어 base 에 두면 dev/prod 가 그대로 상속한다. 승격 조건은
  #   lakehouse-local/kustomization.yaml 머리말 참조.
  - lakehouse-local
  # OpenReplay - 세션 리플레이(ADR-069). 생성 파일이며 전제 2건이 미해결이라
  #   브라우저 데이터는 아직 들어오지 않는다.
  - openreplay
  - openmeter
  # GitLab CI 러너 — 이것이 없어서 파이프라인 10건이 한 번도 실행되지
  #   않았다(§8-88). 인-클러스터 GitLab 전용이라 base 가 아니다.
  - gitlab-runner
  # Caldera — ADR-030 이 prod 배포를 금지한다. base 에 두면 prod 가 상속한다.
  - caldera
  # BuildKit — prod 에서는 Kyverno Enforce 에 거부된다(Gotcha 149)
  - buildkit
  # Gravitee 공존 경로 — ADR-079 미결이라 base 에 두지 않는다
  # L0 랩 관측 계층 — Zeek 을 VM 에서 파드로(§24-4). `zeek-capture` 가
  #   hostNetwork + NET_ADMIN 이라 base 에 두면 prod 가 그 권한을 상속한다.
  - l0-observers
  # OpenBao 로 원천이 옮겨진 시크릿의 ExternalSecret (§8-82).
  #   이관이 끝난 것만 들어 있다 — 나머지는 create-secrets.sh 가 원천이다.
  - external-secrets
  # 외부 접속 계층 — HTTPRoute 56종 · db-gateway(TCP) · 추가 인가 ·
  #   TLS 오리지네이션 · NetworkPolicy. **local 전용**이다: 호스트명 체계와
  #   DB 의 외부 TCP 노출은 개발 랩의 결정이고 prod 는 공인 DNS·베스션이어야
  #   한다. 노드 쪽 전제(443 DNAT·와일드카드 DNS·VPN)는 매니페스트로 담을 수
  #   없어 `local/external-access-node.sh` 가 넣는다.
  - external-access

patches:
  # 로컬 레플리카 1
  - path: patches/replicas-local.yaml
  # ★ zram 제어 — 스왑 불가 8종을 Guaranteed 로 고정
  - path: patches/qos-guaranteed.yaml
  - path: patches/kafka-local.yaml
  - path: patches/nginx-local.yaml
  # ★ 메모리 limits 정리 — 3단계 종료 시 limits 합이 98% 였다
  - path: patches/limits-local.yaml
  # ★ requests 실측 정정 — 7단계 종료 시 예약 80% 대 실사용 46%.
  #   양방향이다: 5건은 예약이 실사용보다 적어 축출 1순위였다.
  - path: patches/requests-local.yaml
  # 경합이 늘면서 기동이 느려진 워크로드의 startup 예산 확대
  - path: patches/probes-local.yaml
  # ★ 브라우저가 부르는 주소를 **외부 진입점** 기준으로 덮는다(SPA 넷 + CORS 하나).
  #   2026-10-11 에 apicurio-ui-local.yaml 을 이것으로 합쳤다 — 그 파일의
  #   주석이 "진입점이 생기면 실제 외부 URL 로 바꾼다" 고 적어 둔 조건이
  #   충족됐고, 같은 성질의 값을 한 곳에 모아 둔다.
  - path: patches/external-urls-local.yaml

  # ★★★ 게이트웨이 파드에 `environment: local` 을 붙인다 — 라벨 변환기가
  #   Service 의 selector 에도 그 라벨을 주입하는데 그 파드는 Istio 컨트롤러가
  #   만들어서 라벨이 없다. 그대로 두면 externalIPs Service 가 **아무것도
  #   선택하지 않아 443 이 전부 000** 이다(실측). 자세한 것은 그 패치 머리말.
  - path: patches/gateway-labels-local.yaml

  # cmmn-api 의 테이블을 Hibernate 가 만들게 한다 — local 전용 스톱갓(§8-99)
  - path: patches/cmmn-api-schema-local.yaml

  # ★★★ databases-migrate 를 PreSync -> Sync 로 (2026-10-05)
  #   상류 차트의 helm 훅이 PreSync 로 해석되는데 그 Job 은 wave 1 의
  #   DB 를 필요로 한다 — 처음 세우는 클러스터에서 **성립할 수 없고**
  #   PreSync 훅이 실패하면 ArgoCD 가 작업 전체를 중단한다(실측 1/573).
  #   자세한 측정 기록은 그 패치 파일 머리말에 있다.
  - path: patches/openreplay-migrate-hook-local.yaml

  # ★★★ MongoDB 8.0 이 이 노드의 커널(7.0.0-38)에서 기동을 거부한다
  #   — SERVER-121912. 7.0 LTS 로 내린다. 측정 기록과 복귀 조건은
  #   그 패치 파일 머리말에 있다. base 를 고치지 않는 이유도 거기 있다.
  - path: patches/mongodb-local.yaml

  # ★ Elasticsearch·Kibana 패치를 걷어냈다(2026-09-11) — base 에서 그
  #   리소스를 지웠기 때문이다(WSO2-OSS-MAPPING 9-1). **패치는 대상이
  #   사라지면 렌더 자체를 실패시킨다**:
  #     error: no resource matches strategic merge patch ...
  #   base 에서 무엇을 지울 때는 그것을 패치하는 오버레이를 함께 찾을 것.

commonLabels:
  environment: local

commonAnnotations:
  app.kubernetes.io/instance: oneinchmarket-local
