# Knative 의 cluster-local 진입점(net-gateway-api 의 config-gateway `local-gateways` 가 가리킨다).
# ★ ClusterIP — 밖으로 내지 않는다. 외부 노출은 기존 `ingress` 게이트웨이가 한다.
# ★ 게이트웨이 파드는 ztunnel 에 포획되면 안 된다(ingress 와 같은 이유 — base/service-mesh/ingress-gateway.yaml).
# Istio 가 이 Gateway 로 Deployment·Service `knative-local-istio` 를 만든다.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: knative-local
  labels:
    app.kubernetes.io/name: knative-local-gateway
    app.kubernetes.io/component: service-mesh
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  infrastructure:
    labels:
      istio.io/dataplane-mode: none
  gatewayClassName: istio
  listeners:
    # ★ 80 이어야 한다 — Knative 가 만드는 cluster-local Service(`<이름>` ExternalName -> knative-local-istio)가
    #   **포트 80** 이다. 처음에 Istio 예시대로 8081 로 두었다가 Service 에 80 이 없어 `Connection reset by peer`
    #   였다(2026-11-10 실측).
    # ★ 라우트는 Knative Service 가 사는 `kn` 에서만 받는다.
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - {key: kubernetes.io/metadata.name, operator: In, values: [kn]}
