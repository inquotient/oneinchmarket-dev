# 클러스터 안 -> knative-local 게이트웨이(80). 그 파드는 메시 밖이라(dataplane-mode none) 평문으로 받는다.
#   부르는 쪽: `kn`·`local` 의 앱 · Kafka 브로커 데이터플레인(knative-eventing) · activator(knative-serving).
# ★ 셀렉터는 matchExpressions 로 쓴다 — 오버레이의 라벨 변환기가 matchLabels 에 `environment: local` 을 주입하는데
#   Istio 가 만드는 게이트웨이 파드에는 그 라벨이 없어 **아무것도 고르지 않게 된다**(Gotcha 185).
# ★ 리비전 파드로 가는 허용은 그 파드가 사는 `kn` 쪽에 있다(overlays/local-kn/netpol.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-knative-local-gateway
  labels:
    app.kubernetes.io/name: knative
    app.kubernetes.io/component: service-mesh
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchExpressions:
      - {key: gateway.networking.k8s.io/gateway-name, operator: In, values: [knative-local]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchExpressions:
              - {key: kubernetes.io/metadata.name, operator: In, values: [local, kn, knative-serving, knative-eventing]}
      ports:
        - {port: 80, protocol: TCP}
