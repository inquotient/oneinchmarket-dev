# ─────────────────────────────────────────────────────────────────
# OpenMeter — API 과금 계량 백엔드. **생성 파일이다. 직접 고치지 말 것.**
#   bash local/render-openmeter.sh
# 값은 local/openmeter-values.yaml 에 있다.
# ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openmeter
  labels:
    helm.sh/chart: openmeter-1.0.0-beta.232
    app.kubernetes.io/name: openmeter
    app.kubernetes.io/instance: openmeter
    app.kubernetes.io/version: v1.0.0-beta.232
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/component: billing
automountServiceAccountToken: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openmeter
  labels:
    helm.sh/chart: openmeter-1.0.0-beta.232
    app.kubernetes.io/name: openmeter
    app.kubernetes.io/instance: openmeter
    app.kubernetes.io/version: v1.0.0-beta.232
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/component: billing
data:
  config.yaml: "aggregation:\n  clickhouse:\n    address: clickhouse-headless:9000\n\
    \    database: openmeter\n    password: __CLICKHOUSE_PASSWORD__\n    username:\
    \ openmeter\ndedupe:\n  config:\n    address: redis-headless:6379\n    database:\
    \ 0\n    expiration: 768h\n    password: __REDIS_PASSWORD__\n  driver: redis\n\
    \  enabled: true\ningest:\n  kafka:\n    broker: kafka-headless:9092\nmeters:\n\
    - aggregation: COUNT\n  description: API 호출 수 (과금 기준)\n  eventType: io.oneinchmarket.api.request.v1\n\
    \  groupBy:\n    method: $.method\n    route: $.route\n    status: $.status\n\
    \  slug: api_requests_total\n- aggregation: SUM\n  description: 응답 바이트 (대역 과금용)\n\
    \  eventType: io.oneinchmarket.api.request.v1\n  groupBy:\n    route: $.route\n\
    \  slug: api_response_bytes\n  valueProperty: $.response_bytes\npostgres:\n  autoMigrate:\
    \ migration\n  url: postgres://openmeter:__POSTGRES_PASSWORD__@postgresql-headless:5432/openmeter?sslmode=disable\n\
    sink:\n  kafka:\n    brokers: kafka-headless:9092\n"
---
apiVersion: v1
kind: Service
metadata:
  name: openmeter-api
  labels:
    helm.sh/chart: openmeter-1.0.0-beta.232
    app.kubernetes.io/name: openmeter
    app.kubernetes.io/instance: openmeter
    app.kubernetes.io/version: v1.0.0-beta.232
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oneinchmarket
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: openmeter
    app.kubernetes.io/instance: openmeter
    app.kubernetes.io/component: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openmeter-api
  labels:
    helm.sh/chart: openmeter-1.0.0-beta.232
    app.kubernetes.io/name: openmeter
    app.kubernetes.io/instance: openmeter
    app.kubernetes.io/version: v1.0.0-beta.232
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: oneinchmarket
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openmeter
      app.kubernetes.io/instance: openmeter
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: b258dd68fd2e98e0969d7ab9c267145d7cbcae5fcd629bd51d69a0a24c437f56
      labels:
        helm.sh/chart: openmeter-1.0.0-beta.232
        app.kubernetes.io/name: openmeter
        app.kubernetes.io/instance: openmeter
        app.kubernetes.io/version: v1.0.0-beta.232
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: openmeter
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: openmeter
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: &id001
            drop:
            - ALL
        image: ghcr.io/openmeterio/openmeter:v1.0.0-beta.232
        imagePullPolicy: IfNotPresent
        command:
        - /entrypoint.sh
        - openmeter
        args:
        - --address
        - 0.0.0.0:80
        - --telemetry-address
        - 0.0.0.0:10000
        - --config
        - /etc/openmeter/config.yaml
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: telemetry-http
          containerPort: 10000
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: telemetry-http
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: telemetry-http
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 50m
            memory: 192Mi
        volumeMounts:
        - name: config-rendered
          mountPath: /etc/openmeter
      volumes:
      - name: config
        configMap:
          name: openmeter
      - name: config-rendered
        emptyDir: {}
      initContainers:
      - name: render-config
        image: docker.io/library/busybox:1.38.0
        command:
        - /bin/sh
        - -c
        args:
        - "set -eu\nsed -e \"s|__CLICKHOUSE_PASSWORD__|${CLICKHOUSE_PASSWORD}|\" \
          \    -e \"s|__POSTGRES_PASSWORD__|${POSTGRES_PASSWORD}|\"     -e \"s|__REDIS_PASSWORD__|${REDIS_PASSWORD}|\"\
          \     /src/config.yaml > /out/config.yaml\nif grep -qE '__(CLICKHOUSE|POSTGRES|REDIS)_PASSWORD__'\
          \ /out/config.yaml; then\n  echo '[render-config] 치환 실패 — 자리표시자가 남았다.' >&2\n\
          \  echo '[render-config] 그대로 기동하면 인증이 실패한다.' >&2\n  exit 1\nfi\necho '[render-config]\
          \ 완료'\n"
        env:
        - name: CLICKHOUSE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-secret
              key: openmeter-password
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: clickhouse-secret
              key: openmeter-pg-password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-secret
              key: redis-password
        securityContext:
          allowPrivilegeEscalation: false
          capabilities: *id001
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        volumeMounts:
        - name: config
          mountPath: /src
          readOnly: true
        - name: config-rendered
          mountPath: /out
---
