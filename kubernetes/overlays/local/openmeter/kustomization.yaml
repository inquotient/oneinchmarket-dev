# ─────────────────────────────────────────────────────────────────────────
# OpenMeter — API 과금 계량 백엔드. **local 오버레이 전용**
#
# base 에 두지 않는 이유는 OpenReplay 와 같다 — 매니페스트가 환경에 묶인 값을
# 갖는다(clickhouse-headless · kafka-headless · redis-headless 는 이 클러스터의
# 서비스명이다). dev/prod 는 엔드포인트가 달라진다.
#
# openmeter.yaml 은 **생성 파일**이다. 직접 고치지 말 것 —
#   bash local/render-openmeter.sh
# 가 `helm template` 으로 만든다(ADR-003 유지. Helm 을 배포가 아니라 생성
# 도구로만 쓴다 — Tetragon·OpenReplay 와 같은 방식).
#
# ★★ 지금 이 스택은 **아직 이벤트를 받지 못한다.**
#   OpenMeter 는 자기 토픽을 스스로 만들고 HTTP API(/api/v1/events)로 수집한다.
#   우리 `api-usage` 토픽을 직접 읽지 않는다 — 그 사이를 잇는 다리가 없다.
#   ADR-072 의 다음 증분이다(§8-58).
#
# ★ ADR-070 개정 전제 — ClickHouse 를 OpenReplay 와 **공유**한다.
#   데이터베이스만 `openmeter` 로 나눈다. 두 번째 인스턴스를 세우지 않는다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - openmeter.yaml
  - dlq-replay.yaml

# ★★★ sync-wave 3 — 2026-10-05 에 **처음** 붙였다. 그 전까지 이 오버레이에는
#   wave 선언이 없어 전부 **wave 0** 이었다. 그런데 OpenMeter 는
#   PostgreSQL·ClickHouse·Redis(wave 1)와 Kafka(wave 2)를 필요로 한다.
#   그러면 처음 세우는 클러스터에서 **동기화가 wave 0 에서 영원히 선다** —
#   ArgoCD 는 wave 경계마다 Healthy 를 기다리고, 이 다섯 파드는 DB 가 없어
#   절대 Healthy 가 되지 않는다. 실측: `Synced 138/575` · `local` 파드 8개 ·
#   openmeter 5종 CrashLoopBackOff. 575건 중 나머지가 통째로 멈췄다.
# ★ 기존 클러스터에서는 드러날 수 없는 결함이다 — 이미 떠 있는 DB 에
#   붙으므로 wave 가 0 이어도 아무 일도 없다(Gotcha 58 이 적어 둔 그대로:
#   "GitOps 를 켜는 것은 평소에 돌지 않던 것을 전부 다시 돌리는 일이다").
# ★★ 왜 3 인가: ClickHouse·Redis 가 1, Kafka 가 2 다. sink-worker 가 Kafka 를
#   소비하므로 2 보다 뒤여야 한다. 소비자 쪽(Logstash 7 · 과금 CronJob 8 ·
#   Airflow DAG)은 모두 더 뒤이거나 스케줄 기반이라 상한을 걸지 않는다.
# ★★★ 전수로 세서 찾았다 — 렌더의 워크로드 중 wave 가 없는 것은
#   **openmeter 9종뿐**이었다. "기억이 아니라 렌더에서 셀 것"(Gotcha 19).
commonAnnotations:
  argocd.argoproj.io/sync-wave: "3"

# ★★ reloader 어노테이션을 여기서 붙인다 — 생성 파일을 고치면 다음
#   렌더에 지워진다. 이 워크로드들은 redis-secret·minio-secret 을 참조하는데
#   상류 차트가 어노테이션을 붙이지 않아 **로테이션 된 뒤에도 옛 자격을**
#   든 채 남는다(§8-96). 로테이션 CronJob 은 DB 비밀번호와 Secret 을 둘 다
#   바꾸므로, 재시작하지 않으면 그 순간부터 붙지 못한다.
#
# ★ commonAnnotations 를 쓰지 않는다 — 그것은 Service·ConfigMap 까지 전부에
#   붙고, 같은 키가 이미 있으면 **덮어쓴다**(Gotcha 67).
patches:
  - target:
      kind: Deployment
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: patched-by-target
        annotations:
          reloader.stakater.com/auto: "true"
  - target:
      kind: StatefulSet
    patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: patched-by-target
        annotations:
          reloader.stakater.com/auto: "true"
# ★★ maxSurge: 0 — 이 노드에서 surge 는 롤아웃이 아니라 교착이다.
#   기본값(maxSurge 25% · maxUnavailable 0)은 replicas 1 에서
#   "새 파드가 Ready 된 뒤에야 헌 파드를 죽인다" 를 뜻하는데,
#   2026-09-15 03:15 로테이션이 26개 Deployment 를 동시에 굴리면
#   surge 로만 **3.5 GiB** 가 필요하다. 노드 여유는 1.1 GiB 다.
#   그러면 새 파드가 Pending 에 멈추고 헌 파드는 죽지 않으므로,
#   **옛 비밀번호를 든 파드가 교체되지 못한 채 남는다** — 자가 복구되지
#   않는 장애다. §8-93 이 밟은 그 함정이다.
#   replicas 1 이라 surge 가 사주는 무중단은 어차피 한 파드뿐이다.
  - target:
      kind: Deployment
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: patched-by-target
      spec:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1

# ★★ readOnlyRootFilesystem 을 켜는 첫 트랜치다(§8-99).
#   Trivy 가 KSV-0014 로 312건을 지적하지만 켜면 조용히 깨지는 것이 있어
#   추측으로 켜지 않았다. `local/check-readonly-rootfs.sh` 가 도는
#   컨테이너에 직접 물어 **rootfs 쓰기 0건**을 확인한 것만 골랐다.
#   openmeter 5종은 그 검사를 통과했고, HTTP API 로 동작까지 확인된다.
#
# ★ 같은 검사에서 'caldera · hive-server' 는 쓴다고 나왔다
#   (/usr/src/app/conf/local.yml · /opt/hive/conf/hiveserver2.pid). 둘 다
#   "안전해 보이는" 후보였으므로, 측정 없이 허욠으면 깨졌을 것이다.
  - target:
      kind: Deployment
      labelSelector: app.kubernetes.io/name=openmeter
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/securityContext/readOnlyRootFilesystem
        value: true
