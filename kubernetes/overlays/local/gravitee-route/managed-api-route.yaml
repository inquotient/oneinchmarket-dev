# Gravitee 공존 경로 — **local 전용**
#
# ★★ 왜 base 가 아닌가 — **ADR-079 가 아직 미결이기 때문이다.**
#   게이트웨이를 Istio 단독으로 갈지 Gravitee 를 함께 쓸지 정해지지 않았는데,
#   base 에 두면 prod 렌더가 그것을 상속해 **매니페스트 배치가 결정을 대신한다.**
#   이 레포는 같은 이유로 Caldera(ADR-030)·BuildKit(Gotcha 149)을 오버레이에 두었다.
#
# 승격 조건 — ADR-079 가 "Gravitee 를 함께 쓴다" 로 닫히는 날. 그때 이 파일을
#   base/service-mesh/ 로 옮기고, **그 전에** prod 의 Gravitee 에 카탈로그가
#   실제로 실려 있는지 확인할 것 — 지금 local 에도 시험용 API 하나뿐이다.

# Gravitee 로 보내는 경로 — **Istio 앞, Gravitee 뒤**(ADR-079 의 공존 배치).
#
# ★★★ 순서가 이 배치의 전부다. 모든 트래픽이 **Istio 게이트웨이를 먼저**
#   지나므로 계량 지점이 움직이지 않는다 — 액세스 로그 -> Kafka `api-usage`
#   -> OpenMeter 경로가 그대로다. 거꾸로(Gravitee 를 앞에) 두면 Gotcha 15 에
#   정면으로 걸린다: "계량 지점을 나중에 바꾸면 이미 청구한 이력이 함께
#   흔들린다. 청구는 소급 재해석이 불가능하다."
#
# ★★ 역할을 겹치지 않게 나눈다:
#   Istio    TLS · JWT · 신원 · **계량** · **쓰로틀**(pricing-catalog.yaml 원천)
#   Gravitee 카탈로그 · 개발자 포털 · 구독/키 발급 · 요청·응답 변환
#   ★ Gravitee 의 **플랜·쿼터·분석을 켜지 말 것** — 켜는 순간 "이 고객이
#     무엇을 샀는가" 의 원천이 Gravitee 의 Mongo 와 OpenMeter 의 PostgreSQL
#     둘이 된다(Gotcha 71 이 경고한 그것). 그래서 이 API 의 플랜은 KEY_LESS 다.
#
# ★ `/managed` 는 `/`(cmmn-api 직결, 과금 경로) 보다 **더 구체적**이라 먼저
#   매칭된다. 기존 경로를 건드리지 않고 배치를 증명하기 위한 선택이다.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: managed-api
  labels:
    app.kubernetes.io/name: managed-api
    app.kubernetes.io/component: service-mesh
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: ingress
      sectionName: https
  hostnames:
    - api.oneinchmarket.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /managed
      backendRefs:
        - group: ""
          kind: Service
          name: gravitee-gateway-headless
          port: 8082
          weight: 1
