# 노드에서 클러스터 안 GitLab 레지스트리로 push 할 수 있게 한다 (local 전용, 2026-11-07)
#
# ★ 왜: `local/build-images.sh` 는 노드(103)에서 podman 으로 push 하는데, 노드발 트래픽은 Cilium 에서
#   `host`(같은 노드) · `remote-node`(다른 노드) 신원을 받고 `default-deny-ingress` 가 덮는 네임스페이스에서
#   그 신원은 어느 허용 규칙에도 없다(Gotcha 187·197). 실측: 노드 -> gitlab-0 파드 IP 의 80·5050 이 둘 다 000.
#   그래서 지금까지 port-forward + /etc/hosts 바꿔치기로 우회했다(CLAUDE.md 로컬 개발 절).
# ★ 평범한 NetworkPolicy 로는 표현할 수 없다 — `ipBlock` CIDR 은 node 신원과 매칭되지 않는다(Gotcha 197 ★★ 실측).
#   남는 수단이 Cilium 의 `fromEntities` 다. AppProject 화이트리스트에 이 종류 하나만 넣었다(Gotcha 57).
# ★ 포트 둘 다 필요하다 — push 는 5050(/v2/) 에서 401 을 받고 토큰 realm(80, GitLab 본체 /jwt/auth)에서
#   토큰을 받은 뒤 다시 5050 에 올린다(gitlab-configmap.yaml 의 registry['token_realm']).
# ★ 넓히지 말 것: 이 정책은 노드 프로세스(kubelet·podman·k3s ctr)에게만 연다. 파드는 이 신원을 갖지 않는다.
#   GitLab 을 고르는 Istio AuthorizationPolicy 는 없다(2026-11-07 실측) — 생기면 node 는 메시 신원이 없어
#   거기서 다시 막힌다.
# ★ dev·prod 에 두지 않는 이유: 그 클러스터의 CNI 가 Cilium 이라는 전제가 이 레포에 없고, prod 에서는 노드가
#   아니라 CI 가 push 해야 한다.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-gitlab-from-nodes
  labels:
    app.kubernetes.io/name: allow-gitlab-from-nodes
    app.kubernetes.io/component: devops
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gitlab
  ingress:
    - fromEntities: [host, remote-node]
      toPorts:
        - ports:
            - {port: "80",   protocol: TCP}
            - {port: "5050", protocol: TCP}
