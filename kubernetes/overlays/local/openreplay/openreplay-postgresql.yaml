# ─────────────────────────────────────────────────────────────────────────
# OpenReplay 전용 PostgreSQL 17.
#
# ★ 공용 PostgreSQL 을 쓸 수 없다. 버전이 안 맞는다:
#     공용        postgres:latest → 18.6
#     OpenReplay  16.4 ~ 17 만 지원 (마이그레이션 initContainer 가 버전을
#                 검사하고 범위 밖이면 exit 101 로 중단한다)
#   공용 인스턴스는 keycloak·gitlab·apicurio·hive·ranger·glitchtip 6종이
#   쓰므로 낮출 수 없다. 따라서 전용 인스턴스가 유일한 선택이다.
#   ADR-070 이 ClickHouse 를 OpenReplay 전용으로 한정한 것과 같은 성격이며,
#   ADR-038(전용 인스턴스 분리)의 논리가 **버전 제약** 형태로 되살아난 사례다.
#
# 이 인스턴스는 OpenReplay 만 쓴다. 다른 소비자를 붙이지 않는다.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: openreplay-postgresql
  labels:
    app.kubernetes.io/name: openreplay-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oneinchmarket
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - { port: 5432, targetPort: postgresql, protocol: TCP, name: postgresql }
  selector:
    app.kubernetes.io/name: openreplay-postgresql
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openreplay-postgresql
  labels:
    app.kubernetes.io/name: openreplay-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openreplay-postgresql
  labels:
    app.kubernetes.io/name: openreplay-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  serviceName: openreplay-postgresql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openreplay-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openreplay-postgresql
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: openreplay-postgresql
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgresql
          # ★ 17 에 고정한다. latest 로 두면 18 로 올라가 OpenReplay 가 거부한다.
          image: postgres:17
          ports:
            - { containerPort: 5432, name: postgresql, protocol: TCP }
          env:
            - name: POSTGRES_USER
              value: openreplay
            - name: POSTGRES_DB
              value: openreplay
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: openreplay-secret, key: db-password }
            # 공용 인스턴스와 같은 이유로 마운트 지점 자체를 데이터 경로로
            # 쓰지 않는다 — lost+found 때문에 initdb 가 거부한다.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: false
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 768Mi }
          startupProbe:
            exec: { command: ["sh", "-c", "pg_isready -U openreplay -d openreplay"] }
            failureThreshold: 30
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U openreplay -d openreplay"] }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U openreplay -d openreplay"] }
            periodSeconds: 15
            timeoutSeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
# 전용 인스턴스이므로 소비자를 OpenReplay 로만 한정한다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-openreplay-postgresql-access
  labels:
    app.kubernetes.io/name: allow-openreplay-postgresql-access
    app.kubernetes.io/component: network-policies
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openreplay-postgresql
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: openreplay
      ports:
        - { protocol: TCP, port: 5432 }
