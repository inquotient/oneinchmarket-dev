# ─────────────────────────────────────────────────────────────────────────
# OpenReplay — **local 오버레이 전용**(ADR-069)
#
# base 에 두지 않는 이유는 lakehouse-local 과 같다 — 매니페스트가 환경에
# 묶인 값을 갖는다: domainName(openreplay.local) · 단일 노드 · 우리 저장소
# 엔드포인트가 하드코딩된다. dev/prod 는 도메인·TLS 가 달라진다.
#
# openreplay.yaml 은 **생성 파일**이다. 직접 고치지 말 것 —
#   bash local/render-openreplay.sh
# 가 `helm template` 으로 만든다(ADR-003 은 유지된다. Tetragon 과 같은 방식으로
# Helm 을 배포가 아니라 **생성 도구**로만 쓴다).
#
# ★ 지금 이 스택은 브라우저 데이터를 받지 못한다. 전제 2건이 미해결이다:
#     ① 외부 HTTPS 진입점 없음(배포 블로커 #6) — Ingress 12개가 컨트롤러
#        없이 렌더돼 비활성이다
#     ② 프런트엔드 계측 경로 없음(G9) — 트래커를 심을 수 없다
#   그래서 세션 리플레이는 **아직 동작하지 않는다.** ADR-069 순서 참조.
#
# 의도된 예외 — 차트가 securityContext 를 선언하지 않아 컨테이너가 이미지
# 기본 사용자로 돈다. 로컬은 Kyverno 가 Audit 이라 기동하지만 prod 는
# Enforce 다. base 승격 시 반드시 해소해야 한다.
# ─────────────────────────────────────────────────────────────────────────
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - openreplay.yaml

commonAnnotations:
  argocd.argoproj.io/sync-wave: "7"

# ★★ reloader 어노테이션을 여기서 붙인다 — 생성 파일을 고치면 다음
#   렌더에 지워진다. 이 워크로드들은 redis-secret·minio-secret 을 참조하는데
#   상류 차트가 어노테이션을 붙이지 않아 **로테이션 된 뒤에도 옛 자격을**
#   든 채 남는다(§8-96). 로테이션 CronJob 은 DB 비밀번호와 Secret 을 둘 다
#   바꾸므로, 재시작하지 않으면 그 순간부터 붙지 못한다.
#
# ★ commonAnnotations 를 쓰지 않는다 — 그것은 Service·ConfigMap 까지 전부에
#   붙고, 같은 키가 이미 있으면 **덮어쓴다**(Gotcha 67).
patches:
  - target:
      kind: Deployment
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: patched-by-target
        annotations:
          reloader.stakater.com/auto: "true"
  - target:
      kind: StatefulSet
    patch: |
      apiVersion: apps/v1
      kind: StatefulSet
      metadata:
        name: patched-by-target
        annotations:
          reloader.stakater.com/auto: "true"
# ★★ maxSurge: 0 — 이 노드에서 surge 는 롤아웃이 아니라 교착이다.
#   기본값(maxSurge 25% · maxUnavailable 0)은 replicas 1 에서
#   "새 파드가 Ready 된 뒤에야 헌 파드를 죽인다" 를 뜻하는데,
#   2026-09-15 03:15 로테이션이 26개 Deployment 를 동시에 굴리면
#   surge 로만 **3.5 GiB** 가 필요하다. 노드 여유는 1.1 GiB 다.
#   그러면 새 파드가 Pending 에 멈추고 헌 파드는 죽지 않으므로,
#   **옛 비밀번호를 든 파드가 교체되지 못한 채 남는다** — 자가 복구되지
#   않는 장애다. §8-93 이 밟은 그 함정이다.
#   replicas 1 이라 surge 가 사주는 무중단은 어차피 한 파드뿐이다.
  - target:
      kind: Deployment
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: patched-by-target
      spec:
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1

# ★★ readOnlyRootFilesystem — **측정을 통과한 14종만** 켜다(§8-101).
#   `local/check-readonly-rootfs.sh` 가 도는 컨테이너에 직접 물어
#   rootfs 쓰기가 0건인 것만 골랐다.
#
# ★ 이름을 정규식으로 모두 나열한다 — 라벨 셀렉터로 잡으면
#   아래 세 종이 함께 들어온다. **제외한 이유를 남긴다:**
#     assist          /home/openreplay/.npm/_logs/... 을 쓴다 (npm 로그)
#     sourcemapreader 같은 이유
#     frontend        셸이 없어 **측정 자체가 불가**했다. 측정 못한 것을
#                     켜지 않는다 — nginx 계열은 임시 디렉터리를 쓴다
#
# ★★ 이 목록은 보증이 아니다 — 검사가 **기동 중의 쓰기를 놓친다**
#   (dependency-track-frontend 가 그 반례, Gotcha 92). 켜진 뒤 기동 로그와
#   재시작 횟수를 반드시 확인할 것.
  - target:
      kind: Deployment
      name: "^(alerts|api|assets|canvases|chalice|db|ender|heuristics|http|images|integrations|sink|spot|storage)-openreplay$"
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/securityContext/readOnlyRootFilesystem
        value: true
