data:
  clickhouse.sh: "#!/bin/bash\n\nset -ex\n\nclickhousedir=/opt/openreplay/openreplay/scripts/schema/db/init_dbs/clickhouse\n\
    \n[[ \"${CH_PASSWORD}\" == \"\" ]] || {\n  CH_PASSWORD=\"--password $CH_PASSWORD\"\
    \n}\n\n[[ \"${CH_USE_TLS}\" == \"true\" ]] && CH_TLS_FLAGS=\"--secure --accept-invalid-certificate\"\
    \ || CH_TLS_FLAGS=\"\"\n\nch_client=\"clickhouse-client -h ${CH_HOST} --port ${CH_PORT}\
    \ --user ${CH_USERNAME} ${CH_PASSWORD} ${CH_TLS_FLAGS}\"\n\nfunction run_numbered_migration()\
    \ {\n    local version=$1\n    local version_dir=\"${clickhousedir}/${version}\"\
    \n\n    # Safe-init state + version functions (no-op if they already exist)\n\
    \    $ch_client -q \"CREATE FUNCTION IF NOT EXISTS openreplay_migration_state\
    \ AS() -> -1;\"\n    $ch_client -q \"CREATE FUNCTION IF NOT EXISTS openreplay_version\
    \ AS() -> 'v0.0.0';\"\n\n    # Read current state and version\n    local state\
    \ current_version\n    state=$($ch_client -q \"SELECT openreplay_migration_state()\"\
    \ | tr -d '[:space:]')\n    current_version=$($ch_client -q \"SELECT openreplay_version()\"\
    \ | tr -d '[:space:]')\n\n    # Skip if this version is already fully applied\
    \ (version matches and no migration in progress)\n    if [[ \"$current_version\"\
    \ == \"v$version\" && \"$state\" == \"-1\" ]]; then\n        echo \"Version $version\
    \ already applied (current=$current_version, state=-1). Skipping.\"\n        return\
    \ 0\n    fi\n\n    # Skip if existing DB version is newer than target (downgrade\
    \ attempt). Don't error, continue to next.\n    if [[ \"$current_version\" !=\
    \ \"v0.0.0\" && \"$state\" == \"-1\" ]]; then\n        local cur_stripped=\"${current_version#v}\"\
    \n        local newest\n        newest=$(printf '%s\\n%s\\n' \"$cur_stripped\"\
    \ \"$version\" | sort -V | tail -n1)\n        if [[ \"$cur_stripped\" != \"$version\"\
    \ && \"$newest\" == \"$cur_stripped\" ]]; then\n            echo \"Existing version\
    \ $current_version > target v$version. Skipping (no downgrade).\"\n          \
    \  return 0\n        fi\n    fi\n\n    local start_from=$((state + 1))\n    echo\
    \ \"Migration state for version $version: state=$state, current_version=$current_version,\
    \ starting from step $start_from\"\n\n    # Execute numbered files in version-sorted\
    \ order (sort -V handles 10 > 2 correctly)\n    for file in $(ls \"${version_dir}\"\
    /*.sql | sort -V); do\n        local file_num\n        file_num=$(basename \"\
    $file\" .sql)\n        if [[ $file_num -lt $start_from ]]; then\n            echo\
    \ \"Skipping $file (step $file_num already done)\"\n            continue\n   \
    \     fi\n        echo \"Executing $file (step $file_num)\"\n        $ch_client\
    \ --multiquery < \"$file\" || { echo \"FAILED at $file (step $file_num)\"; exit\
    \ 1; }\n    done\n\n    # Verify migration completed (state should be -1)\n  \
    \  local final_state\n    final_state=$($ch_client -q \"SELECT openreplay_migration_state()\"\
    \ | tr -d '[:space:]')\n    if [[ $final_state -ne -1 ]]; then\n        echo \"\
    ERROR: Migration for version $version did not complete. Final state: $final_state\"\
    \n        exit 1\n    fi\n    echo \"Migration for version $version completed\
    \ successfully\"\n}\n\nfunction migrate() {\n    echo \"Starting clickhouse migration\"\
    \n    IFS=',' read -r -a migration_versions <<< \"$1\"\n    for version in ${migration_versions[*]};\
    \ do\n        echo \"Migrating clickhouse version $version\"\n        if [[ -f\
    \ \"${clickhousedir}/${version}/${version}.sql\" ]]; then\n            # Old-style:\
    \ single file migration (pre-1.23.0)\n            # Keep || true — these files\
    \ have no throwIf guards and contain non-idempotent DDL\n            $ch_client\
    \ --multiquery < \"${clickhousedir}/${version}/${version}.sql\" || true\n    \
    \    else\n            # New-style: numbered files with resume support (1.23.0+)\n\
    \            run_numbered_migration \"$version\"\n        fi\n    done\n}\n\n\
    function init() {\n    echo \"Initializing clickhouse\"\n    for file in $(ls\
    \ \"${clickhousedir}\"/create/*.sql); do\n        echo \"Injecting $file\"\n \
    \       $ch_client --multiquery < \"$file\" || true\n    done\n}\n\n# /bin/bash\
    \ clickhouse.sh migrate $migration_versions\ncase \"$1\" in\n    migrate)\n  \
    \      migrate $2\n        ;;\n    init)\n        init\n        ;;\n    *)\n \
    \       echo \"Unknown operation for clickhouse migration; exiting.\"\n      \
    \  exit 1\n        ;;\nesac\n"
  dbops.sh: "#!/bin/bash\n\nset -x\ncd $(dirname $0)\n\nis_migrate=$1\n\n# Check if\
    \ the openreplay version is set.\n# This will take precedence over the .Values.fromVersion\
    \ variable\n# Because its created by installation programatically.\nif [[ -n $OPENREPLAY_VERSION\
    \ ]]; then\n    is_migrate=true\n    PREVIOUS_APP_VERSION=$OPENREPLAY_VERSION\n\
    \    echo \"$OPENREPLAY_VERSION set\"\nfi\n\nif [[ $FORCE_MIGRATION == \"true\"\
    \ ]]; then\n    is_migrate=true\nfi\n\n# Passed from env\n# PREVIOUS_APP_VERSION\n\
    # CHART_APP_VERSION\n# Converting alphaneumeric to number.\nPREVIOUS_APP_VERSION=$(echo\
    \ $PREVIOUS_APP_VERSION | cut -d \"v\" -f2)\nCHART_APP_VERSION=$(echo $CHART_APP_VERSION\
    \ | cut -d \"v\" -f2)\n\nfunction migration() {\n    ls -la /opt/openreplay/openreplay\n\
    \    db=$1\n\n    # Checking if previous app version is set.\n    if [[ $PREVIOUS_APP_VERSION\
    \ == \"\" ]]; then\n        echo \"Previous app version to be migrated is not\
    \ set. Rerun using --set fromVersion=v1.3.5\"\n        exit 100\n    fi\n\n  \
    \  if [[ $FORCE_MIGRATION == \"true\" ]]; then\n        echo \"Forcing db migration\
    \ from $PREVIOUS_APP_VERSION to $CHART_APP_VERSION\"\n    # This is a special\
    \ case where we force upgrade frontend\n    elif [[ $UPGRADE_FRONTENT == \"true\"\
    \ ]]; then\n        echo \"[WARN] Skipping regular upgrdades. Forcing frontend\
    \ upgrade.\"\n        /bin/bash minio.sh migrate\n        exit 0\n    elif [[\
    \ $PREVIOUS_APP_VERSION == $CHART_APP_VERSION ]]; then\n        echo \"No application\
    \ version change. Not upgrading.\"\n        exit 0\n    fi\n\n    # Checking migration\
    \ versions\n    cd /opt/openreplay/openreplay/scripts/schema\n\n    # We need\
    \ to remove version dots\n    function normalise_version {\n        version=$1\n\
    \        version=${version#v} # Remove leading 'v' if it exists\n        echo\
    \ ${version} | tr -d '.'\n    }\n    all_versions=($(ls -l db/init_dbs/$db | grep\
    \ -E ^d | grep -v create | awk '{print $NF}'))\n    migration_versions=($(for\
    \ ver in ${all_versions[*]}; do\n        if [[ $(normalise_version $ver) -gt $(normalise_version\
    \ \"${PREVIOUS_APP_VERSION}\") ]]; then\n            echo $ver\n        fi\n \
    \   done | sort -V))\n    echo \"Migration version: ${migration_versions[*]}\"\
    \n    # Can't pass the space seperated array to ansible for migration. So joining\
    \ them with ,\n    joined_migration_versions=$(\n        IFS=,\n        echo \"\
    ${migration_versions[*]}\"\n    )\n\n    cd -\n\n    case \"$1\" in\n    postgresql)\n\
    \        /bin/bash postgresql.sh migrate $joined_migration_versions\n        ;;\n\
    \    minio)\n        /bin/bash minio.sh migrate $joined_migration_versions\n \
    \       ;;\n    clickhouse)\n        /bin/bash clickhouse.sh migrate $joined_migration_versions\n\
    \        ;;\n    kafka)\n        /bin/bash kafka.sh migrate $joined_migration_versions\n\
    \        ;;\n    *)\n        echo \"Unknown operation for db migration; exiting.\"\
    \n        exit 1\n        ;;\n    esac\n}\n\nfunction init() {\n    case $1 in\n\
    \    postgresql)\n        /bin/bash postgresql.sh init\n        ;;\n    minio)\n\
    \        /bin/bash minio.sh migrate $migration_versions\n        ;;\n    clickhouse)\n\
    \        /bin/bash clickhouse.sh init\n        ;;\n    kafka)\n        /bin/bash\
    \ kafka.sh init\n        ;;\n    *)\n        echo \"Unknown operation for db init;\
    \ exiting.\"\n        exit 1\n        ;;\n\n    esac\n}\n\n# Check if the openreplay\
    \ version is set.\n# This will take precedence over the .Values.fromVersion variable\n\
    # Because its created by installation programatically.\nif [[ -n $OPENREPLAY_VERSION\
    \ ]]; then\n    is_migrate=true\n    PREVIOUS_APP_VERSION=$OPENREPLAY_VERSION\n\
    \    echo \"$OPENREPLAY_VERSION set\"\nfi\n\nif [[ $FORCE_MIGRATION == \"true\"\
    \ ]]; then\n    is_migrate=true\nfi\n\n# dbops.sh true(upgrade) clickhouse\ncase\
    \ \"$is_migrate\" in\n\"false\")\n    init $2\n    ;;\n\"true\")\n    migration\
    \ $2\n    ;;\n*)\n    echo \"Unknown operation for db migration; exiting.\"\n\
    \    exit 1\n    ;;\nesac\n"
  kafka.sh: "#!/bin/bash\n\nset -e\n\n# Default to 4 days.\nRETENTION_TIME=${RETENTION_TIME:-345600000}\n\
    REPLICATION_FACTOR=${REPLICATION_FACTOR:-2}\n\ntopics=(\n    \"raw\"\n    \"raw-ios\"\
    \n    \"raw-images\"\n    \"canvas-images\"\n    \"trigger\"\n    \"canvas-trigger\"\
    \n    \"mobile-trigger\"\n    \"cache\"\n    \"raw-assets\"\n    \"analytics\"\
    \n    \"raw-analytics\"\n    \"quickwit\"\n    \"video-replays\"\n)\n\ntouch /tmp/config.txt\n\
    \nif [[ $KAFKA_SSL == \"true\" ]]; then\n    echo 'security.protocol=SSL' >/tmp/config.txt\n\
    fi\n\nfunction init() {\n    echo \"Initializing kafka\"\n    for topic in \"\
    ${topics[@]}\"; do\n        echo \"Creating topic: $topic\"\n        # TODO: Have\
    \ to check an idempotent way of creating topics.\n        kafka-topics.sh --create\
    \ --bootstrap-server ${KAFKA_HOST}:${KAFKA_PORT} --replication-factor ${REPLICATION_FACTOR}\
    \ --partitions 16 --topic ${topic} --command-config /tmp/config.txt || true\n\
    \        kafka-configs.sh --bootstrap-server ${KAFKA_HOST}:${KAFKA_PORT} --entity-type\
    \ topics --alter --add-config retention.ms=${RETENTION_TIME} --entity-name=${topic}\
    \ --command-config /tmp/config.txt || true\n    done\n}\n\n# /bin/bash kafka.sh\
    \ migrate $migration_versions\ncase \"$1\" in\nmigrate)\n    init\n    ;;\ninit)\n\
    \    init\n    ;;\n*)\n    echo \"Unknown operation for kafka migration; exiting.\"\
    \n    exit 1\n    ;;\nesac\n"
  minio.sh: "#!/bin/bash\n\nset -e\n\ncd /tmp\n\nbuckets=(\"mobs\" \"sessions-assets\"\
    \ \"static\" \"sourcemaps\" \"sessions-mobile-assets\" \"quickwit\" \"vault-data\"\
    \ \"records\" \"spots\")\n\nmc alias set minio $MINIO_HOST $MINIO_ACCESS_KEY $MINIO_SECRET_KEY\n\
    \nfunction init() {\n    echo \"Initializing minio\"\n\n    cat <<EOF >/tmp/lifecycle.json\n\
    {\n  \"Rules\": [\n    {\n      \"Expiration\": {\n        \"Days\": 180\n   \
    \   },\n      \"ID\": \"Delete old mob files\",\n      \"Status\": \"Enabled\"\
    \n    },\n    {\n      \"Expiration\": {\n        \"Days\": 30\n      },\n   \
    \   \"ID\": \"Delete flagged mob files after 30 days\",\n      \"Filter\": {\n\
    \        \"Tag\": {\n          \"Key\": \"to_delete_in_days\",\n          \"Value\"\
    : \"30\"\n        }\n      },\n      \"Status\": \"Enabled\"\n    }\n  ]\n}\n\
    EOF\n\n    for bucket in ${buckets[*]}; do\n        mc mb minio/${bucket} || true\n\
    \    done\n    # eg: How to setup the lifecycle policy\n    # mc ilm import minio/mobs\
    \ </tmp/lifecycle.json || true\n\n    #####################################################\n\
    \    # Creating public bucket; Do not change this block!\n    # !! PUBLIC BUCKETS\
    \ !!\n    #####################################################\n    mc policy\
    \ set download minio/sessions-assets || true\n    mc anonymous set download minio/sessions-assets\
    \ || true\n\n}\n\n# /bin/bash kafka.sh migrate $migration_versions\ncase \"$1\"\
    \ in\nmigrate)\n    init\n    ;;\ninit)\n    init\n    ;;\n*)\n    echo \"Unknown\
    \ operation for minio migration; exiting.\"\n    exit 1\n    ;;\nesac\n"
  postgresql.sh: "#!/bin/bash\n\nset -ex\n\npgdir=/opt/openreplay/openreplay/scripts/schema/db/init_dbs/postgresql\n\
    \n# ENV variables\n# Ref: https://www.postgresql.org/docs/current/libpq-envars.html\n\
    # $PGHOST\n# $PGPORT\n# $PGDATABASE\n# $PGUSER\n# $PGPASSWORD\n\nfunction migrate()\
    \ {\n    echo \"Starting postgresql migration\"\n    IFS=',' read -r -a migration_versions\
    \ <<<\"$1\"\n    for version in ${migration_versions[*]}; do\n        echo \"\
    Migrating postgresql version $version\"\n        psql -v ON_ERROR_STOP=1 -f ${pgdir}/${version}/${version}.sql\
    \ 2>&1\n    done\n}\n\nfunction init() {\n    echo \"Initializing postgresql\"\
    \n    psql -v ON_ERROR_STOP=1 -f ${pgdir}/init_schema.sql 2>&1\n}\n\n# /bin/bash\
    \ postgresql.sh migrate $migration_versions\ncase \"$1\" in\nmigrate)\n    migrate\
    \ $2\n    ;;\ninit)\n    init\n    ;;\n*)\n    echo \"Unknown operation for postgresql\
    \ migration; exiting.\"\n    exit 1\n    ;;\nesac\n"
