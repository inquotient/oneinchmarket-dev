apiVersion: apps/v1
kind: Deployment
metadata:
  name: alerts-openreplay
  namespace: local
  labels:
    helm.sh/chart: alerts-0.1.1
    app.kubernetes.io/name: alerts
    app.kubernetes.io/instance: openreplay
    app.kubernetes.io/version: v1.27.2
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/component: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alerts
      app.kubernetes.io/instance: openreplay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alerts
        app.kubernetes.io/instance: openreplay
        app.kubernetes.io/part-of: oneinchmarket
        app.kubernetes.io/component: observability
    spec:
      serviceAccountName: alerts-openreplay
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 1001
        runAsUser: 1001
      shareProcessNamespace: true
      containers:
      - name: alerts
        securityContext:
          runAsGroup: 1001
          runAsUser: 1001
        image: public.ecr.aws/p1t3u8a3/alerts:v1.27.2
        imagePullPolicy: IfNotPresent
        env:
        - name: version_number
          value: v1.27.2
        - name: pg_host
          value: postgresql.db.svc.cluster.local
        - name: pg_port
          value: '5432'
        - name: pg_dbname
          value: postgres
        - name: ch_host
          value: clickhouse-openreplay-clickhouse.db.svc.cluster.local
        - name: ch_port
          value: '9000'
        - name: ch_port_http
          value: '8123'
        - name: ch_username
          value: default
        - name: ch_password
          valueFrom:
            secretKeyRef:
              name: or-secrets
              key: clickhouse-password
        - name: pg_user
          value: postgres
        - name: pg_password
          valueFrom:
            secretKeyRef:
              name: or-secrets
              key: postgresql-password
        - name: SITE_URL
          value: https://openreplay.local
        - name: S3_HOST
          value: https://openreplay.local
        - name: S3_KEY
          valueFrom:
            secretKeyRef:
              name: or-secrets
              key: access-key
        - name: S3_SECRET
          valueFrom:
            secretKeyRef:
              name: or-secrets
              key: secret-key
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        - name: EMAIL_HOST
          value: ''
        - name: EMAIL_PORT
          value: '587'
        - name: EMAIL_USER
          value: ''
        - name: EMAIL_PASSWORD
          value: ''
        - name: EMAIL_USE_TLS
          value: 'true'
        - name: EMAIL_USE_SSL
          value: 'false'
        - name: EMAIL_SSL_KEY
          value: ''
        - name: EMAIL_SSL_CERT
          value: ''
        - name: EMAIL_FROM
          value: OpenReplay<do-not-reply@openreplay.com>
        - name: LOGLEVEL
          value: INFO
        - name: PYTHONUNBUFFERED
          value: '0'
        ports:
        - name: http
          containerPort: 9000
          protocol: TCP
        - name: metrics
          containerPort: 8888
          protocol: TCP
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 192Mi
