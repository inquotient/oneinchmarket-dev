apiVersion: batch/v1
kind: CronJob
metadata:
  name: efs-cleaner
  namespace: local
  labels:
    helm.sh/chart: utilities-0.1.0
    app.kubernetes.io/name: utilities
    app.kubernetes.io/instance: openreplay
    app.kubernetes.io/version: v1.27.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/component: observability
spec:
  schedule: 5 3 * * *
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          annotations:
            linkerd.io/inject: disabled
        spec:
          restartPolicy: Never
          containers:
          - name: efs-cleaner
            image: debian:stable-slim
            command:
            - /bin/sh
            - -c
            args:
            - "# Cleanup storage older than configured retention\n# Strategy: scan\
              \ top-level session dirs only (maxdepth 1),\n# derive and delete correlated\
              \ canvas/screenshots/devtools.\n# Avoids expensive recursive find across\
              \ 100k+ files.\nset -u\nexport LC_ALL=C\nexport LANG=C\n\nROOT_DIR=\"\
              /mnt/efs\"\nMINUTES_OLD=1440\nTHROTTLE_INTERVAL=0.1\n\necho \"=== EFS\
              \ Cleanup ===\"\necho \"Retention: files older than ${MINUTES_OLD} minutes\"\
              \necho \"Throttle: ${THROTTLE_INTERVAL}s between each rm -rf\"\necho\
              \ \"Storage before:\"\ndf -h \"$ROOT_DIR\"\n\nCOUNTFILE=$(mktemp)\n\
              echo 0 > \"$COUNTFILE\"\n\n# Phase 1: Scan top-level entries (maxdepth\
              \ 1), skip canvas/screenshots dirs.\n# For each old session dir, also\
              \ delete correlated canvas/screenshots/devtools.\necho \"--- Phase 1:\
              \ Session cleanup ---\"\nfind \"$ROOT_DIR\" -mindepth 1 -maxdepth 1\
              \ \\\n  ! -name \"canvas\" \\\n  ! -name \"screenshots\" \\\n  -mmin\
              \ +\"$MINUTES_OLD\" \\\n  -print 2>/dev/null | while IFS= read -r filepath;\
              \ do\n  basename=$(basename \"$filepath\")\n\n  # Delete main session\
              \ dir/file\n  ionice -c 2 -n 7 nice -n 19 rm -rf \"$filepath\" 2>/dev/null\
              \ || true\n\n  # Delete correlated devtools (sibling file: <session_id>devtools)\n\
              \  ionice -c 2 -n 7 nice -n 19 rm -rf \"${filepath}devtools\" 2>/dev/null\
              \ || true\n\n  # Delete correlated canvas dir\n  if [ -d \"${ROOT_DIR}/canvas/${basename}\"\
              \ ]; then\n    ionice -c 2 -n 7 nice -n 19 rm -rf \"${ROOT_DIR}/canvas/${basename}\"\
              \ 2>/dev/null || true\n  fi\n\n  # Delete correlated screenshots dir\n\
              \  if [ -d \"${ROOT_DIR}/screenshots/${basename}\" ]; then\n    ionice\
              \ -c 2 -n 7 nice -n 19 rm -rf \"${ROOT_DIR}/screenshots/${basename}\"\
              \ 2>/dev/null || true\n  fi\n\n  # Count via file (while loop runs in\
              \ subshell due to pipe)\n  c=$(cat \"$COUNTFILE\")\n  c=$((c + 1))\n\
              \  echo \"$c\" > \"$COUNTFILE\"\n  if [ $((c % 1000)) -eq 0 ]; then\n\
              \    echo \"Progress: ${c} sessions cleaned\"\n  fi\n\n  # Throttle\
              \ to avoid saturating EBS IOPS\n  sleep \"$THROTTLE_INTERVAL\"\ndone\n\
              echo \"Phase 1 complete: $(cat \"$COUNTFILE\") sessions cleaned\"\n\n\
              # Phase 2: Cleanup orphaned canvas/screenshots dirs\n# (sessions already\
              \ deleted by other means, but canvas/screenshots left behind)\necho\
              \ \"--- Phase 2: Orphan cleanup ---\"\necho 0 > \"$COUNTFILE\"\nfor\
              \ subdir in canvas screenshots; do\n  if [ -d \"${ROOT_DIR}/${subdir}\"\
              \ ]; then\n    find \"${ROOT_DIR}/${subdir}\" -mindepth 1 -maxdepth\
              \ 1 -type d \\\n      -mmin +\"$MINUTES_OLD\" \\\n      -print 2>/dev/null\
              \ | while IFS= read -r orphan; do\n      ionice -c 2 -n 7 nice -n 19\
              \ rm -rf \"$orphan\" 2>/dev/null || true\n      c=$(cat \"$COUNTFILE\"\
              )\n      echo $((c + 1)) > \"$COUNTFILE\"\n      sleep \"$THROTTLE_INTERVAL\"\
              \n    done\n  fi\ndone\necho \"Phase 2 complete: $(cat \"$COUNTFILE\"\
              ) orphans cleaned\"\nrm -f \"$COUNTFILE\"\n\necho \"=== Cleanup done\
              \ ===\"\necho \"Storage after:\"\ndf -h \"$ROOT_DIR\"\n"
            volumeMounts:
            - mountPath: /mnt/efs
              name: datadir
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 384Mi
          volumes:
          - name: datadir
            hostPath:
              path: /openreplay/storage/nfs
              type: DirectoryOrCreate
---
