# ★★ Ingress 12개를 제거했다 — 이 클러스터에서 **동작한 적이 없다**.
#
#   전부 `ingressClassName: openreplay` 인데 그런 IngressClass 도, 어떤
#   인그레스 컨트롤러도 이 클러스터에 없다(traefik·servicelb 는 비활성이고
#   ADR-071 이 **Istio Gateway** 를 진입점으로 정했다). Gotcha 7 이
#   "OpenReplay 의 Ingress 12개는 여전히 죽어 있다" 로 적어 둔 그것이다.
#
#   ★ 왜 지금 지우나 — ArgoCD 가 wave 경계마다 **Healthy 를 기다린다.**
#   Ingress 의 건강 판정은 `status.loadBalancer.ingress` 가 채워졌는지이고,
#   컨트롤러가 없으면 영원히 비어 `Progressing` 에 머문다. 그 결과
#   **동기화 전체가 끝나지 않는다** — 죽은 리소스가 GitOps 의 게이트가 됐다.
#   판단은 "고칠 수 없는 것을 건강하다고 말하게 만들지 말고, 없앤다" 였다.
#
#   ★ `Certificate/openreplay-ssl` 도 함께 사라진다. 그것은 별도 매니페스트가
#   아니라 frontend Ingress 의 `cert-manager.io/cluster-issuer: letsencrypt-prod`
#   주석이 ingress-shim 으로 만든 것이다. 그 ClusterIssuer 는 존재하지 않고,
#   존재하더라도 ACME 는 공인 DNS 가 필요해 이 랩에서 발급될 수 없다.
#
#   제거한 것: api · assist · canvases · chalice · frontend ·
#   frontend-master · http · images · integrations · minio ·
#   openreplay-tracker · spot (전부 `-openreplay` 접미, minio 는 예외)
#
#   ★ 되돌릴 때 — 인그레스 컨트롤러를 세우거나 Istio Gateway 의
#   HTTPRoute 로 옮겨 적을 것. 그냥 되살리면 같은 자리에서 다시 멈춘다.
#   §8-84 · Gotcha 7
