  vault.sh: "#!/bin/sh\n\n# This script will initialize vault\n\n# VERBOSE=1 for verbose\
    \ logging\nif [ \"x$VERBOSE\" == \"x1\" ]; then\n  set -x\nfi\n\nexport VAULT_ADDR=${VAULT_ADDR}\n\
    \n\n# Check vault is already initialized, if so return \n\n# initialize vault\n\
    vault_output=$(vault operator init) 2> /opt/openreplay/err.txt || {\n  err_code=$?\n\
    \  (cat /opt/openreplay/err.txt | grep -i \"vault is already initialized\") &&\
    \ {\n    echo \"Vault already initialized.\"\n    err_code=0\n  }\n  exit $err_code\n\
    }\n\n# Writting output to a file\necho $vault_output > /opt/openreplay/vault_creds.txt\n\
    \n# Unsealing vault\nfor i in 1 2 3; do\n  vault operator unseal `echo $vault_output\
    \ | grep -Eio \"unseal key $i: \\S+\" | awk '{print $4}'`\ndone\n\n# Logging in\
    \ to vault\nvault login  `echo $vault_output | grep -Eio \"initial root token:\
    \ \\S+\" | awk '{print $4}'`\n\n# Confguration\n\nvault secrets enable database\n\
    \nvault write database/roles/db-app \\\n  db_name=postgres \\\n  creation_statements=\"\
    CREATE ROLE \\\"{{name}}\\\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}';\
    \ \\\n      GRANT SELECT ON ALL TABLES IN SCHEMA public TO \\\"{{name}}\\\";\"\
    \ \\\n  revocation_statements=\"ALTER ROLE \\\"{{name}}\\\" NOLOGIN;\"\\\n  default_ttl=\"\
    1h\" \\\n  max_ttl=\"1d\"\n\nvault write database/config/postgres \\\n    plugin_name=postgresql-database-plugin\
    \ \\\n    allowed_roles=\"*\" \\\n    connection_url=\"postgresql://{{username}}:{{password}}@$PGHOST:$PGPORT/$PGDATABASE\"\
    \ \\\n    username=\"${PGUSER}\" \\\n    password=\"${PGPASSWORD}\"\n\nvault auth\
    \ enable kubernetes\n\nvault write auth/kubernetes/config \\\n       kubernetes_host=https://${KUBERNETES_PORT_443_TCP_ADDR}:443\
    \ \\\n       kubernetes_ca_cert=@/var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n\
    \n\n# Allow apps to create credentials for the policy db-app\ncat <<EOF >/opt/openreplay/pgaccess-policy.hcl\n\
    path \"database/creds/db-app\" {\n  capabilities = [\"read\"]\n}\nEOF\n\nvault\
    \ policy write pgaccess /opt/openreplay/pgaccess-policy.hcl\n\nvault write auth/kubernetes/role/pgaccess\
    \ \\\n    bound_service_account_names=\"*-openreplay\" \\\n    bound_service_account_namespaces=app\
    \ \\\n    policies=pgaccess \\\n    ttl=1h\n"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: databases-migrate
  namespace: local
  labels:
    app: databases
    or.workload/type: db-migrate
    helm.sh/chart: openreplay-0.1.0
    app.kubernetes.io/name: openreplay
    app.kubernetes.io/instance: openreplay
    app.kubernetes.io/version: v1.27.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/component: observability
  annotations:
    helm.sh/hook: pre-install, pre-upgrade
    helm.sh/hook-weight: '-5'
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  template:
    metadata:
      name: postgresqlMigrate
      annotations:
        linkerd.io/inject: disabled
      labels:
        app.kubernetes.io/part-of: oneinchmarket
        app.kubernetes.io/component: observability
    spec:
      initContainers:
      - name: git
        image: alpine/git:2.52.0
        env:
        - name: SKIP_PERMISSION_CHANGE
          value: 'false'
        - name: ENTERPRISE_EDITION_LICENSE
          value: ''
        command:
        - /bin/sh
        - -c
        args:
        - "set -x\nmkdir -p /opt/openreplay/openreplay && cd /opt/openreplay/openreplay\n\
          \n# Check if offline migration scripts are already available (from migration\
          \ image or mounted)\n# ## Usage:\n# Option 1: Enable offlineMigration.enabled=true\
          \ to use pre-built migration image\n# Option 2: Mount your scripts directory\
          \ to `/mnt/efs` with the following structure:\n# ```\n# /mnt/efs/\n# ├──\
          \ scripts/\n# │   ├── schema/\n# │   └── helmcharts/\n# └── ee/        \
          \   # Optional: for enterprise edition\n#     └── scripts/\n# ```\n#\n#\
          \ The job will automatically detect and use these pre-mounted scripts instead\
          \ of cloning from GitHub.\n\n# Check if migration init container already\
          \ provided files\nif [ -d \"/opt/openreplay/openreplay/scripts/schema\"\
          \ ]; then\n  echo \"[info] Offline migration detected. Schema files already\
          \ available (from migration image)\"\nelif [ -d \"/mnt/efs/scripts/schema\"\
          \ ] && [ -d \"/mnt/efs/scripts/helmcharts\" ]; then\n  echo \"[info] Offline\
          \ migration detected. Using pre-mounted scripts from /mnt/efs\"\n  cp -rf\
          \ /mnt/efs/scripts /opt/openreplay/openreplay/\n  if [ \"x$ENTERPRISE_EDITION_LICENSE\"\
          \ != \"x\" ] && [ -d \"/mnt/efs/ee/scripts\" ]; then\n    echo \"[info]\
          \ Copying enterprise scripts from /mnt/efs\"\n    mkdir -p /opt/openreplay/openreplay/ee\n\
          \    cp -rf /mnt/efs/ee /opt/openreplay/openreplay/\n  fi\n  echo \"[info]\
          \ Offline migration scripts copied successfully\"\n  # Else for an upgrade,\
          \ it won't pull the latest change. \n  # If you want offline, you can copy\
          \ it prior, and do the update.\n  rm -rf /mnt/efs/scripts\n  echo \"[info]\
          \ Offline migration scripts deleted from shared successfully\"\nelse\n \
          \ echo \"[info] No offline scripts found. Proceeding with online migration\
          \ from GitHub\"\n  \n  # Function to check if GitHub is available\n  check_github()\
          \ {\n    for i in {1..10}; do\n      if ping -c 1 github.com &> /dev/null\
          \ || wget -q --spider https://github.com; then\n        echo \"GitHub is\
          \ available.\"\n        break\n      else\n        echo \"GitHub is not\
          \ available. Retrying in 3 seconds...\"\n        sleep 3\n      fi\n   \
          \ done\n  }\n\n  check_github\n\n  # Modern sparse checkout using Git 2.25+\
          \ features with cone mode\n  # Only fetch required directories: scripts/schema,\
          \ scripts/helmcharts, ee/scripts\n  git clone --depth 1 --filter=blob:none\
          \ --sparse \\\n    https://github.com/openreplay/openreplay \\\n    -b v1.27.0\
          \ . || exit 10\n  git sparse-checkout set scripts/schema scripts/helmcharts\
          \ ee/scripts || exit 10\n  \n  ls /opt/openreplay/openreplay\n  git log\
          \ -1\nfi\n\n\n\nexit_count=0\n\nexit_count=0\nerror_connection=1\n\nwhile\
          \ [ $exit_count -le 20 ];do\n  nc -zv postgresql.db.svc.cluster.local 5432\
          \ -w 1\n  if [ $? -ne 0 ]; then\n    echo \"[info] postgresql is not up;\
          \ retrying in 5 seconds\"\n    sleep 4\n    exit_count=$(($exit_count+1))\n\
          \    echo $exit_count\n  else\n    error_connection=0\n    break\n  fi\n\
          done\n\nif [ $error_connection -eq 1 ]; then\n  echo \"[error] postgres\
          \ is not running. Check kubectl get po -n db; exiting\"\n  exit 100\nfi\n\
          \n# Checking variable is empty. Shell independant method.\nexit_count=0\n\
          error_connection=1\n\nwhile [ $exit_count -le 20 ];do\n  nc -zv clickhouse-openreplay-clickhouse.db.svc.cluster.local\
          \ 9000 -w 1\n  if [ $? -ne 0 ]; then\n    echo \"[info] clickhouse is not\
          \ up; retrying in 5 seconds\"\n    sleep 4\n    exit_count=$(($exit_count+1))\n\
          \    echo $exit_count\n  else\n    error_connection=0\n    break\n  fi\n\
          done\n\nif [ $error_connection -eq 1 ]; then\n  echo \"[error] clickhouse\
          \ is not running. Check kubectl get po -n db; exiting\"\n  exit 100\nfi\n\
          \nif [ \"x$ENTERPRISE_EDITION_LICENSE\" != \"x\" ]; then\n  echo \"Copying\
          \ enterprise code\"\n  cp -rf ee/scripts/* scripts/\nfi\necho \"Changing\
          \ RWX to proper permission\"\nif [ \"$SKIP_PERMISSION_CHANGE\" != \"true\"\
          \ ]; then\n  chown 1001:1001 /mnt/efs\nfi\n"
        volumeMounts:
        - name: shared
          mountPath: /opt/openreplay
        - name: datadir
          mountPath: /mnt/efs
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
      - name: postgres-check
        image: ghcr.io/openreplay/postgres:17
        env:
        - name: PGHOST
          value: postgresql.db.svc.cluster.local
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          value: postgres
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: or-secrets
              key: postgresql-password
        command:
        - /bin/bash
        - -c
        args:
        - "lowVersion=16.4\nhighVersion=17\npg_version=`psql -c \"SHOW server_version;\"\
          \ -t | tr -d ' '`\necho $pg_version |\\\n  awk -v pg_version=$pg_version\
          \ -v low=\"$lowVersion\" -v high=\"$highVersion\" -F. '{\n    split(low,\
          \ lowArr, \".\");\n    split(high, highArr, \".\");\n    if ($1 < lowArr[1]\
          \ ) {\n      print \"Need version \" low \" or higher. Current version:\
          \ \" pg_version;\n      exit 100\n    } else if ($1 > highArr[1]) {\n  \
          \    print \"Version \" pg_version \" is higher than the allowed maximum\
          \ version \" high \".\";\n      exit 100\n    } else if ($1 == lowArr[1]\
          \ && $2 < lowArr[2]) {\n      exit 100\n    }\n  }' || {\n  echo \"[error]\
          \ postgresql version is $pg_version which is not within the allowed range\
          \ ${lowVersion} - ${highVersion}. Exiting.\"\n  echo For upgrade steps,\
          \ refer: https://docs.openreplay.com/en/deployment/openreplay-admin/#upgrade-postgresql\n\
          \  exit 101\n}\n"
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
      - name: clickhouse-check
        image: docker.io/clickhouse/clickhouse-server:25.9-alpine
        env:
        - name: SKIP_PERMISSION_CHANGE
          value: 'false'
        - name: CH_HOST
          value: clickhouse-openreplay-clickhouse.db.svc.cluster.local
        - name: CH_PORT
          value: '9000'
        - name: CH_PORT_HTTP
          value: '8123'
        - name: CH_USERNAME
          value: default
        - name: CH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: or-secrets
              key: clickhouse-password
        - name: CH_USE_TLS
          value: 'false'
        command:
        - /bin/bash
        - -c
        args:
        - "lowVersion=25.1\nhighVersion=26\n[[ \"${CH_PASSWORD}\" != \"\" ]] && {\n\
          \  CH_PASSWORD=\"--password $CH_PASSWORD\"\n}\n[[ \"${CH_USE_TLS}\" == \"\
          true\" ]] && CH_TLS_FLAGS=\"--secure --accept-invalid-certificate\" || CH_TLS_FLAGS=\"\
          \"\nch_client=`echo clickhouse-client -h ${CH_HOST} --user ${CH_USERNAME}\
          \ ${CH_PASSWORD} --port ${CH_PORT} ${CH_TLS_FLAGS}`\necho $ch_client\nch_version=`$ch_client\
          \ -q \"SELECT version()\"`\necho $ch_version |\\\nawk -v low=\"$lowVersion\"\
          \ -v high=\"$highVersion\" '{split($1, ver, \".\");\n  split(low, lowArr,\
          \ \".\");\n  split(high, highArr, \".\");\n  if (ver[1] < lowArr[1]) {\n\
          \    # print \"Need version \" low \" or higher. Current version: \" ver[1]\
          \ \".\" ver[2];\n    exit 100\n  } else if (ver[1] > highArr[1]) {\n   \
          \ # print \"Version \" ver[1] \".\" ver[2] \" is higher than the allowed\
          \ maximum version \" high \".\";\n    exit 100\n  } else if (ver[1] == lowArr[1]\
          \ && ver[2] < lowArr[2]) {\n    exit 100\n  }\n}' || {\n  echo \"[error]\
          \ Clickhouse server version $ch_version which is not within the allowed\
          \ range >${lowVersion} - ${highVersion}.x Exiting.\"\n  echo For upgrade\
          \ steps, refer: https://docs.openreplay.com/en/deployment/openreplay-admin/#upgrade-clickhouse\n\
          \  exit 101\n}\n"
        volumeMounts:
        - name: shared
          mountPath: /opt/openreplay
        - name: datadir
          mountPath: /mnt/efs
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
      containers:
      - name: postgres
        env:
        - name: OPENREPLAY_VERSION
          valueFrom:
            configMapKeyRef:
              name: openreplay-version
              key: version
              optional: true
        - name: FORCE_MIGRATION
          value: 'false'
        - name: PREVIOUS_APP_VERSION
          value: v1.27.0
        - name: CHART_APP_VERSION
          value: v1.27.0
        - name: PGHOST
          value: postgresql.db.svc.cluster.local
        - name: PGPORT
          value: '5432'
        - name: PGDATABASE
          value: postgres
        - name: PGUSER
          value: postgres
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: or-secrets
              key: postgresql-password
        - name: SKIP_PERMISSION_CHANGE
          value: 'false'
        image: ghcr.io/openreplay/postgres:17
        command:
        - /bin/bash
        - /opt/migrations/dbops.sh
        - 'false'
        - postgresql
        volumeMounts:
        - name: shared
          mountPath: /opt/openreplay
        - name: dbmigrationscript
          mountPath: /opt/migrations/
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
      - name: minio
        image: ghcr.io/openreplay/minio:2025
        env:
        - name: OPENREPLAY_VERSION
          valueFrom:
            configMapKeyRef:
              name: openreplay-version
              key: version
              optional: true
        - name: SKIP_PERMISSION_CHANGE
          value: 'false'
        - name: FORCE_MIGRATION
          value: 'false'
        - name: UPGRADE_FRONTENT
          value: ''
        - name: PREVIOUS_APP_VERSION
          value: v1.27.0
        - name: CHART_APP_VERSION
          value: v1.27.0
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: or-secrets
              key: access-key
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: or-secrets
              key: secret-key
        - name: MINIO_HOST
          value: http://minio-headless.local.svc.cluster.local:9000
        command:
        - /bin/bash
        - /opt/migrations/dbops.sh
        - 'false'
        - minio
        volumeMounts:
        - name: shared
          mountPath: /opt/openreplay
        - name: dbmigrationscript
          mountPath: /opt/migrations/
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
      - name: clickhouse
        image: docker.io/clickhouse/clickhouse-server:25.9-alpine
        env:
        - name: OPENREPLAY_VERSION
          valueFrom:
            configMapKeyRef:
              name: openreplay-version
              key: version
              optional: true
        - name: SKIP_PERMISSION_CHANGE
          value: 'false'
        - name: FORCE_MIGRATION
          value: 'false'
        - name: PREVIOUS_APP_VERSION
          value: v1.27.0
        - name: CHART_APP_VERSION
          value: v1.27.0
        - name: CH_HOST
          value: clickhouse-openreplay-clickhouse.db.svc.cluster.local
        - name: CH_PORT
          value: '9000'
        - name: CH_PORT_HTTP
          value: '8123'
        - name: CH_USERNAME
          value: default
        - name: CH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: or-secrets
              key: clickhouse-password
        - name: CH_USE_TLS
          value: 'false'
        command:
        - /bin/bash
        - /opt/migrations/dbops.sh
        - 'false'
        - clickhouse
        volumeMounts:
        - name: shared
          mountPath: /opt/openreplay
        - name: dbmigrationscript
          mountPath: /opt/migrations/
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
      volumes:
      - name: dbmigrationscript
        configMap:
          name: db-migration-script
      - name: shared
        emptyDir: {}
      - name: datadir
        hostPath:
          path: /openreplay/storage/nfs
          type: DirectoryOrCreate
      restartPolicy: Never
