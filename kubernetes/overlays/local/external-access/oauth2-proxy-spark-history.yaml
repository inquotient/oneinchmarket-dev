# oauth2-proxy — Spark History(spark-history.oneinchmarket.local) 앞의 Keycloak 로그인 (local 전용, 2026-11-06)
#
# ★ 왜: 완료된 앱의 설정·SQL 계획·실행기 로그가 인증 없이 보였다. 쓰기 기능은 없지만 그 안에
#   버킷·경로·질의가 그대로 있다.
# ★ Spark History 에 닿는 신원을 oauth2-proxy 하나로 좁힌다(authz-external-access.yaml 의
#   allow-ext-spark-history). 이벤트 로그는 S3 에서 스스로 읽으므로 수신이 따로 없다.
# ★ 설정의 사연은 oauth2-proxy-spark-ui.yaml 머리말과 같다(scope · CA · hostAliases · 그룹).
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-spark-history
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: spark-history
    app.kubernetes.io/component: external-access
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  selector:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: spark-history
  ports:
    - name: http
      port: 4180
      targetPort: 4180
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-spark-history
  labels:
    app.kubernetes.io/name: oauth2-proxy
    app.kubernetes.io/instance: spark-history
    app.kubernetes.io/component: external-access
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy
      app.kubernetes.io/instance: spark-history
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy
        app.kubernetes.io/instance: spark-history
        app.kubernetes.io/component: external-access
        app.kubernetes.io/part-of: oneinchmarket
    spec:
      serviceAccountName: oauth2-proxy
      automountServiceAccountToken: false
      hostAliases:
        - ip: "192.168.0.103"
          hostnames: ["keycloak.oneinchmarket.local"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
          args:
            - --http-address=0.0.0.0:4180
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://keycloak.oneinchmarket.local/realms/oneinchmarket
            - --provider-ca-file=/certs/ca.crt
            - --client-id=oauth2-proxy-spark-history
            - --redirect-url=https://spark-history.oneinchmarket.local/oauth2/callback
            - --code-challenge-method=S256
            # ★ keycloak-oidc 의 기본 scope 는 `openid email profile groups` 인데 이 realm 에는
            #   `groups` client scope 가 없어 Keycloak 이 `invalid_scope` 로 거부한다(실측). 그룹은
            #   scope 가 아니라 클라이언트의 groups 매퍼가 토큰에 넣으므로 scope 에서 뺀다.
            - --scope=openid email profile
            - --allowed-group=platform
            - --email-domain=*
            - --upstream=http://spark-history-headless:18080/
            - --reverse-proxy=true
            - --cookie-secure=true
            - --cookie-name=_oim_spark_history
            - --skip-provider-button=true
            - --silence-ping-logging=true
          env:
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom: {secretKeyRef: {name: oauth2-proxy-secret, key: spark-history-client-secret}}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom: {secretKeyRef: {name: oauth2-proxy-secret, key: spark-history-cookie-secret}}
          ports:
            - {name: http, containerPort: 4180}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits:   {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /ping, port: 4180}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: 4180}
            periodSeconds: 20
          volumeMounts:
            - name: gateway-ca
              mountPath: /certs
              readOnly: true
      volumes:
        - name: gateway-ca
          secret:
            secretName: gateway-ca-cert
            items:
              - key: ca.crt
                path: ca.crt
