# SafeLine 콘솔 — mgt 1443. ★ 이것은 WAF 의 **관리 콘솔**이고, 보호 대상
#   트래픽 경로(`api` 호스트 -> safeline:8181)와는 다른 포트다. 둘을 헷갈리면
#   "WAF 가 죽었다" 로 읽는다.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: ext-tls-safeline-mgt
  labels:
    app.kubernetes.io/name: ext-tls-safeline-mgt
    app.kubernetes.io/component: external-access
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  host: safeline-mgt.local.svc.cluster.local
  trafficPolicy:
    portLevelSettings:
      - port:
          number: 1443
        tls:
          mode: SIMPLE
          insecureSkipVerify: true
          sni: safeline-mgt
