# 외부 진입 신원에 대한 **추가** 인가 (local 전용)
#
# ★★★ 기존 정책을 고치지 않는다 — 이유가 둘이다.
#   ① Istio 의 ALLOW 는 **합집합**이다. 같은 워크로드를 선택하는 ALLOW 정책이
#      여럿이면 어느 하나가 매칭하면 통과한다. 그래서 더하는 것으로 충분하다.
#   ② 기존 `allow-database-access` 의 `rules` 배열을 전략 병합 패치로 고치면
#      **배열이 통째로 교체**되어 principals 21개를 잃는다(Gotcha 146 과 같은
#      뿌리 — 리스트 병합의 함정이다). 더하는 쪽이 되돌리기도 쉽다.
#
# ★★ 왜 이것이 없으면 안 되는가
#   실측(2026-10-11) AuthorizationPolicy 가 선택하는 워크로드는 **12개**다:
#     allow-database-access      -> clickhouse-0 mariadb-0 mongodb-0
#                                   postgresql-0 proxysql redis-0 shardingsphere
#     allow-messaging-access     -> kafka-0
#     allow-observability-access -> opensearch-0
#     allow-datalakehouse-access -> minio-0
#     spark-connect-authz        -> spark-connect-0
#     allow-data-prepper-access  -> data-prepper
#     api-require-jwt            -> 게이트웨이 자신
#   **나머지 UI 전부에는 L7 정책이 없다** — 그래서 HTTPRoute 만으로 닿는다.
#   여기 적힌 것만 신원을 따로 허용해야 한다.
#
# ★ 신원 표기는 접미 매칭 `*/sa/<이름>` 이다. 중간 `*` 는 리터럴이라
#   아무것도 매칭하지 않는다(Gotcha 9). base 는 네임스페이스를 모르므로
#   이 레포는 어디서나 이 형태를 쓴다.
#
# ★ 게이트웨이의 신원은 `sa/ingress-istio` 다 — Istio 의 게이트웨이
#   컨트롤러가 Gateway API 의 Gateway 로부터 만든 Deployment 의 SA 이름이고,
#   실측으로 Envoy 가 백엔드에 제시하는 principal 이 그것이다.
#
# ★ 권한을 미리 넓혀 두지 않는다 — 쓰지 않는 신원은 넣지 않는다. 예컨대
#   DB 포트에 게이트웨이를 넣지 않는다(DB 와이어는 HTTP 가 아니라 거기로
#   보낼 수가 없다). 사유가 사라진 허용을 남기면 다음 사람이 전제를 틀리게
#   읽는다(Gotcha 131).
---
# minio — 콘솔(9001)과 S3 API(9000). 브라우저와 mc/boto3 둘 다 게이트웨이를
#   지난다(S3 는 HTTP 프로토콜이고 서명이 자격이다).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ext-minio
  labels:
    app.kubernetes.io/name: allow-ext-minio
    app.kubernetes.io/component: external-access
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  selector:
    matchLabels:
      # MinIO·SeaweedFS 공통(2026-11-07) — S3 엔진을 바꿔도 정책은 그대로다.
      oneinchmarket.io/object-store: s3
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["*/sa/ingress-istio"]
      to:
        - operation:
            ports: ["9000"]
---
# opensearch — REST 9200. ★ HTTPS 다. 게이트웨이가 TLS 를 오리지네이션하고
#   (destinationrules.yaml) 그 위에 HBONE 이 한 겹 더 씌워진다.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ext-opensearch
  labels:
    app.kubernetes.io/name: allow-ext-opensearch
    app.kubernetes.io/component: external-access
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: opensearch
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["*/sa/ingress-istio"]
      to:
        - operation:
            ports: ["9200"]
---
# spark-connect — ★ 여기가 가장 틀리기 쉬운 자리다.
#   `spark-connect-authz` 는 15002·7078·7079 만 `to.ports` 에 적는다. 즉
#   **4040(세션 UI)은 어느 규칙에도 매칭되지 않아 거부된다.** 포트를 빠뜨린
#   ALLOW 정책이 그 포트를 닫는 것이고, 이 레포는 ShardingSphere 3307 에서
#   같은 것을 이미 겪었다(Gotcha 9 — 파드는 1/1 Running 이고 클라이언트가
#   보는 것은 끊김뿐이었다).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ext-spark-connect
  labels:
    app.kubernetes.io/name: allow-ext-spark-connect
    app.kubernetes.io/component: external-access
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-connect
  action: ALLOW
  rules:
    # 세션 UI — oauth2-proxy(Keycloak 로그인)만 (2026-11-06).
    #   ★ 게이트웨이(`*/sa/ingress-istio`)를 여기 다시 넣지 말 것 — 넣으면 HTTPRoute 하나만
    #     되돌려도 로그인 없이 세션 UI(Job 강제 종료 가능)가 열린다(oauth2-proxy-spark-ui.yaml).
    - from:
        - source:
            principals: ["*/sa/oauth2-proxy"]
      to:
        - operation:
            ports: ["4040"]
    # gRPC — db-gateway(PySpark 클라이언트)
    - from:
        - source:
            principals: ["*/sa/db-gateway"]
      to:
        - operation:
            ports: ["15002"]
---
# 데이터베이스 — db-gateway 만 허용한다.
# ★ 셀렉터는 기존 `allow-database-access` 와 **같은 축**(component=database)을
#   쓴다 — 실측으로 그것이 clickhouse·mariadb·mongodb·postgresql·proxysql·
#   redis·shardingsphere 를 고른다. 다른 축을 쓰면 하나가 조용히 빠진다.
# ★ 라벨 변환기가 Istio CRD 의 `spec.selector.matchLabels` 에는 `environment`
#   를 주입하지 않는다 — 실측으로 기존 정책의 셀렉터에 그것이 없다(Gotcha 185
#   가 경고한 주입은 NetworkPolicy 의 `podSelector` 쪽이다).
#   ★ 그래도 렌더 결과를 눈으로 확인할 것 — 파일에 쓴 값이 렌더 결과라고
#     가정하지 말 것(Gotcha 67).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ext-databases
  labels:
    app.kubernetes.io/name: allow-ext-databases
    app.kubernetes.io/component: external-access
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: database
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["*/sa/db-gateway"]
      to:
        - operation:
            # 5432 PostgreSQL · 3306 MariaDB · 3307 ShardingSphere(PG 와이어)
            # 6033 ProxySQL(MySQL 와이어) · 27017 MongoDB · 6379 Redis
            # 8123 ClickHouse HTTP · 9000 ClickHouse native
            ports: ["5432", "3306", "3307", "6033", "27017", "6379",
                    "8123", "9000"]
---
# 과금 호스트는 Keycloak realm 이 발급한 토큰만 받는다 — DENY 다.
#
# ★ 왜 필요한가: `requestauthentication-external.yaml` 이 Backstage 발급
#   토큰도 게이트웨이가 인정하게 했다(포털 API 호출을 위해서). 그런데
#   `api-require-jwt` 는 `requestPrincipals: ["*"]` 라 **유효한 토큰이면 아무
#   발급자나** 과금 호스트를 통과시킨다. Backstage 토큰에는 tenant 클레임이
#   없어 `outputClaimToHeaders` 가 `x-oim-tenant` 를 덮지 못하므로, 포털
#   사용자가 그 토큰 + 위조한 헤더로 남의 회사에 청구를 떠넘길 수 있다.
#
# ★★ ALLOW 를 고치지 않고 DENY 를 더한다 — DENY 가 ALLOW 보다 먼저
#   평가되고, base 의 `rules` 배열을 덮어쓰면 통째로 교체된다(위 ★★★ ②).
#   `notRequestPrincipals` 는 토큰 없는 요청(principal 없음)에도 매칭하므로
#   그것도 여기서 거부된다 — api-require-jwt 가 이미 거부하던 것이라
#   동작이 바뀌지 않는다.
# ★ principal 표기는 `<iss>/<sub>` 이고 접두 매칭(`abc*`)만 쓴다(Gotcha 9).
# ★ 적용 때 istioctl 이 경고한다 — "HTTP 속성만 쓰는 DENY 는 범위 안의 TCP
#   포트를 전부 거부한다". 게이트웨이 리스너는 HTTP 80 · HTTPS 443(종단 후
#   HTTP) 뿐이라 해당 포트가 없다(2026-11-02 실측 `proxy-config listener`).
#   **TCP·TLS 패스스루 리스너를 더하는 날** 이 정책에 `ports` 를 줄 것 —
#   안 그러면 그 리스너가 통째로 막힌다.
# ★ 새 발급자를 게이트웨이에 더할 때는 여기를 함께 볼 것 — 과금에 쓰일
#   발급자이면 이 목록에, 아니면 그대로 둔다.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: api-only-realm-issuers
  labels:
    app.kubernetes.io/name: api-only-realm-issuers
    app.kubernetes.io/component: external-access
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: ingress
  action: DENY
  rules:
    - from:
        - source:
            notRequestPrincipals:
              - "http://keycloak-headless:8080/realms/oneinchmarket/*"
              - "https://keycloak.oneinchmarket.local/realms/oneinchmarket/*"
      to:
        - operation:
            hosts: ["api.oneinchmarket.local", "api.oneinchmarket.local:*"]
---
# Zilla(HTTP·SSE -> Kafka)는 Keycloak realm 토큰이 있어야 한다 — DENY 다.
#
# ★ 왜: Zilla 는 HTTP 로 Kafka(`edge.events`)에 **쓴다**. 인증 없이 두면 LAN 의
#   누구나 이벤트를 넣는다. Zilla 자체에는 인증을 두지 않고 게이트웨이에서 막는다
#   (api-only-realm-issuers 와 같은 모양 — ALLOW 의 rules 를 덮지 않으려고 DENY).
#   `notRequestPrincipals` 는 토큰 없는 요청에도 매칭하므로 무토큰은 403 이다.
# ★★ 과금: 이 게이트웨이의 계량 로그는 모든 호스트에 걸리고(Telemetry
#   `filter: "true"`) 과금 feature 는 route 로 거르지 않는다 — `tenant` 클레임이
#   있는 토큰으로 Zilla 를 부르면 **그 테넌트의 사용량**이 된다. Zilla 는 API 라
#   그것이 맞다고 보았고, 시험은 그 경로를 피해 클러스터 안에서 했다(Gotcha 23).
# ★ 리스너가 HTTP 뿐이라 "TCP 포트 전부 거부" 경고는 해당 없음(위 정책과 같다).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: zilla-require-realm-jwt
  labels:
    app.kubernetes.io/name: zilla-require-realm-jwt
    app.kubernetes.io/component: external-access
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: ingress
  action: DENY
  rules:
    - from:
        - source:
            notRequestPrincipals:
              - "http://keycloak-headless:8080/realms/oneinchmarket/*"
              - "https://keycloak.oneinchmarket.local/realms/oneinchmarket/*"
      to:
        - operation:
            hosts: ["zilla.oneinchmarket.local", "zilla.oneinchmarket.local:*"]
---
# Livy — oauth2-proxy(Keycloak 로그인)와 Livy 가 띄운 드라이버만 (2026-11-06).
#   ★ 전에는 Livy 를 선택하는 ALLOW 정책이 없어 메시 안 누구나·게이트웨이가 8998 에 닿았다.
#     HTTPRoute 를 oauth2-proxy 로 옮기는 것만으로는 게이트웨이의 직접 경로가 남는다.
#   ★★ 드라이버 규칙에 포트를 적지 않는다 — cluster 모드 드라이버(SA spark-driver)는 Livy 의
#     RSC 서버로 되돌아오는데 그 포트는 Livy 가 범위 안에서 고른다. 포트를 적으면 세션이
#     기동 단계에서 끊긴다(Gotcha 9 — 포트를 빠뜨린 ALLOW 가 그 포트를 닫는다).
#   ★ kubelet 프로브와 kubectl port-forward 는 ztunnel 을 거치지 않아 이 정책과 무관하다.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ext-livy
  labels:
    app.kubernetes.io/name: allow-ext-livy
    app.kubernetes.io/component: external-access
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: livy
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["*/sa/oauth2-proxy"]
      to:
        - operation:
            ports: ["8998"]
    - from:
        - source:
            principals: ["*/sa/spark-driver"]
---
# Spark History — oauth2-proxy 만 (2026-11-06). 이벤트 로그는 History 가 S3 에서 스스로 읽으므로
#   다른 수신이 없다(클러스터 안 호출자 0 — 레포 전수로 확인).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ext-spark-history
  labels:
    app.kubernetes.io/name: allow-ext-spark-history
    app.kubernetes.io/component: external-access
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: spark-history
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["*/sa/oauth2-proxy"]
      to:
        - operation:
            ports: ["18080"]
---
# seaweedfs 관리 콘솔(weed admin, 12535) — 사람은 oauth2-proxy(Keycloak 로그인) 뒤로만 온다.
#   이 파드는 allow-datalakehouse-access(9000)가 이미 고르므로 ALLOW 가 없으면 거부다(Gotcha 9).
#   ★ 게이트웨이 신원은 넣지 않는다 — deny-gateway-direct-seaweedfs 가 직접 경로를 한 번 더 막는다.
#   ★ 워커 gRPC(22535)는 아무에게도 열지 않는다 — 인증 없이 워커 등록을 받는다.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ext-seaweedfs-admin
  labels:
    app.kubernetes.io/name: allow-ext-seaweedfs-admin
    app.kubernetes.io/component: external-access
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: seaweedfs
  action: ALLOW
  rules:
    - from:
        - source:
            principals: ["*/sa/oauth2-proxy"]
      to:
        - operation:
            ports: ["12535"]
