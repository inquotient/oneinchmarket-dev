    spec:
      serviceAccountName: oauth2-proxy
      automountServiceAccountToken: false
      hostAliases:
        - ip: "192.168.0.103"
          hostnames: ["keycloak.oneinchmarket.local"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.6
          args:
            - --http-address=0.0.0.0:4180
            - --provider=keycloak-oidc
            - --oidc-issuer-url=https://keycloak.oneinchmarket.local/realms/oneinchmarket
            - --provider-ca-file=/certs/ca.crt
            - --client-id=oauth2-proxy-hbase-rs
            - --redirect-url=https://hbase-rs.oneinchmarket.local/oauth2/callback
            - --code-challenge-method=S256
            - --scope=openid email profile
            - --allowed-group=platform
            - --email-domain=*
            - --upstream=http://hbase-regionserver:16030/
            - --reverse-proxy=true
            - --cookie-secure=true
            - --cookie-name=_oim_hbase_rs
            - --skip-provider-button=true
            - --silence-ping-logging=true
