            requests: {cpu: 10m, memory: 32Mi}
            limits:   {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /ping, port: 4180}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ping, port: 4180}
            periodSeconds: 20
          volumeMounts:
            - name: gateway-ca
              mountPath: /certs
              readOnly: true
      volumes:
        - name: gateway-ca
          secret:
            secretName: gateway-ca-cert
            items:
              - key: ca.crt
                path: ca.crt
