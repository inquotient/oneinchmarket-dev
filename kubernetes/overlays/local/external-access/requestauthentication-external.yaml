# 외부 이름으로 발급된 Keycloak 토큰도 게이트웨이가 인정한다 — local 전용
#
# ★ 증상(2026-11-02): Backstage OIDC 로그인이 끝 단계에서
#     Authentication failed, invalid_token
#   백엔드가 토큰 교환 뒤 userinfo 를 `https://keycloak.oneinchmarket.local`
#   (게이트웨이 경유)로 부르는데 게이트웨이가 401 을 줬다. 본문이
#     Jwt issuer is not configured
#   로 **Keycloak 이 아니라 Envoy 의 문구**다. 같은 토큰을 Keycloak 에
#   직접 보내면 받아들인다.
#
# ★★ 기전: `base/service-mesh/api-jwt.yaml` 은 게이트웨이 **전체**를 선택하고
#   issuer 가 클러스터 안 이름(`http://keycloak-headless:8080/...`) 하나뿐이다.
#   Istio 는 토큰이 **있는데** issuer 가 어느 규칙에도 없으면 호스트와
#   상관없이 401 을 준다. 외부 진입점이 생기면서 `iss` 가
#   `https://keycloak.oneinchmarket.local/...` 인 토큰이 생겼고(브라우저 ·
#   Backstage 처럼 그 이름으로 Keycloak 을 보는 쪽), 그런 토큰을 단 요청은
#   **어느 호스트로 가든** 게이트웨이에서 막힌다.
#
# ★ base 를 고치지 않고 별도 정책을 둔다. 같은 워크로드를 고르는
#   RequestAuthentication 여럿은 Istio 가 합친다. base 의 `jwtRules` 는
#   병합 키가 없는 CRD 목록이라 오버레이 patch 로 덮으면 **통째로 교체**된다
#   — 원래 규칙을 다시 적어야 하고 어긋나도 아무도 알려주지 않는다.
#   그리고 호스트명 체계는 랩의 결정이라 base 에 둘 것이 아니다.
#
# ★★★ `outputClaimToHeaders` 를 base 와 **똑같이** 둘 것. 빠뜨리면 외부
#   issuer 토큰을 단 과금 요청에서 클라이언트가 보낸 `x-oim-tenant` 가
#   덮이지 않고 남는다 — 아무나 남의 회사에 청구를 떠넘기는 구멍이
#   다시 열린다(api-jwt.yaml 머리말이 막으려는 바로 그것).
#
# ★ 신뢰 범위는 넓어지지 않는다 — 같은 realm 이고 **같은 서명 키(JWKS)** 다.
#   이름만 다를 뿐 같은 발급자다.
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: api-jwt-external
  annotations:
    argocd.argoproj.io/sync-wave: "8"
  labels:
    app.kubernetes.io/name: api-jwt-external
    app.kubernetes.io/component: service-mesh
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: ingress
  jwtRules:
    - issuer: "https://keycloak.oneinchmarket.local/realms/oneinchmarket"
      # istiod 가 가져가므로 FQDN 이어야 한다(Gotcha 17).
      jwksUri: "http://keycloak-headless.local.svc.cluster.local:8080/realms/oneinchmarket/protocol/openid-connect/certs"
      outputClaimToHeaders:
        - header: "x-oim-tenant"
          claim: "tenant"
      # ★★ true 여야 한다 — 기본값 false 면 게이트웨이가 검증 뒤
      #   `Authorization` 을 **떼어 버려** Keycloak 이 토큰 없는 userinfo 를 받는다.
      #   실측: issuer 를 더한 뒤에도 401 이었는데 이번에는 Envoy 가 아니라
      #   Keycloak 의 것(`x-envoy-upstream-service-time` · realm="oneinchmarket")
      #   이었고, 같은 토큰을 직접 보내면 200 이었다. 오류 문구가
      #   `invalid_token` -> `expected 200 OK, got: 401` 로 바뀐 지점이 층의 경계다.
      #   이 issuer 의 소비자는 외부 이름으로 Keycloak 을 보는 쪽(브라우저·
      #   Backstage)이고 그들은 토큰을 **Keycloak 자신에게** 다시 보낸다.
      #   base 의 api-jwt 는 false 그대로다(내부 issuer 경로는 바꾸지 않는다).
      forwardOriginalToken: true
    # ── Backstage 가 스스로 발급하는 사용자 토큰 ─────────────────────────────
    # ★ 증상(2026-11-02, 로그인 직후): "Failed to load entity kinds ·
    #   Failed to fetch user settings, Request failed with 401".
    #   로그인 뒤 프런트는 **Backstage 자신이 발급한** 토큰(ES256,
    #   iss=https://backstage.oneinchmarket.local/api/auth, aud=backstage)을
    #   `Authorization` 에 실어 /api/catalog 등을 부른다. 게이트웨이가 그 issuer
    #   를 몰라 `Jwt issuer is not configured` 로 막았다. 같은 토큰을 파드에
    #   직접 보내면 200 이다. port-forward 시절에는 게이트웨이를 안 거쳐
    #   드러나지 않았다.
    # ★ `outputClaimToHeaders` 가 없다 — 이 토큰에는 tenant 클레임이 없다.
    #   그래서 이 토큰이 **과금 호스트에 쓰이지 못하게** 하는 DENY 정책을
    #   함께 둔다(authz-external-access.yaml 의 api-only-realm-issuers).
    #   그것이 없으면 포털 사용자가 이 토큰 + 위조한 x-oim-tenant 로
    #   api-require-jwt(requestPrincipals "*")를 통과할 수 있다.
    # ★★ JWKS 는 **istiod 가** 가져간다 — 메시 밖이라 평문 7007 이 필요하고
    #   default-deny 에 막힌다(Gotcha 17). netpol-external-access.yaml 의
    #   allow-backstage-jwks 가 그 길이다. 빠뜨리면 증상이 그대로(401)이고
    #   단서는 istiod 로그에만 있다.
    - issuer: "https://backstage.oneinchmarket.local/api/auth"
      jwksUri: "http://backstage-headless.local.svc.cluster.local:7007/api/auth/.well-known/jwks.json"
      forwardOriginalToken: true
