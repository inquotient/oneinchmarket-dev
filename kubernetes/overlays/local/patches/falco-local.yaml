# Falco 는 이 WSL2 커널에서 기동하지 못한다.
#   Falco: An error occurred in an event source, forcing termination...
#          Error: Initialization issues during scap_init
#
# ★ 2026-09-04 재조사 — 원래 적어 두었던 사유("modern_ebpf 가 WSL2 커널의
#   요구 조건을 만족하지 못하는 것으로 보인다")는 **추정이었고 틀렸다.**
#   커널은 조건을 만족한다:
#
#     커널       6.18.33.2-microsoft-standard-WSL2  (modern_ebpf 요구 5.8+)
#     BTF        /sys/kernel/btf/vmlinux  6.6 MB    존재
#     커널 설정  CONFIG_BPF_SYSCALL / DEBUG_INFO_BTF / BPF_JIT /
#                BPF_EVENTS / FTRACE_SYSCALLS / HAVE_SYSCALL_TRACEPOINTS = y
#     반증       **Tetragon 이 같은 커널에서 CO-RE eBPF 로 돈다** —
#                BTF 로드 성공, generic_kprobe·fentry·lsm·tracepoint 전부 등록
#
# ★ 그리고 그 기록은 **다른 실패를 가리고 있었다.** 레이블을 붙여 실제로
#   띄워 보니 첫 오류는 scap_init 이 아니라 이것이었다:
#
#     Error: could not initialize inotify handler
#
#   fs.inotify.max_user_instances 가 128 인데 이미 약 145 개가 쓰이고 있었다.
#   Falco 만의 문제가 아니라 **inotify 를 쓰는 다른 워크로드도 조용히 실패할
#   수 있는 상태**였다. /etc/sysctl.d/99-inotify.conf 로 1024 로 올려 해소했다.
#
# ★ 그 뒤에야 scap_init 실패에 도달한다. **원인을 특정했다**(strace + libs 로거).
#
#     bpf(BPF_PROG_LOAD, {prog_type=BPF_PROG_TYPE_TRACING,
#                         prog_name="sys_exit",
#                         expected_attach_type=BPF_TRACE_RAW_TP,
#                         attach_btf_id=28947, insn_cnt=247})
#         = -1 EINVAL (Invalid argument)
#
#   그리고 **검증기는 통과했다.** 거부 사유가 한 줄도 없다:
#
#     libbpf: prog 'sys_exit': -- BEGIN PROG LOAD LOG --
#     processed 606 insns (limit 1000000) max_states_per_insn 4 ...
#     -- END PROG LOAD LOG --
#     libbpf: prog 'sys_exit': failed to load: -22
#
#   즉 프로그램 로직이 아니라 **attach 검증 단계**에서 거부된다.
#   `sys_exit` 은 tail call 테이블(syscall_exit_tail_table, PROG_ARRAY)을 쓰는
#   프로그램이고, 같은 오브젝트의 다른 TRACING 프로그램들은 전부 정상 적재되며
#   맵 바인딩까지 성공한다. CO-RE 재배치도 정상이다(6.2+ 의 mm_struct 변종까지
#   맞춰 잡는다). 필요한 tracepoint 도 전부 있다 —
#   raw_syscalls/sys_enter=369 · sys_exit=368 · sched_process_exit=295 등.
#
#   ★ 정리하면 **커널 기능의 부재가 아니라 버전 간 비호환**이다.
#       Falco 0.39.2 / libs 0.18.2   (이미지 latest 가 2024-11-21 이후 미갱신)
#       WSL2 커널 6.18.33.2
#     2024년판 프로브가 2026년판 커널의 raw tracepoint attach 규약을 만족하지
#     못한다.
#
# ★ 고칠 수 없다 — 그리고 그 이유도 확인했다.
#     - **더 새 Falco 가 없다.** falcosecurity/falco-no-driver 의 최신 태그가
#       0.39.2 다
#     - **레거시 eBPF 프로브·kmod 는 커널 헤더가 필요한데 없다.**
#       /lib/modules/$(uname -r)/build 부재, linux-headers 패키지 후보도 없다.
#       Microsoft 의 WSL2 커널 소스를 받아 빌드하는 길은 남아 있으나,
#       아래 Tetragon 대안을 생각하면 균형이 맞지 않는다
#
# 스케줄되지 않는 nodeSelector 로 로컬에서만 비활성한다. 매니페스트를 지우지
# 않으므로 dev/prod 에는 영향이 없고, 조건이 갖춰지면 레이블만 붙이면 된다.
#
# ★ 실무적으로 막다른 길은 아니다. ADR-025 가 Falco → Tetragon 전환을
#   제안하고 있고 Tetragon 은 **이 커널에서 실제로 동작한다.** 로컬에 런타임
#   탐지가 없는 것이 아니라 구현체가 다른 것이다.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: falco
spec:
  template:
    spec:
      nodeSelector:
        oneinchmarket.local/falco-supported: "true"
