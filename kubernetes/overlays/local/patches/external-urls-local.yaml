# 브라우저가 부르는 주소 — 외부 진입점 기준으로 덮는다 (local 전용)
#
# ★★★ 왜 이 다섯만인가
#   호스트명 기반 노출(`<app>.oneinchmarket.local`)로 가면 **대다수 앱은 설정
#   변경 없이 그대로 동작한다** — 경로가 `/` 그대로라 base-path 를 고칠 일이
#   없다. 고쳐야 하는 것은 **SPA** 뿐이다: 브라우저가 백엔드를 직접 부르므로
#   그 주소가 서버 설정에 박혀 있고, 그것이 `localhost` 면 외부에서 흰 화면이
#   된다(Apicurio UI 에서 이미 겪었다 — 화면은 뜨고 목록만 비어 보인다).
#
#   실측으로 환경변수에 `localhost` 를 들고 있는 워크로드를 전수 조사했고,
#   사람이 브라우저로 보는 것은 아래 다섯이었다. 나머지 `localhost` 는
#   파드 안쪽 자기 호출이다(safeline 의 `127.0.0.1:8000`, openbao 의
#   `BAO_ADDR`, pyrra 의 `--api-url` 등) — **건드리면 깨진다.**
#
# ★★ 이 파일은 `apicurio-ui-local.yaml` 을 대체한다. 그 파일의 주석이
#   "진입점이 생기면 이 패치를 지우고 실제 외부 URL 로 바꾼다" 고 적어 두었고,
#   그 조건이 2026-10-11 에 충족됐다. 같은 성질의 값을 한 곳에 모아 둔다 —
#   여러 파일에 흩어 두면 호스트 체계를 바꿀 때 하나가 조용히 남는다
#   (Gotcha 117 과 같은 자리).
#
# ★ 대가: 이 값들은 **port-forward 용 주소였다.** 바꾸면 ACCESS.md 가 안내하는
#   port-forward 경로가 그만큼 깨진다 — 브라우저가 `localhost:8081` 대신
#   `apicurio-registry.oneinchmarket.local` 을 부르게 되므로, port-forward 만
#   띄우고 hosts/DNS 를 안 하면 목록이 비어 보인다. 그 사실을 ACCESS.md 에
#   적어 두었다. 둘 다 되게 하려면 앱마다 CORS·다중 origin 설정이 필요하고
#   그것은 앱마다 다르다 — 하나를 고르는 쪽이 정직하다.
#
# ★ env 는 전략 병합에서 **name 을 키로 병합**되므로 값만 덮인다. 다른 env 를
#   잃지 않는다(배열이 통째로 교체되는 Gotcha 146 의 반대 성질이다).
# ★★★ 2026-10-11 정정 — **다섯이 아니라 여섯이고, 여섯째를 조사가 놓쳤다.**
#   위 "환경변수 전수 조사" 는 Deployment·StatefulSet 의 **컨테이너 `env`** 만
#   셌다. Airflow 의 같은 값은 `envFrom: {configMapRef: airflow-env}` 로
#   들어오므로 그 그물에 걸리지 않았고, 외부 진입점이 선 뒤 **Airflow 만
#   로그인이 되지 않았다**(아래 마지막 패치).
#   ★ 다시 셀 때는 ConfigMap 의 `data` 까지 볼 것. 그렇게 센 결과(실측):
#       ConfigMap data 에 localhost 를 든 값   1건  -> airflow-env (이것)
#       Deployment env 에 localhost 를 든 값   6건  -> safeline 4 · openbao 2
#                                                     (전부 파드 안쪽 자기 호출)
#   ★★ **세는 범위를 틀리면 0건이 안심이 된다** — 이 레포가 거듭 적은
#     "측정값이 이상하면 측정 방법부터" 의 한 겹 더다(Gotcha 187·198).
---
# Apicurio Registry UI — 브라우저가 레지스트리 API 를 직접 부른다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio-ui
spec:
  template:
    spec:
      containers:
        - name: apicurio-ui
          env:
            - name: REGISTRY_API_URL
              value: "https://apicurio-registry.oneinchmarket.local/apis/registry/v3"
---
# Apicurio Registry — 위 UI 의 짝이다. ★ UI 주소만 바꾸고 이것을 빠뜨려
#   UI 가 "Connection to the Registry server failed (could not reach the
#   server)" 를 냈다. 이미지 기본값이 `quarkus.http.cors.origins=
#   http://localhost:8888,http://127.0.0.1:8888` 이라(jar 의
#   application.properties 실측) 다른 Origin 은 **403** 이고, 브라우저는
#   CORS 실패를 "닿지 않는다" 로만 보고한다. Origin 없는 curl 은 200 이라
#   API 가 멀쩡해 보인다 — 판정은 `-H "Origin: https://apicurio.…"` 를 붙여서.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apicurio-registry
spec:
  template:
    spec:
      containers:
        - name: apicurio-registry
          env:
            - name: QUARKUS_HTTP_CORS_ORIGINS
              value: "https://apicurio.oneinchmarket.local"
---
# Backstage — 외부 진입점에서 Keycloak OIDC 로그인이 되게 한다.
#
# ★ 증상: `/api/auth/oidc/start` 가 403
#     NotAllowedError: Origin 'https://backstage.oneinchmarket.local' is not allowed
#   auth 백엔드는 팝업을 연 Origin 을 `app.baseUrl` 과 대조하는데 그 값이
#   port-forward 주소(`http://localhost:17007`)였다.
#
# ★★ Origin 만 고치면 다음 단계에서 깨진다(EXTERNAL-ACCESS §6 이 미뤄 둔 것).
#   브라우저는 Keycloak 을 `https://keycloak.oneinchmarket.local` 로 보고
#   (게이트웨이 경유 메타데이터의 issuer 가 그것이다 — KC_PROXY_HEADERS=
#   xforwarded), 백엔드는 `http://keycloak-headless:8080` 으로 봐서 `iss` 가
#   갈린다(Gotcha 69·136). 그래서 **백엔드도 외부 이름으로** 보게 한다:
#     ① hostAliases — 그 이름을 externalIP(노드 103)로 푼다. 브라우저와
#        **같은 경로**(externalIP -> 게이트웨이 -> keycloak)라 issuer 가 같다.
#        CoreDNS 오버라이드보다 범위가 좁다(이 파드 하나, kube-system 무관).
#     ② NODE_EXTRA_CA_CERTS — 게이트웨이 인증서는 자체 CA 가 발급한다.
#        ★ Secret 에 CA **개인키(tls.key)도 들어 있다** — `items` 로 ca.crt
#        하나만 투영할 것. 통째로 마운트하면 포털 파드가 CA 를 위조할 수 있다.
#   실측(2026-11-02, 파드 안 node): 192.168.0.103 + SNI keycloak.… + 이 CA
#     -> 200, issuer https://keycloak.oneinchmarket.local/realms/oneinchmarket
#
# ★ 설정은 `APP_CONFIG_<경로>` 환경변수로 덮는다 — app-config 는 ConfigMap 안
#   리터럴 블록이라 오버레이가 부분 패치할 수 없다. 프런트 번들도 이 값을
#   받는다(백엔드가 기동 때 static 파일에 주입한다 — 그래서 rootfs 가 쓰기 가능).
# ★ 대가: port-forward(17007) 로는 로그인이 안 된다 — Apicurio 와 같은 선택.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
spec:
  template:
    spec:
      hostAliases:
        - ip: "192.168.0.103"
          hostnames: ["keycloak.oneinchmarket.local"]
      containers:
        - name: backstage
          env:
            - name: APP_CONFIG_app_baseUrl
              value: "https://backstage.oneinchmarket.local"
            - name: APP_CONFIG_backend_baseUrl
              value: "https://backstage.oneinchmarket.local"
            - name: APP_CONFIG_backend_cors_origin
              value: "https://backstage.oneinchmarket.local"
            - name: APP_CONFIG_auth_providers_oidc_production_metadataUrl
              value: "https://keycloak.oneinchmarket.local/realms/oneinchmarket/.well-known/openid-configuration"
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/oim-gateway-ca/ca.crt
            # ★★ 사용자 토큰 서명 키를 고정한다(2026-11-03).
            #   증상: 로그인 직후 "Failed to load entity kinds · Failed to fetch
            #   user settings, 401". 게이트웨이 응답이 50바이트
            #   `Jwks doesn't have key to match kid or alg from Jwt` 였다.
            #   기본(database) 키 저장소는 토큰 수명(1h)마다 **새 kid** 로 키를
            #   만들고 즉시 그것으로 서명하는데, 게이트웨이는 istiod 가 가져가
            #   캐시한 JWKS(PILOT_JWT_PUB_KEY_REFRESH_INTERVAL 기본 20분)로
            #   검증한다 — 회전 직후 최대 20분 동안 포털 API 전부가 401 이다.
            #   그 사이 Backstage 백엔드 로그에는 401 이 한 줄도 없다(파드에
            #   닿지 않는다). 25bc656 이 게이트웨이에 이 issuer 를 넣은 짝이다.
            # ★ static 저장소는 키를 회전하지 않는다. 회전이 필요하면 키쌍을
            #   **하나 더 나열**해 둘 다 JWKS 에 올린 뒤(istiod 가 집을 때까지
            #   기다리고) 앞의 것을 뺄 것 — 서명은 목록의 첫 키로 한다.
            # ★ APP_CONFIG_ 값은 JSON 으로 해석된다(배열을 담을 수 있다).
            - name: APP_CONFIG_auth_keyStore
              value: '{"provider":"static","static":{"keys":[{"keyId":"oim-backstage-1","algorithm":"ES256","publicKeyFile":"/etc/backstage-token-keys/public.pem","privateKeyFile":"/etc/backstage-token-keys/private.pem"}]}}'
          volumeMounts:
            - name: gateway-ca
              mountPath: /etc/oim-gateway-ca
              readOnly: true
            - name: token-keys
              mountPath: /etc/backstage-token-keys
              readOnly: true
      volumes:
        - name: gateway-ca
          secret:
            secretName: gateway-ca-cert
            items:
              - key: ca.crt
                path: ca.crt
        # 서명 키쌍만 투영한다 — backstage-secret 의 다른 키는 env 로만 쓴다.
        - name: token-keys
          secret:
            secretName: backstage-secret
            defaultMode: 0440   # fsGroup 1000(node) 이 읽는다. 0400 이면 root 만 읽는다
            items:
              - key: user-token-private-key
                path: private.pem
              - key: user-token-public-key
                path: public.pem
---
# Keycloak 의 backstage 클라이언트 — 콜백·webOrigin 을 위 baseUrl 에 맞춘다.
#   이 Job 은 Sync 훅이라 동기화마다 돌고, 클라이언트가 있으면 PUT 으로 갱신한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-bootstrap
spec:
  template:
    spec:
      containers:
        - name: bootstrap
          env:
            - name: BACKSTAGE_BASE_URL
              value: "https://backstage.oneinchmarket.local"
            # AKHQ 의 콜백 — patches/akhq-local.yaml 이 외부 진입점 기준으로 바꾼 짝이다.
            - name: AKHQ_BASE_URL
              value: "https://akhq.oneinchmarket.local"
            # Apicurio UI 의 콜백·webOrigin — patches/apicurio-local.yaml 의 짝이다.
            - name: APICURIO_UI_URL
              value: "https://apicurio.oneinchmarket.local"
            # Spark 세션 UI 의 oauth2-proxy 콜백 — external-access/oauth2-proxy-spark-ui.yaml 의 짝이다.
            - name: SPARK_UI_URL
              value: "https://spark-ui.oneinchmarket.local"
            - name: LIVY_URL
              value: "https://livy.oneinchmarket.local"
            - name: SPARK_HISTORY_URL
              value: "https://spark-history.oneinchmarket.local"
            # 인증이 없던 UI 의 oauth2-proxy 클라이언트(2026-11-06) — external-access/oauth2-proxies.yaml 의 짝이다.
            #   ★ 원천은 render-external-access.py 의 O2P 이고 이 값과 다르면 그 생성기가 멈춘다.
            - name: O2P_HOSTS
              value: "prometheus alertmanager pyroscope pyrra temporal flink hdfs hbase hbase-rs hive seaweedfs"
            - name: O2P_URL_FMT
              value: "https://%s.oneinchmarket.local"
---
# Dependency-Track 프런트 — ★ 이 값은 엔트리포인트가
#   `/static/config.json` 을 **제자리에서 고쳐** 넣는다. 그래서
#   `readOnlyRootFilesystem: true` 면 **환경변수를 통째로 버리고** 파드는
#   Ready 로 남는다(Gotcha 48). base 가 그 때문에 conf/cache/run/tmp 를
#   emptyDir 로 두고 있다 — 그 구성을 건드리지 말 것.
#   ★ 판정은 `/` 가 아니라 `/static/config.json` 의 내용으로 한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dependency-track-frontend
spec:
  template:
    spec:
      containers:
        - name: frontend
          env:
            - name: API_BASE_URL
              value: "https://dtrack-api.oneinchmarket.local"
---
# Gravitee Console — management API 를 브라우저가 부른다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gravitee-console
spec:
  template:
    spec:
      containers:
        - name: console
          env:
            - name: MGMT_API_URL
              value: "https://gravitee-api.oneinchmarket.local/management"
---
# Gravitee Portal — portal API 를 브라우저가 부른다
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gravitee-portal
spec:
  template:
    spec:
      containers:
        - name: portal
          env:
            - name: PORTAL_API_URL
              value: "https://gravitee-api.oneinchmarket.local/portal"
---
# Temporal UI — CORS 허용 origin. ★ 이것은 백엔드 주소가 아니라 **브라우저가
#   어디서 왔는지**를 받는 값이다. 틀리면 화면은 뜨고 API 호출만 막힌다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: temporal-ui
spec:
  template:
    spec:
      containers:
        - name: temporal-ui
          env:
            - name: TEMPORAL_CORS_ORIGINS
              value: "https://temporal.oneinchmarket.local"
---
# Airflow api-server — ★★★ 로그인 리다이렉트의 출처다. 이것이 틀리면 UI 가
#   뜨고도 **들어갈 수 없다.**
#
# ★★ 증상이 Airflow 를 가리키지 않는다. 게이트웨이로 `/` 는 **200** 이고 SPA 가
#   정상으로 뜬다. 그 뒤 `/ui/config` 가 401 을 받아 로그인으로 보내는데, 그
#   리다이렉트 주소를 `api.base_url` 로 만든다. 실측(고치기 전):
#       GET https://airflow.oneinchmarket.local/api/v2/auth/login?next=%2F
#         HTTP/2 307
#         location: http://localhost:18080/auth/login/?next=%2F
#   즉 브라우저가 **아무도 듣지 않는 포트**로 떠나고 주소창에 그것만 남는다.
#   ★ 인증 자체는 멀쩡하다 — `/auth/login/` 은 게이트웨이 경유로 200(폼
#     16,994바이트)이고 admin 사용자도 있다(`airflow users list` 1명,
#     FAB 테이블도 섰다). **"로그인이 안 된다" 를 자격·사용자 문제로 읽지 말 것**:
#     먼저 `Location` 헤더를 볼 것. 그 한 줄이 층을 가른다.
#
# ★★★ **이 값을 바꿀 때 `core.execution_api_server_url` 을 함께 볼 것** —
#   그 기본값이 **`{api.base_url}/execution/`** 로 여기서 파생된다. base 가 이미
#   그것을 명시해 두었으므로(`http://airflow-apiserver:8080/execution/`) 이
#   변경은 실행 경로를 건드리지 않는다. **base 에서 그 줄을 지우면 이 패치가
#   모든 태스크를 죽인다** — 태스크 로그가 `Pre Execute` 한 줄에서 끊기고 DAG 은
#   그냥 failed 로 보여 원인이 아주 멀다(Gotcha 154).
#
# ★ 대가: port-forward(18080)로 들어가면 로그인 리다이렉트가 이제 게이트웨이
#   호스트로 간다. 위 다섯과 같은 거래이고 ACCESS.md 에 적어 두었다.
#   그리고 base_url 이 https 이므로 쿠키가 secure 가 된다 — 평문 port-forward
#   로는 로그인이 성립하지 않는다. 대조군으로 쓸 때는 UI 가 아니라
#   `airflow` CLI 나 `/api/v2` 를 쓸 것.
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-env
data:
  AIRFLOW__API__BASE_URL: "https://airflow.oneinchmarket.local"
