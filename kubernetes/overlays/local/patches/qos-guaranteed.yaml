# ★ zram 제어 장치 — LimitedSwap 은 Burstable QoS 에만 스왑을 준다.
#   Guaranteed(requests == limits, **cpu·memory 둘 다**)는 스왑을 0 받는다.
#
#   JVM 은 GC 가 힙 전체를 순회하므로 스왑되면 스래싱한다.
#   DB 버퍼풀은 정의상 hot data 라 스왑되면 캐시의 의미가 사라진다.
#   → 이 8종을 Guaranteed 로 만들어 실 RAM 에 고정한다. 합계 약 9.75 GiB.
#
#   나머지 전부는 Burstable 로 남아 zram 을 쓸 수 있다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
spec:
  template:
    spec:
      containers:
        - name: kafka
          # 2Gi -> 1536Mi (2026-09-03). 실사용 638Mi.
          # Guaranteed 는 스왑을 0 받으므로 실 RAM 을 그대로 점유한다 —
          # 과대 예약의 대가가 Burstable 보다 크다.
          resources:
            requests: { cpu: "1", memory: 1536Mi }
            limits:   { cpu: "1", memory: 1536Mi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: trino
spec:
  template:
    spec:
      containers:
        - name: trino
          resources:
            requests: { cpu: "2", memory: 2Gi }
            limits:   { cpu: "2", memory: 2Gi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgresql
spec:
  template:
    spec:
      containers:
        - name: postgresql
          resources:
            requests: { cpu: "1", memory: 1Gi }
            limits:   { cpu: "1", memory: 1Gi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
spec:
  template:
    spec:
      containers:
        - name: mariadb
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  template:
    spec:
      containers:
        - name: mongodb
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits:   { cpu: 500m, memory: 512Mi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
spec:
  template:
    spec:
      containers:
        - name: redis
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits:   { cpu: 250m, memory: 256Mi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  template:
    spec:
      containers:
        - name: minio
          # 1Gi -> 640Mi (2026-09-03). 실사용 107Mi.
          # ★ 이 워크로드에는 전례가 있다 — limits-local 에서 limit 을
          #   requests 아래로 내렸다가 파드가 97분간 조용히 사라졌다.
          #   Guaranteed 는 두 값을 **함께** 바꿔야 한다.
          #   107Mi 대비 크게 남기는 이유: 큰 오브젝트 업로드 시 버퍼가 튄다.
          resources:
            requests: { cpu: "1", memory: 640Mi }
            limits:   { cpu: "1", memory: 640Mi }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: hive-metastore
spec:
  template:
    spec:
      containers:
        - name: hive-metastore
          # ★ 힙과 limit 은 같이 움직여야 한다.
          #   512Mi 였는데 entrypoint 가 HADOOP_CLIENT_OPTS 에 -Xmx1G 를 박아
          #   넣어 힙만으로 한계를 넘었다 - 재시작 39회의 원인이었다.
          #   base 는 limit 2Gi / 힙 1536m 이다. 로컬은 둘 다 낮춘다.
          env:
            - name: HIVE_HEAP
              value: "-Xmx768m"
          resources:
            requests: { cpu: 500m, memory: 1280Mi }
            limits:   { cpu: 500m, memory: 1280Mi }
