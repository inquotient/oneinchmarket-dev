# ★ 메모리 limits 정리 (2026-09-01)
#
# 3단계 종료 시점에 노드의 메모리 limits 합이 98% 였다. requests 는 57% 로
# 여유가 있었으므로 스케줄은 되지만, limits 가 노드 용량을 넘으면
# 오버커밋이 실 RAM 압박으로 이어져 zram 스래싱·축출로 나타난다.
#
# 실사용(kubectl top)과 대조해 명백히 과다한 것만 낮춘다. 기준은
# **관측 피크의 약 2배**다. 여유를 남기되 노드 용량을 되찾는다.
#
# ★★ 가장 위험했던 함정 — limit 을 request 아래로 내리면 워크로드가
#   **조용히** 사라진다. minio 를 512Mi 로 내렸는데 requests 가 1Gi 였다
#   (qos-guaranteed.yaml 이 Guaranteed 로 만들어 둔 것). 결과:
#     Pod "minio-0" is invalid: spec.containers[0].resources.requests:
#       Invalid value: "1Gi": must be less than or equal to memory limit of 512Mi
#   kustomize build 도 kubectl apply 도 통과한다. StatefulSet 자체는
#   유효하기 때문이다. 실패하는 것은 **파드 생성**이라 `get pods` 에
#   아무것도 나타나지 않는다 — CrashLoop 도 Pending 도 아니고 그냥 없다.
#   97분 동안 모르고 지나갔고, MinIO 가 없어서 spark-connect 가 S3A
#   초기화에서 멈춰 있던 것을 쫓다가 발견했다.
#   -> limits 를 만질 때는 반드시 그 워크로드의 requests 를 먼저 볼 것.
#      그리고 적용 후 `kubectl get sts` 의 READY 열을 확인할 것.
#
# ★ 함정 — kubectl top 은 '지금'을 보여줄 뿐 기동 피크를 보여주지 않는다.
#   spark-connect 를 유휴 459Mi 기준으로 1Gi 로 잡았다가 기동 중
#   exit 137(OOMKilled)로 죽었다. JVM 은 특히 그렇다 — 유휴 사용량으로
#   limit 을 정하지 말 것.
#
#   워크로드          실사용    기존 limit -> 새 limit
#   prometheus        238Mi     3Gi   -> 1.5Gi
#   livy              403Mi     2Gi   -> 1Gi
#   keycloak          607Mi     2Gi   -> 1.5Gi
#   ranger-admin      871Mi     2Gi   -> 1.5Gi
#   admin             102Mi     1Gi   -> 512Mi
#   tempo              31Mi     1Gi   -> 768Mi
#   loki              124Mi     1Gi   -> 768Mi
#   apicurio          237Mi     1Gi   -> 768Mi
#   akhq              255Mi     1Gi   -> 768Mi
#   knox              253Mi     1Gi   -> 768Mi
#   nginx              17Mi   512Mi   -> 256Mi
#   otel-gateway       45Mi   512Mi   -> 384Mi
#
# 건드리지 않은 것 —
#   spark-connect 는 손대지 않는다 — 1Gi·1.5Gi 둘 다 기동 중 exit 137 로
#     죽었다. 유휴 459Mi 인데 Spark 드라이버 기동 피크는 2Gi 를 넘본다.
#   qos-guaranteed.yaml 이 잡는 8종(kafka·trino·postgresql·mariadb 등)은
#     requests==limits 가 zram 배제 장치다. 여기서 limits 만 바꾸면 그 성질이 깨진다
#   gitlab(3669Mi/4Gi)·logstash(1492Mi/2Gi)·elasticsearch(1722Mi/2Gi)·
#     kibana(846Mi/1Gi)·cmmn-api(807Mi/1Gi)는 실제로 쓰고 있다
#
# requests 는 손대지 않는다. 스케줄 여유(57%)는 문제가 아니었다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: prometheus
spec:
  template:
    spec:
      containers:
        - name: prometheus
          resources:
            limits: {memory: 1536Mi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tempo
spec:
  template:
    spec:
      containers:
        - name: tempo
          resources:
            limits: {memory: 768Mi}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
spec:
  template:
    spec:
      containers:
        - name: loki
          resources:
            # ★ 768Mi 였다가 OpenReplay 도입 후 OOMKilled 11회.
            #   파드가 80 -> 103 으로 늘며 수집량이 뛰었다. 로그 파이프라인은
            #   **파드 수에 비례**하므로 워크로드를 대량 추가할 때 함께 봐야 한다.
            # ★ 384Mi -> 768Mi (2026-09-03). 실사용 672Mi 로 **예약을
            #   넘어섰다** — 노드 압박 시 축출 1순위였다. 파드 103 -> 113
            #   에서 다시 늘었다.
            requests: {memory: 768Mi}
            # ★ 1280Mi -> 2Gi (2026-09-03). 재부팅 후 콜드 스타트에서
            #   exit 137(OOMKilled) 5회. 정상 운용 중 실사용은 672Mi 지만
            #   **114 파드가 동시에 기동하며 뿜는 로그 버스트**가 그것을
            #   훨씬 넘는다. 이 워크로드는 유휴 사용량으로 한도를 정하면
            #   안 되는 대표 사례다 — 파드 수에 비례하고 기동 시점에 몰린다.
            limits:   {memory: 2Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-gateway
spec:
  template:
    spec:
      containers:
        - name: otel-gateway
          resources:
            limits: {memory: 384Mi}
---
