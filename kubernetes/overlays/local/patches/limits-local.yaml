---
# ★ OpenReplay 도입 후 OOMKilled 7회. filelog 가 읽어야 할 파드가 80 -> 103 이
#   되면서 한계를 넘었다. Loki 와 같은 계열의 조정이다.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-agent
spec:
  template:
    spec:
      containers:
        - name: otel-agent
          resources:
            requests: {memory: 192Mi}
            limits:   {memory: 640Mi}
