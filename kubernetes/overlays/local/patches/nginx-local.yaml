# TODO-14 — base 의 upstream 이 *.dev.svc.cluster.local 로 하드코딩되어
# local 네임스페이스에서 해석되지 않는다. nginx resolver 는 검색 도메인을
# 적용하지 않으므로 FQDN 이 필요하다. 근본 해결(템플릿+envsubst)은 TODO-14.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
data:
  nginx.conf: |
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /tmp/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;
        sendfile on;
        keepalive_timeout 65;

        resolver 10.43.0.10 valid=10s;

        server {
            listen 80;
            server_name _;

            location / {
                set $admin_upstream http://admin-headless.local.svc.cluster.local:3000;
                proxy_pass $admin_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }

            location /api/ {
                set $cmmn_api_upstream http://cmmn-api-headless.local.svc.cluster.local:8080;
                proxy_pass $cmmn_api_upstream;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
        }
    }
