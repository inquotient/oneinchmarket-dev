# 로컬은 replicas 1 이다. base 의 quorum voters 는 kafka-0,1,2 를 요구해
# 형성될 수 없는 quorum 을 기다리며 CrashLoop 한다.
#   java.net.UnknownHostException: kafka-1.kafka-headless: Name does not resolve
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-config
data:
  KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka-0.kafka-headless:9093"
  KAFKA_NUM_PARTITIONS: "1"
  KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
  KAFKA_MIN_INSYNC_REPLICAS: "1"
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
