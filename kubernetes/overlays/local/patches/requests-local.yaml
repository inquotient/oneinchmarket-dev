# ★ 메모리 requests 실측 정정 (2026-09-03)
#
# 7단계 종료 시점에 노드의 memory requests 가 allocatable 의 **80%**(42.5/52.9 GiB)
# 인데 실제 컨테이너 RSS 합은 **24.3 GiB** 였다. 18 GiB 가 예약만 되고 놀았다.
# 이 상태에서는 새 워크로드를 넣을 자리가 없고, 그 원인이 실제 부족이 아니라
# 과대 예약이다.
#
# ★★ 순수 삭감이 아니다 — 5건은 예약이 실사용보다 **적었다**.
#   requests 미만으로 쓰는 파드는 축출 순위에서 보호받지만, 초과하는 파드는
#   **가장 먼저 축출된다.** 노드가 압박을 받으면 safeline(-804Mi) ·
#   logstash(-333Mi) · loki(-288Mi) · spark-history(-195Mi) 가 먼저 죽는다.
#   과대 예약보다 이쪽이 위험하다.
#
# 기준
#   - Burstable: 실사용의 약 1.3~2배. 기동 피크가 유휴보다 높은 JVM 은 넉넉히
#   - Guaranteed 8종은 여기서 다루지 않는다 — requests==limits 불변식이
#     qos-guaranteed.yaml 에 있고, 한쪽만 바꾸면 그 성질이 깨진다
#   - istiod·ztunnel 은 istioctl 이 설치하므로 kustomize 밖이다
#     (local/install-operators.sh 에서 조정)
#
# ★ 함정 — limits-local.yaml 이 기록한 것과 같은 것이 requests 에도 있다.
#   **request 를 limit 위로 올리면 파드가 조용히 사라진다.** CrashLoop 도
#   Pending 도 아니고 `get pods` 에 아무것도 안 나온다. 아래 값은 전부
#   해당 워크로드의 현재 limit 이하임을 확인했다.
#
# ★ 함정 — kubectl top 은 '지금'이지 기동 피크가 아니다. JVM 을 유휴
#   사용량 기준으로 잡으면 기동 중 exit 137 로 죽는다. 그래서 삭감폭을
#   실사용의 2배 언저리에서 멈췄다.

# ★★★ 2026-09-12 정정 — **JVM 세 건의 요청이 힙보다 낮았다.**
#   위 머리말이 "기동 피크가 유휴보다 높은 JVM 은 넉넉히" 라고 적어 두었는데
#   실제로는 힙을 확인하지 않아 hive-server(-1152) · dependency-track(-960) ·
#   hive-metastore(-448) 가 힙 아래로 내려갔다. 그러면 **장부가 거짓말을 한다** —
#   스케줄러는 남았다고 믿는데 힙이 차면 커널이 먼저 죽인다(실측: 이 노드에서
#   호스트 쪽 작업 셋이 OOM 으로 종료됐다).
#   ★ 규칙: **request >= -Xmx**. 그리고 힙은 limit 의 60~70% 로 둔다(Gotcha 82).
#     한쪽만 고치면 안 된다 — dependency-track 은 힙이 limit 의 78% 라
#     힙을 1280m 으로 낮추고 요청을 거기에 맞췄다.
#   ★★ 판정은 기억이 아니라 실측으로: 도는 파드의 env 에서 `-Xmx` 를 뽑아
#     requests.memory 와 대조할 것. 이 파일만 봐서는 힙이 보이지 않는다.

# ── 부족했던 것들: 올린다 ─────────────────────────────────────────

# tengine 이 nginx 워커를 **호스트 코어 수(24)만큼** 띄우고 각각 탐지 룰셋을
# 올린다. 실사용 1783Mi 인데 예약이 384Mi 였다. detector 는 반대로 과다(132Mi).
#
# ★★ 2026-09-08 재정정: 1792Mi -> 1024Mi.
#   재측정하니 tengine 이 **122Mi** 였다(파드 전체 246Mi). 1783Mi 는 워커를
#   전부 띄웠을 때의 값이고 상시가 아니다. 노드 예약이 allocatable 의 103%
#   가 되어 **새 파드가 스케줄되지 못하는** 상태였고, 이 한 줄이 가장 큰
#   과다 예약이었다(§8-93).
#   ★ 절충이다 — 워커가 다시 다 뜨면 request 를 넘어 축출 후보가 된다.
#   다만 limit 은 3Gi 그대로라 **OOM 되지는 않는다.** 근본 해법은 예약을
#   키우는 것이 아니라 워커 수를 노드 크기에 맞게 줄이는 것이다(§9 로 넘겼다).
#
# ★★★ 2026-09-12: **그 근본 해법을 했다.** §9 로 넘겼던 "워커 수를 줄인다" 를
#   base 의 tengine 에 postStart 훅으로 넣었다(`worker_processes 2`,
#   치환 실패 시 기동 거부). 그러자 값이 절충할 필요가 없어졌다:
#     nginx 프로세스 25 -> 3 (마스터 1 + 워커 2)
#     tengine 실사용 1799Mi -> **161Mi** (11배)
#   ★ 흥미로운 것은 2026-09-08 의 "재측정하니 122Mi" 도 맞았고 1783Mi 도
#     맞았다는 점이다 — 같은 워크로드가 **워커를 다 띄웠느냐**로 14배를
#     오갔다. 병렬도를 고정하지 않으면 어느 값도 예약의 근거가 되지 못한다.
#   ★★ 그래서 이제 이 값은 절충이 아니라 관측이다. 384Mi 는 실측 161Mi 에
#     여유를 얹은 것이다 — WAF 가 트래픽 경로에 들어온 직후라(2026-09-12)
#     부하가 아직 적으니, 실사용이 이 값을 넘기 시작하면 다시 잴 것.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: safeline
spec:
  template:
    spec:
      containers:
        - name: tengine
          resources:
            requests: {memory: 384Mi}   # 실사용 161Mi (워커 2개 고정 뒤)
        - name: detector
          resources:
            requests: {memory: 160Mi}   # 실사용 125Mi
        - name: mgt
          resources:
            requests: {memory: 160Mi}   # 실사용 116Mi — 112Mi 로는 빠듯했다
---
# ★ logstash 패치를 걷어냈다(2026-09-11). 근거가 뒤집혔다 —
#   "파드 수에 비례해 수집량이 늘어난다" 는 **Filebeat -> beats 입력**이
#   있을 때의 이야기였다. OpenSearch 전환으로 그 입력이 사라졌고
#   (컨테이너 로그는 otel-agent -> Data Prepper 로 간다), Kafka SIEM 입력도
#   Data Prepper 가 가져갔다. 남은 것은 zeek·suricata TCP · alertmanager
#   webhook · 과금 다리뿐이다.
#   실측: 힙 252MB/990MB(25%) · **1시간여에 이벤트 100건**.
#   base 가 이제 requests 768Mi / limits 896Mi / 힙 384m 을 직접 지정한다.
# 실사용 707Mi / 예약 512Mi.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spark-history
spec:
  template:
    spec:
      containers:
        - name: spark-history
          resources:
            requests: {memory: 768Mi}
---
# 실사용 2077Mi / 예약 2048Mi — 이미 넘었다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: gitlab
spec:
  template:
    spec:
      containers:
        - name: gitlab
          resources:
            requests: {memory: 2304Mi}
---

