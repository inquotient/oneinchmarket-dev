# ★★★ `databases-migrate` 를 PreSync 에서 **Sync** 로 옮긴다 (2026-10-05)
#
# 상류 Helm 차트가 이 Job 과 그 스크립트 ConfigMap 에
# `helm.sh/hook: pre-install, pre-upgrade` 를 붙여 두었고, **ArgoCD 는 그것을
# PreSync 로 해석한다.** PreSync 는 모든 wave 보다 앞이다. 그런데 이 Job 은
# PostgreSQL 과 ClickHouse 에 접속해야 하고, 그 둘은 **wave 1**(Sync 단계)이다.
# 즉 처음 세우는 클러스터에서 이 훅은 **성립할 수 없다.**
#
# ★ 그리고 ArgoCD 는 PreSync 훅이 실패하면 **작업 전체를 중단**한다 —
#   실측(베어메탈 첫 동기화): `Synced 1/573` · `local` 파드 1개 · 한 시간 뒤
#   `Job was active longer than specified deadline`. 573건 중 아무것도
#   배포되지 않았다. 증상은 "느리다" 가 아니라 **아무 일도 일어나지 않는다** 다.
#
# ★★ 멈춘 자리는 DB 가 아니었다 — 실측으로 하나하나 갈랐다:
#     · GitHub clone(init 컨테이너 첫 단계)은 **1초**다. 범인이 아니다
#     · 파드는 `Init:0/3` 에서 영원히 멈췄고 이벤트는 한 줄이었다 —
#       `MountVolume.SetUp failed ... configmap "db-migration-script" not found`
#   같은 PreSync 훅인 ConfigMap 과 Job 이 **같은 wave** 로 뭉개져(아래 참조)
#   순서가 사라졌고, 마운트할 것이 없는 파드는 오류를 내지 않고 **기다린다.**
#   그래서 `activeDeadlineSeconds: 3600` 을 채우고서야 실패한다.
#
# ★★★ 차트의 `helm.sh/hook-weight`(-6 -> -5)는 **효력이 없다.**
#   `overlays/local/openreplay/kustomization.yaml` 의 `commonAnnotations` 가
#   두 리소스에 `argocd.argoproj.io/sync-wave: "7"` 을 박아, ArgoCD 가
#   hook-weight 대신 그 값을 쓴다 — Gotcha 67 그대로다.
#
# ★ 그래서 이 패치는 **상위 오버레이**에 있다. 측정으로 확인한 것:
#     · 하위 kustomization 의 patch 로 `sync-wave` 를 바꾸면
#       commonAnnotations 가 **되덮는다**("6" -> "7")
#     · 반면 **새 키**(`argocd.argoproj.io/hook`)는 살아남는다
#   그래서 wave 는 7 그대로 두고 **단계만** 바꾼다. 상위에서 하는 이유는
#   하위의 변환이 끝난 결과에 적용되기 때문이다.
#
# ★★ wave 7 이면 OpenReplay 워크로드와 **같은 wave** 에서 돈다. ArgoCD 는
#   한 wave 안에서 kind 순으로 적용하므로 ServiceAccount·ConfigMap 이
#   Job 보다 먼저 만들어지고(그래서 위의 마운트 실패가 사라진다),
#   DB 는 wave 1 에 이미 떠 있다. 워크로드는 스키마가 생기기 전까지
#   재시작하다 마이그레이션이 끝나면 복구된다 — 교착이 아니다.
#   ★ wave 를 6 으로 내리려면 `commonAnnotations` 를 걷어야 하고, 그러면
#     이 Job 이 참조하는 SA·ConfigMap 까지 함께 앞으로 당겨야 한다.
#     그 쪽이 옳아지는 조건은 "워크로드 재시작이 실제로 문제가 될 때" 다.
#
# ★ `helm.sh/hook*` 를 **지운다.** 남겨 두면 같은 질문에 답이 둘이 되고,
#   다음 사람이 어느 쪽이 유효한지 알 수 없다(Gotcha 161 과 같은 이유).
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-migration-script
  namespace: local
  annotations:
    helm.sh/hook: null
    helm.sh/hook-weight: null
---
apiVersion: batch/v1
kind: Job
metadata:
  name: databases-migrate
  namespace: local
  annotations:
    helm.sh/hook: null
    helm.sh/hook-weight: null
    helm.sh/hook-delete-policy: null
    # ★ Sync 훅으로 둔다 — 평범한 리소스로 두면 `spec.template` 이 불변이라
    #   두 번째 동기화에서 `field is immutable` 로 **전체가 멈춘다**(Gotcha 58).
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
#
# ★★★ 그리고 `SKIP_PERMISSION_CHANGE=true` 로 둔다 (2026-10-06) — 그 chown 은
#   **쓸모가 없으면서 Job 을 죽이고 있었다.** 실측 로그:
#       + '[' false '!=' true ]
#       + chown 1001:1001 /mnt/efs
#       chown: /mnt/efs: Operation not permitted
#   그래서 `git` 초기화 컨테이너가 `Init:Error` 로 끝나고 Job 이
#   backoffLimit 을 소진한다. 그 결과 **스키마가 만들어지지 않아**
#   `chalice-openreplay` 가 `relation "public.tenants" does not exist` 로
#   CrashLoop 한다 — 증상은 chalice 에 나오고 원인은 이 Job 이다.
#
# ★ 건너뛰어도 안전한 근거(추측이 아니라 실측이다): `/mnt/efs` 는
#   **hostPath** 이고 이 Job 에서 그것을 마운트하는 것은 `git` 초기화
#   컨테이너 **하나뿐**이다. 실제로 마이그레이션을 하는 `postgres`·
#   `clickhouse` 컨테이너는 `/opt/openreplay`(emptyDir)와
#   `/opt/migrations/`(ConfigMap)만 본다. 즉 그 디렉터리의 소유권은
#   이 Job 의 어느 단계에도 쓰이지 않는다.
#
# ★★★ 애초에 **성공할 수 없는 구조였다 — `capabilities.add` 는 비-root
#   컨테이너에게 아무 권한도 주지 않는다.** 일회성 파드로 직접 쟀다
#   (uid 1001 · `capabilities: {add: [CHOWN], drop: [ALL]}`):
#       CapBnd: 0000000000000001     <- add 는 **bounding set** 에만 들어간다
#       CapPrm: 0000000000000000
#       CapEff: 0000000000000000     <- 실효 권한은 0이다
#       CapAmb: 0000000000000000     <- 쿠버네티스는 ambient 를 설정하지 않는다
#       chown: Operation not permitted
#   비-root 프로세스는 permitted/effective 를 물려받지 못하므로, `add` 로
#   적어 둔 capability 는 **문서처럼 보이기만 한다.**
#   ★ 그래서 §8-49 의 "실제로 root 였던 마이그레이션 Job 하나는 CAP_CHOWN
#     으로 낮췄다" 는 **Kyverno 정책만 통과시키고 chown 은 죽인 수정**이었다.
#     드러나지 않은 이유는 옛 클러스터에 스키마가 이미 있어서 이 Job 이
#     실패해도 아무도 아프지 않았기 때문이다 — **재구축이 그 차이를
#     한 번에 청구한다**(Gotcha 166).
#   ★★ 교훈: **비-root 컨테이너에 capability 를 적지 말 것.** 정말 필요하면
#     ① 그 일을 root 초기화 컨테이너로 떼어내거나 ② `fsGroup` 으로 해결하거나
#     ③ 이 경우처럼 **그 일이 필요한지 다시 물을 것.**
spec:
  template:
    spec:
      initContainers:
        - name: git
          env:
            - name: SKIP_PERMISSION_CHANGE
              value: "true"
