# 기동 여유 확대 (2026-09-01, 4단계)
#
# ★ 진단 경위를 그대로 남긴다 — 처음엔 원인을 잘못 짚었다.
#   spark-connect 가 base 의 startup 예산 30 x 10s = 5분 안에 15002 를
#   열지 못해 kubelet 에 죽었다(exit 137). 노드가 붐벼서 느려진 것으로
#   보고 예산을 5분 -> 10분 -> 15분으로 늘렸으나 계속 죽었다.
#
#   실제 원인은 **MinIO 가 없어진 것**이었다. limits 정리에서 minio 의
#   limit 을 request 아래로 내리는 바람에 StatefulSet 이 파드를 만들지
#   못했고(limits-local.yaml 의 주석 참조), spark-connect 는 이벤트 로그를
#   여는 S3A 초기화에서 무한정 기다리고 있었다. MinIO 를 되살리자
#   즉시 1/1 이 되었다.
#
#   그래도 이 패치는 남긴다. 4단계로 JVM 워크로드가 늘어 기동이 서로를
#   늦추는 것은 사실이고, base 의 5분은 이 노드에서 빠듯하다.
#   다만 15분은 실패를 가리므로 10분으로 되돌린다.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spark-connect
spec:
  template:
    spec:
      containers:
        - name: spark-connect
          startupProbe:
            tcpSocket: {port: grpc}
            failureThreshold: 60      # 10분
            periodSeconds: 10
