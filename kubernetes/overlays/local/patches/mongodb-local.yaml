# ★★★ MongoDB 8.0 은 **이 노드의 커널에서 기동을 거부한다** (2026-10-05).
#
#   MongoDB cannot start: Linux kernel versions 6.19 and newer has a known
#   incompatibility with this version of MongoDB. (SERVER-121912)
#
# 베어메탈 노드는 Ubuntu 26.04 · **kernel 7.0.0-38-generic** 이다. 상류 설명:
# 6.19 ~ 7.0.13 구간에서 MongoDB 가 벤더링한 TCMalloc 이 커널의 rseq 동작
# 변화와 어긋나 메모리가 상한다. 8.0.x 의 최근 빌드는 **그 구간을 감지해
# 아예 뜨지 않는다** — 손상된 채 도는 것보다 낫다는 판단이다.
#
# ★ 커널을 올려서 풀 수 없다 — Ubuntu 26.04 가 주는 커널은 전부 `7.0.0-NN`
#   이고(실측: 7.0.0-30·31·34·38 뿐) MongoDB 의 검사는 **버전 문자열**을 본다.
#   업스트림 수정이 7.0.14 에 들어갔으므로 `7.0.0` 은 영원히 통과하지 못한다.
#   Ubuntu 가 수정을 백포트했는지는 changelog 로 확인되지 않았다(rseq 언급 0건).
#
# ★★ 실측으로 세 태그를 갈랐다(일회성 파드에서 mongod 를 직접 띄워 봤다):
#     8.0.32-14 (2026-09-23)  거부      <- base 가 가리키는 계열의 최신
#     8.0.4-2   (2025-02-19)  기동      <- 검사가 없을 뿐. 20개월 묵었다
#     7.0.43-23 (2026-09-22)  기동      <- 유지되는 7.0 LTS. 문제의 TCMalloc 이전
#   그래서 7.0.43-23 을 고른다. 8.0.4-2 는 "검사를 피한 것" 이라 근거가 약하고
#   보안 패치가 20개월 뒤처진다 — 조용한 손상 위험은 그대로 남는다.
#
# ★ base 를 고치지 않는 이유: 이것은 **이 노드의 커널 속성**이고 아키텍처
#   결정이 아니다. dev/prod(Vultr)는 커널이 다르므로 base 의 8.0.29-13 을
#   그대로 둔다. 여기서 base 를 내리면 아직 배포된 적 없는 환경의 의미가 바뀐다.
#
# ★★ 데이터 위험은 없다 — MongoDB 를 쓰는 것은 **Gravitee 하나**이고(실측:
#   gravitee-{configmap,gateway,management-api} · mongodb-bootstrap · rotation),
#   그 API 정의의 원천은 `local/gravitee-apis/*.json` 이라 다시 만들 수 있다
#   (Gotcha 159). 그리고 Gravitee 4.x 의 지원 범위에 7.0 이 들어 있다 —
#   8.0 쪽이 오히려 범위 밖이었다.
#
# ★★★ 복귀 조건: Ubuntu 가 **MongoDB 의 검사를 통과하는 버전 문자열**의 커널을
#   주거나(7.0.14+), MongoDB 가 버전 문자열 대신 실제 동작을 probe 하도록
#   검사를 고치면 base 의 8.0 계열로 되돌릴 것. 그때 `mongodb-0` 의 PVC 는
#   메이저 업그레이드 경로를 밟아야 한다(7.0 -> 8.0 은 한 단계라 가능하다).
# ★ patch target 에 `namespace` 를 **적지 않는다** — base 의 StatefulSet 은
#   네임스페이스를 선언하지 않고 오버레이가 마지막에 붙인다. 적으면
#   `no resource matches strategic merge patch` 로 렌더가 통째로 깨진다.
#   openreplay 쪽 패치는 반대다(생성 파일이 `namespace: local` 을 품는다) —
#   **대상이 선언하는지 보고 맞출 것.**
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  template:
    spec:
      containers:
        - name: mongodb
          image: docker.io/percona/percona-server-mongodb:7.0.43-23
# ★★ 서버만 내린다 — 같은 이미지를 쓰는 **클라이언트 넷은 8.0.29-13 그대로**다:
#   gravitee-gateway·gravitee-management-api 의 대기 initContainer,
#   rotate-mongodb-password CronJob, mongodb-bootstrap Job.
#   커널 검사는 `mongod` 에만 있고 그 넷은 `mongosh` 를 돌리므로 영향이 없다.
#   mongosh 8 은 7.0 서버를 지원한다. **의도한 불일치이고, 실패하면 여기서
#   함께 내릴 것** — 조용히 어긋난 것이 아님을 남겨 둔다.
