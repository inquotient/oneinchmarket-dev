# OneinchMarket v2 - Dev Overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dev

resources:
  - namespace.yaml
  - ../../base

patches:
  - path: patches/replicas-dev.yaml
  - path: patches/resources-dev.yaml
  - path: patches/storage-dev.yaml
  - path: patches/kafka-dev.yaml
  - path: patches/akhq-dev.yaml
  # ECK CRDs: kustomize commonLabels can't reach into CRD podTemplate fields
  - target:
      group: elasticsearch.k8s.elastic.co
      version: v1
      kind: Elasticsearch
      name: elasticsearch
    patch: |
      - op: add
        path: /spec/nodeSets/0/podTemplate/metadata/labels/environment
        value: dev
  - target:
      group: kibana.k8s.elastic.co
      version: v1
      kind: Kibana
      name: kibana
    patch: |
      - op: add
        path: /spec/podTemplate/metadata/labels/environment
        value: dev

commonLabels:
  environment: dev

commonAnnotations:
  app.kubernetes.io/instance: oneinchmarket-dev
