# Dev 환경: AKHQ single-node Kafka 연결
apiVersion: v1
kind: ConfigMap
metadata:
  name: akhq-config
data:
  application.yml: |
    akhq:
      connections:
        oneinchmarket:
          properties:
            bootstrap.servers: "kafka-0.kafka-headless:9092"
          schema-registry:
            url: "http://apicurio-registry-headless:8080/apis/ccompat/v7"
