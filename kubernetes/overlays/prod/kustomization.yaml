# OneinchMarket v2 - Prod Overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - namespace.yaml
  - ../../base
  - pdb.yaml

patches:
  - path: patches/replicas-prod.yaml
  - path: patches/storage-prod.yaml
  - path: patches/kyverno-enforce-latest.yaml
  - path: patches/kyverno-enforce-security.yaml

# ── 이미지 태그 핀닝은 여기에 없다 ─────────────────────────────────
# 2026-09-06 이전에는 이 자리에 `images:` 블록이 있었고 base 매니페스트는
# `:latest` 였다. 그래서 **핀의 원천이 둘**이었고 실제로 어긋나 있었다:
#   · clickhouse — prod 는 25.9-alpine, 실제로 도는 것은 26.8(비-alpine).
#     계열까지 다른 핀이었다.
#   · percona-server-mongodb — prod 는 8.3.8, `latest`(=도는 것)는 8.0 LTS.
#   · apache/knox — prod 만 다이제스트라 local·dev 는 가변 태그 `3.0`(RC 추종)
#     으로 **다른 바이너리**를 돌리고 있었다.
# 게다가 base 의 `:latest` 65곳 중 prod 블록이 덮는 것은 일부뿐이라
# 나머지는 Kyverno `disallow-latest`(prod Enforce)에 걸려 배포가 거부된다.
#
# → 핀은 **base 매니페스트가 소유한다.** 세 환경이 같은 바이너리를 쓰고,
#   버전을 바꿀 자리가 하나뿐이며, 값과 사유가 같은 곳에 있다.
#   prod 전용 이미지 오버라이드가 생기면 그때 여기에 `images:` 를 되살릴 것.
#   상세는 docs/LOCAL-DEPLOYMENT.md §8-72.
commonLabels:
  environment: prod

commonAnnotations:
  app.kubernetes.io/instance: oneinchmarket-prod
