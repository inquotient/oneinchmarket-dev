# OneinchMarket v2 - Prod Overlay
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: prod

resources:
  - namespace.yaml
  - ../../base
  - pdb.yaml

patches:
  - path: patches/replicas-prod.yaml
  - path: patches/storage-prod.yaml
  - path: patches/kyverno-enforce-latest.yaml
  - path: patches/kyverno-enforce-security.yaml

# 이미지 태그 핀닝 - Prod에서는 특정 버전으로 고정
# 2026-09-01 갱신 — 실행 중인 이미지를 실측해 최신으로 고정한다.
#
# ★ Bitnami 무료 카탈로그 축소 (2025-08) — 공식 이미지로 전환 완료
#   bitnami/* 의 버전 태그가 전부 사라지고 latest 와 다이제스트만 남았다.
#   구버전은 bitnamilegacy/* 로 이동했다. 기존 핀(16.4.0·11.4.3·7.4.1)은
#   더 이상 pull 되지 않아 prod 배포 시 ImagePullBackOff 가 난다.
#   → 다이제스트로 고정한다. 재현 가능하면서 최신이며 G37(다이제스트 핀
#     부재)도 함께 해소된다. bitnamilegacy 는 동결 스냅샷이라 다운그레이드다.
images:
  # ── 데이터베이스 (공식 이미지) ────────────────────────────────
  # bitnami 는 2025-08 무료 카탈로그 축소로 버전 태그가 사라져 재현 가능한
  # 핀이 불가능해졌다. 공식 업스트림 이미지로 전환했다.
  #   POSTGRESQL_* -> POSTGRES_*, 데이터 경로·uid 변경 (base 매니페스트 참조)
  - name: postgres
    newTag: "18.6"
  - name: mariadb
    newTag: "12.3.3"
  - name: redis
    newTag: "8.10.1"
  - name: percona/percona-server-mongodb
    newTag: "8.3.8"

  # ── 메시징 ──────────────────────────────────────────────────
  - name: apache/kafka
    newTag: "4.3.1"
  - name: apicurio/apicurio-registry
    newTag: "3.3.2"
  - name: tchiotludo/akhq
    newTag: "0.28.0"

  # ── 레이크하우스 ────────────────────────────────────────────
  - name: minio/minio
    newTag: "RELEASE.2025-09-07T16-13-09Z"
  - name: trinodb/trino
    newTag: "483"
  - name: apache/hive
    newTag: "4.0.1"                   # 스키마 버전 고정. 상향 시 schematool -upgradeSchema 필요
  - name: oneinch/spark-iceberg
    newTag: "3.5.6"
  - name: oneinch/livy
    newTag: "0.9.0-incubating"

  # ── 인증 · 애플리케이션 ─────────────────────────────────────
  - name: keycloak/keycloak
    newTag: "26.7.3"
  - name: nginx
    newTag: "1.31.4"                  # mainline. 안정 계열이 필요하면 1.30.4
  # 레지스트리에 버전 태그가 없다(G9 — Dockerfile 부재로 CI 빌드 불가).
  - name: inquotient/admin
    digest: sha256:8479fe9611058be1127465b2b03b98cdf919f84fb48ff5a548101f5ba2c3443a
  - name: inquotient/cmmn-api
    digest: sha256:a81293108c297974c5d9cbab37b4f52b830c30fec81000d10b3ee4c97edb850f

  # ── 관측성 (Elastic 8.17.0 → 9.5.2 메이저 업그레이드) ────────
  - name: docker.elastic.co/logstash/logstash
    newTag: "9.5.2"
  - name: docker.elastic.co/beats/filebeat
    newTag: "9.5.2"

  # ── 관측성 · 메트릭·로그·트레이스 (INFRA-601 1~2단계) ────────
  - name: prom/prometheus
    newTag: "v3.14.0"
  - name: grafana/grafana
    newTag: "13.2.0"
  - name: grafana/loki
    newTag: "3.7.7"                    # 스키마 v13 · OTLP 수집 경로 고정
  - name: grafana/tempo
    newTag: "3.0.3"
  - name: otel/opentelemetry-collector-contrib
    newTag: "0.159.0"                 # 컬렉터 설정 스키마는 마이너마다 바뀐다

  # ── 거버넌스 (3단계) ────────────────────────────────────────
  - name: 389ds/dirsrv
    newTag: "3.1"
  - name: ldapaccountmanager/lam
    newTag: "8.3"
  # `apache/solr` 가 아니라 `library/solr` 다. apache/solr 에는 태그가 없다.
  - name: solr
    newTag: "10.0.0-slim"
  - name: apache/ranger
    newTag: "2.9.0"                   # install.properties 스키마가 버전에 묶인다
  # 로컬 빌드. upstream 의 Dockerfile.ranger-usersync 기반이며 CI 가 아직
  # 만들지 않는다 — 레지스트리 경로가 생기면 digest 로 바꾼다.
  - name: oneinch/ranger-usersync
    newTag: "2.9.0"                   # install.properties 스키마가 버전에 묶인다
  # Knox 는 태그가 가변이다(3.0 이 RC/미릴리스 빌드를 따라간다).
  # 정식 릴리스는 2.1.0 이나 공식 이미지가 없다 -> 다이제스트로 고정한다.
  - name: apache/knox
    digest: sha256:5f90c6b5b36dd2b2afffbcb358689b9fe87ecf413ae7aa53f208610872cb1ac5

  # ── DevOps ─────────────────────────────────────────────────
  - name: gitlab/gitlab-ee
    newTag: "19.3.1-ee.0"

  # ── 보안 ───────────────────────────────────────────────────
  - name: falcosecurity/falco-no-driver
    newTag: "0.39.2"
  - name: falcosecurity/falcosidekick
    newTag: "2.35.0"

  # ── 로테이션 · 스캔 (기존 images 블록에 누락되어 있던 6종) ────
  - name: curlimages/curl
    newTag: "8.21.0"
  - name: minio/mc
    newTag: "RELEASE.2025-08-13T08-35-41Z"
  - name: alpine/git
    newTag: "2.54.0"
  - name: aquasec/trivy
    newTag: "0.74.0"
  - name: busybox
    newTag: "1.38.0"

commonLabels:
  environment: prod

commonAnnotations:
  app.kubernetes.io/instance: oneinchmarket-prod
