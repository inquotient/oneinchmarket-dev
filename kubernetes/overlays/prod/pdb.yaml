# PodDisruptionBudgets - Prod 환경 가용성 보장
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgresql-pdb
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: oneinchmarket
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgresql
---
