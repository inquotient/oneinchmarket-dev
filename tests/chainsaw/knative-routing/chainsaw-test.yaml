# Knative Serving 라우팅 — Gotcha 229 ①② 가 실측으로 정한 것이 그대로인지 본다.
#   ① 외부 ksvc 는 https 로만 닿는다: https 200 · 평문 http 는 301(https 로) — 평문 200 이면 80 리스너가
#      kn 의 라우트를 다시 받고 있는 것이다(patches/gateway-allow-kn.yaml 이 깨졌다).
#   ② cluster-local ksvc 는 클러스터 안(knative-local 게이트웨이, 80)에서만 닿는다 — 바깥 게이트웨이로는 200 이 아니어야 한다.
#   ③ 0 으로 줄어든 뒤 첫 요청(콜드 스타트)도 200 이다.
# ★ 시험 요청 넷은 ingress 게이트웨이를 지나므로 api-usage 스트림에 계량 이벤트로 남는다(Telemetry api-usage 는
#   그 게이트웨이의 모든 호스트를 계량한다). subject 가 없어(`-`) 청구되지 않고 격리된다(Gotcha 16·185) — api 호스트에는 보내지 않는다.
# ★ 실행 위치는 노드 103 이다(GATEWAY_IP 의 443·80 은 externalIPs — 노드에서 닿는다, Gotcha 200 ②).
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: knative-routing
spec:
  # kn 은 이미 있다 — Chainsaw 는 자기가 만든 네임스페이스만 지운다. HTTPRoute 는 kn 에서 온 것만 받는다.
  namespace: kn
  steps:
    - name: deploy
      try:
        - apply:
            file: ksvc.yaml
        - assert:
            resource:
              apiVersion: serving.knative.dev/v1
              kind: Service
              metadata:
                name: cs-public
              status:
                (conditions[?type == 'Ready']):
                  - status: "True"
        - assert:
            resource:
              apiVersion: serving.knative.dev/v1
              kind: Service
              metadata:
                name: cs-private
              status:
                url: http://cs-private.kn.svc.cluster.local
                (conditions[?type == 'Ready']):
                  - status: "True"
    - name: external-https-only
      try:
        - script:
            timeout: 2m
            content: |
              set -eu
              ip="${GATEWAY_IP:-192.168.0.103}"
              h=cs-public-kn.oneinchmarket.local
              # HTTPRoute 가 게이트웨이에 실리기까지 몇 초 걸린다 — 200 이 될 때까지만 기다린다.
              # -k 인 이유: 여기서 재는 것은 라우팅이지 인증서 신뢰가 아니다.
              code=000; i=0
              while [ $i -lt 30 ]; do
                code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 --resolve "$h:443:$ip" "https://$h/" || true)
                [ "$code" = 200 ] && break; i=$((i+1)); sleep 2
              done
              echo "https $h -> $code"
              [ "$code" = 200 ]
              out=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --max-time 10 --resolve "$h:80:$ip" "http://$h/")
              echo "http  $h -> $out"
              case "$out" in "301 https://$h"*) ;; *) echo "평문이 https 로 돌려보내지지 않는다"; exit 1;; esac
    - name: cluster-local-not-external
      try:
        - script:
            timeout: 2m
            content: |
              set -eu
              ip="${GATEWAY_IP:-192.168.0.103}"
              # 바깥 이름 규칙(<이름>-kn.oneinchmarket.local)으로 물어도 cluster-local 은 라우트가 없어야 한다.
              h=cs-private-kn.oneinchmarket.local
              code=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 --resolve "$h:443:$ip" "https://$h/" || true)
              echo "external https $h -> $code (200 이 아니어야 한다)"
              [ "$code" != 200 ]
              # 안쪽: local 의 메시 파드에서 클러스터 이름으로 — knative-local 게이트웨이(80)를 지난다.
              # livy-0 을 쓰는 이유: python3 가 있고 allow-knative-local-gateway 가 local 을 연다. 아무것도 바꾸지 않는다.
              code=$(kubectl -n local exec livy-0 -- python3 -c "import urllib.request; print(urllib.request.urlopen('http://cs-private.kn.svc.cluster.local/', timeout=30).status)" 2>&1 | tail -1)
              echo "internal http cs-private.kn.svc.cluster.local -> $code"
              [ "$code" = 200 ]
    - name: cold-start
      try:
        - script:
            timeout: 4m
            content: |
              set -eu
              ip="${GATEWAY_IP:-192.168.0.103}"
              h=cs-public-kn.oneinchmarket.local
              # cs-public 이 0 으로 줄 때까지 기다린 뒤 첫 요청을 본다(ksvc.yaml 이 창을 6s 로 줄였다 — 대개 1분 안).
              # ★ 파드 수로 재지 말 것 — Terminating 파드가 세어져 "줄지 않았다" 로 읽힌다. 판정은 리비전
              #   Deployment 의 replicas 와, 준비된 파드가 0 인지다(그 뒤의 요청은 activator 가 새 파드를 띄운다).
              r=x; ready=x; i=0
              while [ $i -lt 60 ]; do
                r=$(kubectl -n kn get deploy -l serving.knative.dev/service=cs-public -o jsonpath='{.items[0].spec.replicas}' 2>/dev/null || true)
                ready=$(kubectl -n kn get pods -l serving.knative.dev/service=cs-public -o jsonpath='{range .items[*]}{.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' 2>/dev/null | grep -c True || true)
                [ "$r" = 0 ] && [ "$ready" = 0 ] && break; i=$((i+1)); sleep 3
              done
              [ "$r" = 0 ] && [ "$ready" = 0 ] || { echo "180초 안에 0 으로 줄지 않았다 (replicas=$r ready=$ready)"; exit 1; }
              out=$(curl -sk -o /dev/null -w '%{http_code} %{time_total}' --max-time 60 --resolve "$h:443:$ip" "https://$h/")
              echo "cold https $h -> $out"
              case "$out" in "200 "*) ;; *) exit 1;; esac
