# Livy NetworkPolicy 가드 — Gotcha 228 ⑧. Livy SA 는 NetworkPolicy 를 만들 수 있고(Spark 4.2 가 드라이버마다
#   하나 만든다), ValidatingAdmissionPolicy livy-spark-networkpolicy-shape 가 그것을 Spark 의 모양 하나로 묶는다.
#   그 가드가 빠지면 Livy SA 가 아무 파드의 ingress 를 열 수 있다(NetworkPolicy 허용은 합집합 — default-deny 우회).
# 전부 서버측 dry-run 이다 — 아무것도 만들지 않는다. 네 경우:
#   ① livy SA · Spark 모양        -> 허용(가드가 정상 요청을 막지 않는다)
#   ② livy SA · 넓은 ingress       -> 가드가 거부(ipBlock 0.0.0.0/0 으로 postgresql)
#   ③ livy SA · Spark 모양 + egress -> 가드가 거부
#   ④ 관리자 · ②와 같은 것         -> 허용(대조군 — ②의 거부가 RBAC 이 아니라 가드 때문임을 보인다)
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: livy-networkpolicy-guard
spec:
  namespace: local
  steps:
    - name: guard-is-installed
      try:
        - assert:
            resource:
              apiVersion: admissionregistration.k8s.io/v1
              kind: ValidatingAdmissionPolicyBinding
              metadata:
                name: livy-spark-networkpolicy-shape
              spec:
                policyName: livy-spark-networkpolicy-shape
                validationActions: [Deny]
    - name: shape-matrix
      try:
        - script:
            timeout: 1m
            content: |
              set -u
              as=system:serviceaccount:local:livy
              fail=0
              # $1 사례 이름 · $2 기대(allow|deny) · $3 --as 인자(비우면 관리자) · stdin 매니페스트
              run() {
                name=$1; want=$2; asarg=$3
                if [ -n "$asarg" ]; then out=$(kubectl -n local create --dry-run=server --as="$asarg" -o name -f - 2>&1); rc=$?
                else out=$(kubectl -n local create --dry-run=server -o name -f - 2>&1); rc=$?; fi
                if [ "$want" = allow ]; then
                  if [ $rc = 0 ]; then echo "ok   $name: 허용"; else echo "FAIL $name: 허용돼야 하는데 거부 - $out"; fail=1; fi
                else
                  # 거부 사유가 가드여야 한다 — RBAC 거부(Forbidden ... cannot create)로 통과하면 가드를 잰 것이 아니다.
                  if [ $rc != 0 ] && echo "$out" | grep -q "livy-spark-networkpolicy-shape"; then echo "ok   $name: 가드가 거부"
                  else echo "FAIL $name: 가드가 거부해야 한다 (rc=$rc) - $out"; fail=1; fi
                fi
              }
              run spark-shape allow "$as" <<'EOF'
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata: {name: cs-spark-shape, labels: {spark-app-selector: spark-cs0001}}
              spec:
                podSelector: {matchLabels: {spark-role: executor, spark-app-selector: spark-cs0001}}
                ingress: [{from: [{podSelector: {matchLabels: {spark-app-selector: spark-cs0001}}}]}]
              EOF
              run wide-ingress deny "$as" <<'EOF'
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata: {name: cs-wide, labels: {spark-app-selector: spark-cs0001}}
              spec:
                podSelector: {matchLabels: {app.kubernetes.io/name: postgresql}}
                ingress: [{from: [{ipBlock: {cidr: 0.0.0.0/0}}]}]
              EOF
              run spark-shape-plus-egress deny "$as" <<'EOF'
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata: {name: cs-egress, labels: {spark-app-selector: spark-cs0001}}
              spec:
                podSelector: {matchLabels: {spark-role: executor, spark-app-selector: spark-cs0001}}
                policyTypes: [Ingress, Egress]
                ingress: [{from: [{podSelector: {matchLabels: {spark-app-selector: spark-cs0001}}}]}]
                egress: [{to: [{ipBlock: {cidr: 0.0.0.0/0}}]}]
              EOF
              run admin-control allow "" <<'EOF'
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata: {name: cs-wide, labels: {spark-app-selector: spark-cs0001}}
              spec:
                podSelector: {matchLabels: {app.kubernetes.io/name: postgresql}}
                ingress: [{from: [{ipBlock: {cidr: 0.0.0.0/0}}]}]
              EOF
              exit $fail
