  knoxsso.xml: |
    <topology>
      <gateway>
        <provider>
          <role>webappsec</role>
          <name>WebAppSec</name>
          <enabled>true</enabled>
          <param><name>xframe.options.enabled</name><value>true</value></param>
        </provider>

          <provider>
              <role>authentication</role>
              <name>ShiroProvider</name>
              <enabled>true</enabled>
              <param>
                  <!--
                  session timeout in minutes,  this is really idle timeout,
                  defaults to 30mins, if the property value is not defined,,
                  current client authentication would expire if client idles contiuosly for more than this value
                  -->
                  <name>sessionTimeout</name>
                  <value>30</value>
              </param>
              <param>
                  <name>redirectToUrl</name>
                  <value>/${GATEWAY_PATH}/knoxsso/knoxauth/login.html</value>
              </param>
              <param>
                  <name>restrictedCookies</name>
                  <value>rememberme,WWW-Authenticate</value>
              </param>
              <param>
                  <name>main.ldapRealm</name>
                  <value>org.apache.shiro.realm.ldap.JndiLdapRealm</value>
              </param>
              <param>
                  <name>main.ldapContextFactory</name>
                  <value>org.apache.shiro.realm.ldap.JndiLdapContextFactory</value>
              </param>
              <param>
                  <name>main.ldapRealm.contextFactory</name>
                  <value>$ldapContextFactory</value>
              </param>
              <param>
                  <name>main.ldapRealm.userDnTemplate</name>
                  <value>uid={0},ou=users,dc=oneinchmarket,dc=co,dc=kr</value>
              </param>
              <param>
                  <name>main.ldapRealm.contextFactory.url</name>
                  <value>ldap://ds389-headless.dev.svc.cluster.local:3389</value>
              </param>
              <param>
                  <name>main.ldapRealm.authenticationCachingEnabled</name>
                  <value>false</value>
              </param>
              <param>
                  <name>main.ldapRealm.contextFactory.authenticationMechanism</name>
                  <value>simple</value>
              </param>
              <param>
                  <name>urls./**</name>
                  <value>authcBasic</value>
              </param>
          </provider>

          <provider>
              <role>identity-assertion</role>
              <name>Default</name>
              <enabled>true</enabled>
          </provider>

          <provider>
              <role>hostmap</role>
              <name>static</name>
              <enabled>true</enabled>
              <param>
                  <name>localhost</name>
                  <value>sandbox,sandbox.hortonworks.com</value>
              </param>
          </provider>

      </gateway>

      <application>
        <name>knoxauth</name>
      </application>

      <service>
          <role>KNOXSSO</role>
          <!--
          <param>
              <name>knoxsso.cookie.secure.only</name>
              <value>true</value>
          </param>
          -->
          <param>
              <!-- 24 hours in milliseconds = 86400000 -->
              <name>knoxsso.token.ttl</name>
              <value>86400000</value>
          </param>
          <param>
            <name>knoxsso.cookie.domain.suffix</name>
            <value>knox-headless.dev.svc.cluster.local</value>
          </param>
          <param>
              <!-- since 2.1.0: KnoxSSO cookie validation -->
              <name>knox.token.exp.server-managed</name>
              <value>false</value>
          </param>
      </service>
    </topology>
  homepage.xml: |
    <topology>
      <name>homepage</name>
      <gateway>
          <provider>
            <role>webappsec</role>
            <name>WebAppSec</name>
            <enabled>true</enabled>
            <param>
                <name>csrf.enabled</name>
                <value>true</value>
            </param>
            <param>
                <name>csrf.customHeader</name>
                <value>X-XSRF-Header</value>
            </param>
            <param>
                <name>csrf.methodsToIgnore</name>
                <value>GET,OPTIONS,HEAD</value>
            </param>
            <param>
                <name>xframe.options.enabled</name>
                <value>true</value>
            </param>
            <param>
                <name>xss.protection.enabled</name>
                <value>true</value>
            </param>
            <param>
                <name>strict.transport.enabled</name>
                <value>false</value>
            </param>
            <param>
                <name>xframe.options</name>
                <value>SAMEORIGIN</value>
            </param>
          </provider>
          <provider>
            <role>federation</role>
            <name>SSOCookieProvider</name>
            <enabled>true</enabled>

            <param>
              <name>sso.authentication.provider.url</name>
              <value>
                https://knox-0.knox-headless.dev.svc.cluster.local:8443/gateway/knoxsso/api/v1/websso
              </value>
            </param>
            <param>
                <!-- since 2.1.0: KnoxSSO cookie validation -->
                <name>knox.token.exp.server-managed</name>
                <value>false</value>
            </param>
          </provider>
          <provider>
            <role>identity-assertion</role>
            <name>Default</name>
            <enabled>true</enabled>
            <param>
                <name>hadoop.proxyuser.impersonation.enabled</name>
                <value>false</value>
            </param>
            <param>
                <name>hadoop.proxyuser.changeme.users</name>
                <value>NONE</value>
            </param>
            <param>
                <name>hadoop.proxyuser.changeme.groups</name>
                <value>NONE</value>
            </param>
            <param>
                <name>hadoop.proxyuser.changeme.hosts</name>
                <value>NONE</value>
            </param>
          </provider>
      </gateway>
      <service>
          <role>KNOXSSOUT</role>
      </service>
      <service>
          <role>KNOX-SESSION</role>
      </service>
      <service>
          <role>KNOX-METADATA</role>
      </service>
      <service>
          <role>KNOXTOKEN</role>
          <param>
            <name>knox.token.ttl</name>
            <value>10368000000</value>
          </param>
          <param>
            <name>knox.token.target.url</name>
            <value>proxy-token/</value>
          </param>
          <param>
            <name>knox.token.client.data</name>
            <value>homepage_url=homepage/home?profile=token&amp;topologies=sandbox</value>
          </param>
          <param>
            <name>knox.token.exp.server-managed</name>
            <value>true</value>
          </param>
          <param>
              <name>knox.token.renewer.whitelist</name>
              <value>admin</value>
          </param>
          <param>
              <name>knox.token.type</name>
              <value>JWT</value>
          </param>
      </service>
      <application>
          <name>token-generation</name>
      </application>
      <application>
          <name>home</name>
      </application>
      <application>
          <name>token-management</name>
      </application>
      <application>
          <name>webshell-ui</name>
      </application>
    </topology>