      <!-- 필요시 Knox JWT, SSO, Audit 설정을 여기 추가 -->
    </configuration>
  sandbox.xml: |-
    <?xml version="1.0" encoding="UTF-8"?>
    <topology>
      <gateway>
        <!-- Shiro + LDAP(389ds) 인증 -->
        <provider>
          <role>authentication</role>
          <name>ShiroProvider</name>
          <enabled>true</enabled>

          <!-- Shiro LDAP Realm 설정 -->
          <param>
            <name>main.ldapRealm</name>
            <value>org.apache.shiro.realm.ldap.JndiLdapRealm</value>
          </param>
          <param>
            <name>main.ldapRealm.contextFactory.url</name>
            <value>ldap://ds389-headless.dev.svc.cluster.local:3389</value>
          </param>
          <param>
            <name>main.ldapRealm.userDnTemplate</name>
            <value>uid={0},ou=users,dc=oneinchmarket,dc=co,dc=kr</value>
          </param>
          <param>
            <name>main.ldapRealm.contextFactory.environment[ldap.security.authentication]</name>
            <value>simple</value>
          </param>

          <!-- 모든 URL은 Basic Auth 요구 -->
          <param>
            <name>urls./**</name>
            <value>authcBasic</value>
          </param>
        </provider>

        <!-- identity assertion (기본) -->
        <provider>
          <role>identity-assertion</role>
          <name>Default</name>
          <enabled>true</enabled>
        </provider>
      </gateway>

      <!-- HDFS / WebHDFS -->
      <service>
        <role>NAMENODE</role>
        <url>hdfs://hadoop-namenode-headless.dev.svc.cluster.local:8020</url>
      </service>

      <service>
        <role>WEBHDFS</role>
        <url>http://hadoop-namenode-headless.dev.svc.cluster.local:9870/webhdfs</url>
      </service>

      <!-- HiveServer2 (Kerberos) -->
      <service>
        <role>HIVE</role>
        <url>http://hive-server-headless.dev.svc.cluster.local:10001/cliservice</url>
      </service>
    </topology>
  default-providers.json: |
