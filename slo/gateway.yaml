# Sloth 형식 SLO 정의 — 여기서 Prometheus 규칙을 **생성**한다.
#
# ★ 왜 컨트롤러가 아니라 생성인가 — 이 클러스터에는 Prometheus Operator 가 없다
#   (실측: monitoring.coreos.com CRD 0개). Prometheus 는 평 prom/prometheus 이고
#   규칙은 `prometheus-rules` ConfigMap 에서 온다. Sloth 의 컨트롤러 모드는
#   PrometheusRule CR 을 만드는데 그것을 받을 곳이 없다.
#   그래서 `local/render-slo.sh` 가 규칙 YAML 을 만들어 **git 에 둔다** —
#   `render-ratelimit.py` 와 같은 모양이다(§8-90: 렌더 결과를 커밋할 것).
version: "prometheus/v1"
service: "gateway"
labels:
  owner: "platform"
slos:
  - name: "availability"
    objective: 99.0
    description: "ingress 게이트웨이의 5xx 비율. 5xx 는 우리 잘못이라 청구에서도 제외한다(§8-87)."
    sli:
      events:
        # ★ **이미 계량되는 지표**로 잡는다. 없는 지표로 SLO 를 쓰면 그래프가
        #   비고, 빈 그래프는 "SLO 가 좋다" 로 읽힌다.
        # ★★★ `or on() vector(0)` 가 필요하다 (2026-10-06 실측).
        #   이것이 없으면 **오류가 0일 때 SLI 가 통째로 비어 버린다.**
        #   PromQL 에서 선택자가 아무것도 고르지 못하면 `sum(rate(...))` 는
        #   0 이 아니라 **빈 벡터**를 내고, `빈 벡터 / 무엇` 도 빈 벡터다.
        #   즉 5xx 가 한 건도 없는 **건강한 상태**에서 기록 규칙이
        #   아무 값도 남기지 않는다.
        #   ★ 실측으로 확정했다: 요청 10건(전부 403)을 보내 분모가
        #     0.037 로 올라간 뒤에도 `slo:sli_error:ratio_rate5m` 가 EMPTY
        #     였고, 같은 식에 `or on() vector(0)` 을 넣으니 **0** 이 나왔다.
        #   ★★ 이것이 Gotcha 150·161 이 적어 둔 구멍이다 — "빈 그래프는
        #     지표가 없는 것이고 0 은 오류가 없는 것인데, 둘을 묶어 보면
        #     장애가 좋다로 읽힌다". 고치지 않으면 **완벽한 건강과
        #     완전한 장애가 똑같이 빈 그래프**로 보인다.
        #   ★ 트래픽이 아예 없을 때는 여전히 `0/0 = NaN` 이고 그것은 정직하다
        #     — 그 경우를 말해 주는 것은 `SLOMetricAbsent` 다(분모가 사라진 것).
        error_query: sum(rate(istio_requests_total{reporter="source",response_code=~"5.."}[{{.window}}])) or on() vector(0)
        total_query: sum(rate(istio_requests_total{reporter="source"}[{{.window}}]))
    alerting:
      name: GatewayHighErrorRate
      page_alert:
        labels:
          severity: critical
      ticket_alert:
        labels:
          severity: warning
