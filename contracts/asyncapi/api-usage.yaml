asyncapi: '2.6.0'
info:
  title: API Usage Metering
  version: '1.0.0'
  description: |
    외부 고객에게 **인보이스를 발행하기 위한** API 호출 계량 채널.

    ## 왜 계약이 먼저인가

    계량 지점을 나중에 바꾸면 이벤트 스키마·집계 규칙·**이미 청구한 이력**이
    함께 흔들린다. 청구는 소급 재해석이 불가능한 종류의 데이터라, 이 계약이
    Gateway·계량 백엔드보다 먼저 고정되어야 한다.

    ## 경로

    ```
    Istio Gateway(Envoy 액세스 로그) → Kafka(api-usage) → 계량 백엔드 → 인보이스
    ```

    계량 백엔드는 아직 확정되지 않았다(ADR-071). CloudEvents 1.0 봉투를 쓰는
    이유가 그것이다 — 백엔드를 바꿔도 이 계약과 발행 측은 그대로 둔다.

    ## 청구 정확성에 직결되는 세 가지

    1. **멱등성** — Kafka 는 at-least-once 다. 같은 이벤트가 반드시 두 번 이상
       온다. `id`(Envoy `x-request-id`)로 중복을 제거하지 않으면 고객에게
       과다 청구한다.
    2. **관측 시각** — `time` 이 청구 주기 귀속을 정한다. 수집 시각이 아니다.
       게이트웨이 NTP 동기화가 전제다.
    3. **지각 이벤트** — 월말 경계에서 늦게 도착한 이벤트를 어느 달에 넣을지는
       **계량 백엔드의 정책**이다. 이 계약은 `time` 을 정확히 실어 주는 데까지
       책임진다.

    ## 담지 않는 것

    개인식별정보를 넣지 않는다. `subject` 는 사용자가 아니라 **조직/테넌트**
    식별자다 — 담당자가 바뀌어도 청구 주체는 유지되어야 한다.
  contact:
    name: OneinchMarket Platform
    url: https://gitlab.oneinchmarket.co.kr/infra/oneinchmarket-infra
  license:
    name: Proprietary

servers:
  local:
    url: kafka-headless.local.svc.cluster.local:9092
    protocol: kafka
    description: |
      로컬 단일 노드. 평문처럼 보이나 ambient 편입 상태라 ztunnel 이 mTLS 로
      감싼다. 발행자에게는 전용 ServiceAccount 가 필요하고 Kafka 의
      AuthorizationPolicy(`allow-messaging-access`)에 그 신원을 추가해야 한다 —
      빠뜨리면 조용히 끊긴다.

defaultContentType: application/json

channels:
  api-usage:
    description: |
      API 호출 계량 이벤트. **파티션 키는 `subject`(테넌트)** 로 둔다 —
      한 고객의 이벤트가 순서를 유지해야 집계와 정정이 단순해진다.

      보존은 청구 분쟁 대응 기간을 따른다. 집계 후 원본을 버리면 재계산과
      감사가 불가능해지므로, 보존 기간은 요금 정책이 정할 사항이다(미결).
    subscribe:
      operationId: consumeApiUsage
      summary: 계량 백엔드가 소비한다
      tags:
        - name: billing
      message:
        $ref: '#/components/messages/ApiUsageEvent'
    publish:
      operationId: publishApiUsage
      summary: Istio Gateway 의 액세스 로그 파이프라인이 발행한다
      tags:
        - name: billing
      message:
        $ref: '#/components/messages/ApiUsageEvent'

components:
  messages:
    ApiUsageEvent:
      name: ApiUsageEvent
      title: API Usage Event
      summary: 요청 한 건에 대한 계량 사실
      contentType: application/json
      payload:
        $ref: '../schemas/api-usage-event.json'
