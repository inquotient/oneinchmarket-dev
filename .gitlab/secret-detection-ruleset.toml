# GitLab Secret Detection 룰셋 커스터마이징
#
# ★ 분석기가 이 파일이 없으면 기동 로그에 이렇게 남긴다:
#     .gitlab/secret-detection-ruleset.toml not found,
#     ruleset customization will be disabled.
#
# ★★ 여기 적는 것은 오탐만이다. 진짜 시크릿을 조용히 지우는 자리가
#   아니다. §8-92 에서 9건을 분류했고, 진짜였던 둘은 예외를 두지 않고
#   트리에서 제거했다(v1/cluster/tls.key · openreplay 의 site.key).
#
# ★ 예외는 자란다. 하나 더할 때마다 왜 오탐인지를 여기 적을 것 —
#   사유 없는 줄은 다음 사람이 지울 수도 없고 믿을 수도 없다.

[secrets]

  # ── 1) 자리표시자를 실제 비밀번호로 오인 ─────────────────────
  # OpenMeter 는 설정 파일이 유일한 경로이고 환경변수 오버라이드가 먹지
  # 않는다(Gotcha 26). 그래서 평문 비밀번호를 두지 않으려고
  # __OPENMETER_DB_PASSWORD__ 형태의 자리표시자를 두고 initContainer 가
  # 치환한다(local/render-openmeter.py). 스캐너는 그것을 URL 안의
  # 비밀번호로 읽는다.
  # ★ 실측 확인: 토큰이 __xxxxxxxx_xxxxxxxx__ 패턴이다.
  [[secrets.ruleset]]
    id = "gitlab_password_in_url"
    [secrets.ruleset.override]
      description = "Password in URL (자리표시자는 제외 — §8-92)"
    [[secrets.ruleset.allowlist]]
      description = "__PLACEHOLDER__ 형태의 치환 토큰"
      regexes = ["__[A-Z0-9]+_[A-Z0-9_]+__"]

  # ── 2) 보안 문서가 자기 자신을 설명하는 문자열 ────────────────
  # docs/SECURITY.md 는 SEC-xxx 를 세는 문서다. SEC-401(커밋된 개인키)을
  # 설명하면서 -----BEGIN PRIVATE KEY----- 라는 문자열 자체를 표에 적는데,
  # 스캐너가 그것을 키로 읽는다.
  # ★ 문서를 고쳐 스캐너를 피하지 않는다 — 그러면 문서가 사실을 말하지
  #   못하게 된다. 예외를 여기 둔다.
  # ★ 범위를 docs/ 로 좁힌다. 매니페스트나 코드에 키가 들어오면 여전히 잡힌다.
  [[secrets.ruleset]]
    id = "PKCS8-PK"
    [secrets.ruleset.override]
      description = "PKCS8 private key (보안 문서의 설명 문자열은 제외 — §8-92)"
    [[secrets.ruleset.allowlist]]
      description = "docs/ 안의 설명용 헤더 문자열"
      paths = ["docs/.*"]
