# ArgoCD Application - Prod Environment
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oneinchmarket-prod
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: argocd
    environment: prod
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: oneinchmarket

  source:
    repoURL: https://gitlab.oneinchmarket.co.kr/infra/oneinchmarket-infra.git
    targetRevision: v2
    path: kubernetes/overlays/prod
    plugin:
      name: kustomize-sops
      env:
        - name: SOPS_AGE_KEY_FILE
          value: /sops/age/keys.txt

  destination:
    server: https://kubernetes.default.svc
    namespace: prod

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
