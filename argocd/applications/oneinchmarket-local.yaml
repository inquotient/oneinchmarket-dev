# ArgoCD Application — local (§8-83)
#
# ★★ **자동 동기화를 켜지 않는다.** dev/prod Application 은
#   `automated{prune,selfHeal}` 인데, 이 클러스터에는 ArgoCD 밖에서 만든 것이
#   많다 — 오퍼레이터 계층(Istio·ECK·Kyverno·cert-manager·Tetragon·Trivy·ESO) ·
#   `create-secrets.sh` 의 시크릿 · `openbao-init.sh` 의 키 · GitLab 레지스트리
#   자격. **prune 을 켜면 그것들이 "git 에 없다" 는 이유로 지워진다.**
#   먼저 수동으로 diff 를 확인하고, 무엇이 지워질지 이해한 뒤에 켤 것.
#
# ★ ADR-068 의 머지 관문(§9-4)도 같은 이야기를 한다 — dev 의 automated 를
#   먼저 해제하고 wave 순으로 나눠 붙이라고 되어 있다.
#
# ★ plugin(kustomize-sops)을 쓰지 않는다. 시크릿은 External Secrets 가
#   OpenBao 에서 가져온다(§8-81·82) — SOPS 자체가 필요 없어졌다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oneinchmarket-local
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: oneinchmarket
    app.kubernetes.io/managed-by: argocd
    environment: local
  # ★ finalizer 를 두지 않는다. 두면 Application 을 지울 때 ArgoCD 가
  #   **관리 중인 리소스를 함께 지운다.** 지금은 그것을 원하지 않는다.
spec:
  project: oneinchmarket-local

  source:
    repoURL: http://gitlab-registry.local.svc.cluster.local/infra/oneinchmarket-infra.git
    targetRevision: local
    path: kubernetes/overlays/local

  destination:
    server: https://kubernetes.default.svc
    namespace: local

  # syncPolicy 를 비워 둔다 = 수동 동기화.
  # 상태는 계속 계산되므로 "무엇이 다른가" 는 볼 수 있다.
  syncPolicy:
    syncOptions:
      - CreateNamespace=false
      - RespectIgnoreDifferences=true
      # ★ 서버 사이드 적용. 이 레포는 매니페스트가 커서
      #   last-applied-configuration 어노테이션이 한계에 걸린다.
      - ServerSideApply=true

  ignoreDifferences:
    # ECK·cert-manager 가 채우는 필드는 diff 에서 뺀다 — 안 그러면
    # 영원히 OutOfSync 로 보인다.
    - group: ""
      kind: Secret
      jsonPointers:
        - /data
