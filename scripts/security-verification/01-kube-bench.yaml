# 7-1: kube-bench CIS Kubernetes Benchmark
# 실행: kubectl apply -f 01-kube-bench.yaml
# 결과: kubectl logs job/kube-bench
apiVersion: batch/v1
kind: Job
metadata:
  name: kube-bench
  namespace: dev
  labels:
    app.kubernetes.io/name: kube-bench
    app.kubernetes.io/component: security-verification
    app.kubernetes.io/part-of: oneinchmarket
spec:
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-bench
    spec:
      hostPID: true
      restartPolicy: Never
      containers:
        - name: kube-bench
          image: aquasec/kube-bench:latest
          command:
            - kube-bench
            - run
            - --targets
            - node,policies
            - --json
          volumeMounts:
            - name: var-lib-kubelet
              mountPath: /var/lib/kubelet
              readOnly: true
            - name: etc-kubernetes
              mountPath: /etc/kubernetes
              readOnly: true
            - name: etc-systemd
              mountPath: /etc/systemd
              readOnly: true
      volumes:
        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
        - name: etc-systemd
          hostPath:
            path: /etc/systemd
