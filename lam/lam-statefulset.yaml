apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lam
spec:
  # whenDeleted를 Delete로 설정하면 pod가 지워지면 pvc도 같이 지워지도록 할 수 있다. 
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
  serviceName: lam-headless
  replicas: 1
  selector:
    matchLabels:
      app: lam
  template:
    metadata:
      labels:
        app: lam
    spec:
      setHostnameAsFQDN: true
      containers:
        - name: lam
          image: ldapaccountmanager/lam:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          env:
            - name: LAM_SKIP_PRECONFIGURE_CHECK
              value: "true"
            - name: LAM_LANG
              value: "en_US"
            # LDAP 접속 설정
            - name: LAM_LDAP_SERVER
              valueFrom:
                configMapKeyRef:
                  name: lam-configmap
                  key: LDAP_SERVER
            - name: LAM_LDAP_BASE_DN
              valueFrom:
                configMapKeyRef:
                  name: lam-configmap
                  key: LDAP_BASE_DN
            - name: LAM_PROFILE
              valueFrom:
                configMapKeyRef:
                  name: lam-configmap
                  key: LAM_PROFILE
            - name: LAM_ADMIN_USER
              valueFrom:
                configMapKeyRef:
                  name: lam-configmap
                  key: LAM_ADMIN_DN
            - name: LAM_SECURE_KEY
              valueFrom:
                configMapKeyRef:
                  name: lam-configmap
                  key: LAM_SECURE_KEY
            - name: LAM_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: lam-configmap
                  key: LAM_ADMIN_PASSWORD
  volumeClaimTemplates:
    - metadata:
        name: pvc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 20Gi
