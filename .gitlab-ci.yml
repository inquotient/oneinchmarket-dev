# OneinchMarket v2 - GitLab CI/CD Pipeline
# Trivy 이미지 스캔 + Cosign 서명 + Kustomize 검증

# ──────────────────────────────────────────
# GitLab Secret Detection (§8-88)
#
# ★ 이 기능은 Free 티어다 — 이 인스턴스는 라이선스가 없어(gitlab-ee 19.3.1,
#   plan=Free) Ultimate 전용인 **Secret Push Protection**(pre-receive 차단)은
#   쓸 수 없다. 파이프라인 방식만 가능하고, 그것이 아래 템플릿이다.
#
# ★★ 이것을 켜기 전에 **러너가 0개**였다. 파이프라인 10건이 만들어지고도
#   한 번도 실행되지 않았다(잡 24건 canceled). 템플릿만 include 하면
#   "켠 것처럼 보이고 아무것도 돌지 않는" 상태가 된다 — 러너는
#   kubernetes/overlays/local/gitlab-runner/ 에 있다.
# ──────────────────────────────────────────
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

stages:
  - validate
  - build
  - scan
  - sign
  - mirror
  - deploy

variables:
  REGISTRY: registry.oneinchmarket.co.kr
  TRIVY_SEVERITY: "HIGH,CRITICAL"
  TRIVY_EXIT_CODE: "1"

# ──────────────────────────────────────────
# Stage: validate - Kustomize 매니페스트 검증
# ──────────────────────────────────────────
kustomize-validate:
  stage: validate
  image: registry.k8s.io/kustomize/kustomize:v5.4.3
  # ★★ 렌더 결과를 아티팩트로 남긴다 — 뒤의 잡이 그것을 쓴다.
  #   이유: trivy config 가 소스 트리를 직접 읽으면 **kustomize 패치
  #   조각**(requests-local.yaml 등)을 완성된 매니페스트로 착각해
  #   securityContext·probe 가 없다고 지적한다. 실측 338건 중 149건이
  #   패치 파일 3개에서 나왔다 — 배포되지 않는 조각이다(§8-97).
  script:
    - mkdir -p rendered
    - kustomize build kubernetes/overlays/dev > rendered/dev.yaml
    - kustomize build kubernetes/overlays/prod > rendered/prod.yaml
    - kustomize build kubernetes/overlays/local > rendered/local.yaml
    - echo "Kustomize validation passed"
  artifacts:
    paths:
      - rendered/
    expire_in: 1h
  rules:
    - changes:
        - kubernetes/**/*

# ★★ 이 잡은 오랫동안 **실행조차 되지 않았다.** 두 가지가 겹쳐 있었다:
#   ① kubeconform 이미지 안에서 `kustomize` 를 불렀다(그 이미지에 없다).
#   ② 그 전에 이미 죽었다 — distroless 라 **셸이 없어** GitLab 러너가
#      script 를 실행할 수없다:
#        exec: "sh": executable file not found in $PATH
#        ERROR: Job failed (system failure): prepare environment
#      그래서 로그에 스키마 오류가 하나도 없었고, allow_failure 가
#      그것을 덮어 **검사가 도는 줄 알았다**(§8-97).
#   -> `-alpine` 변종은 셸이 있다. 렌더는 kustomize-validate 가 이미
#      아티팩트로 남기므로 여기서 kustomize 를 불를 이유가 없다.
# ★ allow_failure 는 일단 true 로 둔다 — 이 잡이 처음 실행되는 것이라
#   실제 스키마 위반이 몇 건인지 아직 모른다. 숫자를 본 뒤에 결정한다(§9-12).
kubeconform-validate:
  stage: validate
  image:
    name: ghcr.io/yannh/kubeconform:v0.6.7-alpine
    entrypoint: [""]
  needs:
    - kustomize-validate
  script:
    - kubeconform -strict -summary -ignore-missing-schemas rendered/dev.yaml
    - kubeconform -strict -summary -ignore-missing-schemas rendered/prod.yaml
    - kubeconform -strict -summary -ignore-missing-schemas rendered/local.yaml
  rules:
    - changes:
        - kubernetes/**/*
  allow_failure: true


# ──────────────────────────────────────────
# Stage: validate - API 계약 린트 (계약 우선, ADR-067)
# ──────────────────────────────────────────
# contracts/ 가 원천이다. 레지스트리 규칙(VALIDITY·COMPATIBILITY)이
# 구문·호환을 보고, Spectral 이 스타일·거버넌스를 본다.
#
# 계약이 아직 하나도 없다. 그래서 파일이 없으면 조용히 통과한다 —
# 다만 **에코로 분명히 남긴다.** 아무것도 안 한 잡이 초록색으로만 남으면
# 검사가 도는 줄 착각하게 된다(ds389-bootstrap 에서 겪은 것과 같은 계열).
spectral-lint:
  stage: validate
  image: stoplight/spectral:6.16.3
  script:
    - |
      set -e
      found=$(find contracts/openapi contracts/asyncapi -type f \( -name '*.yaml' -o -name '*.yml' -o -name '*.json' \) 2>/dev/null | sort)
      if [ -z "$found" ]; then
        echo "[spectral] contracts/ 에 계약 파일이 없다 — 검사할 것이 없다."
        echo "[spectral] 계약이 들어오면 이 잡이 자동으로 검사한다. contracts/README.md 참조."
        exit 0
      fi
      echo "[spectral] 대상:"; echo "$found" | sed 's/^/  /'
      echo "$found" | xargs spectral lint --ruleset .spectral.yaml --fail-severity=error
  rules:
    - changes:
        - contracts/**/*
        - .spectral.yaml
# ──────────────────────────────────────────
# Stage: build - 자체 이미지 빌드
# ──────────────────────────────────────────
.build-template: &build-template
  stage: build
  image: docker:latest
  services:
    - docker:dind
  before_script:
    - docker login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${REGISTRY}"
  script:
    - docker build -t "${REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHA}" -f "${DOCKERFILE}" "${CONTEXT}"
    - docker push "${REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHA}"
    - docker tag "${REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHA}" "${REGISTRY}/${IMAGE_NAME}:latest"
    - docker push "${REGISTRY}/${IMAGE_NAME}:latest"

build-admin:
  <<: *build-template
  variables:
    IMAGE_NAME: inquotient/admin
    DOCKERFILE: v1/admin/Dockerfile
    CONTEXT: v1/admin
  rules:
    - changes:
        - v1/admin/**/*

build-cmmn-api:
  <<: *build-template
  variables:
    IMAGE_NAME: inquotient/cmmn-api
    DOCKERFILE: v1/cmmn-api/Dockerfile
    CONTEXT: v1/cmmn-api
  rules:
    - changes:
        - v1/cmmn-api/**/*

# ──────────────────────────────────────────
# Stage: scan - Trivy 이미지/매니페스트 취약점 스캔
# ──────────────────────────────────────────
trivy-image-scan:
  stage: scan
  image: aquasec/trivy:latest
  script:
    - trivy image --severity ${TRIVY_SEVERITY} --exit-code ${TRIVY_EXIT_CODE}
        --format table "${REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHA}"
  parallel:
    matrix:
      - IMAGE_NAME:
          - inquotient/admin
          - inquotient/cmmn-api
  rules:
    - changes:
        - v1/admin/**/*
        - v1/cmmn-api/**/*
  allow_failure: false

# ★★ 이 잡은 **한 번도 성공한 적이 없었다**(실제로 돌은 4번 전부 실패).
#   매니페스트가 바뀔 때만 돌아서 오래 드러나지 않았다. 고친 것 셋:
#
#   ① 대상 — 소스 트리 대신 **렌더 결과**를 읽는다(kustomize-validate 의
#      아티팩트). 패치 조각에서 나오던 구조적 오탐 149건이 사라진다.
#   ② 임계 — 차단은 **CRITICAL** 만. HIGH 는 아래 report 잡이 비차단으로
#      계속 보고한다. ★ 이유: HIGH 가 366건이고 그중 312건이
#      readOnlyRootFilesystem 미설정이다 — 진짜 부채이지만 한 번에 갑을 수
#      없다. **달성할 수 없는 게이트는 없는 게이트보다 나쁘다** —
#      무시하는 버릇을 기른다(Gotcha 73 이 allow_failure 에 대해 한 말과 같다).
#   ③ 예외 — .trivyignore.yaml 에 **근거를 적어** 둔다(지금 1건).
#   ④ 버전 고정 — :latest 는 결과가 조용히 변한다(Gotcha 45·60).
trivy-config-scan:
  stage: scan
  image: aquasec/trivy:0.74.0
  needs:
    - kustomize-validate
  script:
    - trivy config --severity CRITICAL --exit-code 1
        --ignorefile .trivyignore.yaml rendered/
  rules:
    - changes:
        - kubernetes/**/*
  allow_failure: false

# HIGH 를 숨기지 않기 위한 잡. 막지는 않지만 **보이게** 한다.
# ★ 이 숫자가 줄지 않으면 부채를 갑지 않고 있는 것이다(§9-12).
trivy-config-report:
  stage: scan
  image: aquasec/trivy:0.74.0
  needs:
    - kustomize-validate
  script:
    - trivy config --severity HIGH,CRITICAL --exit-code 0
        --ignorefile .trivyignore.yaml rendered/
  rules:
    - changes:
        - kubernetes/**/*
  allow_failure: true

trivy-filesystem-scan:
  stage: scan
  image: aquasec/trivy:latest
  script:
    - trivy fs --severity ${TRIVY_SEVERITY} --security-checks vuln,secret,misconfig .
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true

# ──────────────────────────────────────────
# Secret Detection — 템플릿을 이 파이프라인에 맞춘다
#
# ★ 템플릿의 기본 stage 는 `test` 인데 **이 파이프라인에는 그런 스테이지가
#   없다.** 그대로 두면 잡이 만들어지지 않는다(오류도 나지 않는다).
#   `scan` 으로 덮는다.
#
# ★★ `allow_failure` 를 **false 로 덮는다.** 템플릿 기본값은 true 라
#   시크릿을 찾아내고도 파이프라인이 초록으로 끝난다 — 이 레포가 반복해서
#   경계하는 "성공 출력이 성공을 뜻하지 않는" 부류다(Gotcha 12).
#   시크릿이 커밋되는 것은 막아야 할 일이지 기록할 일이 아니다.
#   ★ 다만 지금은 **이미 커밋된 개인키가 있다**(v1/cluster/tls.key, SEC-401).
#   그래서 첫 실행은 반드시 실패한다 — 그것이 이 기능이 동작한다는 증거다.
#   SEC-401 을 해소하기 전까지는 이 잡이 빨간불로 남는다.
secret_detection:
  stage: scan
  # ★★ needs: [] 로 앞 스테이지에서 떼어낸다.
  #   스테이지 순서상 scan 은 validate 뒤인데, 이 레포의 validate 3종은
  #   따로 고장나 있다(kubeconform 잡이 kubeconform 이미지 안에서 kustomize 를
  #   실행한다 — CLAUDE.md). 그러면 secret_detection 이 skipped 가 되어
  #   **켜 두고도 한 번도 돌지 않는다.**
  #   시크릿 검사는 매니페스트 검증에 의존할 이유가 없다 — 오히려 앞이
  #   깨졌을 때야말로 돌아야 한다.
  needs: []
  allow_failure: false
  variables:
    # 기본 50 은 얕아서 오래된 커밋의 시크릿을 놓친다. 0 = 전체 이력.
    GIT_DEPTH: "0"
    # 스캔에서 뺄 경로. 지금은 없다 — 예외를 두기 시작하면 그 예외가
    # 자라므로, 빼야 할 것이 생기면 사유를 여기 적을 것.
    SECRET_DETECTION_EXCLUDED_PATHS: ""

# ★★ 이력 전체 스캔 — 증분 스캔으로는 **이미 커밋된 시크릿을 못 찾는다.**
#   실측: 기본 동작은 마지막 스캔 이후의 커밋만 본다.
#     Fetching commits since ... for ref local
#     1 commits scanned.  scanned ~543 bytes  no leaks found
#   543바이트를 훑고 "성공" 이 나온다 — 켜 두고도 아무것도 못 보는 상태다
#   (Gotcha 12 의 부류). 위 secret_detection 은 **새 유출을 막는** 용도이고,
#   이미 들어간 것은 이 잡이 찾는다.
#
# ★ 매 push 마다 돌리지 않는다. 이력 전체를 훑는 비용이 크고, 같은 발견이
#   매번 반복되면 경보가 무시된다. schedule 과 수동 실행에서만 돈다.
#
# ★★ allow_failure 를 true 로 둔다 — 이것은 **이미 있는 빚**을 세는 잡이라
#   파이프라인을 막는 것이 목적이 아니다. 새 유출을 막는 것은 위의
#   secret_detection(allow_failure: false)이 한다. 둘의 역할이 다르다.
secret_detection_historic:
  extends: .secret-analyzer
  stage: scan
  needs: []
  allow_failure: true
  # ★ script 를 직접 준다. 템플릿의 `script: [/analyzer run]` 은
  #   `.secret-analyzer` 가 아니라 **secret_detection 잡 쪽**에 있어
  #   extends 로 상속되지 않는다. 빠뜨리면 스크립트 잡으로 분류되지 못해
  #     jobs:...: config contains unknown keys: image, services, artifacts
  #   라는 **엉뚱한 오류**가 난다(진짜 원인은 script 누락이다).
  script:
    - /analyzer run
  variables:
    GIT_DEPTH: "0"
    # 이 변수 하나가 증분 -> 이력 전체로 바꾼다.
    SECRET_DETECTION_HISTORIC_SCAN: "true"
    SECRET_DETECTION_EXCLUDED_PATHS: ""
  artifacts:
    reports:
      secret_detection: gl-secret-detection-report.json
    paths: [gl-secret-detection-report.json]
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: manual
      allow_failure: true

# ──────────────────────────────────────────
# Stage: sign - Cosign 이미지 서명
# ──────────────────────────────────────────
cosign-sign:
  stage: sign
  image: bitnami/cosign:latest
  script:
    - echo "${COSIGN_KEY}" > /tmp/cosign.key
    - cosign sign --key /tmp/cosign.key
        "${REGISTRY}/${IMAGE_NAME}:${CI_COMMIT_SHA}"
    - rm -f /tmp/cosign.key
  parallel:
    matrix:
      - IMAGE_NAME:
          - inquotient/admin
          - inquotient/cmmn-api
  variables:
    COSIGN_PASSWORD: "${COSIGN_KEY_PASSWORD}"
  rules:
    - changes:
        - v1/admin/**/*
        - v1/cmmn-api/**/*
  needs:
    - trivy-image-scan

# ──────────────────────────────────────────
# Stage: mirror - 외부 이미지 미러링
# ──────────────────────────────────────────
mirror-images:
  stage: mirror
  image: quay.io/skopeo/stable:latest
  before_script:
    - skopeo login -u "${CI_REGISTRY_USER}" -p "${CI_REGISTRY_PASSWORD}" "${REGISTRY}"
  script:
    - |
      IMAGES=(
        "docker.io/bitnami/postgresql:latest"
        "docker.io/bitnami/mariadb:latest"
        "docker.io/percona/percona-server-mongodb:latest"
        "docker.io/bitnami/redis-cluster:latest"
        "quay.io/keycloak/keycloak:latest"
        "docker.io/apache/kafka:latest"
        "docker.io/tchiotludo/akhq:latest"
        "docker.io/apicurio/apicurio-registry:latest"
        "docker.io/minio/minio:latest"
        "docker.io/trinodb/trino:latest"
        "docker.io/apache/hive:latest"
        "docker.io/library/nginx:latest"
        "docker.elastic.co/logstash/logstash:latest"
        "docker.elastic.co/beats/filebeat:latest"
      )

      for img in "${IMAGES[@]}"; do
        name=$(echo "$img" | sed 's|.*/||')
        echo "Mirroring: $img → ${REGISTRY}/mirror/${name}"
        skopeo copy "docker://${img}" "docker://${REGISTRY}/mirror/${name}" --all || true
      done
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  allow_failure: true

# ──────────────────────────────────────────
# Stage: deploy - ArgoCD Sync 트리거
# ──────────────────────────────────────────
deploy-dev:
  stage: deploy
  image: argoproj/argocd:latest
  script:
    - argocd login "${ARGOCD_SERVER}" --username admin
        --password "${ARGOCD_PASSWORD}" --insecure
    - argocd app sync oneinchmarket-dev --prune --timeout 300
    - argocd app wait oneinchmarket-dev --timeout 600
  environment:
    name: dev
  rules:
    - if: $CI_COMMIT_BRANCH == "v2"
      changes:
        - kubernetes/**/*


# ──────────────────────────────────────────
# Stage: deploy - API 계약을 Apicurio 에 게시 (ADR-067)
# ──────────────────────────────────────────
# 계약 우선이므로 **레지스트리는 contracts/ 를 따라간다.**
# 게시 시점에 레지스트리 전역 규칙(VALIDITY=FULL·COMPATIBILITY=BACKWARD)이
# 한 번 더 막는다 — CI 의 Spectral 과 이중 게이트다.
#
# 스키마는 ccompat(v7)로, OpenAPI/AsyncAPI 는 Registry v3 API 로 올린다.
# subject·artifactId 규칙은 contracts/README.md 를 볼 것.
publish-contracts:
  stage: deploy
  image: curlimages/curl:8.11.1
  variables:
    REGISTRY_V3: "http://apicurio-registry-headless.dev.svc.cluster.local:8080/apis/registry/v3"
    REGISTRY_CCOMPAT: "http://apicurio-registry-headless.dev.svc.cluster.local:8080/apis/ccompat/v7"
  script:
    - |
      set -eu
      published=0

      # ── 1. Avro/JSON 스키마 -> ccompat. 파일명이 곧 subject 다.
      for f in $(find contracts/schemas -type f \( -name '*.avsc' -o -name '*.json' \) 2>/dev/null | sort); do
        subject=$(basename "$f"); subject="${subject%.*}"
        echo "[publish] subject=$subject  <- $f"
        payload=$(awk 'BEGIN{ORS=""} {gsub(/"/,"\\\""); gsub(/\t/,"  "); print $0"\n"}' "$f")
        code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
          "$REGISTRY_CCOMPAT/subjects/$subject/versions" \
          -H 'Content-Type: application/vnd.schemaregistry.v1+json' \
          -d "{\"schema\":\"$payload\"}")
        echo "  http=$code"; [ "$code" -lt 300 ] || { cat /tmp/out; exit 1; }
        published=$((published+1))
      done

      # ── 2. OpenAPI/AsyncAPI -> Registry v3. 파일명이 곧 artifactId 다.
      for f in $(find contracts/openapi contracts/asyncapi -type f \( -name '*.yaml' -o -name '*.yml' \) 2>/dev/null | sort); do
        aid=$(basename "$f"); aid="${aid%.*}"
        case "$f" in *openapi*) atype=OPENAPI ;; *) atype=ASYNCAPI ;; esac
        echo "[publish] artifactId=$aid type=$atype  <- $f"
        code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
          "$REGISTRY_V3/groups/default/artifacts?ifExists=CREATE_VERSION" \
          -H 'Content-Type: application/create.extended+json' \
          -H "X-Registry-ArtifactId: $aid" \
          -H "X-Registry-ArtifactType: $atype" \
          --data-binary "@$f")
        echo "  http=$code"; [ "$code" -lt 300 ] || { cat /tmp/out; exit 1; }
        published=$((published+1))
      done

      if [ "$published" -eq 0 ]; then
        echo "[publish] contracts/ 가 비어 있다 — 게시할 것이 없다."
        echo "[publish] 계약이 들어오면 이 잡이 레지스트리에 반영한다."
      else
        echo "[publish] $published 건 게시 완료"
      fi
  rules:
    - if: '$CI_COMMIT_BRANCH == "v2"'
      changes:
        - contracts/**/*

deploy-prod:
  stage: deploy
  image: argoproj/argocd:latest
  script:
    - argocd login "${ARGOCD_SERVER}" --username admin
        --password "${ARGOCD_PASSWORD}" --insecure
    - argocd app sync oneinchmarket-prod --prune --timeout 300
    - argocd app wait oneinchmarket-prod --timeout 600
  environment:
    name: prod
  rules:
    - if: $CI_COMMIT_BRANCH == "v2"
      changes:
        - kubernetes/**/*
  when: manual
