apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: keycloak
spec:
# whenDeleted를 Delete로 설정하면 pod가 지워지면 pvc도 같이 지워지도록 할 수 있다. 
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
  serviceName: keycloak-headless
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      setHostnameAsFQDN: true
      containers:
        - name: keycloak
          image: keycloak/keycloak:latest
          command:
            - bash
            - -lc
            - |
              /opt/keycloak/bin/kc.sh show-config
              /opt/keycloak/bin/kc.sh start --https-certificate-file=/opt/keycloak/tls/tls.crt --https-certificate-key-file=/opt/keycloak/tls/tls.key
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 8443
              protocol: TCP
          env:
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: keycloak-configmap
                  key: admin_password
            - name: KC_DB
              value: "postgres"
            - name: KC_DB_URL
              value: "jdbc:postgresql://postgresql-0.postgresql-headless.dev.svc.cluster.local:5432/keycloak"
            - name: KEYCLOAK_DATABASE_USER
              value: "keycloak"
            - name: KC_DB_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: keycloak-configmap
                  key: keycloakdb_password
            - name: KC_DB_SCHEMA
              value: "keycloak"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HOSTNAME_STRICT_HTTPS
              value: "false"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "admin"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: keycloak-configmap
                  key: admin_password
            - name: KC_CACHE
              value: "ispn"
            - name: KC_CACHE_CONFIG_FILE
              value: "cache-ispn.xml"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/"
          volumeMounts:
            - name: pvc
              mountPath: /bitnami
              subPath: bitnami
            - name: tls
              mountPath: /opt/keycloak/tls
              readOnly: true
            - name: keycloak-store
              mountPath: /opt/keycloak/truststores
              readOnly: true
      volumes:
        - name: keycloak-config
          configMap:
            name: keycloak-configmap
            items: 
              - key: run.sh
                path: run.sh
                mode: 0755
        - name: tls
          secret:
            secretName: tls
        - name: keycloak-store
          secret:
            secretName: keycloak-store
  volumeClaimTemplates:
    - metadata:
        name: pvc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 20Gi  