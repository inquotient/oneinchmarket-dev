# OpenReplay — 이 클러스터의 기존 저장소로 배선한다.
# 차트가 패키징한 postgresql·redis·kafka·minio·clickhouse 는 쓰지 않는다.
#
# ★ 반드시 `global:` 아래에 써야 한다.
#   vars.yaml 이 YAML 앵커(&postgres 등)로 최상위 블록을 정의하고 global 이
#   별칭(*postgres)으로 참조한다. 최상위 키만 덮으면 **서브차트가 읽는
#   global.* 는 그대로**여서 아무것도 바뀌지 않는다 — 실제로 그랬다.
#   특히 initContainer 는 호스트명을 셸 스크립트에 갖고 있어 파드 env 를
#   후처리해도 고쳐지지 않는다. 템플릿 입력을 바꿔야 한다.
global:
  domainName: "openreplay.local"
  postgresql:
    postgresqlHost: "openreplay-postgresql.local.svc.cluster.local"
    postgresqlPort: "5432"
    postgresqlUser: "openreplay"
    postgresqlDatabase: "openreplay"
  redis:
    enabled: true
    redisHost: "redis-headless.local.svc.cluster.local"
    redisPort: "6379"
  clickhouse:
    enabled: true
    chHost: "clickhouse-headless.local.svc.cluster.local"
    username: "openreplay"
    database: "openreplay"
    use_tls: false
    service:
      webPort: 8123
      dataPort: 9000
  kafka:
    kafkaHost: "kafka-headless.local.svc.cluster.local"
    kafkaPort: "9092"
    kafkaUseSsl: "false"
  s3:
    endpoint: "http://minio-headless.local.svc.cluster.local:9000"
    region: "us-east-1"

# ★ 인그레스 컨트롤러는 이 차트로 들이지 않는다.
#   플랫폼 계층 구성요소를 애플리케이션 차트에 묶으면 소유권이 흐려진다.
#   외부 진입점(배포 블로커 #6) 도입은 ADR-069 의 순서 1이며 별도 결정이다.
#   결과적으로 Ingress 12개는 **컨트롤러가 없어 비활성**이다 — 의도된 상태다.
ingress-nginx:
  enabled: false

# 차트가 패키징한 저장소는 전부 끈다.
postgresql:
  enabled: false
redis:
  enabled: false
clickhouse:
  enabled: false
minio:
  enabled: false
kafka:
  enabled: false
