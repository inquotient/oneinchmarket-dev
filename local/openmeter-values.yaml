# OpenMeter — API 과금 계량 백엔드 (ADR-072 ⓑ · ADR-073)
#
# ★★ 번들 인프라를 전부 끈다. 차트는 Kafka·PostgreSQL·Redis·ClickHouse·Svix 를
#   자기 것으로 세우는데, **차트 문서 스스로 "Not recommended for production"**
#   이라고 적어 둔 개발 편의용이다. 이 클러스터에는 넷이 이미 있다.
#   끄면 워크로드가 11개에서 8개(Deployment 5 + CronJob 3)로 줄고
#   렌더가 3,666줄에서 583줄이 된다(§8-56·§8-57).
kafka:
  enabled: false
postgresql:
  enabled: false
redis:
  enabled: false
clickhouse:
  enabled: false
  operator:
    install: false
# Svix 는 웹훅 서버다. 알림 발송이 요건이 아니므로 끈다 — Deployment 하나가
# 더 줄고 PostgreSQL·Redis 의존도 함께 사라진다(그 둘은 Svix 만 쓴다).
svix:
  enabled: false

fullnameOverride: openmeter

# ★ 차트가 requests·limits 를 하나도 선언하지 않는다(`resources: {}`).
#   노드 메모리 requests 가 이미 91% 라 limits 없는 파드를 올릴 수 없다.
#   OpenReplay 와 같은 이유로 여기서 주입한다.
resources:
  requests:
    cpu: 50m
    memory: 192Mi
  limits:
    cpu: 500m
    memory: 512Mi

config:
  aggregation:
    clickhouse:
      # ★ ADR-070 개정 — 기존 인스턴스를 공유한다. 두 번째 ClickHouse 를
      #   세우지 않는다. 데이터베이스는 나눠 용도 분리를 데이터 계층에서도
      #   보이게 한다(openreplay · product_analytics 와 나란히).
      address: clickhouse-headless:9000
      database: openmeter
      # ★ 전용 사용자. ClickHouse 의 `default` 는 **이 인스턴스에 존재하지 않는다**
      #   (system.users 에 openreplay 뿐이었다). 로컬 clickhouse-client 가
      #   자격 없이 붙는 것에 속기 쉽다 — 원격 접속은 실제 사용자가 필요하다.
      #   권한은 openmeter.* 로만 준다(§8-58).
      username: openmeter
      # ★ 기동 시 initContainer 가 Secret 에서 치환한다. 차트에 extraEnv 도
      #   secret 마운트도 없고 환경변수 오버라이드도 먹지 않아(4가지 표기법
      #   실측) 설정 파일이 유일한 경로다. 평문을 ConfigMap 에 두지 않기 위해
      #   ranger-usersync 와 같은 템플릿+치환 방식을 쓴다.
      password: __CLICKHOUSE_PASSWORD__
  ingest:
    kafka:
      # ★ ingest 와 sink 는 **키가 다르다.** ingest.kafka.broker(단수)는
      #   수집 측이고, sink.kafka.brokers(복수)는 소비 측이다.
      #   sink 를 빠뜨리면 기본값 127.0.0.1:29092 로 붙어 CrashLoop 한다 —
      #   오류는 sink-worker 로그에만 나온다(§8-58).
      broker: kafka-headless:9092
  # ★★ 중복 제거. 과금 정확성의 핵심이다 — Kafka 는 at-least-once 라 같은
  #   이벤트가 반드시 두 번 이상 오고, 제거하지 않으면 **고객에게 과다
  #   청구한다**(계약의 멱등성 규정, CLAUDE.md Gotcha 16).
  #   창을 32일로 둔다: 월 단위 청구 주기보다 길어야 주기 경계에서 온
  #   재전송을 잡는다.
  dedupe:
    enabled: true
    driver: redis
    config:
      address: redis-headless:6379
      # ★ Redis 에 비밀번호가 걸려 있다. 없으면 수집 API 가 500 을 내며
      #   `NOAUTH Authentication required` 로 실패한다 — 중복 제거 단계라
      #   이벤트가 아예 들어가지 못한다(§8-58).
      password: __REDIS_PASSWORD__
      database: 0
      expiration: 768h

  # ★ OpenMeter 본체의 메타데이터 저장소. ClickHouse 는 집계용이고, 요금제·
  #   구독·인보이스 같은 엔터티는 PostgreSQL 에 있다.
  #   §8-56 에서 "postgres/redis 참조는 전부 Svix" 로 읽었는데 **틀렸다** —
  #   렌더된 매니페스트 텍스트만 본 것이고 런타임 요구는 별개였다.
  #   Svix 를 꺼도 PostgreSQL 은 필요하다(§8-58).
  #
  #   전용 롤·DB 를 쓴다. 비밀번호는 ClickHouse 와 같은 방식으로 기동 시
  #   치환한다.
  postgres:
    url: postgres://openmeter:__POSTGRES_PASSWORD__@postgresql-headless:5432/openmeter?sslmode=disable
    autoMigrate: migration

  # ★ 미터 정의 — 계약(contracts/schemas/api-usage-event.json)과 짝을 맞춘다.
  #   `type` 은 이벤트의 CloudEvents type 이고, valueProperty·groupBy 는
  #   data 하위 필드를 가리킨다.
  #
  #   ★ status 를 groupBy 에 둔다. 5xx(우리 잘못)를 청구에서 제외하려면
  #     미터가 그것을 구분할 수 있어야 한다 — 계약이 "이벤트는 결과와 무관하게
  #     전부 내고 미터가 골라 쓴다" 고 규정한 이유다.
  meters:
    - slug: api_requests_total
      description: "API 호출 수 (과금 기준)"
      eventType: io.oneinchmarket.api.request.v1
      aggregation: COUNT
      groupBy:
        route: $.data.route
        method: $.data.method
        status: $.data.status
    - slug: api_response_bytes
      description: "응답 바이트 (대역 과금용)"
      eventType: io.oneinchmarket.api.request.v1
      aggregation: SUM
      valueProperty: $.data.response_bytes
      groupBy:
        route: $.data.route

  # ★ 소비 측. ingest 와 별도 키다(위 주석 참조).
  sink:
    kafka:
      brokers: kafka-headless:9092
