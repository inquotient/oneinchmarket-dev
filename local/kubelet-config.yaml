# → /etc/rancher/k3s/kubelet-config.yaml
#
# 왜 전부 여기 있는가 —
#   memorySwap.swapBehavior 와 memoryThrottlingFactor 는 대응하는 CLI 플래그가
#   아예 없다. kubelet 이 `unknown flag` 로 기동을 거부한다.
#   나머지도 KubeletConfiguration 필드로 존재하므로 한 곳에 모은다.
#   CLI 에는 --kubelet-arg=config= 하나만 넘긴다.
#
# ★ memorySwap.swapBehavior
#   k8s 1.30+ 기본값이 NoSwap 이다. 명시하지 않으면 노드에 zram 이 32G 있어도
#   kubelet 이 컨테이너 cgroup 에 memory.swap.max=0 을 걸어 파드가 못 쓴다.
#   LimitedSwap 은 Burstable QoS 에만 스왑을 준다.
#   Guaranteed(requests == limits, cpu·memory 둘 다)는 0 을 받는다.
#   → overlays/local/patches/qos-guaranteed.yaml 이 이 성질을 스위치로 쓴다.
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration

failSwapOn: false
featureGates:
  NodeSwap: true

memorySwap:
  swapBehavior: LimitedSwap

# memory.high 를 limit 의 80% 로 → OOMKill 전에 회수가 먼저 돌아
# 페이지가 zram 으로 흘러간다.
memoryThrottlingFactor: 0.8

# ★ CPU 예약을 250m 로 낮춘다 (2026-09-01)
#   1단계 완료 시점 CPU requests 가 68%(13/19)였다. 남은 단계의
#   ~130종은 메모리가 아니라 CPU requests 에서 먼저 스케줄이 막힌다.
#   WSL2 는 호스트 커널을 공유해 시스템 데몬이 적다. 500m x 2 는 과다다.
#   메모리 예약은 그대로 둔다 — 이쪽은 OOM 과 직결된다.
systemReserved:
  cpu: "250m"
  memory: "1Gi"
kubeReserved:
  cpu: "250m"
  memory: "1Gi"

evictionHard:
  memory.available: "300Mi"
