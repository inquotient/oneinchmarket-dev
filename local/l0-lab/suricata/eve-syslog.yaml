%YAML 1.1
---
# OPNsense 가 만드는 suricata.yaml 의 outputs 를 통째로 대체한다.
#
#   생성된 설정에는 eve-log 출력이 둘 있다:
#     1) 파일(eve.json)  : alert·anomaly·http·tls·drop·ssh
#     2) syslog          : alert 만
#   Logstash 로 가는 것은 2)뿐이라, GUI 에서 EVE http/tls 를 켜도
#   프로토콜 로그는 방화벽 밖으로 나가지 않는다. GUI 에는 syslog 쪽
#   types 를 바꾸는 항목이 없다.
#
#   include 는 리스트를 병합하지 않고 대체한다. 그래서 일부만 적을 수
#   없고 outputs 전체를 여기에 옮겨야 한다. OPNsense 버전을 올리면
#   원본이 바뀔 수 있으므로 그때 이 파일을 다시 맞춰야 한다.
#
#   %YAML 1.1 과 --- 로 시작하지 않으면 Suricata 가 include 를 거부하고
#   기동하지 않는다. installed_rules.yaml 과 같은 제약이다.
#
#   되돌리기: 이 파일을 지우고 configctl ids restart
outputs:
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      pcap-file: false
      community-id: false
      community-id-seed: 0

      types:
        - alert:
             payload: yes
             payload-buffer-size: 100kb
             payload-printable: yes
             tagged-packets: yes
        - anomaly:
            enabled: yes

        - http:
            extended: yes
        - tls:
            extended: yes
            session-resumption: no
            ja4: on

        - drop:
            alerts: yes
            flows: start

        - ssh

  - eve-log:
      enabled: yes
      type: syslog
      identity: "suricata"
      facility: local5
      level: Info
      community-id: true
      community-id-seed: 0
      xff:
        enabled: yes
        mode: extra-data
        deployment: reverse
        header: X-Forwarded-For
      types:
        - alert:
             payload: no
             payload-buffer-size: 4kb
             payload-printable: yes
             metadata: yes
             tagged-packets: yes
        - http:
            extended: yes
        - tls:
            extended: yes
            session-resumption: no
        - dns
        - ssh
        - flow
  - stats:
      enabled: yes
      filename: stats.log
      append: yes
      totals: yes
      threads: no

  - syslog:
      enabled: no
      facility: local5
      level: Notice

