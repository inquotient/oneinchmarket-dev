# → /etc/sysctl.d/99-k3s-zram.conf

# zram 은 스왑아웃 비용이 디스크의 1/50 이다. 기본 60 으로는
# 커널이 스왑을 너무 아껴 페이지 캐시를 먼저 버린다.
vm.swappiness = 150

# ★ zram 은 순차 읽기 이점이 없다. 기본 3 은 폴트마다 8 페이지를 읽어
#   대부분을 낭비한다. 0 = 1 페이지씩.
vm.page-cluster = 0

# 회수를 조금 일찍 시작해 OOMKill 대신 스왑으로 흘린다.
vm.watermark_scale_factor = 125

# PostgreSQL·MongoDB·Redis 권장. always 는 지연 스파이크를 만든다.
# (커널에 CONFIG_TRANSPARENT_HUGEPAGE_MADVISE=y 확인됨)
vm.overcommit_memory = 0
