apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: apicurio-registry-ui
spec:
# whenDeleted를 Delete로 설정하면 pod가 지워지면 pvc도 같이 지워지도록 할 수 있다. 
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Delete
  serviceName: ar-headless
  replicas: 1
  selector:
    matchLabels:
      app: apicurio-registry-ui
  template:
    metadata:
      labels:
        app: apicurio-registry-ui
    spec:
      setHostnameAsFQDN: true
      containers:
      - name: apicurio-registry-ui
        image: apicurio/apicurio-registry-ui:latest
        ports:
        - containerPort: 8080
          protocol: TCP
        - containerPort: 8443
          protocol: TCP
        env:
        - name: APICURIO_STORAGE_KIND
          value: "sql"
        - name: APICURIO_STORAGE_SQL_KIND
          value: "postgresql"
        - name: APICURIO_DATASOURCE_URL
          value: "jdbc:postgresql://postgresql-0.postgresql-headless.dev.svc.cluster.local:5432/apicurio_registry"
        - name: APICURIO_DATASOURCE_USERNAME
          value: "apicurio_registry"
        - name: APICURIO_DATASOURCE_PASSWORD
          valueFrom:
            configMapKeyRef:
              name: apicurio-registry-ui-configmap
              key: apicurio_registry_db_password
        - name: REGISTRY_API_URL
          value: "http://localhost:58080/apis/registry/v3"
#        volumeMounts:
