#          mountPath: /etc/maysql/mariadb.cnf
#          subPath: my.cnf
#        - name: apicurio-registry-ui-tde-volume
#          mountPath: /mnt/tde
#        - name: pvc
#          mountPath: /bitnami/mariadb/data
#          subPath: data
#        - name: pvc
#          mountPath: /opt/bitnami/mariadb/tmp
#          subPath: tmp
#        - name: pvc
#          mountPath: /opt/bitnami/mariadb/logs
#          subPath: logs
#      volumes:
#        - name: mariadb-config
#          configMap:
#            name: apicurio-registry-ui-configmap
#            items:
#              - key: mariadb-config
#                path: my.cnf
#        - name: apicurio-registry-ui-tde-volume
#          hostPath:
#            path: /home/ahnjisoo/mariadb/cmmn/tde
  volumeClaimTemplates:
    - metadata:
        name: pvc
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: standard
        resources:
          requests:
            storage: 20Gi